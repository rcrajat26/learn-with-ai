<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The hook lifecycle across one session, on a time axis, with events firing left to right in order: SessionStart and Setup, InstructionsLoaded, UserPromptSubmit and UserPromptExpansion, PreToolUse, PostToolUse, PostToolUseFailure and PostToolBatch, PermissionRequest and PermissionDenied, SubagentStart and SubagentStop, PreCompact and PostCompact, Stop and StopFailure, SessionEnd. Each mark is labelled with whether it can block: PreToolUse, PermissionRequest, and Stop can block; the rest are notify-only and cannot block.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .axis  { stroke: #475569; stroke-width: 1.6; }
    .tickB { stroke: #b91c1c; stroke-width: 2.4; }
    .tickN { stroke: #9ca3af; stroke-width: 2; }
    .boxB  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxN  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">HOOK LIFECYCLE ACROSS ONE SESSION</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- time axis -->
  <line class="axis" x1="40" y1="320" x2="1000" y2="320" marker-end="url(#tri)"/>
  <text x="1000" y="342" text-anchor="end" class="lbl sub">time &#8594;</text>

  <!-- 10 event groups spread along axis, alternating above/below to avoid overlap -->
  <!-- x positions -->
  <!-- 1 SessionStart/Setup -->
  <line class="tickN" x1="70" y1="320" x2="70" y2="280"/>
  <rect x="20" y="200" width="140" height="78" rx="6" class="boxN"/>
  <text x="90" y="220" text-anchor="middle" class="lbl tiny" style="font-weight:700">SessionStart</text>
  <text x="90" y="236" text-anchor="middle" class="lbl tiny" style="font-weight:700">Setup</text>
  <text x="90" y="256" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="90" y="270" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 2 InstructionsLoaded -->
  <line class="tickN" x1="170" y1="320" x2="170" y2="360"/>
  <rect x="102" y="366" width="136" height="60" rx="6" class="boxN"/>
  <text x="170" y="388" text-anchor="middle" class="lbl tiny" style="font-weight:700">InstructionsLoaded</text>
  <text x="170" y="406" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="170" y="420" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 3 UserPromptSubmit / UserPromptExpansion -->
  <line class="tickN" x1="280" y1="320" x2="280" y2="280"/>
  <rect x="212" y="196" width="140" height="82" rx="6" class="boxN"/>
  <text x="282" y="216" text-anchor="middle" class="lbl tiny" style="font-weight:700">UserPromptSubmit</text>
  <text x="282" y="232" text-anchor="middle" class="lbl tiny" style="font-weight:700">UserPromptExpansion</text>
  <text x="282" y="252" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="282" y="266" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 4 PreToolUse -->
  <line class="tickB" x1="390" y1="320" x2="390" y2="360"/>
  <rect x="322" y="366" width="136" height="60" rx="6" class="boxB"/>
  <text x="390" y="390" text-anchor="middle" class="lbl tiny" style="font-weight:700">PreToolUse</text>
  <text x="390" y="408" text-anchor="middle" class="lbl tiny" style="font-weight:700">CAN BLOCK</text>
  <text x="390" y="420" text-anchor="middle" class="lbl sub">can deny the tool call</text>

  <!-- 5 PostToolUse / PostToolUseFailure / PostToolBatch -->
  <line class="tickN" x1="500" y1="320" x2="500" y2="280"/>
  <rect x="424" y="180" width="152" height="98" rx="6" class="boxN"/>
  <text x="500" y="200" text-anchor="middle" class="lbl tiny" style="font-weight:700">PostToolUse</text>
  <text x="500" y="216" text-anchor="middle" class="lbl tiny" style="font-weight:700">PostToolUseFailure</text>
  <text x="500" y="232" text-anchor="middle" class="lbl tiny" style="font-weight:700">PostToolBatch</text>
  <text x="500" y="252" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="500" y="266" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 6 PermissionRequest / PermissionDenied -->
  <line class="tickB" x1="600" y1="320" x2="600" y2="360"/>
  <rect x="530" y="366" width="140" height="76" rx="6" class="boxB"/>
  <text x="600" y="386" text-anchor="middle" class="lbl tiny" style="font-weight:700">PermissionRequest</text>
  <text x="600" y="402" text-anchor="middle" class="lbl tiny" style="font-weight:700">PermissionDenied</text>
  <text x="600" y="420" text-anchor="middle" class="lbl tiny" style="font-weight:700">CAN BLOCK</text>
  <text x="600" y="434" text-anchor="middle" class="lbl sub">gates the call</text>

  <!-- 7 SubagentStart / SubagentStop -->
  <line class="tickN" x1="700" y1="320" x2="700" y2="280"/>
  <rect x="632" y="196" width="140" height="82" rx="6" class="boxN"/>
  <text x="702" y="220" text-anchor="middle" class="lbl tiny" style="font-weight:700">SubagentStart</text>
  <text x="702" y="236" text-anchor="middle" class="lbl tiny" style="font-weight:700">SubagentStop</text>
  <text x="702" y="256" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="702" y="270" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 8 PreCompact / PostCompact -->
  <line class="tickN" x1="800" y1="320" x2="800" y2="360"/>
  <rect x="732" y="366" width="140" height="72" rx="6" class="boxN"/>
  <text x="802" y="388" text-anchor="middle" class="lbl tiny" style="font-weight:700">PreCompact</text>
  <text x="802" y="404" text-anchor="middle" class="lbl tiny" style="font-weight:700">PostCompact</text>
  <text x="802" y="422" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="802" y="432" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- 9 Stop / StopFailure -->
  <line class="tickB" x1="900" y1="320" x2="900" y2="280"/>
  <rect x="832" y="196" width="136" height="82" rx="6" class="boxB"/>
  <text x="900" y="218" text-anchor="middle" class="lbl tiny" style="font-weight:700">Stop</text>
  <text x="900" y="234" text-anchor="middle" class="lbl tiny" style="font-weight:700">StopFailure</text>
  <text x="900" y="254" text-anchor="middle" class="lbl tiny" style="font-weight:700">CAN BLOCK</text>
  <text x="900" y="268" text-anchor="middle" class="lbl sub">can force another turn</text>

  <!-- 10 SessionEnd -->
  <line class="tickN" x1="970" y1="320" x2="970" y2="360"/>
  <rect x="900" y="366" width="120" height="60" rx="6" class="boxN"/>
  <text x="960" y="388" text-anchor="middle" class="lbl tiny" style="font-weight:700">SessionEnd</text>
  <text x="960" y="406" text-anchor="middle" class="lbl tiny">cannot block</text>
  <text x="960" y="420" text-anchor="middle" class="lbl sub">notify-only</text>

  <!-- annotation -->
  <rect x="60" y="460" width="920" height="90" rx="6" class="boxAnn"/>
  <text x="76" y="482" class="lbl tiny" style="font-weight:700">reading order left to right</text>
  <text x="76" y="502" class="lbl tiny">SessionStart/Setup &#8594; InstructionsLoaded &#8594; UserPromptSubmit/UserPromptExpansion &#8594; PreToolUse &#8594; PostToolUse/PostToolUseFailure/PostToolBatch &#8594;</text>
  <text x="76" y="518" class="lbl tiny">PermissionRequest/PermissionDenied &#8594; SubagentStart/SubagentStop &#8594; PreCompact/PostCompact &#8594; Stop/StopFailure &#8594; SessionEnd</text>
  <text x="76" y="538" class="lbl tiny" style="font-weight:700">only PreToolUse, PermissionRequest/PermissionDenied, and Stop/StopFailure can block the session; every other event is notify-only</text>

  <!-- legend -->
  <line x1="20" y1="570" x2="1020" y2="570" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="586" width="20" height="14" rx="2" class="boxB"/>
  <text x="46" y="597" class="lbl tiny">event can block the session (deny / gate / force another turn)</text>
  <rect x="440" y="586" width="20" height="14" rx="2" class="boxN"/>
  <text x="466" y="597" class="lbl tiny">event cannot block — notify-only</text>
  <rect x="720" y="586" width="20" height="14" rx="2" class="boxAnn"/>
  <text x="746" y="597" class="lbl tiny">annotation panel — order &amp; blocking summary</text>
</svg>
