<svg viewBox="0 0 900 570" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 4 of the SessionStart reindex pile-up. Starting a new session to fix the unusable machine is itself the trigger for the next pile-up, because that recovery session's own SessionStart hook runs the same unguarded delta-reindex decision, closing a loop. An annotation panel states the law: anything expensive or stateful in a SessionStart hook needs a lock, or it must not be there at all.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxHi   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxBad  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxAnn  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .badf  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-linejoin: round; marker-end: url(#trir); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="trir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="570" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 4 OF 4 &#8212; THE FIX SESSION RETRIGGERS THE PILE-UP</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="66" width="820" height="70" rx="6" class="boxBad"/>
  <text x="450" y="90" text-anchor="middle" class="lbl node">machine is unusable</text>
  <text x="450" y="110" text-anchor="middle" class="lbl sub">operator starts a new session to investigate and fix it</text>

  <path class="flow" d="M 450 136 V 166"/>
  <rect x="270" y="166" width="360" height="60" rx="6" class="boxP"/>
  <text x="450" y="190" text-anchor="middle" class="lbl node">recovery session starts</text>
  <text x="450" y="208" text-anchor="middle" class="lbl sub">same code path as frames 1 &#8211; 2</text>

  <path class="flow" d="M 450 226 V 256"/>
  <rect x="270" y="256" width="360" height="60" rx="6" class="boxHi"/>
  <text x="450" y="280" text-anchor="middle" class="lbl node">its SessionStart hook runs</text>
  <text x="450" y="298" text-anchor="middle" class="lbl sub">decides: reindex due &#8212; unlocked, as always</text>

  <path class="badf" d="M 630 286 H 760 V 101 H 820 V 66"/>
  <text x="770" y="180" class="lbl tiny" transform="rotate(-90 770 180)">closes the loop back to frame 1</text>

  <rect x="40" y="336" width="820" height="130" rx="8" class="boxAnn"/>
  <text x="56" y="360" class="lbl node">THE LAW</text>
  <line x1="56" y1="370" x2="844" y2="370" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="392" class="lbl tiny">anything expensive or stateful in a SessionStart hook needs a lock, or it must not be there at all.</text>
  <text x="56" y="412" class="lbl tiny">a delta-reindex spawning clones and embedder processes is exactly that kind of work &#8212; and this hook</text>
  <text x="56" y="432" class="lbl tiny">had no cross-session lock, so every concurrent session, including the one meant to fix the damage,</text>
  <text x="56" y="452" class="lbl tiny">re-triggered the same unbounded pile-up.</text>

  <line x1="20" y1="486" x2="880" y2="486" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="498" width="22" height="16" rx="3" class="boxBad"/>
  <text x="50" y="511" class="lbl tiny">unusable-machine state</text>
  <rect x="240" y="498" width="22" height="16" rx="3" class="boxP"/>
  <text x="270" y="511" class="lbl tiny">session</text>
  <rect x="360" y="498" width="22" height="16" rx="3" class="boxHi"/>
  <text x="390" y="511" class="lbl tiny">SessionStart hook</text>
  <rect x="560" y="498" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="590" y="511" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 700 506 H 740"/>
  <text x="748" y="511" class="lbl tiny">A &#8594; B : A causes B</text>
  <path class="badf" d="M 20 528 H 60"/>
  <text x="68" y="533" class="lbl tiny">A &#8594; B : the loop closes back onto B</text>
</svg>
