<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A before-after comparison answering the same question, where is this method used. Left side, labelled read-and-grep, shows three whole files read plus one repo-wide grep, totalling 18,400 tokens. Right side, labelled LSP symbol lookup, shows one LSP call totalling 900 tokens. An annotation states the ratio as roughly 20 to 1 in favor of the LSP lookup, names the three LSP plugins pyright-lsp, typescript-lsp, and jdtls-lsp, and frames the argument as token cost, not correctness.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">LSP SYMBOL LOOKUP VERSUS READ-AND-GREP</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="300" y="66" text-anchor="middle" class="lbl h2" fill="#4b5563">question: "where is this method used"</text>

  <!-- band headers -->
  <text x="270" y="96" text-anchor="middle" class="lbl h2">READ-AND-GREP</text>
  <text x="830" y="96" text-anchor="middle" class="lbl h2">LSP SYMBOL LOOKUP</text>
  <line x1="560" y1="80" x2="560" y2="560" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left: three file reads -->
  <rect x="60" y="112" width="200" height="52" rx="6" class="boxD"/>
  <text x="160" y="134" text-anchor="middle" class="lbl node">Read file 1 (whole)</text>
  <text x="160" y="150" text-anchor="middle" class="lbl sub">4,100 tokens</text>

  <rect x="290" y="112" width="200" height="52" rx="6" class="boxD"/>
  <text x="390" y="134" text-anchor="middle" class="lbl node">Read file 2 (whole)</text>
  <text x="390" y="150" text-anchor="middle" class="lbl sub">5,300 tokens</text>

  <rect x="60" y="188" width="200" height="52" rx="6" class="boxD"/>
  <text x="160" y="210" text-anchor="middle" class="lbl node">Read file 3 (whole)</text>
  <text x="160" y="226" text-anchor="middle" class="lbl sub">4,700 tokens</text>

  <rect x="290" y="188" width="200" height="52" rx="6" class="boxD"/>
  <text x="390" y="210" text-anchor="middle" class="lbl node">repo-wide grep</text>
  <text x="390" y="226" text-anchor="middle" class="lbl sub">4,300 tokens</text>

  <!-- fan-in bus to totals: each leaf drops into a corridor between the columns, avoiding the box below it -->
  <path d="M 160 164 V 176 H 266 V 264" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 390 164 V 176 H 284 V 264" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 160 240 V 264" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 390 240 V 264" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="160" y1="264" x2="390" y2="264" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 275 264 V 288"/>

  <rect x="130" y="296" width="290" height="66" rx="6" class="boxAnn"/>
  <text x="275" y="318" text-anchor="middle" class="lbl h2">read-and-grep total</text>
  <text x="275" y="338" text-anchor="middle" class="lbl body">4,100 + 5,300 + 4,700 + 4,300</text>
  <text x="275" y="354" text-anchor="middle" class="lbl node" fill="#b91c1c">= 18,400 tokens</text>

  <!-- Right: single LSP lookup -->
  <rect x="700" y="150" width="260" height="90" rx="6" class="boxR"/>
  <text x="830" y="176" text-anchor="middle" class="lbl node">LSP symbol lookup</text>
  <text x="830" y="196" text-anchor="middle" class="lbl body">one call, indexed symbol table</text>
  <text x="830" y="214" text-anchor="middle" class="lbl sub">plugin resolves references directly</text>

  <path class="flow" d="M 830 240 V 296"/>

  <rect x="700" y="296" width="260" height="66" rx="6" class="boxAnn"/>
  <text x="830" y="318" text-anchor="middle" class="lbl h2">LSP lookup total</text>
  <text x="830" y="338" text-anchor="middle" class="lbl node" fill="#15803d">= 900 tokens</text>

  <!-- ratio + plugins annotation panel -->
  <rect x="130" y="392" width="860" height="150" rx="6" class="boxAnn"/>
  <text x="150" y="414" class="lbl h2">RATIO AND PLUGINS</text>
  <text x="150" y="436" class="lbl body">18,400 &#247; 900 &#8776; <tspan font-weight="600">20&#215;</tspan> — read-and-grep costs roughly twenty times what the LSP lookup costs for the same answer.</text>
  <text x="150" y="458" class="lbl body">The three LSP plugins that provide this: <tspan font-weight="600">pyright-lsp</tspan>, <tspan font-weight="600">typescript-lsp</tspan>, <tspan font-weight="600">jdtls-lsp</tspan>.</text>
  <text x="150" y="484" class="lbl body" font-weight="600">The argument is token cost, not correctness.</text>
  <text x="150" y="506" class="lbl sub">Both approaches can find every call site correctly; grep can even find more (e.g. string references).</text>
  <text x="150" y="524" class="lbl sub">The LSP path answers the same "where used" question at a fraction of the context budget.</text>

  <!-- Legend -->
  <line x1="20" y1="558" x2="1100" y2="558" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="574" width="20" height="14" rx="3" class="boxD"/>
  <text x="48" y="586" class="lbl tiny">read-and-grep step</text>
  <rect x="220" y="574" width="20" height="14" rx="3" class="boxR"/>
  <text x="248" y="586" class="lbl tiny">LSP lookup step</text>
  <rect x="400" y="574" width="20" height="14" rx="3" class="boxAnn"/>
  <text x="428" y="586" class="lbl tiny">annotation / totals panel</text>
  <line x1="620" y1="581" x2="642" y2="581" class="flow"/>
  <text x="650" y="586" class="lbl tiny">A &#8594; B : B is computed from A's cost</text>
</svg>
