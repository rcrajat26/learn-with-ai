<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 4: segment two, FOO=1 git commit -m x, has its leading environment assignment FOO=1 stripped before allow rules are checked, so allow rules match git commit -m x. Deny rules are matched past the leading assignment too, so a deny rule for git commit still fires and the FOO=1 prefix cannot be used to smuggle a dangerous command past it.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">D-31c — LEADING ENVIRONMENT ASSIGNMENTS</text>
  <line x1="20" y1="40" x2="940" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="480" y="56" text-anchor="middle" class="lbl sub">segment 2, carried over from D-31a</text>
  <rect x="330" y="60" width="300" height="44" rx="6" class="boxP"/>
  <text x="480" y="87" text-anchor="middle" class="lbl node">FOO=1 git commit -m "x"</text>

  <text x="220" y="122" text-anchor="middle" class="lbl h2">ALLOW RULES</text>
  <text x="740" y="122" text-anchor="middle" class="lbl h2">DENY RULES</text>

  <path class="flow" d="M 400 104 V 130 H 220 V 150"/>
  <path class="flow" d="M 560 104 V 130 H 740 V 150"/>

  <rect x="70" y="150" width="300" height="44" rx="6" class="boxW"/>
  <text x="220" y="177" text-anchor="middle" class="lbl body">strip leading FOO=1</text>

  <rect x="590" y="150" width="300" height="44" rx="6" class="boxW"/>
  <text x="740" y="177" text-anchor="middle" class="lbl body">match past leading FOO=1</text>

  <path class="flow" d="M 220 194 V 216"/>
  <path class="flow" d="M 740 194 V 216"/>

  <rect x="70" y="216" width="300" height="44" rx="6" class="boxR"/>
  <text x="220" y="243" text-anchor="middle" class="lbl node">git commit -m "x"</text>

  <rect x="590" y="216" width="300" height="44" rx="6" class="boxD"/>
  <text x="740" y="243" text-anchor="middle" class="lbl node">git commit -m "x"</text>

  <text x="220" y="278" text-anchor="middle" class="lbl sub">checked against the allow list —</text>
  <text x="220" y="292" text-anchor="middle" class="lbl sub">FOO=1 is not a new command</text>

  <text x="740" y="278" text-anchor="middle" class="lbl sub">checked against the deny list —</text>
  <text x="740" y="292" text-anchor="middle" class="lbl sub">FOO=1 cannot shield a denied command</text>

  <rect x="140" y="320" width="680" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="160" y="344" class="lbl h2">WHY BOTH SIDES SEE THE SAME TARGET STRING</text>
  <text x="160" y="366" class="lbl body">Stripping the assignment before checking allow rules keeps prefixed variants of an</text>
  <text x="160" y="384" class="lbl body">already-allowed command from failing to match; matching past it for deny rules keeps a</text>
  <text x="160" y="399" class="lbl body">variable prefix from being used to evade a denied command.</text>

  <line x1="20" y1="428" x2="940" y2="428" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="436" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="449" class="lbl tiny">shell segment (input to this frame)</text>
  <rect x="320" y="436" width="22" height="16" rx="3" class="boxW"/>
  <text x="350" y="449" class="lbl tiny">process step</text>
  <rect x="20" y="460" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="473" class="lbl tiny">matched target string, allow path</text>
  <rect x="320" y="460" width="22" height="16" rx="3" class="boxD"/>
  <text x="350" y="473" class="lbl tiny">matched target string, deny path</text>
</svg>
