<svg viewBox="0 0 1080 780" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flowchart of a wrapper's failure taxonomy. A subprocess call returns and branches three ways. Launch or timeout failure is an infrastructure problem and is handled by retrying the infrastructure. An unparseable envelope is a contract problem, handled by capturing a 500 character snippet of what was actually printed, labelled with that number. is_error true means the agent itself failed, handled by surfacing the agent's own report. A node on the retry path is labelled keep the last parsed error envelope so cost and token counts survive the failure, annotated with why discarding them makes the run unbillable and unauditable.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxRoot { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxInf  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxContract { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxAgent { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxOk   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .panel   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="780" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">A WRAPPER'S FAILURE TAXONOMY</text>
  <line x1="20" y1="42" x2="1060" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- root -->
  <rect x="420" y="60" width="240" height="56" rx="6" class="boxRoot"/>
  <text x="540" y="84" text-anchor="middle" class="lbl body">subprocess returns</text>
  <text x="540" y="104" text-anchor="middle" class="lbl sub">ClaudeRunner invokes claude -p</text>

  <!-- bus -->
  <path class="flow" d="M 540 116 V 140"/>
  <path d="M 150 140 H 930" fill="none" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 150 140 V 166"/>
  <path class="flow" d="M 540 140 V 166"/>
  <path class="flow" d="M 930 140 V 166"/>

  <!-- branch 1: infra -->
  <rect x="40" y="166" width="220" height="66" rx="6" class="boxInf"/>
  <text x="150" y="188" text-anchor="middle" class="lbl body">launch or timeout failure</text>
  <text x="150" y="206" text-anchor="middle" class="lbl sub">process never produced output</text>
  <text x="150" y="222" text-anchor="middle" class="lbl sub">category: infrastructure</text>

  <path class="flow" d="M 150 232 V 258"/>
  <rect x="40" y="258" width="220" height="54" rx="6" class="boxInf"/>
  <text x="150" y="280" text-anchor="middle" class="lbl body">retry the infrastructure</text>
  <text x="150" y="298" text-anchor="middle" class="lbl sub">relaunch subprocess / bump timeout</text>

  <path class="flow" d="M 150 312 V 338"/>
  <rect x="20" y="338" width="260" height="80" rx="6" class="boxOk"/>
  <text x="150" y="360" text-anchor="middle" class="lbl body" font-weight="700">keep the last parsed</text>
  <text x="150" y="378" text-anchor="middle" class="lbl body" font-weight="700">error envelope</text>
  <text x="150" y="396" text-anchor="middle" class="lbl sub">so cost and token counts</text>
  <text x="150" y="410" text-anchor="middle" class="lbl sub">survive the failure</text>

  <!-- annotation panel for branch 1 -->
  <rect x="20" y="440" width="260" height="90" rx="6" class="panel"/>
  <text x="36" y="460" class="lbl tiny" font-weight="700">why this matters</text>
  <text x="36" y="478" class="lbl tiny">Discarding total_cost_usd and</text>
  <text x="36" y="494" class="lbl tiny">usage on retry makes the run</text>
  <text x="36" y="510" class="lbl tiny">unbillable and unauditable.</text>
  <path class="flow" d="M 150 418 V 440"/>

  <!-- branch 2: contract -->
  <rect x="420" y="166" width="240" height="66" rx="6" class="boxContract"/>
  <text x="540" y="188" text-anchor="middle" class="lbl body">unparseable envelope</text>
  <text x="540" y="206" text-anchor="middle" class="lbl sub">stdout is not valid JSON</text>
  <text x="540" y="222" text-anchor="middle" class="lbl sub">category: contract</text>

  <path class="flow" d="M 540 232 V 258"/>
  <rect x="410" y="258" width="260" height="80" rx="6" class="boxContract"/>
  <text x="540" y="280" text-anchor="middle" class="lbl body" font-weight="700">capture a 500-character</text>
  <text x="540" y="298" text-anchor="middle" class="lbl body" font-weight="700">snippet of stdout</text>
  <text x="540" y="318" text-anchor="middle" class="lbl sub">labelled with the number 500</text>

  <!-- branch 3: agent failed -->
  <rect x="810" y="166" width="240" height="66" rx="6" class="boxAgent"/>
  <text x="930" y="188" text-anchor="middle" class="lbl body">is_error: true</text>
  <text x="930" y="206" text-anchor="middle" class="lbl sub">envelope parsed cleanly</text>
  <text x="930" y="222" text-anchor="middle" class="lbl sub">category: the agent failed</text>

  <path class="flow" d="M 930 232 V 258"/>
  <rect x="800" y="258" width="260" height="66" rx="6" class="boxAgent"/>
  <text x="930" y="280" text-anchor="middle" class="lbl body">surface the agent's own report</text>
  <text x="930" y="298" text-anchor="middle" class="lbl sub">result field carries the agent's</text>
  <text x="930" y="313" text-anchor="middle" class="lbl sub">explanation of what went wrong</text>

  <line x1="20" y1="560" x2="1060" y2="560" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="580" class="lbl h2">LEGEND</text>

  <rect x="20" y="592" width="22" height="16" rx="3" class="boxRoot"/>
  <text x="50" y="605" class="lbl tiny">entry point</text>

  <rect x="160" y="592" width="22" height="16" rx="3" class="boxInf"/>
  <text x="190" y="605" class="lbl tiny">infrastructure failure path</text>

  <rect x="410" y="592" width="22" height="16" rx="3" class="boxContract"/>
  <text x="440" y="605" class="lbl tiny">contract failure path</text>

  <rect x="640" y="592" width="22" height="16" rx="3" class="boxAgent"/>
  <text x="670" y="605" class="lbl tiny">agent-reported failure path</text>

  <rect x="900" y="592" width="22" height="16" rx="3" class="boxOk"/>
  <text x="930" y="605" class="lbl tiny">preserved billing state</text>

  <rect x="20" y="620" width="22" height="16" rx="3" class="panel"/>
  <text x="50" y="633" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 260 628 H 284"/>
  <text x="320" y="633" text-anchor="middle" class="lbl tiny">flow</text>

  <rect x="20" y="654" width="1040" height="106" rx="6" class="panel"/>
  <text x="36" y="676" class="lbl h2">THE THREE CATEGORIES, ONE SENTENCE EACH</text>
  <text x="36" y="698" class="lbl dense">Infrastructure: the process itself did not complete &#8212; retry the process.</text>
  <text x="36" y="716" class="lbl dense">Contract: the process completed but broke the JSON contract &#8212; capture evidence, do not guess.</text>
  <text x="36" y="734" class="lbl dense">Agent: the process completed, the envelope parsed, and the agent itself reports failure &#8212; that is not a wrapper bug.</text>
</svg>
