<svg viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three panels contrasting belief and mechanism for allowed-tools. Left panel, marked false, shows a skill with allowed-tools Bash and Read drawn as a fence around only those two tools with every other tool outside it. Middle panel shows the real mechanism: the same frontmatter pre-approves Bash and Read for the invoking turn only, every other tool is still callable, and the pre-approval clears on the next user message. Right panel shows disallowed-tools as the field that actually removes tools from the set Claude can call.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .fence { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 2 3; }
    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triGr); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">allowed-tools PRE-APPROVES; disallowed-tools RESTRICTS</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Panel 1: false belief -->
  <text x="20" y="70" class="lbl h2">FALSE BELIEF</text>
  <rect x="20" y="80" width="340" height="480" rx="6" class="boxW"/>
  <rect x="40" y="96" width="300" height="30" rx="5" class="boxH"/>
  <text x="190" y="116" text-anchor="middle" class="lbl dense" font-weight="600">allowed-tools: [Bash, Read]</text>

  <rect x="60" y="150" width="260" height="120" rx="6" class="fence"/>
  <text x="190" y="146" text-anchor="middle" class="lbl tiny" fill="#b91c1c" font-weight="700">believed: a hard fence</text>
  <rect x="75" y="168" width="100" height="34" rx="5" class="boxP"/>
  <text x="125" y="189" text-anchor="middle" class="lbl body">Bash</text>
  <rect x="185" y="168" width="100" height="34" rx="5" class="boxP"/>
  <text x="235" y="189" text-anchor="middle" class="lbl body">Read</text>
  <text x="190" y="230" text-anchor="middle" class="lbl tiny">believed: ONLY these two tools</text>
  <text x="190" y="248" text-anchor="middle" class="lbl tiny">are callable for the whole session</text>

  <rect x="55" y="290" width="270" height="150" rx="6" class="boxD"/>
  <text x="190" y="286" text-anchor="middle" class="lbl tiny" fill="#b91c1c" font-weight="700">outside the fence — believed blocked</text>
  <rect x="70" y="308" width="100" height="30" rx="5" class="boxW"/>
  <text x="120" y="327" text-anchor="middle" class="lbl dense">Write</text>
  <rect x="180" y="308" width="100" height="30" rx="5" class="boxW"/>
  <text x="230" y="327" text-anchor="middle" class="lbl dense">Edit</text>
  <rect x="70" y="346" width="100" height="30" rx="5" class="boxW"/>
  <text x="120" y="365" text-anchor="middle" class="lbl dense">WebFetch</text>
  <rect x="180" y="346" width="100" height="30" rx="5" class="boxW"/>
  <text x="230" y="365" text-anchor="middle" class="lbl dense">Grep</text>
  <rect x="70" y="384" width="210" height="30" rx="5" class="boxW"/>
  <text x="175" y="403" text-anchor="middle" class="lbl dense">every other tool</text>

  <rect x="40" y="470" width="300" height="70" rx="6" class="boxD"/>
  <text x="56" y="490" class="lbl tiny" font-weight="700">MARKED FALSE</text>
  <text x="56" y="508" class="lbl tiny">allowed-tools is not a fence around a</text>
  <text x="56" y="524" class="lbl tiny">reduced tool set for the session.</text>

  <!-- Panel 2: mechanism -->
  <text x="390" y="70" class="lbl h2">ACTUAL MECHANISM — allowed-tools</text>
  <rect x="390" y="80" width="360" height="480" rx="6" class="boxP"/>
  <rect x="410" y="96" width="320" height="30" rx="5" class="boxH"/>
  <text x="570" y="116" text-anchor="middle" class="lbl dense" font-weight="600">allowed-tools: [Bash, Read]</text>

  <rect x="410" y="140" width="320" height="60" rx="6" class="boxR"/>
  <text x="570" y="164" text-anchor="middle" class="lbl body" font-weight="600">pre-approved for the invoking turn only</text>
  <text x="570" y="184" text-anchor="middle" class="lbl sub">Bash and Read run without a permission prompt</text>

  <rect x="410" y="212" width="320" height="130" rx="6" class="boxP"/>
  <text x="570" y="208" text-anchor="middle" class="lbl tiny" font-weight="700">still callable this turn (just prompted)</text>
  <rect x="425" y="228" width="90" height="30" rx="5" class="boxW"/>
  <text x="470" y="247" text-anchor="middle" class="lbl dense">Write</text>
  <rect x="525" y="228" width="90" height="30" rx="5" class="boxW"/>
  <text x="570" y="247" text-anchor="middle" class="lbl dense">Edit</text>
  <rect x="625" y="228" width="90" height="30" rx="5" class="boxW"/>
  <text x="670" y="247" text-anchor="middle" class="lbl dense">Grep</text>
  <rect x="425" y="266" width="290" height="30" rx="5" class="boxW"/>
  <text x="570" y="285" text-anchor="middle" class="lbl dense">WebFetch, and every other tool</text>
  <text x="570" y="312" text-anchor="middle" class="lbl tiny">nothing is removed from the tool set —</text>
  <text x="570" y="328" text-anchor="middle" class="lbl tiny">the user is just asked to confirm them</text>

  <rect x="410" y="356" width="320" height="90" rx="6" class="boxA"/>
  <text x="426" y="378" class="lbl tiny" font-weight="700">CLEARS ON NEXT USER MESSAGE</text>
  <text x="426" y="398" class="lbl tiny">the pre-approval is scoped to the single</text>
  <text x="426" y="414" class="lbl tiny">turn that invoked the skill — it does not</text>
  <text x="426" y="430" class="lbl tiny">persist once the user sends another message</text>

  <path class="weak" d="M 570 200 V 212"/>

  <rect x="410" y="470" width="320" height="70" rx="6" class="boxA"/>
  <text x="426" y="490" class="lbl tiny" font-weight="700">MECHANISM</text>
  <text x="426" y="508" class="lbl tiny">allowed-tools = pre-approval scope,</text>
  <text x="426" y="524" class="lbl tiny">not a restriction on what can be called.</text>

  <!-- Panel 3: disallowed-tools -->
  <text x="790" y="70" class="lbl h2">THE FIELD THAT REMOVES TOOLS</text>
  <rect x="790" y="80" width="310" height="480" rx="6" class="boxD"/>
  <rect x="806" y="96" width="278" height="30" rx="5" class="boxH"/>
  <text x="945" y="116" text-anchor="middle" class="lbl dense" font-weight="600">disallowed-tools: [WebFetch]</text>

  <rect x="806" y="140" width="278" height="60" rx="6" class="boxD"/>
  <text x="945" y="164" text-anchor="middle" class="lbl body" font-weight="600">removed from the callable set</text>
  <text x="945" y="184" text-anchor="middle" class="lbl sub">for the duration this frontmatter applies</text>

  <rect x="806" y="212" width="278" height="60" rx="6" class="boxW"/>
  <text x="945" y="236" text-anchor="middle" class="lbl dense">WebFetch</text>
  <text x="945" y="256" text-anchor="middle" class="lbl sub">Claude cannot call this tool at all</text>

  <rect x="806" y="284" width="278" height="60" rx="6" class="boxR"/>
  <text x="945" y="308" text-anchor="middle" class="lbl dense">Bash, Read, Edit, ...</text>
  <text x="945" y="328" text-anchor="middle" class="lbl sub">unaffected — still normally permission-gated</text>

  <rect x="806" y="360" width="278" height="150" rx="6" class="boxA"/>
  <text x="822" y="382" class="lbl tiny" font-weight="700">disallowed-tools vs allowed-tools</text>
  <text x="822" y="404" class="lbl tiny">allowed-tools: grants pre-approval,</text>
  <text x="822" y="420" class="lbl tiny">the full tool set stays reachable.</text>
  <text x="822" y="440" class="lbl tiny">disallowed-tools: actually shrinks the</text>
  <text x="822" y="456" class="lbl tiny">tool set — this is the real restriction</text>
  <text x="822" y="472" class="lbl tiny">mechanism, not allowed-tools.</text>
  <text x="822" y="494" class="lbl tiny">The two are opposite operations.</text>

  <line x1="20" y1="576" x2="1100" y2="576" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="598" class="lbl h2">LEGEND</text>

  <rect x="150" y="586" width="22" height="16" rx="3" class="boxH"/>
  <text x="180" y="599" class="lbl tiny">frontmatter field being examined</text>

  <rect x="520" y="586" width="22" height="16" rx="3" class="boxR"/>
  <text x="550" y="599" class="lbl tiny">still callable / pre-approved / unaffected</text>

  <rect x="150" y="612" width="22" height="16" rx="3" class="boxW"/>
  <text x="180" y="625" class="lbl tiny">callable but permission-gated</text>

  <rect x="520" y="612" width="22" height="16" rx="3" class="boxD"/>
  <text x="550" y="625" class="lbl tiny">not callable / false belief / removed</text>
</svg>
