<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 5 in the CLAUDE.md load order. The project-level file, either ./CLAUDE.md or ./.claude/CLAUDE.md, is appended third, and the untracked ./CLAUDE.local.md is appended fourth, after it at that same level.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; }

    .boxRoot { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxOk   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxAnn  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .stack   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }
    .boxWeak { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">CLAUDE.md LOAD ORDER — FRAME 3 OF 5</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="62" class="lbl h2">Step 3 and 4: project file, then the untracked local override, both at repo root</text>

  <rect x="60" y="86" width="920" height="34" rx="6" class="stack"/>
  <text x="80" y="108" class="lbl body">1. managed policy CLAUDE.md</text>

  <rect x="60" y="126" width="920" height="34" rx="6" class="stack"/>
  <text x="80" y="148" class="lbl body">2. ~/.claude/CLAUDE.md</text>

  <path class="flow" d="M 520 160 V 186"/>
  <rect x="60" y="186" width="920" height="40" rx="6" class="boxRoot"/>
  <text x="80" y="211" class="lbl node">3. ./CLAUDE.md  or  ./.claude/CLAUDE.md</text>
  <text x="620" y="211" class="lbl sub">project-level, checked into the repo</text>

  <path class="flow" d="M 520 226 V 256"/>
  <rect x="60" y="256" width="920" height="40" rx="6" class="boxWeak"/>
  <text x="80" y="281" class="lbl node">4. ./CLAUDE.local.md</text>
  <text x="500" y="281" class="lbl sub">untracked, gitignored, per-developer overrides at repo root</text>

  <path class="flow" d="M 520 296 V 326"/>
  <rect x="380" y="326" width="280" height="60" rx="6" class="boxOk"/>
  <text x="520" y="352" text-anchor="middle" class="lbl node">assembled block</text>
  <text x="520" y="372" text-anchor="middle" class="lbl sub">1 → 2 → 3 → 4, all four appended in order</text>

  <line x1="20" y1="404" x2="1020" y2="404" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="414" width="1000" height="36" rx="6" class="boxAnn"/>
  <text x="36" y="437" class="lbl tiny">CLAUDE.local.md is read at the same repo-root level as CLAUDE.md, but is meant for machine-specific notes that should never be committed.</text>
</svg>
