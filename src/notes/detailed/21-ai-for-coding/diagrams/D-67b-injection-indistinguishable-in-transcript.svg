<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 4 in the prompt injection sequence. The data containing the hidden instruction arrives in the transcript as a tool_result message, sitting alongside the user's own message. Both are rendered as plain transcript entries of the same kind, so the model cannot tell by position or format which one is the trusted user and which is untrusted fetched data.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">PROMPT INJECTION &#8212; FRAME 2 OF 4</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="64" class="lbl node">that text arrives in the transcript, indistinguishable in kind from the user's own message</text>

  <!-- transcript column -->
  <rect x="180" y="90" width="540" height="200" rx="6" class="boxP"/>
  <text x="200" y="110" class="lbl node">message array (the transcript)</text>

  <rect x="200" y="122" width="500" height="40" rx="4" class="boxP"/>
  <text x="212" y="146" class="lbl body">role: user &#8212; "summarize this issue"</text>

  <rect x="200" y="170" width="500" height="40" rx="4" class="boxD"/>
  <text x="212" y="194" class="lbl body">role: tool_result &#8212; issue comment text,</text>
  <text x="490" y="194" class="lbl tiny" font-weight="700"> incl. hidden instruction</text>

  <rect x="200" y="218" width="500" height="40" rx="4" class="boxP"/>
  <text x="212" y="242" class="lbl body">role: assistant &#8212; reads all prior entries next</text>

  <rect x="60" y="300" width="780" height="30" rx="6" class="boxA"/>
  <text x="76" y="319" class="lbl tiny" font-weight="700">The problem: both entries are plain transcript text of the same shape; nothing marks one trusted, the other fetched data.</text>

  <line x1="20" y1="340" x2="880" y2="340" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="346" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="359" class="lbl tiny">trusted transcript entry (user, assistant)</text>
  <rect x="360" y="346" width="22" height="16" rx="3" class="boxD"/>
  <text x="390" y="359" class="lbl tiny">untrusted data carrying hidden instruction</text>
  <rect x="700" y="346" width="22" height="16" rx="3" class="boxA"/>
  <text x="730" y="359" class="lbl tiny">annotation</text>
</svg>
