<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three levels of building on Claude, each labelled with what it gives up. The CLI in -p mode gives up in-process control. The Agent SDK in TypeScript or Python gives up nothing of the harness but treats an SDK session as trusted. The raw Messages API with your own loop gives up everything the harness did for you. A Java lane beneath notes there is no first-party Java SDK, so Java reaches the CLI via ProcessBuilder or the API via HttpClient.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxW  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">D-84 — THREE LEVELS OF BUILDING ON CLAUDE</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="70" class="lbl h2">LEVEL 1 — HIGHEST, MOST HARNESS</text>
  <rect x="20" y="82" width="1000" height="150" rx="6" class="boxP"/>
  <text x="40" y="110" class="lbl node">CLI in -p mode: claude -p</text>
  <text x="40" y="134" class="lbl body">the same binary engineers use interactively — process isolation per invocation</text>
  <text x="40" y="156" class="lbl body">no SDK version coupling: the CLI ships and versions independently of your caller</text>
  <text x="40" y="178" class="lbl body">flags: --output-format json, --max-turns, --setting-sources, --settings</text>
  <text x="40" y="208" class="lbl node" fill="#b91c1c">gives up: in-process control</text>

  <path class="flow" d="M 520 232 V 258"/>

  <text x="20" y="280" class="lbl h2">LEVEL 2 — MIDDLE, PROGRAMMATIC</text>
  <rect x="20" y="292" width="1000" height="170" rx="6" class="boxW"/>
  <text x="40" y="320" class="lbl node">Agent SDK — TypeScript / Python</text>
  <text x="40" y="344" class="lbl body">resolveSettings() composes managedSettings + project + user settings</text>
  <text x="40" y="366" class="lbl body">parentSettingsBehavior controls whether the parent process's settings apply</text>
  <text x="40" y="388" class="lbl body">an SDK session counts as trusted — no interactive permission prompt gate</text>
  <text x="40" y="418" class="lbl node" fill="#b45309">gives up: some of the CLI's process boundary, in exchange for in-process hooks</text>

  <path class="flow" d="M 520 462 V 488"/>

  <text x="20" y="510" class="lbl h2">LEVEL 3 — LOWEST, ROLL YOUR OWN</text>
  <rect x="20" y="522" width="1000" height="180" rx="6" class="boxD"/>
  <text x="40" y="550" class="lbl node">Raw Messages API + your own loop</text>
  <text x="40" y="574" class="lbl body">model, system, messages[], tools[], max_tokens</text>
  <text x="40" y="596" class="lbl body">tool_use / tool_result blocks you dispatch and feed back yourself</text>
  <text x="40" y="618" class="lbl body">cache breakpoints you place and manage by hand</text>
  <text x="40" y="648" class="lbl node" fill="#b91c1c">gives up: everything the harness did for you — permissions, hooks, settings</text>
  <text x="40" y="668" class="lbl node" fill="#b91c1c">precedence, the tool loop itself, session/context management</text>

  <line x1="20" y1="730" x2="1020" y2="730" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="752" class="lbl h2">JAVA LANE — NO FIRST-PARTY JAVA SDK</text>
  <rect x="20" y="764" width="480" height="100" rx="6" class="boxL"/>
  <text x="260" y="790" text-anchor="middle" class="lbl node">HttpClient against the API</text>
  <text x="260" y="812" text-anchor="middle" class="lbl body">java.net.http.HttpClient hits Messages API directly</text>
  <text x="260" y="834" text-anchor="middle" class="lbl sub">reaches Level 3 semantics from Java</text>

  <rect x="540" y="764" width="480" height="100" rx="6" class="boxL"/>
  <text x="780" y="790" text-anchor="middle" class="lbl node">ProcessBuilder around the CLI</text>
  <text x="780" y="812" text-anchor="middle" class="lbl body">java.lang.ProcessBuilder spawns claude -p</text>
  <text x="780" y="834" text-anchor="middle" class="lbl sub">reaches Level 1 semantics from Java</text>

  <line x1="20" y1="866" x2="1020" y2="866" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="874" width="18" height="14" rx="3" class="boxP"/>
  <text x="46" y="886" class="lbl tiny">CLI level</text>
  <rect x="140" y="874" width="18" height="14" rx="3" class="boxW"/>
  <text x="166" y="886" class="lbl tiny">Agent SDK level</text>
  <rect x="310" y="874" width="18" height="14" rx="3" class="boxD"/>
  <text x="336" y="886" class="lbl tiny">raw API level</text>
  <rect x="450" y="874" width="18" height="14" rx="3" class="boxL"/>
  <text x="476" y="886" class="lbl tiny">Java-reachable route (no first-party SDK)</text>
</svg>
