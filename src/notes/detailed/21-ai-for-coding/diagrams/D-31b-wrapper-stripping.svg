<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 4: segment one, timeout 30 mvn -q test, has its leading wrapper timeout stripped to leave mvn -q test for matching. Wrappers stripped are timeout, time, nice, nohup, stdbuf, command, builtin, noglob and bare xargs. command -v and nocorrect are explicitly not stripped. A separate panel lists environment runners that are never stripped: devbox run, npx, docker exec, direnv exec and mise exec.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="760" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">D-31b — WRAPPER STRIPPING</text>
  <line x1="20" y1="40" x2="940" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="480" y="56" text-anchor="middle" class="lbl sub">segment 1, carried over from D-31a</text>
  <rect x="330" y="60" width="300" height="44" rx="6" class="boxP"/>
  <text x="480" y="87" text-anchor="middle" class="lbl node">timeout 30 mvn -q test</text>

  <path class="flow" d="M 480 104 V 126"/>
  <rect x="280" y="126" width="400" height="42" rx="6" class="boxW"/>
  <text x="480" y="152" text-anchor="middle" class="lbl body">strip leading wrapper token(s)</text>

  <path class="flow" d="M 480 168 V 190"/>
  <rect x="330" y="190" width="300" height="64" rx="6" class="boxR"/>
  <text x="480" y="213" text-anchor="middle" class="lbl node">mvn -q test</text>
  <text x="480" y="232" text-anchor="middle" class="lbl sub">the string actually matched against</text>
  <text x="480" y="245" text-anchor="middle" class="lbl sub">allow / ask / deny rules</text>

  <path d="M 480 254 V 270 H 350 M 480 270 H 780" fill="none" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 350 270 V 296"/>
  <path class="flow" d="M 780 270 V 296"/>

  <text x="60" y="286" class="lbl h2">STRIPPED WRAPPERS (9)</text>
  <rect x="60" y="296" width="320" height="212" rx="6" class="boxR"/>
  <text x="80" y="318" class="lbl body">timeout</text>
  <text x="80" y="338" class="lbl body">time</text>
  <text x="80" y="358" class="lbl body">nice</text>
  <text x="80" y="378" class="lbl body">nohup</text>
  <text x="80" y="398" class="lbl body">stdbuf</text>
  <text x="220" y="318" class="lbl body">command</text>
  <text x="220" y="338" class="lbl body">builtin</text>
  <text x="220" y="358" class="lbl body">noglob</text>
  <text x="220" y="378" class="lbl body">xargs (bare, no flags)</text>
  <text x="80" y="480" class="lbl sub">each removed one at a time from the</text>
  <text x="80" y="494" class="lbl sub">front, so a stack of wrappers peels off</text>

  <text x="600" y="286" class="lbl h2">NOT STRIPPED</text>
  <rect x="600" y="296" width="320" height="212" rx="6" class="boxD"/>
  <text x="620" y="322" class="lbl node">command -v</text>
  <text x="620" y="342" class="lbl sub">a lookup, not an execution —</text>
  <text x="620" y="356" class="lbl sub">left intact and matched as itself</text>
  <text x="620" y="392" class="lbl node">nocorrect</text>
  <text x="620" y="412" class="lbl sub">zsh spelling-correction guard —</text>
  <text x="620" y="426" class="lbl sub">left intact and matched as itself</text>

  <rect x="140" y="540" width="680" height="112" rx="6" class="panel"/>
  <text x="160" y="564" class="lbl h2">ENVIRONMENT RUNNERS — NEVER STRIPPED</text>
  <text x="160" y="586" class="lbl body">These execute an arbitrary program of their own choosing, so the runner name</text>
  <text x="160" y="604" class="lbl body">itself is the thing matched, not something to peel away:</text>
  <text x="160" y="630" class="lbl node">devbox run · npx · docker exec · direnv exec · mise exec</text>

  <line x1="20" y1="672" x2="940" y2="672" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="684" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="697" class="lbl tiny">shell segment / process step input</text>
  <rect x="300" y="684" width="22" height="16" rx="3" class="boxR"/>
  <text x="330" y="697" class="lbl tiny">stripped wrapper / resolved command</text>
  <rect x="580" y="684" width="22" height="16" rx="3" class="boxD"/>
  <text x="610" y="697" class="lbl tiny">not stripped — matched as itself</text>
  <rect x="20" y="712" width="22" height="16" rx="3" class="panel"/>
  <text x="50" y="725" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 300 720 H 340"/>
  <text x="350" y="725" class="lbl tiny">A → B : B is produced from A</text>
</svg>
