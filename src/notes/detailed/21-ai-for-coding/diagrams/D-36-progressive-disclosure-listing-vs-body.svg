<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after comparison of progressive disclosure for skills. Left: fifty skills, each present only as a listing entry of description plus when_to_use, truncated at skillListingMaxDescChars of 1536 characters, with a computed total listing token cost. Right: one skill has fired, adding its full SKILL.md body token cost on top of the listing cost already paid. Below both, a counterfactual shows the same fifty procedures written directly into CLAUDE.md, where the full cost is paid on every single turn regardless of whether any procedure is used.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="720" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">D-36 — PROGRESSIVE DISCLOSURE: LISTING VS. FIRED BODY VS. CLAUDE.md</text>
  <line x1="20" y1="40" x2="1060" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="270" y="62" text-anchor="middle" class="lbl h2">BEFORE — 50 SKILLS, NONE FIRED</text>
  <text x="810" y="62" text-anchor="middle" class="lbl h2">AFTER — ONE SKILL FIRES</text>
  <line x1="540" y1="52" x2="540" y2="138" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="540" y1="154" x2="540" y2="360" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="76" width="460" height="140" rx="6" class="boxW"/>
  <text x="270" y="100" text-anchor="middle" class="lbl node">50 listing entries</text>
  <text x="60" y="122" class="lbl body">each entry = description + when_to_use</text>
  <text x="60" y="142" class="lbl body">truncated at skillListingMaxDescChars = 1,536 chars</text>
  <text x="60" y="164" class="lbl body">≈ 384 tokens/entry (1,536 chars ÷ 4 chars/token)</text>
  <text x="60" y="192" text-anchor="start" class="lbl node">50 × 384 = 19,200 tokens listing cost</text>

  <rect x="580" y="76" width="460" height="140" rx="6" class="boxP"/>
  <text x="810" y="100" text-anchor="middle" class="lbl node">same 50 listings, still resident</text>
  <text x="600" y="122" class="lbl body">listing cost unchanged: 19,200 tokens</text>
  <text x="600" y="146" class="lbl node">+ 1 fired skill's full SKILL.md body</text>
  <text x="600" y="168" class="lbl body">example body ≈ 2,800 tokens, paid once, only now</text>
  <text x="600" y="192" class="lbl node">19,200 + 2,800 = 22,000 tokens this turn</text>

  <path class="flow" d="M 500 146 H 578"/>

  <rect x="40" y="240" width="460" height="60" rx="6" class="boxW"/>
  <text x="270" y="266" text-anchor="middle" class="lbl body">skillListingBudgetFraction caps how much of the</text>
  <text x="270" y="284" text-anchor="middle" class="lbl body">context window this listing pool may consume</text>

  <rect x="580" y="240" width="460" height="60" rx="6" class="boxR"/>
  <text x="810" y="266" text-anchor="middle" class="lbl body">the other 49 bodies stay unloaded —</text>
  <text x="810" y="284" text-anchor="middle" class="lbl body">only the fired skill's body enters context</text>

  <line x1="20" y1="330" x2="1060" y2="330" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="352" class="lbl h2">COUNTERFACTUAL — SAME 50 PROCEDURES WRITTEN INTO CLAUDE.md</text>

  <rect x="80" y="368" width="920" height="112" rx="6" class="boxD"/>
  <text x="540" y="392" text-anchor="middle" class="lbl node">no truncation, no progressive disclosure — every procedure's full body is always in context</text>
  <text x="100" y="416" class="lbl body">50 procedures × 2,800 tokens/body (same size as the example fired skill above)</text>
  <text x="540" y="440" text-anchor="middle" class="lbl node">50 × 2,800 = 140,000 tokens, paid on every single turn</text>
  <text x="540" y="462" text-anchor="middle" class="lbl sub">whether or not any procedure is actually used that turn</text>

  <rect x="60" y="502" width="960" height="118" rx="6" class="panel"/>
  <text x="80" y="526" class="lbl h2">THREE TOTALS, SAME 50 PROCEDURES</text>
  <text x="100" y="550" class="lbl body">listing only, nothing fired:  19,200 tokens</text>
  <text x="100" y="570" class="lbl body">listing + one fired skill:  19,200 + 2,800 = 22,000 tokens</text>
  <text x="100" y="590" class="lbl body">all 50 bodies in CLAUDE.md, every turn:  50 × 2,800 = 140,000 tokens</text>
  <text x="100" y="610" class="lbl sub">progressive disclosure keeps the paid cost near 22,000 instead of 140,000 for the same coverage</text>

  <line x1="20" y1="644" x2="1060" y2="644" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="654" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="667" class="lbl tiny">listing pool (always resident, truncated)</text>
  <rect x="320" y="654" width="22" height="16" rx="3" class="boxP"/>
  <text x="350" y="667" class="lbl tiny">state after one skill fires</text>
  <rect x="560" y="654" width="22" height="16" rx="3" class="boxR"/>
  <text x="590" y="667" class="lbl tiny">stays unloaded</text>
  <rect x="740" y="654" width="22" height="16" rx="3" class="boxD"/>
  <text x="770" y="667" class="lbl tiny">counterfactual: everything always paid</text>
  <rect x="20" y="682" width="22" height="16" rx="3" class="panel"/>
  <text x="50" y="695" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 320 690 H 360"/>
  <text x="370" y="695" class="lbl tiny">A → B : firing A adds B's body to context</text>
</svg>
