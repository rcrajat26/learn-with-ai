<svg viewBox="0 0 900 530" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of the SessionStart reindex pile-up. A second and a third session start concurrently with the first. Each one's SessionStart hook independently reaches the same delta-reindex-is-due decision, because there is no cross-session coordination -- drawn as an absent lock icon between the three sessions.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxHi   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxBad  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxWeak { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="530" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 2 OF 4 &#8212; TWO MORE SESSIONS, SAME DECISION, NO LOCK</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- session 2 -->
  <rect x="40" y="70" width="180" height="56" rx="6" class="boxP"/>
  <text x="130" y="92" text-anchor="middle" class="lbl node">session 2 starts</text>
  <text x="130" y="110" text-anchor="middle" class="lbl sub">concurrent with session 1</text>

  <path class="flow" d="M 220 98 H 260"/>
  <rect x="260" y="70" width="240" height="56" rx="6" class="boxHi"/>
  <text x="380" y="92" text-anchor="middle" class="lbl node">SessionStart hook</text>
  <text x="380" y="110" text-anchor="middle" class="lbl sub">independently decides: reindex due</text>

  <!-- session 3 -->
  <rect x="40" y="160" width="180" height="56" rx="6" class="boxP"/>
  <text x="130" y="182" text-anchor="middle" class="lbl node">session 3 starts</text>
  <text x="130" y="200" text-anchor="middle" class="lbl sub">concurrent with 1 and 2</text>

  <path class="flow" d="M 220 188 H 260"/>
  <rect x="260" y="160" width="240" height="56" rx="6" class="boxHi"/>
  <text x="380" y="182" text-anchor="middle" class="lbl node">SessionStart hook</text>
  <text x="380" y="200" text-anchor="middle" class="lbl sub">independently decides: reindex due</text>

  <!-- absent lock -->
  <rect x="560" y="90" width="300" height="150" rx="8" class="boxBad"/>
  <text x="710" y="114" text-anchor="middle" class="lbl node">no cross-session lock</text>

  <!-- padlock icon, open/absent, drawn as a broken outline with a strike through it -->
  <rect x="692" y="150" width="36" height="24" rx="3" fill="none" stroke="#b91c1c" stroke-width="2.2"/>
  <path d="M 700 150 V 138 A 10 10 0 0 1 720 138 V 146" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="4 3"/>
  <line x1="686" y1="132" x2="734" y2="180" stroke="#b91c1c" stroke-width="2.2"/>

  <text x="710" y="204" text-anchor="middle" class="lbl tiny">absent lock &#8212;</text>
  <text x="710" y="220" text-anchor="middle" class="lbl tiny">nothing serializes the decision</text>

  <path class="flow" d="M 500 98 H 540 V 165 H 560"/>
  <path class="flow" d="M 500 188 H 540 V 165"/>

  <rect x="40" y="270" width="820" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="56" y="294" class="lbl node">state so far</text>
  <line x1="56" y1="304" x2="844" y2="304" stroke="#d1d5db" stroke-width="1"/>
  <text x="56" y="326" class="lbl tiny">3 sessions now running, each with its own SessionStart hook run, each having independently</text>
  <text x="56" y="344" class="lbl tiny">decided a delta-reindex is due &#8212; because no shared lock tells session 2 or 3 that session 1 already started one</text>

  <rect x="40" y="380" width="820" height="60" rx="6" class="boxWeak"/>
  <text x="56" y="404" class="lbl tiny" font-weight="700">each session pulls its own 2 handbook clones and spawns its own embedder processes,</text>
  <text x="56" y="422" class="lbl tiny" font-weight="700">exactly as frame 1 did, all running at the same time</text>

  <line x1="20" y1="458" x2="880" y2="458" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="470" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="483" class="lbl tiny">session</text>
  <rect x="150" y="470" width="22" height="16" rx="3" class="boxHi"/>
  <text x="180" y="483" class="lbl tiny">SessionStart hook</text>
  <rect x="360" y="470" width="22" height="16" rx="3" class="boxBad"/>
  <text x="390" y="483" class="lbl tiny">missing-coordination outcome</text>
  <rect x="620" y="470" width="22" height="16" rx="3" class="boxWeak"/>
  <text x="650" y="483" class="lbl tiny">work spawned by the hook</text>

  <path class="flow" d="M 20 498 H 60"/>
  <text x="68" y="503" class="lbl tiny">A &#8594; B : A causes / produces B</text>
</svg>
