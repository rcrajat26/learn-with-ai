<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 5: topic-enhancer-agent reads the topic guide in src/topics/ and writes the syllabus in src/syllabus/, a different path than it read, and never writes back into its own input.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .bad   { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 3 3;
             marker-end: url(#triR); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 1 OF 5 — STAGE: topic-enhancer-agent</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="80" width="220" height="56" rx="4" class="boxA"/>
  <text x="170" y="102" text-anchor="middle" class="lbl tiny">reads:</text>
  <text x="170" y="120" text-anchor="middle" class="lbl tiny">src/topics/&lt;slug&gt;.md</text>

  <path class="flow" d="M 280 108 H 340"/>

  <rect x="340" y="80" width="260" height="76" rx="6" class="boxP"/>
  <text x="470" y="106" text-anchor="middle" class="lbl node">topic-enhancer-agent</text>
  <text x="470" y="126" text-anchor="middle" class="lbl sub">SYLLABUS pass</text>
  <text x="470" y="142" text-anchor="middle" class="lbl sub">deep-research against primary sources</text>

  <path class="flow" d="M 600 108 H 660"/>

  <rect x="660" y="80" width="220" height="56" rx="4" class="boxA"/>
  <text x="770" y="102" text-anchor="middle" class="lbl tiny">writes:</text>
  <text x="770" y="120" text-anchor="middle" class="lbl tiny">src/syllabus/&lt;NN&gt;-&lt;slug&gt;.md</text>

  <path class="bad" d="M 470 156 V 200 H 170 V 136"/>
  <text x="320" y="216" text-anchor="middle" class="lbl tiny" fill="#b91c1c">never write across lanes — a stage never writes back into its own input</text>

  <rect x="120" y="240" width="660" height="46" rx="6" class="boxA"/>
  <text x="450" y="262" text-anchor="middle" class="lbl body">read path src/topics/ and write path src/syllabus/ are always different files</text>
  <text x="450" y="278" text-anchor="middle" class="lbl sub">each stage reads the prior stage's output and writes only its own</text>

  <line x1="20" y1="304" x2="880" y2="304" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="312" width="22" height="14" rx="3" class="boxA"/>
  <text x="50" y="324" class="lbl tiny">read / write path</text>
  <rect x="200" y="312" width="22" height="14" rx="3" class="boxP"/>
  <text x="230" y="324" class="lbl tiny">stage agent</text>
  <path class="flow" d="M 360 319 H 390"/>
  <text x="398" y="324" class="lbl tiny">A → B : B is read/written by the stage</text>
  <path class="bad" d="M 650 319 H 680"/>
  <text x="688" y="324" class="lbl tiny">forbidden self-write</text>
</svg>
