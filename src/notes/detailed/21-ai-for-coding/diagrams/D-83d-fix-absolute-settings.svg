<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 4 of 4: the fix. Passing --settings with an absolute path to the harness's settings.json is evaluated independently of cwd, so it resolves correctly whether the coder runs in the harness repo or in any per-story worktree.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxW  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .ok    { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4;
             marker-end: url(#triG); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">D-83 · FRAME 4 OF 4 — THE FIX: --settings &lt;ABSOLUTE PATH&gt;</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="70" width="320" height="80" rx="6" class="boxW"/>
  <text x="180" y="100" text-anchor="middle" class="lbl node">--settings /abs/path/to/</text>
  <text x="180" y="120" text-anchor="middle" class="lbl node">sdlc-harness/.claude/settings.json</text>
  <text x="180" y="140" text-anchor="middle" class="lbl sub">evaluated independently of cwd</text>

  <path class="ok" d="M 340 130 H 400 V 100 H 460"/>

  <text x="500" y="66" class="lbl h2">worktree (cwd)</text>
  <rect x="500" y="80" width="380" height="90" rx="6" class="boxP"/>
  <text x="690" y="108" text-anchor="middle" class="lbl node">cwd = /worktrees/story-4471</text>
  <text x="690" y="130" text-anchor="middle" class="lbl body">coder still edits/builds here</text>
  <text x="690" y="150" text-anchor="middle" class="lbl sub">but permissions no longer read from cwd</text>

  <path class="flow" d="M 690 170 V 210"/>

  <rect x="500" y="220" width="380" height="90" rx="6" class="boxR"/>
  <text x="690" y="248" text-anchor="middle" class="lbl node">permissions.allow: Bash(*)</text>
  <text x="690" y="270" text-anchor="middle" class="lbl body">permissions.deny: destructive-command list</text>
  <text x="690" y="292" text-anchor="middle" class="lbl sub">loaded correctly — mvn, git commit, chmod, java all resolve</text>

  <rect x="20" y="330" width="860" height="60" rx="6" class="boxAnn"/>
  <text x="36" y="350" class="lbl h2">Annotation</text>
  <text x="36" y="368" class="lbl tiny">Generalisation: prefer --settings &lt;absolute path&gt; over --setting-sources whenever the launch cwd can differ from</text>
  <text x="36" y="384" class="lbl tiny">the settings owner's repo root. See docs/adr/0016 and incident AP-11470.</text>
</svg>
