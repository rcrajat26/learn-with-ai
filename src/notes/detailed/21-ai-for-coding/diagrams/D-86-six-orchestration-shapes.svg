<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The six orchestration shapes drawn as small structural sketches: single session, subagent, fan-out, pipeline, team, and workflow. Each is labelled with the one condition that makes it the right choice and the symptom of reaching for it too early.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .cell  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">D-86 — THE SIX ORCHESTRATION SHAPES</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Row 1: single session, subagent, fan-out -->
  <rect x="20" y="60" width="320" height="230" rx="6" class="cell"/>
  <text x="40" y="84" class="lbl h2">1. single session</text>
  <rect x="60" y="100" width="240" height="50" rx="6" class="boxP"/>
  <text x="180" y="130" text-anchor="middle" class="lbl node">one session, one context</text>
  <text x="40" y="176" class="lbl tiny" fill="#15803d">right when: the whole task fits in one</text>
  <text x="40" y="192" class="lbl tiny" fill="#15803d">context, no isolation needed</text>
  <text x="40" y="210" class="lbl tiny" fill="#b91c1c">too-early symptom: splitting a task that has</text>
  <text x="40" y="226" class="lbl tiny" fill="#b91c1c">no independent parts into agents anyway</text>
  <text x="40" y="260" class="lbl tiny">more agents than the task warrants</text>

  <rect x="360" y="60" width="320" height="230" rx="6" class="cell"/>
  <text x="380" y="84" class="lbl h2">2. subagent</text>
  <rect x="400" y="100" width="90" height="46" rx="6" class="boxP"/>
  <text x="445" y="128" text-anchor="middle" class="lbl body">parent</text>
  <path class="flow" d="M 490 123 H 520"/>
  <rect x="524" y="100" width="90" height="46" rx="6" class="boxW"/>
  <text x="569" y="128" text-anchor="middle" class="lbl body">subagent</text>
  <text x="380" y="176" class="lbl tiny" fill="#15803d">right when: one sub-task needs an isolated</text>
  <text x="380" y="192" class="lbl tiny" fill="#15803d">context so it doesn't pollute the parent's</text>
  <text x="380" y="222" class="lbl tiny" fill="#b91c1c">too-early symptom: spawning a subagent</text>
  <text x="380" y="238" class="lbl tiny" fill="#b91c1c">for output the parent needed anyway</text>
  <text x="380" y="264" class="lbl tiny">coordination costing more than the work</text>

  <rect x="700" y="60" width="320" height="230" rx="6" class="cell"/>
  <text x="720" y="84" class="lbl h2">3. fan-out</text>
  <rect x="820" y="100" width="80" height="36" rx="6" class="boxP"/>
  <text x="860" y="123" text-anchor="middle" class="lbl sub">dispatcher</text>
  <path class="flow" d="M 860 136 V 150 H 750 V 160"/>
  <path class="flow" d="M 860 136 V 160"/>
  <path class="flow" d="M 860 136 V 150 H 970 V 160"/>
  <rect x="710" y="162" width="80" height="34" rx="6" class="boxW"/>
  <text x="750" y="184" text-anchor="middle" class="lbl sub">worker</text>
  <rect x="820" y="162" width="80" height="34" rx="6" class="boxW"/>
  <text x="860" y="184" text-anchor="middle" class="lbl sub">worker</text>
  <rect x="930" y="162" width="80" height="34" rx="6" class="boxW"/>
  <text x="970" y="184" text-anchor="middle" class="lbl sub">worker</text>
  <text x="720" y="222" class="lbl tiny" fill="#15803d">right when: independent parallel sub-tasks</text>
  <text x="720" y="238" class="lbl tiny" fill="#15803d">that genuinely do not depend on each other</text>
  <text x="720" y="262" class="lbl tiny" fill="#b91c1c">too-early symptom: a fan-out whose join</text>
  <text x="720" y="278" class="lbl tiny" fill="#b91c1c">is the bottleneck</text>

  <!-- Row 2: pipeline, team, workflow -->
  <rect x="20" y="310" width="320" height="230" rx="6" class="cell"/>
  <text x="40" y="334" class="lbl h2">4. pipeline</text>
  <rect x="50" y="352" width="70" height="34" rx="6" class="boxP"/>
  <text x="85" y="374" text-anchor="middle" class="lbl sub">stage 1</text>
  <path class="flow" d="M 120 369 H 150"/>
  <rect x="150" y="352" width="70" height="34" rx="6" class="boxW"/>
  <text x="185" y="374" text-anchor="middle" class="lbl sub">stage 2</text>
  <path class="flow" d="M 220 369 H 250"/>
  <rect x="250" y="352" width="70" height="34" rx="6" class="boxR"/>
  <text x="285" y="374" text-anchor="middle" class="lbl sub">stage 3</text>
  <text x="40" y="420" class="lbl tiny" fill="#15803d">right when: each stage's input is strictly</text>
  <text x="40" y="436" class="lbl tiny" fill="#15803d">the prior stage's output, order matters</text>
  <text x="40" y="466" class="lbl tiny" fill="#b91c1c">too-early symptom: a pipeline built for a</text>
  <text x="40" y="482" class="lbl tiny" fill="#b91c1c">task with one owner and no real handoffs</text>
  <text x="40" y="510" class="lbl tiny">coordination costing more than the work</text>

  <rect x="360" y="310" width="320" height="230" rx="6" class="cell"/>
  <text x="380" y="334" class="lbl h2">5. team</text>
  <rect x="470" y="352" width="80" height="34" rx="6" class="boxP"/>
  <text x="510" y="374" text-anchor="middle" class="lbl sub">lead</text>
  <path class="flow" d="M 510 386 V 400 H 420 V 410"/>
  <path class="flow" d="M 510 386 V 410"/>
  <path class="flow" d="M 510 386 V 400 H 600 V 410"/>
  <rect x="380" y="412" width="80" height="34" rx="6" class="boxW"/>
  <text x="420" y="434" text-anchor="middle" class="lbl sub">teammate</text>
  <rect x="470" y="412" width="80" height="34" rx="6" class="boxW"/>
  <text x="510" y="434" text-anchor="middle" class="lbl sub">teammate</text>
  <rect x="560" y="412" width="80" height="34" rx="6" class="boxW"/>
  <text x="600" y="434" text-anchor="middle" class="lbl sub">teammate</text>
  <text x="380" y="474" class="lbl tiny" fill="#15803d">right when: teammates need to message each</text>
  <text x="380" y="490" class="lbl tiny" fill="#15803d">other mid-task on non-overlapping file areas</text>
  <text x="380" y="516" class="lbl tiny" fill="#b91c1c">too-early symptom: more agents than</text>
  <text x="380" y="532" class="lbl tiny" fill="#b91c1c">the task warrants</text>

  <rect x="700" y="310" width="320" height="230" rx="6" class="cell"/>
  <text x="720" y="334" class="lbl h2">6. workflow</text>
  <rect x="730" y="352" width="70" height="34" rx="6" class="boxP"/>
  <text x="765" y="374" text-anchor="middle" class="lbl sub">step 1</text>
  <path class="flow" d="M 800 369 H 830"/>
  <rect x="830" y="352" width="70" height="34" rx="6" class="boxP"/>
  <text x="865" y="374" text-anchor="middle" class="lbl sub">step 2</text>
  <path class="flow" d="M 900 369 H 930"/>
  <rect x="930" y="352" width="70" height="34" rx="6" class="boxP"/>
  <text x="965" y="374" text-anchor="middle" class="lbl sub">step N</text>
  <text x="720" y="420" class="lbl tiny" fill="#15803d">right when: the sequence is fixed, scripted,</text>
  <text x="720" y="436" class="lbl tiny" fill="#15803d">and repeatable — a deterministic script</text>
  <text x="720" y="466" class="lbl tiny" fill="#b91c1c">too-early symptom: scripting a workflow for</text>
  <text x="720" y="482" class="lbl tiny" fill="#b91c1c">a one-off task a single session would finish</text>
  <text x="720" y="510" class="lbl tiny">coordination costing more than the work</text>

  <line x1="20" y1="570" x2="1020" y2="570" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="582" width="18" height="14" rx="3" class="boxP"/>
  <text x="46" y="594" class="lbl tiny">session / stage / step</text>
  <rect x="220" y="582" width="18" height="14" rx="3" class="boxW"/>
  <text x="246" y="594" class="lbl tiny">subagent / worker / teammate</text>
  <rect x="460" y="582" width="18" height="14" rx="3" class="boxR"/>
  <text x="486" y="594" class="lbl tiny">final stage / output</text>
  <text x="20" y="622" class="lbl tiny" fill="#15803d">green text: the one condition that makes the shape the right choice</text>
  <text x="20" y="642" class="lbl tiny" fill="#b91c1c">red text: the symptom of reaching for it too early</text>
</svg>
