<svg viewBox="0 0 1120 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after comparison. Left, a false model shows CLAUDE.md drawn nested inside the system prompt block, marked false. Right, the real assembly shows the system prompt as one message and memory files such as CLAUDE.md arriving as a separate user message. Two annotated consequences: this is why memory files are guidance rather than policy, and this is why the flag --append-system-prompt behaves differently from memory files.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 13px; font-weight: 700; }
    .node   { font-size: 15px; font-weight: 600; }
    .body   { font-size: 13px; }
    .sub    { font-size: 10.5px; fill: #4b5563; }
    .tiny   { font-size: 11px; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .panel  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .falseT { fill: #b91c1c; font-weight: 700; font-size: 13px; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="820" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">CLAUDE.MD IS A SEPARATE USER MESSAGE, NOT THE SYSTEM PROMPT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="40" y="70" class="lbl h2">WRONG MODEL &#8212; MARKED FALSE</text>
  <text x="600" y="70" class="lbl h2">ACTUAL ASSEMBLY</text>

  <!-- LEFT: false model -->
  <rect x="40" y="90" width="460" height="260" rx="6" class="boxP"/>
  <text x="270" y="118" text-anchor="middle" class="lbl node">system prompt</text>

  <rect x="90" y="150" width="360" height="150" rx="6" class="boxD"/>
  <text x="270" y="178" text-anchor="middle" class="lbl node">CLAUDE.md (memory files)</text>
  <text x="270" y="200" text-anchor="middle" class="lbl body">drawn nested inside the</text>
  <text x="270" y="218" text-anchor="middle" class="lbl body">system prompt block</text>
  <text x="270" y="248" text-anchor="middle" class="falseT">MARKED FALSE</text>
  <text x="270" y="272" text-anchor="middle" class="lbl sub">this placement does not occur in the real request</text>

  <!-- RIGHT: real assembly -->
  <rect x="600" y="90" width="460" height="90" rx="6" class="boxP"/>
  <text x="830" y="122" text-anchor="middle" class="lbl node">system prompt</text>
  <text x="830" y="144" text-anchor="middle" class="lbl body">built-in + --append-system-prompt only</text>
  <text x="830" y="163" text-anchor="middle" class="lbl sub">no memory-file content lives here</text>

  <path class="flow" d="M 830 180 V 216"/>
  <text x="900" y="204" class="lbl sub">separate message</text>

  <rect x="600" y="220" width="460" height="130" rx="6" class="boxR"/>
  <text x="830" y="248" text-anchor="middle" class="lbl node">user message</text>
  <text x="830" y="270" text-anchor="middle" class="lbl body">carries CLAUDE.md (global) + project</text>
  <text x="830" y="288" text-anchor="middle" class="lbl body">.claude/CLAUDE.md + .claude/rules/*</text>
  <text x="830" y="308" text-anchor="middle" class="lbl sub">real placement: a user-role message, not system role</text>
  <text x="830" y="326" text-anchor="middle" class="lbl sub">this is memory content, not a system directive</text>

  <!-- consequence panels -->
  <rect x="40" y="400" width="460" height="130" rx="6" class="panel"/>
  <text x="56" y="424" class="lbl tiny" font-weight="700">Consequence 1: guidance, not policy</text>
  <text x="56" y="446" class="lbl tiny">Because memory files ride as a user message, the model can</text>
  <text x="56" y="464" class="lbl tiny">weigh, question, or override them like any other conversational</text>
  <text x="56" y="482" class="lbl tiny">input &#8212; they do not carry the enforcement weight of a</text>
  <text x="56" y="500" class="lbl tiny">system-role instruction.</text>

  <rect x="600" y="400" width="460" height="130" rx="6" class="panel"/>
  <text x="616" y="424" class="lbl tiny" font-weight="700">Consequence 2: --append-system-prompt differs</text>
  <text x="616" y="446" class="lbl tiny">--append-system-prompt extends the system-prompt block itself,</text>
  <text x="616" y="464" class="lbl tiny">so it applies before any memory file loads, persists even when</text>
  <text x="616" y="482" class="lbl tiny">CLAUDE.md is absent, and carries system-role weight that a</text>
  <text x="616" y="500" class="lbl tiny">memory-file user message never gets.</text>

  <!-- legend -->
  <line x1="20" y1="570" x2="1100" y2="570" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="584" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="597" class="lbl tiny">system-prompt segment</text>

  <rect x="230" y="584" width="22" height="16" rx="3" class="boxR"/>
  <text x="260" y="597" class="lbl tiny">user-message segment (real placement)</text>

  <rect x="500" y="584" width="22" height="16" rx="3" class="boxD"/>
  <text x="530" y="597" class="lbl tiny">mislabeled placement (false)</text>

  <rect x="760" y="584" width="22" height="16" rx="3" class="panel"/>
  <text x="790" y="597" class="lbl tiny">consequence / annotation panel</text>

  <line x1="20" y1="614" x2="50" y2="614" class="flow"/>
  <text x="58" y="618" class="lbl tiny">message order: A &#8594; B means B is a separate, later message than A</text>
</svg>
