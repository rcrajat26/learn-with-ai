<svg viewBox="0 0 1040 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Cost curve of the skill listing as the number of skills grows from 0 to 50. Each skill's description plus when_to_use is truncated at skillListingMaxDescChars, 1,536 characters (a per-entry cap), which is divided by 4 characters per token to give about 384 tokens per skill; at 50 skills that is 384 times 50 equals 19,200 tokens uncapped. skillListingBudgetFraction is a separate pool budget across all entries, not the per-entry cap. A horizontal cap line marks skillListingBudgetFraction, 0.01, times the 200,000 token context window, equal to 2,000 tokens; the actual listing cost follows the same slope then flattens at the cap once the budget is reached around skill 5, because descriptions of the least-invoked skills drop first while skill names never drop from the listing.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 13px; font-weight: 700; }
    .body   { font-size: 13px; }
    .sub    { font-size: 10.5px; fill: #4b5563; }
    .tiny   { font-size: 11px; }

    .panel  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .axis   { stroke: #1f2937; stroke-width: 1.6; }
    .tick   { stroke: #4b5563; stroke-width: 1.3; }

    .uncap  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triW); }
    .cap    { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#triS); }
    .capln  { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 4; }

    .dotU   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .dotC   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="triS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="820" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE COST OF FIFTY SKILLS IN THE LISTING</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- arithmetic panel -->
  <rect x="60" y="54" width="920" height="110" rx="6" class="panel"/>
  <text x="76" y="76" class="lbl tiny" font-weight="700">Per-skill cost, derived</text>
  <text x="76" y="96" class="lbl tiny">description + when_to_use truncated at skillListingMaxDescChars = 1,536 chars (per-entry cap)</text>
  <text x="76" y="114" class="lbl tiny">1,536 chars &#247; 4 chars/token &#8776; 384 tokens/skill (worst case, at the truncation cap)</text>
  <text x="76" y="132" class="lbl tiny" font-weight="700">Total at 50 skills: 384 &#215; 50 = 19,200 tokens (uncapped)</text>
  <text x="76" y="150" class="lbl tiny">skillListingBudgetFraction is a separate pool budget across all entries &#8212; not the per-entry cap above</text>

  <!-- graph axes -->
  <line x1="140" y1="680" x2="960" y2="680" class="axis"/>
  <line x1="140" y1="680" x2="140" y2="200" class="axis"/>
  <text x="140" y="192" class="lbl tiny">LISTING TOKENS</text>
  <text x="880" y="722" class="lbl tiny">SKILLS (0-50)</text>

  <!-- x ticks: 0,10,20,30,40,50 -->
  <line x1="140" y1="680" x2="140" y2="686" class="tick"/><text x="140" y="700" text-anchor="middle" class="lbl sub">0</text>
  <line x1="300" y1="680" x2="300" y2="686" class="tick"/><text x="300" y="700" text-anchor="middle" class="lbl sub">10</text>
  <line x1="460" y1="680" x2="460" y2="686" class="tick"/><text x="460" y="700" text-anchor="middle" class="lbl sub">20</text>
  <line x1="620" y1="680" x2="620" y2="686" class="tick"/><text x="620" y="700" text-anchor="middle" class="lbl sub">30</text>
  <line x1="780" y1="680" x2="780" y2="686" class="tick"/><text x="780" y="700" text-anchor="middle" class="lbl sub">40</text>
  <line x1="940" y1="680" x2="940" y2="686" class="tick"/><text x="940" y="700" text-anchor="middle" class="lbl sub">50</text>

  <!-- y ticks: 0,5000,10000,15000,20000 -->
  <line x1="134" y1="680" x2="140" y2="680" class="tick"/><text x="128" y="684" text-anchor="end" class="lbl sub">0</text>
  <line x1="134" y1="562" x2="140" y2="562" class="tick"/><text x="128" y="566" text-anchor="end" class="lbl sub">5,000</text>
  <line x1="134" y1="445" x2="140" y2="445" class="tick"/><text x="128" y="449" text-anchor="end" class="lbl sub">10,000</text>
  <line x1="134" y1="328" x2="140" y2="328" class="tick"/><text x="128" y="332" text-anchor="end" class="lbl sub">15,000</text>
  <line x1="134" y1="210" x2="140" y2="210" class="tick"/><text x="128" y="214" text-anchor="end" class="lbl sub">20,000</text>

  <!-- cap line -->
  <line x1="140" y1="633" x2="960" y2="633" class="capln"/>
  <text x="300" y="604" class="lbl tiny">cap = skillListingBudgetFraction (0.01) &#215; context window (200,000)</text>
  <text x="300" y="620" class="lbl tiny" font-weight="700">= 2,000 tokens</text>

  <!-- uncapped dashed growth line -->
  <path class="uncap" d="M 140 680 L 936 229"/>
  <circle cx="940" cy="229" r="5" class="dotU"/>
  <text x="800" y="216" class="lbl sub" text-anchor="middle">19,200 tokens at 50 skills (uncapped)</text>

  <!-- actual capped line: same slope to intersection, then flat -->
  <path class="cap" d="M 140 680 L 223 633"/>
  <path class="cap" d="M 223 633 L 940 633"/>
  <circle cx="223" cy="633" r="5" class="dotC"/>
  <text x="223" y="660" class="lbl sub" text-anchor="middle">cap reached &#8776; skill 5</text>

  <!-- behaviour-at-cap annotation panel -->
  <rect x="640" y="480" width="300" height="90" rx="6" class="panel"/>
  <text x="656" y="502" class="lbl tiny" font-weight="700">At the cap</text>
  <text x="656" y="522" class="lbl tiny">Once the running total reaches the cap, descriptions of the</text>
  <text x="656" y="540" class="lbl tiny">least-invoked skills drop first &#8212; names never drop from</text>
  <text x="656" y="558" class="lbl tiny">the listing, only their descriptions.</text>

  <!-- legend -->
  <line x1="20" y1="740" x2="1020" y2="740" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="20" y1="758" x2="50" y2="758" class="uncap"/>
  <text x="58" y="762" class="lbl tiny">uncapped growth (hypothetical, 384 tokens/skill)</text>

  <line x1="360" y1="758" x2="390" y2="758" class="cap"/>
  <text x="398" y="762" class="lbl tiny">actual listing cost (capped)</text>

  <line x1="620" y1="758" x2="650" y2="758" class="capln"/>
  <text x="658" y="762" class="lbl tiny">budget cap line</text>

  <rect x="820" y="750" width="22" height="16" rx="3" class="panel"/>
  <text x="850" y="762" class="lbl tiny">arithmetic / constants panel</text>
</svg>
