<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 4: the harness assembles the request by combining the system prompt, the conversation history, and the tool schemas into one request sent to the model.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">ONE TURN OF THE AGENT LOOP — FRAME 1 OF 4: ASSEMBLE THE REQUEST</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="80" width="220" height="70" rx="6" class="boxP"/>
  <text x="170" y="110" text-anchor="middle" class="lbl node">system prompt</text>
  <text x="170" y="130" text-anchor="middle" class="lbl sub">role, tool rules</text>

  <rect x="340" y="80" width="220" height="70" rx="6" class="boxP"/>
  <text x="450" y="110" text-anchor="middle" class="lbl node">conversation history</text>
  <text x="450" y="130" text-anchor="middle" class="lbl sub">prior tool_use / tool_result</text>

  <rect x="620" y="80" width="220" height="70" rx="6" class="boxP"/>
  <text x="730" y="110" text-anchor="middle" class="lbl node">tool schemas</text>
  <text x="730" y="130" text-anchor="middle" class="lbl sub">Read, Edit, Bash, ...</text>

  <path class="flow" d="M 170 150 V 200 H 450 V 216"/>
  <path class="flow" d="M 450 150 V 216"/>
  <path class="flow" d="M 730 150 V 200 H 450 V 216"/>

  <rect x="300" y="230" width="300" height="76" rx="6" class="boxR"/>
  <text x="450" y="260" text-anchor="middle" class="lbl node">request to model</text>
  <text x="450" y="282" text-anchor="middle" class="lbl sub">ordered message array + tool schemas</text>

  <rect x="640" y="220" width="220" height="96" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="654" y="240" class="lbl tiny" font-weight="700">Note</text>
  <text x="654" y="258" class="lbl tiny">The harness, not the model,</text>
  <text x="654" y="274" class="lbl tiny">builds this request every</text>
  <text x="654" y="290" class="lbl tiny">turn from scratch.</text>

  <line x1="20" y1="340" x2="880" y2="340" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="352" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="365" class="lbl tiny">input component</text>
  <rect x="220" y="352" width="22" height="16" rx="3" class="boxR"/>
  <text x="250" y="365" class="lbl tiny">assembled request</text>
  <path class="flow" d="M 420 360 H 460"/>
  <text x="468" y="365" class="lbl tiny">A → B : B is assembled from A</text>
</svg>
