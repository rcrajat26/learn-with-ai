<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 3: a parent agent dispatches N independent tasks, each assigned its own disjoint output path, up to a concurrency ceiling of 20 concurrent and depth 3.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 1 OF 3 — PARENT DISPATCHES N INDEPENDENT TASKS</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="380" y="60" width="140" height="56" rx="6" class="boxP"/>
  <text x="450" y="84" text-anchor="middle" class="lbl node">parent</text>
  <text x="450" y="102" text-anchor="middle" class="lbl sub">orchestrating session</text>

  <path class="flow" d="M 450 116 V 140"/>
  <line x1="150" y1="140" x2="750" y2="140" stroke="#475569" stroke-width="2"/>

  <path class="flow" d="M 150 140 V 168"/>
  <path class="flow" d="M 350 140 V 168"/>
  <path class="flow" d="M 550 140 V 168"/>
  <path class="flow" d="M 750 140 V 168"/>

  <rect x="70" y="168" width="160" height="70" rx="6" class="boxP"/>
  <text x="150" y="192" text-anchor="middle" class="lbl node">task 1</text>
  <text x="150" y="210" text-anchor="middle" class="lbl sub">output:</text>
  <text x="150" y="224" text-anchor="middle" class="lbl sub">tmp/fanout/task-1.json</text>

  <rect x="270" y="168" width="160" height="70" rx="6" class="boxP"/>
  <text x="350" y="192" text-anchor="middle" class="lbl node">task 2</text>
  <text x="350" y="210" text-anchor="middle" class="lbl sub">output:</text>
  <text x="350" y="224" text-anchor="middle" class="lbl sub">tmp/fanout/task-2.json</text>

  <rect x="470" y="168" width="160" height="70" rx="6" class="boxP"/>
  <text x="550" y="192" text-anchor="middle" class="lbl node">task 3</text>
  <text x="550" y="210" text-anchor="middle" class="lbl sub">output:</text>
  <text x="550" y="224" text-anchor="middle" class="lbl sub">tmp/fanout/task-3.json</text>

  <rect x="670" y="168" width="160" height="70" rx="6" class="boxP"/>
  <text x="750" y="192" text-anchor="middle" class="lbl node">task N</text>
  <text x="750" y="210" text-anchor="middle" class="lbl sub">output:</text>
  <text x="750" y="224" text-anchor="middle" class="lbl sub">tmp/fanout/task-N.json</text>

  <text x="450" y="260" text-anchor="middle" class="lbl body">each task is assigned its own disjoint output path — no two tasks share a file</text>

  <rect x="240" y="290" width="420" height="66" rx="6" class="boxA"/>
  <text x="450" y="310" text-anchor="middle" class="lbl h2">concurrency ceiling</text>
  <text x="450" y="330" text-anchor="middle" class="lbl tiny">20 concurrent tasks maximum</text>
  <text x="450" y="346" text-anchor="middle" class="lbl tiny">fan-out depth 3 (a task may itself fan out, up to 3 levels deep)</text>

  <line x1="20" y1="376" x2="880" y2="376" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="384" width="22" height="14" rx="3" class="boxP"/>
  <text x="50" y="396" class="lbl tiny">parent / task node</text>
  <path class="flow" d="M 220 391 H 260"/>
  <text x="268" y="396" class="lbl tiny">A → B : B is dispatched from A</text>
</svg>
