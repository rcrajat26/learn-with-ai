<svg viewBox="0 0 1260 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Decision tree rooted at the question you want the agent to do X reliably, fanning
     out on a bus to eight terminals, each a condition on the need routed to a mechanism, and each
     mechanism tagged with its enforcement strength: CLAUDE.md, a path-scoped rule in
     .claude/rules/, a skill, and a subagent are context, meaning Claude attempts them with no
     runtime guarantee; a hook, a shell script, and a confirmation gate with the tool denied are
     guaranteed, meaning the harness runs or blocks them regardless of model behaviour; a plugin,
     which distributes any of the above to a team, is context.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .enfC  { font-size: 10.5px; font-weight: 700; fill: #2563eb; }
    .enfG  { font-size: 10.5px; font-weight: 700; fill: #15803d; }

    .boxRoot { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR    { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW    { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .plain { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WHICH MECHANISM FOR WHICH NEED</text>
  <line x1="20" y1="42" x2="1240" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- root -->
  <rect x="472" y="60" width="300" height="46" rx="6" class="boxRoot"/>
  <text x="622" y="88" text-anchor="middle" class="lbl body">you want the agent to do X reliably</text>

  <!-- stub + bus -->
  <path class="plain" d="M 622 106 V 130"/>
  <path class="plain" d="M 90 130 H 1154"/>

  <!-- 8 drops -->
  <path class="flow" d="M 90 130 V 160"/>
  <path class="flow" d="M 242 130 V 160"/>
  <path class="flow" d="M 394 130 V 160"/>
  <path class="flow" d="M 546 130 V 160"/>
  <path class="flow" d="M 698 130 V 160"/>
  <path class="flow" d="M 850 130 V 160"/>
  <path class="flow" d="M 1002 130 V 160"/>
  <path class="flow" d="M 1154 130 V 160"/>

  <!-- column 0: CLAUDE.md -->
  <rect x="20" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="90" y="178" text-anchor="middle" class="lbl sub">fact that</text>
  <text x="90" y="192" text-anchor="middle" class="lbl sub">always applies</text>
  <path class="flow" d="M 90 206 V 226"/>
  <rect x="20" y="226" width="140" height="70" rx="6" class="boxP"/>
  <text x="90" y="260" text-anchor="middle" class="lbl node">CLAUDE.md</text>
  <text x="90" y="284" text-anchor="middle" class="enfC">context</text>

  <!-- column 1: path-scoped rule -->
  <rect x="172" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="242" y="178" text-anchor="middle" class="lbl sub">fact for one</text>
  <text x="242" y="192" text-anchor="middle" class="lbl sub">file type</text>
  <path class="flow" d="M 242 206 V 226"/>
  <rect x="172" y="226" width="140" height="70" rx="6" class="boxP"/>
  <text x="242" y="248" text-anchor="middle" class="lbl node">path-scoped rule</text>
  <text x="242" y="264" text-anchor="middle" class="lbl body">.claude/rules/</text>
  <text x="242" y="284" text-anchor="middle" class="enfC">context</text>

  <!-- column 2: skill -->
  <rect x="324" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="394" y="187" text-anchor="middle" class="lbl sub">a procedure</text>
  <path class="flow" d="M 394 206 V 226"/>
  <rect x="324" y="226" width="140" height="70" rx="6" class="boxP"/>
  <text x="394" y="260" text-anchor="middle" class="lbl node">skill</text>
  <text x="394" y="284" text-anchor="middle" class="enfC">context</text>

  <!-- column 3: hook -->
  <rect x="476" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="546" y="187" text-anchor="middle" class="lbl sub">must-happen</text>
  <path class="flow" d="M 546 206 V 226"/>
  <rect x="476" y="226" width="140" height="70" rx="6" class="boxR"/>
  <text x="546" y="260" text-anchor="middle" class="lbl node">hook</text>
  <text x="546" y="284" text-anchor="middle" class="enfG">guaranteed</text>

  <!-- column 4: shell script -->
  <rect x="628" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="698" y="178" text-anchor="middle" class="lbl sub">one correct answer</text>
  <text x="698" y="192" text-anchor="middle" class="lbl sub">given the inputs</text>
  <path class="flow" d="M 698 206 V 226"/>
  <rect x="628" y="226" width="140" height="70" rx="6" class="boxR"/>
  <text x="698" y="260" text-anchor="middle" class="lbl node">shell script</text>
  <text x="698" y="284" text-anchor="middle" class="enfG">guaranteed</text>

  <!-- column 5: subagent -->
  <rect x="780" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="850" y="178" text-anchor="middle" class="lbl sub">verbose-in,</text>
  <text x="850" y="192" text-anchor="middle" class="lbl sub">small-out</text>
  <path class="flow" d="M 850 206 V 226"/>
  <rect x="780" y="226" width="140" height="70" rx="6" class="boxP"/>
  <text x="850" y="260" text-anchor="middle" class="lbl node">subagent</text>
  <text x="850" y="284" text-anchor="middle" class="enfC">context</text>

  <!-- column 6: confirmation gate -->
  <rect x="932" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="1002" y="178" text-anchor="middle" class="lbl sub">needs human</text>
  <text x="1002" y="192" text-anchor="middle" class="lbl sub">authority</text>
  <path class="flow" d="M 1002 206 V 226"/>
  <rect x="932" y="226" width="140" height="70" rx="6" class="boxR"/>
  <text x="1002" y="248" text-anchor="middle" class="lbl node">confirmation gate</text>
  <text x="1002" y="264" text-anchor="middle" class="lbl body">(tool denied)</text>
  <text x="1002" y="284" text-anchor="middle" class="enfG">guaranteed</text>

  <!-- column 7: plugin -->
  <rect x="1084" y="160" width="140" height="46" rx="5" class="boxW"/>
  <text x="1154" y="178" text-anchor="middle" class="lbl sub">distribution</text>
  <text x="1154" y="192" text-anchor="middle" class="lbl sub">to a team</text>
  <path class="flow" d="M 1154 206 V 226"/>
  <rect x="1084" y="226" width="140" height="70" rx="6" class="boxP"/>
  <text x="1154" y="260" text-anchor="middle" class="lbl node">plugin</text>
  <text x="1154" y="284" text-anchor="middle" class="enfC">context</text>

  <!-- legend -->
  <line x1="20" y1="320" x2="1240" y2="320" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="330" width="22" height="16" rx="3" class="boxRoot"/>
  <text x="50" y="342" class="lbl tiny">the routing question (root)</text>

  <rect x="340" y="330" width="22" height="16" rx="3" class="boxP"/>
  <text x="370" y="342" class="lbl tiny">context — Claude attempts, not enforced</text>

  <rect x="760" y="330" width="22" height="16" rx="3" class="boxR"/>
  <text x="790" y="342" class="lbl tiny">guaranteed — the harness runs it</text>

  <rect x="20" y="358" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="370" class="lbl tiny">condition — the property of the need</text>

  <path class="flow" d="M 400 366 H 440"/>
  <text x="450" y="370" class="lbl tiny">branches to the matching mechanism</text>
</svg>
