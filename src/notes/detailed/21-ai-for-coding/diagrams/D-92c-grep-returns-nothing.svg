<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 4: grep run against the NUL-containing file returns nothing at all, not a mismatch — so every text-based check silently skips the file instead of failing it.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .mono  { font-family: "SF Mono", Menlo, monospace; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 3 OF 4 — THE CHECKER THAT SWITCHED ITSELF OFF</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="150" width="200" height="70" rx="6" class="boxD"/>
  <text x="160" y="178" text-anchor="middle" class="lbl node mono">order.java: data</text>
  <text x="160" y="198" text-anchor="middle" class="lbl sub">contains one NUL byte</text>

  <path class="weak" d="M 260 185 H 330"/>

  <rect x="330" y="140" width="220" height="90" rx="6" class="boxW"/>
  <text x="440" y="168" text-anchor="middle" class="lbl node mono">grep -q statusCode</text>
  <text x="440" y="188" text-anchor="middle" class="lbl sub">binary file matches:</text>
  <text x="440" y="206" text-anchor="middle" class="lbl sub">treated as binary, not text</text>

  <path class="weak" d="M 550 185 H 620"/>

  <rect x="620" y="150" width="220" height="70" rx="6" class="boxD"/>
  <text x="730" y="175" text-anchor="middle" class="lbl node">no match, no error</text>
  <text x="730" y="195" text-anchor="middle" class="lbl sub">exit code silently swallowed upstream</text>

  <rect x="150" y="255" width="600" height="90" rx="6" class="boxA"/>
  <text x="170" y="278" class="lbl node">grep returns NOTHING — not a mismatch, NOTHING</text>
  <text x="170" y="298" class="lbl tiny">a real content mismatch would fail the gate loudly; a binary-file skip fails</text>
  <text x="170" y="314" class="lbl tiny">silently — every text-based check treats this file as if it never existed</text>
  <text x="170" y="330" class="lbl tiny">the checker did not report false-green — it switched itself off for this file</text>

  <line x1="20" y1="360" x2="880" y2="360" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="372" width="22" height="16" rx="3" class="boxD"/>
  <text x="50" y="385" class="lbl tiny">defect / silently-skipped outcome</text>
  <rect x="330" y="372" width="22" height="16" rx="3" class="boxW"/>
  <text x="360" y="385" class="lbl tiny">the text-based check itself</text>
  <line x1="560" y1="380" x2="600" y2="380" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#triW)"/>
  <text x="608" y="385" class="lbl tiny">weak / silently-inapplicable path</text>
</svg>
