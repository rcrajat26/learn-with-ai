<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 4: the model emits a tool_use block naming the tool and its arguments. The model does not run the tool itself.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">ONE TURN OF THE AGENT LOOP — FRAME 2 OF 4: MODEL EMITS tool_use</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="80" y="100" width="220" height="70" rx="6" class="boxP"/>
  <text x="190" y="130" text-anchor="middle" class="lbl node">model</text>
  <text x="190" y="150" text-anchor="middle" class="lbl sub">generates next message</text>

  <path class="flow" d="M 300 135 H 380"/>

  <rect x="380" y="90" width="420" height="110" rx="6" class="boxH"/>
  <text x="400" y="112" class="lbl node">tool_use block</text>
  <text x="400" y="134" class="lbl body">name: Read</text>
  <text x="400" y="152" class="lbl body">arguments: { file_path: "ClaudeRunner.java" }</text>
  <text x="400" y="172" class="lbl sub">emitted as part of the model's response</text>

  <rect x="380" y="230" width="420" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="396" y="252" class="lbl tiny" font-weight="700">the model does NOT run it</text>
  <text x="396" y="270" class="lbl tiny">Emitting a tool_use block only names the</text>
  <text x="396" y="286" class="lbl tiny">intended call; execution happens later.</text>

  <line x1="20" y1="340" x2="880" y2="340" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="352" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="365" class="lbl tiny">actor: the model</text>
  <rect x="220" y="352" width="22" height="16" rx="3" class="boxH"/>
  <text x="250" y="365" class="lbl tiny">emitted tool_use block</text>
  <path class="flow" d="M 460 360 H 500"/>
  <text x="508" y="365" class="lbl tiny">A → B : B is emitted by A</text>
</svg>
