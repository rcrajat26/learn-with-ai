<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after diagram of prompt caching. A request is drawn as a strip: a stable prefix holding the system prompt, tool schemas, and memory files, followed by a changing tail. Left: the tail is appended, so the prefix is served from cache at ten percent of the price. Right: the prefix itself is edited, so nothing is cached and everything is re-billed at full price. A timeline strip beneath shows the five minute default cache TTL, the promptCacheTtl and subagentPromptCacheTtl settings, and a six minute pause crossing the expiry so the next request misses the cache.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; }

    .boxG  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxBad{ fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxLeg{ fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">PROMPT CACHING: THE REUSABLE PREFIX</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- band headers -->
  <text x="20" y="66" class="lbl h2">LEFT — TAIL APPENDED (CACHE HIT)</text>
  <text x="540" y="66" class="lbl h2">RIGHT — PREFIX EDITED (CACHE MISS)</text>
  <line x1="510" y1="76" x2="510" y2="380" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT strip -->
  <rect x="40" y="100" width="300" height="60" rx="4" class="boxG"/>
  <text x="190" y="122" text-anchor="middle" class="lbl body">stable prefix</text>
  <text x="190" y="140" text-anchor="middle" class="lbl sub">system prompt + tool schemas + memory files</text>

  <rect x="340" y="100" width="130" height="60" rx="4" class="boxP"/>
  <text x="405" y="122" text-anchor="middle" class="lbl body">tail</text>
  <text x="405" y="140" text-anchor="middle" class="lbl sub">new turn appended</text>

  <rect x="40" y="190" width="300" height="52" rx="4" class="boxG"/>
  <text x="190" y="212" text-anchor="middle" class="lbl body">served from cache</text>
  <text x="190" y="230" text-anchor="middle" class="lbl sub">billed at 10% of base input price</text>

  <rect x="40" y="270" width="430" height="90" rx="6" class="boxAnn"/>
  <text x="56" y="292" class="lbl tiny" style="font-weight:700">Result</text>
  <text x="56" y="312" class="lbl tiny">prefix bytes are byte-identical to the prior call</text>
  <text x="56" y="330" class="lbl tiny">cache read price = 0.10 &#215; base input price</text>
  <text x="56" y="348" class="lbl tiny">only the appended tail is billed at full price</text>

  <!-- RIGHT strip -->
  <rect x="560" y="100" width="300" height="60" rx="4" class="boxBad"/>
  <text x="710" y="122" text-anchor="middle" class="lbl body">prefix</text>
  <text x="710" y="140" text-anchor="middle" class="lbl sub">system prompt + tool schemas + memory files — edited</text>

  <rect x="860" y="100" width="130" height="60" rx="4" class="boxP"/>
  <text x="925" y="122" text-anchor="middle" class="lbl body">tail</text>
  <text x="925" y="140" text-anchor="middle" class="lbl sub">new turn appended</text>

  <rect x="560" y="190" width="300" height="52" rx="4" class="boxBad"/>
  <text x="710" y="212" text-anchor="middle" class="lbl body">cache miss</text>
  <text x="710" y="230" text-anchor="middle" class="lbl sub">even one edited byte breaks the match</text>

  <rect x="560" y="270" width="430" height="90" rx="6" class="boxAnn"/>
  <text x="576" y="292" class="lbl tiny" style="font-weight:700">Result</text>
  <text x="576" y="312" class="lbl tiny">editing CLAUDE.md or a tool schema changes the prefix bytes</text>
  <text x="576" y="330" class="lbl tiny">nothing in the request is cached this call</text>
  <text x="576" y="348" class="lbl tiny">everything re-billed at full base input price</text>

  <!-- timeline strip -->
  <line x1="20" y1="392" x2="1020" y2="392" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="416" class="lbl h2">CACHE LIFETIME TIMELINE</text>

  <line class="flow" x1="80" y1="470" x2="960" y2="470" marker-end="url(#tri)"/>

  <!-- t0 request -->
  <rect x="60" y="450" width="14" height="14" class="boxG"/>
  <text x="80" y="500" class="lbl tiny">t = 0</text>
  <text x="80" y="516" class="lbl tiny">request 1</text>

  <!-- 5 min TTL marker -->
  <line x1="420" y1="446" x2="420" y2="474" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="500" text-anchor="middle" class="lbl tiny">t = 5 min</text>
  <text x="420" y="516" text-anchor="middle" class="lbl tiny">default TTL expires</text>

  <rect x="300" y="530" width="440" height="70" rx="6" class="boxAnn"/>
  <text x="316" y="550" class="lbl tiny" style="font-weight:700">Configured TTLs</text>
  <text x="316" y="568" class="lbl mono">promptCacheTtl</text>
  <text x="316" y="586" class="lbl mono">subagentPromptCacheTtl</text>
  <text x="520" y="568" class="lbl tiny">— default 5 minutes</text>
  <text x="520" y="586" class="lbl tiny">— separate TTL for subagent calls</text>

  <!-- 6 min pause crossing expiry, drawn as a bracket above the axis so it does not overlay it -->
  <path d="M 420 440 V 430 H 660 V 440" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="420" text-anchor="middle" class="lbl tiny" fill="#b91c1c">6-minute pause — crosses the 5-minute TTL</text>

  <rect x="653" y="450" width="14" height="14" class="boxBad"/>
  <text x="660" y="500" class="lbl tiny">t = 6 min</text>
  <text x="660" y="516" class="lbl tiny">request 2: cache miss</text>

  <!-- legend -->
  <line x1="20" y1="620" x2="1020" y2="620" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="632" width="22" height="16" rx="3" class="boxG"/>
  <text x="50" y="645" class="lbl tiny">cache hit / stable prefix</text>
  <rect x="230" y="632" width="22" height="16" rx="3" class="boxBad"/>
  <text x="260" y="645" class="lbl tiny">cache miss / edited prefix</text>
  <rect x="470" y="632" width="22" height="16" rx="3" class="boxP"/>
  <text x="500" y="645" class="lbl tiny">changing tail</text>
  <rect x="640" y="632" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="670" y="645" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 830 640 H 870"/>
  <text x="878" y="645" class="lbl tiny">request timeline</text>
</svg>
