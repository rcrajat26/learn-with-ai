<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 5 of 5: understanding-book-keeper reads evidence in tmp/ and writes the understanding ledger at src/knowledge/understanding.md; the pipeline terminates in a hard stop whenever a prerequisite file a stage needs to read is missing.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 5 OF 5 — STAGE: understanding-book-keeper, AND THE HARD STOP</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="70" width="200" height="56" rx="4" class="boxA"/>
  <text x="160" y="92" text-anchor="middle" class="lbl tiny">reads:</text>
  <text x="160" y="110" text-anchor="middle" class="lbl tiny">tmp/ (evidence)</text>

  <path class="flow" d="M 260 98 H 320"/>

  <rect x="320" y="70" width="260" height="56" rx="6" class="boxP"/>
  <text x="450" y="92" text-anchor="middle" class="lbl node">understanding-book-keeper</text>
  <text x="450" y="110" text-anchor="middle" class="lbl sub">two passes: with and after gaps</text>

  <path class="flow" d="M 580 98 H 640"/>

  <rect x="640" y="70" width="220" height="56" rx="4" class="boxA"/>
  <text x="750" y="92" text-anchor="middle" class="lbl tiny">writes:</text>
  <text x="750" y="110" text-anchor="middle" class="lbl tiny">src/knowledge/understanding.md</text>

  <path class="flow" d="M 450 126 V 170"/>

  <rect x="260" y="170" width="380" height="76" rx="6" class="boxD"/>
  <text x="450" y="194" text-anchor="middle" class="lbl node">hard stop</text>
  <text x="450" y="214" text-anchor="middle" class="lbl sub">if a prerequisite file is missing —</text>
  <text x="450" y="230" text-anchor="middle" class="lbl sub">e.g. notes-generator finds no prompt in src/metadata/prompts/</text>

  <rect x="120" y="262" width="660" height="30" rx="6" class="boxA"/>
  <text x="450" y="282" text-anchor="middle" class="lbl body">each stage reads the prior stage's output and writes only its own</text>

  <line x1="20" y1="300" x2="880" y2="300" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="308" width="22" height="14" rx="3" class="boxA"/>
  <text x="50" y="320" class="lbl tiny">read / write path</text>
  <rect x="200" y="308" width="22" height="14" rx="3" class="boxP"/>
  <text x="230" y="320" class="lbl tiny">stage agent</text>
  <rect x="360" y="308" width="22" height="14" rx="3" class="boxD"/>
  <text x="390" y="320" class="lbl tiny">hard stop</text>
  <path class="flow" d="M 470 315 H 500"/>
  <text x="508" y="320" class="lbl tiny">A → B : B is read/written by the stage</text>
</svg>
