<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A cost curve chart with turns on the X axis and tokens on the Y axis. A flat baseline line shows the default tool set holding steady at a fixed token figure per turn. After one chatty MCP server connects, the line jumps up by a labelled delta equal to that server's tool schema cost, and stays flat at the new higher level for the rest of the session. An annotation panel computes the cumulative extra cost over a 40-turn session as arithmetic, and notes that /context is how you measure this tax, with the MCP tool name form mcp__&lt;server&gt;__&lt;tool&gt; called out.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .axis  { font-size: 11px; fill: #4b5563; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .base  { fill: none; stroke: #15803d; stroke-width: 2.5; }
    .after { fill: none; stroke: #b45309; stroke-width: 2.5; }
    .delta { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; }
    .axisln{ stroke: #475569; stroke-width: 1.6; }
    .grid  { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="triGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">AN MCP SERVER'S SCHEMAS ARE A PER-TURN TAX</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Chart area: x 80..760, y 90..380 (turn 0..40) -->
  <line x1="80" y1="380" x2="760" y2="380" class="axisln"/>
  <line x1="80" y1="90" x2="80" y2="380" class="axisln"/>
  <text x="420" y="405" text-anchor="middle" class="lbl axis">turns (0 to 40 in a session)</text>
  <text x="30" y="235" text-anchor="middle" class="lbl axis" transform="rotate(-90 30 235)">tokens per turn</text>

  <!-- gridlines for turn 0, 10(connect), 40 -->
  <line x1="260" y1="90" x2="260" y2="380" class="grid" stroke-dasharray="3 3"/>
  <text x="260" y="398" text-anchor="middle" class="lbl sub">turn 10: server connects</text>
  <text x="760" y="398" text-anchor="middle" class="lbl sub">turn 40</text>
  <text x="80" y="398" text-anchor="middle" class="lbl sub">turn 0</text>

  <!-- baseline flat line from turn 0 to 40 at y=320 (represents default tool set cost) -->
  <path class="base" d="M 80 320 H 760"/>
  <text x="95" y="345" class="lbl sub" fill="#15803d">baseline: 4,800 tokens/turn</text>

  <!-- after-connect line: flat at 320 until x=260, then jumps to y=180, flat to 760 -->
  <path class="after" d="M 80 320 H 260 V 180 H 760"/>
  <text x="560" y="168" class="lbl sub" fill="#b45309">after chatty MCP server connects: 7,900 tokens/turn</text>

  <!-- delta bracket at x=260 between 320 and 180 -->
  <path class="delta" d="M 300 320 H 320 V 180 H 300" marker-end="url(#triGray)"/>
  <text x="330" y="245" class="lbl tiny" fill="#4b5563">delta = +3,100 tokens/turn</text>
  <text x="330" y="260" class="lbl tiny" fill="#4b5563">(the connected server's tool schemas)</text>

  <!-- y axis value labels -->
  <text x="70" y="324" text-anchor="end" class="lbl sub">4,800</text>
  <text x="70" y="184" text-anchor="end" class="lbl sub">7,900</text>

  <!-- Annotation panel: arithmetic -->
  <rect x="80" y="430" width="740" height="112" rx="6" class="boxAnn"/>
  <text x="96" y="450" class="lbl h2">CUMULATIVE EXTRA OVER A 40-TURN SESSION</text>
  <text x="96" y="470" class="lbl body">Tax applies from turn 10 (connect) through turn 40 = 30 taxed turns.</text>
  <text x="96" y="490" class="lbl body">30 turns &#215; 3,100 tokens/turn delta = 93,000 extra tokens over the session.</text>
  <text x="96" y="510" class="lbl body">Measure it with <tspan font-weight="600">/context</tspan>, which shows each connected server's tool block by name.</text>
  <text x="96" y="528" class="lbl body">Tool name form on that breakdown: <tspan font-weight="600">mcp__&lt;server&gt;__&lt;tool&gt;</tspan> (e.g. mcp__sequential__sequentialthinking).</text>

  <!-- Legend -->
  <line x1="20" y1="558" x2="880" y2="558" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="20" y1="574" x2="42" y2="574" class="base"/>
  <text x="50" y="578" class="lbl tiny">baseline: default tool set only</text>
  <line x1="260" y1="574" x2="282" y2="574" class="after"/>
  <text x="290" y="578" class="lbl tiny">after connect: default + chatty MCP server</text>
  <line x1="590" y1="574" x2="612" y2="574" class="delta"/>
  <text x="620" y="578" class="lbl tiny">delta: added schema cost</text>
</svg>
