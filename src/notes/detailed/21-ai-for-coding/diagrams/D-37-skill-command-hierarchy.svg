<svg viewBox="0 0 1040 940" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A four-layer stack of skill and command locations: enterprise at top, then personal at tilde slash dot claude slash skills, then project at dot claude slash skills, then plugin skills namespaced as plugin colon skill. Arrows show a project skill named deploy overriding a bundled personal skill of the same name but not its alias, the project skill also beating a same-named commands file, and a plugin skill coexisting rather than overriding. An annotation panel states that dot claude slash commands slash deploy dot md and dot claude slash skills slash deploy slash SKILL dot md both produce the slash deploy command and behave identically, so custom commands are skills. A nested box shows the monorepo subtree discovery mechanism.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .impl  { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; marker-end: url(#triG); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triGr); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="940" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SKILL AND COMMAND LOCATIONS — THE CONFLICT ORDER</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Layer 1: enterprise -->
  <text x="20" y="66" class="lbl h2">1. ENTERPRISE (lowest precedence)</text>
  <rect x="20" y="76" width="400" height="56" rx="6" class="boxL"/>
  <text x="220" y="100" text-anchor="middle" class="lbl node">enterprise-managed skills</text>
  <text x="220" y="118" text-anchor="middle" class="lbl sub">org-wide policy dir, IT-deployed</text>

  <!-- Layer 2: personal -->
  <text x="20" y="156" class="lbl h2">2. PERSONAL</text>
  <rect x="20" y="166" width="400" height="102" rx="6" class="boxL"/>
  <text x="220" y="186" text-anchor="middle" class="lbl node">~/.claude/skills/ — user-wide</text>
  <rect x="60" y="204" width="200" height="52" rx="5" class="boxH"/>
  <text x="160" y="224" text-anchor="middle" class="lbl tiny" font-weight="600">deploy (bundled)</text>
  <text x="160" y="242" text-anchor="middle" class="lbl sub">alias: /ship</text>

  <!-- Layer 3: project -->
  <text x="20" y="296" class="lbl h2">3. PROJECT</text>
  <rect x="20" y="306" width="400" height="116" rx="6" class="boxP"/>
  <text x="220" y="326" text-anchor="middle" class="lbl node">.claude/skills/ — wins for same name</text>
  <rect x="60" y="344" width="200" height="60" rx="5" class="boxH"/>
  <text x="160" y="364" text-anchor="middle" class="lbl tiny" font-weight="600">deploy/SKILL.md</text>
  <text x="160" y="380" text-anchor="middle" class="lbl sub">overrides bundled</text>
  <text x="160" y="394" text-anchor="middle" class="lbl sub">deploy above</text>

  <rect x="278" y="344" width="122" height="60" rx="5" class="boxW"/>
  <text x="339" y="366" text-anchor="middle" class="lbl tiny">/ship alias</text>
  <text x="339" y="384" text-anchor="middle" class="lbl sub">NOT overridden</text>

  <!-- Layer 4: plugin -->
  <text x="20" y="452" class="lbl h2">4. PLUGIN — namespaced, coexists</text>
  <rect x="20" y="462" width="400" height="88" rx="6" class="boxR"/>
  <text x="220" y="486" text-anchor="middle" class="lbl node">plugin:skill  (e.g. ci:deploy)</text>
  <text x="220" y="506" text-anchor="middle" class="lbl sub">namespace prevents collision entirely —</text>
  <text x="220" y="522" text-anchor="middle" class="lbl sub">no arrow to layers 1–3: no interaction</text>

  <!-- Corridors: dedicated exit x per edge, each routed to avoid every box and every other edge -->
  <path class="impl" d="M 160 344 V 256"/>
  <path class="weak" d="M 400 374 H 430 V 242 H 260"/>

  <!-- Command file competing with skill -->
  <text x="600" y="66" class="lbl h2">SAME-NAMED commands/ FILE</text>
  <rect x="600" y="76" width="400" height="56" rx="6" class="boxL"/>
  <text x="800" y="100" text-anchor="middle" class="lbl node">.claude/commands/deploy.md</text>
  <text x="800" y="118" text-anchor="middle" class="lbl sub">legacy custom-command form</text>

  <path class="flow" d="M 420 410 H 520 V 104 H 600"/>

  <!-- Annotation panel: commands ARE skills -->
  <rect x="600" y="150" width="400" height="150" rx="6" class="boxA"/>
  <text x="616" y="172" class="lbl tiny" font-weight="700">ANNOTATION — CORE CLAIM</text>
  <text x="616" y="194" class="lbl tiny">.claude/commands/deploy.md and</text>
  <text x="616" y="212" class="lbl tiny">.claude/skills/deploy/SKILL.md both</text>
  <text x="616" y="230" class="lbl tiny">produce the SAME /deploy command and</text>
  <text x="616" y="248" class="lbl tiny">behave identically at invocation time.</text>
  <text x="616" y="270" class="lbl tiny" font-weight="700">Custom commands ARE skills — not a</text>
  <text x="616" y="288" class="lbl tiny" font-weight="700">separate mechanism, one underlying form.</text>

  <!-- Monorepo nested subtree box -->
  <text x="600" y="332" class="lbl h2">MONOREPO NESTED-SUBTREE MECHANISM</text>
  <rect x="600" y="342" width="400" height="208" rx="6" class="boxW"/>
  <text x="616" y="364" class="lbl tiny" font-weight="700">repo-root/</text>
  <rect x="618" y="374" width="180" height="30" rx="4" class="boxL"/>
  <text x="708" y="393" text-anchor="middle" class="lbl sub">.claude/skills/deploy/</text>
  <rect x="618" y="416" width="364" height="34" rx="4" class="boxP"/>
  <text x="800" y="429" text-anchor="middle" class="lbl sub">packages/billing-service/</text>
  <text x="800" y="443" text-anchor="middle" class="lbl sub">.claude/skills/deploy/  (subtree-local)</text>
  <path class="impl" d="M 708 404 V 416"/>
  <text x="616" y="470" class="lbl tiny">Claude Code walks from cwd upward through</text>
  <text x="616" y="486" class="lbl tiny">every .claude/ it finds in the path to root —</text>
  <text x="616" y="502" class="lbl tiny">a subtree's own .claude/skills/deploy/ wins</text>
  <text x="616" y="518" class="lbl tiny">for work inside packages/billing-service/,</text>
  <text x="616" y="534" class="lbl tiny">exactly like project overriding personal above.</text>

  <line x1="20" y1="596" x2="1020" y2="596" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="618" class="lbl h2">LEGEND</text>

  <rect x="20" y="630" width="22" height="16" rx="3" class="boxL"/>
  <text x="50" y="643" class="lbl tiny">legacy / retained location (enterprise, personal, commands/)</text>

  <rect x="20" y="656" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="669" class="lbl tiny">highlight — the contested "deploy" skill</text>

  <rect x="20" y="682" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="695" class="lbl tiny">project-scoped location (wins for same name)</text>

  <rect x="20" y="708" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="721" class="lbl tiny">plugin-namespaced (coexists, never collides)</text>

  <rect x="20" y="734" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="747" class="lbl tiny">nested / secondary detail (subtree, alias)</text>

  <rect x="20" y="760" width="22" height="16" rx="3" class="boxA"/>
  <text x="50" y="773" class="lbl tiny">annotation panel</text>

  <path class="impl" d="M 400 812 H 440"/>
  <text x="448" y="817" class="lbl tiny">A → B : B overrides A for the shared name</text>

  <path class="weak" d="M 400 838 H 440"/>
  <text x="448" y="843" class="lbl tiny">A → B : weak/no-override link (alias, coexistence)</text>

  <path class="flow" d="M 400 864 H 440"/>
  <text x="448" y="869" class="lbl tiny">A → B : A resolves ahead of / beats B</text>
</svg>
