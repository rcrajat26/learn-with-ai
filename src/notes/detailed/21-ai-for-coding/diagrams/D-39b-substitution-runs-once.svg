<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 3. Substitution runs once over the original SKILL.md file: both placeholder commands execute and their output is placed inline, and that output is visibly not re-scanned for further placeholders.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; font-family: "SF Mono", Menlo, monospace; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 2 OF 3 — SUBSTITUTION RUNS ONCE, OUTPUT NOT RE-SCANNED</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="66" width="360" height="150" rx="6" class="boxW"/>
  <text x="60" y="90" class="lbl node">original SKILL.md</text>
  <rect x="56" y="100" width="328" height="40" rx="5" class="boxP"/>
  <text x="66" y="124" class="lbl dense" font-size="11">!`git branch --show-current`</text>
  <rect x="56" y="146" width="328" height="52" rx="5" class="boxP"/>
  <text x="66" y="166" class="lbl dense" font-size="11">```! git log -1 --oneline ```</text>

  <path class="flow" d="M 400 141 H 480"/>
  <text x="440" y="132" text-anchor="middle" class="lbl sub">one pass</text>

  <rect x="480" y="66" width="140" height="150" rx="6" class="boxA"/>
  <text x="550" y="100" text-anchor="middle" class="lbl body" font-weight="600">substitution</text>
  <text x="550" y="120" text-anchor="middle" class="lbl body" font-weight="600">engine</text>
  <text x="550" y="150" text-anchor="middle" class="lbl sub">executes each</text>
  <text x="550" y="166" text-anchor="middle" class="lbl sub">command found</text>
  <text x="550" y="182" text-anchor="middle" class="lbl sub">exactly once</text>

  <path class="flow" d="M 620 141 H 700"/>

  <rect x="700" y="66" width="160" height="150" rx="6" class="boxR"/>
  <text x="780" y="90" text-anchor="middle" class="lbl node">substituted content</text>
  <rect x="712" y="100" width="136" height="30" rx="4" class="boxR"/>
  <text x="780" y="119" text-anchor="middle" class="lbl dense" font-size="10.5">main</text>
  <rect x="712" y="136" width="136" height="60" rx="4" class="boxR"/>
  <text x="780" y="154" text-anchor="middle" class="lbl dense" font-size="10.5">a1b2c3d fix: retry</text>
  <text x="780" y="170" text-anchor="middle" class="lbl dense" font-size="10.5">logic</text>

  <rect x="60" y="240" width="780" height="120" rx="6" class="boxD"/>
  <text x="80" y="264" class="lbl body" font-weight="700">output visibly NOT re-scanned</text>
  <text x="80" y="288" class="lbl body">if git log's output happened to contain literal text shaped like</text>
  <text x="80" y="308" class="lbl dense" font-size="12">!`rm -rf /`</text>
  <text x="330" y="308" class="lbl body">, it is inserted as inert text — the substitution</text>
  <text x="80" y="328" class="lbl body">pass never looks at its own output a second time to find more commands.</text>

  <rect x="60" y="378" width="780" height="60" rx="6" class="boxA"/>
  <text x="80" y="400" class="lbl tiny" font-weight="700">ONE PASS OVER THE ORIGINAL FILE ONLY</text>
  <text x="80" y="418" class="lbl tiny">the substitution engine reads SKILL.md once; command output replaces the placeholder in place and is never itself parsed for more placeholders.</text>

  <line x1="20" y1="450" x2="880" y2="450" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="458" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="471" class="lbl tiny">on-disk file / container</text>
  <rect x="220" y="458" width="22" height="16" rx="3" class="boxR"/>
  <text x="250" y="471" class="lbl tiny">executed output, substituted inline</text>
  <rect x="500" y="458" width="22" height="16" rx="3" class="boxD"/>
  <text x="530" y="471" class="lbl tiny">not re-scanned region</text>
</svg>
