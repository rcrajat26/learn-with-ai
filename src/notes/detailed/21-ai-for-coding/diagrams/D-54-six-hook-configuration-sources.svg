<svg viewBox="0 0 1080 940" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Hierarchy of the six places a hook can be configured. A settings-file family groups three sources — user settings, project settings, and local settings — each lasting for the lifetime of that settings file. Three further sources sit outside that family: managed policy, lasting for the lifetime of the organization's policy deployment; a plugin's hooks/hooks.json, lasting for the lifetime the plugin is installed and enabled; skill frontmatter, lasting for the rest of the session once the skill is invoked; and subagent frontmatter, lasting only while that subagent runs. A kill-switch panel lists disableAllHooks, allowManagedHooksOnly, and the flag --settings with disableAllHooks true, and states that individual hooks cannot be disabled, only deleted.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxHi   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxG    { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxWeak { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxBad  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="940" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SIX PLACES A HOOK CAN BE CONFIGURED</text>
  <line x1="20" y1="42" x2="1060" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- root -->
  <rect x="430" y="56" width="220" height="46" rx="6" class="boxWeak"/>
  <text x="540" y="78" text-anchor="middle" class="lbl node">a hook is configured at</text>
  <text x="540" y="94" text-anchor="middle" class="lbl sub">six independent sources</text>

  <!-- bus -->
  <path class="flow" d="M 540 102 V 116 H 130 V 140"/>
  <path class="flow" d="M 540 102 V 116 H 540 V 140"/>
  <path class="flow" d="M 540 102 V 116 H 950 V 140"/>

  <!-- settings-file family group panel -->
  <text x="340" y="132" text-anchor="middle" class="lbl h2">SETTINGS-FILE FAMILY</text>
  <rect x="30" y="140" width="620" height="180" rx="8" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- user settings -->
  <rect x="50" y="160" width="180" height="90" rx="6" class="boxP"/>
  <text x="140" y="182" text-anchor="middle" class="lbl node">user settings</text>
  <text x="140" y="200" text-anchor="middle" class="lbl sub">~/.claude/settings.json</text>
  <text x="140" y="220" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="140" y="236" text-anchor="middle" class="lbl sub">every session, this user</text>

  <path class="flow" d="M 230 205 H 260"/>

  <!-- project settings -->
  <rect x="260" y="160" width="180" height="90" rx="6" class="boxP"/>
  <text x="350" y="182" text-anchor="middle" class="lbl node">project settings</text>
  <text x="350" y="200" text-anchor="middle" class="lbl sub">.claude/settings.json</text>
  <text x="350" y="220" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="350" y="236" text-anchor="middle" class="lbl sub">every session, this repo</text>

  <path class="flow" d="M 440 205 H 470"/>

  <!-- local settings -->
  <rect x="470" y="160" width="180" height="90" rx="6" class="boxP"/>
  <text x="560" y="182" text-anchor="middle" class="lbl node">local settings</text>
  <text x="560" y="200" text-anchor="middle" class="lbl sub">.claude/settings.local.json</text>
  <text x="560" y="220" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="560" y="236" text-anchor="middle" class="lbl sub">this developer, gitignored</text>

  <!-- managed policy -->
  <rect x="720" y="140" width="200" height="106" rx="6" class="boxHi"/>
  <text x="820" y="162" text-anchor="middle" class="lbl node">managed policy</text>
  <text x="820" y="180" text-anchor="middle" class="lbl sub">org-deployed policy file</text>
  <text x="820" y="204" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="820" y="220" text-anchor="middle" class="lbl sub">as long as the org</text>
  <text x="820" y="236" text-anchor="middle" class="lbl sub">deploys the policy</text>

  <!-- plugin hooks.json -->
  <rect x="60" y="360" width="220" height="106" rx="6" class="boxG"/>
  <text x="170" y="382" text-anchor="middle" class="lbl node">plugin hooks.json</text>
  <text x="170" y="400" text-anchor="middle" class="lbl sub">hooks/hooks.json</text>
  <text x="170" y="424" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="170" y="440" text-anchor="middle" class="lbl sub">while the plugin is</text>
  <text x="170" y="456" text-anchor="middle" class="lbl sub">installed and enabled</text>

  <path class="flow" d="M 170 320 V 360"/>

  <!-- skill frontmatter -->
  <rect x="430" y="360" width="220" height="106" rx="6" class="boxG"/>
  <text x="540" y="382" text-anchor="middle" class="lbl node">skill frontmatter</text>
  <text x="540" y="400" text-anchor="middle" class="lbl sub">SKILL.md frontmatter</text>
  <text x="540" y="424" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="540" y="440" text-anchor="middle" class="lbl sub">rest of the session, once</text>
  <text x="540" y="456" text-anchor="middle" class="lbl sub">the skill is invoked</text>

  <path class="flow" d="M 540 320 V 360"/>

  <!-- subagent frontmatter -->
  <rect x="800" y="360" width="220" height="106" rx="6" class="boxG"/>
  <text x="910" y="382" text-anchor="middle" class="lbl node">subagent frontmatter</text>
  <text x="910" y="400" text-anchor="middle" class="lbl sub">agent .md frontmatter</text>
  <text x="910" y="424" text-anchor="middle" class="lbl sub" font-weight="700">lifetime:</text>
  <text x="910" y="440" text-anchor="middle" class="lbl sub">only while that subagent</text>
  <text x="910" y="456" text-anchor="middle" class="lbl sub">runs</text>

  <path class="flow" d="M 820 246 V 466"/>

  <!-- kill switch panel -->
  <text x="20" y="516" class="lbl h2">KILL SWITCHES</text>
  <line x1="20" y1="524" x2="1060" y2="524" stroke="#d1d5db" stroke-width="1"/>

  <rect x="30" y="540" width="1010" height="220" rx="8" class="boxBad"/>
  <text x="46" y="566" class="lbl node">disableAllHooks</text>
  <text x="46" y="586" class="lbl tiny">a settings-file boolean that turns off every hook from every source above</text>

  <text x="46" y="616" class="lbl node">allowManagedHooksOnly</text>
  <text x="46" y="636" class="lbl tiny">a settings-file boolean that keeps only the managed-policy hooks running, disabling all others</text>

  <text x="46" y="666" class="lbl node">--settings '{"disableAllHooks":true}'</text>
  <text x="46" y="686" class="lbl tiny">the same kill switch passed for one invocation on the command line, no file edit needed</text>

  <line x1="46" y1="706" x2="1010" y2="706" stroke="#b91c1c" stroke-width="1"/>
  <text x="46" y="730" class="lbl node" font-weight="700">individual hooks cannot be disabled, only deleted</text>
  <text x="46" y="748" class="lbl tiny">there is no per-hook off switch: to remove one hook's effect, remove its entry from its source file</text>

  <!-- legend -->
  <line x1="20" y1="790" x2="1060" y2="790" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="802" width="22" height="16" rx="3" class="boxWeak"/>
  <text x="50" y="815" class="lbl tiny">root / grouping frame</text>
  <rect x="220" y="802" width="22" height="16" rx="3" class="boxP"/>
  <text x="250" y="815" class="lbl tiny">settings-file family (user / project / local)</text>
  <rect x="560" y="802" width="22" height="16" rx="3" class="boxHi"/>
  <text x="590" y="815" class="lbl tiny">managed policy</text>
  <rect x="740" y="802" width="22" height="16" rx="3" class="boxG"/>
  <text x="770" y="815" class="lbl tiny">plugin / skill / subagent scoped source</text>

  <rect x="20" y="830" width="22" height="16" rx="3" class="boxBad"/>
  <text x="50" y="843" class="lbl tiny">kill-switch panel</text>
  <path class="flow" d="M 260 838 H 300"/>
  <text x="308" y="843" class="lbl tiny">A &#8594; B : A is one of the six configuration sources feeding into B</text>
</svg>
