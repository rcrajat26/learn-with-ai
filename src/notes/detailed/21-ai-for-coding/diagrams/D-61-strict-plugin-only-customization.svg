<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Hierarchy diagram of four extension channels — skills, agents, hooks, MCP — each fed by three possible sources: user, project, plugin. With the lock off, each channel panel shows all three sources checked live, twelve edges in total. With strictPluginOnlyCustomization on, together with its agents, hooks, mcp, and skills sub-keys, every channel panel shows user and project marked blocked and only plugin remains checked live, four edges in total. An annotation panel lists the neighbouring settings keys enabledPlugins, blockedMarketplaces, extraKnownMarketplaces, strictKnownMarketplaces, disableSideloadFlags, and pluginTrustMessage.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }

    .rowLive { fill: #dcfce7; stroke: #15803d; stroke-width: 1.3; }
    .rowDead { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.3; }
  </style>
  <defs/>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">strictPluginOnlyCustomization CLOSES THE SIDE DOORS</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Band headers -->
  <text x="20" y="66" class="lbl h2">LOCK OFF — ALL TWELVE EDGES LIVE</text>
  <text x="20" y="380" class="lbl h2">LOCK ON — ONLY THE FOUR PLUGIN EDGES LIVE</text>
  <line x1="20" y1="370" x2="1020" y2="370" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===== TOP: LOCK OFF — one panel per channel, 3 source rows each ===== -->
  <!-- Channel panel template: header (channel name) + 3 rows: user, project, plugin, each with a check -->

  <!-- skills -->
  <rect x="20" y="86" width="230" height="26" rx="4" class="boxP"/>
  <text x="135" y="104" text-anchor="middle" class="lbl node">skills</text>
  <rect x="20" y="116" width="230" height="30" class="rowLive"/>
  <text x="32" y="136" class="lbl dense">user</text>
  <text x="230" y="136" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="20" y="146" width="230" height="30" class="rowLive"/>
  <text x="32" y="166" class="lbl dense">project</text>
  <text x="230" y="166" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="20" y="176" width="230" height="30" class="rowLive"/>
  <text x="32" y="196" class="lbl dense">plugin</text>
  <text x="230" y="196" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- agents -->
  <rect x="270" y="86" width="230" height="26" rx="4" class="boxP"/>
  <text x="385" y="104" text-anchor="middle" class="lbl node">agents</text>
  <rect x="270" y="116" width="230" height="30" class="rowLive"/>
  <text x="282" y="136" class="lbl dense">user</text>
  <text x="480" y="136" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="270" y="146" width="230" height="30" class="rowLive"/>
  <text x="282" y="166" class="lbl dense">project</text>
  <text x="480" y="166" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="270" y="176" width="230" height="30" class="rowLive"/>
  <text x="282" y="196" class="lbl dense">plugin</text>
  <text x="480" y="196" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- hooks -->
  <rect x="520" y="86" width="230" height="26" rx="4" class="boxP"/>
  <text x="635" y="104" text-anchor="middle" class="lbl node">hooks</text>
  <rect x="520" y="116" width="230" height="30" class="rowLive"/>
  <text x="532" y="136" class="lbl dense">user</text>
  <text x="730" y="136" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="520" y="146" width="230" height="30" class="rowLive"/>
  <text x="532" y="166" class="lbl dense">project</text>
  <text x="730" y="166" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="520" y="176" width="230" height="30" class="rowLive"/>
  <text x="532" y="196" class="lbl dense">plugin</text>
  <text x="730" y="196" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- MCP -->
  <rect x="770" y="86" width="230" height="26" rx="4" class="boxP"/>
  <text x="885" y="104" text-anchor="middle" class="lbl node">MCP</text>
  <rect x="770" y="116" width="230" height="30" class="rowLive"/>
  <text x="782" y="136" class="lbl dense">user</text>
  <text x="980" y="136" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="770" y="146" width="230" height="30" class="rowLive"/>
  <text x="782" y="166" class="lbl dense">project</text>
  <text x="980" y="166" text-anchor="end" class="lbl dense">✓ live</text>
  <rect x="770" y="176" width="230" height="30" class="rowLive"/>
  <text x="782" y="196" class="lbl dense">plugin</text>
  <text x="980" y="196" text-anchor="end" class="lbl dense">✓ live</text>

  <rect x="20" y="216" width="980" height="46" rx="6" class="boxA"/>
  <text x="40" y="238" class="lbl dense">strictPluginOnlyCustomization: false (or unset)</text>
  <text x="40" y="256" class="lbl node">12 of 12 edges live — every source may supply every channel</text>

  <!-- ===== BOTTOM: LOCK ON ===== -->
  <!-- skills -->
  <rect x="20" y="396" width="230" height="26" rx="4" class="boxP"/>
  <text x="135" y="414" text-anchor="middle" class="lbl node">skills</text>
  <rect x="20" y="426" width="230" height="30" class="rowDead"/>
  <text x="32" y="446" class="lbl dense">user</text>
  <text x="230" y="446" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="20" y="456" width="230" height="30" class="rowDead"/>
  <text x="32" y="476" class="lbl dense">project</text>
  <text x="230" y="476" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="20" y="486" width="230" height="30" class="rowLive"/>
  <text x="32" y="506" class="lbl dense">plugin</text>
  <text x="230" y="506" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- agents -->
  <rect x="270" y="396" width="230" height="26" rx="4" class="boxP"/>
  <text x="385" y="414" text-anchor="middle" class="lbl node">agents</text>
  <rect x="270" y="426" width="230" height="30" class="rowDead"/>
  <text x="282" y="446" class="lbl dense">user</text>
  <text x="480" y="446" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="270" y="456" width="230" height="30" class="rowDead"/>
  <text x="282" y="476" class="lbl dense">project</text>
  <text x="480" y="476" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="270" y="486" width="230" height="30" class="rowLive"/>
  <text x="282" y="506" class="lbl dense">plugin</text>
  <text x="480" y="506" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- hooks -->
  <rect x="520" y="396" width="230" height="26" rx="4" class="boxP"/>
  <text x="635" y="414" text-anchor="middle" class="lbl node">hooks</text>
  <rect x="520" y="426" width="230" height="30" class="rowDead"/>
  <text x="532" y="446" class="lbl dense">user</text>
  <text x="730" y="446" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="520" y="456" width="230" height="30" class="rowDead"/>
  <text x="532" y="476" class="lbl dense">project</text>
  <text x="730" y="476" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="520" y="486" width="230" height="30" class="rowLive"/>
  <text x="532" y="506" class="lbl dense">plugin</text>
  <text x="730" y="506" text-anchor="end" class="lbl dense">✓ live</text>

  <!-- MCP -->
  <rect x="770" y="396" width="230" height="26" rx="4" class="boxP"/>
  <text x="885" y="414" text-anchor="middle" class="lbl node">MCP</text>
  <rect x="770" y="426" width="230" height="30" class="rowDead"/>
  <text x="782" y="446" class="lbl dense">user</text>
  <text x="980" y="446" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="770" y="456" width="230" height="30" class="rowDead"/>
  <text x="782" y="476" class="lbl dense">project</text>
  <text x="980" y="476" text-anchor="end" class="lbl dense">✗ blocked</text>
  <rect x="770" y="486" width="230" height="30" class="rowLive"/>
  <text x="782" y="506" class="lbl dense">plugin</text>
  <text x="980" y="506" text-anchor="end" class="lbl dense">✓ live</text>

  <rect x="20" y="526" width="980" height="46" rx="6" class="boxH"/>
  <text x="40" y="548" class="lbl dense">strictPluginOnlyCustomization: true</text>
  <text x="40" y="566" class="lbl node">4 of 12 edges live — user and project blocked on every channel, only plugin remains</text>

  <!-- sub-keys panel -->
  <rect x="20" y="592" width="980" height="90" rx="6" class="boxA"/>
  <text x="40" y="614" class="lbl h2">strictPluginOnlyCustomization SUB-KEYS</text>
  <text x="40" y="638" class="lbl dense" font-family="monospace">.agents   .hooks   .mcp   .skills</text>
  <text x="40" y="660" class="lbl sub">each sub-key independently toggles the lock for that one channel — set true to force plugin-only for that</text>
  <text x="40" y="674" class="lbl sub">channel alone, without locking the other three.</text>

  <!-- neighbouring keys panel -->
  <rect x="20" y="702" width="980" height="106" rx="6" class="boxA"/>
  <text x="40" y="724" class="lbl h2">NEIGHBOURING SETTINGS KEYS</text>
  <text x="40" y="748" class="lbl dense" font-family="monospace">enabledPlugins   blockedMarketplaces   extraKnownMarketplaces</text>
  <text x="40" y="768" class="lbl dense" font-family="monospace">strictKnownMarketplaces   disableSideloadFlags   pluginTrustMessage</text>
  <text x="40" y="790" class="lbl sub">govern which plugins/marketplaces are trusted and what message is shown when a plugin is installed.</text>

  <!-- Legend -->
  <line x1="20" y1="828" x2="1020" y2="828" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="842" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="855" class="lbl tiny">extension channel header</text>
  <rect x="260" y="842" width="22" height="16" rx="3" class="rowLive"/>
  <text x="290" y="855" class="lbl tiny">source-to-channel edge: live (✓)</text>
  <rect x="540" y="842" width="22" height="16" rx="3" class="rowDead"/>
  <text x="570" y="855" class="lbl tiny">source-to-channel edge: blocked (✗)</text>
  <rect x="840" y="842" width="22" height="16" rx="3" class="boxA"/>
  <text x="870" y="855" class="lbl tiny">annotation panel</text>

  <rect x="20" y="866" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="879" class="lbl tiny">state summary when the lock is on (headline)</text>
</svg>
