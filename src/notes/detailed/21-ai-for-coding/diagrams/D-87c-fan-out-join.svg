<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 3: the join step reads all N output files and aggregates them into one result, completing the fan-out and join pattern.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FRAME 3 OF 3 — JOIN READS THE N FILES AND AGGREGATES</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="70" y="66" width="160" height="34" rx="4" class="boxA"/>
  <text x="150" y="87" text-anchor="middle" class="lbl tiny">tmp/fanout/task-1.json</text>

  <rect x="270" y="66" width="160" height="34" rx="4" class="boxA"/>
  <text x="350" y="87" text-anchor="middle" class="lbl tiny">tmp/fanout/task-2.json</text>

  <rect x="470" y="66" width="160" height="34" rx="4" class="boxA"/>
  <text x="550" y="87" text-anchor="middle" class="lbl tiny">tmp/fanout/task-3.json</text>

  <rect x="670" y="66" width="160" height="34" rx="4" class="boxA"/>
  <text x="750" y="87" text-anchor="middle" class="lbl tiny">tmp/fanout/task-N.json</text>

  <path class="flow" d="M 150 100 V 130 H 450 V 150"/>
  <path class="flow" d="M 350 100 V 140 H 450 V 150"/>
  <path class="flow" d="M 550 100 V 140 H 450 V 150"/>
  <path class="flow" d="M 750 100 V 130 H 450 V 150"/>

  <rect x="330" y="150" width="240" height="70" rx="6" class="boxP"/>
  <text x="450" y="174" text-anchor="middle" class="lbl node">join</text>
  <text x="450" y="192" text-anchor="middle" class="lbl sub">reads all N paths</text>
  <text x="450" y="206" text-anchor="middle" class="lbl sub">from tmp/fanout/</text>

  <path class="flow" d="M 450 220 V 244"/>

  <rect x="300" y="244" width="300" height="70" rx="6" class="boxR"/>
  <text x="450" y="268" text-anchor="middle" class="lbl node">aggregated result</text>
  <text x="450" y="286" text-anchor="middle" class="lbl sub">one combined output,</text>
  <text x="450" y="300" text-anchor="middle" class="lbl sub">no per-task payload was ever in-band</text>

  <line x1="20" y1="332" x2="880" y2="332" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="340" width="22" height="14" rx="3" class="boxA"/>
  <text x="50" y="352" class="lbl tiny">disjoint output file</text>
  <rect x="180" y="340" width="22" height="14" rx="3" class="boxP"/>
  <text x="210" y="352" class="lbl tiny">join step</text>
  <path class="flow" d="M 330 347 H 360"/>
  <text x="368" y="352" class="lbl tiny">A → B : B reads A off disk</text>
</svg>
