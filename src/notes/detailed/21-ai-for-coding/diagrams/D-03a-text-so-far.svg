<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Step 1 of 3. The text generated so far ends mid-sentence: The bug in ClaudeRunner is caused by, followed by a cursor marking the point where the next token must be chosen.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node { font-size: 15px; font-weight: 600; }
    .body { font-size: 13px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
  </style>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">STEP 1 OF 3 — TEXT SO FAR (ENDS MID-SENTENCE)</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="100" width="620" height="90" rx="6" class="boxP"/>
  <text x="80" y="140" class="lbl body">"The bug in ClaudeRunner is caused by</text>
  <text x="80" y="165" class="lbl sub">tokens already generated are fixed text</text>

  <rect x="700" y="100" width="140" height="90" rx="6" class="boxH"/>
  <text x="770" y="140" text-anchor="middle" class="lbl node">next token</text>
  <text x="770" y="160" text-anchor="middle" class="lbl node">= ?</text>
  <text x="770" y="177" text-anchor="middle" class="lbl sub">not yet chosen</text>

  <line x1="20" y1="230" x2="880" y2="230" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="242" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="255" class="lbl tiny">text already generated (fixed)</text>
  <rect x="320" y="242" width="22" height="16" rx="3" class="boxH"/>
  <text x="350" y="255" class="lbl tiny">the undetermined next token</text>
</svg>
