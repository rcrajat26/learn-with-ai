<svg viewBox="0 0 940 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="resize lo/hi split: bin 5 of a 16-slot table with nodes A,B,C,D,E splits by (hash and oldCap) into lo bin 5 holding A,C,E and hi bin 21 holding B,D in a 32-slot table, preserving relative order">
  <defs>
    <marker id="arrow92" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="470" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">resize() lo/hi split</text>

  <rect x="40" y="34" width="860" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="1.5"/>
  <text x="470" y="52" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">deciding line: if ((e.hash &amp; oldCap) == 0)  /* oldCap = 16 */</text>

  <!-- ============ BEFORE PANEL ============ -->
  <rect x="20" y="70" width="900" height="260" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="96" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">BEFORE — oldCap = 16, bin j = 5</text>

  <g font-family="sans-serif" font-size="12">
    <rect x="40" y="110" width="820" height="98" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="1.5"/>
    <text x="60" y="128" fill="#1f2937" font-weight="bold">node</text>
    <text x="140" y="128" fill="#1f2937" font-weight="bold">hash</text>
    <text x="230" y="128" fill="#1f2937" font-weight="bold">hash &amp; 15</text>
    <text x="340" y="128" fill="#1f2937" font-weight="bold">hash &amp; 16</text>
    <text x="470" y="128" fill="#1f2937" font-weight="bold">destination</text>

    <text x="60" y="146" fill="#1f2937">A</text><text x="140" y="146" fill="#1f2937">5</text>
    <text x="230" y="146" fill="#1f2937">5</text><text x="340" y="146" fill="#1f2937">0</text>
    <text x="470" y="146" fill="#1f2937">lo -&gt; index 5</text>

    <text x="60" y="162" fill="#1f2937">B</text><text x="140" y="162" fill="#1f2937">21</text>
    <text x="230" y="162" fill="#1f2937">5</text><text x="340" y="162" fill="#1f2937">16</text>
    <text x="470" y="162" fill="#1f2937">hi -&gt; index 21</text>

    <text x="60" y="178" fill="#1f2937">C</text><text x="140" y="178" fill="#1f2937">37</text>
    <text x="230" y="178" fill="#1f2937">5</text><text x="340" y="178" fill="#1f2937">0</text>
    <text x="470" y="178" fill="#1f2937">lo -&gt; index 5</text>

    <text x="60" y="194" fill="#1f2937">D</text><text x="140" y="194" fill="#1f2937">53</text>
    <text x="230" y="194" fill="#1f2937">5</text><text x="340" y="194" fill="#1f2937">16</text>
    <text x="470" y="194" fill="#1f2937">hi -&gt; index 21</text>
  </g>
  <text x="60" y="206" font-family="sans-serif" font-size="12" fill="#1f2937">E</text>
  <text x="140" y="206" font-family="sans-serif" font-size="12" fill="#1f2937">69</text>
  <text x="230" y="206" font-family="sans-serif" font-size="12" fill="#1f2937">5</text>
  <text x="340" y="206" font-family="sans-serif" font-size="12" fill="#1f2937">0</text>
  <text x="470" y="206" font-family="sans-serif" font-size="12" fill="#1f2937">lo -&gt; index 5</text>

  <!-- old bin 5 chain, all 5 nodes -->
  <text x="40" y="236" font-family="sans-serif" font-size="12.5" fill="#1f2937">old table[5]:</text>
  <g font-family="sans-serif" font-size="13">
    <rect x="140" y="220" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="170" y="240" text-anchor="middle" fill="#1f2937">A</text>
    <text x="170" y="256" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=5</text>

    <rect x="280" y="220" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="310" y="240" text-anchor="middle" fill="#1f2937">B</text>
    <text x="310" y="256" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=21</text>

    <rect x="420" y="220" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="450" y="240" text-anchor="middle" fill="#1f2937">C</text>
    <text x="450" y="256" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=37</text>

    <rect x="560" y="220" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="590" y="240" text-anchor="middle" fill="#1f2937">D</text>
    <text x="590" y="256" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=53</text>

    <rect x="700" y="220" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="730" y="240" text-anchor="middle" fill="#1f2937">E</text>
    <text x="730" y="256" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=69</text>
  </g>
  <line x1="260" y1="243" x2="278" y2="243" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <line x1="400" y1="243" x2="418" y2="243" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <line x1="540" y1="243" x2="558" y2="243" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <line x1="680" y1="243" x2="698" y2="243" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <rect x="825" y="230" width="18" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="834" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">/</text>
  <text x="820" y="288" font-family="sans-serif" font-size="11" fill="#1f2937">-&gt; null (E.next = null)</text>

  <rect x="40" y="296" width="440" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="60" y="312" font-family="sans-serif" font-size="11" fill="#1f2937">all five share bin 5 in the 16-slot table (5,21,37,53,69 all &amp; 15 = 5)</text>

  <!-- ============ AFTER PANEL ============ -->
  <rect x="20" y="350" width="900" height="430" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="376" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">AFTER — newCap = 32 (oldCap doubled)</text>

  <!-- lo bin (index 5) -->
  <text x="40" y="412" font-family="sans-serif" font-size="12.5" fill="#1f2937">new table[5]  (lo, e.hash &amp; oldCap == 0):</text>
  <g font-family="sans-serif" font-size="13">
    <rect x="60" y="424" width="110" height="46" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="115" y="444" text-anchor="middle" fill="#1f2937">A</text>
    <text x="115" y="460" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=5</text>

    <rect x="200" y="424" width="110" height="46" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="255" y="444" text-anchor="middle" fill="#1f2937">C</text>
    <text x="255" y="460" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=37</text>

    <rect x="340" y="424" width="110" height="46" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="395" y="444" text-anchor="middle" fill="#1f2937">E</text>
    <text x="395" y="460" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=69</text>
  </g>
  <line x1="170" y1="447" x2="198" y2="447" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <line x1="310" y1="447" x2="338" y2="447" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <rect x="455" y="434" width="18" height="26" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="1"/>
  <text x="464" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">/</text>

  <rect x="500" y="424" width="120" height="46" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <text x="560" y="440" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">loHead -&gt; A</text>
  <text x="560" y="454" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">loTail -&gt; E</text>
  <line x1="500" y1="447" x2="450" y2="447" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow92)"/>
  <line x1="500" y1="440" x2="115" y2="424" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- hi bin (index 21) -->
  <text x="40" y="512" font-family="sans-serif" font-size="12.5" fill="#1f2937">new table[21] (hi, e.hash &amp; oldCap == 16):</text>
  <g font-family="sans-serif" font-size="13">
    <rect x="60" y="524" width="110" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="115" y="544" text-anchor="middle" fill="#1f2937">B</text>
    <text x="115" y="560" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=21</text>

    <rect x="200" y="524" width="110" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="255" y="544" text-anchor="middle" fill="#1f2937">D</text>
    <text x="255" y="560" text-anchor="middle" font-size="10.5" fill="#1f2937">hash=53</text>
  </g>
  <line x1="170" y1="547" x2="198" y2="547" stroke="#737373" stroke-width="2" marker-end="url(#arrow92)"/>
  <rect x="315" y="534" width="18" height="26" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="1"/>
  <text x="324" y="552" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">/</text>

  <rect x="500" y="524" width="120" height="46" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="1.5"/>
  <text x="560" y="540" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">hiHead -&gt; B</text>
  <text x="560" y="554" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">hiTail -&gt; D</text>
  <line x1="500" y1="547" x2="310" y2="547" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow92)"/>
  <line x1="500" y1="540" x2="115" y2="524" stroke="#525252" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="40" y="590" width="360" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1.5"/>
  <text x="220" y="608" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">21 = 5 + oldCap = 5 + 16</text>

  <rect x="40" y="630" width="820" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="450" y="648" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">A before C before E, B before D — the same relative order</text>
  <text x="450" y="664" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">as in the old bin (both lists preserve original chain order)</text>

  <rect x="40" y="690" width="820" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="712" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">deciding line, applied per node while walking the old bin:</text>
  <text x="450" y="732" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">if ((e.hash &amp; oldCap) == 0) loTail.next = e; else hiTail.next = e;</text>
</svg>
