<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="groupingBy with counting() downstream collector: each bucket list collapses to its size, producing Map of Character to Long: a=3, b=2, c=1">
  <defs>
    <marker id="arrow62b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">groupingBy(classifier, counting()) — same three buckets from D-62a</text>

  <rect x="80" y="60" width="200" height="70" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="180" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a &#8594; [apple, avocado,</text>
  <text x="180" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">apricot]</text>
  <text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 3</text>

  <rect x="320" y="60" width="200" height="70" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">b &#8594; [banana,</text>
  <text x="420" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">blueberry]</text>
  <text x="420" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 2</text>

  <rect x="560" y="60" width="160" height="70" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="640" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">c &#8594; [cherry]</text>
  <text x="640" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 1</text>

  <line x1="400" y1="130" x2="400" y2="175" stroke="#737373" stroke-width="2" marker-end="url(#arrow62b)"/>
  <rect x="290" y="142" width="220" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="159" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">downstream: counting()</text>

  <rect x="180" y="200" width="120" height="60" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="240" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">a &#8594; 3</text>

  <rect x="340" y="200" width="120" height="60" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">b &#8594; 2</text>

  <rect x="500" y="200" width="120" height="60" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="560" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">c &#8594; 1</text>

  <rect x="80" y="272" width="640" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Map&lt;Character,Long&gt; — the List&lt;String&gt; buckets never materialize; counting() reduces in place</text>
</svg>
