<svg viewBox="0 0 1000 1190" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Line chart, log-scale y-axis, of total insert time in milliseconds versus number of inserted keys sharing one hashCode, for a plain hash chain, a treeified bin with Comparable keys, and a treeified bin with non-Comparable keys. The plain chain and the non-Comparable treeified bin both scale quadratically; the Comparable treeified bin scales near-linearly and is 152x faster at 20,000 keys.">
  <defs>
    <marker id="arrow147" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="20" y="20" width="960" height="42" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="500" y="47" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">Collision DoS, measured.</text>

  <!-- Legend bar -->
  <rect x="20" y="72" width="960" height="110" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <rect x="40" y="82" width="18" height="18" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>
  <text x="64" y="96" font-family="sans-serif" font-size="13" fill="#1f2937">plain chain, never treeifies &#8212; O(n&#178;) (solid red line)</text>
  <rect x="40" y="110" width="18" height="18" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <text x="64" y="124" font-family="sans-serif" font-size="13" fill="#1f2937">treeified red-black bin, keys Comparable &#8212; O(n log n) (dashed green line)</text>
  <rect x="40" y="138" width="18" height="18" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>
  <text x="64" y="152" font-family="sans-serif" font-size="13" fill="#1f2937">treeified but keys NOT Comparable &#8212; still O(n&#178;), and worse (dotted amber line)</text>
  <text x="40" y="172" font-family="sans-serif" font-size="12" fill="#1f2937">all three keyed on inserted key count; each series treeifies (or not) per its own label</text>

  <!-- Chart panel -->
  <rect x="20" y="190" width="960" height="580" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>

  <!-- Y gridlines + labels: value -> y :: 0.1->710, 1->590, 10->470, 100->350, 1000->230 -->
  <line x1="160" y1="710" x2="920" y2="710" stroke="#737373" stroke-width="2"/>
  <line x1="160" y1="590" x2="920" y2="590" stroke="#737373" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="470" x2="920" y2="470" stroke="#737373" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="350" x2="920" y2="350" stroke="#737373" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="230" x2="920" y2="230" stroke="#737373" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="160" y1="230" x2="160" y2="710" stroke="#737373" stroke-width="2"/>

  <text x="152" y="714" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f2937">0.1</text>
  <text x="152" y="594" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f2937">1</text>
  <text x="152" y="474" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f2937">10</text>
  <text x="152" y="354" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f2937">100</text>
  <text x="152" y="234" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1f2937">1000</text>

  <!-- Y axis title (rotated), on its own backing rect -->
  <rect x="55" y="380" width="30" height="180" fill="#e5e7eb"/>
  <text x="70" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937"
        transform="rotate(-90 70 470)">total insert time, ms &#8212; LOG SCALE</text>

  <!-- X labels -->
  <text x="160" y="728" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1,000</text>
  <text x="350" y="728" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2,000</text>
  <text x="540" y="728" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">5,000</text>
  <text x="730" y="728" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">10,000</text>
  <text x="920" y="728" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">20,000</text>
  <text x="540" y="752" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">number of inserted keys, all with identical hashCode() &#8212; x-axis: linear index spacing</text>

  <!-- Series 1: plain chain, red, solid -->
  <polyline points="160,604.3 350,532.2 540,433.4 730,360.4 920,290.6" fill="none" stroke="#fee2e2" stroke-width="4"/>
  <polyline points="160,604.3 350,532.2 540,433.4 730,360.4 920,290.6" fill="none" stroke="#525252" stroke-width="1" opacity="1" stroke-dasharray="1 0"/>
  <circle cx="160" cy="604.3" r="4.5" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>
  <circle cx="350" cy="532.2" r="4.5" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>
  <circle cx="540" cy="433.4" r="4.5" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>
  <circle cx="730" cy="360.4" r="4.5" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>
  <circle cx="920" cy="290.6" r="4.5" fill="#fee2e2" stroke="#525252" stroke-width="1.5"/>

  <!-- Series 2: treeified comparable, green, dashed -->
  <polyline points="160,671.3 350,635.2 540,626.1 730,589.5 920,552.3" fill="none" stroke="#dcfce7" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="160" cy="671.3" r="4.5" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="350" cy="635.2" r="4.5" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="540" cy="626.1" r="4.5" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="730" cy="589.5" r="4.5" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="920" cy="552.3" r="4.5" fill="#dcfce7" stroke="#525252" stroke-width="1.5"/>

  <!-- Series 3: treeified not comparable, amber, dotted -->
  <polyline points="160,602.3 350,531.0 540,418.9 730,338.2 920,263.2" fill="none" stroke="#fef3c7" stroke-width="4" stroke-dasharray="2 6"/>
  <circle cx="160" cy="602.3" r="4.5" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="350" cy="531.0" r="4.5" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="540" cy="418.9" r="4.5" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="730" cy="338.2" r="4.5" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>
  <circle cx="920" cy="263.2" r="4.5" fill="#fef3c7" stroke="#525252" stroke-width="1.5"/>

  <!-- Direct end labels -->
  <rect x="850" y="270" width="70" height="18" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="885" y="283" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">528.72 ms</text>
  <rect x="850" y="299" width="70" height="18" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="885" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">312.33 ms</text>
  <rect x="850" y="530" width="70" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="1"/>
  <text x="885" y="543" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2.06 ms</text>

  <!-- Annotation: series 1 quadrupling -->
  <rect x="20" y="790" width="470" height="100" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="38" y="810" font-family="sans-serif" font-size="13" fill="#1f2937">plain chain &#8212; the O(n&#178;) signature:</text>
  <text x="38" y="830" font-family="sans-serif" font-size="13" fill="#1f2937">5k&#8594;10k: 20.18 &#8594; 81.84 ms (&#215;4.05)</text>
  <text x="38" y="850" font-family="sans-serif" font-size="13" fill="#1f2937">10k&#8594;20k: 81.84 &#8594; 312.33 ms (&#215;3.82)</text>
  <text x="38" y="870" font-family="sans-serif" font-size="13" fill="#1f2937">time roughly quadruples when n doubles</text>

  <!-- Annotation: series 2 -->
  <rect x="510" y="790" width="470" height="100" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="528" y="810" font-family="sans-serif" font-size="13" fill="#1f2937">treeified, Comparable &#8212; merely doubles when n doubles:</text>
  <text x="528" y="830" font-family="sans-serif" font-size="13" fill="#1f2937">5k&#8594;10k: 0.50 &#8594; 1.01 ms</text>
  <text x="528" y="850" font-family="sans-serif" font-size="13" fill="#1f2937">10k&#8594;20k: 1.01 &#8594; 2.06 ms</text>
  <text x="528" y="870" font-family="sans-serif" font-size="13" fill="#1f2937">at 20,000 keys: 2.06 ms vs 312.33 ms &#8212; 152&#215; faster</text>

  <!-- Annotation: series 3 explanation -->
  <rect x="20" y="908" width="960" height="150" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="38" y="930" font-family="sans-serif" font-size="13" fill="#1f2937">treeified but keys NOT Comparable &#8212; still O(n&#178;), and worse than not treeifying at all:</text>
  <text x="38" y="950" font-family="sans-serif" font-size="13" fill="#1f2937">528.72 ms at 20,000 keys &#8212; 1.7&#215; SLOWER than the plain chain (312.33 ms).</text>
  <text x="38" y="972" font-family="sans-serif" font-size="13" fill="#1f2937">Why: a treeified bin can only use compareTo() if comparableClassFor(key) returns non-null &#8212;</text>
  <text x="38" y="992" font-family="sans-serif" font-size="13" fill="#1f2937">i.e. the key class directly implements Comparable&lt;itself&gt;. Otherwise putTreeVal() falls back to</text>
  <text x="38" y="1012" font-family="sans-serif" font-size="13" fill="#1f2937">tieBreakOrder(), which orders by class name then System.identityHashCode() &#8212; unrelated to the</text>
  <text x="38" y="1032" font-family="sans-serif" font-size="13" fill="#1f2937">key, so find() must search BOTH subtrees: pay the O(n&#178;) scan, plus 56 bytes/TreeNode vs 32.</text>

  <!-- Provenance box -->
  <rect x="20" y="1070" width="470" height="100" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="38" y="1090" font-family="sans-serif" font-size="13" fill="#1f2937">Measured: Apple M4 Pro, JDK 21.0.7+8-LTS-245, arm64.</text>
  <text x="38" y="1108" font-family="sans-serif" font-size="13" fill="#1f2937">Median of three runs.</text>
  <text x="38" y="1126" font-family="sans-serif" font-size="13" fill="#1f2937">Single-shot wall clock, not JMH &#8212; the shape is the</text>
  <text x="38" y="1144" font-family="sans-serif" font-size="13" fill="#1f2937">finding, not the absolute numbers.</text>

  <!-- CVE box -->
  <rect x="510" y="1070" width="470" height="100" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="528" y="1090" font-family="sans-serif" font-size="13" fill="#1f2937">CVE-2011-4858 &#8212; Apache Tomcat, hash-collision DoS via</text>
  <text x="528" y="1108" font-family="sans-serif" font-size="13" fill="#1f2937">crafted POST parameter names (28C3, Klink &amp; W&#228;lde, 2011).</text>
  <text x="528" y="1126" font-family="sans-serif" font-size="13" fill="#1f2937">Fixed by capping parameter counts; the JDK's own answer</text>
  <text x="528" y="1144" font-family="sans-serif" font-size="13" fill="#1f2937">was treeification in Java 8.</text>
</svg>
