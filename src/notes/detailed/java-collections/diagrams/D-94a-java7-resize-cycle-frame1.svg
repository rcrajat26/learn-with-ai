<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Java 7 concurrent resize cycle frame 1 of 4: initial state, two threads about to transfer the same bin">
  <defs>
    <marker id="arrow94a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">Java 7's concurrent-resize cycle -- frame 1 of 4</text>

  <!-- code box -->
  <rect x="40" y="48" width="820" height="96" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="70" font-family="sans-serif" font-size="13" fill="#1f2937">
    <tspan x="60" dy="0">Entry&lt;K,V&gt; next = e.next;</tspan>
    <tspan x="60" dy="20">int i = indexFor(e.hash, newCapacity);</tspan>
    <tspan x="60" dy="20">e.next = newTable[i];</tspan>
    <tspan x="60" dy="20">newTable[i] = e;</tspan>
  </text>

  <!-- old table -->
  <rect x="60" y="165" width="340" height="130" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">old table, bin[i]</text>

  <rect x="90" y="210" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="125" y="235" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
  <line x1="160" y1="230" x2="210" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow94a)"/>
  <rect x="210" y="210" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="245" y="235" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
  <line x1="280" y1="230" x2="330" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow94a)"/>
  <text x="345" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
  <text x="230" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">A -&gt; B -&gt; null</text>

  <!-- new table -->
  <rect x="500" y="165" width="340" height="130" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="670" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">new table (both threads' own copies)</text>
  <text x="670" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">not written yet</text>

  <!-- T1 / T2 status -->
  <rect x="60" y="330" width="340" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">T1</text>
  <text x="230" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">about to transfer bin[i]</text>

  <rect x="500" y="330" width="340" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="670" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">T2</text>
  <text x="670" y="380" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">about to transfer bin[i]</text>

  <!-- write log -->
  <rect x="60" y="430" width="780" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="450" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">pointer writes so far: none</text>
  <text x="450" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">both threads are racing on the same source bin, each transferring into its own newTable</text>
</svg>
