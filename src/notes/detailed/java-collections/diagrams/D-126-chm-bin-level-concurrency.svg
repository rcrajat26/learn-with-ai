<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ConcurrentHashMap bin-level concurrency: an empty bin filled by casTabAt with no lock, a populated bin locked via synchronized on its head node during putVal, two threads working on different bins at the same time, and a reader doing a volatile tabAt read through a locked bin without blocking">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ConcurrentHashMap Bin-Level Concurrency</text>

  <rect x="20" y="60" width="760" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">transient volatile Node&lt;K,V&gt;[] table (:778) · tabAt (:759-761) · casTabAt (:763-766) · synchronized(f) in putVal (:1031)</text>

  <text x="400" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">(6 of N bins shown)</text>

  <!-- Bins -->
  <rect x="63" y="134" width="100" height="70" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="113" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 0</text>
  <text x="113" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">null → new Node</text>
  <text x="113" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(CAS install)</text>
  <text x="113" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 0</text>

  <rect x="178" y="134" width="100" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="228" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 1</text>
  <text x="228" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(empty)</text>
  <text x="228" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 1</text>

  <rect x="293" y="134" width="100" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="343" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 2</text>
  <text x="343" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head f → next</text>
  <text x="343" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LOCKED (f)</text>
  <text x="343" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 2</text>

  <rect x="408" y="134" width="100" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="458" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 3</text>
  <text x="458" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 3</text>

  <rect x="523" y="134" width="100" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="573" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 4</text>
  <text x="573" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 4</text>

  <rect x="638" y="134" width="100" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="688" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 5</text>
  <text x="688" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">index 5</text>

  <!-- Arrows: threads acting on bins -->
  <line x1="173" y1="258" x2="118" y2="204" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="258" x2="308" y2="204" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="258" x2="383" y2="204" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="43" y="210" width="200" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="143" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">casTabAt(tab,0,null,node) — no lock</text>

  <rect x="271" y="210" width="180" height="18" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="361" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">synchronized(f) in putVal :1031</text>

  <rect x="411" y="232" width="210" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="516" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">tabAt(tab,2) — volatile read, no block</text>

  <!-- Thread boxes -->
  <rect x="63" y="258" width="220" height="92" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="173" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread A (writer)</text>
  <text x="173" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">putVal sees bin 0 empty</text>
  <text x="173" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">installs head via CAS,</text>
  <text x="173" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no monitor taken</text>

  <rect x="310" y="258" width="220" height="92" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="420" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread B (writer)</text>
  <text x="420" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">putVal sees bin 2 non-empty</text>
  <text x="420" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">takes synchronized(f) on the</text>
  <text x="420" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin's head node, then appends</text>

  <rect x="560" y="258" width="180" height="92" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="650" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread C (reader)</text>
  <text x="650" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">get(key) on bin 2</text>
  <text x="650" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">calls tabAt — never takes</text>
  <text x="650" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">f's monitor</text>

  <rect x="40" y="364" width="720" height="50" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="400" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Reader C: tabAt(tab,2) is a volatile-acquire array read (U.getReferenceAcquire, :759-761).</text>
  <text x="400" y="401" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">It is never blocked by Thread B's synchronized(f) in putVal (:1031) — readers never wait on writers.</text>

  <!-- Legend -->
  <rect x="40" y="430" width="20" height="20" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="70" y="445" font-family="sans-serif" font-size="12" fill="#1f2937">locked bin — synchronized(f) held by a writer</text>

  <rect x="40" y="460" width="20" height="20" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="70" y="475" font-family="sans-serif" font-size="12" fill="#1f2937">CAS bin — casTabAt install, no lock taken</text>

  <rect x="40" y="490" width="20" height="20" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="70" y="505" font-family="sans-serif" font-size="12" fill="#1f2937">reader path — tabAt volatile read, never blocks</text>
</svg>
