<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory layout comparison of TreeMap.Entry at 40 bytes versus HashMap.Node at 32 bytes, drawn to scale">
  <rect x="20" y="20" width="760" height="24" rx="3" fill="#e5e7eb"/>
  <text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">TreeMap.Entry vs HashMap.Node — object layout, drawn to scale (4px per byte)</text>

  <!-- column headers -->
  <rect x="150" y="60" width="200" height="20" rx="3" fill="#dbeafe"/>
  <text x="250" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TreeMap.Entry — 40 bytes</text>
  <rect x="450" y="60" width="200" height="20" rx="3" fill="#dbeafe"/>
  <text x="550" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">HashMap.Node — 32 bytes</text>

  <!-- TreeMap.Entry stack, starts y=90 -->
  <g stroke="#737373" stroke-width="2">
    <rect x="150" y="90" width="200" height="48" fill="#e5e7eb"/>
    <rect x="150" y="138" width="200" height="16" fill="#dbeafe"/>
    <rect x="150" y="154" width="200" height="16" fill="#dbeafe"/>
    <rect x="150" y="170" width="200" height="16" fill="#dbeafe"/>
    <rect x="150" y="186" width="200" height="16" fill="#dbeafe"/>
    <rect x="150" y="202" width="200" height="16" fill="#dbeafe"/>
    <rect x="150" y="218" width="200" height="4" fill="#fef3c7"/>
    <rect x="150" y="222" width="200" height="28" fill="#fee2e2"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="250" y="118" text-anchor="middle">object header — 12 bytes</text>
    <text x="360" y="150">key ref — 4 bytes</text>
    <text x="360" y="166">value ref — 4 bytes</text>
    <text x="360" y="182">left ref — 4 bytes</text>
    <text x="360" y="198">right ref — 4 bytes</text>
    <text x="360" y="214">parent ref — 4 bytes</text>
    <text x="360" y="240" font-size="11">colour byte (1) + padding (7)</text>
  </g>

  <rect x="150" y="255" width="200" height="20" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="250" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">total = 40 bytes (8-byte aligned)</text>

  <!-- HashMap.Node stack, starts y=90 -->
  <g stroke="#737373" stroke-width="2">
    <rect x="450" y="90" width="200" height="48" fill="#e5e7eb"/>
    <rect x="450" y="138" width="200" height="16" fill="#dbeafe"/>
    <rect x="450" y="154" width="200" height="16" fill="#dbeafe"/>
    <rect x="450" y="170" width="200" height="16" fill="#dbeafe"/>
    <rect x="450" y="186" width="200" height="16" fill="#dbeafe"/>
    <rect x="450" y="202" width="200" height="16" fill="#fef3c7"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="550" y="118" text-anchor="middle">object header — 12 bytes</text>
    <text x="660" y="150">hash (int) — 4 bytes</text>
    <text x="660" y="166">key ref — 4 bytes</text>
    <text x="660" y="182">value ref — 4 bytes</text>
    <text x="660" y="198">next ref — 4 bytes</text>
    <text x="660" y="214" font-size="11">padding — 4 bytes</text>
  </g>

  <rect x="450" y="223" width="200" height="20" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="550" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">28 bytes → rounds up to 32</text>

  <!-- ghost bar to show the extra 8 bytes TreeMap.Entry costs, aligned at same baseline -->
  <rect x="450" y="243" width="200" height="7" fill="#e5e7eb" stroke="#737373" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="20" y="310" width="760" height="30" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TreeMap.Entry carries left/right/parent + colour for the red-black shape; HashMap.Node only needs next for its bin chain</text>

  <rect x="20" y="350" width="760" height="30" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Result: 40 vs 32 bytes per entry — TreeMap costs 25% more heap per key-value pair than HashMap</text>
</svg>
