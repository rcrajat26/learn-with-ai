<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Why equal objects must have equal hashCodes: put(k1) lands in bucket 5, but get(k2) with a mismatched hash probes bucket 12 and misses, leaving the equal entry unreachable and never calling equals">
  <defs>
    <marker id="arrow15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Contract violation: equal objects with unequal hashCodes strand entries in HashMap</text>
  <rect x="20" y="70" width="260" height="20" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150.0" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 -- put(k1, v)</text>
  <rect x="20" y="100" width="260" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150.0" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash(k1) = A</text>
  <text x="150.0" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bucket = A &amp; 15 = 5</text>
  <line x1="150.0" y1="146" x2="150.0" y2="180" stroke="#737373" stroke-width="2" marker-end="url(#arrow15)"/>
  <rect x="85" y="182" width="130" height="46" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">stored in</text>
  <text x="150" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bucket 5: k1 -&gt; v</text>
  <text x="150.0" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">table buckets 0-15</text>
