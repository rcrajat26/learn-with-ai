<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Diagram of a hand-rolled LRU cache built from a HashMap mapping keys to nodes of a doubly-linked list with sentinel head and tail nodes. Shows get(B) performing an O(1) map lookup then unlinking and relinking B at the tail with six numbered pointer writes, and put(D) past capacity evicting the node after the head sentinel with two numbered pointer writes, then linking the new node before the tail sentinel.">
  <defs>
    <marker id="arrow148" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowRed148" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="960" height="42" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="500" y="47" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1f2937">LRU by hand: HashMap + doubly-linked list</text>

  <!-- ============ STRUCTURE SECTION ============ -->
  <!-- Map container -->
  <rect x="205" y="78" width="520" height="92" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="465" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">map: key -&gt; node, O(1) lookup</text>
  <rect x="225" y="108" width="120" height="45" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="1.5"/>
  <text x="285" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A -&gt; node A</text>
  <rect x="405" y="108" width="120" height="45" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="1.5"/>
  <text x="465" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B -&gt; node B</text>
  <rect x="585" y="108" width="120" height="45" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="1.5"/>
  <text x="645" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C -&gt; node C</text>

  <!-- arrows from bins down into nodes (value is a pointer into the node, not a copy) -->
  <line x1="285" y1="153" x2="285" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="465" y1="153" x2="465" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="645" y1="153" x2="645" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <rect x="770" y="150" width="180" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="1"/>
  <text x="860" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pointer into node, not a copy</text>

  <!-- List row: HEAD, A, B, C, TAIL -->
  <rect x="100" y="190" width="90" height="100" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="145" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">HEAD</text>
  <text x="145" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(sentinel)</text>
  <text x="145" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no key/value</text>
  <text x="145" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev: n/a</text>
  <text x="145" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next: A</text>

  <rect x="210" y="190" width="150" height="100" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="285" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
  <text x="285" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">K key = A</text>
  <text x="285" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">V value = valA</text>
  <text x="285" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node prev -&gt; HEAD</text>
  <text x="285" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node next -&gt; B</text>

  <rect x="390" y="190" width="150" height="100" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="465" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
  <text x="465" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">K key = B</text>
  <text x="465" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">V value = valB</text>
  <text x="465" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node prev -&gt; A</text>
  <text x="465" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node next -&gt; C</text>

  <rect x="570" y="190" width="150" height="100" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="645" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>
  <text x="645" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">K key = C</text>
  <text x="645" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">V value = valC</text>
  <text x="645" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node prev -&gt; B</text>
  <text x="645" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node next -&gt; TAIL</text>

  <rect x="750" y="190" width="90" height="100" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="795" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TAIL</text>
  <text x="795" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(sentinel)</text>
  <text x="795" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no key/value</text>
  <text x="795" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev: C</text>
  <text x="795" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next: n/a</text>

  <!-- next / prev arrow rows in the gaps -->
  <line x1="190" y1="212" x2="210" y2="212" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="360" y1="212" x2="390" y2="212" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="540" y1="212" x2="570" y2="212" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="720" y1="212" x2="750" y2="212" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="210" y1="252" x2="190" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="390" y1="252" x2="360" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="570" y1="252" x2="540" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <line x1="750" y1="252" x2="720" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <rect x="90" y="196" width="40" height="16" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="110" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next</text>
  <rect x="90" y="244" width="40" height="16" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="110" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev</text>

  <!-- Sentinel purpose caption -->
  <rect x="100" y="300" width="740" height="42" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="470" y="317" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">two sentinels mean unlink and relink never test for null &#8212;</text>
  <text x="470" y="334" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">no head/tail special cases, which is where hand-rolled LRUs get their bugs</text>

  <!-- ============ get(B) PANEL ============ -->
  <rect x="20" y="352" width="960" height="28" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="40" y="371" font-family="sans-serif" font-size="15" fill="#1f2937">get(B) &#8212; O(1) map lookup, then unlink and relink at the tail (MRU end)</text>

  <rect x="60" y="392" width="90" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="105" y="416" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">map[B]</text>
  <rect x="270" y="392" width="90" height="40" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="315" y="416" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">node B</text>
  <line x1="150" y1="412" x2="270" y2="412" stroke="#737373" stroke-width="2" marker-end="url(#arrow148)"/>
  <rect x="120" y="384" width="240" height="16" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="1"/>
  <text x="240" y="396" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">step 1: O(1) map lookup, no list walk</text>

  <!-- before mini list -->
  <text x="40" y="452" font-family="sans-serif" font-size="12" fill="#1f2937">before:</text>
  <rect x="80" y="458" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="115" y="481" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">HEAD</text>
  <rect x="170" y="458" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="205" y="481" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <rect x="260" y="458" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="2.5"/>
  <text x="295" y="481" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <rect x="350" y="458" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="385" y="481" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>
  <rect x="440" y="458" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="475" y="481" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TAIL</text>

  <!-- numbered writes box -->
  <rect x="560" y="392" width="420" height="150" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="578" y="411" font-family="sans-serif" font-size="12" fill="#1f2937">unlink B, relink before TAIL &#8212; six writes:</text>
  <text x="578" y="430" font-family="sans-serif" font-size="12" fill="#1f2937">(1) B.prev.next = B.next  &#8594;  A.next = C</text>
  <text x="578" y="448" font-family="sans-serif" font-size="12" fill="#1f2937">(2) B.next.prev = B.prev  &#8594;  C.prev = A</text>
  <text x="578" y="466" font-family="sans-serif" font-size="12" fill="#1f2937">(3) B.prev = tail.prev  &#8594;  B.prev = C</text>
  <text x="578" y="484" font-family="sans-serif" font-size="12" fill="#1f2937">(4) B.next = tail</text>
  <text x="578" y="502" font-family="sans-serif" font-size="12" fill="#1f2937">(5) tail.prev.next = B  &#8594;  C.next = B</text>
  <text x="578" y="520" font-family="sans-serif" font-size="12" fill="#1f2937">(6) tail.prev = B</text>

  <!-- after mini list -->
  <text x="40" y="532" font-family="sans-serif" font-size="12" fill="#1f2937">after:</text>
  <rect x="80" y="538" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="115" y="561" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">HEAD</text>
  <rect x="170" y="538" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="205" y="561" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <rect x="260" y="538" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="295" y="561" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>
  <rect x="350" y="538" width="70" height="38" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2.5"/>
  <text x="385" y="561" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <rect x="440" y="538" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="475" y="561" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TAIL</text>

  <rect x="560" y="552" width="420" height="34" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="770" y="573" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">O(1) &#8212; six reference writes, independent of list size</text>

  <rect x="80" y="592" width="430" height="26" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="1.5"/>
  <text x="295" y="609" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">resulting order: A, C, B</text>

  <!-- ============ put(D) PANEL ============ -->
  <rect x="20" y="630" width="960" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="649" font-family="sans-serif" font-size="15" fill="#1f2937">put(D) past capacity 3 &#8212; evict, then insert</text>

  <text x="40" y="700" font-family="sans-serif" font-size="12" fill="#1f2937">before (full, order A, C, B):</text>
  <rect x="80" y="670" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="115" y="693" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">HEAD</text>
  <rect x="170" y="670" width="70" height="38" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2.5"/>
  <text x="205" y="693" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <rect x="260" y="670" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="295" y="693" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>
  <rect x="350" y="670" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="385" y="693" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <rect x="440" y="670" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="475" y="693" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TAIL</text>
  <rect x="70" y="716" width="220" height="16" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="180" y="728" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">victim = head.next = A</text>

  <!-- numbered writes box for eviction + insert -->
  <rect x="560" y="670" width="420" height="150" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="578" y="689" font-family="sans-serif" font-size="12" fill="#1f2937">evict A, insert D:</text>
  <text x="578" y="707" font-family="sans-serif" font-size="12" fill="#1f2937">Node victim = head.next;  // = A</text>
  <text x="578" y="725" font-family="sans-serif" font-size="12" fill="#1f2937">map.remove(victim.key);  // removes A</text>
  <text x="578" y="743" font-family="sans-serif" font-size="12" fill="#1f2937">(7) head.next = A.next;  &#8594;  head.next = C</text>
  <text x="578" y="761" font-family="sans-serif" font-size="12" fill="#1f2937">(8) C.prev = head;</text>
  <text x="578" y="779" font-family="sans-serif" font-size="12" fill="#1f2937">then link D before TAIL (same 6-write pattern as get)</text>

  <text x="40" y="832" font-family="sans-serif" font-size="12" fill="#1f2937">after (order C, B, D):</text>
  <rect x="80" y="800" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="115" y="823" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">HEAD</text>
  <rect x="170" y="800" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="205" y="823" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>
  <rect x="260" y="800" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="295" y="823" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <rect x="350" y="800" width="70" height="38" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2.5"/>
  <text x="385" y="823" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">D</text>
  <rect x="440" y="800" width="70" height="38" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="475" y="823" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TAIL</text>

  <rect x="600" y="800" width="90" height="38" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="645" y="815" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">A</text>
  <text x="645" y="828" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(evicted)</text>
  <line x1="205" y1="798" x2="620" y2="800" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowRed148)"/>

  <rect x="60" y="848" width="880" height="44" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="500" y="864" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">head.next is always the victim &#8212; that is the entire reason the sentinel exists</text>
  <text x="500" y="882" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">final order: C, B, D  |  size = 3</text>

  <!-- Closing note -->
  <rect x="20" y="906" width="960" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="500" y="928" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Two structures, one set of objects. The map gives O(1) find; the list gives O(1) reorder.</text>
  <text x="500" y="948" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Neither alone gives both, which is why every LRU is this pair.</text>
</svg>
