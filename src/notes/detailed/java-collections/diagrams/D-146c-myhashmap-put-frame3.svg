<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 4: chain append with the three-stage hash, reference, equals short-circuit, compared side by side">
  <text x="480" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">MyHashMap.put traced against the JDK -- frame 3 of 4</text>
  <text x="480" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Chain append with the hash-then-reference-then-equals short-circuit</text>

  <!-- left half -->
  <rect x="30" y="65" width="440" height="530" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">MyHashMap</text>

  <text x="46" y="108" font-family="sans-serif" font-size="11" fill="#1f2937">bin already holds 2 nodes; put a 3rd colliding key</text>

  <rect x="46" y="118" width="410" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="52" y="136" font-family="sans-serif" font-size="10.5" fill="#1f2937">e.hash == hash &amp;&amp; ((k = e.key) == key ||</text>
  <text x="52" y="152" font-family="sans-serif" font-size="10.5" fill="#1f2937">(key != null &amp;&amp; key.equals(k)))</text>

  <rect x="46" y="172" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="52" y="190" font-family="sans-serif" font-size="11" fill="#1f2937">(1) e.hash == hash -- int compare rejects</text>
  <text x="52" y="206" font-family="sans-serif" font-size="11" fill="#1f2937">almost every non-match for free (cached hash)</text>

  <rect x="46" y="222" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="52" y="240" font-family="sans-serif" font-size="11" fill="#1f2937">(2) (k = e.key) == key -- reference identity;</text>
  <text x="52" y="256" font-family="sans-serif" font-size="11" fill="#1f2937">instant for interned strings/enums/cached boxes</text>

  <rect x="46" y="272" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="52" y="290" font-family="sans-serif" font-size="11" fill="#1f2937">(3) key.equals(k) -- only branch calling user</text>
  <text x="52" y="306" font-family="sans-serif" font-size="11" fill="#1f2937">code; only one that can be slow or throw</text>

  <rect x="46" y="330" width="410" height="30" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="251" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">binCount++  (chain depth counter)</text>

  <g font-family="sans-serif">
    <rect x="60" y="375" width="70" height="40" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="95" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n1</text>
    <rect x="160" y="375" width="70" height="40" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="195" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n2</text>
    <rect x="260" y="375" width="70" height="40" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="295" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n3 (new)</text>
    <line x1="130" y1="395" x2="158" y2="395" stroke="#737373" stroke-width="2"/>
    <line x1="230" y1="395" x2="258" y2="395" stroke="#737373" stroke-width="2"/>
  </g>

  <!-- right half -->
  <rect x="490" y="65" width="440" height="530" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">java.util.HashMap</text>

  <text x="506" y="108" font-family="sans-serif" font-size="11" fill="#1f2937">bin already holds 2 nodes; put a 3rd colliding key</text>

  <rect x="506" y="118" width="410" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="512" y="136" font-family="sans-serif" font-size="10.5" fill="#1f2937">e.hash == hash &amp;&amp; ((k = e.key) == key ||</text>
  <text x="512" y="152" font-family="sans-serif" font-size="10.5" fill="#1f2937">(key != null &amp;&amp; key.equals(k)))</text>

  <rect x="506" y="172" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="512" y="190" font-family="sans-serif" font-size="11" fill="#1f2937">(1) e.hash == hash -- int compare rejects</text>
  <text x="512" y="206" font-family="sans-serif" font-size="11" fill="#1f2937">almost every non-match for free (cached hash)</text>

  <rect x="506" y="222" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="512" y="240" font-family="sans-serif" font-size="11" fill="#1f2937">(2) (k = e.key) == key -- reference identity;</text>
  <text x="512" y="256" font-family="sans-serif" font-size="11" fill="#1f2937">instant for interned strings/enums/cached boxes</text>

  <rect x="506" y="272" width="410" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="512" y="290" font-family="sans-serif" font-size="11" fill="#1f2937">(3) key.equals(k) -- only branch calling user</text>
  <text x="512" y="306" font-family="sans-serif" font-size="11" fill="#1f2937">code; only one that can be slow or throw</text>

  <rect x="506" y="330" width="410" height="30" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="711" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">binCount++  (chain depth counter, treeify check)</text>

  <g font-family="sans-serif">
    <rect x="520" y="375" width="70" height="40" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="555" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n1</text>
    <rect x="620" y="375" width="70" height="40" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="655" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n2</text>
    <rect x="720" y="375" width="70" height="40" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="755" y="399" text-anchor="middle" font-size="13" fill="#1f2937">n3 (new)</text>
    <line x1="590" y1="395" x2="618" y2="395" stroke="#737373" stroke-width="2"/>
    <line x1="690" y1="395" x2="718" y2="395" stroke="#737373" stroke-width="2"/>
  </g>

  <rect x="46" y="435" width="864" height="140" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="62" y="460" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Structurally identical -- no simplification marked.</text>
  <text x="62" y="485" font-family="sans-serif" font-size="12" fill="#1f2937">Both walk the collision chain with the same three-stage short-circuit: a cheap int</text>
  <text x="62" y="505" font-family="sans-serif" font-size="12" fill="#1f2937">hash compare, then reference identity, and only as a last resort user-defined equals().</text>
  <text x="62" y="525" font-family="sans-serif" font-size="12" fill="#1f2937">binCount tracks chain depth; java.util.HashMap additionally uses it to trigger treeification</text>
  <text x="62" y="545" font-family="sans-serif" font-size="12" fill="#1f2937">at TREEIFY_THRESHOLD (8) -- see frame 4's SIMPLIFIED note for the tree-bin path.</text>
</svg>
