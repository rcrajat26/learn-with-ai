<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Why enum-keyed HashMap is worse: across two JVM runs, enum identity hash codes differ so HashMap bucket assignment and iteration order differ, while EnumMap uses ordinal() directly and gives identical order in both runs">

  <defs>
    <marker id="arrow116" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="760" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Why enum-keyed HashMap is worse: identity hashCode drives order</text>

  <!-- Fact box -->
  <rect x="20" y="62" width="760" height="50" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">java.lang.Enum does NOT override hashCode() &#8212; it is Object.hashCode(), the JVM identity hash</text>
  <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Identity hash values are not guaranteed stable across JVM runs of the same program</text>

  <!-- Row 1 col 1: HashMap Run1 -->
  <rect x="20" y="122" width="360" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="200" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JVM Run 1 &#8212; HashMap&lt;Day,V&gt;</text>
  <text x="32" y="164" font-family="sans-serif" font-size="11" fill="#1f2937">MON.hashCode() = 0x1a2b3c (identity)</text>
  <text x="32" y="182" font-family="sans-serif" font-size="11" fill="#1f2937">WED.hashCode() = 0x77aa10</text>
  <text x="32" y="200" font-family="sans-serif" font-size="11" fill="#1f2937">SAT.hashCode() = 0x0fa933</text>
  <text x="32" y="222" font-family="sans-serif" font-size="12" fill="#1f2937">bucket index = spread(hash) &amp; (cap-1)</text>
  <text x="32" y="248" font-family="sans-serif" font-size="12" fill="#1f2937">iteration order: WED, SAT, MON, ...</text>

  <!-- Row 1 col 2: EnumMap Run1 -->
  <rect x="420" y="122" width="360" height="150" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JVM Run 1 &#8212; EnumMap&lt;Day,V&gt;</text>
  <text x="432" y="164" font-family="sans-serif" font-size="11" fill="#1f2937">MON.ordinal() = 0 (declaration order)</text>
  <text x="432" y="182" font-family="sans-serif" font-size="11" fill="#1f2937">WED.ordinal() = 2</text>
  <text x="432" y="200" font-family="sans-serif" font-size="11" fill="#1f2937">SAT.ordinal() = 5</text>
  <text x="432" y="222" font-family="sans-serif" font-size="12" fill="#1f2937">vals[key.ordinal()] &#8212; no hashCode() used</text>
  <text x="432" y="248" font-family="sans-serif" font-size="12" fill="#1f2937">iteration order: MON,TUE,WED,THU,FRI,SAT,SUN</text>

  <!-- Row 2 col 1: HashMap Run2 -->
  <rect x="20" y="282" width="360" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="200" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JVM Run 2 (new process) &#8212; HashMap&lt;Day,V&gt;</text>
  <text x="32" y="324" font-family="sans-serif" font-size="11" fill="#1f2937">MON.hashCode() = 0x5e9d21 (different!)</text>
  <text x="32" y="342" font-family="sans-serif" font-size="11" fill="#1f2937">WED.hashCode() = 0x2c410b</text>
  <text x="32" y="360" font-family="sans-serif" font-size="11" fill="#1f2937">SAT.hashCode() = 0x9931aa</text>
  <text x="32" y="382" font-family="sans-serif" font-size="12" fill="#1f2937">different hashes &#8594; different buckets</text>
  <text x="32" y="408" font-family="sans-serif" font-size="12" fill="#1f2937">iteration order: MON, TUE, SAT, ... (changed)</text>

  <!-- Row 2 col 2: EnumMap Run2 -->
  <rect x="420" y="282" width="360" height="150" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="302" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JVM Run 2 (new process) &#8212; EnumMap&lt;Day,V&gt;</text>
  <text x="432" y="324" font-family="sans-serif" font-size="11" fill="#1f2937">MON.ordinal() = 0 (fixed at compile time)</text>
  <text x="432" y="342" font-family="sans-serif" font-size="11" fill="#1f2937">WED.ordinal() = 2</text>
  <text x="432" y="360" font-family="sans-serif" font-size="11" fill="#1f2937">SAT.ordinal() = 5</text>
  <text x="432" y="382" font-family="sans-serif" font-size="12" fill="#1f2937">ordinal() never changes across runs</text>
  <text x="432" y="408" font-family="sans-serif" font-size="12" fill="#1f2937">iteration order: MON,TUE,WED,THU,FRI,SAT,SUN (same)</text>

  <!-- connectors -->
  <line x1="200" y1="272" x2="200" y2="282" stroke="#525252" stroke-width="2" marker-end="url(#arrow116)"/>
  <rect x="140" y="264" width="120" height="20" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="200" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">DIFFERENT order</text>

  <line x1="600" y1="272" x2="600" y2="282" stroke="#525252" stroke-width="2" marker-end="url(#arrow116)"/>
  <rect x="540" y="264" width="120" height="20" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">IDENTICAL order</text>

  <!-- bottom callout -->
  <rect x="20" y="442" width="760" height="38" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="465" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Cause: HashMap buckets on identity hash (unstable across runs); EnumMap indexes on ordinal() (fixed, deterministic)</text>

</svg>
