<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterInsertion case 1: red uncle triggers recolor of parent and uncle to black, grandparent to red, and recursion continues from the grandparent">
  <defs>
    <marker id="arrow106a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterInsertion — Case 1: red uncle (recolor + recurse up)</text>

  <rect x="20" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="75" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="140" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>

  <rect x="440" y="60" width="180" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="530" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">x = grandparent; loop continues</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER</text>

  <!-- BEFORE tree -->
  <line x1="160" y1="170" x2="110" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="160" y1="170" x2="210" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="110" y1="250" x2="80" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="160" cy="170" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="160" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="160" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="110" cy="250" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="110" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="110" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="210" cy="250" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="210" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="210" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="80" cy="330" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="80" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="80" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red (new)</text>

  <!-- AFTER tree -->
  <line x1="480" y1="170" x2="430" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="480" y1="170" x2="530" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="430" y1="250" x2="400" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="480" cy="170" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="480" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="430" cy="250" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="430" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="530" cy="250" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="530" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="530" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="400" cy="330" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="400" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <line x1="284" y1="230" x2="356" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow106a)"/>
  <rect x="270" y="200" width="100" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">recolor</text>

  <line x1="480" y1="142" x2="480" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow106a)"/>

  <rect x="40" y="400" width="560" height="80" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Uncle is red: recolor parent P and uncle U to black, grandparent G to red.</text>
  <text x="320" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">This pushes the "extra red" violation up the tree instead of fixing it locally.</text>
  <text x="320" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Loop resumes with x = G; G's own parent is now checked for a red-red conflict.</text>
</svg>
