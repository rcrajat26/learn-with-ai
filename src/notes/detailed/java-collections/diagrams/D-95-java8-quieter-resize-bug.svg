<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Java 8's quieter concurrent-resize bug: three distinct failure modes without the Java 7 infinite loop">
  <defs>
    <marker id="arrow95" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- banner -->
  <rect x="220" y="20" width="520" height="30" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">not an infinite loop, still a bug</text>

  <text x="480" y="76" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">Java 8's quieter concurrent-resize bug</text>
  <text x="480" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">lo/hi split builds two fresh lists and never re-heads an existing one -- no cycle -- but races still corrupt the map</text>

  <!-- COLUMN 1: lost entry -->
  <rect x="30" y="118" width="280" height="24" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="170" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1. a lost entry</text>

  <rect x="30" y="150" width="280" height="120" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">before</text>
  <text x="170" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">T1 and T2 each build</text>
  <text x="170" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">their own newTab and</text>
  <text x="170" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">race to assign the</text>
  <text x="170" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">shared field: table = newTab</text>

  <line x1="170" y1="270" x2="170" y2="292" stroke="#737373" stroke-width="2" marker-end="url(#arrow95)"/>

  <rect x="30" y="296" width="280" height="150" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="170" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">after</text>
  <rect x="55" y="330" width="230" height="50" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="170" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">loser's table = newTab</text>
  <text x="170" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">is overwritten by winner</text>
  <text x="170" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">entries silently gone --</text>
  <text x="170" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size still counts them,</text>
  <text x="170" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">so size() over-reports</text>

  <!-- COLUMN 2: resurrected removed entry -->
  <rect x="340" y="118" width="280" height="24" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2. a resurrected removed entry</text>

  <rect x="340" y="150" width="280" height="120" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="480" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">before</text>
  <text x="480" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">T1 removes key K from</text>
  <text x="480" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">the old bin while T2 is</text>
  <text x="480" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">mid-transfer, holding a</text>
  <text x="480" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">stale next into the old chain</text>

  <line x1="480" y1="270" x2="480" y2="292" stroke="#737373" stroke-width="2" marker-end="url(#arrow95)"/>

  <rect x="340" y="296" width="280" height="150" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="480" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">after</text>
  <rect x="365" y="330" width="230" height="50" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="480" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">K is relinked into the</text>
  <text x="480" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">new table via T2's stale local</text>
  <text x="480" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">removed, then re-linked</text>
  <text x="480" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">by a stale local --</text>
  <text x="480" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">get(K) returns after remove(K)</text>

  <!-- COLUMN 3: NPE site -->
  <rect x="650" y="118" width="280" height="24" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="790" y="135" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3. the NPE site</text>

  <rect x="650" y="150" width="280" height="120" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="790" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">before</text>
  <text x="790" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">resize()'s transfer loop</text>
  <text x="790" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">reads oldTab[j], then walks</text>
  <text x="790" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">e.next while another thread</text>
  <text x="790" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">concurrently reassigns table</text>

  <line x1="790" y1="270" x2="790" y2="292" stroke="#737373" stroke-width="2" marker-end="url(#arrow95)"/>

  <rect x="650" y="296" width="280" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="790" y="318" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">after</text>
  <rect x="675" y="330" width="230" height="50" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="790" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">oldTab[j] is nulled by</text>
  <text x="790" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">the other thread mid-walk</text>
  <text x="790" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">NullPointerException</text>
  <text x="790" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">in HashMap.resize /</text>
  <text x="790" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">in HashMap.putVal</text>

  <!-- closing line -->
  <rect x="30" y="470" width="900" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="480" y="498" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Java 8 removed the symptom that made the bug findable.</text>
  <text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Use ConcurrentHashMap.</text>
</svg>
