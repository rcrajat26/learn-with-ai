<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="IdentityHashMap's single flat Object array of length 64: key at index i, value at i+1, linear probing by 2 with wraparound, and the resize condition">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="30" y="35" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">One Object[] table, length = 2 * capacity. DEFAULT_CAPACITY = 32 -&gt; table.length = 64</text>
  <text x="30" y="55" font-family="sans-serif" font-size="13" fill="#1f2937">MINIMUM_CAPACITY = 4, MAXIMUM_CAPACITY = 1 &lt;&lt; 29. Key at index i, value at index i+1 (interleaved).</text>

  <!-- table cells: show indices 0..11 out of 64, with wraparound at end shown as ... 62,63 -->
  <g>
    <!-- index 0: empty -->
    <rect x="30" y="90" width="55" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="57" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
    <text x="57" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 0</text>

    <rect x="85" y="90" width="55" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="112" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
    <text x="112" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 1</text>

    <!-- key A at idx 2, value at idx 3 -->
    <rect x="140" y="90" width="55" height="40" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="167" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key A</text>
    <text x="167" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 2 = i</text>

    <rect x="195" y="90" width="55" height="40" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="222" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">val A</text>
    <text x="222" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 3 = i+1</text>

    <rect x="250" y="90" width="55" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="277" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
    <text x="277" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 4</text>

    <rect x="305" y="90" width="55" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="332" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
    <text x="332" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 5</text>

    <!-- key B collides at idx 2, resolved to idx 6/7 via probe -->
    <rect x="360" y="90" width="55" height="40" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="387" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key B</text>
    <text x="387" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 6 (probed)</text>

    <rect x="415" y="90" width="55" height="40" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="442" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">val B</text>
    <text x="442" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 7</text>

    <rect x="470" y="90" width="55" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="497" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">...</text>
    <text x="497" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 8..61</text>

    <!-- key C at idx 62, wraps to idx 0 on next probe -->
    <rect x="525" y="90" width="55" height="40" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="552" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key C</text>
    <text x="552" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 62</text>

    <rect x="580" y="90" width="55" height="40" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="607" y="114" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">val C</text>
    <text x="607" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 63</text>
  </g>

  <!-- collision explanation -->
  <text x="30" y="190" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">Collision: key B also hashes to idx 2 (occupied by key A)</text>
  <text x="30" y="210" font-family="sans-serif" font-size="13" fill="#1f2937">nextKeyIndex(i, len) = (i + 2 &lt; len ? i + 2 : 0) -- linear probe advances by 2 slots (one key/value pair)</text>

  <line x1="167" y1="130" x2="167" y2="235" stroke="#737373" stroke-width="2"/>
  <line x1="167" y1="235" x2="387" y2="235" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="220" y="222" width="120" height="24" rx="3" fill="#fef3c7"/>
  <text x="280" y="239" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">probe: i += 2 -&gt; idx 4, idx 6</text>

  <!-- wraparound illustration -->
  <text x="30" y="285" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">Wraparound: probing past idx 62/63 (last pair) returns to idx 0</text>
  <line x1="607" y1="130" x2="720" y2="270" stroke="#737373" stroke-width="2"/>
  <line x1="720" y1="270" x2="57" y2="270" stroke="#737373" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <rect x="330" y="255" width="220" height="24" rx="3" fill="#fef3c7"/>
  <text x="440" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">nextKeyIndex(62, 64) wraps: i + 2 == len -&gt; 0</text>

  <!-- hash function -->
  <text x="30" y="330" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">hash(x, length): index derived from System.identityHashCode, forced even</text>
  <rect x="30" y="345" width="600" height="30" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="330" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">((h &lt;&lt; 1) - (h &lt;&lt; 8)) &amp; (length - 1), where h = System.identityHashCode(x)</text>

  <!-- resize condition -->
  <text x="30" y="410" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">Resize trigger (IdentityHashMap.java): "optimized form of 3 * s"</text>
  <rect x="30" y="425" width="600" height="30" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="330" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if (s + (s &lt;&lt; 1) &gt; len &amp;&amp; resize(len)) continue;   where s = size + 1</text>
  <text x="330" y="465" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">i.e. 3 * (size+1) &gt; table.length triggers doubling to newCapacity = len (2x current capacity)</text>

  <rect x="30" y="480" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="330" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">resize(newCapacity): newLength = newCapacity * 2; halts at oldLength == 2 * MAXIMUM_CAPACITY</text>
</svg>
