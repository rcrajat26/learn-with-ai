<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frame 2: the fully built perfectly balanced 15-node tree from buildFromSorted, with the deepest level coloured red to fix black-height">
  <defs>
    <marker id="arrow109b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="24" rx="3" fill="#e5e7eb"/>
  <text x="320" y="37" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Result: perfectly balanced red-black tree, built bottom-up, zero rotations performed</text>

  <!-- edges: root 8 -> 4,12 -->
  <line x1="320" y1="100" x2="180" y2="200" stroke="#737373" stroke-width="2"/>
  <line x1="320" y1="100" x2="460" y2="200" stroke="#737373" stroke-width="2"/>
  <!-- level1 -> level2 -->
  <line x1="180" y1="200" x2="110" y2="320" stroke="#737373" stroke-width="2"/>
  <line x1="180" y1="200" x2="250" y2="320" stroke="#737373" stroke-width="2"/>
  <line x1="460" y1="200" x2="390" y2="320" stroke="#737373" stroke-width="2"/>
  <line x1="460" y1="200" x2="530" y2="320" stroke="#737373" stroke-width="2"/>
  <!-- level2 -> leaves -->
  <line x1="110" y1="320" x2="75" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="110" y1="320" x2="145" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="250" y1="320" x2="215" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="250" y1="320" x2="285" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="390" y1="320" x2="355" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="390" y1="320" x2="425" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="530" y1="320" x2="495" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="530" y1="320" x2="565" y2="440" stroke="#737373" stroke-width="2"/>

  <!-- root (black) -->
  <circle cx="320" cy="100" r="30" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="320" y="105" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">8 B</text>

  <!-- level 1 (black) -->
  <circle cx="180" cy="200" r="28" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="180" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">4 B</text>
  <circle cx="460" cy="200" r="28" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="460" y="205" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">12 B</text>

  <!-- level 2 (black) -->
  <circle cx="110" cy="320" r="26" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="110" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">2 B</text>
  <circle cx="250" cy="320" r="26" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="250" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">6 B</text>
  <circle cx="390" cy="320" r="26" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="390" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10 B</text>
  <circle cx="530" cy="320" r="26" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="530" y="325" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">14 B</text>

  <!-- level 3 leaves (red — coloured to fix black-height) -->
  <g fill="#fee2e2" stroke="#525252" stroke-width="2">
    <circle cx="75" cy="440" r="24"/>
    <circle cx="145" cy="440" r="24"/>
    <circle cx="215" cy="440" r="24"/>
    <circle cx="285" cy="440" r="24"/>
    <circle cx="355" cy="440" r="24"/>
    <circle cx="425" cy="440" r="24"/>
    <circle cx="495" cy="440" r="24"/>
    <circle cx="565" cy="440" r="24"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="75" y="445">1 R</text><text x="145" y="445">3 R</text><text x="215" y="445">5 R</text>
    <text x="285" y="445">7 R</text><text x="355" y="445">9 R</text><text x="425" y="445">11 R</text>
    <text x="495" y="445">13 R</text><text x="565" y="445">15 R</text>
  </g>

  <rect x="20" y="490" width="600" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="508" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">computeRedLevel(size) marks this deepest row RED so black-height stays uniform on every path to a leaf</text>

  <!-- legend -->
  <rect x="20" y="530" width="16" height="16" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="42" y="543" font-family="sans-serif" font-size="13" fill="#1f2937">B = black node</text>
  <rect x="180" y="530" width="16" height="16" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="202" y="543" font-family="sans-serif" font-size="13" fill="#1f2937">R = red node (fixes black-height)</text>

  <rect x="20" y="560" width="600" height="26" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="578" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">No node is ever rotated to reach this shape — recursion places every node in its final position directly</text>
</svg>
