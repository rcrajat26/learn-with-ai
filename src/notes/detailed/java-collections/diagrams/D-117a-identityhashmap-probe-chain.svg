<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1: IdentityHashMap linear probe chain — keys A, B, C all hash to index 2 and are linearly probed into slots 2, 4, 6 with step i += 2">
  <defs>
    <marker id="arrow117a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="24" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    Frame 1 of 3 — probe chain before deletion (table length = 8)
  </text>

  <!-- key slots idx 0,2,4,6 -->
  <rect x="60" y="110" width="140" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="130" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 0</text>
  <text x="130" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">(empty)</text>

  <rect x="260" y="110" width="140" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 2</text>
  <text x="330" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key A</text>

  <rect x="460" y="110" width="140" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="530" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 4</text>
  <text x="530" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key B</text>

  <rect x="660" y="110" width="120" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="720" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 6</text>
  <text x="720" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key C</text>

  <!-- hash arrow pointing into idx2 -->
  <line x1="330" y1="70" x2="330" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrow117a)"/>
  <rect x="180" y="46" width="300" height="24" rx="3" fill="#fef3c7"/>
  <text x="330" y="63" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    hash(A,8) = hash(B,8) = hash(C,8) = 2
  </text>

  <!-- probe arrows: A occupies 2 so B probes to 4, then C probes to 6 -->
  <line x1="400" y1="145" x2="458" y2="145" stroke="#737373" stroke-width="2" marker-end="url(#arrow117a)"/>
  <rect x="404" y="188" width="150" height="22" rx="3" fill="#fef3c7"/>
  <text x="479" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    slot 2 taken by A: i += 2
  </text>

  <line x1="600" y1="145" x2="658" y2="145" stroke="#737373" stroke-width="2" marker-end="url(#arrow117a)"/>
  <rect x="604" y="188" width="150" height="22" rx="3" fill="#fef3c7"/>
  <text x="679" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    slot 4 taken by B: i += 2
  </text>

  <rect x="60" y="230" width="720" height="46" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="420" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    nextKeyIndex(i, len) = (i + 2 &lt; len ? i + 2 : 0) — indices step by 2 (key/value pairs), wrapping to 0 at len = 8
  </text>
  <text x="420" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    Chain: idx 2 (A) → idx 4 (B) → idx 6 (C). Next probe from idx 6 wraps to idx 0 (currently empty).
  </text>
</svg>
