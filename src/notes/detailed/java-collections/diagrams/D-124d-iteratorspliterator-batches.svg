<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="IteratorSpliterator grows batch size arithmetically from BATCH_UNIT 1024, capped at MAX_BATCH 1 shift left 25">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="440" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">IteratorSpliterator: no size known, wraps an Iterator</text>

  <!-- growing bars -->
  <g transform="translate(60,70)">
    <rect x="0" y="150" width="30" height="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="15" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1</text>

    <rect x="45" y="130" width="30" height="40" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="60" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2</text>

    <rect x="90" y="100" width="30" height="70" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="105" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">4</text>

    <rect x="135" y="70" width="30" height="100" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="150" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">8</text>

    <rect x="180" y="40" width="30" height="130" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="195" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">...</text>

    <rect x="225" y="10" width="30" height="160" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="240" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1024</text>

    <rect x="270" y="10" width="30" height="160" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="285" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2048</text>

    <line x1="-10" y1="10" x2="330" y2="10" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="0" y="0" font-family="sans-serif" font-size="12" fill="#1f2937">MAX_BATCH ceiling = 1 &lt;&lt; 25 (33,554,432)</text>
  </g>

  <rect x="420" y="70" width="340" height="180" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="440" y="95" font-family="sans-serif" font-size="13" fill="#1f2937">Growth rule (each trySplit):</text>
  <text x="440" y="115" font-family="sans-serif" font-size="13" fill="#1f2937">n = min(batchSize + BATCH_UNIT,</text>
  <text x="440" y="133" font-family="sans-serif" font-size="13" fill="#1f2937">         est, MAX_BATCH)</text>
  <text x="440" y="155" font-family="sans-serif" font-size="13" fill="#1f2937">BATCH_UNIT = 1024 (arithmetic step)</text>
  <text x="440" y="173" font-family="sans-serif" font-size="13" fill="#1f2937">MAX_BATCH  = 1 &lt;&lt; 25 = 33,554,432</text>
  <text x="440" y="195" font-family="sans-serif" font-size="13" fill="#1f2937">Early batches are tiny (1,2,4,8...)</text>
  <text x="440" y="213" font-family="sans-serif" font-size="13" fill="#1f2937">so parallel work starts fast; later</text>
  <text x="440" y="231" font-family="sans-serif" font-size="13" fill="#1f2937">batches plateau at the cap so a</text>
  <text x="440" y="249" font-family="sans-serif" font-size="13" fill="#1f2937">single split never blocks forever.</text>
</svg>
