<svg viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Cost curve showing when CopyOnWriteArrayList stops beating a lock-based alternative, as a function of write ratio, for collection sizes 100, 10000 and 1000000, with crossovers derived from a simple cost model">
  <defs>
    <marker id="arrow133" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">When CoW stops being a good idea: cost vs write ratio</text>

  <!-- shaded region: CoW-wins zone for n=100 (widest case), drawn first so lines sit on top -->
  <rect x="80" y="100" width="447" height="450" fill="#dcfce7" stroke="none"/>
  <text x="120" y="118" font-family="sans-serif" font-size="11" fill="#1f2937">CoW beats the lock-based alternative here (illustrated for n=100)</text>

  <!-- axes -->
  <line x1="80" y1="550" x2="760" y2="550" stroke="#737373" stroke-width="2" marker-end="url(#arrow133)"/>
  <line x1="80" y1="550" x2="80" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow133)"/>

  <!-- x axis label and ticks (log scale, write ratio w, 1e-6 to 1) -->
  <text x="420" y="580" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">write ratio w (log scale, 1e-6 to 1)</text>

  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <line x1="100" y1="550" x2="100" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="100" y="570" text-anchor="middle">1e-6</text>
    <line x1="206.7" y1="550" x2="206.7" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="206.7" y="570" text-anchor="middle">1e-5</text>
    <line x1="313.3" y1="550" x2="313.3" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="313.3" y="570" text-anchor="middle">1e-4</text>
    <line x1="420" y1="550" x2="420" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="420" y="570" text-anchor="middle">1e-3</text>
    <line x1="526.7" y1="550" x2="526.7" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="526.7" y="570" text-anchor="middle">1e-2</text>
    <line x1="633.3" y1="550" x2="633.3" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="633.3" y="570" text-anchor="middle">1e-1</text>
    <line x1="740" y1="550" x2="740" y2="556" stroke="#737373" stroke-width="2"/>
    <text x="740" y="570" text-anchor="middle">1</text>
  </g>

  <!-- y axis label and ticks (log scale, cost 1 to 1e6) -->
  <text x="40" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" transform="rotate(-90 40 320)">total cost (arbitrary units, log scale)</text>
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <line x1="74" y1="550" x2="80" y2="550" stroke="#737373" stroke-width="2"/>
    <text x="66" y="554" text-anchor="end">1</text>
    <line x1="74" y1="475" x2="80" y2="475" stroke="#737373" stroke-width="2"/>
    <text x="66" y="479" text-anchor="end">10</text>
    <line x1="74" y1="400" x2="80" y2="400" stroke="#737373" stroke-width="2"/>
    <text x="66" y="404" text-anchor="end">1e2</text>
    <line x1="74" y1="325" x2="80" y2="325" stroke="#737373" stroke-width="2"/>
    <text x="66" y="329" text-anchor="end">1e3</text>
    <line x1="74" y1="250" x2="80" y2="250" stroke="#737373" stroke-width="2"/>
    <text x="66" y="254" text-anchor="end">1e4</text>
    <line x1="74" y1="175" x2="80" y2="175" stroke="#737373" stroke-width="2"/>
    <text x="66" y="179" text-anchor="end">1e5</text>
    <line x1="74" y1="100" x2="80" y2="100" stroke="#737373" stroke-width="2"/>
    <text x="66" y="104" text-anchor="end">1e6</text>
  </g>

  <!-- alt cost line (lock-based alternative, constant ~2) -->
  <line x1="100" y1="527.4" x2="740" y2="527.4" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="600" y="500" width="150" height="22" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="675" y="516" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">lock-based alt: cost ~ 1+c</text>

  <!-- n=100 curve -->
  <polyline points="100,549.97 206.7,549.68 313.3,546.9 420,527.65 526.7,472.2 633.3,400 740,400"
            fill="none" stroke="#525252" stroke-width="2"/>
  <rect x="655" y="378" width="90" height="20" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="700" y="393" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n = 100</text>

  <!-- n=10000 curve -->
  <polyline points="100,549.7 206.7,546.9 313.3,527.4 420,471.9 526.7,399.7 633.3,325 740,250"
            fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="655" y="228" width="100" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="705" y="243" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n = 10,000</text>

  <!-- n=1,000,000 curve -->
  <polyline points="100,527.4 206.7,471.9 313.3,399.7 420,325 526.7,250 633.3,175 740,100"
            fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="2,2"/>
  <rect x="640" y="78" width="120" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="700" y="93" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n = 1,000,000</text>

  <!-- crossover markers -->
  <line x1="526.7" y1="527.4" x2="526.7" y2="90" stroke="#525252" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="440" y="605" width="175" height="34" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="527" y="619" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n=100 crossover:</text>
  <text x="527" y="634" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">w ≈ 1% (0.01)</text>

  <line x1="313.3" y1="527.4" x2="313.3" y2="90" stroke="#525252" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="230" y="605" width="175" height="34" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="317" y="619" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n=10,000 crossover:</text>
  <text x="317" y="634" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">w ≈ 0.01% (1e-4)</text>

  <line x1="100" y1="527.4" x2="100" y2="90" stroke="#525252" stroke-width="2" stroke-dasharray="3,3"/>
  <rect x="20" y="605" width="185" height="34" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="112" y="619" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n=1,000,000 crossover:</text>
  <text x="112" y="634" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">w ≈ 0.0001% (1e-6)</text>

  <!-- cost model box -->
  <rect x="60" y="650" width="680" height="42" rx="5" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="400" y="666" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Cost model: CoW ~ (1-w)*1 + w*n (O(1) read, O(n) write+copy). Lock-based alt ~ 1 + c (contention), independent of n.</text>
  <text x="400" y="682" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Equal at w ≈ c/n → crossover write ratio falls linearly as n grows. Values above are derived from this model, not measured.</text>
</svg>
