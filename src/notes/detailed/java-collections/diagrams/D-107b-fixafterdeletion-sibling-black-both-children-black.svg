<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterDeletion case 2: black sibling with two black children recolors the sibling red and pushes the double-black defect up to the parent">
  <defs>
    <marker id="arrow107b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterDeletion — Case B: black sibling, both sibling's children black</text>

  <rect x="20" y="60" width="150" height="24" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="3"/>
  <text x="95" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">double outline = double-black x</text>
  <rect x="180" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="235" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="300" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="360" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>
  <rect x="440" y="60" width="180" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="530" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">not terminating: x = parent, loop continues</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER recolor sib red</text>

  <line x1="150" y1="170" x2="90" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="150" y1="170" x2="220" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="220" y1="250" x2="190" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="220" y1="250" x2="260" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="150" cy="170" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">parent</text>

  <circle cx="90" cy="250" r="30" fill="none" stroke="#525252" stroke-width="3"/>
  <circle cx="90" cy="250" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="90" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">x</text>

  <circle cx="220" cy="250" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">sib</text>
  <text x="220" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="190" cy="330" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="190" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="260" cy="330" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="260" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <!-- AFTER: sib recolored red, double-black moves up to parent -->
  <line x1="470" y1="170" x2="410" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="470" y1="170" x2="540" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="540" y1="250" x2="510" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="540" y1="250" x2="580" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="470" cy="170" r="30" fill="none" stroke="#525252" stroke-width="3"/>
  <circle cx="470" cy="170" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="470" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">parent</text>
  <text x="470" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(new x)</text>

  <circle cx="410" cy="250" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="410" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">old x</text>

  <circle cx="540" cy="250" r="26" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="540" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">sib</text>
  <text x="540" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="510" cy="330" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="510" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="580" cy="330" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="580" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <line x1="284" y1="250" x2="356" y2="250" stroke="#737373" stroke-width="2" marker-end="url(#arrow107b)"/>
  <rect x="270" y="220" width="100" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">recolor sib red</text>

  <rect x="40" y="410" width="560" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sibling is black and both of sibling's children are black. Recoloring sib red removes</text>
  <text x="320" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">one black unit from x's side without touching parent's other subtree's balance yet —</text>
  <text x="320" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">x is reassigned to parent, which now absorbs the double-black defect. Loop continues from there.</text>
</svg>
