<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="LinkedList linkBefore: inserting newNode between pred and succ via four numbered pointer writes, newNode.next = succ, newNode.prev = pred, succ.prev = newNode, pred.next = newNode">

  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="20" y="15" width="760" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">linkBefore(e, succ): insert newNode between pred and succ</text>

  <!-- pred node -->
  <rect x="60" y="130" width="120" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">pred</text>
  <text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev | item | next</text>

  <!-- newNode (inserted, drawn below, moving up) -->
  <rect x="330" y="260" width="120" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="390" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">newNode</text>
  <text x="390" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev | item | next</text>

  <!-- succ node -->
  <rect x="600" y="130" width="120" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="660" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">succ</text>
  <text x="660" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">prev | item | next</text>

  <!-- old pred->succ next link, shown broken/faded (dashed) -->
  <line x1="180" y1="150" x2="600" y2="150" stroke="#737373" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="360" y="105" width="80" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="400" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">old link</text>

  <!-- 1: newNode.next = succ -->
  <path d="M 450 275 C 550 275, 620 220, 650 200" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="500" y="225" width="150" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="575" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1: newNode.next = succ</text>

  <!-- 2: newNode.prev = pred -->
  <path d="M 330 275 C 230 275, 160 220, 130 200" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="150" y="225" width="150" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="225" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">2: newNode.prev = pred</text>

  <!-- 3: succ.prev = newNode -->
  <path d="M 620 130 C 550 90, 460 90, 400 260" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="470" y="60" width="170" height="20" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="555" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">3: succ.prev = newNode</text>

  <!-- 4: pred.next = newNode -->
  <path d="M 160 130 C 230 90, 320 90, 380 260" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="160" y="60" width="170" height="20" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="245" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4: pred.next = newNode</text>

  <rect x="20" y="345" width="760" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Order matters: newNode's own prev/next (1,2) are set before it is spliced into the chain (3,4),</text>
  <text x="400" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">so the list is never observed in a half-linked state by another thread reading these fields</text>
</svg>