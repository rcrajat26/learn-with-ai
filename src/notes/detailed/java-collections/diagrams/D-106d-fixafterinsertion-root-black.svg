<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterInsertion final step: the root is unconditionally forced black regardless of which case path was taken">
  <defs>
    <marker id="arrow106d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterInsertion — Final step: root forced black</text>

  <rect x="20" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="75" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="140" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE: loop exits, root may be red</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER: setColor(root, BLACK)</text>

  <line x1="160" y1="170" x2="110" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="160" y1="170" x2="210" y2="250" stroke="#737373" stroke-width="2"/>

  <circle cx="160" cy="170" r="30" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="160" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">root</text>
  <text x="160" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red (case 1 left it this way)</text>

  <circle cx="110" cy="250" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="110" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">L</text>

  <circle cx="210" cy="250" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="210" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">R</text>

  <line x1="480" y1="170" x2="430" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="480" y1="170" x2="530" y2="250" stroke="#737373" stroke-width="2"/>

  <circle cx="480" cy="170" r="30" fill="#e5e7eb" stroke="#525252" stroke-width="3"/>
  <text x="480" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">root</text>
  <text x="480" y="182" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">forced black</text>

  <circle cx="430" cy="250" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">L</text>

  <circle cx="530" cy="250" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="530" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">R</text>

  <line x1="284" y1="170" x2="356" y2="170" stroke="#737373" stroke-width="2" marker-end="url(#arrow106d)"/>
  <rect x="270" y="140" width="100" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">force black</text>

  <rect x="40" y="330" width="560" height="110" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Case 1 (red uncle) can leave the root red after recoloring it during the last</text>
  <text x="320" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">recursive step, since the root has no parent to check for a red-red conflict.</text>
  <text x="320" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">setColor(root, BLACK) runs unconditionally at the very end of fixAfterInsertion,</text>
  <text x="320" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">independent of which case path the loop took — this cannot break other invariants because</text>
  <rect x="60" y="424" width="520" height="18" rx="3" fill="#dcfce7" stroke="none"/>
  <text x="320" y="437" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">darkening the root by one level adds equally to every root-to-leaf path's black-height.</text>
</svg>
