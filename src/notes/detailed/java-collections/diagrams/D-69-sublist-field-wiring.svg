<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList.SubList field wiring for a sublist-of-a-sublist: root, parent, offset, size, modCount fields, with checkForComodification comparing against root.modCount rather than parent.modCount">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="240" y="10" width="320" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList.SubList field wiring (nested sublist)</text>

  <!-- Backing ArrayList -->
  <rect x="40" y="60" width="220" height="120" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="82" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList (backing)</text>
  <rect x="55" y="94" width="190" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="111" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">elementData[0..11]</text>
  <rect x="55" y="124" width="190" height="24" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="150" y="141" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">modCount = 5</text>
  <rect x="55" y="154" width="190" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 12</text>

  <!-- SubList 1 (child of ArrayList) -->
  <rect x="320" y="60" width="220" height="150" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="430" y="82" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">SubList1 (indices 2..9)</text>
  <rect x="335" y="94" width="190" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">root = ArrayList (this)</text>
  <rect x="335" y="118" width="190" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="133" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">parent = ArrayList (this)</text>
  <rect x="335" y="142" width="190" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="157" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">offset = 2</text>
  <rect x="335" y="166" width="190" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="181" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 8</text>
  <rect x="335" y="190" width="190" height="20" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="430" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this.modCount = 5 (mirrors root)</text>

  <!-- SubList 2 (child of SubList1) -->
  <rect x="600" y="60" width="180" height="150" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="690" y="82" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">SubList2 (indices 1..4 of SubList1)</text>
  <rect x="612" y="98" width="156" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="690" y="113" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">root = ArrayList</text>
  <rect x="612" y="122" width="156" height="20" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="690" y="137" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">parent = SubList1</text>
  <rect x="612" y="146" width="156" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="690" y="161" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">offset = 2+1 = 3</text>
  <rect x="612" y="170" width="156" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="690" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 3</text>
  <rect x="612" y="194" width="156" height="20" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="690" y="209" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this.modCount = 5</text>

  <!-- root pointer arrows (bypass parent) -->
  <path d="M 690 60 C 690 20, 150 20, 150 60" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="330" y="6" width="220" height="20" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="440" y="21" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">SubList2.root points directly to ArrayList</text>

  <!-- parent chain arrows -->
  <path d="M 600 135 L 540 135" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 320 135 L 260 135" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- offset composition arrow -->
  <path d="M 690 220 C 690 260, 430 260, 430 220" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470" y="248" width="260" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="600" y="263" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">offset composed from parent.offset at construction</text>

  <!-- checkForComodification section -->
  <rect x="40" y="300" width="740" height="230" rx="6" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="52" y="310" width="340" height="26" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="222" y="328" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">checkForComodification() at SubList2</text>

  <rect x="60" y="350" width="220" height="60" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="170" y="374" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if (root.modCount</text>
  <text x="170" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">!= this.modCount)</text>

  <rect x="330" y="350" width="200" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">throw ConcurrentModificationException</text>

  <path d="M 280 380 L 330 380" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="420" width="720" height="30" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="420" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Compares against root.modCount, never parent.modCount - every SubList in the chain reads the same field on the true backing ArrayList</text>

  <rect x="60" y="458" width="720" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="420" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">A structural mutation via SubList1 (e.g. add) bumps root.modCount once - SubList2 detects it on next access even though it never touched SubList1's own modCount field</text>

  <rect x="60" y="496" width="720" height="24" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="420" y="512" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Each level still updates its own this.modCount = root.modCount for its own iterator's expectedModCount bookkeeping</text>
</svg>