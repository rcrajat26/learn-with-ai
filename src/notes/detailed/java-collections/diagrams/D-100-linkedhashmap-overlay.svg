<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="LinkedHashMap overlay: a before/after doubly-linked chain in insertion order A,B,C,D drawn above the inherited HashMap table, with dashed lines showing each chain position and each table entry are the same physical object">
  <defs>
    <marker id="arrow100" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="480" y="26" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1f2937">LinkedHashMap's overlay</text>

  <rect x="60" y="36" width="840" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="480" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">static class Entry&lt;K,V&gt; extends HashMap.Node&lt;K,V&gt; { Entry&lt;K,V&gt; before, after; }</text>

  <text x="480" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">LinkedHashMap overlay &#8212; encounter order</text>

  <!-- head / tail arrows -->
  <line x1="40" y1="130" x2="115" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
  <rect x="30" y="108" width="46" height="18" rx="3" fill="#fef3c7"/>
  <text x="53" y="121" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">head</text>

  <line x1="920" y1="130" x2="875" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
  <rect x="884" y="108" width="42" height="18" rx="3" fill="#fef3c7"/>
  <text x="905" y="121" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">tail</text>

  <!-- chain nodes: A,B,C,D amber fill -->
  <rect x="120" y="100" width="90" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="165" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>

  <rect x="340" y="100" width="90" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="385" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <rect x="560" y="100" width="90" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="605" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

  <rect x="780" y="100" width="90" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="825" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">D</text>

  <!-- after/before arrows between consecutive chain nodes -->
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <line x1="212" y1="180" x2="338" y2="180" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="245" y="169" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="265" y="181" text-anchor="middle">after</text>
    <line x1="338" y1="196" x2="212" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="245" y="199" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="265" y="211" text-anchor="middle">before</text>

    <line x1="432" y1="180" x2="558" y2="180" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="465" y="169" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="485" y="181" text-anchor="middle">after</text>
    <line x1="558" y1="196" x2="432" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="465" y="199" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="485" y="211" text-anchor="middle">before</text>

    <line x1="652" y1="180" x2="778" y2="180" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="685" y="169" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="705" y="181" text-anchor="middle">after</text>
    <line x1="778" y1="196" x2="652" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
    <rect x="685" y="199" width="40" height="16" rx="3" fill="#e5e7eb"/>
    <text x="705" y="211" text-anchor="middle">before</text>
  </g>

  <text x="480" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">inherited HashMap table &#8212; bin order</text>

  <!-- table slots, index labels -->
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <text x="115" y="268" text-anchor="middle">0</text>
    <text x="225" y="268" text-anchor="middle">1</text>
    <text x="335" y="268" text-anchor="middle">2</text>
    <text x="445" y="268" text-anchor="middle">3</text>
    <text x="555" y="268" text-anchor="middle">4</text>
    <text x="665" y="268" text-anchor="middle">5</text>
    <text x="775" y="268" text-anchor="middle">6</text>
    <text x="885" y="268" text-anchor="middle">7</text>
  </g>

  <!-- empty slots: 0,2,4,5,7 -->
  <rect x="70" y="274" width="90" height="40" rx="4" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="115" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty</text>

  <rect x="290" y="274" width="90" height="40" rx="4" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="335" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty</text>

  <rect x="510" y="274" width="90" height="40" rx="4" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="555" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty</text>

  <rect x="620" y="274" width="90" height="40" rx="4" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="665" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty</text>

  <rect x="840" y="274" width="90" height="40" rx="4" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="885" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty</text>

  <!-- bin1: C -->
  <rect x="180" y="274" width="90" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="225" y="298" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

  <!-- bin6: B -->
  <rect x="730" y="274" width="90" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="775" y="298" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <!-- bin3: A -> D chain -->
  <rect x="400" y="274" width="90" height="100" rx="4" fill="none" stroke="#525252" stroke-width="2"/>
  <rect x="405" y="279" width="80" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="445" y="303" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
  <line x1="445" y1="315" x2="445" y2="330" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>
  <rect x="405" y="332" width="80" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="445" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">D</text>
  <rect x="398" y="376" width="94" height="16" rx="3" fill="#dbeafe"/>
  <text x="445" y="388" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin 3 (2-node chain)</text>

  <!-- dashed connectors: chain -> table, showing one physical object -->
  <line x1="165" y1="160" x2="445" y2="279" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="385" y1="160" x2="775" y2="274" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="605" y1="160" x2="225" y2="274" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="825" y1="160" x2="445" y2="332" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- cost callout -->
  <rect x="60" y="405" width="840" height="42" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="480" y="423" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">+2 references per entry = +8 bytes with compressed oops; HashMap.Node 32 B becomes</text>
  <text x="480" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">LinkedHashMap.Entry 40 B, a 25% memory surcharge for ordered iteration</text>

  <!-- containsValue note -->
  <rect x="60" y="457" width="840" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="480" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">containsValue is overridden to walk this chain instead of the table &#8212; O(n) either way, but no empty bins to skip</text>
</svg>
