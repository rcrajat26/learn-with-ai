  <text x="1710" y="401" font-family="sans-serif" font-size="13" fill="#1f2937">DualPivotQuicksort improvements</text>

  <!-- ================= TICK 11: Java 17 (below) ================= -->
  <circle cx="2016" cy="450" r="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <line x1="2016" y1="456" x2="2016" y2="480" stroke="#737373" stroke-width="2"/>
