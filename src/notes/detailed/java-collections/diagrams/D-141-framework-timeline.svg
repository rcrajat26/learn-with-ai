  <text x="1544" y="525" font-family="sans-serif" font-size="13" fill="#1f2937">Collection.toArray(IntFunction)</text>
  <text x="1544" y="543" font-family="sans-serif" font-size="13" fill="#1f2937">ArraysSupport.newLength</text>

