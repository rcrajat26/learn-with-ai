<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 4: ConcurrentLinkedQueue steady state where tail lags one node behind the true last node in the Michael-Scott chain">
  <defs>
    <marker id="arrow136a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="16" width="760" height="24" rx="4" fill="#e5e7eb"/>
  <text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Frame 1/4 — steady state: tail lags one node behind the true last node</text>

  <rect x="60" y="100" width="120" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Node A</text>

  <rect x="240" y="100" width="120" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Node B</text>

  <rect x="420" y="100" width="120" height="50" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="480" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Node C</text>
  <text x="480" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">true last node</text>

  <line x1="180" y1="125" x2="240" y2="125" stroke="#737373" stroke-width="2" marker-end="url(#arrow136a)"/>
  <line x1="360" y1="125" x2="420" y2="125" stroke="#737373" stroke-width="2" marker-end="url(#arrow136a)"/>

  <rect x="60" y="60" width="60" height="24" rx="3" fill="#fef3c7"/>
  <text x="90" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">head</text>
  <line x1="90" y1="84" x2="90" y2="100" stroke="#737373" stroke-width="2" marker-end="url(#arrow136a)"/>

  <rect x="240" y="60" width="60" height="24" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="270" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">tail</text>
  <line x1="270" y1="84" x2="300" y2="100" stroke="#525252" stroke-width="2" marker-end="url(#arrow136a)"/>

  <rect x="60" y="190" width="480" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">volatile Node&lt;E&gt; tail (L239) points at Node B, but Node C (via B.next) is truly last</text>

  <rect x="60" y="232" width="680" height="44" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="70" y="250" font-family="sans-serif" font-size="12" fill="#1f2937">Invariant (L153-160): tail is permitted to lag — it is updated lazily, "for efficiency by</text>
  <text x="70" y="266" font-family="sans-serif" font-size="12" fill="#1f2937">only updating it when it is at least one hop behind the current last node"</text>
</svg>
