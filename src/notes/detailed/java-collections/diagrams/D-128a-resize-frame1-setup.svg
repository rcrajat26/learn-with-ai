<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 4: cooperative resize setup showing table and nextTable side by side with transferIndex at the top marking the unclaimed range">

  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Frame 1 of 4 — resize begins: table and nextTable, transferIndex at top</text>

  <rect x="300" y="46" width="200" height="30" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">transferIndex = n (line 2434)</text>

  <line x1="400" y1="76" x2="200" y2="110" stroke="#737373" stroke-width="2" marker-end="url(#arrow128a)"/>
  <line x1="400" y1="76" x2="600" y2="110" stroke="#737373" stroke-width="2" marker-end="url(#arrow128a)"/>

  <!-- old table -->
  <rect x="60" y="110" width="280" height="220" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="200" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">volatile Node&lt;K,V&gt;[] table</text>
  <text x="200" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">length n (old capacity)</text>
  <rect x="90" y="164" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[n-1] .. bin[bound]  (unclaimed)</text>
  <rect x="90" y="196" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">still holds live bins</text>
  <rect x="90" y="228" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="246" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[0] .. bin[stride-1]</text>
  <text x="90" y="300" font-family="sans-serif" font-size="13" fill="#1f2937">no bin migrated yet</text>

  <!-- next table -->
  <rect x="460" y="110" width="280" height="220" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="600" y="134" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">volatile Node&lt;K,V&gt;[] nextTable</text>
  <text x="600" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">length n &lt;&lt; 1 (line 2432)</text>
  <rect x="490" y="164" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="600" y="182" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">all bins empty (new array)</text>
  <text x="490" y="230" font-family="sans-serif" font-size="13" fill="#1f2937">assigned to this.nextTable</text>
  <text x="490" y="250" font-family="sans-serif" font-size="13" fill="#1f2937">before any bin moves</text>

  <rect x="60" y="344" width="720" height="40" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MIN_TRANSFER_STRIDE = 16 (line 569) — smallest unit of work a thread claims via CAS on transferIndex</text>

  <defs>
    <marker id="arrow128a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
</svg>
