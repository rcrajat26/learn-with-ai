<svg viewBox="0 0 920 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="LinkedList node(int index) picks a walking direction: get(2) walks forward 2 hops from first, get(8) walks backward 1 hop from last, chosen by index less than size right-shift 1, with index 4 or 5 the worst case at 4 hops">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- ================= FRAME 1 : the chain ================= -->
  <rect x="20" y="20" width="880" height="22" rx="4" fill="#e5e7eb"/>
  <text x="30" y="36" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 — a 10-node doubly linked chain; first and last are the two entry points</text>

  <!-- first / last pointer labels -->
  <rect x="55" y="50" width="50" height="18" rx="3" fill="#fef3c7"/>
  <text x="80" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">first</text>
  <line x1="80" y1="68" x2="80" y2="80" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <rect x="805" y="50" width="50" height="18" rx="3" fill="#fef3c7"/>
  <text x="830" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">last</text>
  <line x1="830" y1="68" x2="830" y2="80" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <!-- 10 node boxes: x_i = 80 + i*75, width 55, y 80-130 -->
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <!-- node 0 -->
    <rect x="80" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="107" y="109" text-anchor="middle">0</text>
    <!-- node 1 -->
    <rect x="155" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="182" y="109" text-anchor="middle">1</text>
    <!-- node 2 -->
    <rect x="230" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="257" y="109" text-anchor="middle">2</text>
    <!-- node 3 -->
    <rect x="305" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="332" y="109" text-anchor="middle">3</text>
    <!-- node 4 -->
    <rect x="380" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="407" y="109" text-anchor="middle">4</text>
    <!-- node 5 (mark as midpoint) -->
    <rect x="455" y="80" width="55" height="50" rx="5" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="482" y="109" text-anchor="middle">5</text>
    <!-- node 6 -->
    <rect x="530" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="557" y="109" text-anchor="middle">6</text>
    <!-- node 7 -->
    <rect x="605" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="632" y="109" text-anchor="middle">7</text>
    <!-- node 8 -->
    <rect x="680" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="707" y="109" text-anchor="middle">8</text>
    <!-- node 9 -->
    <rect x="755" y="80" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="782" y="109" text-anchor="middle">9</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#737373" stroke-width="2" marker-end="url(#arrow)">
    <line x1="135" y1="105" x2="153" y2="105"/>
    <line x1="210" y1="105" x2="228" y2="105"/>
    <line x1="285" y1="105" x2="303" y2="105"/>
    <line x1="360" y1="105" x2="378" y2="105"/>
    <line x1="435" y1="105" x2="453" y2="105"/>
    <line x1="510" y1="105" x2="528" y2="105"/>
    <line x1="585" y1="105" x2="603" y2="105"/>
    <line x1="660" y1="105" x2="678" y2="105"/>
    <line x1="735" y1="105" x2="753" y2="105"/>
  </g>
  <rect x="335" y="139" width="270" height="18" rx="3" fill="#e5e7eb"/>
  <text x="470" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 10 — each node also has a prev pointer</text>

  <!-- ================= FRAME 2 : get(2) forward ================= -->
  <rect x="20" y="175" width="880" height="22" rx="4" fill="#e5e7eb"/>
  <text x="30" y="191" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2 — get(2): index 2 &lt; (size &gt;&gt; 1) = 5, so walk forward from first</text>

  <rect x="55" y="205" width="50" height="18" rx="3" fill="#fef3c7"/>
  <text x="80" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">first</text>
  <line x1="80" y1="223" x2="80" y2="235" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="80" y="235" width="55" height="50" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="107" y="264" text-anchor="middle">0</text>
    <rect x="155" y="235" width="55" height="50" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="182" y="264" text-anchor="middle">1</text>
    <rect x="230" y="235" width="55" height="50" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="257" y="264" text-anchor="middle">2</text>
    <rect x="305" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="332" y="264" text-anchor="middle">3</text>
    <rect x="380" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="407" y="264" text-anchor="middle">4</text>
    <rect x="455" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="482" y="264" text-anchor="middle">5</text>
    <rect x="530" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="557" y="264" text-anchor="middle">6</text>
    <rect x="605" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="632" y="264" text-anchor="middle">7</text>
    <rect x="680" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="707" y="264" text-anchor="middle">8</text>
    <rect x="755" y="235" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="782" y="264" text-anchor="middle">9</text>
  </g>
  <g stroke="#737373" stroke-width="2" marker-end="url(#arrow)">
    <line x1="135" y1="260" x2="153" y2="260"/>
    <line x1="210" y1="260" x2="228" y2="260"/>
    <line x1="285" y1="260" x2="303" y2="260"/>
    <line x1="360" y1="260" x2="378" y2="260"/>
    <line x1="435" y1="260" x2="453" y2="260"/>
    <line x1="510" y1="260" x2="528" y2="260"/>
    <line x1="585" y1="260" x2="603" y2="260"/>
    <line x1="660" y1="260" x2="678" y2="260"/>
    <line x1="735" y1="260" x2="753" y2="260"/>
  </g>
  <!-- hop arcs under the highlighted nodes -->
  <path d="M 107 288 Q 145 320 182 288" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="118" y="300" width="55" height="18" rx="3" fill="#fef3c7"/>
  <text x="145" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hop 1</text>
  <path d="M 182 288 Q 220 320 257 288" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="193" y="300" width="55" height="18" rx="3" fill="#fef3c7"/>
  <text x="220" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hop 2</text>
  <rect x="290" y="300" width="220" height="18" rx="3" fill="#dcfce7"/>
  <text x="400" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">first.next.next -&gt; node at index 2 (target)</text>

  <!-- ================= FRAME 3 : get(8) backward ================= -->
  <rect x="20" y="335" width="880" height="22" rx="4" fill="#e5e7eb"/>
  <text x="30" y="351" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3 — get(8): index 8 &gt;= (size &gt;&gt; 1) = 5, so walk backward from last (1 hop)</text>

  <rect x="805" y="365" width="50" height="18" rx="3" fill="#fef3c7"/>
  <text x="830" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">last</text>
  <line x1="830" y1="383" x2="830" y2="395" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="80" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="107" y="424" text-anchor="middle">0</text>
    <rect x="155" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="182" y="424" text-anchor="middle">1</text>
    <rect x="230" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="257" y="424" text-anchor="middle">2</text>
    <rect x="305" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="332" y="424" text-anchor="middle">3</text>
    <rect x="380" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="407" y="424" text-anchor="middle">4</text>
    <rect x="455" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="482" y="424" text-anchor="middle">5</text>
    <rect x="530" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="557" y="424" text-anchor="middle">6</text>
    <rect x="605" y="395" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="632" y="424" text-anchor="middle">7</text>
    <rect x="680" y="395" width="55" height="50" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="707" y="424" text-anchor="middle">8</text>
    <rect x="755" y="395" width="55" height="50" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="782" y="424" text-anchor="middle">9</text>
  </g>
  <g stroke="#737373" stroke-width="2" marker-end="url(#arrow)">
    <line x1="135" y1="420" x2="153" y2="420"/>
    <line x1="210" y1="420" x2="228" y2="420"/>
    <line x1="285" y1="420" x2="303" y2="420"/>
    <line x1="360" y1="420" x2="378" y2="420"/>
    <line x1="435" y1="420" x2="453" y2="420"/>
    <line x1="510" y1="420" x2="528" y2="420"/>
    <line x1="585" y1="420" x2="603" y2="420"/>
    <line x1="660" y1="420" x2="678" y2="420"/>
    <line x1="735" y1="420" x2="753" y2="420"/>
  </g>
  <!-- backward hop arc: exactly one hop, drawn above the boxes -->
  <path d="M 782 392 Q 745 365 707 392" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="718" y="368" width="55" height="18" rx="3" fill="#fef3c7"/>
  <text x="745" y="381" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hop 1</text>
  <rect x="60" y="453" width="430" height="18" rx="3" fill="#e5e7eb"/>
  <text x="70" y="466" font-family="sans-serif" font-size="11" fill="#1f2937">for (i = size - 1; i &gt; index; i--) x = x.prev;  loop runs once: i=9&gt;8, then i=8 stops</text>
  <rect x="500" y="453" width="330" height="18" rx="3" fill="#dcfce7"/>
  <text x="665" y="466" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">last.prev -&gt; node at index 8 (1 hop, target)</text>

  <!-- ================= FRAME 4 : the branch + worst case ================= -->
  <rect x="20" y="495" width="880" height="22" rx="4" fill="#e5e7eb"/>
  <text x="30" y="511" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 4 — the branch that node(int index) evaluates, and its worst case</text>

  <rect x="60" y="530" width="800" height="60" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="460" y="555" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">if (index &lt; (size &gt;&gt; 1)) walk forward from first;</text>
  <text x="460" y="577" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">else walk backward from last;</text>

  <rect x="60" y="610" width="800" height="26" rx="4" fill="#dbeafe"/>
  <text x="80" y="628" font-family="sans-serif" font-size="13" fill="#1f2937">get(2): 2 &lt; 5 -&gt; forward from first (2 hops).   get(8): 8 &gt;= 5 -&gt; backward from last (1 hop).</text>

  <rect x="60" y="655" width="800" height="26" rx="4" fill="#fee2e2"/>
  <text x="80" y="673" font-family="sans-serif" font-size="13" fill="#1f2937">Worst case: index 5 (backward, 9-5=4 hops) or index 4 (forward, 4 hops) — size 10, maximum walk = 4 hops.</text>

  <!-- mini illustration of the worst-case nodes -->
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="80" y="700" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="107" y="729" text-anchor="middle">first</text>
    <rect x="755" y="700" width="55" height="50" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="782" y="729" text-anchor="middle">last</text>
    <rect x="380" y="700" width="55" height="50" rx="5" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="407" y="729" text-anchor="middle">idx 4</text>
    <rect x="455" y="700" width="55" height="50" rx="5" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="482" y="729" text-anchor="middle">idx 5</text>
  </g>
  <path d="M 135 725 Q 260 700 380 720" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="180" y="700" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="220" y="713" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">4 hops fwd</text>
  <path d="M 755 725 Q 630 700 510 720" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>
  <rect x="600" y="700" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="640" y="713" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">4 hops bwd</text>
  <rect x="180" y="758" width="550" height="20" rx="3" fill="#fee2e2"/>
  <text x="455" y="773" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">worst case 4 hops, at index 4 or index 5 — not index 5 alone, and not 5 hops</text>

  <rect x="60" y="795" width="800" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="818" font-family="sans-serif" font-size="12" fill="#1f2937">Takeaway: node(int index) never walks more than size/2 hops, but that is still O(n) —</text>
  <text x="80" y="838" font-family="sans-serif" font-size="12" fill="#1f2937">the halving only cuts the constant factor, it does not change get(int) from linear to constant time.</text>
</svg>