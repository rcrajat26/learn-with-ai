<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 4: get(A) moves A to the tail, B becomes the new eldest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">The LRU eviction cycle -- frame 2 of 4</text>
  <text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(A) triggers afterNodeAccess: A moves to the tail</text>

  <rect x="40" y="80" width="820" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="52" y="102" font-family="sans-serif" font-size="12" fill="#1f2937">protected boolean removeEldestEntry(Map.Entry&lt;K,V&gt; eldest) {</text>
  <text x="70" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">return size() &gt; 3;</text>
  <text x="52" y="142" font-family="sans-serif" font-size="12" fill="#1f2937">}</text>
  <text x="52" y="160" font-family="sans-serif" font-size="12" fill="#1f2937">override in effect on this map</text>

  <text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">before: A -&gt; B -&gt; C</text>

  <g font-family="sans-serif">
    <rect x="120" y="230" width="90" height="55" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="165" y="263" text-anchor="middle" font-size="15" fill="#1f2937">A</text>
    <rect x="340" y="230" width="90" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="385" y="263" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <rect x="560" y="230" width="90" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="605" y="263" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
  </g>

  <path d="M 165 232 C 300 130, 550 130, 605 232" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <rect x="330" y="140" width="220" height="20" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="440" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">A moves after C, to the tail</text>

  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">after: B -&gt; C -&gt; A</text>

  <g font-family="sans-serif">
    <rect x="120" y="340" width="90" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="165" y="373" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <rect x="340" y="340" width="90" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="385" y="373" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
    <rect x="560" y="340" width="90" height="55" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="605" y="373" text-anchor="middle" font-size="15" fill="#1f2937">A</text>

    <line x1="210" y1="360" x2="338" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="338" y1="376" x2="210" y2="376" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="430" y1="360" x2="558" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="558" y1="376" x2="430" y2="376" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <rect x="120" y="405" width="150" height="20" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="195" y="419" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head = B (eldest / LRU)</text>
  <rect x="530" y="405" width="180" height="20" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="620" y="419" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">tail = A (youngest / MRU)</text>

  <rect x="680" y="340" width="150" height="55" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="755" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 3</text>
  <text x="755" y="381" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">unchanged</text>

  <rect x="40" y="450" width="820" height="90" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="60" y="478" font-family="sans-serif" font-size="13" fill="#1f2937">A is now the youngest. B has become the eldest without being touched --</text>
  <text x="60" y="498" font-family="sans-serif" font-size="13" fill="#1f2937">B's position changed only because A moved past it, not because of any</text>
  <text x="60" y="518" font-family="sans-serif" font-size="13" fill="#1f2937">write to B itself.</text>
</svg>
