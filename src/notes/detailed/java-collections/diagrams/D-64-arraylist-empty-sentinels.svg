<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList's two distinct empty-array sentinels: new ArrayList of zero points at EMPTY_ELEMENTDATA which grows to capacity 1 on first add; new ArrayList points at DEFAULTCAPACITY_EMPTY_ELEMENTDATA which grows to capacity 10 on first add">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title callouts -->
  <rect x="40" y="16" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">new ArrayList&lt;&gt;(0)</text>

  <rect x="540" y="16" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">new ArrayList&lt;&gt;()</text>

  <line x1="150" y1="42" x2="150" y2="66" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="42" x2="650" y2="66" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- field boxes -->
  <rect x="60" y="68" width="180" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this.elementData</text>

  <rect x="560" y="68" width="180" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="88" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this.elementData</text>

  <line x1="150" y1="98" x2="150" y2="122" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="98" x2="650" y2="122" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- distinct sentinel objects -->
  <rect x="45" y="124" width="210" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">EMPTY_ELEMENTDATA</text>
  <text x="150" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Object[0] @ address 0x1A</text>
  <rect x="130" y="169" width="40" height="10" rx="2" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>

  <rect x="545" y="124" width="210" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="650" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">DEFAULTCAPACITY_</text>
  <text x="650" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">EMPTY_ELEMENTDATA</text>
  <text x="650" y="176" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">Object[0] @ address 0x2B</text>

  <!-- emphasis banner -->
  <rect x="200" y="200" width="400" height="34" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="400" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">two different Object[0] instances — the array *identity* is the flag</text>

  <!-- add arrows -->
  <line x1="150" y1="184" x2="150" y2="270" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="90" y="240" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="257" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">first add(x)</text>

  <line x1="650" y1="184" x2="650" y2="270" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="240" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="257" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">first add(x)</text>

  <!-- resulting arrays -->
  <rect x="45" y="330" width="210" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="150" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">new Object[1]</text>
  <rect x="120" y="362" width="60" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">x</text>
  <text x="150" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">capacity grows to 1</text>

  <rect x="545" y="330" width="210" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="650" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">new Object[10]</text>
  <g>
    <rect x="565" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <text x="574" y="379" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">x</text>
    <rect x="583" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="601" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="619" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="637" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="655" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="673" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="691" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="709" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
    <rect x="727" y="362" width="18" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  </g>
  <text x="650" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">capacity grows to 10 (default)</text>

  <rect x="240" y="450" width="320" height="30" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">explicit-zero-capacity ctor never gets the size-10 default</text>
</svg>