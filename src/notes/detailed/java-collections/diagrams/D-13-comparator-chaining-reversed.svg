<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Comparator chaining: comparing(last).thenComparing(first).reversed() wraps the entire chain in reversal, contrasted with comparing(last).thenComparing(comparing(first).reversed()) where reversed() only flips the inner tiebreaker">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="230" y="20" width="440" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">reversed() reverses whatever comparator it is called on &#8212; scope matters</text>

  <!-- ============ PIPELINE A ============ -->
  <rect x="30" y="60" width="840" height="24" rx="4" fill="#dbeafe"/>
  <text x="450" y="77" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A: comparing(Person::last).thenComparing(Person::first).reversed()</text>

  <!-- dashed scope bracket around both links -->
  <rect x="50" y="98" width="500" height="80" rx="8" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="130" y="88" width="340" height="20" rx="3" fill="#fee2e2"/>
  <text x="300" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">.reversed() scope: wraps the WHOLE chain</text>

  <rect x="60" y="110" width="220" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="170" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">comparing(</text>
  <text x="170" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Person::last)</text>

  <line x1="280" y1="138" x2="320" y2="138" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="110" width="220" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="430" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">.thenComparing(</text>
  <text x="430" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Person::first)</text>

  <line x1="300" y1="178" x2="300" y2="220" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="190" width="120" height="18" rx="3" fill="#fef3c7"/>
  <text x="390" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">.reversed()</text>

  <rect x="140" y="228" width="460" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="370" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">final Comparator&lt;Person&gt;</text>
  <text x="370" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">last DESCENDING, then (within tied last) first DESCENDING</text>

  <!-- ============ PIPELINE B ============ -->
  <rect x="30" y="330" width="840" height="24" rx="4" fill="#fef3c7"/>
  <text x="450" y="347" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B: comparing(Person::last).thenComparing(comparing(Person::first).reversed())</text>

  <rect x="60" y="380" width="220" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="170" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">comparing(</text>
  <text x="170" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Person::last)</text>

  <line x1="280" y1="408" x2="320" y2="408" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="374" width="300" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="470" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">.thenComparing(</text>

  <!-- dashed scope bracket around ONLY the inner comparator -->
  <rect x="335" y="398" width="270" height="56" rx="6" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="335" y="386" width="270" height="18" rx="3" fill="#fee2e2"/>
  <text x="470" y="399" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">.reversed() scope: ONLY this inner comparator</text>

  <rect x="345" y="408" width="250" height="38" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="470" y="423" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">comparing(Person::first)</text>
  <text x="470" y="438" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">.reversed()</text>

  <line x1="470" y1="464" x2="470" y2="500" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="170" y="508" width="460" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="530" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">final Comparator&lt;Person&gt;</text>
  <text x="400" y="548" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">last ASCENDING, then (within tied last) first DESCENDING</text>

  <!-- contrast summary -->
  <rect x="30" y="600" width="840" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="625" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Same two field accessors, same method names, different result: reversed() binds to whatever</text>
  <text x="450" y="645" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Comparator instance it is invoked on. Call it after the full chain to flip everything; call it inside</text>
  <text x="450" y="662" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">thenComparing(...) to flip only that one tiebreaker.</text>
</svg>