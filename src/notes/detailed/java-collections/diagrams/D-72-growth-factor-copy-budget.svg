<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Growth factor 1.5 vs 2: total element copies over n adds is 3n for g=1.5 versus 2n for g=2, while peak live memory during a resize copy is 2.5x for g=1.5 versus 3x for g=2">

  <rect x="20" y="20" width="760" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Growth factor g: total copy cost = n·g/(g−1)</text>

  <!-- Left panel: total copies bar chart -->
  <rect x="40" y="90" width="340" height="330" rx="6" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="210" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Total element copies for n adds</text>

  <!-- axis -->
  <line x1="90" y1="380" x2="90" y2="140" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="90" y1="380" x2="350" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="365" width="20" height="16" fill="#e5e7eb" rx="2"/>
  <text x="70" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>

  <!-- g=1.5 bar: 3n -->
  <rect x="140" y="160" width="60" height="220" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <rect x="120" y="130" width="100" height="22" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="170" y="146" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">g = 1.5</text>
  <rect x="130" y="385" width="80" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3n copies</text>

  <!-- g=2 bar: 2n (shorter) -->
  <rect x="260" y="233" width="60" height="147" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="240" y="203" width="100" height="22" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="290" y="219" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">g = 2</text>
  <rect x="250" y="385" width="80" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="290" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2n copies</text>

  <rect x="60" y="425" width="300" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="210" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n·g/(g−1): g=1.5 → n·1.5/0.5=3n; g=2 → n·2/1=2n</text>

  <!-- Right panel: peak live memory -->
  <rect x="420" y="90" width="340" height="330" rx="6" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="590" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Peak live memory during a resize copy</text>

  <line x1="470" y1="380" x2="470" y2="140" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="380" x2="730" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- g=1.5: old array (1x) + new array (1.5x) = 2.5x -->
  <rect x="500" y="270" width="50" height="110" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <rect x="500" y="215" width="50" height="55" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <rect x="485" y="185" width="80" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="525" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">g=1.5</text>
  <rect x="490" y="385" width="70" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="525" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2.5x peak</text>

  <!-- g=2: old array (1x) + new array (2x) = 3x -->
  <rect x="620" y="270" width="50" height="110" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <rect x="620" y="160" width="50" height="110" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="605" y="130" width="80" height="20" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="645" y="145" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">g=2</text>
  <rect x="610" y="385" width="70" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="645" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3x peak</text>

  <text x="590" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937"></text>
  <rect x="440" y="425" width="300" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="590" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">old array (green, size 1x) + in-progress new array (top block)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="465" width="760" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="400" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Smaller g means less amortized copy work per add, but each individual resize copies fewer new slots</text>
</svg>