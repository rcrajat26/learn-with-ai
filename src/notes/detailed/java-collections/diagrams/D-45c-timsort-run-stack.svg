<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="TimSort frame 3: the resulting two runs, base 0 length 20 and base 20 length 20, pushed onto the run-length stack">
  <defs>
    <marker id="arrow45c" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="420" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3: runs pushed on the run-length stack</text>

  <!-- array strip showing two runs covering all 40 elements -->
  <rect x="40" y="70" width="360" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="220" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">run[0]: base=0, len=20 (idx 0-19)</text>

  <rect x="400" y="70" width="360" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="580" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">run[1]: base=20, len=20 (idx 20-39)</text>

  <!-- arrows down to stack entries -->
  <line x1="220" y1="110" x2="220" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow45c)"/>
  <line x1="580" y1="110" x2="580" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow45c)"/>

  <!-- run-length stack, drawn bottom to top: index 0 pushed first, index 1 on top -->
  <rect x="300" y="230" width="200" height="50" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">stack[0]</text>
  <text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">base=0, runLen=20</text>

  <rect x="300" y="170" width="200" height="50" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">stack[1] (top)</text>
  <text x="400" y="208" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">base=20, runLen=20</text>

  <rect x="530" y="188" width="230" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="645" y="206" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">equal run lengths &#8594; mergeCollapse fires</text>
</svg>
