<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="spread(h) computes h xor (h unsigned-shift-right 16) then ands with HASH_BITS 0x7fffffff, clearing bit 31 so user hashes are always non-negative, freeing negative hash values -1, -2, -3 for MOVED ForwardingNode, TREEBIN, and RESERVED sentinels">

  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">spread(int h) and the reserved sign bit (line 696-697, 591-594)</text>

  <!-- formula -->
  <rect x="40" y="46" width="720" height="30" rx="4" fill="#fef3c7"/>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">return (h ^ (h &gt;&gt;&gt; 16)) &amp; HASH_BITS;   // HASH_BITS = 0x7fffffff</text>

  <!-- 32-bit strip: raw h ^ (h>>>16) result -->
  <text x="40" y="102" font-family="sans-serif" font-size="13" fill="#1f2937">Step 1-2: h ^ (h &gt;&gt;&gt; 16) — bit 31 may still be 1 (result can be negative)</text>
  <g id="strip1">
    <!-- 32 cells, width 20 each starting x=40, y=110..140 -->
  </g>
  <!-- generate 32 cells manually -->
  <!-- cell width 22, 32 cells = 704, start x=48 -->
  <rect x="48" y="110" width="22" height="30" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="59" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">31</text>
  <rect x="70" y="110" width="22" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="81" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">30</text>
  <rect x="92" y="110" width="616" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bits 29..0 (unaffected by this step)</text>
  <rect x="708" y="110" width="22" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="719" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>

  <rect x="48" y="146" width="44" height="20" rx="3" fill="#fee2e2"/>
  <text x="70" y="161" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">may be 1</text>

  <!-- arrow down to AND -->
  <line x1="400" y1="176" x2="400" y2="204" stroke="#737373" stroke-width="2" marker-end="url(#arrow127)"/>
  <rect x="300" y="176" width="200" height="22" rx="3" fill="#fef3c7"/>
  <text x="400" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">&amp; HASH_BITS (0x7fffffff)</text>

  <!-- 32-bit strip after AND -->
  <text x="40" y="228" font-family="sans-serif" font-size="13" fill="#1f2937">Step 3: after &amp; HASH_BITS — bit 31 forced to 0, result always &gt;= 0</text>
  <rect x="48" y="236" width="22" height="30" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="59" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>
  <rect x="70" y="236" width="22" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="81" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">30</text>
  <rect x="92" y="236" width="616" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bits 29..0 (from step 1-2)</text>
  <rect x="708" y="236" width="22" height="30" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="719" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>

  <rect x="30" y="272" width="150" height="22" rx="3" fill="#dcfce7"/>
  <text x="105" y="288" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bit 31 = reserved sign bit</text>

  <!-- why box -->
  <rect x="40" y="304" width="720" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Why: every user-supplied key hash is forced non-negative by spread(),</text>
  <text x="400" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">so the negative int space is guaranteed free for internal sentinel hashes.</text>

  <!-- sentinel table -->
  <rect x="40" y="362" width="230" height="80" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="155" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">MOVED = -1</text>
  <text x="155" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ForwardingNode</text>
  <text x="155" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">line 591, 2234</text>

  <rect x="285" y="362" width="230" height="80" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="400" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">TREEBIN = -2</text>
  <text x="400" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TreeBin (root of tree)</text>
  <text x="400" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">line 592, 2803</text>

  <rect x="530" y="362" width="230" height="80" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="645" y="384" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">RESERVED = -3</text>
  <text x="645" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">transient reservation</text>
  <text x="645" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">line 593, 2270</text>

  <defs>
    <marker id="arrow127" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
</svg>
