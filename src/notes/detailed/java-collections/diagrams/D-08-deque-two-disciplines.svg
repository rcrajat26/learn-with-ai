<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="One array-backed ArrayDeque drawn once, with stack-facing labels at the head end and queue-facing labels at both ends, plus a callout contrasting LIFO iteration on Deque-as-stack with bottom-to-top iteration on legacy Stack">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="240" y="20" width="420" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ArrayDeque: one array, two access disciplines</text>

  <!-- stack ops callout (head, top) -->
  <rect x="40" y="60" width="220" height="76" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">stack ops (head end)</text>
  <text x="150" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">push() = addFirst()</text>
  <text x="150" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pop() = removeFirst()</text>
  <text x="150" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">peek() = peekFirst()</text>

  <!-- queue add callout (tail, top) -->
  <rect x="640" y="60" width="220" height="46" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="750" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">queue op (tail end)</text>
  <text x="750" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add() = addLast()</text>

  <!-- index labels -->
  <text x="152" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 0 (head)</text>
  <text x="252" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 1</text>
  <text x="352" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 2</text>
  <text x="452" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 3</text>
  <text x="552" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 4</text>
  <text x="652" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 5 (tail, free)</text>

  <!-- array cells: head->tail = C,B,A,D,E,empty -->
  <rect x="107" y="200" width="90" height="70" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="152" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

  <rect x="207" y="200" width="90" height="70" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="252" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <rect x="307" y="200" width="90" height="70" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="352" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>

  <rect x="407" y="200" width="90" height="70" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="452" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">D</text>

  <rect x="507" y="200" width="90" height="70" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="552" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">E</text>

  <rect x="607" y="200" width="90" height="70" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="652" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">next addLast()</text>

  <!-- arrows from callouts to cells -->
  <line x1="150" y1="136" x2="150" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="106" x2="652" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- queue poll callout (head, bottom) pointing back up to head cell -->
  <rect x="40" y="285" width="220" height="46" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="150" y="303" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">queue op (head end)</text>
  <text x="150" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">poll() = removeFirst()</text>
  <line x1="150" y1="285" x2="150" y2="270" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Both pop() and poll() remove from the same head slot — one array, one method, two names</text>

  <!-- bottom callouts: iteration order contrast -->
  <rect x="40" y="365" width="380" height="175" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Deque used as stack: iterator() = LIFO</text>
  <text x="230" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pushed in order A, then B, then C (top)</text>

  <rect x="70" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="100" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1st: C</text>
  <rect x="70" y="450" width="90" height="55" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="115" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C (head)</text>

  <rect x="190" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="220" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2nd: B</text>
  <rect x="190" y="450" width="90" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="235" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <rect x="310" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="340" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">3rd: A</text>
  <rect x="310" y="450" width="90" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="355" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A (tail)</text>

  <line x1="160" y1="477" x2="190" y2="477" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="477" x2="310" y2="477" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="522" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iteration walks head to tail: most-recently-pushed first</text>

  <rect x="480" y="365" width="380" height="175" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="670" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">legacy Stack (Vector-based): bottom-to-top</text>
  <text x="670" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pushed in order A, then B, then C (top)</text>

  <rect x="510" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="540" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1st: A</text>
  <rect x="510" y="450" width="90" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="555" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A (idx 0)</text>

  <rect x="630" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="660" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2nd: B</text>
  <rect x="630" y="450" width="90" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="675" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B (idx 1)</text>

  <rect x="750" y="425" width="60" height="18" rx="3" fill="#dcfce7"/>
  <text x="780" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">3rd: C</text>
  <rect x="750" y="450" width="90" height="55" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="795" y="482" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C (top)</text>

  <line x1="600" y1="477" x2="630" y2="477" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="477" x2="750" y2="477" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="522" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iteration walks index 0 upward: least-recently-pushed first</text>
</svg>