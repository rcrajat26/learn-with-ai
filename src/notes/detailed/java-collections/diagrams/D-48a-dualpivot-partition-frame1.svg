<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Dual-pivot quicksort frame 1: two pivot candidates are sampled near one third and two thirds of the array, compared, and swapped if needed so that P1 is less than or equal to P2">
  <defs>
    <marker id="arrowD48a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Frame 1: choose pivot candidates, P1 &lt;= P2</text>

  <!-- candidate labels -->
  <rect x="230.5" y="60" width="130" height="30" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="295.5" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1/3 candidate</text>
  <text x="295.5" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 4, value 8</text>

  <rect x="458.5" y="60" width="130" height="30" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="523.5" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2/3 candidate</text>
  <text x="523.5" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 8, value 5</text>

  <line x1="295.5" y1="90" x2="295.5" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrowD48a)"/>
  <line x1="523.5" y1="90" x2="523.5" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrowD48a)"/>

  <!-- array -->
  <rect x="40" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="67.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">6</text>
  <rect x="97" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="124.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">2</text>
  <rect x="154" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="181.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">9</text>
  <rect x="211" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="238.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">4</text>
  <rect x="268" y="110" width="55" height="50" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="295.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">8</text>
  <rect x="325" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="352.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">1</text>
  <rect x="382" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="409.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">7</text>
  <rect x="439" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="466.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">3</text>
  <rect x="496" y="110" width="55" height="50" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="523.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">5</text>
  <rect x="553" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="580.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">11</text>
  <rect x="610" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="637.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10</text>
  <rect x="667" y="110" width="55" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="694.5" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>

  <rect x="20" y="168" width="760" height="38" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Compare candidates: is 1/3-candidate &lt;= 2/3-candidate?  8 &lt;= 5?  NO</text>
  <text x="400" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; swap so that P1 &lt;= P2 holds</text>

  <rect x="310" y="210" width="180" height="16" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">FINAL PIVOTS (after swap)</text>

  <rect x="300" y="232" width="90" height="48" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="345" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P1 = 5</text>
  <rect x="410" y="232" width="90" height="48" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="455" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P2 = 8</text>
</svg>
