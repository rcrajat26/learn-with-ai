<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="rotate frame 2: reverse the first part, indices 0..3, producing 4,3,2,1,5,6,7">
  <rect x="20" y="20" width="360" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2: reverse first part [0,4)</text>

  <g font-family="sans-serif">
    <!-- part A: index 0-3 reversed, green -->
    <rect x="55" y="80" width="90" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="100" y="115" text-anchor="middle" font-size="15" fill="#1f2937">4</text>
    <rect x="155" y="80" width="90" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="200" y="115" text-anchor="middle" font-size="15" fill="#1f2937">3</text>
    <rect x="255" y="80" width="90" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="300" y="115" text-anchor="middle" font-size="15" fill="#1f2937">2</text>
    <rect x="355" y="80" width="90" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="400" y="115" text-anchor="middle" font-size="15" fill="#1f2937">1</text>
    <!-- part B: unchanged neutral -->
    <rect x="455" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="500" y="115" text-anchor="middle" font-size="15" fill="#1f2937">5</text>
    <rect x="555" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="600" y="115" text-anchor="middle" font-size="15" fill="#1f2937">6</text>
    <rect x="655" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="700" y="115" text-anchor="middle" font-size="15" fill="#1f2937">7</text>
  </g>

  <line x1="450" y1="75" x2="450" y2="150" stroke="#525252" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="180" y="190" width="440" height="30" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">reverse(sublist(0,4)): [1,2,3,4] &#8594; [4,3,2,1]</text>
</svg>
