<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="EnumSet as a 64-bit long bit vector: add sets a single bit, addAll ORs two vectors, complementOf inverts and masks unused high bits">

  <text x="30" y="40" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">1. RegularEnumSet backs the set with one long: private long elements = 0L;</text>

  <!-- bit vector 1: initial add(WEDNESDAY) -->
  <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#1f2937">add(WEDNESDAY) -&gt; elements |= 1L &lt;&lt; 2  (WEDNESDAY.ordinal() == 2)</text>

  <g>
    <!-- draw 8 bits (bit 7..0) representing low byte, enough to show ordinals 0-6 (Day enum) -->
    <!-- bit boxes, index from 7 (left, high) down to 0 (right, low) -->
    <!-- positions: x = 60 + (7-idx)*70 -->
    <!-- labels: ordinal names for 0..6: SUN,MON,TUE,WED,THU,FRI,SAT ; bit7 unused -->
    <rect x="60" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="90" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="90" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit7 unused</text>

    <rect x="130" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit6 SAT</text>

    <rect x="200" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="230" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="230" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit5 FRI</text>

    <rect x="270" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="300" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit4 THU</text>

    <rect x="340" y="90" width="60" height="50" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="370" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">1</text>
    <text x="370" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit3 WED</text>

    <rect x="410" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="440" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="440" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit2 TUE</text>

    <rect x="480" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="510" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="510" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit1 MON</text>

    <rect x="550" y="90" width="60" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="580" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">0</text>
    <text x="580" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bit0 SUN</text>
  </g>
  <text x="620" y="120" font-family="sans-serif" font-size="13" fill="#1f2937">... 56 more high bits, all 0</text>

  <!-- addAll union section -->
  <text x="30" y="205" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">2. a.addAll(b) union -&gt; elements |= other.elements</text>
  <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#1f2937">guarded by: if (!(c instanceof RegularEnumSet&lt;?&gt; es)) return super.addAll(c);  (plus elementType check)</text>

  <!-- operand a: bits WED, MON -->
  <rect x="60" y="245" width="220" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="170" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a.elements = 00001010 (WED,MON)</text>

  <text x="300" y="272" font-family="sans-serif" font-size="18" fill="#1f2937">|</text>

  <rect x="320" y="245" width="220" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="430" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">b.elements = 01000100 (SAT,TUE)</text>

  <line x1="200" y1="295" x2="200" y2="330" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="295" x2="230" y2="330" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="130" y="335" width="220" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="240" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">result = 01001110 (SAT,TUE,WED,MON)</text>

  <!-- complementOf section -->
  <text x="30" y="415" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">3. complement() -&gt; elements = ~elements; elements &amp;= -1L &gt;&gt;&gt; -universe.length;</text>
  <text x="30" y="435" font-family="sans-serif" font-size="13" fill="#1f2937">RegularEnumSet.java:58-63. The "mask" is this expression, not a stored field. For a 7-day universe: -1L &gt;&gt;&gt; -7 == -1L &gt;&gt;&gt; 57</text>

  <rect x="60" y="455" width="220" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="170" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">elements = 00001010</text>

  <line x1="290" y1="475" x2="360" y2="475" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="292" y="450" width="80" height="20" rx="3" fill="#fef3c7"/>
  <text x="332" y="465" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">~elements</text>

  <rect x="360" y="455" width="240" height="40" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="480" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">...11110101 (all 64 bits, high bits garbage)</text>

  <line x1="480" y1="500" x2="480" y2="535" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="505" width="200" height="24" rx="3" fill="#fef3c7"/>
  <text x="480" y="521" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">&amp;= mask (-1L &gt;&gt;&gt; -universe.length)</text>

  <rect x="330" y="540" width="220" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="440" y="565" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">0000000...1110101 (only low 7 bits kept)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
</svg>
