<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 3: list.remove(B) shrinks the list to A C, size becomes 2, modCount bumps, cursor variable stays 2">
  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937">Frame 2: list.remove(B)</text>

  <!-- list cells: A C at indices 0 1, B removed shown crossed out -->
  <g font-family="sans-serif">
    <rect x="260" y="100" width="80" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="300" y="135" text-anchor="middle" font-size="15" fill="#1f2937">A</text>
    <rect x="260" y="162" width="80" height="18" rx="3" fill="#e5e7eb"/>
    <text x="300" y="175" text-anchor="middle" font-size="11" fill="#1f2937">index 0</text>

    <rect x="360" y="100" width="80" height="60" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <line x1="365" y1="105" x2="435" y2="155" stroke="#525252" stroke-width="2"/>
    <rect x="360" y="162" width="80" height="18" rx="3" fill="#fee2e2"/>
    <text x="400" y="175" text-anchor="middle" font-size="11" fill="#1f2937">removed</text>

    <rect x="460" y="100" width="80" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="500" y="135" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
    <rect x="460" y="162" width="80" height="18" rx="3" fill="#e5e7eb"/>
    <text x="500" y="175" text-anchor="middle" font-size="11" fill="#1f2937">index 1 (shifted)</text>
  </g>

  <rect x="330" y="60" width="140" height="18" rx="3" fill="#dbeafe"/>
  <text x="400" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size = 2</text>

  <rect x="580" y="100" width="180" height="34" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="670" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">modCount bumped</text>
  <text x="670" y="129" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(structural change)</text>

  <!-- cursor pointer, unchanged variable still 2 -->
  <line x1="540" y1="200" x2="540" y2="160" stroke="#525252" stroke-width="2" marker-end="url(#arrow31b)"/>
  <defs>
    <marker id="arrow31b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>
  <rect x="470" y="205" width="220" height="18" rx="3" fill="#dbeafe"/>
  <text x="580" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cursor field still = 2 (unchanged)</text>

  <rect x="180" y="240" width="440" height="20" rx="3" fill="#dcfce7"/>
  <text x="400" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">removing the list's element does not touch the iterator's cursor</text>
</svg>
