<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterInsertion case 2: black or absent uncle with a zigzag shape rotates the new node's parent to straighten the line before the final fix">
  <defs>
    <marker id="arrow106b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterInsertion — Case 2: black/absent uncle, zigzag (rotate to straighten)</text>

  <rect x="20" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="75" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="140" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>

  <rect x="380" y="60" width="240" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">x = P; falls through to Case 3 (straight-line)</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE (zigzag)</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER rotateLeft(P)</text>

  <!-- BEFORE: G -> P (left child) -> N (right child of P) : zigzag -->
  <line x1="140" y1="170" x2="90" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="140" y1="170" x2="220" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="90" y1="250" x2="150" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="140" cy="170" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="140" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="140" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="90" cy="250" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="90" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="90" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="220" cy="250" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="220" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="150" cy="330" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="150" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="150" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red (new)</text>

  <text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">N is P's right child, P is G's left child: zigzag</text>
  <rect x="80" y="356" width="140" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="150" y="369" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">N is right child of P (zigzag)</text>

  <!-- AFTER: rotateLeft(P) -> N takes P's place, P becomes N's left child -->
  <line x1="460" y1="170" x2="410" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="460" y1="170" x2="540" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="410" y1="250" x2="380" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="460" cy="170" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="460" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="410" cy="250" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="410" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="410" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="540" cy="250" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="540" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="540" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="380" cy="330" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="380" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="380" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <rect x="330" y="356" width="160" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="410" y="369" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">P is now N's left child (straight line)</text>

  <line x1="284" y1="250" x2="356" y2="250" stroke="#737373" stroke-width="2" marker-end="url(#arrow106b)"/>
  <rect x="270" y="220" width="100" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">rotateLeft(P)</text>

  <rect x="40" y="410" width="560" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Uncle is black (or null) and the new node is a zigzag child of its parent.</text>
  <text x="320" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A rotation at the parent (rotateLeft here; rotateRight for the mirror shape) turns the</text>
  <text x="320" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">zigzag into a straight line. x is reassigned to the old parent P before Case 3 runs.</text>
</svg>
