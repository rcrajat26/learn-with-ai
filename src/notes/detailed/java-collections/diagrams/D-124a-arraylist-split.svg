<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList spliterator splits at the exact midpoint into two equal, index-bounded halves">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="300" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList (size 10, index [0,10))</text>

  <g>
    <!-- original array cells 0-9 -->
    <g transform="translate(60,70)">
      <text x="0" y="-8" font-family="sans-serif" font-size="13" fill="#1f2937">trySplit(): mid = (lo+hi) &gt;&gt;&gt; 1 = 5</text>
      <g>
        <!-- cells -->
        <rect x="0" y="0" width="30" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
        <text x="15" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">0</text>
        <rect x="30" y="0" width="30" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
        <text x="45" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1</text>
        <rect x="60" y="0" width="30" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
        <text x="75" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2</text>
        <rect x="90" y="0" width="30" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
        <text x="105" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3</text>
        <rect x="120" y="0" width="30" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
        <text x="135" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">4</text>
        <rect x="150" y="0" width="30" height="30" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
        <text x="165" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">5</text>
        <rect x="180" y="0" width="30" height="30" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
        <text x="195" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">6</text>
        <rect x="210" y="0" width="30" height="30" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
        <text x="225" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">7</text>
        <rect x="240" y="0" width="30" height="30" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
        <text x="255" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">8</text>
        <rect x="270" y="0" width="30" height="30" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
        <text x="285" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">9</text>
      </g>
      <line x1="150" y1="-4" x2="150" y2="34" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
    </g>
  </g>

  <line x1="145" y1="110" x2="90" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="195" y1="110" x2="250" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="170" width="140" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">left half</text>
  <text x="100" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[0, 5) size 5</text>

  <rect x="190" y="170" width="140" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="260" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">right half</text>
  <text x="260" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[5, 10) size 5</text>

  <rect x="420" y="70" width="340" height="150" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="440" y="95" font-family="sans-serif" font-size="13" fill="#1f2937">Every trySplit() halves the remaining</text>
  <text x="440" y="113" font-family="sans-serif" font-size="13" fill="#1f2937">range exactly. Both halves are:</text>
  <text x="440" y="135" font-family="sans-serif" font-size="13" fill="#1f2937">- SIZED (exact count known)</text>
  <text x="440" y="153" font-family="sans-serif" font-size="13" fill="#1f2937">- SUBSIZED (recursively exact too)</text>
  <text x="440" y="171" font-family="sans-serif" font-size="13" fill="#1f2937">- ORDERED, index-bounded</text>
  <text x="440" y="195" font-family="sans-serif" font-size="13" fill="#1f2937">O(log n) depth to fully fan out.</text>
</svg>
