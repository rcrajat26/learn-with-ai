<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="SynchronousQueue handoff timeline: producer parks until a consumer arrives and the element passes directly with no internal storage, isEmpty() returns true throughout; a second lane shows ThreadPoolExecutor using SynchronousQueue so an unavailable worker forces new thread creation instead of queueing">
  <defs>
    <marker id="arrow135" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">SynchronousQueue — direct handoff, zero storage</text>

  <!-- timeline axis -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow135)"/>
  <rect x="700" y="96" width="60" height="20" rx="3" fill="#e5e7eb"/>
  <text x="730" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">time</text>

  <!-- producer lane -->
  <rect x="60" y="130" width="150" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="135" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Producer calls</text>
  <text x="135" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">put(e) — PARKS</text>

  <rect x="330" y="130" width="150" height="60" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="405" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Consumer arrives,</text>
  <text x="405" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">calls take()</text>

  <rect x="590" y="130" width="170" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="675" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Element handed over</text>
  <text x="675" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">directly — no storage node</text>

  <line x1="210" y1="160" x2="330" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow135)"/>
  <line x1="480" y1="160" x2="590" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow135)"/>

  <rect x="60" y="210" width="700" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Throughout: isEmpty() always returns true (L361); size() always returns 0 (L371) — the queue stores nothing</text>

  <rect x="60" y="254" width="700" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="70" y="272" font-family="sans-serif" font-size="12" fill="#1f2937">Internally: transferer selects TransferStack (Lifo, non-fair) or TransferQueue (Fifo, fair)</text>
  <text x="70" y="290" font-family="sans-serif" font-size="12" fill="#1f2937">based on the constructor's fair flag (L230, L234, L251-253) — a dual-data-structure, not a buffer</text>

  <!-- second lane: ThreadPoolExecutor -->
  <rect x="20" y="320" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="338" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Second lane — ThreadPoolExecutor using SynchronousQueue as its work queue</text>

  <rect x="60" y="360" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Task submitted via</text>
  <text x="150" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">execute(Runnable)</text>

  <rect x="300" y="360" width="220" height="50" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="410" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">No idle worker available to</text>
  <text x="410" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">take() the task immediately</text>

  <rect x="580" y="360" width="180" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="670" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Pool forced to create</text>
  <text x="670" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">a NEW worker thread</text>

  <line x1="240" y1="385" x2="300" y2="385" stroke="#737373" stroke-width="2" marker-end="url(#arrow135)"/>
  <line x1="520" y1="385" x2="580" y2="385" stroke="#737373" stroke-width="2" marker-end="url(#arrow135)"/>

  <rect x="60" y="426" width="700" height="46" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="410" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Because the queue never holds a task, it cannot "queue up" work behind busy threads —</text>
  <text x="410" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this is why Executors.newCachedThreadPool() uses SynchronousQueue to grow on demand</text>
</svg>
