<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 4 of 4: size() walks the entire chain node by node from head, since tail cannot be trusted as the end, making size O(n) and only approximate under concurrent modification">
  <defs>
    <marker id="arrow136d" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="16" width="760" height="24" rx="4" fill="#e5e7eb"/>
  <text x="400" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Frame 4/4 — size() (L466-478): full chain walk from head, O(n), result is approximate</text>

  <rect x="40" y="100" width="90" height="46" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="85" y="127" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">A (+1)</text>
  <rect x="180" y="100" width="90" height="46" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="225" y="127" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">B (+1)</text>
  <rect x="320" y="100" width="90" height="46" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="365" y="127" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">C (+1)</text>
  <rect x="460" y="100" width="90" height="46" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="505" y="127" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">D (+1)</text>
  <rect x="600" y="100" width="120" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="660" y="127" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">(tail may lag here)</text>

  <line x1="130" y1="123" x2="180" y2="123" stroke="#525252" stroke-width="2" marker-end="url(#arrow136d)"/>
  <line x1="270" y1="123" x2="320" y2="123" stroke="#525252" stroke-width="2" marker-end="url(#arrow136d)"/>
  <line x1="410" y1="123" x2="460" y2="123" stroke="#525252" stroke-width="2" marker-end="url(#arrow136d)"/>
  <line x1="550" y1="123" x2="600" y2="123" stroke="#737373" stroke-width="2" marker-end="url(#arrow136d)"/>

  <rect x="40" y="60" width="60" height="22" rx="3" fill="#fef3c7"/>
  <text x="70" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head / p</text>
  <line x1="70" y1="82" x2="85" y2="100" stroke="#737373" stroke-width="2" marker-end="url(#arrow136d)"/>

  <rect x="60" y="170" width="680" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">for (Node&lt;E&gt; p = first(); p != null;) if (p.item != null) count++  — walks live nodes only, ignores tail entirely</text>

  <rect x="60" y="210" width="680" height="60" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="70" y="230" font-family="sans-serif" font-size="12" fill="#1f2937">Javadoc (L460-462): "if elements are added or removed during execution of this method,</text>
  <text x="70" y="246" font-family="sans-serif" font-size="12" fill="#1f2937">the returned result may be inaccurate" — size() is O(n) and only an approximation under</text>
  <text x="70" y="262" font-family="sans-serif" font-size="12" fill="#1f2937">concurrent modification, unlike ArrayBlockingQueue's O(1) count field</text>
</svg>
