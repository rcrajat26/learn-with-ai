<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ConcurrentHashMap bin-level concurrency: empty bin filled by lock-free casTabAt, populated bin updated under synchronized(f) on the bin head, two threads on different bins simultaneously, and a reader doing tabAt volatile reads through a locked bin without blocking">

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ConcurrentHashMap bin-level concurrency (putVal, JDK 21)</text>

  <!-- table array -->
  <rect x="40" y="60" width="720" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="60" y="82" font-family="sans-serif" font-size="13" fill="#1f2937">volatile Node&lt;K,V&gt;[] table</text>
  <!-- bins -->
  <rect x="60" y="94" width="150" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[3] = null</text>

  <rect x="330" y="94" width="150" height="28" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="405" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[7]: f -&gt; n2 -&gt; n3</text>

  <rect x="600" y="94" width="140" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[11] = null</text>

  <!-- Thread A: empty bin fast path -->
  <rect x="40" y="160" width="230" height="150" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="155" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Thread A -&gt; bin[3]</text>
  <text x="60" y="204" font-family="sans-serif" font-size="13" fill="#1f2937">tabAt(tab,3) == null</text>
  <text x="60" y="224" font-family="sans-serif" font-size="13" fill="#1f2937">casTabAt(tab, 3, null,</text>
  <text x="60" y="240" font-family="sans-serif" font-size="13" fill="#1f2937">  new Node(hash,k,v))</text>
  <rect x="60" y="252" width="190" height="24" rx="3" fill="#fef3c7"/>
  <text x="155" y="269" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">no lock taken (CAS only)</text>
  <text x="60" y="296" font-family="sans-serif" font-size="13" fill="#1f2937">line 1018-1020</text>

  <!-- Thread B: locked bin head -->
  <rect x="290" y="160" width="230" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="405" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Thread B -&gt; bin[7]</text>
  <text x="310" y="204" font-family="sans-serif" font-size="13" fill="#1f2937">f = tabAt(tab,7) != null</text>
  <rect x="310" y="212" width="190" height="24" rx="3" fill="#fef3c7"/>
  <text x="405" y="229" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">synchronized (f)</text>
  <text x="310" y="252" font-family="sans-serif" font-size="13" fill="#1f2937">re-check tabAt(tab,i)==f</text>
  <text x="310" y="270" font-family="sans-serif" font-size="13" fill="#1f2937">walk / append / replace</text>
  <text x="310" y="296" font-family="sans-serif" font-size="13" fill="#1f2937">line 1029-1041 (putVal)</text>

  <!-- Thread C: different bin, unaffected -->
  <rect x="550" y="160" width="210" height="150" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="655" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Thread C -&gt; bin[11]</text>
  <text x="570" y="204" font-family="sans-serif" font-size="13" fill="#1f2937">tabAt(tab,11) == null</text>
  <text x="570" y="224" font-family="sans-serif" font-size="13" fill="#1f2937">casTabAt(tab, 11, null,</text>
  <text x="570" y="240" font-family="sans-serif" font-size="13" fill="#1f2937">  new Node(hash,k,v))</text>
  <rect x="570" y="252" width="170" height="24" rx="3" fill="#fef3c7"/>
  <text x="655" y="269" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">runs concurrently with B</text>
  <text x="570" y="296" font-family="sans-serif" font-size="13" fill="#1f2937">no shared lock with bin[7]</text>

  <!-- Reader -->
  <rect x="200" y="350" width="400" height="130" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="374" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Reader thread -&gt; get(key) on bin[7]</text>
  <text x="220" y="398" font-family="sans-serif" font-size="13" fill="#1f2937">e = tabAt(tab, 7)   // volatile-acquire read</text>
  <text x="220" y="418" font-family="sans-serif" font-size="13" fill="#1f2937">no synchronized block, no lock acquired</text>
  <rect x="220" y="428" width="360" height="24" rx="3" fill="#dcfce7"/>
  <text x="400" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">never blocks even while Thread B holds synchronized(f)</text>

  <line x1="405" y1="122" x2="405" y2="160" stroke="#525252" stroke-width="2" marker-end="url(#arrow126)"/>
  <line x1="135" y1="122" x2="155" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow126)"/>
  <line x1="670" y1="122" x2="655" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow126)"/>
  <line x1="405" y1="310" x2="400" y2="350" stroke="#525252" stroke-width="2" marker-end="url(#arrow126)"/>

  <defs>
    <marker id="arrow126" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
</svg>
