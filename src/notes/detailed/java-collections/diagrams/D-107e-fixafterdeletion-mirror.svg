<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterDeletion right-side mirror: when x is a right child, the source swaps every left/right and rotateLeft/rotateRight in cases A through D, producing the symmetric fixes">
  <defs>
    <marker id="arrow107e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterDeletion — mirror branch (x is a right child): cases A-D repeat, left/right swapped</text>

  <rect x="20" y="60" width="150" height="24" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="3"/>
  <text x="95" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">double outline = double-black x</text>
  <rect x="180" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="235" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="300" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="360" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LEFT branch (x == leftOf(parent))</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">RIGHT mirror (x == rightOf(parent))</text>

  <!-- LEFT branch mini illustration: sib is right child -->
  <line x1="160" y1="170" x2="110" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="160" y1="170" x2="220" y2="250" stroke="#737373" stroke-width="2"/>

  <circle cx="160" cy="170" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="160" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">parent</text>

  <circle cx="110" cy="250" r="28" fill="none" stroke="#525252" stroke-width="3"/>
  <circle cx="110" cy="250" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="110" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">x</text>

  <circle cx="220" cy="250" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">sib =</text>
  <text x="220" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">rightOf(p)</text>

  <text x="160" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">sib red -&gt; rotateLeft(parent)</text>
  <rect x="60" y="288" width="200" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="160" y="301" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">sib red -&gt; rotateLeft(parent)</text>

  <rect x="60" y="312" width="200" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="160" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">far child = rightOf(sib)</text>

  <!-- RIGHT mirror mini illustration: sib is left child -->
  <line x1="480" y1="170" x2="430" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="480" y1="170" x2="540" y2="250" stroke="#737373" stroke-width="2"/>

  <circle cx="480" cy="170" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="480" y="175" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">parent</text>

  <circle cx="430" cy="250" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">sib =</text>
  <text x="430" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">leftOf(p)</text>

  <circle cx="540" cy="250" r="28" fill="none" stroke="#525252" stroke-width="3"/>
  <circle cx="540" cy="250" r="22" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="540" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">x</text>

  <rect x="380" y="288" width="200" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="480" y="301" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">sib red -&gt; rotateRight(parent)</text>

  <rect x="380" y="312" width="200" height="18" rx="3" fill="#fef3c7" stroke="none"/>
  <text x="480" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">far child = leftOf(sib)</text>

  <line x1="284" y1="210" x2="356" y2="210" stroke="#737373" stroke-width="2" marker-end="url(#arrow107e)"/>
  <rect x="270" y="196" width="100" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mirror</text>

  <rect x="40" y="360" width="560" height="140" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="385" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">java.util.TreeMap.fixAfterDeletion is a single while loop with one</text>
  <text x="320" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"if (x == leftOf(parentOf(x))) { ... } else { ... }" split. Both branches run the</text>
  <text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">same 4 cases (A: sib red, B: sib black/both children black, C: sib black/near red/far black,</text>
  <text x="320" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">D: sib black/far red, terminating) with left and right swapped and rotateLeft/rotateRight swapped.</text>
  <rect x="60" y="455" width="520" height="34" rx="3" fill="#dcfce7" stroke="none"/>
  <text x="320" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4 logical cases, mirrored = 8 code branches, not 6 distinct cases.</text>
</svg>
