<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="HashMap spliterator splits by table index range; balanced only when entries are evenly distributed, skewed when they are not">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="420" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">HashMap: split by table index range [lo, hi)</text>

  <!-- table buckets 0..7 with varying chain lengths (skewed) -->
  <g transform="translate(40,70)">
    <text x="0" y="-8" font-family="sans-serif" font-size="13" fill="#1f2937">table[0..7], skewed distribution</text>
    <!-- bucket 0 -->
    <rect x="0" y="0" width="40" height="24" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="20" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>
    <rect x="45" y="0" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <!-- bucket 1: empty -->
    <rect x="0" y="30" width="40" height="24" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="20" y="46" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1</text>
    <!-- bucket 2: long chain -->
    <rect x="0" y="60" width="40" height="24" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="20" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2</text>
    <rect x="45" y="60" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <rect x="65" y="60" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <rect x="85" y="60" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <rect x="105" y="60" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <rect x="125" y="60" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <!-- bucket 3: empty -->
    <rect x="0" y="90" width="40" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="20" y="106" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">3</text>
    <!-- bucket 4 -->
    <rect x="0" y="120" width="40" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="20" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">4</text>
    <rect x="45" y="120" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <!-- bucket 5: empty -->
    <rect x="0" y="150" width="40" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="20" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">5</text>
    <!-- bucket 6: empty -->
    <rect x="0" y="180" width="40" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="20" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">6</text>
    <!-- bucket 7 -->
    <rect x="0" y="210" width="40" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="20" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">7</text>
    <rect x="45" y="210" width="16" height="16" fill="#fef3c7" stroke="#737373" stroke-width="2"/>

    <!-- split line between bucket 3 and 4 (index-range split, table halved not entry count) -->
    <line x1="-6" y1="118" x2="180" y2="118" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
  </g>

  <rect x="260" y="70" width="150" height="48" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="335" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">lo half: [0,4)</text>
  <text x="335" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">6 entries (heavy)</text>

  <rect x="260" y="240" width="150" height="48" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="335" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hi half: [4,8)</text>
  <text x="335" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2 entries (light)</text>

  <rect x="440" y="70" width="340" height="220" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="460" y="95" font-family="sans-serif" font-size="13" fill="#1f2937">Split cuts the table index range in</text>
  <text x="460" y="113" font-family="sans-serif" font-size="13" fill="#1f2937">half, not the entry count:</text>
  <text x="460" y="135" font-family="sans-serif" font-size="13" fill="#1f2937">- table[0..mid) vs table[mid..hi)</text>
  <text x="460" y="153" font-family="sans-serif" font-size="13" fill="#1f2937">- fair only if hashes spread evenly</text>
  <text x="460" y="171" font-family="sans-serif" font-size="13" fill="#1f2937">- skewed hashCode() or heavy</text>
  <text x="460" y="189" font-family="sans-serif" font-size="13" fill="#1f2937">  collision chains -&gt; one half does</text>
  <text x="460" y="207" font-family="sans-serif" font-size="13" fill="#1f2937">  most of the parallel work</text>
  <text x="460" y="229" font-family="sans-serif" font-size="13" fill="#1f2937">- SIZED at top level only; per-split</text>
  <text x="460" y="247" font-family="sans-serif" font-size="13" fill="#1f2937">  counts are estimates, not exact</text>
  <text x="460" y="269" font-family="sans-serif" font-size="13" fill="#1f2937">  (est()  counts buckets, not entries)</text>
</svg>
