<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="afterNodeAccess relinks the accessed node to the tail of a LinkedHashMap access-order chain; containsKey leaves the chain untouched">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">afterNodeAccess relinks to the tail</text>

  <!-- Panel 1 background -->
  <rect x="20" y="55" width="920" height="330" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="80" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">Panel 1: get(B) on accessOrder = true map</text>

  <!-- Before chain -->
  <text x="40" y="105" font-family="sans-serif" font-size="13" fill="#1f2937">Before: A -&gt; B -&gt; C -&gt; D  (head = A, tail = D)</text>

  <g font-family="sans-serif">
    <rect x="60" y="120" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="100" y="150" text-anchor="middle" font-size="15" fill="#1f2937">A</text>
    <rect x="220" y="120" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="260" y="150" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <rect x="380" y="120" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="420" y="150" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
    <rect x="540" y="120" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="580" y="150" text-anchor="middle" font-size="15" fill="#1f2937">D</text>

    <line x1="140" y1="138" x2="218" y2="138" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="179" y="130" text-anchor="middle" font-size="11" fill="#1f2937">after</text>
    <line x1="218" y1="152" x2="140" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="179" y="168" text-anchor="middle" font-size="11" fill="#1f2937">before</text>

    <line x1="300" y1="138" x2="378" y2="138" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="378" y1="152" x2="300" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

    <line x1="460" y1="138" x2="538" y2="138" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="538" y1="152" x2="460" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="70" y="176" width="60" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="100" y="189" text-anchor="middle" font-size="11" fill="#1f2937">head</text>
    <rect x="550" y="176" width="60" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="580" y="189" text-anchor="middle" font-size="11" fill="#1f2937">tail</text>
  </g>

  <!-- get(B) call -->
  <rect x="660" y="120" width="240" height="50" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="780" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(B) called</text>
  <text x="780" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">p=B, b=A, a=C, last=D</text>

  <!-- Steps 1-6 -->
  <text x="40" y="220" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">afterNodeAccess(B) steps, in source order:</text>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <rect x="40" y="230" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="243" font-size="12">(1) p.after = null  -&gt;  B.after = null</text>
    <rect x="40" y="252" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="265">(2) b.after = a  -&gt;  A.after = C  (b != null)</text>
    <rect x="40" y="274" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="287">(3) a.before = b  -&gt;  C.before = A  (a != null)</text>
    <rect x="40" y="296" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="309">(4) p.before = last  -&gt;  B.before = D</text>
    <rect x="40" y="318" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="331">(5) last.after = p  -&gt;  D.after = B</text>
    <rect x="40" y="340" width="420" height="18" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="46" y="353">(6) tail = p  -&gt;  tail = B</text>
  </g>

  <!-- amber modCount box -->
  <rect x="480" y="225" width="440" height="135" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="490" y="245" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">++modCount;</text>
  <text x="490" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">an access-order get bumps modCount --</text>
  <text x="490" y="281" font-family="sans-serif" font-size="12" fill="#1f2937">so it IS a structural modification to</text>
  <text x="490" y="298" font-family="sans-serif" font-size="12" fill="#1f2937">every live iterator, and concurrent reads</text>
  <text x="490" y="315" font-family="sans-serif" font-size="12" fill="#1f2937">on an access-order LinkedHashMap throw</text>
  <text x="490" y="332" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">ConcurrentModificationException</text>

  <!-- After chain -->
  <text x="40" y="380" font-family="sans-serif" font-size="13" fill="#1f2937">After: A -&gt; C -&gt; D -&gt; B  (head = A, tail = B)</text>

  <!-- Panel 2 -->
  <rect x="20" y="405" width="920" height="330" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="430" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">Panel 2: containsKey(B) on the same starting chain</text>
  <text x="40" y="452" font-family="sans-serif" font-size="13" fill="#1f2937">Chain: A -&gt; B -&gt; C -&gt; D  (head = A, tail = D)</text>

  <g font-family="sans-serif">
    <rect x="60" y="465" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="100" y="495" text-anchor="middle" font-size="15" fill="#1f2937">A</text>
    <rect x="220" y="465" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="260" y="495" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <rect x="380" y="465" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="420" y="495" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
    <rect x="540" y="465" width="80" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="580" y="495" text-anchor="middle" font-size="15" fill="#1f2937">D</text>

    <line x1="140" y1="483" x2="218" y2="483" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="218" y1="497" x2="140" y2="497" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="300" y1="483" x2="378" y2="483" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="378" y1="497" x2="300" y2="497" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="460" y1="483" x2="538" y2="483" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="538" y1="497" x2="460" y2="497" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="70" y="521" width="60" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="100" y="534" text-anchor="middle" font-size="11" fill="#1f2937">head</text>
    <rect x="550" y="521" width="60" height="18" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="580" y="534" text-anchor="middle" font-size="11" fill="#1f2937">tail</text>
  </g>

  <rect x="660" y="465" width="240" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="780" y="485" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">containsKey(B) called</text>
  <text x="780" y="503" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">chain UNTOUCHED</text>

  <rect x="770" y="521" width="130" height="20" rx="10" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="835" y="535" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no writes</text>

  <rect x="40" y="560" width="860" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="52" y="582" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">get and getOrDefault both call afterNodeAccess; containsKey does not.</text>
  <text x="52" y="601" font-family="sans-serif" font-size="12" fill="#1f2937">Probing a cache with containsKey silently fails to refresh the entry's recency.</text>
  <text x="52" y="628" font-family="sans-serif" font-size="12" fill="#1f2937">JDK 21 call sites:</text>
  <text x="52" y="647" font-family="sans-serif" font-size="12" fill="#1f2937">get / getOrDefault:  if (accessOrder) afterNodeAccess(e);</text>
  <text x="52" y="666" font-family="sans-serif" font-size="12" fill="#1f2937">containsKey: inherited from HashMap.containsKey, which only calls getNode(key)</text>
  <text x="52" y="690" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; no afterNodeAccess call anywhere on the containsKey path.</text>
</svg>
