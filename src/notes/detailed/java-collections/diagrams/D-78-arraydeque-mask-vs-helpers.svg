<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayDeque before and after: JDK 8 forced power-of-two capacity and used bitmask arithmetic for head, while JDK 21 allows arbitrary capacity such as 17 and uses a dec helper method; a version trap banner warns that power-of-two masking has not been true since JDK 9">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="26" rx="4" fill="#e5e7eb"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayDeque internals: JDK 8 power-of-two masking vs JDK 21 modulus helpers</text>

  <!-- LEFT: JDK 8 -->
  <rect x="30" y="60" width="410" height="380" rx="8" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <rect x="45" y="75" width="140" height="26" rx="4" fill="#fef3c7"/>
  <text x="115" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">JDK 8 (before)</text>

  <rect x="45" y="112" width="380" height="46" rx="4" fill="#e5e7eb"/>
  <text x="55" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">Capacity is forced up to the next power of two</text>
  <text x="55" y="148" font-family="sans-serif" font-size="12" fill="#1f2937">(e.g. requested 17 -&gt; actual capacity 32).</text>

  <rect x="45" y="168" width="380" height="26" rx="4" fill="#dbeafe"/>
  <text x="55" y="186" font-family="sans-serif" font-size="12" fill="#1f2937">head = (head - 1) &amp; (elements.length - 1);</text>

  <rect x="45" y="204" width="380" height="140" rx="4" fill="#e5e7eb"/>
  <text x="55" y="224" font-family="sans-serif" font-size="12" fill="#1f2937">Worked example — capacity 16, head = 5:</text>
  <text x="55" y="244" font-family="sans-serif" font-size="12" fill="#1f2937">elements.length - 1 = 15 = 0b01111</text>
  <text x="55" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">head - 1            =  4 = 0b00100</text>
  <text x="55" y="284" font-family="sans-serif" font-size="12" fill="#1f2937">-----------------------------------</text>
  <text x="55" y="304" font-family="sans-serif" font-size="12" fill="#1f2937">bitwise AND         =  4 = 0b00100</text>
  <rect x="55" y="314" width="330" height="22" rx="3" fill="#dcfce7"/>
  <text x="65" y="330" font-family="sans-serif" font-size="12" fill="#1f2937">new head = 4 (mask only works because 16 is a power of two)</text>

  <rect x="45" y="352" width="380" height="76" rx="4" fill="#e5e7eb"/>
  <text x="55" y="372" font-family="sans-serif" font-size="12" fill="#1f2937">Why the mask trick needs a power-of-two length:</text>
  <text x="55" y="390" font-family="sans-serif" font-size="12" fill="#1f2937">x &amp; (n-1) == x % n only holds when n = 2^k, because</text>
  <text x="55" y="408" font-family="sans-serif" font-size="12" fill="#1f2937">(n-1) is then a run of all-1 bits that wraps any index.</text>

  <!-- RIGHT: JDK 21 -->
  <rect x="460" y="60" width="410" height="380" rx="8" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <rect x="475" y="75" width="150" height="26" rx="4" fill="#fef3c7"/>
  <text x="550" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">JDK 21 (after)</text>

  <rect x="475" y="112" width="380" height="46" rx="4" fill="#e5e7eb"/>
  <text x="485" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">Capacity can be any value, arbitrary and exact</text>
  <text x="485" y="148" font-family="sans-serif" font-size="12" fill="#1f2937">(e.g. requested 17 -&gt; actual capacity 17).</text>

  <rect x="475" y="168" width="380" height="26" rx="4" fill="#dbeafe"/>
  <text x="485" y="186" font-family="sans-serif" font-size="12" fill="#1f2937">head = dec(head, 17);</text>

  <rect x="475" y="204" width="380" height="90" rx="4" fill="#e5e7eb"/>
  <text x="485" y="224" font-family="sans-serif" font-size="11" fill="#1f2937">static final int dec(int i, int modulus) {</text>
  <text x="485" y="242" font-family="sans-serif" font-size="11" fill="#1f2937">    if (--i &lt; 0) i = modulus - 1;</text>
  <text x="485" y="260" font-family="sans-serif" font-size="11" fill="#1f2937">    return i;</text>
  <text x="485" y="278" font-family="sans-serif" font-size="11" fill="#1f2937">}</text>

  <rect x="475" y="302" width="380" height="90" rx="4" fill="#e5e7eb"/>
  <text x="485" y="322" font-family="sans-serif" font-size="11" fill="#1f2937">static final int sub(int i, int j, int modulus) {</text>
  <text x="485" y="340" font-family="sans-serif" font-size="11" fill="#1f2937">    if ((i -= j) &lt; 0) i += modulus;</text>
  <text x="485" y="358" font-family="sans-serif" font-size="11" fill="#1f2937">    return i;</text>
  <text x="485" y="376" font-family="sans-serif" font-size="11" fill="#1f2937">}</text>

  <rect x="475" y="400" width="380" height="28" rx="4" fill="#dcfce7"/>
  <text x="485" y="418" font-family="sans-serif" font-size="12" fill="#1f2937">Plain conditional subtraction — no bitmask, works for any modulus.</text>

  <!-- middle arrow -->
  <line x1="440" y1="250" x2="460" y2="250" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VERSION TRAP banner -->
  <rect x="30" y="455" width="840" height="70" rx="8" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="450" y="480" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">VERSION TRAP</text>
  <text x="450" y="502" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Power-of-two masking has not been true since JDK 9 — do not rely on it in code or in interview answers.</text>
</svg>