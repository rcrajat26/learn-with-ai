<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="HashMap hash() spreading function: h=0x1F2E3D4C xor-shifted by 16, masked with n-1=15 to give index 2, versus raw h masked to index 12; compared with Java 7's three-statement four-shift version">
  <text x="30" y="34" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">hash() — one xor-shift (JDK 8+)</text>

  <!-- left panel: bit rows -->
  <g font-family="sans-serif">
    <!-- row 1: h -->
    <text x="30" y="66" font-size="13" fill="#1f2937">h (hashCode) = 0x1F2E3D4C</text>
    <rect x="30" y="74" width="500" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="280" y="94" text-anchor="middle" font-size="13" fill="#1f2937" font-family="monospace, sans-serif">0001 1111  0010 1110  0011 1101  0100 1100</text>

    <!-- row 2: h >>> 16 -->
    <text x="30" y="126" font-size="13" fill="#1f2937">h &gt;&gt;&gt; 16 = 0x00001F2E</text>
    <rect x="30" y="134" width="500" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="280" y="154" text-anchor="middle" font-size="13" fill="#1f2937" font-family="monospace, sans-serif">0000 0000  0000 0000  0001 1111  0010 1110</text>
    <rect x="30" y="168" width="240" height="18" rx="3" fill="#fef3c7"/>
    <text x="150" y="181" text-anchor="middle" font-size="11" fill="#1f2937">top 16 bits become zero</text>

    <!-- row 3: xor result -->
    <text x="30" y="216" font-size="13" fill="#1f2937">h ^ (h &gt;&gt;&gt; 16) = 0x1F2E2262</text>
    <rect x="30" y="224" width="500" height="30" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="280" y="244" text-anchor="middle" font-size="13" fill="#1f2937" font-family="monospace, sans-serif">0001 1111  0010 1110  0010 0010  0110 0010</text>

    <!-- row 4: mask n-1 -->
    <text x="30" y="276" font-size="13" fill="#1f2937">mask (n - 1) for n = 16: 0b1111 — keep low 4 bits</text>
    <rect x="30" y="284" width="500" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="280" y="304" text-anchor="middle" font-size="13" fill="#1f2937" font-family="monospace, sans-serif">0001 1111  0010 1110  0010 0010  0110 [0010]</text>
    <rect x="30" y="318" width="500" height="40" rx="3" fill="#fef3c7"/>
    <text x="280" y="333" text-anchor="middle" font-size="12" fill="#1f2937">the high-bit entropy is now folded into the low 4 bits</text>
    <text x="280" y="350" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">low 4 bits = 0010 -&gt; index 2</text>

    <!-- comparison: without spread -->
    <rect x="30" y="372" width="500" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="280" y="391" text-anchor="middle" font-size="12" fill="#1f2937">raw h low 4 bits (no spread) = 1100 -&gt; index 12</text>
    <text x="280" y="409" text-anchor="middle" font-size="12" fill="#1f2937">spreading changed the bucket from 12 to 2 for this key</text>
  </g>

  <!-- right panel: Java 7 code -->
  <rect x="560" y="66" width="310" height="330" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="575" y="92" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">Java 7, four shifts</text>
  <rect x="575" y="104" width="280" height="120" rx="4" fill="#e5e7eb"/>
  <text x="585" y="128" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">h ^= k.hashCode();</text>
  <text x="585" y="152" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">h ^= (h &gt;&gt;&gt; 20) ^ (h &gt;&gt;&gt; 12);</text>
  <text x="585" y="176" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">return h ^ (h &gt;&gt;&gt; 7)</text>
  <text x="585" y="196" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">           ^ (h &gt;&gt;&gt; 4);</text>
  <rect x="575" y="236" width="280" height="146" rx="4" fill="#dbeafe"/>
  <text x="585" y="258" font-family="sans-serif" font-size="12" fill="#1f2937">three statements, five shifts,</text>
  <text x="585" y="276" font-family="sans-serif" font-size="12" fill="#1f2937">four xors —</text>
  <text x="585" y="298" font-family="sans-serif" font-size="12" fill="#1f2937">replaced in JDK 8 by a single</text>
  <text x="585" y="316" font-family="sans-serif" font-size="12" fill="#1f2937">xor-shift because long bins</text>
  <text x="585" y="334" font-family="sans-serif" font-size="12" fill="#1f2937">now treeify (TREEIFY_THRESHOLD</text>
  <text x="585" y="352" font-family="sans-serif" font-size="12" fill="#1f2937">= 8), so extreme collision</text>
  <text x="585" y="370" font-family="sans-serif" font-size="12" fill="#1f2937">chains no longer need as much</text>
  <text x="585" y="386" font-family="sans-serif" font-size="12" fill="#1f2937">defensive spreading.</text>
  </svg>
