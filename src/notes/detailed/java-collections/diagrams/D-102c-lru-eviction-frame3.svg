<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 4: put(D) inserts, then removeEldestEntry(B) evaluates true">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">The LRU eviction cycle -- frame 3 of 4</text>
  <text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">put(D) inserts at the tail; afterNodeInsertion(true) evaluates the eldest</text>

  <rect x="40" y="80" width="820" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="52" y="102" font-family="sans-serif" font-size="12" fill="#1f2937">protected boolean removeEldestEntry(Map.Entry&lt;K,V&gt; eldest) {</text>
  <text x="70" y="122" font-family="sans-serif" font-size="12" fill="#1f2937">return size() &gt; 3;</text>
  <text x="52" y="142" font-family="sans-serif" font-size="12" fill="#1f2937">}</text>
  <text x="52" y="160" font-family="sans-serif" font-size="12" fill="#1f2937">override in effect on this map</text>

  <text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">chain after insertion: B -&gt; C -&gt; A -&gt; D  (size = 4)</text>

  <g font-family="sans-serif">
    <rect x="60" y="220" width="80" height="50" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="100" y="250" text-anchor="middle" font-size="15" fill="#1f2937">B</text>
    <rect x="215" y="220" width="80" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="255" y="250" text-anchor="middle" font-size="15" fill="#1f2937">C</text>
    <rect x="370" y="220" width="80" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="410" y="250" text-anchor="middle" font-size="15" fill="#1f2937">A</text>
    <rect x="525" y="220" width="80" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="565" y="250" text-anchor="middle" font-size="15" fill="#1f2937">D</text>

    <line x1="140" y1="238" x2="213" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="213" y1="252" x2="140" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="295" y1="238" x2="368" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="368" y1="252" x2="295" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="238" x2="523" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="523" y1="252" x2="450" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <rect x="60" y="277" width="140" height="20" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="130" y="291" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head = B (first)</text>

  <rect x="640" y="220" width="200" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="740" y="243" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 4</text>
  <text x="740" y="261" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">(insertion already done)</text>

  <rect x="40" y="320" width="820" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="348" font-family="monospace" font-size="13" fill="#1f2937">if (evict &amp;&amp; (first = head) != null &amp;&amp; removeEldestEntry(first))</text>
  <text x="60" y="368" font-family="sans-serif" font-size="12" fill="#1f2937">from afterNodeInsertion(boolean evict)</text>

  <rect x="40" y="395" width="820" height="120" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="60" y="422" font-family="sans-serif" font-size="13" fill="#1f2937">Decision point: first = head = B</text>
  <text x="60" y="446" font-family="sans-serif" font-size="13" fill="#1f2937">removeEldestEntry(B) evaluates size() &gt; 3  -&gt;  4 &gt; 3</text>
  <rect x="440" y="432" width="70" height="26" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="475" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">true</text>
  <text x="60" y="480" font-family="sans-serif" font-size="13" fill="#1f2937">Eviction is now committed for this insertion -- B will be removed in frame 4.</text>
  <text x="60" y="500" font-family="sans-serif" font-size="13" fill="#1f2937">D is red-flagged as the decision box; B is the node about to be dropped.</text>

  <rect x="40" y="530" width="820" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="60" y="558" font-family="sans-serif" font-size="13" fill="#1f2937">Note: insertion happens first (chain becomes size 4), then the eviction</text>
  <text x="60" y="578" font-family="sans-serif" font-size="13" fill="#1f2937">policy hook runs -- the map briefly exceeds capacity by one entry.</text>
</svg>
