<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="reversed() returns a thin index-flipping view, not a copy: after r.addFirst(X), both list becomes A B C X and r becomes X C B A, with the mapping r index i to list index size minus 1 minus i">
  <defs>
    <marker id="arrow25" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">reversed() is a view that writes through</text>

  <!-- BEFORE state -->
  <rect x="40" y="60" width="90" height="20" rx="3" fill="#dbeafe"/>
  <text x="85" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">before</text>

  <g font-family="sans-serif" font-size="14" fill="#1f2937">
    <rect x="150" y="60" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="175" y="85" text-anchor="middle">A</text>
    <rect x="200" y="60" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="225" y="85" text-anchor="middle">B</text>
    <rect x="250" y="60" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="275" y="85" text-anchor="middle">C</text>
  </g>
  <rect x="150" y="102" width="150" height="16" rx="3" fill="#e5e7eb"/>
  <text x="225" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">list = [A, B, C]</text>

  <!-- view wrapper: var r = list.reversed() -->
  <rect x="420" y="55" width="330" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="585" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">var r = list.reversed()</text>
  <text x="585" y="93" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">thin wrapper, not a copy</text>
  <text x="585" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r[i] &#8594; list[size - 1 - i]</text>

  <line x1="300" y1="80" x2="410" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow25)"/>

  <!-- write action -->
  <rect x="420" y="150" width="330" height="34" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="585" y="171" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">r.addFirst(X)</text>
  <line x1="585" y1="125" x2="585" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow25)"/>

  <!-- AFTER state -->
  <rect x="40" y="240" width="90" height="20" rx="3" fill="#dbeafe"/>
  <text x="85" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">after</text>

  <g font-family="sans-serif" font-size="14" fill="#1f2937">
    <rect x="150" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="175" y="265" text-anchor="middle">A</text>
    <rect x="200" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="225" y="265" text-anchor="middle">B</text>
    <rect x="250" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="275" y="265" text-anchor="middle">C</text>
    <rect x="300" y="240" width="50" height="40" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="325" y="265" text-anchor="middle">X</text>
  </g>
  <rect x="150" y="282" width="200" height="16" rx="3" fill="#e5e7eb"/>
  <text x="250" y="294" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">list = [A, B, C, X]</text>
  <rect x="150" y="302" width="200" height="16" rx="3" fill="#fef3c7"/>
  <text x="250" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">addFirst on r wrote to list's tail</text>

  <g font-family="sans-serif" font-size="14" fill="#1f2937">
    <rect x="450" y="240" width="50" height="40" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="475" y="265" text-anchor="middle">X</text>
    <rect x="500" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="525" y="265" text-anchor="middle">C</text>
    <rect x="550" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="575" y="265" text-anchor="middle">B</text>
    <rect x="600" y="240" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="625" y="265" text-anchor="middle">A</text>
  </g>
  <rect x="450" y="282" width="200" height="16" rx="3" fill="#e5e7eb"/>
  <text x="550" y="294" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r = [X, C, B, A]</text>
  <rect x="450" y="302" width="200" height="16" rx="3" fill="#fef3c7"/>
  <text x="550" y="314" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r[0]=X mirrors list[3]=X</text>

  <!-- index mapping labels -->
  <rect x="150" y="330" width="500" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">index mapping (size = 4 after the write)</text>
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">r[i] &#8594; list[size - 1 - i]</text>
  <text x="400" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">e.g. r[0] &#8594; list[3],  r[3] &#8594; list[0]</text>
</svg>
