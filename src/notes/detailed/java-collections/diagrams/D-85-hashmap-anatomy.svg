<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="HashMap anatomy: a 16-slot Node array with an empty bin, a 3-node chain bin, a treeified bin, a Node field callout, and the six HashMap constants">
  <defs>
    <marker id="arrow85" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="30" y="34" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">HashMap anatomy</text>
  <text x="30" y="54" font-family="sans-serif" font-size="13" fill="#1f2937">Node&lt;K,V&gt;[] table — 16 slots (JDK 21, java.util.HashMap)</text>

  <!-- table array -->
  <g>
    <rect x="30" y="70" width="840" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <!-- 16 cells -->
    <g font-family="sans-serif" font-size="13" fill="#1f2937">
      <!-- draw 16 vertical dividers and index labels for 0,1,2 ... 13,14,15, collapsing middle -->
    </g>
    <!-- represent as 16 equal cells -->
    <g>
      <!-- cell width = 840/16 = 52.5 -->
      <line x1="82.5" y1="70" x2="82.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="135" y1="70" x2="135" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="187.5" y1="70" x2="187.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="240" y1="70" x2="240" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="292.5" y1="70" x2="292.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="345" y1="70" x2="345" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="397.5" y1="70" x2="397.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="450" y1="70" x2="450" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="502.5" y1="70" x2="502.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="555" y1="70" x2="555" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="607.5" y1="70" x2="607.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="660" y1="70" x2="660" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="712.5" y1="70" x2="712.5" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="765" y1="70" x2="765" y2="130" stroke="#737373" stroke-width="1"/>
      <line x1="817.5" y1="70" x2="817.5" y2="130" stroke="#737373" stroke-width="1"/>
    </g>
    <!-- index labels: 0, 1(highlight empty), ... 5 (chain highlight), ... 11 (tree highlight), ... 15 -->
    <text x="56" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">0</text>
    <text x="108" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1</text>
    <text x="161" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2</text>
    <text x="213" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3</text>
    <rect x="240" y="75" width="52.5" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="266" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">4</text>
    <text x="318" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">5</text>
    <text x="371" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">6</text>
    <text x="423" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">7</text>
    <rect x="450" y="75" width="52.5" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="476" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">8</text>
    <text x="529" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">9</text>
    <text x="581" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">10</text>
    <rect x="607.5" y="75" width="52.5" height="50" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="634" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">11</text>
    <text x="686" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">12</text>
    <text x="739" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">13</text>
    <text x="791" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">14</text>
    <text x="843" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937"></text>
    <text x="843" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">15</text>
  </g>

  <!-- bin 4: empty -->
  <line x1="266" y1="130" x2="266" y2="175" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
  <rect x="196" y="175" width="140" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="266" y="197" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin 4: null (empty)</text>

  <!-- bin 8: 3-node chain -->
  <line x1="476" y1="130" x2="476" y2="175" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="386" y="175" width="90" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="431" y="199" text-anchor="middle">Node A</text>
    <line x1="476" y1="195" x2="500" y2="195" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
    <rect x="500" y="175" width="90" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="545" y="199" text-anchor="middle">Node B</text>
    <line x1="590" y1="195" x2="614" y2="195" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
    <rect x="614" y="175" width="90" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="659" y="199" text-anchor="middle">Node C</text>
    <line x1="704" y1="195" x2="726" y2="195" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
    <rect x="726" y="182" width="50" height="26" rx="3" fill="#fef3c7"/>
    <text x="751" y="200" text-anchor="middle" font-size="13">null</text>
  </g>
  <rect x="386" y="222" width="230" height="22" rx="3" fill="#dbeafe"/>
  <text x="501" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">bin 8: 3-node chain (linked list, O(n) walk)</text>

  <!-- bin 11: treeified -->
  <line x1="634" y1="130" x2="634" y2="175" stroke="#737373" stroke-width="2" marker-end="url(#arrow85)"/>
  <rect x="560" y="175" width="220" height="185" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="670" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">bin 11: TreeNode bin (treeified)</text>
  <!-- small red-black tree, ~9 nodes -->
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <circle cx="670" cy="215" r="14" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="670" y="219" text-anchor="middle">B</text>
    <line x1="659" y1="226" x2="630" y2="246" stroke="#737373" stroke-width="2"/>
    <line x1="681" y1="226" x2="710" y2="246" stroke="#737373" stroke-width="2"/>
    <circle cx="625" cy="256" r="13" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="625" y="260" text-anchor="middle">R</text>
    <circle cx="715" cy="256" r="13" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="715" y="260" text-anchor="middle">R</text>
    <line x1="617" y1="266" x2="600" y2="284" stroke="#737373" stroke-width="2"/>
    <line x1="633" y1="266" x2="650" y2="284" stroke="#737373" stroke-width="2"/>
    <line x1="707" y1="266" x2="690" y2="284" stroke="#737373" stroke-width="2"/>
    <line x1="723" y1="266" x2="740" y2="284" stroke="#737373" stroke-width="2"/>
    <circle cx="598" cy="294" r="12" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="598" y="298" text-anchor="middle">B</text>
    <circle cx="652" cy="294" r="12" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="652" y="298" text-anchor="middle">B</text>
    <circle cx="688" cy="294" r="12" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="688" y="298" text-anchor="middle">B</text>
    <circle cx="742" cy="294" r="12" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="742" y="298" text-anchor="middle">B</text>
    <circle cx="625" cy="330" r="10" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="625" y="334" text-anchor="middle">R</text>
  </g>
  <text x="670" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red-black tree, ~9 nodes, O(log n) lookup</text>

  <!-- Node field callout -->
  <rect x="30" y="245" width="330" height="190" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="45" y="270" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">Node&lt;K,V&gt; — the bin's building block</text>
  <rect x="45" y="282" width="300" height="34" rx="3" fill="#e5e7eb"/>
  <text x="55" y="303" font-family="sans-serif" font-size="13" fill="#1f2937">final int hash</text>
  <rect x="45" y="322" width="300" height="34" rx="3" fill="#e5e7eb"/>
  <text x="55" y="343" font-family="sans-serif" font-size="13" fill="#1f2937">final K key</text>
  <rect x="45" y="362" width="300" height="34" rx="3" fill="#e5e7eb"/>
  <text x="55" y="383" font-family="sans-serif" font-size="13" fill="#1f2937">V value</text>
  <rect x="45" y="402" width="300" height="26" rx="3" fill="#e5e7eb"/>
  <text x="55" y="420" font-family="sans-serif" font-size="13" fill="#1f2937">Node&lt;K,V&gt; next</text>

  <!-- constants legend -->
  <rect x="30" y="450" width="840" height="170" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="45" y="474" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">HashMap constants</text>
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <text x="45" y="500">DEFAULT_INITIAL_CAPACITY = 1 &lt;&lt; 4 (16)</text>
    <text x="45" y="524">MAXIMUM_CAPACITY = 1 &lt;&lt; 30</text>
    <text x="45" y="548">DEFAULT_LOAD_FACTOR = 0.75f</text>
    <text x="460" y="500">TREEIFY_THRESHOLD = 8</text>
    <text x="460" y="524">UNTREEIFY_THRESHOLD = 6</text>
    <text x="460" y="548">MIN_TREEIFY_CAPACITY = 64</text>
    <text x="45" y="592" font-size="12">A bin only treeifies past TREEIFY_THRESHOLD nodes AND when table.length &gt;= MIN_TREEIFY_CAPACITY;</text>
    <text x="45" y="608" font-size="12">otherwise the table just resizes. Shrinking below UNTREEIFY_THRESHOLD converts the bin back to a list.</text>
  </g>
</svg>
