<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three panels comparing a view, a copy, and a snapshot of the same source list, showing what each sees after the source is mutated">

  <defs>
    <marker id="arrow33" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowBoth33" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">View vs copy vs snapshot</text>

  <!-- PANEL 1: VIEW -->
  <rect x="20" y="55" width="270" height="380" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="155" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">View</text>
  <text x="155" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">e.g. list.subList(...)</text>

  <rect x="55" y="115" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="145" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">source list</text>

  <line x1="145" y1="165" x2="145" y2="210" stroke="#525252" stroke-width="2"
        marker-end="url(#arrowBoth33)" marker-start="url(#arrowBoth33)"/>
  <rect x="90" y="176" width="110" height="18" rx="3" fill="#fef3c7"/>
  <text x="145" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">shared array</text>

  <rect x="55" y="210" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="145" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">view (2nd box)</text>

  <rect x="45" y="280" width="200" height="40" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="145" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">source.set(0, "X")</text>

  <line x1="145" y1="280" x2="145" y2="260" stroke="#737373" stroke-width="2" marker-end="url(#arrow33)"/>

  <rect x="35" y="340" width="220" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="145" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">what view sees:</text>
  <text x="145" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">"X" immediately</text>
  <text x="145" y="400" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(same backing array)</text>

  <!-- PANEL 2: COPY -->
  <rect x="315" y="55" width="270" height="380" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Copy</text>
  <text x="450" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">e.g. new ArrayList&lt;&gt;(list)</text>

  <rect x="350" y="115" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="440" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">source list</text>

  <line x1="440" y1="165" x2="440" y2="210" stroke="#737373" stroke-width="2" marker-end="url(#arrow33)"/>
  <rect x="380" y="176" width="120" height="18" rx="3" fill="#fef3c7"/>
  <text x="440" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">one-way, at creation</text>

  <rect x="350" y="210" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="440" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">copy: own array</text>

  <rect x="340" y="280" width="200" height="40" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="440" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">source.set(0, "X")</text>

  <line x1="440" y1="280" x2="440" y2="260" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="330" y="340" width="220" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="440" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">what copy sees:</text>
  <text x="440" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">old value, unaffected</text>
  <text x="440" y="400" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(independent array)</text>

  <!-- PANEL 3: SNAPSHOT -->
  <rect x="610" y="55" width="270" height="380" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="745" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Snapshot</text>
  <text x="745" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">e.g. List.copyOf(list) @ t0</text>

  <rect x="645" y="115" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="735" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">source list</text>

  <line x1="735" y1="165" x2="735" y2="210" stroke="#737373" stroke-width="2" marker-end="url(#arrow33)"/>
  <rect x="675" y="176" width="120" height="18" rx="3" fill="#fef3c7"/>
  <text x="735" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">one-way, at t0</text>

  <rect x="645" y="210" width="180" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="735" y="234" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">snapshot: own array</text>
  <text x="735" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">timestamp: t0</text>

  <rect x="635" y="280" width="200" height="40" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="735" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">source.set(0, "X") @ t1</text>

  <line x1="735" y1="280" x2="735" y2="260" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="625" y="340" width="220" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="735" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">what snapshot sees:</text>
  <text x="735" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">state as of t0 forever</text>
  <text x="735" y="400" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(immutable, independent)</text>
</svg>
