<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="SubList as an offset window into the parent ArrayList's elementData array, with sub.set(0, X) writing into elementData[2]">

  <defs>
    <marker id="arrow34" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph34" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">subList as an offset window</text>

  <!-- Parent ArrayList box -->
  <rect x="40" y="55" width="300" height="90" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="190" y="78" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">ArrayList (parent)</text>
  <text x="190" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">elementData.length = 10</text>
  <text x="190" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 8</text>
  <text x="190" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">modCount tracked on parent</text>

  <!-- elementData array: 10 cells, index 0..9 -->
  <g font-family="sans-serif">
    <!-- cells -->
    <!-- index 0 -->
    <rect x="40" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="70" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 0</text>
    <text x="70" y="217" text-anchor="middle" font-size="12" fill="#1f2937">a</text>
    <!-- index 1 -->
    <rect x="100" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="130" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 1</text>
    <text x="130" y="217" text-anchor="middle" font-size="12" fill="#1f2937">b</text>
    <!-- index 2 (offset start, emphasized) -->
    <rect x="160" y="180" width="60" height="46" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
    <text x="190" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 2</text>
    <text x="190" y="217" text-anchor="middle" font-size="12" fill="#1f2937">c</text>
    <!-- index 3 -->
    <rect x="220" y="180" width="60" height="46" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 3</text>
    <text x="250" y="217" text-anchor="middle" font-size="12" fill="#1f2937">d</text>
    <!-- index 4 -->
    <rect x="280" y="180" width="60" height="46" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
    <text x="310" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 4</text>
    <text x="310" y="217" text-anchor="middle" font-size="12" fill="#1f2937">e</text>
    <!-- index 5 -->
    <rect x="340" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="370" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 5</text>
    <text x="370" y="217" text-anchor="middle" font-size="12" fill="#1f2937">f</text>
    <!-- index 6 -->
    <rect x="400" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="430" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 6</text>
    <text x="430" y="217" text-anchor="middle" font-size="12" fill="#1f2937">g</text>
    <!-- index 7 -->
    <rect x="460" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="490" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 7</text>
    <text x="490" y="217" text-anchor="middle" font-size="12" fill="#1f2937">h</text>
    <!-- index 8 (unused, size=8) -->
    <rect x="520" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="550" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 8</text>
    <text x="550" y="217" text-anchor="middle" font-size="11" fill="#1f2937">null</text>
    <!-- index 9 (unused) -->
    <rect x="580" y="180" width="60" height="46" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="610" y="200" text-anchor="middle" font-size="11" fill="#1f2937">idx 9</text>
    <text x="610" y="217" text-anchor="middle" font-size="11" fill="#1f2937">null</text>
  </g>
  <text x="360" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">elementData (length 10, size 8)</text>

  <!-- brace for offset window -->
  <line x1="160" y1="234" x2="340" y2="234" stroke="#525252" stroke-width="2"/>
  <line x1="160" y1="234" x2="160" y2="242" stroke="#525252" stroke-width="2"/>
  <line x1="340" y1="234" x2="340" y2="242" stroke="#525252" stroke-width="2"/>
  <rect x="205" y="246" width="90" height="18" rx="3" fill="#fef3c7"/>
  <text x="250" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">window: size 3</text>

  <!-- SubList object -->
  <rect x="470" y="290" width="290" height="140" rx="8" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="615" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">SubList sub</text>
  <text x="500" y="333" font-family="sans-serif" font-size="12" fill="#1f2937">root = parent ArrayList</text>
  <text x="500" y="351" font-family="sans-serif" font-size="12" fill="#1f2937">parent = null (direct sublist)</text>
  <text x="500" y="369" font-family="sans-serif" font-size="12" fill="#1f2937">offset = 2</text>
  <text x="500" y="387" font-family="sans-serif" font-size="12" fill="#1f2937">size = 3</text>
  <text x="500" y="405" font-family="sans-serif" font-size="12" fill="#1f2937">modCount = root.modCount (checked each op)</text>

  <!-- arrow from SubList to root -->
  <line x1="620" y1="290" x2="500" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow34)"/>
  <rect x="530" y="205" width="70" height="18" rx="3" fill="#dbeafe"/>
  <text x="565" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">root ref</text>

  <!-- sub.set(0,X) writing to elementData[2] -->
  <line x1="470" y1="340" x2="220" y2="226" stroke="#525252" stroke-width="3" marker-end="url(#arrowEmph34)"/>
  <rect x="300" y="255" width="220" height="20" rx="3" fill="#fee2e2"/>
  <text x="410" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">sub.set(0, X) writes elementData[2]</text>
</svg>
