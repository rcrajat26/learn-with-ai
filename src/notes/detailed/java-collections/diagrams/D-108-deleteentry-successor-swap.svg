<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="deleteEntry two-child case: the in-order successor's key and value are copied into the deleted node, then the successor node itself is unlinked as an easy zero-or-one-child case">
  <defs>
    <marker id="arrow108" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">deleteEntry — two-child node: copy successor's data up, then unlink the successor</text>

  <rect x="20" y="60" width="200" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="120" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= node being deleted</text>
  <rect x="230" y="60" width="220" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= in-order successor</text>
  <rect x="460" y="60" width="200" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="560" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= ordinary node</text>

  <rect x="20" y="98" width="360" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="200" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE: p (target) has two children</text>
  <rect x="420" y="98" width="360" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER: value copied up, successor unlinked</text>

  <!-- BEFORE tree -->
  <line x1="150" y1="160" x2="90" y2="230" stroke="#737373" stroke-width="2"/>
  <line x1="150" y1="160" x2="260" y2="230" stroke="#737373" stroke-width="2"/>
  <line x1="260" y1="230" x2="220" y2="300" stroke="#737373" stroke-width="2"/>
  <line x1="260" y1="230" x2="320" y2="300" stroke="#737373" stroke-width="2"/>
  <line x1="220" y1="300" x2="200" y2="370" stroke="#737373" stroke-width="2"/>

  <circle cx="150" cy="160" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="150" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">p = 40</text>
  <text x="150" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">to delete</text>

  <circle cx="90" cy="230" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="90" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">20</text>

  <circle cx="260" cy="230" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="260" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">60</text>

  <circle cx="220" cy="300" r="24" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="220" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">s = 50</text>
  <text x="220" y="311" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#1f2937">successor</text>

  <circle cx="320" cy="300" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="320" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">70</text>

  <circle cx="200" cy="370" r="20" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="375" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">none</text>

  <rect x="130" y="405" width="180" height="34" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="220" y="418" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">s = successor(p) =</text>
  <text x="220" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">leftmost of p's right subtree</text>

  <!-- Arrow between panels -->
  <line x1="384" y1="260" x2="416" y2="260" stroke="#737373" stroke-width="2" marker-end="url(#arrow108)"/>
  <rect x="360" y="230" width="80" height="22" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">copy up</text>

  <!-- AFTER tree: p's key/value become 50, old s node removed, s's right child (70... wait, s has no left child, its right child if any takes its place) -->
  <line x1="510" y1="160" x2="450" y2="230" stroke="#737373" stroke-width="2"/>
  <line x1="510" y1="160" x2="620" y2="230" stroke="#737373" stroke-width="2"/>
  <line x1="620" y1="230" x2="680" y2="300" stroke="#737373" stroke-width="2"/>

  <circle cx="510" cy="160" r="28" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="510" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">p = 50</text>
  <text x="510" y="172" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">key/value copied</text>

  <circle cx="450" cy="230" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">20</text>

  <circle cx="620" cy="230" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">60</text>

  <circle cx="680" cy="300" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="680" y="305" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">70</text>

  <rect x="440" y="330" width="200" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="540" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">old node holding 50 is unlinked</text>

  <rect x="460" y="400" width="280" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="600" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Successor is leftmost of the right subtree,</text>
  <text x="600" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">so it has NO left child by definition.</text>
  <text x="600" y="458" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Unlinking it is always the easy 0/1-child case.</text>
</svg>
