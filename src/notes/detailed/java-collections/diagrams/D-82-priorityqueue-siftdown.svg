<svg viewBox="0 0 800 1590" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="PriorityQueue siftDown after poll: root removed, last element moved to index 0, then sunk down by repeatedly swapping with the smaller child until the heap property holds, shown as tree plus array each step">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="10" width="760" height="36" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">poll() removes queue[0], moves the last element to index 0, shrinks size, then calls siftDown(0, x, size)</text>

  <!-- ================= FRAME 1 : root removed, last moved to index 0 ================= -->
  <rect x="20" y="60" width="760" height="22" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 — root (value 0) removed; last element, index 10 (value 5), slides into index 0; size 11 → 10</text>

  <g stroke="#737373" stroke-width="2">
    <line x1="400" y1="182" x2="220" y2="262"/>
    <line x1="400" y1="182" x2="580" y2="262"/>
    <line x1="220" y1="290" x2="130" y2="362"/>
    <line x1="220" y1="290" x2="310" y2="362"/>
    <line x1="580" y1="290" x2="490" y2="362"/>
    <line x1="580" y1="290" x2="670" y2="362"/>
    <line x1="130" y1="390" x2="85" y2="442"/>
    <line x1="130" y1="390" x2="175" y2="442"/>
    <line x1="310" y1="390" x2="265" y2="442"/>
    <line x1="310" y1="390" x2="355" y2="442"/>
  </g>
  <line x1="355" y1="442" x2="400" y2="182" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="400" cy="182" r="22" fill="#fee2e2" stroke="#525252" stroke-width="3" stroke-dasharray="4,3"/>
  <text x="400" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">0:∅</text>
  <circle cx="220" cy="262" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="220" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1:1</text>
  <circle cx="580" cy="262" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="580" y="267" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">2:2</text>
  <circle cx="130" cy="362" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="130" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">3:7</text>
  <circle cx="310" cy="362" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="310" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4:3</text>
  <circle cx="490" cy="362" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="490" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">5:4</text>
  <circle cx="670" cy="362" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="670" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">6:6</text>
  <circle cx="85" cy="442" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="85" y="447" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">7:9</text>
  <circle cx="175" cy="442" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="175" y="447" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">8:8</text>
  <circle cx="265" cy="442" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="265" y="447" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">9:10</text>
  <circle cx="355" cy="442" r="20" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
  <text x="355" y="447" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">10:5</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="40" y="482" width="48" height="32" fill="#fee2e2" stroke="#525252" stroke-width="3" stroke-dasharray="4,3"/>
    <text x="64" y="503" text-anchor="middle" fill="#1f2937">∅</text>
    <rect x="92" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="116" y="503" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="144" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="168" y="503" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="196" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="220" y="503" text-anchor="middle" fill="#1f2937">7</text>
    <rect x="248" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="272" y="503" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="300" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="324" y="503" text-anchor="middle" fill="#1f2937">4</text>
    <rect x="352" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="376" y="503" text-anchor="middle" fill="#1f2937">6</text>
    <rect x="404" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="428" y="503" text-anchor="middle" fill="#1f2937">9</text>
    <rect x="456" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="480" y="503" text-anchor="middle" fill="#1f2937">8</text>
    <rect x="508" y="482" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="532" y="503" text-anchor="middle" fill="#1f2937">10</text>
    <rect x="560" y="482" width="48" height="32" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
    <text x="584" y="503" text-anchor="middle" fill="#1f2937">5</text>
  </g>
  <rect x="80" y="524" width="640" height="20" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="538" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">x = queue[--size] = 5 (index 10); queue[0] = x; siftDown(0, 5, size=10) begins</text>

  <!-- ================= FRAME 2 : k=0, smaller child selection, swap ================= -->
  <rect x="20" y="562" width="760" height="22" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="578" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2 — k=0: children are 1 and 2; smaller child is index 1 (value 1); x=5 &gt; 1 ⇒ swap</text>

  <g stroke="#737373" stroke-width="2">
    <line x1="400" y1="684" x2="220" y2="764"/>
    <line x1="400" y1="684" x2="580" y2="764"/>
    <line x1="220" y1="792" x2="130" y2="864"/>
    <line x1="220" y1="792" x2="310" y2="864"/>
    <line x1="580" y1="792" x2="490" y2="864"/>
    <line x1="580" y1="792" x2="670" y2="864"/>
    <line x1="130" y1="892" x2="85" y2="944"/>
    <line x1="130" y1="892" x2="175" y2="944"/>
  </g>
  <line x1="400" y1="684" x2="220" y2="764" stroke="#525252" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <circle cx="400" cy="684" r="22" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
  <text x="400" y="689" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">0:x=5</text>
  <circle cx="220" cy="764" r="20" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="220" y="769" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1:1</text>
  <circle cx="580" cy="764" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="580" y="769" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">2:2</text>
  <circle cx="130" cy="864" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="130" y="869" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">3:7</text>
  <circle cx="310" cy="864" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="310" y="869" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4:3</text>
  <circle cx="490" cy="864" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="490" y="869" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">5:4</text>
  <circle cx="670" cy="864" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="670" y="869" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">6:6</text>
  <circle cx="85" cy="944" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="85" y="949" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">7:9</text>
  <circle cx="175" cy="944" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="175" y="949" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">8:8</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="40" y="984" width="48" height="32" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
    <text x="64" y="1005" text-anchor="middle" fill="#1f2937">x=5</text>
    <rect x="92" y="984" width="48" height="32" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
    <text x="116" y="1005" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="144" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="168" y="1005" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="196" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="220" y="1005" text-anchor="middle" fill="#1f2937">7</text>
    <rect x="248" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="272" y="1005" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="300" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="324" y="1005" text-anchor="middle" fill="#1f2937">4</text>
    <rect x="352" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="376" y="1005" text-anchor="middle" fill="#1f2937">6</text>
    <rect x="404" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="428" y="1005" text-anchor="middle" fill="#1f2937">9</text>
    <rect x="456" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="480" y="1005" text-anchor="middle" fill="#1f2937">8</text>
    <rect x="508" y="984" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="532" y="1005" text-anchor="middle" fill="#1f2937">10</text>
  </g>
  <rect x="80" y="1024" width="640" height="20" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="1038" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">right(0)=2 val 2 &gt; left(0)=1 val 1, so smaller child stays 1; queue[0]=queue[1]=1; k becomes 1 (x=5 not yet placed)</text>

  <!-- ================= FRAME 3 : k=1, smaller child selection, swap, final ================= -->
  <rect x="20" y="1062" width="760" height="22" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="1078" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3 — k=1: children are 3 and 4; smaller child is index 4 (value 3); x=5 &gt; 3 ⇒ swap; children of 4 give 5 &lt;= 10 ⇒ place x, done</text>

  <g stroke="#737373" stroke-width="2">
    <line x1="400" y1="1184" x2="220" y2="1264"/>
    <line x1="400" y1="1184" x2="580" y2="1264"/>
    <line x1="220" y1="1292" x2="130" y2="1364"/>
    <line x1="220" y1="1292" x2="310" y2="1364"/>
    <line x1="580" y1="1292" x2="490" y2="1364"/>
    <line x1="580" y1="1292" x2="670" y2="1364"/>
    <line x1="130" y1="1392" x2="85" y2="1444"/>
    <line x1="130" y1="1392" x2="175" y2="1444"/>
    <line x1="310" y1="1392" x2="265" y2="1444"/>
  </g>

  <circle cx="400" cy="1184" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="1189" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">0:1</text>
  <circle cx="220" cy="1264" r="20" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
  <text x="220" y="1269" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1:x</text>
  <circle cx="580" cy="1264" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="580" y="1269" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">2:2</text>
  <circle cx="130" cy="1364" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="130" y="1369" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">3:7</text>
  <circle cx="310" cy="1364" r="22" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="310" y="1369" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4:5</text>
  <circle cx="490" cy="1364" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="490" y="1369" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">5:4</text>
  <circle cx="670" cy="1364" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="670" y="1369" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">6:6</text>
  <circle cx="85" cy="1444" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="85" y="1449" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">7:9</text>
  <circle cx="175" cy="1444" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="175" y="1449" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">8:8</text>
  <circle cx="265" cy="1444" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="265" y="1449" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">9:10</text>

  <line x1="220" y1="1264" x2="310" y2="1364" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="1300" font-family="sans-serif" font-size="11" fill="#1f2937">x=5 settles here</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="40" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="64" y="1505" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="92" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="116" y="1505" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="144" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="168" y="1505" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="196" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="220" y="1505" text-anchor="middle" fill="#1f2937">7</text>
    <rect x="248" y="1484" width="48" height="32" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
    <text x="272" y="1505" text-anchor="middle" fill="#1f2937">5</text>
    <rect x="300" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="324" y="1505" text-anchor="middle" fill="#1f2937">4</text>
    <rect x="352" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="376" y="1505" text-anchor="middle" fill="#1f2937">6</text>
    <rect x="404" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="428" y="1505" text-anchor="middle" fill="#1f2937">9</text>
    <rect x="456" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="480" y="1505" text-anchor="middle" fill="#1f2937">8</text>
    <rect x="508" y="1484" width="48" height="32" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="532" y="1505" text-anchor="middle" fill="#1f2937">10</text>
  </g>
  <rect x="60" y="1526" width="680" height="36" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="1542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">child(4): left=9 val 10, right=10 out of bounds (size=10) ⇒ only candidate is 10</text>
  <text x="400" y="1558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">x=5 &lt;= 10 ⇒ break; queue[4]=5. Final heap: [1,3,2,7,5,4,6,9,8,10]</text>
</svg>