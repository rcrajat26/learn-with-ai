<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame A: old table and nextTable side by side, transferIndex at top of old table, transfer walks downward in strides of at least MIN_TRANSFER_STRIDE">
  <rect x="20" y="20" width="760" height="460" fill="none"/>
  <rect x="240" y="24" width="320" height="32" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Cooperative resize: ForwardingNode (frame A of 4)</text>

  <!-- old table -->
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">table (length n)</text>
  <rect x="90" y="90" width="120" height="280" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <!-- bins -->
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="90" y="90" width="120" height="35" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="150" y="112" text-anchor="middle">bin n-1</text>
    <rect x="90" y="125" width="120" height="35" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="150" y="147" text-anchor="middle">bin n-2</text>
    <rect x="90" y="160" width="120" height="35" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="150" y="182" text-anchor="middle">... migrating ...</text>
    <rect x="90" y="195" width="120" height="35" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="150" y="217" text-anchor="middle">bin i+1</text>
    <rect x="90" y="230" width="120" height="35" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="150" y="252" text-anchor="middle">bin i (next)</text>
    <rect x="90" y="265" width="120" height="35" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="150" y="287" text-anchor="middle">... not yet ...</text>
    <rect x="90" y="300" width="120" height="35" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="150" y="322" text-anchor="middle">bin 1</text>
    <rect x="90" y="335" width="120" height="35" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="150" y="357" text-anchor="middle">bin 0 (last)</text>
  </g>

  <!-- transferIndex marker at top -->
  <rect x="90" y="60" width="120" height="24" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="150" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">transferIndex</text>

  <rect x="230" y="55" width="230" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="345" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"the next table index (plus one)</text>
  <text x="345" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">to split" — field, :805; javadoc :802-804</text>

  <!-- downward arrow along old table showing walk direction -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
  <line x1="230" y1="100" x2="230" y2="360" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="222" y="200" width="16" height="60" fill="#fef3c7" stroke="none"/>
  <text x="230" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937"
        transform="rotate(90 230 230)">walks downward: high index to low</text>

  <!-- nextTable -->
  <text x="600" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">nextTable (length 2n)</text>
  <rect x="490" y="90" width="220" height="280" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <rect x="490" y="90" width="220" height="20" fill="#dcfce7" stroke="#737373" stroke-width="1.5"/>
    <text x="600" y="104" text-anchor="middle">bins 2n-1 .. n (from high half)</text>
    <rect x="490" y="110" width="220" height="20" fill="#fef3c7" stroke="#737373" stroke-width="1.5"/>
    <text x="600" y="124" text-anchor="middle">bin i+n (writing)</text>
    <rect x="490" y="130" width="220" height="20" fill="#fef3c7" stroke="#737373" stroke-width="1.5"/>
    <text x="600" y="144" text-anchor="middle">bin i (writing)</text>
    <rect x="490" y="150" width="220" height="60" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
    <text x="600" y="184" text-anchor="middle">bins n-1 .. 0 (not yet split)</text>
  </g>
  <line x1="215" y1="180" x2="485" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- stride formula -->
  <rect x="230" y="390" width="480" height="80" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="470" y="412" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    stride = (NCPU &gt; 1) ? (n &gt;&gt;&gt; 3) / NCPU : n   — transfer, :2426-2427
  </text>
  <text x="470" y="432" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    floored at MIN_TRANSFER_STRIDE = 16   (:569)
  </text>
  <text x="470" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    each CAS on transferIndex claims one stride-sized block of bins to migrate
  </text>
</svg>
