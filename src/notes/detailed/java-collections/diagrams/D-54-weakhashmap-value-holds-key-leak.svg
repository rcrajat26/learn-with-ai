<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="WeakHashMap value-holds-key leak: before, value V strongly references key K creating a strong path from the table that keeps K alive forever; after, wrapping V in a WeakReference breaks the path so K becomes collectable">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrow4red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- BEFORE panel -->
  <text x="30" y="35" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">Before: value V holds a strong field pointing back at key K -- leak</text>

  <rect x="30" y="55" width="100" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">table[i]</text>

  <line x1="130" y1="75" x2="200" y2="75" stroke="#525252" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="200" y="55" width="120" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="260" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Entry (WeakRef)</text>

  <!-- weak ref to K, dashed -->
  <line x1="260" y1="95" x2="260" y2="150" stroke="#737373" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow4)"/>
  <rect x="210" y="100" width="100" height="24" rx="3" fill="#fef3c7"/>
  <text x="260" y="117" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">weak referent</text>

  <rect x="210" y="150" width="100" height="40" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="260" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key K</text>

  <!-- strong ref: entry -> value field -->
  <line x1="320" y1="75" x2="420" y2="75" stroke="#525252" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="350" y="55" width="90" height="24" rx="3" fill="#fef3c7"/>
  <text x="395" y="72" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">value ref</text>

  <rect x="420" y="55" width="120" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">value V</text>

  <!-- V holds strong field pointing at K: the leak path -->
  <line x1="480" y1="95" x2="480" y2="140" stroke="#525252" stroke-width="2"/>
  <line x1="480" y1="140" x2="260" y2="170" stroke="#525252" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="330" y="120" width="150" height="26" rx="3" fill="#fee2e2"/>
  <text x="405" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">V.someField = K (strong)</text>

  <rect x="30" y="210" width="510" height="30" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="285" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Strong path: table -&gt; Entry -&gt; value V -&gt; K keeps K strongly reachable</text>
  <text x="285" y="255" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">Result: the weak reference to K never clears -- entry never expunged, effectively a leak</text>

  <!-- AFTER panel -->
  <text x="30" y="310" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">After: wrap V's back-reference to K in a WeakReference -- path broken</text>

  <rect x="30" y="330" width="100" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="355" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">table[i]</text>

  <line x1="130" y1="350" x2="200" y2="350" stroke="#525252" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="200" y="330" width="120" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="260" y="355" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Entry (WeakRef)</text>

  <line x1="260" y1="370" x2="260" y2="420" stroke="#737373" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow4)"/>
  <rect x="210" y="375" width="100" height="24" rx="3" fill="#fef3c7"/>
  <text x="260" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">weak referent</text>

  <rect x="210" y="420" width="100" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="260" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key K</text>
  <text x="260" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">(now collectable)</text>

  <line x1="320" y1="350" x2="420" y2="350" stroke="#525252" stroke-width="2" marker-end="url(#arrow4red)"/>
  <rect x="350" y="330" width="90" height="24" rx="3" fill="#fef3c7"/>
  <text x="395" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">value ref</text>

  <rect x="420" y="330" width="120" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="480" y="355" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">value V</text>

  <!-- broken path: V holds WeakReference<K> instead of strong field -->
  <line x1="480" y1="370" x2="480" y2="415" stroke="#737373" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="500" y="400" font-family="sans-serif" font-size="16" fill="#1f2937">X</text>
  <rect x="330" y="400" width="150" height="26" rx="3" fill="#dcfce7"/>
  <text x="405" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">V.someField = WeakRef(K)</text>
</svg>
