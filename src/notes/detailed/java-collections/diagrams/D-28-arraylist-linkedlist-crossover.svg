<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Mid-list insert cost versus n on a log-10 x axis from 10 to 1,000,000: ArrayList and LinkedList curves cross near n approx 1000, ArrayList favoured by a single vectorised memmove for large n, LinkedList penalised by n over 2 dependent pointer-chasing loads each costing roughly one cache miss">
  <defs>
    <marker id="arrow28" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="420" height="26" rx="3" fill="#e5e7eb"/>
  <text x="230" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Mid-list insert: ArrayList vs LinkedList</text>

  <!-- Crossover shading (drawn first, behind axes/curves) -->
  <rect x="278" y="60" width="130" height="380" fill="#fef3c7"/>

  <!-- Axes -->
  <line x1="80" y1="440" x2="740" y2="440" stroke="#737373" stroke-width="2" marker-end="url(#arrow28)"/>
  <line x1="80" y1="440" x2="80" y2="60" stroke="#737373" stroke-width="2" marker-end="url(#arrow28)"/>

  <!-- x ticks: n = 10, 100, 1000, 1e4, 1e5, 1e6 -->
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <line x1="80" y1="440" x2="80" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="66" y="450" width="28" height="20" rx="3" fill="#e5e7eb"/>
    <text x="80" y="464" text-anchor="middle">10</text>

    <line x1="212" y1="440" x2="212" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="192" y="450" width="40" height="20" rx="3" fill="#e5e7eb"/>
    <text x="212" y="464" text-anchor="middle">100</text>

    <line x1="344" y1="440" x2="344" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="318" y="450" width="52" height="20" rx="3" fill="#e5e7eb"/>
    <text x="344" y="464" text-anchor="middle">1,000</text>

    <line x1="476" y1="440" x2="476" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="452" y="450" width="48" height="20" rx="3" fill="#e5e7eb"/>
    <text x="476" y="464" text-anchor="middle">10^4</text>

    <line x1="608" y1="440" x2="608" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="584" y="450" width="48" height="20" rx="3" fill="#e5e7eb"/>
    <text x="608" y="464" text-anchor="middle">10^5</text>

    <line x1="740" y1="440" x2="740" y2="446" stroke="#737373" stroke-width="2"/>
    <rect x="716" y="450" width="48" height="20" rx="3" fill="#e5e7eb"/>
    <text x="740" y="464" text-anchor="middle">10^6</text>
  </g>

  <rect x="360" y="478" width="100" height="18" rx="3" fill="#e5e7eb"/>
  <text x="410" y="491" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">n (log scale)</text>

  <rect x="30" y="66" width="42" height="18" rx="3" fill="#e5e7eb"/>
  <text x="51" y="79" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">time</text>

  <!-- Crossover label -->
  <rect x="288" y="66" width="112" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="344" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">crossover ~ n=1000</text>

  <!-- ArrayList curve -->
  <polyline points="80,400 212,392 344,380 476,340 608,260 740,150"
            fill="none" stroke="#525252" stroke-width="3"/>
  <circle cx="80" cy="400" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="212" cy="392" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="344" cy="380" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="476" cy="340" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="608" cy="260" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="740" cy="150" r="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>

  <!-- LinkedList curve -->
  <polyline points="80,420 212,398 344,372 476,260 608,140 740,50"
            fill="none" stroke="#737373" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="80" cy="420" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <circle cx="212" cy="398" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <circle cx="344" cy="372" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <circle cx="476" cy="260" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <circle cx="608" cy="140" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <circle cx="740" cy="50" r="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>

  <!-- Legend -->
  <rect x="560" y="66" width="16" height="10" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <rect x="580" y="60" width="80" height="20" rx="3" fill="#e5e7eb"/>
  <text x="620" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">ArrayList</text>

  <rect x="670" y="66" width="16" height="10" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <rect x="690" y="60" width="90" height="20" rx="3" fill="#e5e7eb"/>
  <text x="735" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LinkedList</text>

  <!-- Annotations -->
  <rect x="590" y="290" width="150" height="34" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="665" y="303" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">one vectorised</text>
  <text x="665" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">memmove</text>
  <line x1="665" y1="290" x2="640" y2="260" stroke="#525252" stroke-width="2"/>

  <rect x="470" y="170" width="176" height="46" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="558" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n/2 dependent loads,</text>
  <text x="558" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">~1 cache miss each</text>
  <line x1="558" y1="170" x2="590" y2="150" stroke="#737373" stroke-width="2"/>
</svg>
