<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList remove at a middle index shifts the tail left with arraycopy then nulls the vacated last slot to avoid a memory leak, contrasted with remove of the last index which does zero copying and only nulls the final slot">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: remove(1) -->
  <rect x="20" y="16" width="340" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="190" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">remove(1) — middle element</text>

  <g font-family="sans-serif" font-size="10" fill="#1f2937">
    <text x="47" y="55" text-anchor="middle">0</text>
    <text x="102" y="55" text-anchor="middle">1</text>
    <text x="157" y="55" text-anchor="middle">2</text>
    <text x="212" y="55" text-anchor="middle">3</text>
    <text x="267" y="55" text-anchor="middle">4</text>
    <text x="322" y="55" text-anchor="middle">5</text>
  </g>

  <!-- top row: A B C D _ _ -->
  <rect x="20" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="47" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">A</text>
  <rect x="75" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="102" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">B</text>
  <rect x="130" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="157" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">C</text>
  <rect x="185" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="212" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">D</text>
  <rect x="240" y="60" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="267" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>
  <rect x="295" y="60" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="322" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>

  <!-- highlight removed index1 -->
  <rect x="75" y="58" width="55" height="48" fill="none" stroke="#525252" stroke-width="3"/>
  <rect x="60" y="112" width="90" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="105" y="127" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">B removed</text>

  <!-- source block to shift: C,D (idx 2,3) -->
  <rect x="130" y="58" width="110" height="48" fill="none" stroke="#525252" stroke-width="3"/>

  <rect x="20" y="140" width="340" height="24" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="190" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">arraycopy(elementData, 2, elementData, 1, 2)</text>

  <path d="M 157 106 C 157 190, 102 190, 102 226" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 212 106 C 212 190, 157 190, 157 226" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="sans-serif" font-size="10" fill="#1f2937">
    <text x="47" y="220" text-anchor="middle">0</text>
    <text x="102" y="220" text-anchor="middle">1</text>
    <text x="157" y="220" text-anchor="middle">2</text>
    <text x="212" y="220" text-anchor="middle">3</text>
    <text x="267" y="220" text-anchor="middle">4</text>
    <text x="322" y="220" text-anchor="middle">5</text>
  </g>

  <!-- bottom row: A C D null _ _ -->
  <rect x="20" y="226" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="47" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">A</text>
  <rect x="75" y="226" width="55" height="44" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="102" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">C</text>
  <rect x="130" y="226" width="55" height="44" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="157" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">D</text>
  <rect x="185" y="226" width="55" height="44" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="212" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
  <rect x="240" y="226" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="267" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>
  <rect x="295" y="226" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="322" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>

  <path d="M 212 270 L 212 292" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="296" width="340" height="42" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="190" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">elementData[--size] = null</text>
  <text x="190" y="329" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">otherwise D stays reachable and never gets collected</text>

  <rect x="20" y="346" width="150" height="22" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="95" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size: 4 to 3</text>

  <rect x="190" y="346" width="170" height="22" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="275" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">modCount incremented</text>

  <!-- RIGHT PANEL: remove(size-1) -->
  <rect x="430" y="16" width="350" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">remove(size-1) — last element</text>

  <g font-family="sans-serif" font-size="10" fill="#1f2937">
    <text x="457" y="55" text-anchor="middle">0</text>
    <text x="512" y="55" text-anchor="middle">1</text>
    <text x="567" y="55" text-anchor="middle">2</text>
    <text x="622" y="55" text-anchor="middle">3</text>
    <text x="677" y="55" text-anchor="middle">4</text>
    <text x="732" y="55" text-anchor="middle">5</text>
  </g>

  <!-- top row: A B C D _ _ -->
  <rect x="430" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="457" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">A</text>
  <rect x="485" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="512" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">B</text>
  <rect x="540" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="567" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">C</text>
  <rect x="595" y="60" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="622" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">D</text>
  <rect x="650" y="60" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="677" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>
  <rect x="705" y="60" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="732" y="87" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>

  <rect x="595" y="58" width="55" height="48" fill="none" stroke="#525252" stroke-width="3"/>
  <rect x="575" y="112" width="95" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="622" y="127" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">D removed</text>

  <rect x="430" y="140" width="350" height="24" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="605" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no arraycopy — 0 elements to move</text>

  <path d="M 622 106 L 622 226" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="sans-serif" font-size="10" fill="#1f2937">
    <text x="457" y="220" text-anchor="middle">0</text>
    <text x="512" y="220" text-anchor="middle">1</text>
    <text x="567" y="220" text-anchor="middle">2</text>
    <text x="622" y="220" text-anchor="middle">3</text>
    <text x="677" y="220" text-anchor="middle">4</text>
    <text x="732" y="220" text-anchor="middle">5</text>
  </g>

  <!-- bottom row: A B C null _ _ -->
  <rect x="430" y="226" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="457" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">A</text>
  <rect x="485" y="226" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="512" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">B</text>
  <rect x="540" y="226" width="55" height="44" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="567" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">C</text>
  <rect x="595" y="226" width="55" height="44" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="622" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null</text>
  <rect x="650" y="226" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="677" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>
  <rect x="705" y="226" width="55" height="44" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="732" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">_</text>

  <rect x="430" y="296" width="350" height="42" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="605" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">elementData[--size] = null</text>
  <text x="605" y="329" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">only the tail slot is touched — O(1), zero copying</text>

  <rect x="430" y="346" width="150" height="22" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="505" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size: 4 to 3</text>

  <rect x="600" y="346" width="180" height="22" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="690" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">modCount incremented</text>

  <rect x="20" y="400" width="760" height="30" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">middle remove is O(n) tail shift; last-index remove is O(1) — both null the vacated slot</text>
</svg>