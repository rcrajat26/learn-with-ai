<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Mutable key stranding: a key with id=1, hash 1001, stored in bucket 9; after mutating id to 2 its hash becomes 2002 mapping to bucket 2, but the object is still physically in bucket 9, so contains() probes bucket 2 and misses while iteration still finds it in bucket 9">
