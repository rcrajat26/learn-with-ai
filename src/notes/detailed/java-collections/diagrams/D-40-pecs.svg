<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="PECS flowchart: Collection of ? extends T produces into your method, read-only with add barred; your method consumes into Collection of ? super T, write-allowed but reads give Object; Collections.copy(dest, src) overlaid as the canonical example">

  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">PECS: Producer Extends, Consumer Super</text>

  <!-- Producer box -->
  <rect x="40" y="80" width="220" height="90" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Collection&lt;? extends T&gt;</text>
  <text x="150" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">src</text>
  <text x="150" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">read-only, add() barred</text>

  <!-- your method box -->
  <rect x="320" y="200" width="160" height="90" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">your method</text>
  <text x="400" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e.g. copy(dest, src)</text>

  <!-- Consumer box -->
  <rect x="540" y="80" width="220" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="650" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Collection&lt;? super T&gt;</text>
  <text x="650" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">dest</text>
  <text x="650" y="154" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">write-allowed; reads give Object</text>

  <!-- arrow producer -> method (inbound, PRODUCES) -->
  <line x1="150" y1="170" x2="360" y2="220" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="180" width="130" height="26" rx="3" fill="#fef3c7"/>
  <text x="215" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">PRODUCES (T out)</text>

  <!-- arrow method -> consumer (outbound, CONSUMES) -->
  <line x1="480" y1="230" x2="640" y2="170" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="180" width="130" height="26" rx="3" fill="#fef3c7"/>
  <text x="565" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">CONSUMES (T in)</text>

  <!-- Collections.copy overlay -->
  <rect x="220" y="320" width="360" height="50" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Collections.copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)</text>
  <line x1="400" y1="320" x2="400" y2="290" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- annotations -->
  <rect x="40" y="200" width="220" height="70" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="150" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">src.add(t)</text>
  <text x="150" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">compile error:</text>
  <text x="150" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">add is barred</text>

  <rect x="540" y="200" width="220" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="650" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">dest.add(t)  OK</text>
  <text x="650" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Object o = dest.get(0)</text>
  <text x="650" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">only Object is guaranteed</text>

  <rect x="300" y="410" width="200" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="432" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">extends = read, super = write</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
</svg>