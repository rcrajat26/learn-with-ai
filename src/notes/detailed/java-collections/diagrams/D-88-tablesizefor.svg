<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="tableSizeFor(100): cap-1=99 has 25 leading zero bits, -1 unsigned-shift-right 25 gives 127, plus 1 gives 128, the next power of two at or above 100">
  <text x="30" y="34" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">tableSizeFor(cap)</text>

  <rect x="30" y="50" width="840" height="66" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="45" y="74" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">int n = -1 &gt;&gt;&gt; Integer.numberOfLeadingZeros(cap - 1);</text>
  <text x="45" y="96" font-family="monospace, sans-serif" font-size="12" fill="#1f2937">return (n &lt; 0) ? 1 : (n &gt;= MAXIMUM_CAPACITY) ? MAXIMUM_CAPACITY : n + 1;</text>

  <text x="30" y="140" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">worked example: cap = 100</text>

  <!-- cap = 100 -->
  <text x="30" y="164" font-family="sans-serif" font-size="13" fill="#1f2937">cap = 100</text>
  <rect x="30" y="172" width="500" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="280" y="192" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="#1f2937">0000 0000  0000 0000  0000 0000  0110 0100</text>

  <!-- cap - 1 = 99 -->
  <text x="30" y="228" font-family="sans-serif" font-size="13" fill="#1f2937">cap - 1 = 99</text>
  <rect x="30" y="236" width="500" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="280" y="256" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="#1f2937">0000 0000  0000 0000  0000 0000  0110 0011</text>
  <!-- brace / shaded band for 25 leading zeros: bits 31..7 are zero (25 bits) -->
  <rect x="30" y="270" width="368.75" height="16" rx="3" fill="#fef3c7"/>
  <text x="214" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">25 leading zero bits</text>
  <text x="30" y="304" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Integer.numberOfLeadingZeros(99) = 25</text>

  <!-- -1 >>> 25 = 127 -->
  <text x="30" y="336" font-family="sans-serif" font-size="13" fill="#1f2937">-1 &gt;&gt;&gt; 25 = 127</text>
  <rect x="30" y="344" width="500" height="30" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="280" y="364" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="#1f2937">0000 0000  0000 0000  0000 0000  0111 1111</text>
  <rect x="30" y="380" width="500" height="34" rx="3" fill="#fef3c7"/>
  <text x="280" y="401" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">all bits below the highest set bit of 99, filled</text>

  <!-- n + 1 = 128 -->
  <text x="30" y="440" font-family="sans-serif" font-size="13" fill="#1f2937">n + 1 = 128</text>
  <rect x="30" y="448" width="500" height="30" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="280" y="468" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" fill="#1f2937">0000 0000  0000 0000  0000 0000  1000 0000</text>
  <rect x="30" y="484" width="500" height="30" rx="4" fill="#dcfce7"/>
  <text x="280" y="504" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">the next power of two &gt;= 100</text>

  <!-- right side summary panel -->
  <rect x="560" y="140" width="310" height="374" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="575" y="166" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">why this works</text>
  <text x="575" y="192" font-family="sans-serif" font-size="12" fill="#1f2937">numberOfLeadingZeros locates the</text>
  <text x="575" y="210" font-family="sans-serif" font-size="12" fill="#1f2937">position of the highest set bit of</text>
  <text x="575" y="228" font-family="sans-serif" font-size="12" fill="#1f2937">(cap - 1). Shifting -1 (all 1-bits)</text>
  <text x="575" y="246" font-family="sans-serif" font-size="12" fill="#1f2937">right by that count fills every bit</text>
  <text x="575" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">at or below that position with 1,</text>
  <text x="575" y="282" font-family="sans-serif" font-size="12" fill="#1f2937">producing the largest number that</text>
  <text x="575" y="300" font-family="sans-serif" font-size="12" fill="#1f2937">is one less than a power of two and</text>
  <text x="575" y="318" font-family="sans-serif" font-size="12" fill="#1f2937">still &gt;= (cap - 1). Adding 1 rolls</text>
  <text x="575" y="336" font-family="sans-serif" font-size="12" fill="#1f2937">that over to the power of two itself.</text>

  <text x="575" y="368" font-family="sans-serif" font-size="12" fill="#1f2937">The (cap - 1) subtraction matters:</text>
  <text x="575" y="386" font-family="sans-serif" font-size="12" fill="#1f2937">without it, a cap that is already an</text>
  <text x="575" y="404" font-family="sans-serif" font-size="12" fill="#1f2937">exact power of two (e.g. 128) would</text>
  <text x="575" y="422" font-family="sans-serif" font-size="12" fill="#1f2937">round up to the next one (256).</text>

  <text x="575" y="454" font-family="sans-serif" font-size="12" fill="#1f2937">Boundary handling per the return:</text>
  <text x="575" y="472" font-family="sans-serif" font-size="12" fill="#1f2937">n &lt; 0 (cap &lt;= 1 or overflow) -&gt; 1</text>
  <text x="575" y="490" font-family="sans-serif" font-size="12" fill="#1f2937">n &gt;= MAXIMUM_CAPACITY -&gt; MAXIMUM_CAPACITY</text>
  <text x="575" y="508" font-family="sans-serif" font-size="12" fill="#1f2937">otherwise -&gt; n + 1</text>
</svg>
