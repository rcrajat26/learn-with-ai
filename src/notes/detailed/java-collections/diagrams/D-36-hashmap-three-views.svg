<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="HashMap with its three cached views KeySet, Values, and EntrySet, each showing what remove does through it, that add throws UnsupportedOperationException, and that EntrySet's iterator yields the real Node objects">

  <defs>
    <marker id="arrow36" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">The three Map views</text>

  <!-- Central HashMap table -->
  <rect x="330" y="230" width="240" height="120" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937" font-weight="bold">HashMap</text>
  <text x="450" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">table: Node&lt;K,V&gt;[]</text>
  <text x="450" y="293" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cached: keySet, values, entrySet</text>
  <text x="450" y="311" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">fields (lazily created, reused)</text>
  <text x="450" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size, modCount</text>

  <!-- KeySet (top) -->
  <rect x="60" y="60" width="220" height="90" rx="8" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="170" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">keySet()</text>
  <text x="170" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">final class KeySet</text>
  <text x="170" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">thin view, no own storage</text>
  <text x="170" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iterates table's keys</text>

  <line x1="280" y1="130" x2="420" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow36)"/>

  <rect x="60" y="170" width="220" height="20" rx="3" fill="#dcfce7"/>
  <text x="170" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove(k): removes the mapping</text>

  <rect x="60" y="195" width="220" height="20" rx="3" fill="#fee2e2"/>
  <text x="170" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add(k): throws UnsupportedOperationException</text>

  <!-- Values (left) -->
  <rect x="60" y="380" width="220" height="90" rx="8" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="170" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">values()</text>
  <text x="170" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">final class Values</text>
  <text x="170" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">thin view, no own storage</text>
  <text x="170" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iterates table's values</text>

  <line x1="280" y1="400" x2="420" y2="320" stroke="#737373" stroke-width="2" marker-end="url(#arrow36)"/>

  <rect x="60" y="480" width="240" height="20" rx="3" fill="#dcfce7"/>
  <text x="180" y="494" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove(v): removes one matching mapping</text>

  <rect x="60" y="505" width="240" height="20" rx="3" fill="#fee2e2"/>
  <text x="180" y="519" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add(v): throws UnsupportedOperationException</text>

  <!-- EntrySet (right) -->
  <rect x="620" y="60" width="220" height="90" rx="8" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="730" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">entrySet()</text>
  <text x="730" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">final class EntrySet</text>
  <text x="730" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">thin view, no own storage</text>
  <text x="730" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iterates table's entries</text>

  <line x1="620" y1="130" x2="480" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow36)"/>

  <rect x="620" y="170" width="220" height="20" rx="3" fill="#dcfce7"/>
  <text x="730" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove(e): removes the entry (key+value)</text>

  <rect x="620" y="195" width="220" height="20" rx="3" fill="#fee2e2"/>
  <text x="730" y="209" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add(e): throws UnsupportedOperationException</text>

  <!-- EntrySet iterator yields real Node objects -->
  <rect x="620" y="380" width="220" height="100" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="730" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">EntryIterator.next()</text>
  <text x="730" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">returns the actual</text>
  <text x="730" y="436" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node&lt;K,V&gt; from the table</text>
  <text x="730" y="452" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Node&lt;K,V&gt; implements</text>
  <text x="730" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Map.Entry&lt;K,V&gt; (no copy)</text>

  <line x1="620" y1="410" x2="480" y2="330" stroke="#525252" stroke-width="2" marker-end="url(#arrow36)"/>
</svg>
