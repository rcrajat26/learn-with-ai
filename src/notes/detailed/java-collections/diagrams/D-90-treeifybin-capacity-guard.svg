<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="treeifyBin capacity guard: resize is the wide default branch when table length is below MIN_TREEIFY_CAPACITY 64, treeify is the narrow branch taken only at 64 or larger, with a worked ladder of table lengths">
  <defs>
    <marker id="arrow90" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">treeifyBin's capacity guard</text>

  <!-- source quote -->
  <rect x="40" y="38" width="820" height="66" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">if (tab == null || (n = tab.length) &lt; MIN_TREEIFY_CAPACITY)</text>
  <text x="450" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">    resize();</text>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">else if ((e = tab[index = (n - 1) &amp; hash]) != null) { ...treeify... }</text>

  <!-- root decision -->
  <rect x="330" y="120" width="240" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">tab.length &lt;</text>
  <text x="450" y="163" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MIN_TREEIFY_CAPACITY (64)</text>

  <!-- wide default branch: resize -->
  <line x1="380" y1="180" x2="220" y2="230" stroke="#525252" stroke-width="4" marker-end="url(#arrow90)"/>
  <rect x="130" y="228" width="90" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="1"/>
  <text x="175" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">yes (typical)</text>

  <rect x="40" y="254" width="280" height="110" rx="10" fill="#dbeafe" stroke="#525252" stroke-width="4"/>
  <text x="180" y="284" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">resize();</text>
  <text x="180" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">DEFAULT / expected path —</text>
  <text x="180" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">table of 16, 32 or 48 is</text>
  <text x="180" y="338" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">below 64 and takes this arm</text>
  <text x="180" y="354" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">every time</text>

  <!-- narrow branch: treeify -->
  <line x1="520" y1="180" x2="640" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow90)"/>
  <rect x="595" y="200" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="610" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <rect x="600" y="230" width="230" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="715" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">else if (tab[index =</text>
  <text x="715" y="271" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">(n - 1) &amp; hash] != null)</text>

  <line x1="715" y1="290" x2="715" y2="310" stroke="#737373" stroke-width="2" marker-end="url(#arrow90)"/>

  <rect x="610" y="310" width="210" height="90" rx="8" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="715" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">treeify:</text>
  <text x="715" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">bin becomes a</text>
  <text x="715" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">red-black TreeNode bin</text>
  <text x="715" y="388" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(narrow path, reached only</text>

  <rect x="610" y="404" width="210" height="20" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="715" y="418" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">when tab.length &gt;= 64)</text>

  <!-- explanatory label -->
  <rect x="40" y="400" width="380" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="422" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">At small capacity a long bin means the</text>
  <text x="230" y="440" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">table is too small, not that hashing is bad.</text>
  <text x="230" y="458" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">Doubling the table is cheaper and more</text>
  <text x="230" y="476" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">likely to fix it than building a tree.</text>

  <!-- worked ladder -->
  <text x="450" y="512" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Worked ladder of table lengths</text>

  <g font-family="sans-serif" font-size="13">
    <rect x="330" y="524" width="90" height="34" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="375" y="546" text-anchor="middle" fill="#1f2937">16 -&gt; resize</text>

    <rect x="330" y="564" width="90" height="34" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="375" y="586" text-anchor="middle" fill="#1f2937">32 -&gt; resize</text>

    <rect x="480" y="524" width="90" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="525" y="546" text-anchor="middle" fill="#1f2937">64 -&gt; treeify</text>

    <rect x="480" y="564" width="100" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="530" y="586" text-anchor="middle" fill="#1f2937">128 -&gt; treeify</text>
  </g>

  <!-- constant derivation -->
  <rect x="40" y="612" width="820" height="66" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="634" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f2937">MIN_TREEIFY_CAPACITY = 64 = 4 * TREEIFY_THRESHOLD</text>
  <text x="450" y="654" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">Class comment: "Should be at least 4 * TREEIFY_THRESHOLD to avoid conflicts</text>
  <text x="450" y="670" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">between resizing and treeification thresholds."</text>
</svg>
