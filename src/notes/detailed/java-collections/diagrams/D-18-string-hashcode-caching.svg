<svg viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="String.hashCode computation and caching across three frames: computing hash of Hi as 2337, caching it in the hash field with hashIsZero false, then a string whose real hash is 0 setting hashIsZero true to block recomputation">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Frame 1 -->
  <rect x="20" y="20" width="760" height="220" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="34" width="330" height="26" rx="3" fill="#dbeafe"/>
  <text x="201" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Frame 1 &#8212; computing hashCode() of "Hi"</text>

  <rect x="50" y="80" width="140" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">"Hi"</text>

  <line x1="190" y1="105" x2="270" y2="105" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="196" y="86" width="70" height="22" rx="3" fill="#fef3c7"/>
  <text x="231" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">char[0]='H'</text>

  <rect x="270" y="80" width="220" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="380" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">s[0] = 'H'*31 + 'i'</text>
  <text x="380" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 72*31 + 105</text>

  <line x1="490" y1="105" x2="580" y2="105" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="80" width="160" height="50" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="660" y="102" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2232 + 105</text>
  <text x="660" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">= 2337</text>

  <rect x="50" y="150" width="690" height="70" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="395" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">General recurrence: h = 0; for each char c: h = h*31 + c</text>
  <text x="395" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"Hi" = 'H'(72) then 'i'(105): h = (0*31+72)*31 + 105 = 72*31 + 105 = 2337</text>

  <!-- Frame 2 -->
  <rect x="20" y="270" width="760" height="220" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="284" width="440" height="26" rx="3" fill="#dbeafe"/>
  <text x="256" y="302" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Frame 2 &#8212; caching the computed hash on the String object</text>

  <rect x="60" y="330" width="300" height="130" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="210" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">String "Hi" instance</text>
  <rect x="80" y="368" width="260" height="30" rx="3" fill="#fee2e2"/>
  <text x="210" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash = 0  (before first call)</text>
  <rect x="80" y="406" width="260" height="30" rx="3" fill="#dcfce7"/>
  <text x="210" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash = 2337  (after first call)</text>

  <line x1="360" y1="393" x2="470" y2="393" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="368" y="374" width="94" height="22" rx="3" fill="#fef3c7"/>
  <text x="415" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hashCode()</text>

  <rect x="470" y="330" width="260" height="130" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="352" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">field state, Java 13+</text>
  <rect x="486" y="368" width="228" height="30" rx="3" fill="#f3f4f6"/>
  <text x="600" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash: int = 2337</text>
  <rect x="486" y="406" width="228" height="30" rx="3" fill="#f3f4f6"/>
  <text x="600" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hashIsZero: boolean = false</text>

  <!-- Frame 3 -->
  <rect x="20" y="520" width="760" height="220" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="534" width="560" height="26" rx="3" fill="#dbeafe"/>
  <text x="316" y="552" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Frame 3 &#8212; a string whose real hash is genuinely 0</text>

  <rect x="60" y="580" width="300" height="130" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="210" y="602" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">String "" instance</text>
  <rect x="80" y="618" width="260" height="30" rx="3" fill="#f3f4f6"/>
  <text x="210" y="638" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash = 0  (computed value)</text>
  <rect x="80" y="656" width="260" height="30" rx="3" fill="#dcfce7"/>
  <text x="210" y="676" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hashIsZero = true</text>

  <line x1="360" y1="643" x2="470" y2="643" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="368" y="624" width="94" height="22" rx="3" fill="#fef3c7"/>
  <text x="415" y="640" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2nd call</text>

  <rect x="470" y="580" width="260" height="130" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="602" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">no recomputation</text>
  <text x="600" y="628" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hashIsZero=true is checked</text>
  <text x="600" y="648" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">before the pre-13 test</text>
  <text x="600" y="668" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"hash == 0", so the loop</text>
  <text x="600" y="688" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">is skipped and 0 is returned</text>
</svg>
