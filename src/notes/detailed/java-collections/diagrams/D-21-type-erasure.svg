<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Type erasure before and after compilation: List of String and List of Integer at source collapse to one java.util.List class object with inserted checkcasts, and ArrayList stores everything in an Object array with a suppressed-warning unchecked cast in elementData">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <rect x="30" y="20" width="380" height="30" rx="4" fill="#dbeafe"/>
  <text x="220" y="41" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">BEFORE &#8212; source, compile time</text>

  <rect x="490" y="20" width="380" height="30" rx="4" fill="#dcfce7"/>
  <text x="680" y="41" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AFTER &#8212; .class file, run time</text>

  <line x1="450" y1="20" x2="450" y2="580" stroke="#737373" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Before boxes -->
  <rect x="50" y="80" width="340" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">List&lt;String&gt; names</text>
  <text x="220" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">compiler checks String-only access</text>

  <rect x="50" y="180" width="340" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">List&lt;Integer&gt; ids</text>
  <text x="220" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">compiler checks Integer-only access</text>

  <line x1="220" y1="150" x2="220" y2="180" stroke="#737373" stroke-width="0"/>

  <line x1="390" y1="115" x2="450" y2="115" stroke="#737373" stroke-width="0"/>

  <!-- arrows to erased class -->
  <line x1="390" y1="115" x2="530" y2="140" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="215" x2="530" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="392" y="150" width="70" height="22" rx="3" fill="#fef3c7"/>
  <text x="427" y="166" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">erasure</text>

  <!-- After: one class object -->
  <rect x="530" y="80" width="340" height="90" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="700" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">one shared class object</text>
  <text x="700" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">java.util.List</text>
  <text x="700" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">both variables reference the same Class&lt;List&gt;</text>

  <!-- checkcasts -->
  <rect x="530" y="200" width="340" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="700" y="226" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">inserted checkcast instructions</text>
  <text x="700" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">String s = names.get(0);</text>
  <text x="700" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">&#8594; Object o = names.get(0); checkcast String</text>

  <!-- ArrayList internals -->
  <rect x="30" y="340" width="840" height="240" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="46" y="354" width="360" height="26" rx="3" fill="#dbeafe"/>
  <text x="226" y="372" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList backing store, either type</text>

  <rect x="60" y="400" width="380" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="250" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Object[] elementData</text>
  <rect x="80" y="440" width="60" height="30" rx="3" fill="#f3f4f6"/>
  <text x="110" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"a"</text>
  <rect x="150" y="440" width="60" height="30" rx="3" fill="#f3f4f6"/>
  <text x="180" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">42</text>
  <rect x="220" y="440" width="60" height="30" rx="3" fill="#f3f4f6"/>
  <text x="250" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"b"</text>
  <rect x="290" y="440" width="130" height="30" rx="3" fill="#f3f4f6"/>
  <text x="355" y="460" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">no type tag stored</text>

  <line x1="440" y1="445" x2="500" y2="445" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="400" width="370" height="150" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="685" y="424" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">E elementData(int index)</text>
  <rect x="520" y="438" width="330" height="26" rx="3" fill="#f3f4f6"/>
  <text x="685" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">@SuppressWarnings("unchecked")</text>
  <rect x="520" y="470" width="330" height="26" rx="3" fill="#f3f4f6"/>
  <text x="685" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">return (E) elementData[index];</text>
  <text x="685" y="516" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">the compiler cannot verify this cast at</text>
  <text x="685" y="536" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">compile time, so it trusts get()'s caller</text>
</svg>