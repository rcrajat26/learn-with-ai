<svg viewBox="0 0 1120 790" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The iteration protocol family, drawn as two side-by-side trees. Left tree, pull iteration: legacy Enumeration (hasMoreElements, nextElement) is NOT a supertype of Iterator but bridges to it through the Java 9 default method asIterator. Iterator (hasNext, next, remove, forEachRemaining) has two subinterfaces: ListIterator, which adds hasPrevious, previous, nextIndex, previousIndex, set and add for bidirectional traversal with in-place mutation; and PrimitiveIterator, which adds a primitive-typed next method to avoid boxing and has three nested specializations OfInt, OfLong and OfDouble. A note records that ArrayList, HashMap and TreeMap iterators are fail-fast via modCount while CopyOnWriteArrayList and ConcurrentHashMap iterators are weakly consistent. Right tree, split iteration: Spliterator (tryAdvance, forEachRemaining, trySplit, estimateSize, getExactSizeIfKnown, characteristics, hasCharacteristics, getComparator) extends to Spliterator.OfPrimitive, which has nested specializations OfInt, OfLong and OfDouble. A note lists the characteristics bitmask flags ORDERED, DISTINCT, SORTED, SIZED, NONNULL, IMMUTABLE, CONCURRENT and SUBSIZED. A two-way dotted bridge between the trees marks Spliterators.iterator and Spliterators.spliterator as adapters, not inheritance.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .iface { font-size: 15px; font-weight: 600; }
    .ifac2 { font-size: 13.5px; font-weight: 600; }
    .cls   { font-size: 12.5px; }
    .row   { font-size: 11px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .it    { font-size: 10.5px; font-style: italic; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12px; font-weight: 700; letter-spacing: .5px; fill: #374151; }
    .hb    { font-size: 11px; font-weight: 700; }

    .boxI  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxS  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .note  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .ext   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .nest  { fill: none; stroke: #15803d; stroke-width: 1.6; stroke-dasharray: 6 4;
             stroke-linejoin: round; marker-end: url(#triG); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 1.8; stroke-dasharray: 3 3;
             stroke-linejoin: round; marker-end: url(#triA); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="790" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="20" y="32" class="lbl h1">THE ITERATION PROTOCOL FAMILY</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="40" y="66" class="lbl h2">PULL ITERATION — Iterator family (one element at a time)</text>
  <text x="700" y="66" class="lbl h2">SPLIT ITERATION — Spliterator family (Java 8)</text>

  <!-- ================= LANE A: Enumeration -> Iterator ================= -->
  <rect x="190" y="96" width="260" height="80" rx="6" class="boxL"/>
  <text x="320" y="118" text-anchor="middle" class="lbl iface">Enumeration&lt;E&gt;</text>
  <text x="320" y="137" text-anchor="middle" class="lbl cls">hasMoreElements() · nextElement()</text>
  <text x="320" y="155" text-anchor="middle" class="lbl sub">legacy Java 1.0 · Vector / Hashtable</text>
  <text x="320" y="170" text-anchor="middle" class="lbl sub">NOT a supertype of Iterator</text>

  <path class="adapt" d="M 320 176 V 212"/>
  <text x="334" y="190" class="lbl sub">asIterator() — Java 9 default method</text>
  <text x="334" y="204" class="lbl sub">an adapter, not inheritance</text>

  <!-- Iterator -->
  <rect x="150" y="214" width="340" height="112" rx="6" class="boxI"/>
  <text x="320" y="238" text-anchor="middle" class="lbl iface">Iterator&lt;E&gt;</text>
  <text x="320" y="259" text-anchor="middle" class="lbl cls">hasNext() · next()</text>
  <text x="320" y="277" text-anchor="middle" class="lbl cls">remove() — optional operation</text>
  <text x="320" y="295" text-anchor="middle" class="lbl cls">forEachRemaining(Consumer&lt;? super E&gt;)</text>
  <text x="320" y="315" text-anchor="middle" class="lbl sub">4 methods · since Java 1.2 (forEachRemaining: 8)</text>

  <!-- bus to the two subinterfaces -->
  <path d="M 320 326 V 348 M 170 348 H 470" fill="none" stroke="#475569" stroke-width="2"/>
  <path class="ext" d="M 170 348 V 368"/>
  <path class="ext" d="M 470 348 V 368"/>

  <!-- ListIterator -->
  <rect x="40" y="370" width="260" height="110" rx="6" class="boxI"/>
  <text x="170" y="392" text-anchor="middle" class="lbl ifac2">ListIterator&lt;E&gt;</text>
  <text x="170" y="408" text-anchor="middle" class="lbl it">extends Iterator&lt;E&gt;</text>
  <text x="170" y="428" text-anchor="middle" class="lbl cls">+ hasPrevious() · previous()</text>
  <text x="170" y="445" text-anchor="middle" class="lbl cls">+ nextIndex() · previousIndex()</text>
  <text x="170" y="462" text-anchor="middle" class="lbl cls">+ set(E) · add(E)</text>
  <text x="170" y="476" text-anchor="middle" class="lbl sub">bidirectional + in-place mutation</text>

  <!-- PrimitiveIterator -->
  <rect x="340" y="370" width="260" height="110" rx="6" class="boxI"/>
  <text x="470" y="392" text-anchor="middle" class="lbl ifac2">PrimitiveIterator&lt;T,T_CONS&gt;</text>
  <text x="470" y="408" text-anchor="middle" class="lbl it">extends Iterator&lt;T&gt;</text>
  <text x="470" y="429" text-anchor="middle" class="lbl cls">adds a primitive-typed next</text>
  <text x="470" y="446" text-anchor="middle" class="lbl cls">no boxing per element</text>
  <text x="470" y="470" text-anchor="middle" class="lbl sub">3 nested specializations ↓</text>

  <path class="nest" d="M 470 480 V 510"/>
  <rect x="290" y="512" width="370" height="94" rx="6" class="boxS"/>
  <text x="302" y="531" class="lbl hb">PrimitiveIterator nested specializations</text>
  <text x="302" y="552" class="lbl sub">OfInt · nextInt() · forEachRemaining(IntConsumer)</text>
  <text x="302" y="572" class="lbl sub">OfLong · nextLong() · forEachRemaining(LongConsumer)</text>
  <text x="302" y="592" class="lbl sub">OfDouble · nextDouble() · forEachRemaining(DoubleConsumer)</text>

  <!-- Lane A note -->
  <rect x="40" y="622" width="600" height="96" rx="6" class="note"/>
  <text x="54" y="642" class="lbl hb">ITERATOR SEMANTICS — WHAT INTERVIEWS ASK</text>
  <text x="54" y="661" class="lbl row">ArrayList / HashMap / TreeMap iterators are FAIL-FAST: a structural change made</text>
  <text x="54" y="678" class="lbl row">outside the iterator bumps modCount → ConcurrentModificationException.</text>
  <text x="54" y="695" class="lbl row">CopyOnWriteArrayList / ConcurrentHashMap iterators are WEAKLY CONSISTENT: never</text>
  <text x="54" y="712" class="lbl row">throw CME, may or may not reflect updates made after creation.</text>

  <!-- ================= BRIDGE BETWEEN THE TWO FAMILIES ================= -->
  <text x="595" y="246" text-anchor="middle" class="lbl sub">Spliterators.iterator(spl)</text>
  <text x="595" y="259" text-anchor="middle" class="lbl sub">Spliterators.spliterator(itr)</text>
  <path class="adapt" d="M 698 274 H 494"/>
  <path class="adapt" d="M 492 274 H 696"/>

  <!-- ================= LANE B: Spliterator ================= -->
  <rect x="700" y="214" width="380" height="134" rx="6" class="boxI"/>
  <text x="890" y="238" text-anchor="middle" class="lbl iface">Spliterator&lt;T&gt;</text>
  <text x="890" y="259" text-anchor="middle" class="lbl cls">tryAdvance(Consumer) · forEachRemaining(Consumer)</text>
  <text x="890" y="277" text-anchor="middle" class="lbl cls">trySplit() : Spliterator&lt;T&gt;</text>
  <text x="890" y="295" text-anchor="middle" class="lbl cls">estimateSize() · getExactSizeIfKnown()</text>
  <text x="890" y="313" text-anchor="middle" class="lbl cls">characteristics() · hasCharacteristics(int)</text>
  <text x="890" y="331" text-anchor="middle" class="lbl cls">getComparator()</text>
  <text x="890" y="344" text-anchor="middle" class="lbl sub">8 methods · Java 8 · backs every Stream source</text>

  <path class="ext" d="M 890 348 V 388"/>

  <rect x="700" y="390" width="380" height="72" rx="6" class="boxI"/>
  <text x="890" y="412" text-anchor="middle" class="lbl ifac2">Spliterator.OfPrimitive&lt;T,T_CONS,T_SPLITR&gt;</text>
  <text x="890" y="428" text-anchor="middle" class="lbl it">extends Spliterator&lt;T&gt;</text>
  <text x="890" y="449" text-anchor="middle" class="lbl cls">tryAdvance(T_CONS) · forEachRemaining(T_CONS)</text>

  <path class="nest" d="M 890 462 V 492"/>
  <rect x="700" y="494" width="380" height="94" rx="6" class="boxS"/>
  <text x="712" y="513" class="lbl hb">Spliterator nested specializations</text>
  <text x="712" y="534" class="lbl row">OfInt · tryAdvance(IntConsumer) · trySplit() : OfInt</text>
  <text x="712" y="554" class="lbl row">OfLong · tryAdvance(LongConsumer) · trySplit() : OfLong</text>
  <text x="712" y="574" class="lbl row">OfDouble · tryAdvance(DoubleConsumer) · trySplit() : OfDouble</text>

  <!-- Lane B note -->
  <rect x="700" y="622" width="380" height="96" rx="6" class="note"/>
  <text x="714" y="642" class="lbl hb">CHARACTERISTICS BITMASK</text>
  <text x="714" y="661" class="lbl row">ORDERED · DISTINCT · SORTED · SIZED</text>
  <text x="714" y="678" class="lbl row">NONNULL · IMMUTABLE · CONCURRENT · SUBSIZED</text>
  <text x="714" y="695" class="lbl row">Stream pipelines read these to choose a strategy —</text>
  <text x="714" y="712" class="lbl row">SIZED + SUBSIZED is what enables balanced splits.</text>

  <!-- ================= LEGEND ================= -->
  <line x1="20" y1="742" x2="1100" y2="742" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="754" width="22" height="16" rx="3" class="boxI"/>
  <text x="50" y="767" class="lbl tiny">interface</text>

  <rect x="126" y="754" width="22" height="16" rx="3" class="boxS"/>
  <text x="156" y="767" class="lbl tiny">nested specialization</text>

  <rect x="300" y="754" width="22" height="16" rx="3" class="boxL"/>
  <text x="330" y="767" class="lbl tiny">legacy interface</text>

  <path class="ext" d="M 442 762 H 482"/>
  <text x="490" y="767" class="lbl tiny">A → B : B extends A</text>

  <path class="nest" d="M 628 762 H 668"/>
  <text x="676" y="767" class="lbl tiny">nested type of</text>

  <path class="adapt" d="M 786 762 H 826"/>
  <text x="834" y="767" class="lbl tiny">adapter / bridge — NOT inheritance</text>
</svg>
