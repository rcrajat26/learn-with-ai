<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Iterator state machine: READY, RETURNED, REMOVED, EXHAUSTED states with hasNext, next, remove transitions, and the illegal remove edges from READY and REMOVED that throw IllegalStateException">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="280" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Iterator state machine</text>

  <!-- READY -->
  <rect x="80" y="110" width="200" height="90" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="180" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">READY</text>
  <text x="180" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">initial state / after next()</text>
  <text x="180" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">advanced past a removed element</text>

  <!-- RETURNED -->
  <rect x="520" y="110" width="200" height="90" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="620" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">RETURNED</text>
  <text x="620" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next() has handed back the</text>
  <text x="620" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">current element; remove() is legal</text>

  <!-- REMOVED -->
  <rect x="520" y="400" width="200" height="90" rx="8" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="620" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">REMOVED</text>
  <text x="620" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">current element deleted;</text>
  <text x="620" y="473" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove() again is illegal</text>

  <!-- EXHAUSTED -->
  <rect x="80" y="400" width="200" height="90" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="180" y="440" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">EXHAUSTED</text>
  <text x="180" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hasNext() = false;</text>
  <text x="180" y="473" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">terminal — no elements remain</text>

  <!-- READY -> RETURNED : next() -->
  <line x1="280" y1="150" x2="520" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="128" width="80" height="20" rx="3" fill="#fef3c7"/>
  <text x="400" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next()</text>

  <!-- RETURNED -> REMOVED : remove() -->
  <line x1="620" y1="200" x2="620" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="290" width="80" height="20" rx="3" fill="#fef3c7"/>
  <text x="620" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove()</text>

  <!-- REMOVED -> RETURNED : next() (curved return path) -->
  <path d="M 720 400 C 780 300 780 200 720 165" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="270" width="80" height="20" rx="3" fill="#fef3c7"/>
  <text x="740" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next()</text>

  <!-- RETURNED self-loop : next() advance, more elements -->
  <path d="M 690 110 C 700 70 620 60 570 90" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="55" width="150" height="20" rx="3" fill="#fef3c7"/>
  <text x="635" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next() [more elements]</text>

  <!-- RETURNED -> EXHAUSTED : next() no more elements -->
  <line x1="520" y1="180" x2="280" y2="435" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="270" width="230" height="36" rx="3" fill="#fee2e2"/>
  <text x="445" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next() [no more elements]</text>
  <text x="445" y="299" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws NoSuchElementException</text>

  <!-- EXHAUSTED self-loop hasNext() -->
  <path d="M 130 400 C 100 360 100 340 130 400" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="330" width="110" height="20" rx="3" fill="#fef3c7"/>
  <text x="85" y="344" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hasNext() = false</text>

  <!-- READY self-loop hasNext() -->
  <path d="M 150 110 C 120 70 120 50 150 110" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="55" width="110" height="20" rx="3" fill="#fef3c7"/>
  <text x="85" y="69" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hasNext() query</text>

  <!-- illegal edge: READY remove() self loop -->
  <path d="M 80 155 C 20 155 20 190 80 190" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="10" y="200" width="150" height="36" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="85" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove()</text>
  <text x="85" y="229" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">IllegalStateException</text>

  <!-- illegal edge: REMOVED remove() self loop -->
  <path d="M 720 445 C 780 445 780 480 720 480" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="640" y="510" width="150" height="36" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="715" y="524" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove()</text>
  <text x="715" y="539" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">IllegalStateException</text>

  <!-- legend -->
  <rect x="80" y="560" width="18" height="14" fill="#525252"/>
  <text x="105" y="572" font-family="sans-serif" font-size="11" fill="#1f2937">dashed grey = illegal call, throws</text>
</svg>