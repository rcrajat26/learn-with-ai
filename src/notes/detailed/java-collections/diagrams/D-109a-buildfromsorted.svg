<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frame 1: 15 sorted entries with the recursive midpoint selection marking the root and the two recursive halves">
  <defs>
    <marker id="arrow109a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="360" height="20" rx="3" fill="#e5e7eb"/>
  <text x="200" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">buildFromSorted(15 entries) — step 1: pick midpoint</text>

  <!-- 15 sorted array cells, values 1..15, index below -->
  <g>
    <!-- values 1..7 -->
    <g fill="#dbeafe">
      <rect x="20" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="52" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="84" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="116" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="148" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="180" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="212" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
    </g>
    <!-- midpoint value 8, index 7 -->
    <rect x="244" y="56" width="36" height="40" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <!-- values 9..15 -->
    <g fill="#dbeafe">
      <rect x="280" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="312" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="344" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="376" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="408" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="440" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
      <rect x="472" y="60" width="32" height="32" rx="3" stroke="#737373" stroke-width="2"/>
    </g>

    <!-- value labels -->
    <g font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">
      <text x="36" y="80">1</text><text x="68" y="80">2</text><text x="100" y="80">3</text>
      <text x="132" y="80">4</text><text x="164" y="80">5</text><text x="196" y="80">6</text>
      <text x="228" y="80">7</text>
      <text x="262" y="80" font-size="15">8</text>
      <text x="296" y="80">9</text><text x="328" y="80">10</text><text x="360" y="80">11</text>
      <text x="392" y="80">12</text><text x="424" y="80">13</text><text x="456" y="80">14</text>
      <text x="488" y="80">15</text>
    </g>
    <!-- index labels -->
    <g font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">
      <text x="36" y="106">i0</text><text x="68" y="106">i1</text><text x="100" y="106">i2</text>
      <text x="132" y="106">i3</text><text x="164" y="106">i4</text><text x="196" y="106">i5</text>
      <text x="228" y="106">i6</text><text x="262" y="106">i7</text>
      <text x="296" y="106">i8</text><text x="328" y="106">i9</text><text x="360" y="106">i10</text>
      <text x="392" y="106">i11</text><text x="424" y="106">i12</text><text x="456" y="106">i13</text>
      <text x="488" y="106">i14</text>
    </g>
  </g>

  <rect x="222" y="118" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="262" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mid = (0+14)/2 = 7</text>

  <line x1="262" y1="96" x2="262" y2="160" stroke="#525252" stroke-width="2" marker-end="url(#arrow109a)"/>
  <rect x="222" y="164" width="80" height="30" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="262" y="183" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">root: 8</text>

  <line x1="140" y1="96" x2="220" y2="176" stroke="#737373" stroke-width="2" marker-end="url(#arrow109a)"/>
  <rect x="20" y="204" width="180" height="26" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="110" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">left half i0..i6 (1..7) — recurse</text>

  <line x1="380" y1="96" x2="304" y2="176" stroke="#737373" stroke-width="2" marker-end="url(#arrow109a)"/>
  <rect x="380" y="204" width="180" height="26" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="470" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">right half i8..i14 (9..15) — recurse</text>

  <rect x="20" y="248" width="560" height="30" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="300" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Each level halves the range: total work across all levels is O(n), touching each entry once</text>
</svg>
