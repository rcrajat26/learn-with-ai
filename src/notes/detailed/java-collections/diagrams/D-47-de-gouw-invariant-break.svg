<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after: the de Gouw invariant break in TimSort's merge stack causes an ArrayIndexOutOfBoundsException when stack depth exceeds the preallocated array; the JDK fix enlarged the stackLen array bound rather than correcting the merge invariant">
  <defs>
    <marker id="arrowD47" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">de Gouw et al.: TimSort merge-stack invariant break</text>

  <line x1="400" y1="60" x2="400" y2="475" stroke="#737373" stroke-width="2"/>

  <!-- LEFT: the bug -->
  <rect x="30" y="60" width="360" height="24" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="210" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE: stack grows past assumed bound</text>

  <rect x="40" y="95" width="340" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="210" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mergeCollapse(): each local invariant check passes — depth unbounded here</text>

  <g>
    <rect x="40" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="58" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r1</text>
    <rect x="78" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="96" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r2</text>
    <rect x="116" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="134" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r3</text>
    <rect x="154" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="172" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r4</text>
    <rect x="192" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="210" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r5</text>
    <rect x="230" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="248" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r6</text>
    <rect x="268" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="286" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r7</text>
    <rect x="306" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="324" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r8</text>
    <rect x="344" y="131" width="36" height="28" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="362" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r9</text>
  </g>

  <!-- array slots: only 8 preallocated -->
  <g>
    <rect x="40" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="58" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r1</text>
    <rect x="78" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="96" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r2</text>
    <rect x="116" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="134" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r3</text>
    <rect x="154" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="172" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r4</text>
    <rect x="192" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="210" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r5</text>
    <rect x="230" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="248" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r6</text>
    <rect x="268" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="286" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r7</text>
    <rect x="306" y="171" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="324" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r8</text>
    <rect x="344" y="171" width="36" height="28" fill="#fee2e2" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="362" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r9?</text>
  </g>

  <rect x="40" y="207" width="340" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="210" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">stackLen[] = 8 preallocated slots (indices 0-7)</text>

  <line x1="362" y1="199" x2="362" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrowD47)"/>

  <rect x="40" y="240" width="340" height="70" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="210" y="257" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pushRun(): runBase[stackSize++] = ...</text>
  <text x="210" y="273" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">stackSize reaches 8, array length is 8</text>
  <text x="210" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; ArrayIndexOutOfBoundsException</text>
  <text x="210" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">thrown at TimSort.pushRun() / mergeCollapse()</text>

  <!-- RIGHT: the fix -->
  <rect x="410" y="60" width="360" height="24" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="590" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER (JDK fix): stackLen bound enlarged</text>

  <rect x="420" y="95" width="340" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="590" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Same run-length sequence; mergeCollapse() logic is untouched</text>

  <g>
    <rect x="420" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="438" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r1</text>
    <rect x="458" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="476" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r2</text>
    <rect x="496" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="514" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r3</text>
    <rect x="534" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="552" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r4</text>
    <rect x="572" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="590" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r5</text>
    <rect x="610" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="628" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r6</text>
    <rect x="648" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="666" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r7</text>
    <rect x="686" y="131" width="36" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="704" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r8</text>
    <rect x="724" y="131" width="36" height="28" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="742" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r9</text>
  </g>

  <!-- array slots: enlarged to 10 -->
  <g>
    <rect x="420" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="436" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r1</text>
    <rect x="454" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="470" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r2</text>
    <rect x="488" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="504" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r3</text>
    <rect x="522" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="538" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r4</text>
    <rect x="556" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="572" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r5</text>
    <rect x="590" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="606" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r6</text>
    <rect x="624" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="640" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r7</text>
    <rect x="658" y="171" width="32" height="28" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="674" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r8</text>
    <rect x="692" y="171" width="32" height="28" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="708" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">r9</text>
    <rect x="726" y="171" width="32" height="28" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="742" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">-</text>
  </g>

  <rect x="420" y="207" width="340" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="590" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">stackLen[] enlarged to 10 slots (JDK fix)</text>

  <line x1="708" y1="199" x2="708" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrowD47)"/>

  <rect x="420" y="240" width="340" height="70" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="590" y="257" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pushRun(): runBase[stackSize++] = ...</text>
  <text x="590" y="273" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">stackSize reaches 8, array length is now 10</text>
  <text x="590" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; fits, no exception</text>
  <text x="590" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mergeCollapse() algorithm itself is unchanged</text>

  <rect x="20" y="430" width="760" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">JDK fix: enlarged the stackLen bound (INITIAL_TMP_STORAGE_LENGTH / stack length</text>
  <text x="400" y="467" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">computation in TimSort / ComparableTimSort) — it did NOT correct the merge invariant.</text>
</svg>
