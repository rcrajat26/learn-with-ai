<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after diagram of rotateLeft(x) on a red-black or BST tree, showing the six numbered pointer writes and the unchanged in-order sequence">
  <defs>
    <marker id="arrowLL" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="740" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="390" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">rotateLeft(x) — x is G's right child, y = x.right</text>

  <!-- BEFORE panel -->
  <rect x="30" y="55" width="130" height="24" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="95" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE</text>

  <line x1="200" y1="72" x2="270" y2="130" stroke="#737373" stroke-width="2"/>
  <line x1="270" y1="150" x2="220" y2="210" stroke="#737373" stroke-width="2"/>
  <line x1="270" y1="150" x2="330" y2="210" stroke="#737373" stroke-width="2"/>
  <line x1="330" y1="230" x2="295" y2="285" stroke="#737373" stroke-width="2"/>
  <line x1="330" y1="230" x2="365" y2="285" stroke="#737373" stroke-width="2"/>

  <circle cx="200" cy="72" r="20" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="200" y="77" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">G</text>
  <circle cx="270" cy="150" r="22" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="270" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">x</text>
  <circle cx="330" cy="230" r="22" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="330" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">y</text>

  <polygon points="220,210 200,250 240,250" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <polygon points="295,285 275,320 315,320" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="295" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">&#946;</text>
  <polygon points="365,285 345,320 385,320" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="365" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>

  <rect x="120" y="380" width="260" height="26" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="250" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">in-order: A, x, &#946;, y, C</text>

  <!-- AFTER panel -->
  <rect x="640" y="55" width="130" height="24" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="705" y="72" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER</text>

  <line x1="600" y1="72" x2="670" y2="130" stroke="#737373" stroke-width="2"/>
  <line x1="670" y1="150" x2="620" y2="210" stroke="#737373" stroke-width="2"/>
  <line x1="670" y1="150" x2="740" y2="210" stroke="#737373" stroke-width="2"/>
  <line x1="620" y1="230" x2="585" y2="285" stroke="#737373" stroke-width="2"/>
  <line x1="620" y1="230" x2="655" y2="285" stroke="#737373" stroke-width="2"/>

  <circle cx="600" cy="72" r="20" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="600" y="77" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">G</text>
  <circle cx="670" cy="150" r="22" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="670" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">y</text>
  <circle cx="620" cy="230" r="22" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="620" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">x</text>
  <polygon points="740,210 720,250 760,250" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="740" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>

  <polygon points="585,285 565,320 605,320" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="585" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <polygon points="655,285 635,320 675,320" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="655" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">&#946;</text>

  <rect x="530" y="380" width="260" height="26" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="660" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">in-order: A, x, &#946;, y, C (unchanged)</text>

  <!-- numbered pointer-write callouts on AFTER tree -->
  <circle cx="602" cy="105" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="602" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">3</text>
  <circle cx="632" cy="105" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="632" y="109" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">4</text>
  <circle cx="640" cy="185" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="640" y="189" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">5</text>
  <circle cx="670" cy="185" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="670" y="189" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">6</text>
  <circle cx="618" cy="262" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="618" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1</text>
  <circle cx="648" cy="262" r="12" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="648" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">2</text>

  <!-- legend of the 6 pointer writes -->
  <rect x="20" y="415" width="760" height="75" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="35" y="433" font-family="sans-serif" font-size="12" fill="#1f2937">1: x.right = y.left (&#946;)     2: &#946;.parent = x     3: y.parent = x.parent (G)</text>
  <text x="35" y="453" font-family="sans-serif" font-size="12" fill="#1f2937">4: G.right = y  (x was G's right child)     5: y.left = x     6: x.parent = y</text>
  <text x="35" y="478" font-family="sans-serif" font-size="12" fill="#1f2937">Only x, y, &#946; and their parent pointers move; subtrees A and C keep their contents and relative order.</text>
</svg>
