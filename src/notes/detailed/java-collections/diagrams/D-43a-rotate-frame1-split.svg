<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="rotate frame 1: array 1..7 with distance 3, split point at index 4 (mid = -distance mod size + size = 4)">
  <defs>
    <marker id="arrow43a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="300" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1: original, distance = 3</text>

  <!-- 7 boxes, width 90, gap 10, start x=55 -->
  <g font-family="sans-serif">
    <!-- part A: index 0-3 blue -->
    <rect x="55" y="80" width="90" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="100" y="115" text-anchor="middle" font-size="15" fill="#1f2937">1</text>
    <rect x="155" y="80" width="90" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="200" y="115" text-anchor="middle" font-size="15" fill="#1f2937">2</text>
    <rect x="255" y="80" width="90" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="300" y="115" text-anchor="middle" font-size="15" fill="#1f2937">3</text>
    <rect x="355" y="80" width="90" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="400" y="115" text-anchor="middle" font-size="15" fill="#1f2937">4</text>
    <!-- part B: index 4-6 neutral -->
    <rect x="455" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="500" y="115" text-anchor="middle" font-size="15" fill="#1f2937">5</text>
    <rect x="555" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="600" y="115" text-anchor="middle" font-size="15" fill="#1f2937">6</text>
    <rect x="655" y="80" width="90" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="700" y="115" text-anchor="middle" font-size="15" fill="#1f2937">7</text>

    <!-- index labels -->
    <text x="100" y="70" text-anchor="middle" font-size="11" fill="#1f2937">0</text>
    <text x="200" y="70" text-anchor="middle" font-size="11" fill="#1f2937">1</text>
    <text x="300" y="70" text-anchor="middle" font-size="11" fill="#1f2937">2</text>
    <text x="400" y="70" text-anchor="middle" font-size="11" fill="#1f2937">3</text>
    <text x="500" y="70" text-anchor="middle" font-size="11" fill="#1f2937">4</text>
    <text x="600" y="70" text-anchor="middle" font-size="11" fill="#1f2937">5</text>
    <text x="700" y="70" text-anchor="middle" font-size="11" fill="#1f2937">6</text>
  </g>

  <!-- split marker at x=450 (boundary between index3 and index4) -->
  <line x1="450" y1="75" x2="450" y2="150" stroke="#525252" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="230" y="190" width="340" height="46" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">split point = size - (distance mod size) = 7 - 3 = 4</text>
  <text x="400" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">first part = [0,4), second part = [4,7)</text>
</svg>
