<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="LinkedHashSet.addFirst(B) unlinks B from the middle of the insertion-order chain and relinks it at the head, producing B, A, C with size unchanged at 3">
  <defs>
    <marker id="arrow26" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph26" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- Before title -->
  <rect x="20" y="20" width="260" height="26" rx="3" fill="#e5e7eb"/>
  <text x="150" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Before: [A, B, C]</text>

  <!-- Before row -->
  <rect x="60" y="70" width="120" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>

  <rect x="270" y="70" width="120" height="56" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="330" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <rect x="480" y="70" width="120" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="540" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

  <line x1="180" y1="98" x2="270" y2="98" stroke="#737373" stroke-width="2" marker-end="url(#arrow26)"/>
  <line x1="390" y1="98" x2="480" y2="98" stroke="#737373" stroke-width="2" marker-end="url(#arrow26)"/>

  <rect x="60" y="136" width="640" height="24" rx="3" fill="#e5e7eb"/>
  <text x="380" y="153" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">insertion-order chain: head -&gt; A -&gt; B -&gt; C -&gt; tail</text>

  <!-- Move annotation -->
  <path d="M 330 126 C 330 190 180 190 180 220" fill="none" stroke="#525252" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#arrowEmph26)"/>
  <rect x="150" y="176" width="290" height="24" rx="3" fill="#fef3c7"/>
  <text x="295" y="193" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">unlinked from old slot, relinked at head</text>

  <!-- After title -->
  <rect x="20" y="220" width="330" height="26" rx="3" fill="#e5e7eb"/>
  <text x="185" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">After addFirst(B): [B, A, C]</text>

  <!-- After row -->
  <rect x="60" y="256" width="120" height="56" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="120" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>

  <rect x="270" y="256" width="120" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="330" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>

  <rect x="480" y="256" width="120" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="540" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

  <line x1="180" y1="284" x2="270" y2="284" stroke="#737373" stroke-width="2" marker-end="url(#arrow26)"/>
  <line x1="390" y1="284" x2="480" y2="284" stroke="#737373" stroke-width="2" marker-end="url(#arrow26)"/>

  <rect x="620" y="256" width="140" height="30" rx="3" fill="#fef3c7"/>
  <text x="690" y="276" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size unchanged = 3</text>
</svg>
