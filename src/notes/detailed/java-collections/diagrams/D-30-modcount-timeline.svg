<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline of modCount and expectedModCount during a for-each loop: list.remove(x) bumps modCount only, then the next next() call compares and throws ConcurrentModificationException">
  <defs>
    <marker id="arrow30" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- title -->
  <rect x="20" y="20" width="760" height="24" rx="4" fill="#e5e7eb"/>
  <text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937">modCount vs expectedModCount over a for-each loop</text>

  <!-- track labels -->
  <rect x="30" y="95" width="110" height="20" rx="3" fill="#dbeafe"/>
  <text x="85" y="110" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">modCount</text>

  <rect x="30" y="185" width="150" height="20" rx="3" fill="#dcfce7"/>
  <text x="105" y="200" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">expectedModCount</text>

  <!-- modCount step line: 0 until remove at x=420, then steps to 1 -->
  <path d="M 200 150 L 420 150 L 420 105 L 740 105"
        fill="none" stroke="#525252" stroke-width="3" marker-end="url(#arrow30)"/>
  <rect x="205" y="130" width="20" height="16" rx="3" fill="#dbeafe"/>
  <text x="215" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>
  <rect x="700" y="82" width="20" height="16" rx="3" fill="#dbeafe"/>
  <text x="710" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1</text>

  <!-- expectedModCount flat line at 0 the whole time -->
  <path d="M 200 200 L 740 200" fill="none" stroke="#525252" stroke-width="3" marker-end="url(#arrow30)"/>
  <rect x="205" y="180" width="20" height="16" rx="3" fill="#dcfce7"/>
  <text x="215" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>
  <rect x="700" y="180" width="20" height="16" rx="3" fill="#dcfce7"/>
  <text x="710" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>

  <!-- baseline axis -->
  <line x1="60" y1="240" x2="760" y2="240" stroke="#737373" stroke-width="2" marker-end="url(#arrow30)"/>
  <rect x="360" y="248" width="140" height="18" rx="3" fill="#e5e7eb"/>
  <text x="430" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">iteration timeline</text>

  <!-- event 1: iterator created / first next() -->
  <circle cx="200" cy="240" r="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <rect x="130" y="60" width="140" height="18" rx="3" fill="#e5e7eb"/>
  <text x="200" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next() returns A, B...</text>
  <line x1="200" y1="78" x2="200" y2="240" stroke="#737373" stroke-width="1"/>

  <!-- event 2: list.remove(x) bumps modCount only -->
  <circle cx="420" cy="240" r="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <rect x="330" y="20" width="180" height="34" rx="4" fill="#fee2e2"/>
  <text x="420" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">list.remove(x)</text>
  <text x="420" y="49" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bumps modCount only</text>
  <line x1="420" y1="54" x2="420" y2="240" stroke="#737373" stroke-width="1"/>

  <!-- event 3: next() call runs checkForComodification and throws -->
  <circle cx="600" cy="240" r="6" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <rect x="470" y="120" width="260" height="50" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">next() calls checkForComodification()</text>
  <text x="600" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">modCount(1) != expectedModCount(0)</text>
  <text x="600" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws ConcurrentModificationException</text>
  <line x1="600" y1="170" x2="600" y2="240" stroke="#737373" stroke-width="1"/>
</svg>
