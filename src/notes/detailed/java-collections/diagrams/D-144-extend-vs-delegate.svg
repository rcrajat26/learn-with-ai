<svg viewBox="0 0 920 630" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Extend vs delegate: ValidatingList extends ArrayList and overrides add, but ArrayList's own addAll copies elements directly and never calls add, so validation is skipped; a forwarding decorator routes every method including addAll through the wrapper so validation cannot be bypassed">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="40" y="20" width="840" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="460" y="43" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Extend vs delegate: can addAll() bypass an overridden add()?</text>

  <!-- ================= LEFT PANEL: extends (broken) ================= -->
  <rect x="40" y="76" width="390" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="235" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">BEFORE: extends ArrayList&lt;E&gt; (broken)</text>

  <rect x="40" y="120" width="390" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="235" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">class ValidatingList</text>
  <text x="235" y="163" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">extends ArrayList&lt;E&gt;</text>

  <!-- Flow 1: add(e) works -->
  <rect x="60" y="196" width="90" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="105" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">client</text>
  <line x1="150" y1="214" x2="200" y2="214" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="196" width="210" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="305" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">list.add(e)</text>

  <line x1="305" y1="232" x2="305" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="252" width="210" height="56" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="305" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ValidatingList.add(e)</text>
  <text x="305" y="295" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[override] validate(e)</text>

  <line x1="305" y1="308" x2="305" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="328" width="210" height="36" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="305" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">super.add(e) -&gt; added</text>

  <!-- Flow 2: addAll(coll) bypasses override -->
  <rect x="60" y="404" width="90" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="105" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">client</text>
  <line x1="150" y1="422" x2="200" y2="422" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="404" width="210" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="305" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">list.addAll(coll)</text>

  <line x1="305" y1="440" x2="305" y2="460" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="460" width="210" height="56" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="305" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ArrayList.addAll(coll)</text>
  <text x="305" y="503" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[inherited, skips add(e)]</text>

  <line x1="305" y1="516" x2="305" y2="536" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="536" width="210" height="56" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="305" y="558" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">add(e) never called</text>
  <text x="305" y="579" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">validation skipped!</text>

  <!-- ================= RIGHT PANEL: forwarding decorator (safe) ================= -->
  <rect x="470" y="76" width="390" height="30" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="665" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AFTER: forwarding decorator (safe)</text>

  <rect x="470" y="120" width="390" height="56" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="665" y="142" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">class ValidatingListDecorator</text>
  <text x="665" y="163" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">wraps: List&lt;E&gt; delegate</text>

  <!-- Flow 1: add(e) -->
  <rect x="470" y="196" width="90" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="515" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">client</text>
  <line x1="560" y1="214" x2="600" y2="214" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="196" width="240" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="720" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">decorator.add(e)</text>

  <line x1="720" y1="232" x2="720" y2="252" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="252" width="240" height="36" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="720" y="274" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">validate(e)</text>

  <line x1="720" y1="288" x2="720" y2="308" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="308" width="240" height="36" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="720" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">delegate.add(e) -&gt; added</text>

  <!-- Flow 2: addAll(coll) still routes through the wrapper -->
  <rect x="470" y="404" width="90" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="515" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">client</text>
  <line x1="560" y1="422" x2="600" y2="422" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="404" width="240" height="36" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="720" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">decorator.addAll(coll)</text>

  <line x1="720" y1="440" x2="720" y2="460" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="460" width="240" height="56" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="720" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">decorator's OWN addAll(coll)</text>
  <text x="720" y="503" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[own method, not inherited]</text>

  <line x1="720" y1="516" x2="720" y2="536" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="536" width="240" height="56" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="720" y="558" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">validates each, then</text>
  <text x="720" y="579" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">cannot escape validation</text>
</svg>
