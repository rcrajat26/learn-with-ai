<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame D: size() traversing the whole chain in O(n), approximate, including a logically removed node still physically linked">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="16"
        fill="#1f2937" font-weight="bold">Frame D — size() is a full, approximate O(n) traversal</text>

  <rect x="55" y="100" width="70" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="90" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <line x1="125" y1="120" x2="170" y2="120" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="175" y="100" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="210" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <line x1="245" y1="120" x2="290" y2="120" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- logically removed node -->
  <rect x="295" y="100" width="90" height="40" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="340" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">item=null</text>
  <text x="340" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">unlinked lazily</text>
  <line x1="385" y1="120" x2="430" y2="120" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="435" y="100" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="470" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">D</text>
  <line x1="505" y1="120" x2="550" y2="120" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="555" y="100" width="70" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="590" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">E</text>

  <text x="340" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">item CASed null (casItem), still physically linked</text>

  <!-- traversal arrow sweeping across -->
  <rect x="55" y="60" width="570" height="24" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size() walks p = p.next across the ENTIRE chain, counting p.item != null</text>

  <rect x="55" y="185" width="290" height="34" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="200" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Cost: O(n) — line 466</text>

  <rect x="360" y="185" width="320" height="34" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="520" y="206" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Result: APPROXIMATE, not exact</text>

  <rect x="55" y="230" width="700" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Concurrent adds and removes during the walk mean the count returned</text>
  <text x="405" y="266" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">may never have been the true size at any single instant — Javadoc warns</text>
  <text x="405" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this method is "typically not very useful in concurrent applications."</text>
</svg>
