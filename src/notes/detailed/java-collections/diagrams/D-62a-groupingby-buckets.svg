<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="groupingBy classifying six words by first letter into buckets a, b, c as a HashMap of Character to List of String">
  <defs>
    <marker id="arrow62a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Input: apple, avocado, apricot, banana, blueberry, cherry</text>

  <rect x="50" y="60" width="110" height="40" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="105" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">apple</text>

  <rect x="168" y="60" width="110" height="40" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="223" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">avocado</text>

  <rect x="286" y="60" width="110" height="40" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="341" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">apricot</text>

  <rect x="404" y="60" width="110" height="40" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="459" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">banana</text>

  <rect x="522" y="60" width="110" height="40" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="577" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">blueberry</text>

  <rect x="640" y="60" width="110" height="40" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="695" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">cherry</text>

  <line x1="400" y1="100" x2="400" y2="145" stroke="#737373" stroke-width="2" marker-end="url(#arrow62a)"/>
  <rect x="270" y="112" width="260" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="129" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">groupingBy(w -&gt; w.charAt(0))</text>

  <rect x="80" y="170" width="200" height="80" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="180" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a &#8594;</text>
  <text x="180" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[apple, avocado,</text>
  <text x="180" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">apricot]</text>

  <rect x="320" y="170" width="200" height="80" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="420" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">b &#8594;</text>
  <text x="420" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[banana,</text>
  <text x="420" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">blueberry]</text>

  <rect x="560" y="170" width="160" height="80" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="640" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">c &#8594;</text>
  <text x="640" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">[cherry]</text>

  <rect x="80" y="266" width="640" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Map&lt;Character,List&lt;String&gt;&gt; backed by HashMap — key order not specified</text>
</svg>
