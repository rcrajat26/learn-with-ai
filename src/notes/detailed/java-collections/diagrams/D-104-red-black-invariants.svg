<svg viewBox="0 0 700 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A 9-node red-black tree with NIL leaves illustrating the five red-black invariants, three equal black-height paths, and the height bound h less than or equal to 2 log2(n+1) for n=9">
  <defs>
    <marker id="arrow104" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="10" width="660" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="350" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Red-black tree invariants — 9 nodes (values shown), NIL leaves in gray</text>

  <!-- edges (drawn before nodes) -->
  <line x1="350" y1="60" x2="200" y2="150" stroke="#737373" stroke-width="2"/>
  <line x1="350" y1="60" x2="500" y2="150" stroke="#737373" stroke-width="2"/>
  <line x1="200" y1="150" x2="120" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="200" y1="150" x2="280" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="500" y1="150" x2="420" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="500" y1="150" x2="580" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="120" y1="250" x2="90" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="120" y1="250" x2="150" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="280" y1="250" x2="250" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="280" y1="250" x2="310" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="420" y1="250" x2="390" y2="350" stroke="#737373" stroke-width="2"/>
  <line x1="420" y1="250" x2="450" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="580" y1="250" x2="550" y2="330" stroke="#737373" stroke-width="2"/>
  <line x1="580" y1="250" x2="610" y2="350" stroke="#737373" stroke-width="2"/>
  <line x1="390" y1="350" x2="365" y2="430" stroke="#737373" stroke-width="2"/>
  <line x1="390" y1="350" x2="415" y2="430" stroke="#737373" stroke-width="2"/>
  <line x1="610" y1="350" x2="585" y2="430" stroke="#737373" stroke-width="2"/>
  <line x1="610" y1="350" x2="635" y2="430" stroke="#737373" stroke-width="2"/>

  <!-- highlighted equal-black-height paths (thicker emphasis strokes over the tree edges above) -->
  <path d="M 350,60 L 200,150 L 120,250 L 90,330" fill="none" stroke="#525252" stroke-width="4" stroke-dasharray="1,0"/>
  <path d="M 350,60 L 500,150 L 420,250 L 390,350 L 415,430" fill="none" stroke="#525252" stroke-width="4" stroke-dasharray="6,4"/>
  <path d="M 350,60 L 500,150 L 580,250 L 610,350 L 635,430" fill="none" stroke="#525252" stroke-width="4" stroke-dasharray="2,3"/>

  <!-- NIL leaves (black) -->
  <g>
    <rect x="81" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="90" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="141" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="150" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="241" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="250" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="301" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="310" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="441" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="450" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="541" y="321" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="550" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="356" y="421" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="365" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="406" y="421" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="415" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="576" y="421" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="585" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
    <rect x="626" y="421" width="18" height="18" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="635" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">NIL</text>
  </g>

  <!-- internal nodes -->
  <circle cx="350" cy="60" r="24" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="350" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10 (B)</text>

  <circle cx="200" cy="150" r="24" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">5 (B)</text>

  <circle cx="500" cy="150" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="500" y="155" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">20 (R)</text>

  <circle cx="120" cy="250" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">2 (R)</text>

  <circle cx="280" cy="250" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">7 (R)</text>

  <circle cx="420" cy="250" r="24" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="420" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">15 (B)</text>

  <circle cx="580" cy="250" r="24" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="580" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">30 (B)</text>

  <circle cx="390" cy="350" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="390" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">12 (R)</text>

  <circle cx="610" cy="350" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="610" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">35 (R)</text>

  <!-- black-height tags on the three highlighted paths -->
  <rect x="20" y="470" width="150" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="95" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bh=3: 10-5-2-NIL</text>

  <rect x="330" y="470" width="180" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="420" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bh=3: 10-20-15-12-NIL</text>

  <rect x="530" y="470" width="180" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="600" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bh=3: 10-20-30-35-NIL</text>
  <line x1="95" y1="470" x2="90" y2="339" stroke="#737373" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow104)"/>
  <line x1="420" y1="470" x2="415" y2="439" stroke="#737373" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow104)"/>
  <line x1="600" y1="470" x2="635" y2="439" stroke="#737373" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arrow104)"/>

  <!-- numbered invariant callouts -->
  <circle cx="395" cy="30" r="12" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="395" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1</text>
  <line x1="388" y1="40" x2="360" y2="55" stroke="#737373" stroke-width="1" marker-end="url(#arrow104)"/>

  <circle cx="270" cy="80" r="12" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="270" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2</text>
  <line x1="278" y1="90" x2="335" y2="68" stroke="#737373" stroke-width="1" marker-end="url(#arrow104)"/>

  <circle cx="60" cy="300" r="12" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="60" y="304" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3</text>
  <line x1="68" y1="308" x2="85" y2="325" stroke="#737373" stroke-width="1" marker-end="url(#arrow104)"/>

  <circle cx="600" cy="130" r="12" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">4</text>
  <line x1="590" y1="138" x2="518" y2="150" stroke="#737373" stroke-width="1" marker-end="url(#arrow104)"/>

  <circle cx="440" cy="500" r="12" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="440" y="504" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">5</text>
  <line x1="440" y1="494" x2="420" y2="494" stroke="#737373" stroke-width="1" marker-end="url(#arrow104)"/>

  <!-- legend -->
  <rect x="20" y="540" width="660" height="150" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="35" y="560" font-family="sans-serif" font-size="13" fill="#1f2937">1. Every node is colored either red or black.</text>
  <text x="35" y="582" font-family="sans-serif" font-size="13" fill="#1f2937">2. The root (node 10) is black.</text>
  <text x="35" y="604" font-family="sans-serif" font-size="13" fill="#1f2937">3. Every NIL (external) leaf is black.</text>
  <text x="35" y="626" font-family="sans-serif" font-size="13" fill="#1f2937">4. A red node never has a red child (e.g. red node 20's children 15 and 30 are both black).</text>
  <text x="35" y="648" font-family="sans-serif" font-size="13" fill="#1f2937">5. Every root-to-NIL path has the same black-height — all three highlighted paths have bh = 3.</text>
  <text x="35" y="672" font-family="sans-serif" font-size="13" fill="#1f2937">Dashed/dotted overlays on the tree edges above mark the three paths compared in (5).</text>

  <!-- height bound -->
  <rect x="20" y="700" width="660" height="60" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="350" y="726" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n = 9 internal nodes &#8594; h &#8804; 2&#183;log&#8322;(n+1) = 2&#183;log&#8322;(10) &#8776; 6.64 &#8594; h &#8804; 6</text>
  <text x="350" y="748" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Actual height h = 4 (edges 10&#8594;20&#8594;15&#8594;12&#8594;NIL) — within bound.</text>
</svg>
