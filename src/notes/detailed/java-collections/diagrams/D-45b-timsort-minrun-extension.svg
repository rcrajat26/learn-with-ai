<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="TimSort frame 2: the short run of length 7 is extended by binary insertion sort to reach minRunLength(40) = 20, absorbing the next 13 elements; MIN_MERGE is 32">
  <rect x="20" y="20" width="560" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="300" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2: extend short run to minRunLength via binary insertion sort</text>

  <!-- extended run idx0-19, green -->
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <rect x="20" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="38" y="91" text-anchor="middle">2</text>
    <rect x="58" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="76" y="91" text-anchor="middle">5</text>
    <rect x="96" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="114" y="91" text-anchor="middle">8</text>
    <rect x="134" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="152" y="91" text-anchor="middle">10</text>
    <rect x="172" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="190" y="91" text-anchor="middle">14</text>
    <rect x="210" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="228" y="91" text-anchor="middle">18</text>
    <rect x="248" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="266" y="91" text-anchor="middle">20</text>
    <!-- absorbed run B, now reversed to ascending -->
    <rect x="286" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="304" y="91" text-anchor="middle">1</text>
    <rect x="324" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="342" y="91" text-anchor="middle">4</text>
    <rect x="362" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="380" y="91" text-anchor="middle">7</text>
    <rect x="400" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="418" y="91" text-anchor="middle">11</text>
    <rect x="438" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="456" y="91" text-anchor="middle">15</text>
    <rect x="476" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="494" y="91" text-anchor="middle">19</text>
    <!-- absorbed run C -->
    <rect x="514" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="532" y="91" text-anchor="middle">3</text>
    <rect x="552" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="570" y="91" text-anchor="middle">6</text>
    <rect x="590" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="608" y="91" text-anchor="middle">9</text>
    <rect x="628" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="646" y="91" text-anchor="middle">12</text>
    <rect x="666" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="684" y="91" text-anchor="middle">16</text>
    <rect x="704" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="722" y="91" text-anchor="middle">19</text>
    <rect x="742" y="70" width="36" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/><text x="760" y="91" text-anchor="middle">22</text>
  </g>

  <rect x="20" y="112" width="758" height="22" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="399" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">idx 0-19 now one run of length 20, built by binary-inserting elements 7..19 one at a time into run A</text>

  <!-- boundary marker showing original natural run end at idx6 -->
  <line x1="284" y1="65" x2="284" y2="110" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="196" y="140" width="176" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="284" y="154" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">natural run A ended here (len 7)</text>

  <!-- minRunLength computation box -->
  <rect x="20" y="200" width="758" height="150" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="399" y="225" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">TimSort.minRunLength(n) — MIN_MERGE = 32</text>
  <text x="399" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">while (n &gt;= MIN_MERGE) { r |= (n &amp; 1); n &gt;&gt;= 1; }  return n + r;</text>
  <text x="399" y="275" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n = 40 &#8805; 32: r |= (40 &amp; 1) = 0, n = 40 &gt;&gt; 1 = 20</text>
  <text x="399" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n = 20 &lt; 32: loop stops</text>
  <rect x="280" y="310" width="240" height="28" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="399" y="329" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">minRunLength(40) = 20 + 0 = 20</text>
</svg>
