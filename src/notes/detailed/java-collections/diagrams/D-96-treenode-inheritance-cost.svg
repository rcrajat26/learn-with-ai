<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The TreeNode inheritance chain from HashMap.Node through LinkedHashMap.Entry to HashMap.TreeNode, boxes drawn to scale by their byte totals 32, 40, and 56">
  <defs>
    <marker id="arrow96" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <pattern id="hatch96" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#737373" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">The TreeNode inheritance chain and its cost</text>

  <!-- Box 1: HashMap.Node, 32 B, height 128 at 4px per byte, bottom-aligned at y=480 -->
  <rect x="40" y="352" width="240" height="128" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">HashMap.Node&lt;K,V&gt; -- 32 B</text>
  <text x="60" y="394" font-family="sans-serif" font-size="11" fill="#1f2937">
    <tspan x="60" dy="0">12 B header (mark 8 + klass 4)</tspan>
    <tspan x="60" dy="16">final int hash            4 B</tspan>
    <tspan x="60" dy="16">final K key               4 B</tspan>
    <tspan x="60" dy="16">V value                   4 B</tspan>
    <tspan x="60" dy="16">Node&lt;K,V&gt; next            4 B</tspan>
  </text>
  <rect x="60" y="462" width="200" height="10" fill="url(#hatch96)" stroke="#737373" stroke-width="1"/>
  <text x="160" y="500" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">12+4+4+4+4=28, aligned to 32</text>
  <text x="160" y="516" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">padding 4 B</text>

  <!-- extends arrow 1 -> 2 -->
  <line x1="280" y1="416" x2="330" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>
  <rect x="282" y="422" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="315" y="435" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- Box 2: LinkedHashMap.Entry, 40 B, height 160, bottom-aligned at y=480 -->
  <rect x="360" y="320" width="240" height="160" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="480" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LinkedHashMap.Entry&lt;K,V&gt;</text>
  <text x="480" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">extends HashMap.Node -- 40 B</text>
  <text x="380" y="378" font-family="sans-serif" font-size="11" fill="#1f2937">
    <tspan x="380" dy="0">(inherits Node's 28 B: header,</tspan>
    <tspan x="380" dy="16">hash, key, value, next)</tspan>
    <tspan x="380" dy="16">Entry&lt;K,V&gt; before         4 B</tspan>
    <tspan x="380" dy="16">Entry&lt;K,V&gt; after          4 B</tspan>
  </text>
  <rect x="380" y="462" width="200" height="10" fill="url(#hatch96)" stroke="#737373" stroke-width="1"/>
  <text x="480" y="500" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">28+4+4=36, aligned to 40</text>
  <text x="480" y="516" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">padding 4 B</text>

  <!-- extends arrow 2 -> 3 -->
  <line x1="600" y1="400" x2="650" y2="376" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>
  <rect x="602" y="406" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="635" y="419" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- Box 3: HashMap.TreeNode, 56 B, height 224, bottom-aligned at y=480 -->
  <rect x="680" y="256" width="240" height="224" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="800" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">HashMap.TreeNode&lt;K,V&gt;</text>
  <text x="800" y="294" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">extends LinkedHashMap.Entry -- 56 B</text>
  <text x="700" y="314" font-family="sans-serif" font-size="11" fill="#1f2937">
    <tspan x="700" dy="0">(inherits Entry's 36 B:</tspan>
    <tspan x="700" dy="16">Node fields + before/after)</tspan>
    <tspan x="700" dy="16">TreeNode&lt;K,V&gt; parent      4 B</tspan>
    <tspan x="700" dy="16">TreeNode&lt;K,V&gt; left        4 B</tspan>
    <tspan x="700" dy="16">TreeNode&lt;K,V&gt; right       4 B</tspan>
    <tspan x="700" dy="16">TreeNode&lt;K,V&gt; prev        4 B</tspan>
    <tspan x="700" dy="16">boolean red               1 B</tspan>
  </text>
  <rect x="700" y="462" width="200" height="10" fill="url(#hatch96)" stroke="#737373" stroke-width="1"/>
  <text x="800" y="500" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">36+4+4+4+4+1=53, aligned to 56</text>
  <text x="800" y="516" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">padding 3 B</text>

  <!-- caption -->
  <rect x="20" y="540" width="920" height="60" rx="8" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="480" y="558" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Figures are for 64-bit HotSpot with compressed oops (default heaps under 32 GB). A treeified bin therefore costs</text>
  <text x="480" y="574" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">56 B per entry against 32 B -- the JDK class comment's "about twice the size of regular nodes." HashMap.TreeNode</text>
  <text x="480" y="590" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">inherits before/after it does not need as tree links, and reuses them for the linked-list overlay that makes untreeify possible.</text>
</svg>
