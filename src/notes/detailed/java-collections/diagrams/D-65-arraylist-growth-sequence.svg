<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList capacity growth step plot: 10, 15, 22, 33, 49, 73, 109, 163, 244, each step computed as oldCapacity plus oldCapacity right-shifted by one, with an Arrays.copyOf cost spike at every resize">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="400" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="220" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">newCapacity = oldCapacity + (oldCapacity &gt;&gt; 1)</text>

  <!-- axis -->
  <line x1="20" y1="440" x2="780" y2="440" stroke="#737373" stroke-width="2"/>
  <line x1="20" y1="440" x2="20" y2="150" stroke="#737373" stroke-width="2"/>
  <text x="15" y="145" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">capacity</text>

  <!-- bar 0: 10 -->
  <rect x="40" y="391" width="60" height="49" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="70,381 78,391 62,391" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="45" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="70" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">10</text>
  <rect x="35" y="465" width="70" height="18" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="70" y="478" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">initial (default)</text>

  <!-- bar 1: 15 -->
  <rect x="120" y="386" width="60" height="54" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="150,376 158,386 142,386" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="120" y="358" width="60" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="150" y="371" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">10+5=15</text>
  <rect x="125" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="150" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">15</text>

  <!-- bar 2: 22 -->
  <rect x="200" y="380" width="60" height="60" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="230,370 238,380 222,380" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="197" y="352" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="230" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">15+7=22</text>
  <rect x="205" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="230" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">22</text>

  <!-- bar 3: 33 -->
  <rect x="280" y="370" width="60" height="70" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="310,360 318,370 302,370" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="277" y="342" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="310" y="355" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">22+11=33</text>
  <rect x="285" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="310" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">33</text>

  <!-- bar 4: 49 -->
  <rect x="360" y="356" width="60" height="84" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="390,346 398,356 382,356" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="357" y="328" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="390" y="341" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">33+16=49</text>
  <rect x="365" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="390" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">49</text>

  <!-- bar 5: 73 -->
  <rect x="440" y="334" width="60" height="106" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="470,324 478,334 462,334" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="437" y="306" width="66" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="470" y="319" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">49+24=73</text>
  <rect x="445" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="470" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">73</text>

  <!-- bar 6: 109 -->
  <rect x="520" y="302" width="60" height="138" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="550,292 558,302 542,302" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="514" y="274" width="72" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="550" y="287" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">73+36=109</text>
  <rect x="525" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="550" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">109</text>

  <!-- bar 7: 163 -->
  <rect x="600" y="253" width="60" height="187" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <polygon points="630,243 638,253 622,253" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="592" y="225" width="76" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="630" y="238" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">109+54=163</text>
  <rect x="605" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="630" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">163</text>

  <!-- bar 8: 244 -->
  <rect x="680" y="180" width="60" height="260" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <polygon points="710,170 718,180 702,180" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <rect x="672" y="152" width="76" height="18" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="710" y="165" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#1f2937">163+81=244</text>
  <rect x="685" y="446" width="50" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="710" y="461" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">244</text>

  <!-- legend -->
  <rect x="560" y="20" width="220" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="670" y="37" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">spike = Arrays.copyOf() cost</text>

  <rect x="20" y="470" width="500" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="270" y="487" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">growth factor ~1.5x — every step reallocates and copies all elements</text>
</svg>