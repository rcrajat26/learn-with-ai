<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 4: the empty-bin fast path, one array store and no equals call, compared side by side">
  <text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">MyHashMap.put traced against the JDK -- frame 2 of 4</text>
  <text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">The empty-bin fast path: put("b", 2) where the target bin is null</text>

  <!-- left half -->
  <rect x="30" y="75" width="440" height="510" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">MyHashMap</text>

  <rect x="50" y="120" width="400" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="145" font-family="sans-serif" font-size="12" fill="#1f2937">int i = (n - 1) &amp; hash;</text>

  <rect x="50" y="170" width="400" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="195" font-family="sans-serif" font-size="12" fill="#1f2937">table[i] = newNode(hash, key, value, null);</text>

  <rect x="80" y="230" width="340" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="250" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[i] was null -&gt; now holds "b"</text>
  <text x="250" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">one array store, no chain walk</text>

  <rect x="60" y="330" width="180" height="26" rx="13" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="150" y="347" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">O(1), no equals call</text>

  <!-- right half -->
  <rect x="490" y="75" width="440" height="510" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">java.util.HashMap</text>

  <rect x="510" y="120" width="400" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="520" y="145" font-family="sans-serif" font-size="12" fill="#1f2937">int i = (n - 1) &amp; hash;</text>

  <rect x="510" y="170" width="400" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="520" y="195" font-family="sans-serif" font-size="12" fill="#1f2937">tab[i] = newNode(hash, key, value, null);</text>

  <rect x="540" y="230" width="340" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin[i] was null -&gt; now holds "b"</text>
  <text x="710" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">one array store, no chain walk</text>

  <rect x="520" y="330" width="180" height="26" rx="13" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="610" y="347" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">O(1), no equals call</text>

  <rect x="50" y="400" width="860" height="140" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="70" y="425" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Structurally identical -- no simplification marked.</text>
  <text x="70" y="450" font-family="sans-serif" font-size="12" fill="#1f2937">When the bucket computed by (n - 1) &amp; hash is empty, both implementations skip</text>
  <text x="70" y="470" font-family="sans-serif" font-size="12" fill="#1f2937">every comparison entirely: no hash check, no reference check, no equals() call.</text>
  <text x="70" y="490" font-family="sans-serif" font-size="12" fill="#1f2937">This is the best case for hash map insertion -- true O(1) with zero collision cost.</text>
</svg>
