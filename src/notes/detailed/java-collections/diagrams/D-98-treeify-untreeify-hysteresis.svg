<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="State transition diagram showing LinkedList-based bin converting to a red-black tree bin at size 8 and reverting at size 6, with a hysteresis band between 6 and 8 that prevents thrashing">
  <defs>
    <marker id="arrow98" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1f2937">Treeify / untreeify hysteresis</text>

  <!-- top label: LIST -> TREE -->
  <rect x="90" y="42" width="720" height="42" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin size reaches 8 (TREEIFY_THRESHOLD) AND table length &#8805; 64 (MIN_TREEIFY_CAPACITY)</text>
  <text x="450" y="77" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">triggered from putVal when binCount &gt;= TREEIFY_THRESHOLD - 1</text>

  <line x1="250" y1="102" x2="650" y2="102" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <line x1="250" y1="105" x2="250" y2="150" stroke="#737373" stroke-width="2"/>
  <line x1="650" y1="105" x2="650" y2="150" stroke="#737373" stroke-width="2"/>

  <!-- state boxes -->
  <rect x="60" y="150" width="300" height="150" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="210" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">LIST</text>
  <text x="210" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Node chain</text>
  <text x="210" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">lookup O(n)</text>
  <text x="210" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">32 B per entry</text>

  <rect x="540" y="150" width="300" height="150" rx="8" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="690" y="182" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">TREE</text>
  <text x="690" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TreeNode red-black bin</text>
  <text x="690" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">lookup O(log n)</text>
  <text x="690" y="256" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">56 B per entry (vs 32 B)</text>

  <!-- bottom arrow: TREE -> LIST -->
  <line x1="650" y1="345" x2="650" y2="380" stroke="#737373" stroke-width="2"/>
  <line x1="250" y1="345" x2="250" y2="380" stroke="#737373" stroke-width="2"/>
  <line x1="650" y1="380" x2="250" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>

  <rect x="90" y="392" width="720" height="42" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin size falls to 6 or below (UNTREEIFY_THRESHOLD) during a resize split</text>
  <text x="450" y="427" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TreeNode.split checks lc &lt;= UNTREEIFY_THRESHOLD per half; a plain remove does NOT untreeify</text>

  <!-- number line -->
  <text x="450" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bin size</text>
  <line x1="80" y1="500" x2="820" y2="500" stroke="#737373" stroke-width="2"/>
  <!-- amber hysteresis band between 6 and 8: x(v)=80+74*v -> x(6)=524, x(8)=672 -->
  <rect x="524" y="486" width="148" height="28" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <rect x="510" y="455" width="180" height="20" rx="3" fill="#fef3c7"/>
  <text x="600" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hysteresis band &#8212; prevents thrash</text>

  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <line x1="80" y1="494" x2="80" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="80" y="524" text-anchor="middle">0</text>
    <line x1="154" y1="494" x2="154" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="154" y="524" text-anchor="middle">1</text>
    <line x1="228" y1="494" x2="228" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="228" y="524" text-anchor="middle">2</text>
    <line x1="302" y1="494" x2="302" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="302" y="524" text-anchor="middle">3</text>
    <line x1="376" y1="494" x2="376" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="376" y="524" text-anchor="middle">4</text>
    <line x1="450" y1="494" x2="450" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="450" y="524" text-anchor="middle">5</text>
    <line x1="524" y1="490" x2="524" y2="510" stroke="#525252" stroke-width="3"/>
    <text x="524" y="524" text-anchor="middle" font-weight="bold">6</text>
    <line x1="598" y1="494" x2="598" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="598" y="524" text-anchor="middle">7</text>
    <line x1="672" y1="490" x2="672" y2="510" stroke="#525252" stroke-width="3"/>
    <text x="672" y="524" text-anchor="middle" font-weight="bold">8</text>
    <line x1="746" y1="494" x2="746" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="746" y="524" text-anchor="middle">9</text>
    <line x1="820" y1="494" x2="820" y2="506" stroke="#737373" stroke-width="2"/>
    <text x="820" y="524" text-anchor="middle">10</text>
  </g>

  <!-- worked example -->
  <rect x="60" y="545" width="780" height="60" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="565" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Worked example: a bin oscillating between 7 and 8 entries under repeated put/remove would convert on</text>
  <text x="450" y="582" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">every other operation if both thresholds were 8. With the gap, it converts at 8 and stays a tree until a</text>
  <text x="450" y="599" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">resize split drops it to 6.</text>
</svg>
