<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="binarySearch return encoding: a hit on 30 returns index 2; a miss on 25 with insertion point 2 returns -(2)-1 = -3; inverse formula insertionPoint = -(result) - 1">
  <defs>
    <marker id="arrow42" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Section label: sorted array -->
  <rect x="20" y="20" width="220" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="130" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">sorted array [10,20,30,40]</text>

  <!-- Array boxes: index 0..3, values 10,20,30,40 -->
  <!-- box x positions: 55,235,415,595 ; width 150 height 70 -->
  <g>
    <!-- index 0 -->
    <rect x="20" y="90" width="40" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="40" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">i=0</text>
    <rect x="55" y="120" width="150" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="130" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10</text>

    <!-- index 1 -->
    <rect x="200" y="90" width="40" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="220" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">i=1</text>
    <rect x="235" y="120" width="150" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="310" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">20</text>

    <!-- index 2 : hit -->
    <rect x="380" y="90" width="40" height="24" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="400" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">i=2</text>
    <rect x="415" y="120" width="150" height="70" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="490" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">30</text>

    <!-- index 3 -->
    <rect x="560" y="90" width="40" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="580" y="107" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">i=3</text>
    <rect x="595" y="120" width="150" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="670" y="162" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">40</text>
  </g>

  <!-- hit arrow -->
  <line x1="490" y1="190" x2="490" y2="220" stroke="#525252" stroke-width="2" marker-end="url(#arrow42)"/>
  <rect x="350" y="222" width="280" height="30" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="490" y="242" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">binarySearch(30) HIT &#8594; returns 2</text>

  <!-- miss marker: insertion gap between index 1 (20) and index 2 (30) -->
  <line x1="400" y1="120" x2="400" y2="190" stroke="#525252" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="378" y="96" width="44" height="20" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">gap</text>

  <line x1="400" y1="190" x2="400" y2="285" stroke="#525252" stroke-width="2" marker-end="url(#arrow42)"/>
  <rect x="220" y="287" width="360" height="46" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">binarySearch(25) MISS: insertion point = 2</text>
  <text x="400" y="323" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">returns -(2) - 1 = -3</text>

  <!-- Formula box -->
  <rect x="20" y="370" width="760" height="56" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="400" y="393" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">result &lt; 0  &#8658;  insertionPoint = -(result) - 1</text>
  <text x="400" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">check: insertionPoint = -(-3) - 1 = 3 - 1 = 2 &#10003;</text>

  <!-- legend -->
  <rect x="20" y="440" width="180" height="30" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="110" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">green = found (hit)</text>
  <rect x="220" y="440" width="220" height="30" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="330" y="460" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">amber = insertion point (miss)</text>
</svg>
