<svg viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Aa and BB collide with hash 2112 because 65 times 31 plus 97 equals 66 times 31 plus 66; doubling the pattern to AaAa BBBB AaBB BBAa produces a family of 2 to the k colliding strings of length 2k">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Step 1: side-by-side computations -->
  <rect x="20" y="20" width="760" height="200" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="34" width="420" height="26" rx="3" fill="#dbeafe"/>
  <text x="246" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Step 1 &#8212; "Aa" and "BB" produce the same hash</text>

  <rect x="50" y="80" width="330" height="110" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="215" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">"Aa"  ('A'=65, 'a'=97)</text>
  <text x="215" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">h = 65*31 + 97</text>
  <text x="215" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 2015 + 97</text>
  <rect x="150" y="160" width="130" height="24" rx="3" fill="#fee2e2"/>
  <text x="215" y="177" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 2112</text>

  <rect x="420" y="80" width="330" height="110" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="585" y="104" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">"BB"  ('B'=66, 'B'=66)</text>
  <text x="585" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">h = 66*31 + 66</text>
  <text x="585" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 2046 + 66</text>
  <rect x="520" y="160" width="130" height="24" rx="3" fill="#fee2e2"/>
  <text x="585" y="177" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 2112</text>

  <line x1="380" y1="135" x2="420" y2="135" stroke="#525252" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="356" y="200" width="90" height="22" rx="3" fill="#fef3c7"/>
  <text x="401" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">collision</text>

  <!-- Step 2: doubling tree -->
  <rect x="20" y="250" width="760" height="490" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="264" width="560" height="26" rx="3" fill="#dbeafe"/>
  <text x="316" y="282" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Step 2 &#8212; concatenation doubles the colliding family, 2^k strings of length 2k</text>

  <!-- level k=1, length 2 -->
  <rect x="150" y="310" width="90" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="195" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"Aa"</text>
  <rect x="560" y="310" width="90" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="605" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"BB"</text>
  <rect x="300" y="310" width="150" height="24" rx="3" fill="#f3f4f6"/>
  <text x="375" y="327" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">k=1: length 2, 2^1 = 2 strings</text>

  <!-- level k=2, length 4 -->
  <line x1="195" y1="344" x2="140" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="195" y1="344" x2="330" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="344" x2="470" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="605" y1="344" x2="660" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="400" width="120" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="140" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"AaAa"</text>
  <rect x="270" y="400" width="120" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="330" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"AaBB"</text>
  <rect x="410" y="400" width="120" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="470" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"BBAa"</text>
  <rect x="600" y="400" width="120" height="34" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="660" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"BBBB"</text>

  <rect x="290" y="450" width="220" height="24" rx="3" fill="#f3f4f6"/>
  <text x="400" y="467" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">k=2: length 4, 2^2 = 4 strings, all hash 2112*31^2 + 2112</text>

  <rect x="140" y="500" width="520" height="80" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="400" y="524" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">General rule: any binary choice at each of k positions between</text>
  <text x="400" y="544" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">an "Aa" block and a "BB" block preserves the running hash, so</text>
  <text x="400" y="564" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">length 2k has exactly 2^k mutually colliding strings</text>

  <rect x="140" y="600" width="520" height="110" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="400" y="624" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">k=3: length 6, 2^3 = 8 colliding strings</text>
  <text x="400" y="646" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">k=10: length 20, 2^10 = 1024 colliding strings</text>
  <text x="400" y="668" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">k=20: length 40, 2^20 &#8776; 1,048,576 colliding strings</text>
  <text x="400" y="690" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">this is the basis of algorithmic-complexity attacks on hash-keyed structures</text>
</svg>
