<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 4: lazy table allocation on first put, compared side by side between MyHashMap and java.util.HashMap">
  <text x="480" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">MyHashMap.put traced against the JDK -- frame 1 of 4</text>
  <text x="480" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Lazy table allocation: put("a", 1) on a freshly-constructed map</text>

  <!-- left half -->
  <rect x="30" y="75" width="440" height="510" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">MyHashMap</text>

  <text x="50" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">start: table == null, size = 0, threshold = 0</text>

  <rect x="50" y="150" width="400" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="172" font-family="sans-serif" font-size="12" fill="#1f2937">if (table == null || table.length == 0)</text>
  <text x="80" y="192" font-family="sans-serif" font-size="12" fill="#1f2937">table = resize();</text>

  <rect x="80" y="230" width="340" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="250" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Node[16]  (new array allocated)</text>
  <text x="250" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">threshold = 12  (= (int)(16 * 0.75f))</text>

  <rect x="50" y="320" width="400" height="80" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="60" y="345" font-family="sans-serif" font-size="12" fill="#1f2937">no array allocated by the constructor --</text>
  <text x="60" y="365" font-family="sans-serif" font-size="12" fill="#1f2937">the first put pays for it.</text>
  <text x="60" y="385" font-family="sans-serif" font-size="12" fill="#1f2937">after: put("a",1) stored at computed index.</text>

  <!-- right half -->
  <rect x="490" y="75" width="440" height="510" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">java.util.HashMap</text>

  <text x="510" y="130" font-family="sans-serif" font-size="12" fill="#1f2937">start: table == null, size = 0, threshold = 0</text>

  <rect x="510" y="150" width="400" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="520" y="172" font-family="sans-serif" font-size="12" fill="#1f2937">if (table == null || table.length == 0)</text>
  <text x="540" y="192" font-family="sans-serif" font-size="12" fill="#1f2937">table = resize();</text>

  <rect x="540" y="230" width="340" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="255" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Node[16]  (new array allocated)</text>
  <text x="710" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">threshold = 12  (= (int)(16 * 0.75f))</text>

  <rect x="510" y="320" width="400" height="80" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="520" y="345" font-family="sans-serif" font-size="12" fill="#1f2937">no array allocated by the constructor --</text>
  <text x="520" y="365" font-family="sans-serif" font-size="12" fill="#1f2937">the first put pays for it.</text>
  <text x="520" y="385" font-family="sans-serif" font-size="12" fill="#1f2937">after: put("a",1) stored at computed index.</text>

  <rect x="50" y="420" width="860" height="140" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="70" y="445" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">Structurally identical in this frame -- no simplification marked.</text>
  <text x="70" y="470" font-family="sans-serif" font-size="12" fill="#1f2937">Both implementations defer allocating the backing array until the first insertion,</text>
  <text x="70" y="490" font-family="sans-serif" font-size="12" fill="#1f2937">avoiding wasted memory for maps that are constructed but never populated.</text>
  <text x="70" y="510" font-family="sans-serif" font-size="12" fill="#1f2937">threshold = capacity * loadFactor governs when the next resize() will fire.</text>
</svg>
