<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="size() computed by sumCount: baseCount plus a padded CounterCell array, four threads each incrementing a separate contended cell, summed into an estimate that can change mid-sum">
  <defs>
    <marker id="arrow130" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Threads -->
  <g>
    <rect x="30" y="30" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="75" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread A</text>
    <rect x="150" y="30" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="195" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread B</text>
    <rect x="270" y="30" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="315" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread C</text>
    <rect x="390" y="30" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="435" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread D</text>
  </g>

  <!-- CounterCell[] with @Contended padding drawn as gaps -->
  <text x="30" y="110" font-family="sans-serif" font-size="13" fill="#1f2937">CounterCell[] counterCells (line 815) — each cell @jdk.internal.vm.annotation.Contended (line 2565)</text>

  <g>
    <rect x="30" y="130" width="100" height="60" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="80" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cell[0]</text>
    <text x="80" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">value (volatile)</text>

    <rect x="170" y="130" width="100" height="60" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="220" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cell[1]</text>
    <text x="220" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">value (volatile)</text>

    <rect x="310" y="130" width="100" height="60" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="360" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cell[2]</text>
    <text x="360" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">value (volatile)</text>

    <rect x="450" y="130" width="100" height="60" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="500" y="152" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cell[3]</text>
    <text x="500" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">value (volatile)</text>
  </g>

  <!-- padding gaps between cells, labelled -->
  <text x="150" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pad</text>
  <text x="290" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pad</text>
  <text x="430" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pad</text>
  <text x="290" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">@Contended inserts unused bytes so each cell owns its own 64-byte cache line</text>
  <text x="290" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no false sharing between threads writing adjacent cells</text>

  <!-- thread -> cell arrows -->
  <line x1="75" y1="70" x2="80" y2="128" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="195" y1="70" x2="220" y2="128" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="315" y1="70" x2="360" y2="128" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="435" y1="70" x2="500" y2="128" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>

  <!-- baseCount -->
  <rect x="600" y="130" width="150" height="60" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="675" y="152" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">baseCount</text>
  <text x="675" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">used when uncontended</text>
  <text x="675" y="184" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(line 790)</text>

  <!-- sumCount box -->
  <rect x="240" y="330" width="300" height="70" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="390" y="355" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">sumCount() — line 2570</text>
  <text x="390" y="375" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">sum = baseCount + Σ cell.value</text>
  <text x="390" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">used by size() (clamped) and mappingCount() (raw long)</text>

  <!-- arrows into sumCount -->
  <line x1="80" y1="190" x2="330" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="220" y1="190" x2="360" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="360" y1="190" x2="390" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="500" y1="190" x2="420" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>
  <line x1="675" y1="190" x2="450" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow130)"/>

  <!-- estimate warning -->
  <rect x="230" y="430" width="320" height="46" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="390" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">the sum is an estimate —</text>
  <text x="390" y="466" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cells can change mid-sum</text>
  <line x1="390" y1="400" x2="390" y2="428" stroke="#525252" stroke-width="2" marker-end="url(#arrow130)"/>
</svg>
