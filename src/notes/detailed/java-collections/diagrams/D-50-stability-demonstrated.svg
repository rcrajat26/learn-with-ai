<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Sorting five (name,dept) records by name then stably by dept preserves Alice,Bob,Dave order within Eng; an unstable sort scrambles that same group to Dave,Bob,Alice">
  <defs>
    <marker id="arrow50" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Input: (Bob,Eng) (Alice,Eng) (Carol,Sales) (Dave,Eng) (Eve,Sales) — sorted by name first</text>

  <!-- Row 1: name-sorted input -->
  <g>
    <rect x="50" y="60" width="130" height="54" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="115" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Alice</text>
    <text x="115" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="192" y="60" width="130" height="54" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="257" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Bob</text>
    <text x="257" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="334" y="60" width="130" height="54" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="399" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Carol</text>
    <text x="399" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>

    <rect x="476" y="60" width="130" height="54" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="541" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Dave</text>
    <text x="541" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="618" y="60" width="130" height="54" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="683" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eve</text>
    <text x="683" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>
  </g>

  <!-- Arrow to stable branch -->
  <line x1="250" y1="114" x2="250" y2="138" stroke="#737373" stroke-width="2" marker-end="url(#arrow50)"/>

  <!-- Long elbow arrow to unstable branch, routed on the right margin -->
  <polyline points="700,114 755,114 755,328" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow50)"/>

  <rect x="20" y="140" width="760" height="30" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">STABLE sort by dept — ties keep their prior relative (name) order</text>

  <!-- Row 2: stable output -->
  <g>
    <rect x="50" y="180" width="130" height="54" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="115" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Alice</text>
    <text x="115" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="192" y="180" width="130" height="54" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="257" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Bob</text>
    <text x="257" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="334" y="180" width="130" height="54" rx="3" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="399" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Dave</text>
    <text x="399" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="476" y="180" width="130" height="54" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="541" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Carol</text>
    <text x="541" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>

    <rect x="618" y="180" width="130" height="54" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="683" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eve</text>
    <text x="683" y="218" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>
  </g>

  <rect x="50" y="244" width="700" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Result: Alice, Bob, Dave, Carol, Eve — Eng group keeps Alice&#8201;&lt;&#8201;Bob&#8201;&lt;&#8201;Dave from the name sort</text>

  <rect x="20" y="330" width="760" height="30" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="400" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">UNSTABLE alternative sort by dept — tie order is not preserved</text>

  <!-- Row 3: unstable output, Eng group scrambled -->
  <g>
    <rect x="50" y="370" width="130" height="54" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="115" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Dave</text>
    <text x="115" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="192" y="370" width="130" height="54" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="257" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Bob</text>
    <text x="257" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="334" y="370" width="130" height="54" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="399" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Alice</text>
    <text x="399" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eng</text>

    <rect x="476" y="370" width="130" height="54" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="541" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Eve</text>
    <text x="541" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>

    <rect x="618" y="370" width="130" height="54" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="683" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Carol</text>
    <text x="683" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Sales</text>
  </g>

  <rect x="50" y="434" width="700" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Result: Dave, Bob, Alice, Eve, Carol — Eng group order (Dave&#8201;before&#8201;Alice) contradicts the name sort</text>
</svg>
