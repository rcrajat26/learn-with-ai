<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Where java.util.concurrent grafts onto the collections hierarchy: ConcurrentMap extends Map; ConcurrentNavigableMap extends both ConcurrentMap and NavigableMap forming a diamond; BlockingQueue extends Queue; BlockingDeque extends both BlockingQueue and Deque forming a diamond; TransferQueue extends BlockingQueue; concrete classes ConcurrentHashMap, ConcurrentSkipListMap, ArrayBlockingQueue, LinkedBlockingQueue, LinkedBlockingDeque, LinkedTransferQueue, SynchronousQueue, DelayQueue, PriorityBlockingQueue shown as leaves">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">WHERE java.util.concurrent GRAFTS ONTO THE HIERARCHY</text>

  <!-- Row 0: base interfaces (from the core framework) -->
  <rect x="80" y="60" width="120" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="140" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Map</text>

  <rect x="260" y="60" width="160" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="340" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">NavigableMap</text>

  <rect x="510" y="60" width="120" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="570" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Queue</text>

  <rect x="700" y="60" width="120" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="760" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Deque</text>

  <!-- Row 1: ConcurrentMap, BlockingQueue -->
  <rect x="60" y="150" width="160" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="140" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">ConcurrentMap</text>

  <rect x="500" y="150" width="160" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="580" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">BlockingQueue</text>

  <line x1="140" y1="100" x2="140" y2="148" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="114" y="118" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <line x1="570" y1="100" x2="580" y2="148" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="554" y="118" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="580" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- Row 2: ConcurrentNavigableMap (diamond), BlockingDeque (diamond), TransferQueue -->
  <rect x="50" y="240" width="240" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="170" y="265" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ConcurrentNavigableMap</text>

  <rect x="500" y="240" width="160" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="580" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">BlockingDeque</text>

  <rect x="700" y="240" width="160" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="780" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">TransferQueue</text>

  <!-- diamond edges into ConcurrentNavigableMap -->
  <line x1="140" y1="190" x2="165" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="145" y="205" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="171" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <line x1="340" y1="100" x2="220" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="250" y="160" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="276" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- diamond edges into BlockingDeque -->
  <line x1="580" y1="190" x2="580" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="554" y="205" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="580" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <line x1="760" y1="100" x2="620" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="670" y="160" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="696" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- BlockingQueue -> TransferQueue -->
  <line x1="660" y1="185" x2="770" y2="238" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="700" y="205" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="726" y="217" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <!-- Leaves row A (y=330) -->
  <rect x="30" y="330" width="170" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="115" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">ConcurrentHashMap</text>
  <line x1="140" y1="190" x2="115" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="95" y="300" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="130" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <rect x="220" y="330" width="190" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="315" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">ConcurrentSkipListMap</text>
  <line x1="170" y1="280" x2="300" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="230" y="300" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="265" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <rect x="430" y="330" width="160" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="510" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">ArrayBlockingQueue</text>
  <line x1="540" y1="190" x2="510" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="610" y="330" width="170" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="695" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">LinkedBlockingQueue</text>
  <line x1="600" y1="190" x2="690" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="790" y="330" width="90" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="835" y="348" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">PriorityBlocking</text>
  <text x="835" y="360" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Queue</text>
  <line x1="655" y1="185" x2="820" y2="328" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="700" y="270" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="735" y="282" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <!-- Leaves row B (y=400) -->
  <rect x="430" y="400" width="150" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="505" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">SynchronousQueue</text>
  <line x1="530" y1="190" x2="505" y2="398" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>

  <rect x="600" y="400" width="130" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="665" y="422" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">DelayQueue</text>
  <line x1="590" y1="190" x2="665" y2="398" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="595" y="365" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="630" y="377" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <!-- Leaves row C (y=460) -->
  <rect x="500" y="460" width="170" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="585" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">LinkedBlockingDeque</text>
  <line x1="580" y1="280" x2="585" y2="458" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="554" y="420" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="589" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <rect x="700" y="460" width="180" height="35" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="790" y="482" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">LinkedTransferQueue</text>
  <line x1="780" y1="280" x2="790" y2="458" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="754" y="420" width="70" height="16" rx="3" fill="#dcfce7"/>
  <text x="789" y="432" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">implements</text>

  <!-- Legend -->
  <rect x="20" y="620" width="24" height="18" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="52" y="634" font-family="sans-serif" font-size="11" fill="#1f2937">interface (core or concurrent)</text>
  <rect x="280" y="620" width="24" height="18" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="312" y="634" font-family="sans-serif" font-size="11" fill="#1f2937">concrete class</text>
  <rect x="440" y="620" width="24" height="18" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="472" y="634" font-family="sans-serif" font-size="11" fill="#1f2937">emphasis: graft point (diamond parent)</text>

  <rect x="20" y="655" width="860" height="30" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="674" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">ConcurrentNavigableMap and BlockingDeque each have two "extends" edges - the diamond is the graft point</text>
</svg>