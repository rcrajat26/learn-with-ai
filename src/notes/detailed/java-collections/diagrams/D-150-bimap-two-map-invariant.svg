<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="BiMap forward and inverse maps kept consistent across three writes for put(Amy, U7) when U7 was already bound to Ben, contrasted with the broken state left behind if only the forward map is updated">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- title -->
  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">BiMap.put(Amy, U7) when U7 is already bound to Ben — keeping forward and inverse consistent</text>

  <!-- BEFORE panel -->
  <rect x="30" y="56" width="740" height="20" rx="3" fill="#e5e7eb"/>
  <text x="40" y="71" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE put(Amy, U7)</text>

  <rect x="40" y="86" width="330" height="86" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="55" y="104" font-family="sans-serif" font-size="13" fill="#1f2937">forward</text>
  <text x="55" y="126" font-family="sans-serif" font-size="13" fill="#1f2937">Ben -&gt; U7</text>
  <text x="55" y="148" font-family="sans-serif" font-size="13" fill="#1f2937">Cara -&gt; U9</text>

  <rect x="430" y="86" width="330" height="86" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="445" y="104" font-family="sans-serif" font-size="13" fill="#1f2937">inverse</text>
  <text x="445" y="126" font-family="sans-serif" font-size="13" fill="#1f2937">U7 -&gt; Ben</text>
  <text x="445" y="148" font-family="sans-serif" font-size="13" fill="#1f2937">U9 -&gt; Cara</text>

  <!-- three writes panel -->
  <rect x="30" y="188" width="740" height="20" rx="3" fill="#fef3c7"/>
  <text x="40" y="203" font-family="sans-serif" font-size="13" fill="#1f2937">the three writes put(Amy, U7) must perform, in order</text>

  <rect x="40" y="216" width="740" height="34" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="55" y="238" font-family="sans-serif" font-size="13" fill="#1f2937">(1) forward.remove(Ben) — drop the stale Ben -&gt; U7 entry: U7 cannot belong to two keys in a true bijection</text>

  <rect x="40" y="256" width="740" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="55" y="278" font-family="sans-serif" font-size="13" fill="#1f2937">(2) forward.put(Amy, U7) — write the new forward entry</text>

  <rect x="40" y="296" width="740" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="55" y="318" font-family="sans-serif" font-size="13" fill="#1f2937">(3) inverse.put(U7, Amy) — overwrite the inverse entry so U7 now points back to Amy, not Ben</text>

  <!-- AFTER correct panel -->
  <rect x="30" y="342" width="740" height="20" rx="3" fill="#dcfce7"/>
  <text x="40" y="357" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER (correct, all three writes applied)</text>

  <rect x="40" y="372" width="330" height="86" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="55" y="390" font-family="sans-serif" font-size="13" fill="#1f2937">forward</text>
  <text x="55" y="412" font-family="sans-serif" font-size="13" fill="#1f2937">Amy -&gt; U7</text>
  <text x="55" y="434" font-family="sans-serif" font-size="13" fill="#1f2937">Cara -&gt; U9</text>

  <rect x="430" y="372" width="330" height="86" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="445" y="390" font-family="sans-serif" font-size="13" fill="#1f2937">inverse</text>
  <text x="445" y="412" font-family="sans-serif" font-size="13" fill="#1f2937">U7 -&gt; Amy</text>
  <text x="445" y="434" font-family="sans-serif" font-size="13" fill="#1f2937">U9 -&gt; Cara</text>

  <rect x="40" y="464" width="740" height="24" rx="4" fill="#dbeafe"/>
  <text x="55" y="481" font-family="sans-serif" font-size="12" fill="#1f2937">biMap.get(Amy) == U7 and biMap.inverse().get(U7) == Amy — both maps agree, invariant holds.</text>

  <!-- BROKEN panel -->
  <rect x="30" y="498" width="740" height="20" rx="3" fill="#fee2e2"/>
  <text x="40" y="513" font-family="sans-serif" font-size="13" fill="#1f2937">BROKEN — if only forward.put(Amy, U7) ran (steps 1 and 3 skipped)</text>

  <rect x="40" y="528" width="330" height="66" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="55" y="546" font-family="sans-serif" font-size="13" fill="#1f2937">forward</text>
  <text x="55" y="566" font-family="sans-serif" font-size="13" fill="#1f2937">Ben -&gt; U7  (stale, not removed)</text>
  <text x="55" y="586" font-family="sans-serif" font-size="13" fill="#1f2937">Amy -&gt; U7  Cara -&gt; U9</text>

  <rect x="430" y="528" width="330" height="66" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="445" y="546" font-family="sans-serif" font-size="13" fill="#1f2937">inverse</text>
  <text x="445" y="566" font-family="sans-serif" font-size="13" fill="#1f2937">U7 -&gt; Ben  (never updated)</text>
  <text x="445" y="586" font-family="sans-serif" font-size="13" fill="#1f2937">U9 -&gt; Cara</text>

  <rect x="40" y="600" width="740" height="18" rx="4" fill="#fef3c7"/>
  <text x="55" y="614" font-family="sans-serif" font-size="11" fill="#1f2937">biMap.get(Amy) == U7 (looks fine) but biMap.inverse().get(U7) == Ben, not Amy — the two maps disagree.</text>
</svg>
