<svg viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Map.compute 2x2 grid of key-absent/present against remapping-function-result null/non-null, showing no-insertion, insertion, removal and replacement, plus merge's distinct NullPointerException when the value argument itself is null">
  <defs>
    <marker id="arrow58" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Grid corner + column headers -->
  <rect x="20" y="20" width="120" height="40" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">compute(k,fn)</text>

  <rect x="140" y="20" width="240" height="40" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="260" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">fn returns null</text>

  <rect x="380" y="20" width="240" height="40" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="500" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">fn returns non-null</text>

  <!-- Row headers -->
  <rect x="20" y="60" width="120" height="100" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key ABSENT</text>
  <text x="80" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(or mapped to null)</text>
  <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">oldValue = null</text>
  <text x="80" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">computeIfAbsent</text>
  <text x="80" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">fires here</text>

  <rect x="20" y="160" width="120" height="100" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="80" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key PRESENT</text>
  <text x="80" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">non-null value</text>
  <text x="80" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">oldValue &#8800; null</text>
  <text x="80" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">computeIfPresent</text>
  <text x="80" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">fires here</text>

  <!-- Cell: ABSENT x null -->
  <rect x="140" y="60" width="240" height="100" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="260" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">NO INSERTION</text>
  <text x="260" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">stays absent</text>

  <!-- Cell: ABSENT x non-null -->
  <rect x="380" y="60" width="240" height="100" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="102" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">INSERTION</text>
  <text x="500" y="122" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key &#8594; newValue added</text>

  <!-- Cell: PRESENT x null -->
  <rect x="140" y="160" width="240" height="100" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="260" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">REMOVAL</text>
  <text x="260" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">mapping removed</text>

  <!-- Cell: PRESENT x non-null -->
  <rect x="380" y="160" width="240" height="100" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">REPLACEMENT</text>
  <text x="500" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">key &#8594; newValue</text>

  <!-- Dashed overlays marking which single-branch methods touch which row -->
  <rect x="140" y="60" width="480" height="100" rx="3" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="140" y="160" width="480" height="100" rx="3" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="20" y="272" width="600" height="42" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">compute(key,fn) reaches all four cells. computeIfAbsent only ever invokes fn in the top row (ABSENT);</text>
  <text x="320" y="306" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">if PRESENT it never calls fn and returns the existing value unchanged. computeIfPresent is the mirror image.</text>

  <!-- merge section -->
  <rect x="20" y="330" width="540" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="290" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">merge(key, value, remappingFunction)</text>

  <rect x="250" y="380" width="300" height="30" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">merge(key, value, fn) called</text>

  <!-- Distinct NPE callout: value argument itself null -->
  <line x1="550" y1="395" x2="655" y2="365" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <rect x="580" y="325" width="200" height="80" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="680" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">value == null</text>
  <text x="680" y="360" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">NullPointerException</text>
  <text x="680" y="376" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(Objects.requireNonNull on the</text>
  <text x="680" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">value arg — fn never runs)</text>

  <line x1="400" y1="410" x2="400" y2="435" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <rect x="250" y="435" width="300" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">oldValue = map.get(key)</text>

  <line x1="400" y1="465" x2="400" y2="490" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <rect x="250" y="490" width="300" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="510" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">oldValue == null ?</text>

  <!-- yes: absent -> put directly, fn not invoked -->
  <line x1="550" y1="505" x2="600" y2="505" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <text x="565" y="500" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <rect x="600" y="490" width="180" height="50" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="690" y="510" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">put(key, value)</text>
  <text x="690" y="528" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">directly — fn NOT invoked</text>

  <!-- no: present -> apply fn -->
  <line x1="400" y1="520" x2="400" y2="545" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <text x="410" y="536" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <rect x="250" y="545" width="300" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">newValue = fn(oldValue, value)</text>

  <line x1="400" y1="575" x2="400" y2="600" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <rect x="250" y="600" width="300" height="30" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="620" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">newValue == null ?</text>

  <!-- yes: removal -->
  <line x1="550" y1="615" x2="600" y2="615" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <text x="565" y="610" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <rect x="600" y="600" width="180" height="30" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="690" y="620" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">REMOVAL</text>

  <!-- no: replacement -->
  <line x1="400" y1="630" x2="400" y2="655" stroke="#737373" stroke-width="2" marker-end="url(#arrow58)"/>
  <text x="410" y="646" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <rect x="250" y="655" width="300" height="35" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="677" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">REPLACEMENT — key &#8594; newValue</text>
</svg>
