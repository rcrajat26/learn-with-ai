<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Why a minus b breaks as a comparator: 32-bit signed overflow wraps 2,000,000,000 minus -2,000,000,000 to -294,967,296, while Integer.compare returns the correct 1">
  <defs>
    <marker id="arrow14" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">a - b overflows: comparator returns a value with the wrong sign</text>

  <!-- wrap-around curved arrow -->
  <path d="M 710 100 C 760 70, 40 70, 90 100" fill="none" stroke="#525252" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="300" y="60" width="200" height="24" rx="3" fill="#fef3c7"/>
  <text x="400" y="77" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MAX_VALUE + 1 wraps to MIN_VALUE</text>

  <!-- MIN / 0 / MAX callouts -->
  <rect x="35" y="100" width="110" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="90" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MIN_VALUE</text>

  <rect x="370" y="100" width="60" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">0</text>

  <rect x="655" y="100" width="110" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="710" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MAX_VALUE</text>

  <!-- the number line -->
  <line x1="90" y1="150" x2="710" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow14)"/>
  <line x1="90" y1="145" x2="90" y2="155" stroke="#737373" stroke-width="2"/>
  <line x1="400" y1="145" x2="400" y2="155" stroke="#737373" stroke-width="2"/>
  <line x1="710" y1="145" x2="710" y2="155" stroke="#737373" stroke-width="2"/>

  <!-- points for a and b -->
  <circle cx="689" cy="150" r="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <circle cx="111" cy="150" r="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <line x1="689" y1="150" x2="689" y2="185" stroke="#737373" stroke-width="2"/>
  <line x1="111" y1="150" x2="111" y2="185" stroke="#737373" stroke-width="2"/>

  <rect x="600" y="185" width="178" height="26" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="689" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a = 2,000,000,000</text>

  <rect x="22" y="185" width="178" height="26" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="111" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">b = -2,000,000,000</text>

  <!-- worked arithmetic -->
  <rect x="40" y="240" width="330" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="205" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a - b = 2,000,000,000 - (-2,000,000,000)</text>

  <line x1="205" y1="286" x2="205" y2="312" stroke="#737373" stroke-width="2" marker-end="url(#arrow14)"/>

  <rect x="40" y="312" width="330" height="46" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="205" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">true mathematical value = 4,000,000,000</text>

  <line x1="205" y1="358" x2="205" y2="384" stroke="#737373" stroke-width="2" marker-end="url(#arrow14)"/>

  <rect x="40" y="384" width="330" height="56" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="205" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">exceeds Integer.MAX_VALUE, wraps</text>
  <text x="205" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a - b = -294,967,296 (wrong sign)</text>

  <!-- comparator contrast -->
  <line x1="370" y1="263" x2="440" y2="263" stroke="#737373" stroke-width="2" marker-end="url(#arrow14)"/>
  <rect x="440" y="240" width="330" height="46" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="605" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Integer.compare(a, b)</text>
  <text x="605" y="279" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 1 (correct: a &gt; b, no subtraction)</text>

  <rect x="440" y="312" width="330" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">never subtracts; compares bit patterns</text>
  <text x="605" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">directly, so it cannot overflow</text>
</svg>