<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="MapN interleaved table: one Object array of length 2 times EXPAND_FACTOR times n holding key at 2i and value at 2i+1, with a probe collision resolved by skipping two slots">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ImmutableCollections.MapN — one Object[] table, length = 2 &#215; EXPAND_FACTOR (2) &#215; n (3) = 12</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">table[2i] = key, table[2i+1] = value; probe() only ever lands on even indices</text>

  <!-- 12 slots, 6 pairs -->
  <g font-family="sans-serif" font-size="12">
    <!-- pair 0: idx0,1 - cherry -->
    <rect x="30" y="90" width="80" height="46" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="70" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 0 (key)</text>
    <text x="70" y="124" text-anchor="middle" font-size="13" fill="#1f2937">cherry</text>

    <rect x="110" y="90" width="80" height="46" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="150" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 1 (val)</text>
    <text x="150" y="124" text-anchor="middle" font-size="13" fill="#1f2937">3</text>

    <!-- pair 1: idx2,3 - empty -->
    <rect x="190" y="90" width="80" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="230" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 2</text>
    <text x="230" y="124" text-anchor="middle" font-size="13" fill="#1f2937">null</text>

    <rect x="270" y="90" width="80" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="310" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 3</text>
    <text x="310" y="124" text-anchor="middle" font-size="13" fill="#1f2937">null</text>

    <!-- pair 2: idx4,5 - apple (first probe target for both apple and banana) -->
    <rect x="350" y="90" width="80" height="46" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="390" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 4 (key)</text>
    <text x="390" y="124" text-anchor="middle" font-size="13" fill="#1f2937">apple</text>

    <rect x="430" y="90" width="80" height="46" rx="4" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="470" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 5 (val)</text>
    <text x="470" y="124" text-anchor="middle" font-size="13" fill="#1f2937">1</text>

    <!-- pair 3: idx6,7 - banana (collision resolved here) -->
    <rect x="510" y="90" width="80" height="46" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="550" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 6 (key)</text>
    <text x="550" y="124" text-anchor="middle" font-size="13" fill="#1f2937">banana</text>

    <rect x="590" y="90" width="80" height="46" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="630" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 7 (val)</text>
    <text x="630" y="124" text-anchor="middle" font-size="13" fill="#1f2937">2</text>

    <!-- pair 4: idx8,9 - empty -->
    <rect x="670" y="90" width="47" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="693" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 8</text>
    <text x="693" y="124" text-anchor="middle" font-size="11" fill="#1f2937">null</text>

    <rect x="720" y="90" width="45" height="46" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="742" y="106" text-anchor="middle" font-size="11" fill="#1f2937">idx 9</text>
    <text x="742" y="124" text-anchor="middle" font-size="11" fill="#1f2937">null</text>
  </g>

  <text x="30" y="165" font-family="sans-serif" font-size="12" fill="#1f2937">(idx 10, 11 also null — omitted for space; table length is 12)</text>

  <!-- probe walkthrough -->
  <rect x="20" y="185" width="760" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="35" y="207" font-family="sans-serif" font-size="13" fill="#1f2937">put("cherry",3): idx = floorMod(hash("cherry"), 6) &lt;&lt; 1 = 0 &#8594; table[0..1] free &#8594; placed at idx 0</text>
  <text x="35" y="225" font-family="sans-serif" font-size="13" fill="#1f2937">put("apple",1): idx = floorMod(hash("apple"), 6) &lt;&lt; 1 = 4 &#8594; table[4..5] free &#8594; placed at idx 4</text>
  <text x="35" y="243" font-family="sans-serif" font-size="13" fill="#1f2937">put("banana",2): idx = floorMod(hash("banana"), 6) &lt;&lt; 1 = 4 too &#8594; collides with apple</text>

  <rect x="20" y="265" width="760" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="35" y="287" font-family="sans-serif" font-size="13" fill="#1f2937">probe("banana"): table[4] = "apple" (not equal) &#8594; idx += 2 &#8594; idx = 6</text>
  <text x="35" y="305" font-family="sans-serif" font-size="13" fill="#1f2937">table[6] is null &#8594; free pair &#8594; return -(6 + 1) = -7; caller writes key at 6, value at 7</text>
  <rect x="35" y="315" width="260" height="24" rx="3" fill="#fee2e2"/>
  <text x="165" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">collision resolved: banana &#8594; idx 6</text>

  <line x1="390" y1="136" x2="550" y2="90" stroke="#737373" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="420" y="150" width="120" height="24" rx="3" fill="#fee2e2"/>
  <text x="480" y="167" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">probe skips +2</text>

  <text x="30" y="365" font-family="sans-serif" font-size="13" fill="#1f2937">probe(k): idx = floorMod(hash(k), table.length &gt;&gt; 1) &lt;&lt; 1 — walks in steps of 2 (key slots only), wraps at table.length.</text>
  <text x="30" y="385" font-family="sans-serif" font-size="13" fill="#1f2937">Returns idx on a hit (key found at that slot), or -(idx + 1) on a miss, where idx is the free key slot to insert at.</text>
</svg>
