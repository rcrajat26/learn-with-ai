<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 3: hasNext evaluates cursor not equal size, 2 equals 2, returns false, loop exits silently with no comodification check">
  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937">Frame 3: hasNext() short-circuits the loop</text>

  <rect x="240" y="70" width="320" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">hasNext(): return cursor != size</text>
  <text x="400" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2 != 2  &#8594;  false</text>

  <rect x="290" y="140" width="220" height="34" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="400" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">loop exits silently</text>

  <line x1="400" y1="120" x2="400" y2="140" stroke="#737373" stroke-width="2" marker-end="url(#arrow31c)"/>
  <defs>
    <marker id="arrow31c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="180" y="200" width="440" height="40" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">no next() call, so no comodification check</text>
  <text x="400" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">checkForComodification() only runs inside next()</text>

  <rect x="230" y="255" width="340" height="20" rx="3" fill="#dcfce7"/>
  <text x="400" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this is why removing the 2nd-to-last item escapes CME</text>
</svg>
