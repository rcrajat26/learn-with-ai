<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after: Java 7 ConcurrentHashMap with 16 ReentrantLock-guarded Segment mini-hashmaps capping concurrency at concurrencyLevel, versus Java 8 one table with per-bin locking bounded only by bin count">
  <defs>
    <marker id="arrow131" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Left: Java 7 -->
  <text x="200" y="35" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Java 7 — Segment[] (unverified exact sizing; documented design)</text>

  <rect x="40" y="50" width="320" height="330" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="200" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Segment[] segments — length fixed at construction</text>
  <text x="200" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">default concurrencyLevel = 16 -&gt; 16 segments</text>

  <!-- 4 sample segments (representing 16) -->
  <g>
    <rect x="55" y="100" width="135" height="80" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="122" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Segment 0</text>
    <text x="122" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends ReentrantLock</text>
    <text x="122" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mini HashEntry[] table</text>
    <text x="122" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">key A, key B (same bucket)</text>

    <rect x="210" y="100" width="135" height="80" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="277" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Segment 1</text>
    <text x="277" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends ReentrantLock</text>
    <text x="277" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mini HashEntry[] table</text>

    <rect x="55" y="195" width="135" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="122" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Segment 2</text>
    <text x="122" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends ReentrantLock</text>

    <rect x="210" y="195" width="135" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="277" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">... Segment 15</text>
    <text x="277" y="232" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends ReentrantLock</text>
  </g>

  <!-- blocking illustration -->
  <rect x="55" y="265" width="290" height="55" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="200" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">key A put and key B put both hash</text>
  <text x="200" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">to Segment 0 -&gt; B blocks on A's lock</text>

  <rect x="55" y="332" width="290" height="38" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">concurrency capped at concurrencyLevel</text>

  <text x="200" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">memory overhead: one Segment object +</text>
  <text x="200" y="416" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">one lock + one mini-table array PER segment,</text>
  <text x="200" y="432" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">allocated even for empty segments</text>

  <!-- Right: Java 8 -->
  <text x="600" y="35" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Java 8+ — one Node&lt;K,V&gt;[] table, per-bin locking</text>

  <rect x="440" y="50" width="320" height="330" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="600" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">single table, synchronized(binHead) per bin</text>

  <g>
    <rect x="455" y="90" width="60" height="40" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="485" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin 0</text>
    <rect x="520" y="90" width="60" height="40" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="550" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin 1</text>
    <rect x="585" y="90" width="60" height="40" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="615" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin 2</text>
    <rect x="650" y="90" width="60" height="40" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="680" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin 3</text>
    <rect x="715" y="90" width="30" height="40" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="730" y="114" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">...</text>
  </g>

  <rect x="500" y="150" width="200" height="55" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">key A locks only bin 1's head node;</text>
  <text x="600" y="187" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">key C in bin 2 proceeds unaffected</text>

  <rect x="470" y="220" width="260" height="38" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="600" y="244" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">concurrency bounded by bin count (table.length)</text>

  <text x="600" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">no fixed lock array: lock is the first Node</text>
  <text x="600" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">in each bin — no per-segment object/table</text>
  <text x="600" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">allocated up front</text>

  <text x="600" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">table resizes as one structure (helped by</text>
  <text x="600" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">multiple threads, see D-129) instead of per-segment</text>

  <!-- center arrow -->
  <line x1="365" y1="215" x2="435" y2="215" stroke="#737373" stroke-width="2" marker-end="url(#arrow131)"/>
  <rect x="368" y="196" width="64" height="20" rx="3" fill="#fef3c7"/>
  <text x="400" y="211" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Java 8</text>

  <!-- footer note -->
  <rect x="60" y="450" width="680" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="472" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Java 7 numbers (16 segments, ReentrantLock subclass, mini HashEntry[] per segment) are the</text>
  <text x="400" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">documented design, not read from this JDK 21 source file — no Java 7 line numbers are asserted here.</text>
</svg>
