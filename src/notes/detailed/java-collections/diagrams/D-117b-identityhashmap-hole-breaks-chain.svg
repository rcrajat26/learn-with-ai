<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2: removing the middle key B leaves a null hole at index 4 that would incorrectly terminate a probe for C before closeDeletion repairs it">
  <defs>
    <marker id="arrow117b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="24" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="37" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    Frame 2 of 3 — remove(B) at idx 4 leaves a hole that breaks the probe run
  </text>

  <rect x="60" y="110" width="140" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="130" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 0</text>
  <text x="130" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">(empty)</text>

  <rect x="260" y="110" width="140" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="330" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 2</text>
  <text x="330" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key A</text>

  <rect x="460" y="110" width="140" height="70" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="530" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 4</text>
  <text x="530" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">null (d)</text>

  <rect x="660" y="110" width="120" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="720" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">idx 6</text>
  <text x="720" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key C</text>

  <rect x="464" y="86" width="130" height="20" rx="3" fill="#fef3c7"/>
  <text x="529" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    remove(B): tab[4]=null
  </text>

  <!-- broken probe attempt for C -->
  <line x1="330" y1="200" x2="330" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow117b)"/>
  <line x1="330" y1="230" x2="530" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow117b)"/>

  <rect x="60" y="230" width="720" height="52" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="420" y="250" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    A subsequent get(C): hash(C,8) = 2 → probe idx 2 (A, no match) → probe idx 4 → tab[4] == null → STOP
  </text>
  <text x="420" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    get(C) wrongly returns "not found" even though C still sits at idx 6 — this is why closeDeletion(d=4) must run now.
  </text>
</svg>
