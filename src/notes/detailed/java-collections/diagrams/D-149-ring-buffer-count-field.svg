<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Fixed-capacity 8-slot ring buffer distinguishing full (count=8) from empty (count=0) using a count field, contrasted with ArrayDeque which always wastes one slot so head equals tail unambiguously means empty">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowEmph" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- title -->
  <rect x="20" y="20" width="760" height="26" rx="4" fill="#e5e7eb"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Fixed-capacity ring buffer, capacity 8 — full vs empty look identical except for the count field</text>

  <!-- FULL state row -->
  <rect x="30" y="58" width="180" height="20" rx="3" fill="#dcfce7"/>
  <text x="40" y="73" font-family="sans-serif" font-size="13" fill="#1f2937">state: FULL</text>

  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="140" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="170" y="118" text-anchor="middle">0</text>
    <rect x="206" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="236" y="118" text-anchor="middle">1</text>
    <rect x="272" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="302" y="118" text-anchor="middle">2</text>
    <rect x="338" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="368" y="118" text-anchor="middle">3</text>
    <rect x="404" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="434" y="118" text-anchor="middle">4</text>
    <rect x="470" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="500" y="118" text-anchor="middle">5</text>
    <rect x="536" y="88" width="60" height="50" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="566" y="118" text-anchor="middle">6</text>
    <rect x="602" y="88" width="60" height="50" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
    <text x="632" y="118" text-anchor="middle">7</text>
  </g>

  <!-- head/tail markers for FULL row, both point at slot 0 (next write would overwrite oldest) -->
  <rect x="120" y="55" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="160" y="68" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head=0, tail=0</text>
  <line x1="160" y1="73" x2="160" y2="86" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <rect x="600" y="55" width="130" height="18" rx="3" fill="#dcfce7"/>
  <text x="665" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">count = 8 -&gt; FULL</text>

  <!-- EMPTY state row -->
  <rect x="30" y="160" width="180" height="20" rx="3" fill="#e5e7eb"/>
  <text x="40" y="175" font-family="sans-serif" font-size="13" fill="#1f2937">state: EMPTY</text>

  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="140" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="170" y="220" text-anchor="middle">0</text>
    <rect x="206" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="236" y="220" text-anchor="middle">1</text>
    <rect x="272" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="302" y="220" text-anchor="middle">2</text>
    <rect x="338" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="368" y="220" text-anchor="middle">3</text>
    <rect x="404" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="434" y="220" text-anchor="middle">4</text>
    <rect x="470" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="500" y="220" text-anchor="middle">5</text>
    <rect x="536" y="190" width="60" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="566" y="220" text-anchor="middle">6</text>
    <rect x="602" y="190" width="60" height="50" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
    <text x="632" y="220" text-anchor="middle">7</text>
  </g>

  <!-- head/tail markers for EMPTY row, both point at slot 0 as well -->
  <rect x="120" y="157" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="160" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">head=0, tail=0</text>
  <line x1="160" y1="175" x2="160" y2="188" stroke="#525252" stroke-width="2" marker-end="url(#arrowEmph)"/>

  <rect x="600" y="157" width="130" height="18" rx="3" fill="#e5e7eb"/>
  <text x="665" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">count = 0 -&gt; EMPTY</text>

  <!-- key insight box -->
  <rect x="30" y="256" width="740" height="66" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="50" y="280" font-family="sans-serif" font-size="14" fill="#1f2937">head=0 and tail=0 are IDENTICAL in both rows above — the array contents and index positions</text>
  <text x="50" y="302" font-family="sans-serif" font-size="14" fill="#1f2937">give no way to tell full from empty. This ring buffer distinguishes full/empty by tracking</text>
  <text x="50" y="316" font-family="sans-serif" font-size="13" fill="#1f2937">count directly — no wasted slot is needed.</text>

  <!-- contrast with ArrayDeque -->
  <rect x="30" y="338" width="740" height="130" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="50" y="362" font-family="sans-serif" font-size="14" fill="#1f2937">Contrast — ArrayDeque's circular buffer (see D-77) never uses a count field:</text>
  <text x="50" y="386" font-family="sans-serif" font-size="13" fill="#1f2937">it always reserves one slot unwritten, so a backing array of capacity 17 holds at most 16</text>
  <text x="50" y="406" font-family="sans-serif" font-size="13" fill="#1f2937">elements. That sacrifice makes head == tail unambiguous: it can only mean EMPTY, because tail</text>
  <text x="50" y="426" font-family="sans-serif" font-size="13" fill="#1f2937">is never allowed to advance far enough to collide with head at a FULL state.</text>
  <rect x="50" y="436" width="700" height="20" rx="3" fill="#fef3c7"/>
  <text x="60" y="451" font-family="sans-serif" font-size="12" fill="#1f2937">ArrayDeque: capacity N, usable slots N-1, head==tail always means empty. This ring buffer: capacity N, usable slots N, count field means either.</text>
</svg>
