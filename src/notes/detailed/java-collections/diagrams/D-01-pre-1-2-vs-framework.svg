<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before Java 1.2: Vector, Hashtable, Stack, Dictionary, Enumeration as five disconnected classes with no shared supertype. After Java 1.2: Iterable extends to Collection which fans out to List, Set, Queue, plus a separate Map root, standardised across four layers - interfaces, implementations, algorithms, iteration protocol">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Titles -->
  <rect x="40" y="20" width="280" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="180" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">BEFORE JAVA 1.2 (JDK 1.0-1.1)</text>

  <rect x="420" y="20" width="340" height="26" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="590" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">JAVA 1.2 COLLECTIONS FRAMEWORK</text>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="480" stroke="#737373" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Left: five disconnected boxes, no shared supertype, no connecting lines -->
  <rect x="45" y="65" width="120" height="45" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="105" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Vector</text>

  <rect x="210" y="65" width="120" height="45" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="270" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Hashtable</text>

  <rect x="45" y="125" width="120" height="45" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="105" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Stack</text>

  <rect x="210" y="125" width="120" height="45" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="270" y="152" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Dictionary</text>

  <rect x="130" y="185" width="140" height="45" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Enumeration</text>

  <rect x="45" y="245" width="300" height="50" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="195" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">No shared supertype across Vector, Hashtable,</text>
  <text x="195" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Stack, Dictionary, Enumeration - five separate APIs</text>

  <!-- Right: standardised hierarchy -->
  <rect x="480" y="65" width="140" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="550" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Iterable</text>

  <line x1="550" y1="105" x2="550" y2="123" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="125" width="140" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Collection</text>

  <rect x="650" y="125" width="110" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="705" y="150" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Map</text>

  <!-- fan-out arrows -->
  <line x1="520" y1="165" x2="475" y2="183" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="165" x2="575" y2="183" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="165" x2="675" y2="183" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="488" y="167" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="514" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <rect x="540" y="167" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="566" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <rect x="592" y="167" width="52" height="16" rx="3" fill="#fef3c7"/>
  <text x="618" y="179" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">extends</text>

  <rect x="430" y="185" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="475" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">List</text>

  <rect x="530" y="185" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="575" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Set</text>

  <rect x="630" y="185" width="90" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="675" y="210" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Queue</text>

  <rect x="630" y="240" width="150" height="35" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="705" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Map: separate root, no extends</text>

  <!-- Legend: four standardised layers -->
  <rect x="40" y="300" width="720" height="24" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="317" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">FOUR STANDARDISED LAYERS OF THE FRAMEWORK</text>

  <rect x="45" y="332" width="30" height="24" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="90" y="349" font-family="sans-serif" font-size="13" fill="#1f2937">INTERFACES: Collection, List, Set, Queue, Map define contracts</text>

  <rect x="45" y="366" width="30" height="24" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="90" y="383" font-family="sans-serif" font-size="13" fill="#1f2937">IMPLEMENTATIONS: ArrayList, HashSet, HashMap, LinkedList</text>

  <rect x="45" y="400" width="30" height="24" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="90" y="417" font-family="sans-serif" font-size="13" fill="#1f2937">ALGORITHMS: Collections.sort(), shuffle() work polymorphically</text>

  <rect x="45" y="434" width="30" height="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="90" y="451" font-family="sans-serif" font-size="13" fill="#1f2937">ITERATION PROTOCOL: Iterable / Iterator unify traversal</text>
</svg>