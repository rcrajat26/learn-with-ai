<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Extending AbstractList over a linked structure is O(n squared): Itr calls get(i) for every step and each get(i) walks i nodes, forming a triangle of n squared over 2 hops; AbstractSequentialList is the correct O(n) base; AbstractMap.get similarly must scan the whole entrySet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="40" y="20" width="820" height="36" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="43" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AbstractList over a linked structure costs O(n^2) to iterate</text>

  <!-- Section A: triangle of work -->
  <rect x="40" y="76" width="820" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="96" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AbstractList.Itr.next() calls get(i) for every step</text>

  <!-- triangle bars: get(0)..get(5), bar length = i hops -->
  <rect x="60" y="120" width="40" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="120" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="138" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(0): 0 hops</text>

  <rect x="60" y="162" width="78" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="162" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(1): 1 hop</text>

  <rect x="60" y="204" width="116" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="204" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(2): 2 hops</text>

  <rect x="60" y="246" width="154" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="246" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(3): 3 hops</text>

  <rect x="60" y="288" width="192" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="288" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(4): 4 hops</text>

  <rect x="60" y="330" width="230" height="26" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="520" y="330" width="150" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="595" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(5): 5 hops</text>

  <!-- total callout -->
  <rect x="60" y="380" width="700" height="40" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="410" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Full iteration = get(0)+get(1)+...+get(n-1) ~ n^2 / 2 hops total</text>

  <!-- Section B: AbstractSequentialList, the correct base -->
  <rect x="40" y="450" width="820" height="30" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="470" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AbstractSequentialList: one ListIterator pass across the whole list</text>

  <rect x="60" y="490" width="700" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="410" y="512" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">next() called n times, 1 hop each = n hops total, not n^2</text>

  <!-- Section C: AbstractMap.get scanning entrySet -->
  <rect x="40" y="550" width="820" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">AbstractMap.get(key) scans the whole entrySet()</text>

  <rect x="60" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="105" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e1</text>
  <rect x="160" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="205" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e2</text>
  <rect x="260" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="305" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e3</text>
  <rect x="360" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e4</text>
  <rect x="460" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="505" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e5</text>
  <rect x="560" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e6</text>
  <rect x="660" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="705" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e7</text>
  <rect x="760" y="590" width="90" height="34" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="805" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e8</text>

  <line x1="60" y1="644" x2="850" y2="644" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="630" width="240" height="22" rx="3" fill="#fef3c7"/>
  <text x="450" y="646" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">scans until match or exhausted</text>

  <rect x="60" y="670" width="700" height="36" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="410" y="693" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(key): O(n) worst case, no hashing shortcut</text>
</svg>