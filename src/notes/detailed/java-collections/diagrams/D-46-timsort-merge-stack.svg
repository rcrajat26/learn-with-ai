<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="TimSort merge stack across three push/collapse steps: stack [32,32] merges on invariant 2 into 64, then [64,20,25] merges on invariant 2 into [64,45], then [64,45,50] merges on invariant 1 into [64,95]">
  <defs>
    <marker id="arrowD46" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Invariant reference box -->
  <rect x="20" y="20" width="960" height="55" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="500" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Invariant 1: runLen[i-3] &gt; runLen[i-2] + runLen[i-1]</text>
  <text x="500" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">Invariant 2: runLen[i-2] &gt; runLen[i-1]</text>

  <!-- Frame borders -->
  <rect x="20" y="95" width="295" height="445" rx="6" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="350" y="95" width="295" height="445" rx="6" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="680" y="95" width="295" height="445" rx="6" fill="none" stroke="#737373" stroke-width="2"/>

  <!-- ===================== FRAME 1 ===================== -->
  <rect x="30" y="105" width="275" height="28" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="167.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Step 1: push run(32) -&gt; stack [32, 32]</text>

  <rect x="30" y="145" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="75" y="159" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">BEFORE</text>

  <rect x="97" y="175" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="167" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">32 (n-1, top)</text>
  <rect x="97" y="211" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="167" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">32 (n-2)</text>

  <rect x="97" y="253" width="140" height="40" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="167" y="267" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Invariant 2 check:</text>
  <text x="167" y="283" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">32 &gt; 32? NO -&gt; violated</text>

  <line x1="167" y1="298" x2="167" y2="330" stroke="#737373" stroke-width="2" marker-end="url(#arrowD46)"/>
  <rect x="97" y="303" width="140" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="167" y="317" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MERGE top 2 runs (32+32)</text>

  <rect x="30" y="335" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="75" y="349" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">AFTER</text>

  <rect x="97" y="360" width="140" height="34" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="167" y="381" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64 (merged)</text>

  <!-- ===================== FRAME 2 ===================== -->
  <rect x="360" y="105" width="275" height="28" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="497.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Step 2: push run(20), run(25) -&gt; [64,20,25]</text>

  <rect x="360" y="145" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="159" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">BEFORE</text>

  <rect x="427" y="175" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="497" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">25 (n-1, top)</text>
  <rect x="427" y="211" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="497" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">20 (n-2)</text>
  <rect x="427" y="247" width="140" height="32" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="497" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64 (n-3)</text>

  <rect x="427" y="289" width="140" height="44" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="497" y="303" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Inv1: 64&gt;20+25=45? YES</text>
  <text x="497" y="319" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Inv2: 20&gt;25? NO -&gt; violated</text>

  <line x1="497" y1="338" x2="497" y2="366" stroke="#737373" stroke-width="2" marker-end="url(#arrowD46)"/>
  <rect x="427" y="341" width="140" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="497" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MERGE n-2,n-1 (20+25)</text>

  <rect x="360" y="372" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">AFTER</text>

  <rect x="427" y="397" width="140" height="32" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="497" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">45 (merged)</text>
  <rect x="427" y="433" width="140" height="32" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="497" y="454" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64</text>

  <!-- ===================== FRAME 3 ===================== -->
  <rect x="690" y="105" width="275" height="28" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="827.5" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Step 3: push run(50) -&gt; [64,45,50]</text>

  <rect x="690" y="145" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="735" y="159" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">BEFORE</text>

  <rect x="757" y="175" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="827" y="196" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">50 (n-1, top)</text>
  <rect x="757" y="211" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="827" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">45 (n-2)</text>
  <rect x="757" y="247" width="140" height="32" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="827" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64 (n-3)</text>

  <rect x="757" y="289" width="140" height="44" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="827" y="303" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Inv1: 64&gt;45+50=95? NO</text>
  <text x="827" y="319" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">-&gt; violated, merge n-2,n-1</text>

  <line x1="827" y1="338" x2="827" y2="366" stroke="#737373" stroke-width="2" marker-end="url(#arrowD46)"/>
  <rect x="757" y="341" width="140" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="827" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MERGE n-2,n-1 (45+50)</text>

  <rect x="690" y="372" width="90" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="735" y="386" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">AFTER</text>

  <rect x="757" y="397" width="140" height="32" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="827" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">95 (merged)</text>
  <rect x="757" y="433" width="140" height="32" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="827" y="454" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64</text>
</svg>
