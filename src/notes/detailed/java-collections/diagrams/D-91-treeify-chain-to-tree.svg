<svg viewBox="0 0 940 940" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Treeify before and after: a 9-node chain in one bin of a 64-length table becomes a red-black TreeNode bin, with the original linked-list order retained as a dashed overlay so untreeify remains possible">
  <defs>
    <marker id="arrow91" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="470" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Treeify: chain to red-black bin</text>

  <!-- ============ BEFORE PANEL ============ -->
  <rect x="20" y="40" width="900" height="360" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">BEFORE — table[bin] as a linked chain</text>

  <rect x="40" y="80" width="150" height="26" rx="3" fill="#dbeafe" stroke="#737373" stroke-width="1"/>
  <text x="115" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">table length = 64</text>

  <rect x="210" y="80" width="230" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="325" y="98" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">TREEIFY_THRESHOLD = 8</text>

  <!-- chain of 9 nodes -->
  <g font-family="sans-serif" font-size="13">
    <!-- n1..n9 -->
    <rect x="40"  y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="80" y="190" text-anchor="middle" fill="#1f2937">n1</text>
    <rect x="140" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="180" y="190" text-anchor="middle" fill="#1f2937">n2</text>
    <rect x="240" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="280" y="190" text-anchor="middle" fill="#1f2937">n3</text>
    <rect x="340" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="380" y="190" text-anchor="middle" fill="#1f2937">n4</text>
    <rect x="440" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="480" y="190" text-anchor="middle" fill="#1f2937">n5</text>
    <rect x="540" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="580" y="190" text-anchor="middle" fill="#1f2937">n6</text>
    <rect x="640" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="680" y="190" text-anchor="middle" fill="#1f2937">n7</text>
    <rect x="740" y="160" width="80" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="780" y="190" text-anchor="middle" fill="#1f2937">n8</text>
    <rect x="840" y="160" width="60" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <text x="870" y="190" text-anchor="middle" fill="#1f2937">n9</text>
  </g>

  <!-- next arrows -->
  <line x1="120" y1="185" x2="138" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="220" y1="185" x2="238" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="320" y1="185" x2="338" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="420" y1="185" x2="438" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="520" y1="185" x2="538" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="620" y1="185" x2="638" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="720" y1="185" x2="738" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <line x1="820" y1="185" x2="838" y2="185" stroke="#737373" stroke-width="2" marker-end="url(#arrow91)"/>
  <rect x="895" y="172" width="18" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="904" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">/</text>
  <text x="880" y="230" font-family="sans-serif" font-size="11" fill="#1f2937">n9.next = null</text>

  <rect x="40" y="240" width="860" height="30" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="470" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">9th node inserted at binCount = 8 (&gt;= TREEIFY_THRESHOLD - 1 = 7) triggers treeifyBin</text>

  <rect x="40" y="290" width="860" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="470" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">degradation: worst-case lookup is O(n) = 9 comparisons to reach n9</text>

  <!-- ============ AFTER PANEL ============ -->
  <rect x="20" y="420" width="900" height="500" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="40" y="446" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">AFTER — same 9 entries as a red-black TreeNode bin</text>

  <!-- legend -->
  <rect x="680" y="436" width="18" height="18" rx="9" fill="#fee2e2" stroke="#737373" stroke-width="1.5"/>
  <text x="706" y="450" font-family="sans-serif" font-size="12" fill="#1f2937">red = true</text>
  <rect x="800" y="436" width="18" height="18" rx="9" fill="#e5e7eb" stroke="#737373" stroke-width="1.5"/>
  <text x="826" y="450" font-family="sans-serif" font-size="12" fill="#1f2937">red = false</text>

  <!-- tree edges (solid) -->
  <g stroke="#737373" stroke-width="2" fill="none">
    <line x1="470" y1="500" x2="330" y2="580"/>
    <line x1="470" y1="500" x2="610" y2="580"/>
    <line x1="330" y1="580" x2="230" y2="660"/>
    <line x1="330" y1="580" x2="400" y2="660"/>
    <line x1="610" y1="580" x2="540" y2="660"/>
    <line x1="610" y1="580" x2="700" y2="660"/>
    <line x1="400" y1="660" x2="360" y2="740"/>
    <line x1="540" y1="660" x2="580" y2="740"/>
  </g>

  <!-- dashed "next" overlay through original relative order n1..n9 -->
  <path d="M 230 660 L 330 580 L 400 660 L 360 740 L 470 500 L 580 740 L 540 660 L 610 580 L 700 660"
        fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- tree nodes: root n5 black -->
  <circle cx="470" cy="500" r="28" fill="#e5e7eb" stroke="#525252" stroke-width="2.5"/>
  <text x="470" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">n5</text>

  <circle cx="330" cy="580" r="26" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="330" y="585" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n2</text>

  <circle cx="610" cy="580" r="26" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="610" y="585" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n8</text>

  <circle cx="230" cy="660" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="665" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n1</text>

  <circle cx="400" cy="660" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="400" y="665" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n3</text>

  <circle cx="540" cy="660" r="24" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="540" y="665" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n7</text>

  <circle cx="700" cy="660" r="24" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="700" y="665" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n9</text>

  <circle cx="360" cy="740" r="22" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="360" y="745" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">n4</text>

  <circle cx="580" cy="740" r="22" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="580" y="745" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">n6</text>

  <!-- field list callout on root n5 -->
  <rect x="440" y="820" width="440" height="80" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <line x1="490" y1="820" x2="470" y2="528" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="660" y="838" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1f2937">n5 fields added by TreeNode&lt;K,V&gt;:</text>
  <text x="660" y="856" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">parent, left, right, prev,</text>
  <text x="660" y="874" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">boolean red</text>
  <text x="660" y="892" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">(plus the inherited next from Node)</text>

  <!-- dashed overlay explanation -->
  <rect x="40" y="820" width="380" height="80" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="840" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">dashed line = retained next linkage,</text>
  <text x="230" y="856" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">threading n1..n9 in original chain order —</text>
  <text x="230" y="872" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">the linked list survives inside the tree,</text>
  <text x="230" y="888" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">which is what makes untreeify possible</text>

  <!-- headline result label -->
  <rect x="270" y="434" width="400" height="22" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="1.5"/>
  <text x="470" y="450" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1f2937">worst-case lookup now O(log n), 3 comparisons instead of 9</text>
</svg>
