<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame C: another thread helping advance a stale tail by walking to the real last node and CASing tail forward">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="16"
        fill="#1f2937" font-weight="bold">Frame C — helping: another thread advances the stale tail</text>

  <rect x="60" y="110" width="70" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="95" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">A</text>
  <line x1="130" y1="130" x2="180" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="185" y="110" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="220" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">B</text>
  <line x1="255" y1="130" x2="305" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="110" width="70" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="345" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">C</text>
  <line x1="380" y1="130" x2="430" y2="130" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="435" y="110" width="70" height="40" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="470" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">D (real last)</text>

  <!-- stale tail -->
  <rect x="300" y="45" width="70" height="26" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="335" y="63" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">tail (stale)</text>
  <line x1="335" y1="71" x2="345" y2="108" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- helper thread walking p=p.next then CASing tail to D -->
  <rect x="560" y="45" width="150" height="34" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="635" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">helper thread</text>
  <line x1="600" y1="79" x2="345" y2="105" stroke="#737373" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="500" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1. walk p = p.next from tail</text>

  <line x1="635" y1="79" x2="470" y2="105" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">2. TAIL.weakCompareAndSet(this, staleTail, D) — CASes tail forward to real last node</text>

  <rect x="60" y="205" width="700" height="30" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="410" y="225" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">source: TAIL.weakCompareAndSet at ConcurrentLinkedQueue.java line 366 / 582 / 587</text>

  <rect x="60" y="245" width="700" height="42" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="410" y="263" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">No thread ever blocks on a stale tail: any thread traversing the chain can help</text>
  <text x="410" y="279" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">advance it, so lagging tail costs at most one extra hop, never a stall.</text>
</svg>
