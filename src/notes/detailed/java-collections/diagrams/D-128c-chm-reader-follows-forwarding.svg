<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame C: a get reader hits a ForwardingNode and follows it into nextTable via ForwardingNode.find, without blocking, using only volatile reads">
  <rect x="240" y="24" width="320" height="32" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Cooperative resize: ForwardingNode (frame C of 4)</text>

  <rect x="40" y="80" width="150" height="36" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="115" y="103" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">get(key) reader</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="230" y="80" width="180" height="36" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="320" y="103" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">tabAt(table, bin i)</text>
  <line x1="190" y1="98" x2="226" y2="98" stroke="#525252" stroke-width="2" marker-end="url(#arrowblue)"/>

  <rect x="230" y="150" width="220" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">node.hash == MOVED (-1)</text>
  <text x="340" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">→ it is a ForwardingNode</text>
  <line x1="320" y1="116" x2="340" y2="146" stroke="#525252" stroke-width="2" marker-end="url(#arrowblue)"/>

  <rect x="230" y="230" width="220" height="50" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="340" y="252" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ForwardingNode.find(h, key)</text>
  <text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">searches nextTable directly</text>
  <line x1="340" y1="210" x2="340" y2="226" stroke="#525252" stroke-width="2" marker-end="url(#arrowblue)"/>

  <rect x="550" y="150" width="180" height="180" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="640" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">nextTable</text>
  <rect x="560" y="200" width="160" height="30" fill="#dcfce7" stroke="#737373" stroke-width="1.5"/>
  <text x="640" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">matching entry found</text>
  <line x1="450" y1="255" x2="556" y2="215" stroke="#525252" stroke-width="2" marker-end="url(#arrowblue)"/>

  <rect x="230" y="320" width="500" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="480" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">no lock, volatile reads only — reader never blocks on the resize</text>
</svg>
