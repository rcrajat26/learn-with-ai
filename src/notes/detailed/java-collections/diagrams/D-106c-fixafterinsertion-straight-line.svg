<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fixAfterInsertion case 3: black uncle with a straight line rotates at the grandparent and recolors parent black, grandparent red">
  <defs>
    <marker id="arrow106c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="600" height="30" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="320" y="40" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">fixAfterInsertion — Case 3: black uncle, straight line (rotate + recolor)</text>

  <rect x="20" y="60" width="110" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="75" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= RED node</text>
  <rect x="140" y="60" width="120" height="24" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="200" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= BLACK node</text>

  <rect x="400" y="60" width="220" height="26" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="510" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">local invariants restored; loop may end</text>

  <rect x="40" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BEFORE (straight line)</text>
  <rect x="360" y="100" width="240" height="26" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">AFTER rotateRight(G) + recolor</text>

  <!-- BEFORE: G(black) -> P(red, left child) -> N(red, left child of P), U black right child of G -->
  <line x1="180" y1="170" x2="110" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="180" y1="170" x2="250" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="110" y1="250" x2="70" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="180" cy="170" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="180" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="110" cy="250" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="110" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="110" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="250" cy="250" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="250" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="250" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="70" cy="330" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="70" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="70" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <!-- AFTER: rotateRight(G) -> P takes G's place (black), G becomes P's right child (red), N left child of P (red) -->
  <line x1="470" y1="170" x2="410" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="470" y1="170" x2="540" y2="250" stroke="#737373" stroke-width="2"/>
  <line x1="540" y1="250" x2="570" y2="330" stroke="#737373" stroke-width="2"/>

  <circle cx="470" cy="170" r="28" fill="#e5e7eb" stroke="#525252" stroke-width="3"/>
  <text x="470" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">P</text>
  <text x="470" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <circle cx="410" cy="250" r="28" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="410" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">N</text>
  <text x="410" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="540" cy="250" r="28" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="540" y="246" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">G</text>
  <text x="540" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">red</text>

  <circle cx="570" cy="330" r="28" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="570" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">U</text>
  <text x="570" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">black</text>

  <line x1="284" y1="230" x2="356" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow106c)"/>
  <rect x="270" y="200" width="100" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="216" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">rotateRight(G)</text>

  <rect x="40" y="410" width="560" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">P, N, G now form a straight line (left-left, or right-right for the mirror).</text>
  <text x="320" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">One rotation at G (rotateRight here) plus recoloring P to black and G to red</text>
  <text x="320" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">restores both the black-height and no-red-red-edge invariants. The while loop can now exit.</text>
</svg>
