<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Analytic cost model, not measured data: total cost versus write ratio for CopyOnWriteArrayList at three collection sizes compared against a lock-based synchronized list, with the algebraic crossover condition annotated">
  <defs>
    <marker id="arrow133" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="46" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ANALYTIC COST MODEL — NOT MEASURED DATA. No benchmark was run; no JDK build, CPU, or JMH profile is named.</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Shape only: CoW write = Θ(n) copy + allocation; CoW read = O(1) lock-free; synchronized list = O(1) write + lock cost.</text>

  <!-- Axes -->
  <line x1="90" y1="440" x2="740" y2="440" stroke="#737373" stroke-width="2" marker-end="url(#arrow133)"/>
  <line x1="90" y1="440" x2="90" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow133)"/>
  <rect x="360" y="460" width="140" height="24" rx="3" fill="#e5e7eb"/>
  <text x="430" y="477" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">write ratio (0 → 1)</text>
  <rect x="20" y="90" width="90" height="24" rx="3" fill="#e5e7eb"/>
  <text x="65" y="107" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">total cost</text>

  <!-- x tick labels -->
  <rect x="82" y="444" width="20" height="18" rx="2" fill="#e5e7eb"/>
  <text x="92" y="457" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">0</text>
  <rect x="725" y="444" width="20" height="18" rx="2" fill="#e5e7eb"/>
  <text x="735" y="457" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1</text>

  <!-- synchronized list: linear, low slope, size-independent -->
  <path d="M 90 420 L 740 200" fill="none" stroke="#525252" stroke-width="3"/>
  <rect x="590" y="176" width="150" height="22" rx="3" fill="#e5e7eb"/>
  <text x="665" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">synchronized list (O(1)/write)</text>

  <!-- CoW n=100 -->
  <path d="M 90 428 C 300 425, 500 300, 740 150" fill="none" stroke="#dbeafe" stroke-width="3" stroke-opacity="1"/>
  <path d="M 90 428 C 300 425, 500 300, 740 150" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="1 5"/>
  <rect x="595" y="126" width="140" height="22" rx="3" fill="#dbeafe"/>
  <text x="665" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">CoW, n = 100</text>

  <!-- CoW n=10,000 -->
  <path d="M 90 430 C 200 350, 320 120, 740 95" fill="none" stroke="#dcfce7" stroke-width="3"/>
  <path d="M 90 430 C 200 350, 320 120, 740 95" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="1 5"/>
  <rect x="470" y="98" width="150" height="22" rx="3" fill="#dcfce7"/>
  <text x="545" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">CoW, n = 10,000</text>

  <!-- CoW n=1,000,000 -->
  <path d="M 90 432 C 130 300, 180 96, 740 92" fill="none" stroke="#fee2e2" stroke-width="3"/>
  <path d="M 90 432 C 130 300, 180 96, 740 92" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="1 5"/>
  <rect x="140" y="70" width="170" height="22" rx="3" fill="#fee2e2"/>
  <text x="225" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">CoW, n = 1,000,000</text>

  <!-- shaded region where CoW wins (low write ratio) -->
  <path d="M 90 440 L 220 440 L 220 90 L 90 90 Z" fill="#dcfce7" fill-opacity="1" stroke="none"/>
  <rect x="95" y="400" width="120" height="34" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="155" y="414" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">CoW favoured region:</text>
  <text x="155" y="428" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">read-heavy, low write ratio</text>

  <!-- crossover annotation -->
  <line x1="220" y1="90" x2="220" y2="440" stroke="#525252" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="230" y="230" width="330" height="70" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="240" y="248" font-family="sans-serif" font-size="12" fill="#1f2937">Crossover condition (algebraic, not measured):</text>
  <text x="240" y="264" font-family="sans-serif" font-size="12" fill="#1f2937">writeRatio × n × copyCostPerElem  &gt;  lockCostPerOp</text>
  <text x="240" y="280" font-family="sans-serif" font-size="12" fill="#1f2937">i.e. crossover write ratio r* ≈ lockCost / (n × copyCostPerElem)</text>
  <text x="240" y="296" font-family="sans-serif" font-size="11" fill="#1f2937">r* shrinks as n grows — larger lists tolerate far fewer writes</text>

  <text x="400" y="500" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Left of the dashed line: ConcurrentHashMap.newKeySet()/synchronizedList lose to CoW's O(1) lock-free reads.</text>
</svg>
