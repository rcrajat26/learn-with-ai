<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The subList memory-retention leak: a subList of a one-million-element ArrayList retains the entire backing array via root, while copying the subList into a new ArrayList retains only a one-element array">

  <defs>
    <marker id="arrow35" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">The subList memory-retention leak</text>

  <!-- LEFT: leak via subList -->
  <rect x="20" y="55" width="420" height="360" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">big.subList(0, 1)</text>

  <rect x="55" y="100" width="350" height="60" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="230" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">big: ArrayList, elementData</text>
  <text x="230" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Object[1,000,000] (all still referenced)</text>

  <rect x="90" y="200" width="280" height="80" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="230" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">SubList</text>
  <text x="230" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">root = big</text>
  <text x="230" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">offset = 0, size = 1</text>
  <text x="230" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">keeps a live reference to root</text>

  <line x1="230" y1="200" x2="230" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow35)"/>
  <rect x="170" y="170" width="120" height="18" rx="3" fill="#dbeafe"/>
  <text x="230" y="183" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">root reference</text>

  <rect x="55" y="305" width="350" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="230" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Retained bytes (compressed oops)</text>
  <text x="230" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">16 + 4 &#215; 1,000,000 = 4,000,016 B</text>
  <text x="230" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">&#8776; 3.8 MiB, for a "1-element" view</text>
  <text x="230" y="381" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">header 16B (8 mark+4 class+4 length) + 4B/ref</text>

  <!-- RIGHT: fix via copy -->
  <rect x="460" y="55" width="420" height="360" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="670" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">new ArrayList&lt;&gt;(big.subList(0, 1))</text>

  <rect x="495" y="100" width="350" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="670" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">big: still Object[1,000,000]</text>
  <text x="670" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">but NOT referenced by the copy</text>

  <line x1="670" y1="160" x2="670" y2="200" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="610" y="168" width="120" height="18" rx="3" fill="#fef3c7"/>
  <text x="670" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no lasting link</text>

  <rect x="530" y="200" width="280" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="670" y="222" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">new ArrayList</text>
  <text x="670" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">own elementData, length 1</text>
  <text x="670" y="256" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">copied element, independent array</text>

  <rect x="495" y="305" width="350" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="670" y="326" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937" font-weight="bold">Retained bytes (compressed oops)</text>
  <text x="670" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">16 + 4 &#215; 1 = 20 B &#8594; padded to 24 B</text>
  <text x="670" y="363" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">plus the ArrayList shell itself</text>
  <text x="670" y="381" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">big's array becomes collectible</text>

  <rect x="230" y="430" width="440" height="20" rx="3" fill="#fef3c7"/>
  <text x="450" y="445" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Assumes compressed oops (default heap &lt; ~32 GiB); 8-byte refs otherwise change the math</text>
</svg>
