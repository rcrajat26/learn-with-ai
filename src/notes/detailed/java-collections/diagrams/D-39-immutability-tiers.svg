<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Five immutability tiers from mutable ArrayList to List.of, each rung showing its factory and whether add, remove, set, and reflects-source are allowed or throw">

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">The five immutability tiers</text>

  <!-- Legend -->
  <rect x="480" y="46" width="16" height="16" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="502" y="59" font-family="sans-serif" font-size="11" fill="#1f2937">allowed</text>
  <rect x="570" y="46" width="16" height="16" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="592" y="59" font-family="sans-serif" font-size="11" fill="#1f2937">throws / not applicable</text>

  <!-- column header labels for capability strip -->
  <text x="560" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add</text>
  <text x="618" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">remove</text>
  <text x="676" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">set</text>
  <text x="742" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">reflects src</text>

  <!-- ========================= TIER 4 : List.of ========================= -->
  <rect x="40" y="94" width="720" height="66" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="60" y="118" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Tier 4</text>
  <text x="60" y="138" font-family="sans-serif" font-size="13" fill="#1f2937">List.of(...)</text>
  <text x="200" y="118" font-family="sans-serif" font-size="11" fill="#1f2937">immutable, null-hostile</text>
  <text x="200" y="138" font-family="sans-serif" font-size="11" fill="#1f2937">List12 / ListN, allowNulls=false</text>
  <!-- capability cells -->
  <rect x="536" y="106" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="560" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="594" y="106" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="618" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="652" y="106" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="676" y="131" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="710" y="106" width="60" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="740" y="124" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <text x="740" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(own copy)</text>

  <line x1="400" y1="160" x2="400" y2="176" stroke="#737373" stroke-width="2"/>

  <!-- ========================= TIER 3 : List.copyOf ========================= -->
  <rect x="40" y="176" width="720" height="66" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="60" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Tier 3</text>
  <text x="60" y="220" font-family="sans-serif" font-size="13" fill="#1f2937">List.copyOf(src)</text>
  <text x="200" y="200" font-family="sans-serif" font-size="11" fill="#1f2937">independent copy</text>
  <text x="200" y="220" font-family="sans-serif" font-size="11" fill="#1f2937">listCopy(): reuses instance if src already immutable</text>
  <rect x="536" y="188" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="560" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="594" y="188" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="618" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="652" y="188" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="676" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="710" y="188" width="60" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="740" y="213" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <line x1="400" y1="242" x2="400" y2="258" stroke="#737373" stroke-width="2"/>

  <!-- ========================= TIER 2 : unmodifiableList ========================= -->
  <rect x="40" y="258" width="720" height="66" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="60" y="282" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Tier 2</text>
  <text x="60" y="302" font-family="sans-serif" font-size="13" fill="#1f2937">Collections.unmodifiableList(src)</text>
  <text x="290" y="282" font-family="sans-serif" font-size="11" fill="#1f2937">read-only wrapper</text>
  <text x="290" y="302" font-family="sans-serif" font-size="11" fill="#1f2937">holds this.list = src</text>
  <rect x="536" y="270" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="560" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="594" y="270" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="618" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="652" y="270" width="48" height="42" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="676" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="710" y="270" width="60" height="42" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="740" y="288" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <text x="740" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(live view)</text>

  <line x1="400" y1="324" x2="400" y2="340" stroke="#737373" stroke-width="2"/>

  <!-- ========================= TIER 1 : two representatives, different set() behaviour ========================= -->
  <rect x="40" y="340" width="720" height="112" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="60" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Tier 1</text>
  <text x="60" y="378" font-family="sans-serif" font-size="11" fill="#1f2937">fixed-size</text>

  <!-- sub-rung A: Arrays.asList -->
  <text x="200" y="358" font-family="sans-serif" font-size="12" fill="#1f2937">Arrays.asList(a)</text>
  <text x="200" y="374" font-family="sans-serif" font-size="11" fill="#1f2937">private ArrayList over array a</text>
  <rect x="536" y="346" width="48" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="560" y="367" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="594" y="346" width="48" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="618" y="367" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="652" y="346" width="48" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="676" y="367" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">allowed</text>
  <rect x="710" y="346" width="60" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="740" y="367" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes (array)</text>

  <line x1="40" y1="396" x2="760" y2="396" stroke="#737373" stroke-width="1"/>

  <!-- sub-rung B: Collections.nCopies -->
  <text x="200" y="416" font-family="sans-serif" font-size="12" fill="#1f2937">Collections.nCopies(n, e)</text>
  <text x="200" y="432" font-family="sans-serif" font-size="11" fill="#1f2937">CopiesList: set() not overridden -&gt; AbstractList throws</text>
  <rect x="536" y="404" width="48" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="560" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="594" y="404" width="48" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="618" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="652" y="404" width="48" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="676" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">throws</text>
  <rect x="710" y="404" width="60" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="740" y="425" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n/a</text>

  <line x1="400" y1="452" x2="400" y2="468" stroke="#737373" stroke-width="2"/>

  <!-- ========================= TIER 0 : mutable ArrayList + EnumSet note ========================= -->
  <rect x="40" y="468" width="720" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="492" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Tier 0</text>
  <text x="60" y="512" font-family="sans-serif" font-size="13" fill="#1f2937">new ArrayList&lt;&gt;(...)</text>
  <text x="60" y="530" font-family="sans-serif" font-size="11" fill="#1f2937">fully mutable, growable</text>
  <rect x="536" y="480" width="48" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="560" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">allowed</text>
  <rect x="594" y="480" width="48" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="618" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">allowed</text>
  <rect x="652" y="480" width="48" height="34" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="676" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">allowed</text>
  <rect x="710" y="480" width="60" height="34" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="740" y="501" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">n/a (is src)</text>

  <rect x="200" y="522" width="540" height="28" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="470" y="540" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    EnumSet&lt;E&gt; also belongs here: RegularEnumSet.add/remove are real mutators, not throwing wrappers
  </text>

  <!-- footer citation -->
  <rect x="40" y="570" width="720" height="20" rx="3" fill="#e5e7eb"/>
  <text x="400" y="585" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    Collections.java: UnmodifiableList/CopiesList; ImmutableCollections.java: listCopy, List12/ListN; Arrays.java: ArrayList; EnumSet.java, RegularEnumSet.java
  </text>

</svg>
