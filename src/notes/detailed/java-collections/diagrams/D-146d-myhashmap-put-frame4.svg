<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 4 of 4: resize lo/hi split of a bin, with the TreeNode split branch marked SIMPLIFIED on the java.util.HashMap side">
  <text x="480" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937" font-weight="bold">MyHashMap.put traced against the JDK -- frame 4 of 4</text>
  <text x="480" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">A resize doubling 16 -&gt; 32: the lo/hi split of bin index 5</text>

  <!-- left half -->
  <rect x="30" y="65" width="440" height="530" rx="8" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">MyHashMap</text>

  <text x="46" y="108" font-family="sans-serif" font-size="11" fill="#1f2937">bin[5] holds hashes 5, 21, 37 (all &amp;15 == 5)</text>

  <rect x="46" y="118" width="410" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="52" y="139" font-family="sans-serif" font-size="11" fill="#1f2937">if ((e.hash &amp; oldCap) == 0)  // oldCap = 16</text>

  <text x="46" y="168" font-family="sans-serif" font-size="11" fill="#1f2937">5 &amp; 16 = 0, 21 &amp; 16 = 16, 37 &amp; 16 = 0</text>

  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <rect x="46" y="180" width="190" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="141" y="198" text-anchor="middle" font-weight="bold">loHead / loTail</text>
    <text x="141" y="216" text-anchor="middle">5 -&gt; 37</text>
    <text x="141" y="232" text-anchor="middle">stays at index 5</text>

    <rect x="266" y="180" width="190" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="361" y="198" text-anchor="middle" font-weight="bold">hiHead / hiTail</text>
    <text x="361" y="216" text-anchor="middle">21</text>
    <text x="361" y="232" text-anchor="middle">moves to index 21 (5+16)</text>
  </g>

  <rect x="46" y="255" width="410" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="251" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">new table[32]: index 5 = [5,37], index 21 = [21]</text>
  <text x="251" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">both remain plain linked bins (sorted-list bin form)</text>

  <rect x="46" y="330" width="410" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="52" y="352" font-family="sans-serif" font-size="11" fill="#1f2937">deep-bin handling: documented sorted-list bin</text>
  <text x="52" y="370" font-family="sans-serif" font-size="11" fill="#1f2937">replaces java.util.HashMap's red-black TreeNode</text>
  <text x="52" y="388" font-family="sans-serif" font-size="11" fill="#1f2937">to keep the reimplementation approachable</text>

  <!-- right half -->
  <rect x="490" y="65" width="440" height="530" rx="8" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="88" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">java.util.HashMap</text>

  <text x="506" y="108" font-family="sans-serif" font-size="11" fill="#1f2937">bin[5] holds hashes 5, 21, 37 (all &amp;15 == 5)</text>

  <rect x="506" y="118" width="410" height="34" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="512" y="139" font-family="sans-serif" font-size="11" fill="#1f2937">if ((e.hash &amp; oldCap) == 0)  // oldCap = 16</text>

  <text x="506" y="168" font-family="sans-serif" font-size="11" fill="#1f2937">5 &amp; 16 = 0, 21 &amp; 16 = 16, 37 &amp; 16 = 0</text>

  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <rect x="506" y="180" width="190" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="601" y="198" text-anchor="middle" font-weight="bold">loHead / loTail</text>
    <text x="601" y="216" text-anchor="middle">5 -&gt; 37</text>
    <text x="601" y="232" text-anchor="middle">stays at index 5</text>

    <rect x="726" y="180" width="190" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
    <text x="821" y="198" text-anchor="middle" font-weight="bold">hiHead / hiTail</text>
    <text x="821" y="216" text-anchor="middle">21</text>
    <text x="821" y="232" text-anchor="middle">moves to index 21 (5+16)</text>
  </g>

  <rect x="506" y="255" width="410" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="711" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">new table[32]: index 5 = [5,37], index 21 = [21]</text>
  <text x="711" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">bin form here is plain linked (below TREEIFY_THRESHOLD)</text>

  <!-- SIMPLIFIED badge box -->
  <rect x="506" y="330" width="410" height="90" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="3"/>
  <rect x="800" y="336" width="106" height="22" rx="11" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="853" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937" font-weight="bold">SIMPLIFIED</text>
  <text x="512" y="352" font-family="sans-serif" font-size="11" fill="#1f2937">if a bin is a TreeNode:</text>
  <text x="512" y="370" font-family="sans-serif" font-size="10.5" fill="#1f2937">((TreeNode&lt;K,V&gt;)e).split(this, newTab, j, oldCap)</text>
  <text x="512" y="390" font-family="sans-serif" font-size="11" fill="#1f2937">real resize() also splits red-black tree bins in place;</text>
  <text x="512" y="408" font-family="sans-serif" font-size="11" fill="#1f2937">MyHashMap has no tree-bin form, so this branch does not exist there.</text>

  <rect x="46" y="435" width="864" height="140" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="62" y="460" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">One deliberate simplification, marked above.</text>
  <text x="62" y="485" font-family="sans-serif" font-size="12" fill="#1f2937">The lo/hi split logic using (e.hash &amp; oldCap) == 0 is identical in both --</text>
  <text x="62" y="505" font-family="sans-serif" font-size="12" fill="#1f2937">this is the elegant trick that avoids recomputing hash % newCap for every node.</text>
  <text x="62" y="525" font-family="sans-serif" font-size="12" fill="#1f2937">Only the deep-bin (8+ node) representation differs: java.util.HashMap treeifies into a</text>
  <text x="62" y="545" font-family="sans-serif" font-size="12" fill="#1f2937">red-black tree; MyHashMap documents a sorted-list bin instead, for pedagogical clarity.</text>
</svg>
