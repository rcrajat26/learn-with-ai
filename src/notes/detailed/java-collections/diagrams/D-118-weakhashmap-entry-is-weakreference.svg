<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="WeakHashMap.Entry extends WeakReference of Object: its referent slot IS the key, held weakly and registered with a ReferenceQueue, while value, hash, and next are ordinary strong fields; contrasted with HashMap.Node which holds its key by a strong reference">
  <defs>
    <marker id="arrow118" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrowweak118" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    WeakHashMap.Entry &lt;K,V&gt; extends WeakReference&lt;Object&gt; implements Map.Entry&lt;K,V&gt;
  </text>

  <!-- WeakHashMap.Entry object -->
  <rect x="60" y="60" width="330" height="230" rx="8" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="225" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    WeakHashMap.Entry&lt;K,V&gt;
  </text>

  <!-- inherited referent slot from WeakReference -->
  <rect x="80" y="98" width="290" height="48" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="225" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    referent (inherited from Reference)
  </text>
  <text x="225" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    holds the key — WEAK reference, GC-collectible
  </text>

  <rect x="80" y="156" width="290" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="176" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">V value — strong field</text>

  <rect x="80" y="192" width="290" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">final int hash — strong field</text>

  <rect x="80" y="228" width="290" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Entry&lt;K,V&gt; next — strong field</text>

  <text x="225" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    ctor: super(key, queue); this.value=value; this.hash=hash; this.next=next;
  </text>

  <!-- key object, weakly referenced -->
  <rect x="480" y="70" width="140" height="50" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="550" y="99" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">key object</text>

  <line x1="370" y1="122" x2="478" y2="95" stroke="#525252" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowweak118)"/>
  <rect x="392" y="90" width="80" height="20" rx="3" fill="#fef3c7"/>
  <text x="432" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">weak ref</text>

  <!-- value object, strongly referenced -->
  <rect x="480" y="160" width="140" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="550" y="189" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">value object</text>
  <line x1="370" y1="171" x2="478" y2="182" stroke="#737373" stroke-width="2" marker-end="url(#arrow118)"/>
  <rect x="392" y="152" width="90" height="20" rx="3" fill="#fef3c7"/>
  <text x="437" y="167" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">strong ref</text>

  <!-- ReferenceQueue -->
  <rect x="60" y="330" width="330" height="70" rx="8" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="225" y="356" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    private final ReferenceQueue&lt;Object&gt; queue
  </text>
  <text x="225" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    GC enqueues this Entry here once the key is reclaimed
  </text>

  <line x1="225" y1="290" x2="225" y2="328" stroke="#525252" stroke-width="2" marker-end="url(#arrowweak118)"/>
  <rect x="140" y="298" width="170" height="20" rx="3" fill="#fef3c7"/>
  <text x="225" y="313" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    registered via super(key, queue)
  </text>

  <rect x="60" y="416" width="330" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="436" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    expungeStaleEntries() drains the queue and unlinks
  </text>

  <!-- contrast: HashMap.Node -->
  <rect x="450" y="290" width="310" height="180" rx="8" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="314" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">
    contrast: HashMap.Node&lt;K,V&gt;
  </text>

  <rect x="470" y="326" width="270" height="30" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="605" y="346" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">
    final K key — STRONG field, no WeakReference
  </text>

  <rect x="470" y="362" width="270" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="381" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">final int hash</text>

  <rect x="470" y="394" width="270" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="413" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">V value</text>

  <rect x="470" y="426" width="270" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="605" y="445" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Node&lt;K,V&gt; next</text>

  <text x="605" y="465" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">
    a HashMap.Node's key keeps its object alive forever
  </text>
</svg>
