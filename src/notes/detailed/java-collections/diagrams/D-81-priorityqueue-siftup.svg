  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 — 0 appended at index 10 (last slot); compare with parent(10)=4, value 5</text>

  <g stroke="#737373" stroke-width="2">
