    <line x1="310" y1="408" x2="265" y2="460"/>
  </g>
  <line x1="310" y1="408" x2="355" y2="460" stroke="#525252" stroke-width="3" stroke-dasharray="4,3"/>
  <line x1="310" y1="380" x2="355" y2="460" stroke="#525252" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <circle cx="400" cy="180" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">0:1</text>
  <circle cx="220" cy="280" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="220" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1:3</text>
