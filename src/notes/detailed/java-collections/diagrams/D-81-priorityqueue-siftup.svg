<svg viewBox="0 0 800 1590" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="PriorityQueue siftUp: offering value 0 into a 10-element min-heap bubbles it up through three parent swaps to the root, shown as tree plus array each step">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="10" width="760" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">offer(0) dispatches to siftUp, which calls siftUpComparable(k,x) or siftUpUsingComparator(k,x,cmp) —</text>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">two separate private methods, not one generic method with a null check, so each call site stays monomorphic for the JIT</text>

  <!-- ================= FRAME 1 ================= -->
