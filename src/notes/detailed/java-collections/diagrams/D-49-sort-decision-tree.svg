<svg viewBox="0 0 1300 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Decision tree for java.util.Arrays sort dispatch: primitive arrays use DualPivotQuicksort with insertion sort, counting sort, merge-sort fallback and heapsort sub-branches; object arrays use TimSort with a useLegacyMergeSort side branch; parallelSort gates on MIN_ARRAY_SORT_GRAN=8192">
  <defs>
    <marker id="arrowD49" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Root -->
  <rect x="647" y="30" width="220" height="40" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="757" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Arrays.sort(...) / .parallelSort(...)</text>

  <!-- Level 1 branches -->
  <rect x="230" y="110" width="200" height="40" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="330" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">primitive[] -&gt;</text>
  <text x="330" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">DualPivotQuicksort</text>

  <rect x="710" y="110" width="200" height="40" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="810" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Object[] -&gt;</text>
  <text x="810" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">TimSort</text>

  <rect x="1030" y="110" width="200" height="40" rx="5" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="1130" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Arrays.parallelSort(...)</text>
  <text x="1130" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">check size gate</text>

  <!-- root to level1 edges -->
  <line x1="757" y1="70" x2="330" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="757" y1="70" x2="810" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="757" y1="70" x2="1130" y2="108" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>

  <!-- leaves: primitive (i0-i3) -->
  <rect x="20" y="190" width="140" height="70" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="90" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">size &lt; insertion</text>
  <text x="90" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">sort cutoff</text>
  <text x="90" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; insertion sort</text>

  <rect x="180" y="190" width="140" height="70" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="250" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">type is byte /</text>
  <text x="250" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">char / short</text>
  <text x="250" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; counting sort</text>

  <rect x="340" y="190" width="140" height="70" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="410" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">run structure</text>
  <text x="410" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">detected (asc/desc)</text>
  <text x="410" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; merge-sort fallback</text>

  <rect x="500" y="190" width="140" height="70" rx="5" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="570" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">recursion depth ==</text>
  <text x="570" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MAX_RECURSION_DEPTH</text>
  <text x="570" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; heapsort</text>

  <!-- leaves: object (i4-i5) -->
  <rect x="660" y="190" width="140" height="70" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="730" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">default path</text>
  <text x="730" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(useLegacyMergeSort=false)</text>
  <text x="730" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; TimSort</text>

  <rect x="820" y="190" width="140" height="70" rx="5" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="890" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">useLegacyMergeSort=</text>
  <text x="890" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">true (system property)</text>
  <text x="890" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; legacy MergeSort</text>

  <!-- leaves: parallelSort (i6-i7) -->
  <rect x="980" y="190" width="140" height="70" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="1050" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">length &lt;</text>
  <text x="1050" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MIN_ARRAY_SORT_GRAN (8192)</text>
  <text x="1050" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; sequential sort</text>

  <rect x="1140" y="190" width="140" height="70" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="1210" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">length &gt;=</text>
  <text x="1210" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">MIN_ARRAY_SORT_GRAN (8192)</text>
  <text x="1210" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">-&gt; parallel merge (ForkJoinPool)</text>

  <!-- level1 to leaves edges -->
  <line x1="330" y1="150" x2="90" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="330" y1="150" x2="250" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="330" y1="150" x2="410" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="330" y1="150" x2="570" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>

  <line x1="810" y1="150" x2="730" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="810" y1="150" x2="890" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>

  <line x1="1130" y1="150" x2="1050" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>
  <line x1="1130" y1="150" x2="1210" y2="188" stroke="#737373" stroke-width="2" marker-end="url(#arrowD49)"/>

  <rect x="20" y="280" width="1260" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Java 21: Arrays.sort / Arrays.parallelSort dispatch by element type, array size, and detected run structure</text>
</svg>
