<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList packs 16 element references into each 64-byte cache line giving 16 elements per miss, while LinkedList nodes sit at unrelated heap addresses so each of 8 nodes drags its own cache line, giving 1 element per miss">
  <defs>
    <marker id="arrow29" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- ArrayList section -->
  <rect x="20" y="20" width="420" height="26" rx="3" fill="#e5e7eb"/>
  <text x="230" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList backing array — contiguous</text>

  <!-- 32 cells = 2 cache lines of 16 refs -->
  <g>
    <!-- cache line 0 -->
    <rect x="58" y="88" width="324" height="34" fill="none" stroke="#525252" stroke-width="2"/>
    <!-- cache line 1 -->
    <rect x="382" y="88" width="324" height="34" fill="none" stroke="#525252" stroke-width="2"/>
  </g>
  <g>
    <!-- 32 element cells -->
    <!-- generated via repeated rects, x = 60 + i*20 -->
    <rect x="60" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="80" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="100" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="120" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="140" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="160" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="180" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="200" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="220" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="240" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="260" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="280" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="300" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="320" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="340" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="360" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>

    <rect x="384" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="404" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="424" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="444" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="464" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="484" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="504" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="524" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="544" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="564" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="584" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="604" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="624" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="644" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="664" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <rect x="684" y="90" width="20" height="30" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  </g>

  <rect x="80" y="130" width="280" height="20" rx="3" fill="#e5e7eb"/>
  <text x="220" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cache line 0 (64 bytes) = 16 refs</text>

  <rect x="404" y="130" width="280" height="20" rx="3" fill="#e5e7eb"/>
  <text x="544" y="144" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">cache line 1 (64 bytes) = 16 refs</text>

  <rect x="120" y="160" width="160" height="26" rx="3" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="200" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">16 elements per miss</text>
  <line x1="200" y1="160" x2="220" y2="122" stroke="#525252" stroke-width="2" marker-end="url(#arrow29)"/>

  <!-- Divider between the two sections -->
  <line x1="20" y1="220" x2="780" y2="220" stroke="#737373" stroke-width="1"/>

  <!-- LinkedList section -->
  <rect x="20" y="234" width="460" height="26" rx="3" fill="#e5e7eb"/>
  <text x="250" y="252" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">LinkedList nodes — scattered heap addresses</text>

  <!-- pointer chain across scattered nodes -->
  <line x1="90" y1="300" x2="180" y2="420" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="180" y1="420" x2="270" y2="310" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="270" y1="310" x2="360" y2="430" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="360" y1="430" x2="450" y2="295" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="450" y1="295" x2="540" y2="425" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="540" y1="425" x2="630" y2="305" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>
  <line x1="630" y1="305" x2="720" y2="415" stroke="#737373" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow29)"/>

  <!-- 8 nodes, each dragging its own cache line -->
  <g>
    <!-- Node 1 -->
    <rect x="55" y="265" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="65" y="285" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="90" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N1</text>

    <!-- Node 2 -->
    <rect x="145" y="385" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="155" y="405" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="180" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N2</text>

    <!-- Node 3 -->
    <rect x="235" y="275" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="245" y="295" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="270" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N3</text>

    <!-- Node 4 -->
    <rect x="325" y="395" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="335" y="415" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="360" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N4</text>

    <!-- Node 5 -->
    <rect x="415" y="260" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="425" y="280" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="450" y="299" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N5</text>

    <!-- Node 6 -->
    <rect x="505" y="390" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="515" y="410" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="540" y="429" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N6</text>

    <!-- Node 7 -->
    <rect x="595" y="270" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="605" y="290" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="630" y="309" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N7</text>

    <!-- Node 8 -->
    <rect x="685" y="380" width="70" height="70" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
    <rect x="695" y="400" width="50" height="30" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
    <text x="720" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">N8</text>
  </g>

  <rect x="560" y="30" width="180" height="26" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="650" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">1 element per miss</text>
  <line x1="650" y1="56" x2="630" y2="270" stroke="#525252" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow29)"/>

  <rect x="20" y="470" width="440" height="20" rx="3" fill="#e5e7eb"/>
  <text x="240" y="484" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">each red box = one full 64-byte cache line holding only that node</text>
</svg>
