<svg viewBox="0 0 940 1420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Control flow of HashMap.putVal: table allocation, empty-bin fast path, bin-head match, tree-node path, chain walk with treeify trigger, existing-key early return, and final size/threshold resize">
  <defs>
    <marker id="arrow89" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="470" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2937">putVal control flow (every branch labelled with its source condition)</text>

  <!-- Entry -->
  <rect x="140" y="34" width="400" height="56" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="340" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">putVal(int hash, K key, V value,</text>
  <text x="340" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">boolean onlyIfAbsent, boolean evict)</text>
  <line x1="340" y1="90" x2="340" y2="110" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <!-- D1 -->
  <rect x="60" y="110" width="560" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if ((tab = table) == null ||</text>
  <text x="340" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">(n = tab.length) == 0)</text>

  <rect x="640" y="110" width="260" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="770" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">n = (tab = resize()).length;</text>
  <rect x="655" y="150" width="230" height="22" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="770" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">lazy table allocation</text>

  <line x1="620" y1="145" x2="638" y2="145" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="600" y="132" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="615" y="147" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <!-- fallthrough from resize back into main line -->
  <line x1="770" y1="180" x2="770" y2="210" stroke="#737373" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow89)"/>
  <rect x="705" y="188" width="130" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="770" y="203" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">falls through</text>

  <line x1="340" y1="180" x2="340" y2="230" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="325" y="197" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="340" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <!-- D2 -->
  <rect x="60" y="230" width="560" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if ((p = tab[i = (n - 1) &amp; hash])</text>
  <text x="340" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">== null)</text>

  <rect x="640" y="230" width="260" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="770" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">tab[i] = newNode(hash, key,</text>
  <text x="770" y="271" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">value, null);</text>
  <rect x="655" y="295" width="230" height="22" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="1"/>
  <text x="770" y="311" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">empty-bin fast path</text>

  <line x1="620" y1="260" x2="638" y2="260" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="600" y="247" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="615" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <!-- long jump arrow from empty-bin fast path down to step 8 -->
  <line x1="900" y1="260" x2="920" y2="260" stroke="#737373" stroke-width="2"/>
  <line x1="920" y1="260" x2="920" y2="1175" stroke="#737373" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="920" y1="1175" x2="760" y2="1175" stroke="#737373" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow89)"/>
  <rect x="860" y="700" width="76" height="40" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="1"/>
  <text x="898" y="716" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">jump to</text>
  <text x="898" y="730" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">step 8</text>

  <line x1="340" y1="300" x2="340" y2="350" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="325" y="317" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="340" y="332" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <!-- D3 -->
  <rect x="30" y="350" width="620" height="80" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="378" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">if (p.hash == hash &amp;&amp; ((k = p.key) == key ||</text>
  <text x="340" y="396" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">(key != null &amp;&amp; key.equals(k))))</text>

  <rect x="670" y="350" width="230" height="56" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="785" y="382" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">e = p</text>
  <rect x="685" y="360" width="200" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="785" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bin head matches</text>

  <line x1="650" y1="378" x2="668" y2="378" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="630" y="365" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="645" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <!-- e=p merges down to step7 decision -->
  <line x1="785" y1="406" x2="785" y2="1040" stroke="#737373" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="785" y1="1040" x2="700" y2="1040" stroke="#737373" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow89)"/>

  <line x1="340" y1="430" x2="340" y2="470" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="325" y="440" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="340" y="455" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <!-- D4 -->
  <rect x="60" y="470" width="560" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="340" y="505" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">else if (p instanceof TreeNode)</text>

  <rect x="640" y="463" width="270" height="74" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="775" y="487" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">e = ((TreeNode&lt;K,V&gt;)p)</text>
  <text x="775" y="503" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">.putTreeVal(this, tab, hash,</text>
  <text x="775" y="519" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">key, value);</text>

  <line x1="620" y1="497" x2="638" y2="497" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="600" y="484" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="615" y="499" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <!-- putTreeVal merges down to step7 -->
  <line x1="775" y1="537" x2="775" y2="1055" stroke="#737373" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="775" y1="1055" x2="700" y2="1055" stroke="#737373" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow89)"/>

  <line x1="340" y1="530" x2="340" y2="580" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="325" y="547" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="340" y="562" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <!-- Loop container -->
  <rect x="40" y="580" width="860" height="420" rx="8" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="470" y="605" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">chain walk: for (int binCount = 0; ; ++binCount)</text>

  <!-- D6a -->
  <rect x="70" y="620" width="420" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="280" y="650" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">if ((e = p.next) == null)</text>

  <!-- yes -> new node at tail -->
  <rect x="520" y="620" width="200" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="620" y="640" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">p.next = newNode(hash,</text>
  <text x="620" y="656" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">key, value, null);</text>
  <line x1="490" y1="645" x2="518" y2="645" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="495" y="632" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="510" y="647" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <!-- D6b binCount threshold -->
  <rect x="520" y="690" width="200" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="620" y="712" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">if (binCount &gt;=</text>
  <text x="620" y="727" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TREEIFY_THRESHOLD - 1)</text>
  <line x1="620" y1="670" x2="620" y2="688" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <rect x="520" y="770" width="200" height="46" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="620" y="798" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">treeifyBin(tab, hash);</text>
  <line x1="620" y1="750" x2="620" y2="768" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="640" y="753" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="655" y="768" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <rect x="520" y="840" width="200" height="90" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="620" y="858" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">TREEIFY_THRESHOLD - 1 = 7:</text>
  <text x="620" y="874" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">binCount counts from 0 and the</text>
  <text x="620" y="888" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">head node is not counted, so the</text>
  <text x="620" y="902" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">9th node in the bin triggers it</text>
  <line x1="620" y1="816" x2="620" y2="838" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <!-- both yes/no of D6b converge to break -->
  <line x1="720" y1="720" x2="770" y2="720" stroke="#737373" stroke-width="2"/>
  <rect x="740" y="708" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="755" y="723" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <line x1="770" y1="720" x2="770" y2="945" stroke="#737373" stroke-width="2"/>
  <line x1="720" y1="793" x2="800" y2="793" stroke="#737373" stroke-width="2"/>
  <line x1="800" y1="793" x2="800" y2="945" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <!-- D6c else path: e.hash comparison -->
  <line x1="280" y1="690" x2="280" y2="720" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="265" y="697" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="280" y="712" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <rect x="70" y="720" width="420" height="90" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="280" y="746" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">else if (e.hash == hash &amp;&amp;</text>
  <text x="280" y="763" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">((k = e.key) == key || (key != null &amp;&amp;</text>
  <text x="280" y="780" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">key.equals(k))))</text>

  <line x1="490" y1="765" x2="770" y2="765" stroke="#737373" stroke-width="2"/>
  <line x1="770" y1="765" x2="770" y2="945" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="600" y="753" width="150" height="22" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="675" y="769" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes: found existing key</text>

  <!-- else: p = e, loop back -->
  <rect x="70" y="840" width="420" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="280" y="868" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">else p = e;   (loop back to binCount check)</text>
  <line x1="280" y1="810" x2="280" y2="838" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="300" y="815" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="315" y="830" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <path d="M 70 863 C 20 863 20 645 68 645" fill="none" stroke="#737373" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow89)"/>
  <rect x="10" y="740" width="60" height="34" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="40" y="753" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">loop</text>
  <text x="40" y="766" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1f2937">back</text>

  <!-- break node -->
  <rect x="720" y="945" width="120" height="40" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="780" y="970" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">break</text>

  <line x1="470" y1="1000" x2="470" y2="1020" stroke="#737373" stroke-width="2"/>
  <line x1="780" y1="985" x2="780" y2="1020" stroke="#737373" stroke-width="2"/>
  <line x1="780" y1="1020" x2="470" y2="1020" stroke="#737373" stroke-width="2"/>
  <line x1="470" y1="1020" x2="470" y2="1040" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <!-- D7 -->
  <rect x="120" y="1040" width="580" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="410" y="1075" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if (e != null)   [existing mapping for key]</text>

  <rect x="600" y="1105" width="300" height="180" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="3"/>
  <text x="750" y="1128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">V oldValue = e.value;</text>
  <text x="750" y="1146" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">if (!onlyIfAbsent ||</text>
  <text x="750" y="1162" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">    oldValue == null)</text>
  <text x="750" y="1178" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">  e.value = value;</text>
  <text x="750" y="1196" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#1f2937">afterNodeAccess(e);</text>
  <text x="750" y="1216" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">return oldValue;</text>
  <rect x="612" y="1226" width="276" height="46" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="1"/>
  <text x="750" y="1242" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">RETURN — skips size and</text>
  <text x="750" y="1258" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">modCount updates below</text>

  <line x1="700" y1="1070" x2="598" y2="1070" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="640" y="1057" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="655" y="1072" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <line x1="410" y1="1100" x2="410" y2="1150" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="395" y="1115" width="30" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="410" y="1130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <!-- step 8 -->
  <rect x="220" y="1150" width="380" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="410" y="1178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">++modCount;</text>

  <line x1="410" y1="1196" x2="410" y2="1230" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>

  <!-- D8b -->
  <rect x="200" y="1230" width="420" height="56" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="410" y="1263" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">if (++size &gt; threshold)</text>

  <rect x="660" y="1230" width="200" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="760" y="1258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">resize();</text>
  <line x1="620" y1="1255" x2="658" y2="1255" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <rect x="628" y="1242" width="30" height="20" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="1"/>
  <text x="643" y="1257" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>

  <line x1="410" y1="1286" x2="410" y2="1320" stroke="#737373" stroke-width="2" marker-end="url(#arrow89)"/>
  <line x1="760" y1="1276" x2="760" y2="1310" stroke="#737373" stroke-width="2"/>
  <line x1="760" y1="1310" x2="410" y2="1310" stroke="#737373" stroke-width="2"/>

  <rect x="180" y="1320" width="460" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="410" y="1348" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#1f2937">afterNodeInsertion(evict);</text>
  <text x="410" y="1366" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1f2937">return null;</text>
</svg>
