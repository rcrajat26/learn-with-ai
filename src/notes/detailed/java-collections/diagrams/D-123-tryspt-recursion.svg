<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="trySplit recursion on a 1000-element ArrayList spliterator: root range 0 to 1000 splits at the midpoint into two halves of 500, each of which splits again into four leaves of 250 with exact ranges and estimateSize, all backed by the SIZED and SUBSIZED characteristics that let fork-join pre-size the output array">
  <defs>
    <marker id="arrow123" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="360" height="26" rx="3" fill="#e5e7eb"/>
  <text x="200" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">ArrayList Spliterator trySplit() recursion</text>

  <!-- Arrows: root -> level1 -->
  <line x1="360" y1="125" x2="220" y2="205" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>
  <line x1="440" y1="125" x2="580" y2="205" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>

  <!-- Arrows: level1 -> leaves -->
  <line x1="170" y1="275" x2="120" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>
  <line x1="230" y1="275" x2="290" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>
  <line x1="570" y1="275" x2="520" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>
  <line x1="630" y1="275" x2="690" y2="360" stroke="#737373" stroke-width="2" marker-end="url(#arrow123)"/>

  <!-- Root -->
  <rect x="290" y="55" width="220" height="70" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ArrayList Spliterator</text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [0, 1000)</text>
  <text x="400" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 1000</text>

  <!-- SIZED|SUBSIZED badge -->
  <rect x="500" y="20" width="200" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">SIZED | SUBSIZED</text>
  <line x1="600" y1="46" x2="470" y2="80" stroke="#525252" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow123)"/>

  <!-- Level 1 left -->
  <rect x="100" y="205" width="200" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="200" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">trySplit() -&gt; left</text>
  <text x="200" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [0, 500)</text>
  <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 500</text>

  <!-- Level 1 right -->
  <rect x="500" y="205" width="200" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="600" y="226" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">trySplit() -&gt; right</text>
  <text x="600" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [500, 1000)</text>
  <text x="600" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 500</text>

  <!-- Leaves -->
  <rect x="25" y="360" width="150" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="100" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">leaf</text>
  <text x="100" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [0, 250)</text>
  <text x="100" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 250</text>

  <rect x="225" y="360" width="150" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="300" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">leaf</text>
  <text x="300" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [250, 500)</text>
  <text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 250</text>

  <rect x="425" y="360" width="150" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">leaf</text>
  <text x="500" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [500, 750)</text>
  <text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 250</text>

  <rect x="625" y="360" width="150" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="700" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">leaf</text>
  <text x="700" y="402" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range [750, 1000)</text>
  <text x="700" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">estimateSize() = 250</text>

  <rect x="60" y="458" width="680" height="24" rx="3" fill="#e5e7eb"/>
  <text x="400" y="475" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">exact sizes at every node let the fork-join pool pre-size the combined output array before any leaf runs</text>
</svg>
