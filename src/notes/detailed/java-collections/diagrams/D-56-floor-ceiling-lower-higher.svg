<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Number line showing NavigableMap floor, ceiling, lower and higher results for query keys 20 and 25 against key set 10, 20, 30, 40">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- ROW 1: query key = 20 -->
  <rect x="310" y="20" width="180" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Query key = 20</text>

  <line x1="80" y1="250" x2="650" y2="250" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="120" cy="250" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10</text>
  <circle cx="280" cy="250" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">20</text>
  <circle cx="440" cy="250" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="440" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">30</text>
  <circle cx="600" cy="250" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="600" y="255" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">40</text>

  <polygon points="280,134 296,150 280,166 264,150" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <rect x="225" y="100" width="110" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="280" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">query key = 20</text>

  <!-- floor(20) = 20, relation <= -->
  <path d="M 268,158 Q 245,190 272,232" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="178" width="150" height="24" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="215" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">floor(20) &#8804; &#8594; 20</text>

  <!-- ceiling(20) = 20, relation >= -->
  <path d="M 292,158 Q 315,190 288,232" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="310" y="178" width="160" height="24" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="390" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ceiling(20) &#8805; &#8594; 20</text>

  <!-- lower(20) = 10, relation < -->
  <path d="M 266,152 Q 180,120 132,236" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="95" width="150" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="135" y="111" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">lower(20) &lt; &#8594; 10</text>

  <!-- higher(20) = 30, relation > -->
  <path d="M 294,152 Q 385,120 432,236" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="95" width="155" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="507" y="111" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">higher(20) &gt; &#8594; 30</text>

  <!-- ROW 2: query key = 25 (not present in map) -->
  <rect x="310" y="300" width="180" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Query key = 25</text>

  <line x1="80" y1="530" x2="650" y2="530" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="120" cy="530" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="535" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">10</text>
  <circle cx="280" cy="530" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="280" y="535" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">20</text>
  <circle cx="440" cy="530" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="440" y="535" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">30</text>
  <circle cx="600" cy="530" r="20" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">40</text>

  <polygon points="350,414 366,430 350,446 334,430" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <rect x="295" y="380" width="110" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="350" y="398" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">query key = 25</text>
  <text x="350" y="462" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(25 is not a key in the map)</text>

  <!-- floor(25) = 20, relation <= -->
  <path d="M 340,438 Q 300,470 288,512" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="175" y="455" width="150" height="24" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="250" y="471" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">floor(25) &#8804; &#8594; 20</text>

  <!-- lower(25) = 20, relation < (deeper bow, same target as floor) -->
  <path d="M 332,432 Q 230,410 138,516" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="372" width="155" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="137" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">lower(25) &lt; &#8594; 20</text>

  <!-- ceiling(25) = 30, relation >= -->
  <path d="M 360,438 Q 400,470 432,512" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="455" width="160" height="24" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="471" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ceiling(25) &#8805; &#8594; 30</text>

  <!-- higher(25) = 30, relation > (deeper bow, same target as ceiling) -->
  <path d="M 368,432 Q 470,410 562,516" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545" y="372" width="160" height="24" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="625" y="388" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">higher(25) &gt; &#8594; 30</text>
</svg>
