<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList add at index 1: System.arraycopy shifts elements B, C, D one slot right in a single block move, X is written into the freed slot, size becomes 5 and modCount is incremented">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="16" width="300" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="34" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">before: add(1, X)</text>

  <!-- index labels top -->
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <text x="150" y="55" text-anchor="middle">0</text>
    <text x="250" y="55" text-anchor="middle">1</text>
    <text x="350" y="55" text-anchor="middle">2</text>
    <text x="450" y="55" text-anchor="middle">3</text>
    <text x="550" y="55" text-anchor="middle">4</text>
    <text x="650" y="55" text-anchor="middle">5</text>
  </g>

  <!-- top row cells: A B C D _ _ -->
  <rect x="100" y="60" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
  <rect x="200" y="60" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
  <rect x="300" y="60" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>
  <rect x="400" y="60" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">D</text>
  <rect x="500" y="60" width="100" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="550" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">_</text>
  <rect x="600" y="60" width="100" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">_</text>

  <!-- highlight source block B,C,D to be moved -->
  <rect x="200" y="58" width="300" height="54" fill="none" stroke="#525252" stroke-width="3"/>

  <rect x="80" y="118" width="120" height="22" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1"/>
  <text x="140" y="134" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 4</text>

  <!-- arraycopy label + arrow -->
  <rect x="230" y="150" width="440" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">System.arraycopy(elementData, 1, elementData, 2, 3)</text>

  <path d="M 350 112 C 350 200, 450 200, 450 245" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- index labels bottom -->
  <g font-family="sans-serif" font-size="11" fill="#1f2937">
    <text x="150" y="245" text-anchor="middle">0</text>
    <text x="250" y="245" text-anchor="middle">1</text>
    <text x="350" y="245" text-anchor="middle">2</text>
    <text x="450" y="245" text-anchor="middle">3</text>
    <text x="550" y="245" text-anchor="middle">4</text>
    <text x="650" y="245" text-anchor="middle">5</text>
  </g>

  <!-- bottom row cells: A X B C D _ -->
  <rect x="100" y="250" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="150" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
  <rect x="200" y="250" width="100" height="50" fill="#dcfce7" stroke="#525252" stroke-width="3"/>
  <text x="250" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">X</text>
  <rect x="300" y="250" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="350" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
  <rect x="400" y="250" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>
  <rect x="500" y="250" width="100" height="50" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="550" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">D</text>
  <rect x="600" y="250" width="100" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="650" y="280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">_</text>

  <!-- highlight moved block now at 2..4 -->
  <rect x="300" y="248" width="300" height="54" fill="none" stroke="#525252" stroke-width="3"/>

  <rect x="20" y="330" width="300" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="170" y="348" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">after: X inserted at index 1</text>

  <rect x="80" y="366" width="120" height="22" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="1"/>
  <text x="140" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">size = 5</text>

  <rect x="220" y="366" width="180" height="22" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="310" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">modCount incremented</text>

  <rect x="420" y="366" width="330" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="585" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">one arraycopy call moves the whole tail block</text>
</svg>