<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame D: thread B a writer hits a ForwardingNode in putVal and calls helpTransfer to claim the next stride instead of blocking, registering via a sizeCtl CAS, guarded by a MAX_RESIZERS bail-out">
  <rect x="240" y="24" width="320" height="32" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Cooperative resize: ForwardingNode (frame D of 4)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="160" height="36" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="120" y="103" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Thread B: putVal(k,v)</text>

  <rect x="240" y="80" width="220" height="36" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="350" y="103" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hits ForwardingNode at bin i</text>
  <line x1="200" y1="98" x2="236" y2="98" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="140" width="300" height="44" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="390" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">helpTransfer(tab, f)  — putVal, :2363</text>
  <text x="390" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"claim the next stride instead of blocking"</text>
  <line x1="350" y1="116" x2="390" y2="136" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="210" width="300" height="60" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="390" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bail-out test, :2371</text>
  <text x="390" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">sc == rs + MAX_RESIZERS</text>
  <text x="390" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">|| sc == rs+1 || transferIndex &lt;= 0 → break</text>
  <line x1="390" y1="184" x2="390" y2="206" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="300" width="300" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="390" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">CAS registers B as extra resizer</text>
  <text x="390" y="340" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">sizeCtl = sc + 1   (:2373)</text>
  <line x1="390" y1="270" x2="390" y2="296" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="300" width="160" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="660" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">transfer(tab, nextTab)</text>
  <text x="660" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">B migrates a stride</text>
  <line x1="540" y1="330" x2="576" y2="330" stroke="#525252" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="400" width="640" height="40" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="400" y="425" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">MAX_RESIZERS = 65535 (:581) caps how many threads can help concurrently</text>
</svg>
