<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ListIterator cursor across four frames: initial position, after next() returns A, after add(X) shifts the cursor and clears lastReturned, and set(Y) throwing IllegalStateException because lastReturned is null">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrow-em" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="380" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ListIterator cursor sits between elements, not on one</text>

  <!-- ============ FRAME 1 ============ -->
  <g>
    <rect x="20" y="70" width="420" height="290" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
    <rect x="30" y="80" width="400" height="26" rx="4" fill="#e5e7eb"/>
    <text x="230" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 &#8212; initial state, cursor at 0</text>

    <!-- list A B C -->
    <rect x="55" y="180" width="70" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="90" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
    <rect x="175" y="180" width="70" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="210" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
    <rect x="295" y="180" width="70" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="330" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

    <!-- cursor before A (slot0, center x=40) -->
    <line x1="40" y1="160" x2="40" y2="250" stroke="#525252" stroke-width="3"/>
    <path d="M 40 155 L 33 165 L 47 165 z" fill="#525252"/>
    <rect x="15" y="255" width="60" height="20" rx="3" fill="#fef3c7"/>
    <text x="45" y="269" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cursor=0</text>

    <rect x="40" y="285" width="180" height="20" rx="3" fill="#e5e7eb"/>
    <text x="130" y="299" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">nextIndex() = 0</text>
    <rect x="230" y="285" width="190" height="20" rx="3" fill="#e5e7eb"/>
    <text x="325" y="299" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">previousIndex() = -1</text>
    <rect x="40" y="315" width="380" height="20" rx="3" fill="#e5e7eb"/>
    <text x="230" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">lastReturned = none</text>
  </g>

  <!-- ============ FRAME 2 ============ -->
  <g>
    <rect x="460" y="70" width="420" height="290" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
    <rect x="470" y="80" width="400" height="26" rx="4" fill="#e5e7eb"/>
    <text x="670" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2 &#8212; after next() returns A</text>

    <rect x="495" y="180" width="70" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="530" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
    <rect x="615" y="180" width="70" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="650" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
    <rect x="735" y="180" width="70" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="770" y="215" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

    <!-- cursor between A and B (slot1, center x=590) -->
    <line x1="590" y1="160" x2="590" y2="250" stroke="#525252" stroke-width="3"/>
    <path d="M 590 155 L 583 165 L 597 165 z" fill="#525252"/>
    <rect x="565" y="255" width="60" height="20" rx="3" fill="#fef3c7"/>
    <text x="595" y="269" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cursor=1</text>

    <path d="M 530 180 C 530 150 550 145 585 152" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="500" y="130" width="120" height="18" rx="3" fill="#dcfce7"/>
    <text x="560" y="143" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next() returned A</text>

    <rect x="480" y="285" width="180" height="20" rx="3" fill="#e5e7eb"/>
    <text x="570" y="299" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">nextIndex() = 1</text>
    <rect x="670" y="285" width="190" height="20" rx="3" fill="#e5e7eb"/>
    <text x="765" y="299" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">previousIndex() = 0</text>
    <rect x="480" y="315" width="380" height="20" rx="3" fill="#dcfce7"/>
    <text x="670" y="329" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">lastReturned = A  (set()/remove() now legal)</text>
  </g>

  <!-- ============ FRAME 3 ============ -->
  <g>
    <rect x="20" y="380" width="420" height="300" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
    <rect x="30" y="390" width="400" height="26" rx="4" fill="#e5e7eb"/>
    <text x="230" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3 &#8212; after add(X): list is [A,X,B,C]</text>

    <rect x="30" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="60" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
    <rect x="130" y="480" width="60" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">X</text>
    <rect x="230" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="260" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
    <rect x="330" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="360" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

    <!-- cursor between X and B (center x=210) -->
    <line x1="210" y1="460" x2="210" y2="550" stroke="#525252" stroke-width="3"/>
    <path d="M 210 455 L 203 465 L 217 465 z" fill="#525252"/>
    <rect x="180" y="555" width="60" height="20" rx="3" fill="#fef3c7"/>
    <text x="210" y="569" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cursor=2</text>

    <rect x="120" y="440" width="80" height="18" rx="3" fill="#dcfce7"/>
    <text x="160" y="453" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">X inserted here</text>

    <rect x="40" y="585" width="180" height="20" rx="3" fill="#e5e7eb"/>
    <text x="130" y="599" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">nextIndex() = 2</text>
    <rect x="230" y="585" width="190" height="20" rx="3" fill="#e5e7eb"/>
    <text x="325" y="599" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">previousIndex() = 1</text>
    <rect x="40" y="615" width="380" height="20" rx="3" fill="#fef3c7"/>
    <text x="230" y="629" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">lastReturned = null &#8212; cleared by add()</text>
    <rect x="40" y="645" width="380" height="20" rx="3" fill="#e5e7eb"/>
    <text x="230" y="659" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">add() never changes lastReturned into a value; it only ever clears it</text>
  </g>

  <!-- ============ FRAME 4 ============ -->
  <g>
    <rect x="460" y="380" width="420" height="300" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
    <rect x="470" y="390" width="400" height="26" rx="4" fill="#e5e7eb"/>
    <text x="670" y="408" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 4 &#8212; set(Y) throws IllegalStateException</text>

    <rect x="470" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="500" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">A</text>
    <rect x="570" y="480" width="60" height="60" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="600" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">X</text>
    <rect x="670" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="700" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">B</text>
    <rect x="770" y="480" width="60" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="800" y="515" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">C</text>

    <line x1="650" y1="460" x2="650" y2="550" stroke="#525252" stroke-width="3"/>
    <path d="M 650 455 L 643 465 L 657 465 z" fill="#525252"/>
    <rect x="620" y="555" width="60" height="20" rx="3" fill="#fef3c7"/>
    <text x="650" y="569" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">cursor=2</text>

    <path d="M 600 480 C 600 450 620 445 645 450" fill="none" stroke="#525252" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-em)"/>
    <rect x="560" y="425" width="150" height="18" rx="3" fill="#fee2e2"/>
    <text x="635" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">set(Y) rejected here</text>

    <rect x="480" y="585" width="380" height="36" rx="3" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
    <text x="670" y="600" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">IllegalStateException</text>
    <text x="670" y="615" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">set() requires lastReturned != null</text>

    <rect x="480" y="630" width="380" height="36" rx="3" fill="#e5e7eb"/>
    <text x="670" y="645" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">why: add() in Frame 3 cleared lastReturned;</text>
    <text x="670" y="660" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">only next()/previous() sets it again</text>
  </g>
</svg>