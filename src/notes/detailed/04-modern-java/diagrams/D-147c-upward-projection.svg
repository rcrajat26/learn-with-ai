<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 3. The inferred local type of first is Money. The compiler never
     lets the intermediate capture variable CAP hash 1 leak into first's declared type; only
     the projected, denotable Money is written into the LocalVariableTable.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node { font-size: 15px; font-weight: 600; }
    .body { font-size: 13px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .boxR { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxA { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pill { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }
  </style>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">D-147c — FRAME 3 OF 3 — THE INFERRED LOCAL TYPE</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="750" y="20" width="30" height="20" rx="4" class="pill"/>
  <text x="765" y="35" text-anchor="middle" class="lbl tiny" font-weight="700">21</text>

  <rect x="60" y="60" width="780" height="44" rx="6" class="boxA"/>
  <text x="80" y="88" class="lbl body mono">var first = amounts.get(0);   // first : Money</text>

  <rect x="300" y="150" width="300" height="100" rx="6" class="boxR"/>
  <text x="450" y="182" text-anchor="middle" class="lbl node mono">first : Money</text>
  <text x="450" y="204" text-anchor="middle" class="lbl sub">final inferred local type</text>
  <text x="450" y="220" text-anchor="middle" class="lbl sub">written to LocalVariableTable</text>

  <rect x="80" y="290" width="740" height="70" rx="6" class="boxA"/>
  <text x="100" y="312" class="lbl body" font-weight="700">CAP#1 never surfaces</text>
  <text x="100" y="332" class="lbl tiny">the reader never sees CAP#1 — javac's inference pipeline produces it, projects it away, and</text>
  <text x="100" y="348" class="lbl tiny">only the denotable end result, Money, is what first is declared as, both to javac and to javap.</text>

  <line x1="20" y1="374" x2="880" y2="374" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="300" y="382" width="20" height="12" rx="3" class="boxR"/>
  <text x="326" y="392" class="lbl tiny">resolved / final inferred type</text>
  <rect x="520" y="382" width="20" height="12" rx="3" class="boxA"/>
  <text x="546" y="392" class="lbl tiny">annotation panel / source line</text>
</svg>
