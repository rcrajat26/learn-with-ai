<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after comparison of javap -c -p -v output for a lambda versus a method reference over the same Reservation.amount call. Left: r -&gt; r.amount() compiles to a synthetic private static method lambda$main$0 plus an invokedynamic bootstrap whose method handle is REF_invokeStatic to that synthetic method. Right: Reservation::amount compiles to the same invokedynamic shape but with no synthetic method at all — its bootstrap method handle argument is REF_invokeVirtual directly to Reservation.amount, a direct method handle with no compiler-generated indirection.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2   { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node { font-size: 14px; font-weight: 600; }
    .body { font-size: 12.5px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .panel{ fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">A METHOD REFERENCE HAS NO lambda$ METHOD</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="58" class="lbl sub mono">javac --release 21 R.java ; javap -c -p -v R.class — both columns from one real compile, same call site shape</text>

  <!-- LEFT -->
  <text x="30" y="82" class="lbl h2">LEFT — r -&gt; r.amount()</text>
  <line x1="20" y1="90" x2="548" y2="90" stroke="#d1d5db" stroke-width="1"/>

  <rect x="30" y="102" width="500" height="34" rx="4" class="boxP"/>
  <text x="280" y="124" text-anchor="middle" class="lbl body mono">Function&lt;Reservation,BigDecimal&gt; f1 = r -&gt; r.amount();</text>

  <path class="flow" d="M 280 136 V 156"/>

  <rect x="30" y="160" width="500" height="76" rx="6" class="boxD"/>
  <text x="46" y="180" class="lbl tiny" font-weight="700">SYNTHETIC METHOD EMITTED</text>
  <text x="46" y="198" class="lbl mono">private static java.math.BigDecimal</text>
  <text x="46" y="214" class="lbl mono">  lambda$main$0(Reservation);</text>
  <text x="46" y="230" class="lbl sub">0: aload_0  1: invokevirtual Reservation.amount  4: areturn</text>

  <path class="flow" d="M 280 236 V 256"/>

  <rect x="30" y="260" width="500" height="150" rx="6" class="panel"/>
  <text x="46" y="280" class="lbl tiny" font-weight="700">BootstrapMethods (constant pool, from -v)</text>
  <text x="46" y="300" class="lbl mono">0: #63 REF_invokeStatic</text>
  <text x="46" y="316" class="lbl mono">   LambdaMetafactory.metafactory:(...)</text>
  <text x="46" y="332" class="lbl mono">   Method arguments:</text>
  <text x="60" y="348" class="lbl mono">#57 (Ljava/lang/Object;)Ljava/lang/Object;</text>
  <text x="60" y="364" class="lbl mono" font-weight="700">#58 REF_invokeStatic</text>
  <text x="72" y="380" class="lbl mono" font-weight="700">R.lambda$main$0:(LReservation;)LBigDecimal;</text>
  <text x="60" y="396" class="lbl mono">#61 (LReservation;)LBigDecimal;</text>

  <rect x="30" y="420" width="500" height="30" rx="4" class="boxD"/>
  <text x="280" y="440" text-anchor="middle" class="lbl tiny" font-weight="700">indirection: call → synthetic method → Reservation.amount()</text>

  <!-- divider -->
  <line x1="560" y1="70" x2="560" y2="756" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- RIGHT -->
  <text x="574" y="82" class="lbl h2">RIGHT — Reservation::amount</text>
  <line x1="562" y1="90" x2="1100" y2="90" stroke="#d1d5db" stroke-width="1"/>

  <rect x="574" y="102" width="516" height="34" rx="4" class="boxP"/>
  <text x="832" y="124" text-anchor="middle" class="lbl body mono">Function&lt;Reservation,BigDecimal&gt; f2 = Reservation::amount;</text>

  <path class="flow" d="M 832 136 V 156"/>

  <rect x="574" y="160" width="516" height="76" rx="6" class="boxR"/>
  <text x="590" y="180" class="lbl tiny" font-weight="700">NO SYNTHETIC METHOD EMITTED</text>
  <text x="590" y="200" class="lbl mono">javap -p lists no lambda$main$1 method</text>
  <text x="590" y="220" class="lbl sub">the class R has exactly one synthetic-free method: main</text>

  <path class="flow" d="M 832 236 V 256"/>

  <rect x="574" y="260" width="516" height="150" rx="6" class="panel"/>
  <text x="590" y="280" class="lbl tiny" font-weight="700">BootstrapMethods (constant pool, from -v)</text>
  <text x="590" y="300" class="lbl mono">1: #63 REF_invokeStatic</text>
  <text x="590" y="316" class="lbl mono">   LambdaMetafactory.metafactory:(...)</text>
  <text x="590" y="332" class="lbl mono">   Method arguments:</text>
  <text x="604" y="348" class="lbl mono">#57 (Ljava/lang/Object;)Ljava/lang/Object;</text>
  <text x="604" y="364" class="lbl mono" font-weight="700">#62 REF_invokeVirtual</text>
  <text x="616" y="380" class="lbl mono" font-weight="700">Reservation.amount:()LBigDecimal;</text>
  <text x="604" y="396" class="lbl mono">#61 (LReservation;)LBigDecimal;</text>

  <rect x="574" y="420" width="516" height="30" rx="4" class="boxR"/>
  <text x="832" y="440" text-anchor="middle" class="lbl tiny" font-weight="700">direct: call → Reservation.amount() — no compiler-written hop</text>

  <!-- annotation -->
  <rect x="30" y="470" width="1060" height="110" rx="6" class="boxA"/>
  <text x="46" y="492" class="lbl tiny" font-weight="700">WHAT "implementation" MEANS IN THE BOOTSTRAP</text>
  <text x="46" y="512" class="lbl tiny">Both call sites use the identical LambdaMetafactory.metafactory bootstrap and the identical erased SAM shape</text>
  <text x="46" y="530" class="lbl tiny">(Ljava/lang/Object;)Ljava/lang/Object;. The only difference is bootstrap argument #58 vs #62 — the "implementation"</text>
  <text x="46" y="548" class="lbl tiny">method handle. The lambda body forces javac to write and reference its own synthetic private method (#58,</text>
  <text x="46" y="566" class="lbl tiny">REF_invokeStatic R.lambda$main$0); the method reference hands the metafactory a direct handle to Reservation.amount</text>

  <!-- legend -->
  <line x1="20" y1="600" x2="1100" y2="600" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="612" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="624" class="lbl tiny">source expression</text>
  <rect x="220" y="612" width="20" height="14" rx="3" class="boxD"/>
  <text x="246" y="624" class="lbl tiny">synthetic method present (differing line)</text>
  <rect x="520" y="612" width="20" height="14" rx="3" class="boxR"/>
  <text x="546" y="624" class="lbl tiny">no synthetic method (differing line)</text>
  <rect x="800" y="612" width="20" height="14" rx="3" class="panel"/>
  <text x="826" y="624" class="lbl tiny">javap -v constant-pool listing</text>
  <path class="flow" d="M 20 646 H 60"/>
  <text x="68" y="651" class="lbl tiny">A → B : B is the compiled/linked artifact of A</text>
  <rect x="20" y="662" width="20" height="14" rx="3" class="boxA"/>
  <text x="46" y="674" class="lbl tiny">annotation panel</text>
</svg>
