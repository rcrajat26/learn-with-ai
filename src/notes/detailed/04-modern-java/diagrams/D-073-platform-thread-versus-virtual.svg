<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Platform thread versus virtual thread memory layout, sized against QuizStakes'
     55,000 peak concurrent sessions. Left: a platform thread is a java.lang.Thread object on the
     heap paired one-to-one with an OS thread, which reserves a 1 megabyte stack outside the heap;
     55,000 of them would reserve about 53.7 gibibytes of stack memory before any heap use. Right: a
     virtual thread is a VirtualThread object of a few hundred bytes on the heap, holding a
     growable StackChunk also on the heap that starts small and grows on demand; it is mounted, not
     bound, onto a carrier thread which is itself an ordinary platform thread drawn from a
     ForkJoinPool scheduler; 55,000 virtual threads cost tens of megabytes of heap total and can be
     mounted onto a carrier pool far smaller than 55,000.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxY  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxF  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .heap  { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; stroke-dasharray: 6 4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3;
             stroke-linejoin: round; marker-end: url(#triO); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">PLATFORM THREAD VERSUS VIRTUAL THREAD — SIZED AT 55K PEAK SESSIONS</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="66" class="lbl h2">LEFT — PLATFORM THREAD (one Thread : one OS thread)</text>
  <text x="580" y="66" class="lbl h2">RIGHT — VIRTUAL THREAD (JAVA 21)</text>

  <!-- LEFT: heap region -->
  <rect x="20" y="80" width="230" height="560" rx="6" class="heap"/>
  <text x="35" y="98" class="lbl tiny" fill="#4b5563">JVM HEAP</text>
  <rect x="45" y="112" width="180" height="80" rx="6" class="boxP"/>
  <text x="135" y="136" text-anchor="middle" class="lbl node">Thread</text>
  <text x="135" y="156" text-anchor="middle" class="lbl body">java.lang.Thread</text>
  <text x="135" y="174" text-anchor="middle" class="lbl sub">object, small, fixed</text>

  <path class="flow" d="M 135 192 V 230"/>
  <text x="200" y="216" text-anchor="middle" class="lbl sub">1:1</text>

  <!-- Outside heap, OS thread + stack -->
  <rect x="290" y="80" width="230" height="560" rx="6" class="boxF"/>
  <text x="305" y="98" class="lbl tiny" fill="#4b5563">OUTSIDE THE HEAP — OS / KERNEL</text>
  <rect x="315" y="230" width="180" height="110" rx="6" class="boxY"/>
  <text x="405" y="256" text-anchor="middle" class="lbl node">OS thread</text>
  <text x="405" y="278" text-anchor="middle" class="lbl body">kernel thread control block</text>
  <text x="405" y="298" text-anchor="middle" class="lbl sub">scheduled by the OS scheduler</text>
  <text x="405" y="316" text-anchor="middle" class="lbl sub">context switch paid on every block</text>
  <text x="405" y="332" text-anchor="middle" class="lbl sub">on I/O, lock, or Thread.sleep</text>

  <path class="flow" d="M 405 340 V 370"/>
  <rect x="315" y="370" width="180" height="240" rx="6" class="boxD"/>
  <text x="405" y="396" text-anchor="middle" class="lbl node">reserved stack</text>
  <text x="405" y="418" text-anchor="middle" class="lbl body" font-weight="700">1 MB, fixed, reserved</text>
  <text x="405" y="438" text-anchor="middle" class="lbl sub">-Xss default; committed lazily</text>
  <text x="405" y="454" text-anchor="middle" class="lbl sub">but 1 MB of address space is</text>
  <text x="405" y="470" text-anchor="middle" class="lbl sub">reserved up front, per thread</text>
  <text x="405" y="494" text-anchor="middle" class="lbl sub">overflow here throws</text>
  <text x="405" y="510" text-anchor="middle" class="lbl sub">StackOverflowError — fixed</text>
  <text x="405" y="526" text-anchor="middle" class="lbl sub">size, cannot regrow</text>
  <text x="405" y="590" text-anchor="middle" class="lbl body" font-weight="700">55,000 x 1 MB = ~53.7 GiB</text>

  <!-- RIGHT: heap region -->
  <rect x="580" y="80" width="240" height="560" rx="6" class="heap"/>
  <text x="595" y="98" class="lbl tiny" fill="#4b5563">JVM HEAP</text>
  <rect x="605" y="112" width="190" height="82" rx="6" class="boxY"/>
  <text x="700" y="134" text-anchor="middle" class="lbl node">VirtualThread</text>
  <text x="700" y="154" text-anchor="middle" class="lbl body" font-weight="700">a few hundred bytes</text>
  <text x="700" y="172" text-anchor="middle" class="lbl sub">java.lang.VirtualThread object</text>

  <path class="flow" d="M 700 194 V 224"/>
  <rect x="605" y="224" width="190" height="130" rx="6" class="boxY"/>
  <text x="700" y="248" text-anchor="middle" class="lbl node">StackChunk</text>
  <text x="700" y="270" text-anchor="middle" class="lbl body">growable, heap-allocated</text>
  <text x="700" y="288" text-anchor="middle" class="lbl sub">starts small (few hundred bytes)</text>
  <text x="700" y="304" text-anchor="middle" class="lbl sub">grows/shrinks with call depth</text>
  <text x="700" y="320" text-anchor="middle" class="lbl sub">chained across yields; never a</text>
  <text x="700" y="336" text-anchor="middle" class="lbl sub">fixed 1 MB reservation</text>

  <text x="700" y="590" text-anchor="middle" class="lbl body" font-weight="700">55,000 x few-hundred-B = tens of MB</text>

  <!-- carrier pool panel, drawn before the mount arrow/label so they sit on top -->
  <rect x="830" y="80" width="250" height="560" rx="6" class="boxF"/>
  <text x="845" y="98" class="lbl tiny" fill="#4b5563">OUTSIDE THE HEAP — CARRIER POOL</text>

  <path class="adapt" d="M 795 288 H 812 V 460 H 850"/>
  <text x="800" y="270" class="lbl tiny" fill="#b45309">mounted on</text>

  <rect x="860" y="460" width="200" height="120" rx="6" class="boxP"/>
  <text x="960" y="484" text-anchor="middle" class="lbl node">carrier thread</text>
  <text x="960" y="504" text-anchor="middle" class="lbl body">an ordinary platform thread</text>
  <text x="960" y="522" text-anchor="middle" class="lbl sub">1 MB reserved stack, same</text>
  <text x="960" y="538" text-anchor="middle" class="lbl sub">as left; drawn from the FJP</text>
  <text x="960" y="554" text-anchor="middle" class="lbl sub">scheduler below</text>

  <path class="flow" d="M 960 460 V 424"/>
  <rect x="855" y="270" width="210" height="154" rx="6" class="boxA"/>
  <text x="960" y="292" text-anchor="middle" class="lbl body" font-weight="700">ForkJoinPool scheduler</text>
  <text x="960" y="310" text-anchor="middle" class="lbl sub">asyncMode = true  // FIFO</text>
  <text x="960" y="326" text-anchor="middle" class="lbl sub">parallelism =</text>
  <text x="960" y="340" text-anchor="middle" class="lbl sub">availableProcessors()</text>
  <text x="960" y="356" text-anchor="middle" class="lbl sub">maxPoolSize =</text>
  <text x="960" y="370" text-anchor="middle" class="lbl sub">max(parallelism, 256)</text>
  <text x="960" y="386" text-anchor="middle" class="lbl sub">minRunnable = max(parallelism/2, 1)</text>
  <text x="960" y="410" text-anchor="middle" class="lbl body" font-weight="700">carrier pool width — not 55,000</text>

  <!-- annotation panel: cost each way -->
  <rect x="20" y="656" width="1080" height="80" rx="6" class="boxA"/>
  <text x="36" y="678" class="lbl body" font-weight="700">Cost of 55,000 peak concurrent sessions, each way</text>
  <text x="36" y="698" class="lbl sub">Platform: 55,000 threads x 1 MB reserved stack = ~53.7 GiB reserved before any heap use — infeasible on one JVM.</text>
  <text x="36" y="716" class="lbl sub">Virtual: 55,000 VirtualThread + StackChunk pairs at a few hundred bytes each = tens of MB of heap, mounted onto</text>
  <text x="36" y="730" class="lbl sub">a carrier pool sized by parallelism (floor 256), not by session count.</text>

  <!-- legend -->
  <line x1="20" y1="754" x2="1100" y2="754" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="766" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="779" class="lbl tiny">heap-resident thread object / carrier</text>
  <rect x="290" y="766" width="22" height="16" rx="3" class="boxY"/>
  <text x="320" y="779" class="lbl tiny">virtual-thread parts / OS thread, new in Java 21</text>
  <rect x="720" y="766" width="22" height="16" rx="3" class="boxD"/>
  <text x="750" y="779" class="lbl tiny">fixed 1 MB reserved stack, outside heap</text>
  <rect x="20" y="796" width="22" height="16" rx="3" class="boxA"/>
  <text x="50" y="809" class="lbl tiny">annotation / scheduler-config panel</text>
  <path class="flow" d="M 320 796 H 360"/>
  <text x="370" y="809" class="lbl tiny">structural ownership</text>
  <path class="adapt" d="M 600 796 H 640"/>
  <text x="650" y="809" class="lbl tiny">mounts onto (not inheritance)</text>
</svg>
