<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Lane 1: Runnable r = ledger colon colon flush evaluates ledger now and stores a reference to FundsLedger A in r; ledger = otherLedger later reassigns only the variable to FundsLedger B; r.run() still calls flush on the original FundsLedger A, because r keeps its captured reference. Lane 2: ledger is set to null before any reference is created, so Runnable r = ledger colon colon flush throws a NullPointerException immediately at evaluation time, r is never created, and r.run() is never reached.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: .3px; }

    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .fail  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triRed); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">A BOUND METHOD REFERENCE EVALUATES ITS RECEIVER AT CAPTURE TIME</text>
  <line x1="20" y1="42" x2="980" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LANE 1 -->
  <text x="20" y="66" class="lbl h2">LANE 1 — NORMAL CASE</text>
  <line class="flow" x1="60" y1="90" x2="920" y2="90"/>
  <text x="930" y="94" class="lbl tiny">time</text>

  <line x1="160" y1="84" x2="160" y2="96" stroke="#475569" stroke-width="2"/>
  <text x="160" y="78" text-anchor="middle" class="lbl tiny">t1</text>
  <line x1="500" y1="84" x2="500" y2="96" stroke="#475569" stroke-width="2"/>
  <text x="500" y="78" text-anchor="middle" class="lbl tiny">t2</text>
  <line x1="840" y1="84" x2="840" y2="96" stroke="#475569" stroke-width="2"/>
  <text x="840" y="78" text-anchor="middle" class="lbl tiny">t3</text>

  <rect x="70" y="110" width="180" height="90" rx="6" class="boxH"/>
  <text x="160" y="132" text-anchor="middle" class="lbl body" font-weight="700">Runnable r = ledger::flush</text>
  <text x="160" y="152" text-anchor="middle" class="lbl sub">ledger → FundsLedger#A</text>
  <text x="160" y="168" text-anchor="middle" class="lbl sub">evaluated NOW,</text>
  <text x="160" y="182" text-anchor="middle" class="lbl sub">reference stored in r</text>

  <rect x="410" y="110" width="180" height="90" rx="6" class="boxP"/>
  <text x="500" y="132" text-anchor="middle" class="lbl body" font-weight="700">ledger = otherLedger</text>
  <text x="500" y="152" text-anchor="middle" class="lbl sub">variable ledger →</text>
  <text x="500" y="168" text-anchor="middle" class="lbl sub">FundsLedger#B</text>
  <text x="500" y="184" text-anchor="middle" class="lbl sub">r's stored value unchanged</text>

  <rect x="750" y="110" width="180" height="90" rx="6" class="boxR"/>
  <text x="840" y="132" text-anchor="middle" class="lbl body" font-weight="700">r.run()</text>
  <text x="840" y="152" text-anchor="middle" class="lbl sub">invokes flush() on</text>
  <text x="840" y="168" text-anchor="middle" class="lbl sub">FundsLedger#A —</text>
  <text x="840" y="184" text-anchor="middle" class="lbl sub">the original object, not B</text>

  <path class="flow" d="M 160 200 V 240 H 840 V 200"/>
  <text x="500" y="256" text-anchor="middle" class="lbl tiny">r keeps its captured reference to FundsLedger#A</text>

  <!-- LANE DIVIDER -->
  <line x1="20" y1="284" x2="980" y2="284" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LANE 2 -->
  <text x="20" y="308" class="lbl h2">LANE 2 — NPE AT CAPTURE TIME</text>
  <line class="flow" x1="60" y1="332" x2="920" y2="332"/>
  <text x="930" y="336" class="lbl tiny">time</text>

  <line x1="160" y1="326" x2="160" y2="338" stroke="#475569" stroke-width="2"/>
  <text x="160" y="320" text-anchor="middle" class="lbl tiny">t1</text>
  <line x1="500" y1="326" x2="500" y2="338" stroke="#475569" stroke-width="2"/>
  <text x="500" y="320" text-anchor="middle" class="lbl tiny">t2</text>
  <line x1="840" y1="326" x2="840" y2="338" stroke="#475569" stroke-width="2"/>
  <text x="840" y="320" text-anchor="middle" class="lbl tiny">t3</text>

  <rect x="70" y="352" width="180" height="90" rx="6" class="boxW"/>
  <text x="160" y="374" text-anchor="middle" class="lbl body" font-weight="700">ledger = null</text>
  <text x="160" y="394" text-anchor="middle" class="lbl sub">variable ledger set to null</text>
  <text x="160" y="410" text-anchor="middle" class="lbl sub">before any reference</text>
  <text x="160" y="426" text-anchor="middle" class="lbl sub">is created</text>

  <rect x="410" y="352" width="180" height="90" rx="6" class="boxD"/>
  <text x="500" y="374" text-anchor="middle" class="lbl body" font-weight="700">Runnable r = ledger::flush</text>
  <text x="500" y="394" text-anchor="middle" class="lbl sub" fill="#b91c1c" font-weight="700">NullPointerException</text>
  <text x="500" y="410" text-anchor="middle" class="lbl sub">thrown at evaluation —</text>
  <text x="500" y="426" text-anchor="middle" class="lbl sub">r is never created</text>

  <rect x="750" y="352" width="180" height="90" rx="6" class="boxW"/>
  <text x="840" y="374" text-anchor="middle" class="lbl body" font-weight="700">r.run()</text>
  <text x="840" y="394" text-anchor="middle" class="lbl sub">never reached</text>
  <text x="840" y="410" text-anchor="middle" class="lbl sub">no Runnable existed</text>
  <text x="840" y="426" text-anchor="middle" class="lbl sub">to invoke</text>

  <path class="fail" d="M 160 442 V 470 H 500 V 442"/>
  <text x="330" y="486" text-anchor="middle" class="lbl tiny">null.flush at evaluation → NPE, nothing ever invoked</text>

  <!-- LEGEND -->
  <line x1="20" y1="520" x2="980" y2="520" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="534" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="547" class="lbl tiny">the reference-capturing statement</text>
  <rect x="270" y="534" width="22" height="16" rx="3" class="boxP"/>
  <text x="300" y="547" class="lbl tiny">ordinary variable reassignment</text>
  <rect x="520" y="534" width="22" height="16" rx="3" class="boxR"/>
  <text x="550" y="547" class="lbl tiny">correct resolved behaviour</text>
  <rect x="770" y="534" width="22" height="16" rx="3" class="boxW"/>
  <text x="800" y="547" class="lbl tiny">precondition / never-reached step</text>

  <rect x="20" y="562" width="22" height="16" rx="3" class="boxD"/>
  <text x="50" y="575" class="lbl tiny">thrown exception</text>
  <path class="flow" d="M 270 570 H 310"/>
  <text x="318" y="575" class="lbl tiny">A → B : captured reference still points at A</text>
  <path class="fail" d="M 660 570 H 700"/>
  <text x="708" y="575" class="lbl tiny">A → B : leads to a thrown exception</text>
</svg>
