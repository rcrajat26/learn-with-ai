<svg viewBox="0 0 1120 670" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Left: Reservation::amount as an unbound method reference typed Function of Reservation to Money — the stream element flowing in becomes the receiver on which amount() is invoked. Middle: the equivalent lambda r -> r.amount() with the same arrow from stream element to receiver. Right: Money::compareTo as a two-argument Comparator-shaped function — the first argument is the receiver, the second argument is the ordinary method parameter.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: .3px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triAmber); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="670" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">UNBOUND RECEIVER BECOMES THE FIRST PARAMETER</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- PANEL 1: method reference -->
  <text x="40" y="66" class="lbl h2">UNBOUND METHOD REFERENCE</text>
  <rect x="40" y="82" width="300" height="50" rx="6" class="boxH"/>
  <text x="190" y="112" text-anchor="middle" class="lbl node">Reservation::amount</text>

  <rect x="40" y="152" width="300" height="40" rx="6" class="panel"/>
  <text x="190" y="177" text-anchor="middle" class="lbl body">Function&lt;Reservation, Money&gt;</text>

  <rect x="40" y="230" width="130" height="56" rx="6" class="boxP"/>
  <text x="105" y="253" text-anchor="middle" class="lbl body">stream element</text>
  <text x="105" y="270" text-anchor="middle" class="lbl sub">RES-1 (4.20)</text>

  <path class="flow" d="M 170 258 H 210"/>

  <rect x="210" y="230" width="130" height="56" rx="6" class="boxR"/>
  <text x="275" y="253" text-anchor="middle" class="lbl body">receiver</text>
  <text x="275" y="270" text-anchor="middle" class="lbl sub">.amount()</text>

  <path class="flow" d="M 190 132 V 152"/>
  <path class="flow" d="M 190 192 V 230"/>

  <rect x="40" y="316" width="300" height="56" rx="6" class="boxR"/>
  <text x="190" y="339" text-anchor="middle" class="lbl body">Money</text>
  <text x="190" y="356" text-anchor="middle" class="lbl sub">RES-1.amount() → 4.20</text>
  <path class="flow" d="M 190 286 V 316"/>

  <!-- vertical divider 1 -->
  <line x1="380" y1="56" x2="380" y2="580" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- PANEL 2: lambda equivalent -->
  <text x="400" y="66" class="lbl h2">EQUIVALENT LAMBDA</text>
  <rect x="400" y="82" width="300" height="50" rx="6" class="boxH"/>
  <text x="550" y="112" text-anchor="middle" class="lbl node">r -&gt; r.amount()</text>

  <rect x="400" y="152" width="300" height="40" rx="6" class="panel"/>
  <text x="550" y="177" text-anchor="middle" class="lbl body">Function&lt;Reservation, Money&gt;</text>

  <rect x="400" y="230" width="130" height="56" rx="6" class="boxP"/>
  <text x="465" y="253" text-anchor="middle" class="lbl body">stream element</text>
  <text x="465" y="270" text-anchor="middle" class="lbl sub">RES-1 (4.20)</text>

  <path class="flow" d="M 530 258 H 570"/>

  <rect x="570" y="230" width="130" height="56" rx="6" class="boxR"/>
  <text x="635" y="253" text-anchor="middle" class="lbl body">receiver r</text>
  <text x="635" y="270" text-anchor="middle" class="lbl sub">r.amount()</text>

  <path class="flow" d="M 550 132 V 152"/>
  <path class="flow" d="M 550 192 V 230"/>

  <rect x="400" y="316" width="300" height="56" rx="6" class="boxR"/>
  <text x="550" y="339" text-anchor="middle" class="lbl body">Money</text>
  <text x="550" y="356" text-anchor="middle" class="lbl sub">r.amount() → 4.20</text>
  <path class="flow" d="M 550 286 V 316"/>

  <rect x="400" y="400" width="300" height="56" rx="6" class="panel"/>
  <text x="415" y="422" class="lbl sub" font-weight="700">same bytecode shape</text>
  <text x="415" y="440" class="lbl sub">both compile to an invokevirtual</text>
  <text x="415" y="452" class="lbl sub">on the incoming element.</text>

  <!-- vertical divider 2 -->
  <line x1="740" y1="56" x2="740" y2="580" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- PANEL 3: comparator-shaped two-arg -->
  <text x="760" y="66" class="lbl h2">TWO-ARGUMENT FORM — Comparator</text>
  <rect x="760" y="82" width="320" height="50" rx="6" class="boxH"/>
  <text x="920" y="112" text-anchor="middle" class="lbl node">Money::compareTo</text>

  <rect x="760" y="152" width="320" height="52" rx="6" class="panel"/>
  <text x="920" y="172" text-anchor="middle" class="lbl body">Comparator&lt;Money&gt;</text>
  <text x="920" y="192" text-anchor="middle" class="lbl sub">≅ BiFunction&lt;Money, Money, int&gt;</text>

  <rect x="770" y="242" width="140" height="56" rx="6" class="boxP"/>
  <text x="840" y="264" text-anchor="middle" class="lbl body">1st arg</text>
  <text x="840" y="282" text-anchor="middle" class="lbl sub">receiver — 4.20</text>

  <rect x="950" y="242" width="140" height="56" rx="6" class="boxP"/>
  <text x="1020" y="264" text-anchor="middle" class="lbl body">2nd arg</text>
  <text x="1020" y="282" text-anchor="middle" class="lbl sub">parameter — 3.30</text>

  <path class="flow" d="M 920 132 V 152"/>
  <path class="flow" d="M 850 204 V 222 H 840 V 242"/>
  <path class="flow" d="M 990 204 V 222 H 1020 V 242"/>

  <path class="adapt" d="M 840 298 V 316 H 1020 V 298"/>
  <text x="930" y="332" text-anchor="middle" class="lbl sub">4.20.compareTo(3.30)</text>

  <rect x="770" y="356" width="320" height="56" rx="6" class="boxR"/>
  <text x="930" y="379" text-anchor="middle" class="lbl body">int result</text>
  <text x="930" y="396" text-anchor="middle" class="lbl sub">4.20.compareTo(3.30) → 1</text>
  <path class="flow" d="M 930 316 V 356"/>

  <!-- LEGEND -->
  <line x1="20" y1="590" x2="1100" y2="590" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="602" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="615" class="lbl tiny">the method reference / lambda under discussion</text>
  <rect x="330" y="602" width="22" height="16" rx="3" class="boxP"/>
  <text x="360" y="615" class="lbl tiny">functional-interface shape / incoming argument</text>
  <rect x="640" y="602" width="22" height="16" rx="3" class="boxR"/>
  <text x="670" y="615" class="lbl tiny">receiver / resolved result</text>
  <rect x="880" y="602" width="22" height="16" rx="3" class="panel"/>
  <text x="910" y="615" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 20 630 H 60"/>
  <text x="68" y="635" class="lbl tiny">A → B : value flows / receiver bound</text>
  <path class="adapt" d="M 400 630 H 440"/>
  <text x="448" y="635" class="lbl tiny">A → B : invoked as receiver.method(arg)</text>
</svg>
