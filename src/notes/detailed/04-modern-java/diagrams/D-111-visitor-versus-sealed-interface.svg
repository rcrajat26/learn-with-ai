<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Visitor versus sealed interface plus pattern switch for Verdict. Left: a
     VerdictVisitor interface with four visit methods, four case classes each with an accept
     method that double-dispatches into the visitor, and a new AuditLineVisitor implementation
     costing about ten lines fixed plus fourteen lines per operation, twenty four lines and six
     files touched for one new operation. Right: Verdict as a sealed interface with a permits
     clause and one exhaustive pattern switch method toAuditLine costing about eight lines in one
     file, no default branch needed. A table underneath compares both designs on two axes: adding
     a case touches every visitor class on the left and every switch site on the right, in both
     cases compiler-flagged; adding an operation costs one new file in both designs.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 15px; font-weight: 600; }
    .title { font-size: 13px; font-weight: 600; }
    .body  { font-size: 11px; font-family: "SFMono-Regular", Consolas, monospace; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .impl  { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4;
             marker-end: url(#triG); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3;
             marker-end: url(#triO); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">VISITOR VERSUS SEALED INTERFACE + PATTERN SWITCH</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="62" class="lbl h2">VISITOR — DOUBLE DISPATCH</text>
  <line x1="20" y1="68" x2="560" y2="68" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="580" y="62" class="lbl h2">SEALED INTERFACE + PATTERN SWITCH</text>
  <line x1="580" y1="68" x2="1100" y2="68" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===== LEFT: Visitor ===== -->
  <rect x="60" y="80" width="440" height="110" rx="6" class="boxP"/>
  <text x="280" y="100" text-anchor="middle" class="lbl node">VerdictVisitor&lt;R&gt;</text>
  <text x="76" y="120" class="lbl body">R visitDocumentVerdict(DocumentVerdict v);</text>
  <text x="76" y="136" class="lbl body">R visitScreeningVerdict(ScreeningVerdict v);</text>
  <text x="76" y="152" class="lbl body">R visitReviewVerdict(ReviewVerdict v);</text>
  <text x="76" y="168" class="lbl body">R visitWealthVerdict(WealthVerdict v);</text>

  <rect x="60" y="230" width="110" height="40" rx="5" class="boxR"/>
  <text x="115" y="254" text-anchor="middle" class="lbl tiny">DocumentVerdict</text>
  <rect x="194" y="230" width="110" height="40" rx="5" class="boxR"/>
  <text x="249" y="254" text-anchor="middle" class="lbl tiny">ScreeningVerdict</text>
  <rect x="328" y="230" width="110" height="40" rx="5" class="boxR"/>
  <text x="383" y="254" text-anchor="middle" class="lbl tiny">ReviewVerdict</text>
  <rect x="462" y="230" width="110" height="40" rx="5" class="boxR"/>
  <text x="517" y="254" text-anchor="middle" class="lbl tiny">WealthVerdict</text>

  <path d="M 115 270 V 280 M 249 270 V 280 M 383 270 V 280 M 517 270 V 280" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M 115 280 H 517" fill="none" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 300 280 V 290"/>

  <rect x="60" y="290" width="500" height="150" rx="6" class="boxW"/>
  <text x="76" y="312" class="lbl title">accept(VerdictVisitor&lt;R&gt; v) implementations</text>
  <line x1="76" y1="320" x2="544" y2="320" stroke="#9ca3af" stroke-width="1"/>
  <text x="76" y="340" class="lbl body">DocumentVerdict  →  return v.visitDocumentVerdict(this);</text>
  <text x="76" y="360" class="lbl body">ScreeningVerdict →  return v.visitScreeningVerdict(this);</text>
  <text x="76" y="380" class="lbl body">ReviewVerdict    →  return v.visitReviewVerdict(this);</text>
  <text x="76" y="400" class="lbl body">WealthVerdict    →  return v.visitWealthVerdict(this);</text>

  <path class="adapt" d="M 60 340 H 45 V 118 H 60"/>
  <text x="38" y="255" text-anchor="middle" class="lbl tiny" transform="rotate(-90 38 255)">double dispatch (×4, same shape)</text>

  <rect x="60" y="450" width="500" height="70" rx="6" class="boxH"/>
  <text x="76" y="472" class="lbl title">AuditLineVisitor implements VerdictVisitor&lt;String&gt;</text>
  <text x="76" y="490" class="lbl sub">implements all 4 visit methods — ≈ 14 lines, 1 new file</text>
  <text x="76" y="506" class="lbl sub">no existing file is touched to add this operation</text>

  <path class="impl" d="M 560 485 H 575 V 140 H 500"/>
  <text x="585" y="300" class="lbl tiny" transform="rotate(-90 585 300)">implements</text>

  <rect x="60" y="530" width="500" height="70" rx="6" class="boxA"/>
  <text x="76" y="550" class="lbl title">Cost of ONE new operation</text>
  <text x="76" y="568" class="lbl sub">≈ 10 lines fixed (interface + 4 accept hooks, written once)</text>
  <text x="76" y="584" class="lbl sub">+ ≈ 14 lines for AuditLineVisitor ⇒ ≈ 24 lines, 6 files touched</text>

  <!-- ===== RIGHT: sealed + switch ===== -->
  <rect x="620" y="80" width="440" height="90" rx="6" class="boxP"/>
  <text x="840" y="100" text-anchor="middle" class="lbl node">Verdict</text>
  <text x="840" y="118" text-anchor="middle" class="lbl sub">sealed interface</text>
  <text x="840" y="136" text-anchor="middle" class="lbl body">permits DocumentVerdict, ScreeningVerdict,</text>
  <text x="840" y="152" text-anchor="middle" class="lbl body">ReviewVerdict, WealthVerdict</text>

  <path class="flow" d="M 840 170 V 210"/>

  <rect x="620" y="210" width="440" height="170" rx="6" class="boxH"/>
  <text x="840" y="230" text-anchor="middle" class="lbl title">toAuditLine(Verdict v)</text>
  <text x="636" y="250" class="lbl body">static String toAuditLine(Verdict v) {</text>
  <text x="636" y="266" class="lbl body">    return switch (v) {</text>
  <text x="636" y="282" class="lbl body">        case DocumentVerdict d -&gt; "DOC:" + d.outcome();</text>
  <text x="636" y="298" class="lbl body">        case ScreeningVerdict s -&gt; "SCR:" + s.outcome();</text>
  <text x="636" y="314" class="lbl body">        case ReviewVerdict r -&gt; "REV:" + r.outcome();</text>
  <text x="636" y="330" class="lbl body">        case WealthVerdict w -&gt; "WLT:" + w.outcome();</text>
  <text x="636" y="346" class="lbl body">    };</text>
  <text x="636" y="362" class="lbl body">}</text>

  <rect x="620" y="400" width="440" height="200" rx="6" class="boxA"/>
  <text x="636" y="420" class="lbl title">Cost of ONE new operation</text>
  <text x="636" y="438" class="lbl sub">≈ 8 lines, 1 file, 1 method.</text>
  <text x="636" y="456" class="lbl sub">Exhaustive over Verdict's permits clause — no default</text>
  <text x="636" y="472" class="lbl sub">branch, and the compiler errors if a case is ever missing</text>
  <text x="636" y="488" class="lbl sub">(a non-exhaustive OLD-style switch throws MatchException</text>
  <text x="636" y="504" class="lbl sub">at runtime instead — see D-068). Adding a 5th Verdict case</text>
  <text x="636" y="520" class="lbl sub">means the compiler flags every switch like this one — same</text>
  <text x="636" y="536" class="lbl sub">edit count as Visitor, far less boilerplate per site.</text>

  <!-- ===== TABLE ===== -->
  <text x="20" y="622" class="lbl h2">EXPRESSION PROBLEM TRADE-OFF</text>
  <line x1="20" y1="630" x2="1100" y2="630" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="642" width="1080" height="170" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="180" y1="642" x2="180" y2="812" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="640" y1="642" x2="640" y2="812" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="20" y1="672" x2="1100" y2="672" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="20" y1="742" x2="1100" y2="742" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="400" y="661" text-anchor="middle" class="lbl title">VISITOR</text>
  <text x="860" y="661" text-anchor="middle" class="lbl title">SEALED INTERFACE + SWITCH</text>

  <text x="32" y="692" class="lbl title">to add a case,</text>
  <text x="32" y="708" class="lbl title">edit here</text>

  <text x="196" y="690" class="lbl sub">Add a method to VerdictVisitor,</text>
  <text x="196" y="706" class="lbl sub">then implement it in every</text>
  <text x="196" y="722" class="lbl sub">concrete visitor class (N classes)</text>

  <text x="656" y="690" class="lbl sub">Add to the permits clause —</text>
  <text x="656" y="706" class="lbl sub">compiler flags every switch that</text>
  <text x="656" y="722" class="lbl sub">isn't exhaustive (N switch sites)</text>

  <text x="32" y="762" class="lbl title">to add an operation,</text>
  <text x="32" y="778" class="lbl title">edit here</text>

  <text x="196" y="760" class="lbl sub">Write one new VerdictVisitor</text>
  <text x="196" y="776" class="lbl sub">implementation. Zero existing</text>
  <text x="196" y="792" class="lbl sub">files touched.</text>

  <text x="656" y="760" class="lbl sub">Write one new switch expression</text>
  <text x="656" y="776" class="lbl sub">over Verdict. Zero existing</text>
  <text x="656" y="792" class="lbl sub">files touched.</text>

  <!-- legend -->
  <line x1="20" y1="830" x2="1100" y2="830" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="844" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="857" class="lbl tiny">interface / sealed type</text>

  <rect x="230" y="844" width="22" height="16" rx="3" class="boxR"/>
  <text x="260" y="857" class="lbl tiny">case class</text>

  <rect x="360" y="844" width="22" height="16" rx="3" class="boxW"/>
  <text x="390" y="857" class="lbl tiny">grouped method-body panel</text>

  <rect x="590" y="844" width="22" height="16" rx="3" class="boxH"/>
  <text x="620" y="857" class="lbl tiny">one operation (new visitor / switch)</text>

  <rect x="860" y="844" width="22" height="16" rx="3" class="boxA"/>
  <text x="890" y="857" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 20 878 H 60"/>
  <text x="70" y="882" class="lbl tiny">A → B : param / return usage</text>

  <path class="impl" d="M 260 878 H 300"/>
  <text x="310" y="882" class="lbl tiny">A → B : B implements A</text>

  <path class="adapt" d="M 500 878 H 540"/>
  <text x="550" y="882" class="lbl tiny">A → B : callback, not inheritance (double dispatch)</text>
</svg>
