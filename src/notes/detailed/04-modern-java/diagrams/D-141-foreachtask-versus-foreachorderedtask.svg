<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after comparison of forEach and forEachOrdered over a parallel stream of four stake reservation leaves RES-101 through RES-104. Left, forEach backed by ForEachTask: each leaf emits to the console the instant its own compute finishes, so the console order RES-103, RES-102, RES-104, RES-101 follows wall-clock finish order, not encounter order, and there is no buffering. Right, forEachOrdered backed by ForEachOrderedTask: RES-101 emits immediately because it has no predecessor pending, but RES-102, RES-103 and RES-104 all finish their own compute earlier yet are held in a completion buffer until every encounter-order predecessor has emitted, so the console order is strictly RES-101, RES-102, RES-103, RES-104. RES-103 finished first in wall-clock time but is called out as the lost parallel win because it is held until slots 1 and 2 release.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FOREACHTASK VERSUS FOREACHORDEREDTASK ON A PARALLEL RESERVATION STREAM</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="64" class="lbl h2">LEFT — forEach (ForEachTask), parallel and unordered</text>
  <text x="620" y="64" class="lbl h2">RIGHT — forEachOrdered (ForEachOrderedTask), encounter order kept</text>
  <line x1="600" y1="52" x2="600" y2="780" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: four leaves -->
  <rect x="58" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="110" y="112" text-anchor="middle" class="lbl node">RES-101</text>
  <text x="110" y="130" text-anchor="middle" class="lbl dense">leaf0</text>
  <text x="110" y="146" text-anchor="middle" class="lbl sub">finishes 4th</text>

  <rect x="178" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="230" y="112" text-anchor="middle" class="lbl node">RES-102</text>
  <text x="230" y="130" text-anchor="middle" class="lbl dense">leaf1</text>
  <text x="230" y="146" text-anchor="middle" class="lbl sub">finishes 2nd</text>

  <rect x="298" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="350" y="112" text-anchor="middle" class="lbl node">RES-103</text>
  <text x="350" y="130" text-anchor="middle" class="lbl dense">leaf2</text>
  <text x="350" y="146" text-anchor="middle" class="lbl sub">finishes 1st</text>

  <rect x="418" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="470" y="112" text-anchor="middle" class="lbl node">RES-104</text>
  <text x="470" y="130" text-anchor="middle" class="lbl dense">leaf3</text>
  <text x="470" y="146" text-anchor="middle" class="lbl sub">finishes 3rd</text>

  <!-- bus down to output, left -->
  <path class="flow" d="M 110 160 V 300"/>
  <path class="flow" d="M 230 160 V 300"/>
  <path class="flow" d="M 350 160 V 300"/>
  <path class="flow" d="M 470 160 V 300"/>
  <line x1="110" y1="300" x2="470" y2="300" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 290 300 V 340"/>

  <rect x="58" y="340" width="430" height="80" rx="6" class="boxR"/>
  <text x="273" y="362" text-anchor="middle" class="lbl node">OUTPUT STREAM (console)</text>
  <text x="273" y="382" text-anchor="middle" class="lbl dense">order: RES-103, RES-102, RES-104, RES-101</text>
  <text x="273" y="402" text-anchor="middle" class="lbl sub">no buffering — each leaf emits the instant compute() returns</text>

  <rect x="58" y="450" width="430" height="90" rx="6" class="boxAnn"/>
  <text x="74" y="472" class="lbl node">NO TOTAL ORDER</text>
  <text x="74" y="492" class="lbl tiny">accept() runs on whichever worker finishes</text>
  <text x="74" y="508" class="lbl tiny">its subtree first, even over an ordered</text>
  <text x="74" y="524" class="lbl tiny">source such as a List-backed stream</text>

  <!-- RIGHT: four leaves -->
  <rect x="638" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="690" y="112" text-anchor="middle" class="lbl node">RES-101</text>
  <text x="690" y="130" text-anchor="middle" class="lbl dense">leaf0</text>
  <text x="690" y="146" text-anchor="middle" class="lbl sub">finishes 4th</text>

  <rect x="758" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="810" y="112" text-anchor="middle" class="lbl node">RES-102</text>
  <text x="810" y="130" text-anchor="middle" class="lbl dense">leaf1</text>
  <text x="810" y="146" text-anchor="middle" class="lbl sub">finishes 2nd</text>

  <rect x="878" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="930" y="112" text-anchor="middle" class="lbl node">RES-103</text>
  <text x="930" y="130" text-anchor="middle" class="lbl dense">leaf2</text>
  <text x="930" y="146" text-anchor="middle" class="lbl sub">finishes 1st</text>

  <rect x="998" y="90" width="105" height="70" rx="6" class="boxP"/>
  <text x="1050" y="112" text-anchor="middle" class="lbl node">RES-104</text>
  <text x="1050" y="130" text-anchor="middle" class="lbl dense">leaf3</text>
  <text x="1050" y="146" text-anchor="middle" class="lbl sub">finishes 3rd</text>

  <!-- buffer slots -->
  <path class="flow" d="M 690 160 V 200"/>
  <path class="flow" d="M 810 160 V 200"/>
  <path class="flow" d="M 930 160 V 200"/>
  <path class="flow" d="M 1050 160 V 200"/>

  <rect x="638" y="200" width="105" height="90" rx="6" class="boxR"/>
  <text x="690" y="222" text-anchor="middle" class="lbl node">RES-101</text>
  <text x="690" y="240" text-anchor="middle" class="lbl dense">emits now</text>
  <text x="690" y="256" text-anchor="middle" class="lbl sub">slot 1 of 4</text>
  <text x="690" y="272" text-anchor="middle" class="lbl sub">no predecessor</text>

  <rect x="758" y="200" width="105" height="90" rx="6" class="boxW"/>
  <text x="810" y="222" text-anchor="middle" class="lbl node">RES-102</text>
  <text x="810" y="240" text-anchor="middle" class="lbl dense">held</text>
  <text x="810" y="256" text-anchor="middle" class="lbl sub">slot 2 of 4</text>
  <text x="810" y="272" text-anchor="middle" class="lbl sub">waits: slot1</text>

  <rect x="878" y="200" width="105" height="90" rx="6" class="boxW"/>
  <text x="930" y="222" text-anchor="middle" class="lbl node">RES-103</text>
  <text x="930" y="240" text-anchor="middle" class="lbl dense">held</text>
  <text x="930" y="256" text-anchor="middle" class="lbl sub">slot 3 of 4</text>
  <text x="930" y="272" text-anchor="middle" class="lbl sub">waits: slot1,2</text>

  <rect x="998" y="200" width="105" height="90" rx="6" class="boxW"/>
  <text x="1050" y="222" text-anchor="middle" class="lbl node">RES-104</text>
  <text x="1050" y="240" text-anchor="middle" class="lbl dense">held</text>
  <text x="1050" y="256" text-anchor="middle" class="lbl sub">slot 4 of 4</text>
  <text x="1050" y="272" text-anchor="middle" class="lbl sub">waits: slot1-3</text>

  <!-- lost parallel win callout -->
  <rect x="878" y="304" width="225" height="60" rx="4" class="boxAnn"/>
  <text x="990" y="323" text-anchor="middle" class="lbl tiny">LOST PARALLEL WIN</text>
  <text x="990" y="339" text-anchor="middle" class="lbl tiny">RES-103 finished 1st in wall-clock time</text>
  <text x="990" y="354" text-anchor="middle" class="lbl tiny">yet is 3rd to reach the console</text>
  <path class="weak" d="M 930 290 V 304"/>

  <!-- bus down to output, right -->
  <path class="flow" d="M 690 290 V 400"/>
  <path class="flow" d="M 810 290 V 400"/>
  <path class="flow" d="M 1050 290 V 400"/>
  <line x1="690" y1="400" x2="1050" y2="400" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 870 400 V 440"/>

  <rect x="638" y="440" width="430" height="80" rx="6" class="boxR"/>
  <text x="853" y="462" text-anchor="middle" class="lbl node">OUTPUT STREAM (console)</text>
  <text x="853" y="482" text-anchor="middle" class="lbl dense">order: RES-101, RES-102, RES-103, RES-104</text>
  <text x="853" y="502" text-anchor="middle" class="lbl sub">encounter order enforced by releasing buffers in submission order</text>

  <rect x="638" y="540" width="430" height="90" rx="6" class="boxAnn"/>
  <text x="654" y="562" class="lbl node">TOTAL ORDER, PAID FOR</text>
  <text x="654" y="582" class="lbl tiny">a completed subtree is buffered until every</text>
  <text x="654" y="598" class="lbl tiny">encounter-order predecessor has itself been</text>
  <text x="654" y="614" class="lbl tiny">released — the parallel compute still overlaps</text>

  <line x1="20" y1="750" x2="1180" y2="750" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="764" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="777" class="lbl tiny">leaf subtree (RES-1xx), still computing or just finished</text>
  <rect x="440" y="764" width="22" height="16" rx="3" class="boxR"/>
  <text x="470" y="777" class="lbl tiny">released to the output stream</text>
  <rect x="680" y="764" width="22" height="16" rx="3" class="boxW"/>
  <text x="710" y="777" class="lbl tiny">held in the completion buffer, computed but not its turn</text>
  <path class="flow" d="M 20 796 H 60"/>
  <text x="68" y="801" class="lbl tiny">emit / release, top to bottom</text>
  <path class="weak" d="M 300 796 H 340"/>
  <text x="348" y="801" class="lbl tiny">annotation reference</text>
</svg>
