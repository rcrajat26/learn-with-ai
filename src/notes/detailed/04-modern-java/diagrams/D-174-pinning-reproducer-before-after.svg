<svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after comparison of the virtual thread pinning reproducer over the stake-settlement lock.
     Left: synchronized around a blocking sleep, Java 21 behaviour, documented from JEP 491's own before-state and
     not reproducible live on this JDK 25 machine because JEP 491 already removed synchronized pinning here; shows
     the -Djdk.tracePinnedThreads=full trace format with each line explained, and states that Java 21 throughput
     is not independently measured on this sandbox. Right: the ReentrantLock version, trace empty, measured live
     on this machine at 159.7 requests per second with 2000 virtual threads pinned to a single carrier, and
     synchronized measured at the same 160.3 requests per second on this JDK 25 box, confirming JEP 491 already
     applies here.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .boxF  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pill  { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }
  </style>
  <rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE PINNING REPRODUCER, BEFORE AND AFTER</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="58" class="lbl sub">2,000 virtual threads settle stake reservations through one shared lock, scheduler parallelism pinned to 1 carrier.</text>

  <line x1="558" y1="68" x2="558" y2="720" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: synchronized, Java 21 -->
  <text x="20" y="90" class="lbl h2">synchronized { sleep(5) } — Java 21</text>
  <rect x="486" y="76" width="34" height="20" rx="10" class="pill"/>
  <text x="503" y="91" text-anchor="middle" class="lbl tiny" style="font-weight:700;">21</text>
  <text x="20" y="108" class="lbl sub">documented behaviour — not reproducible live on this JDK 25 sandbox (JEP 491)</text>

  <rect x="20" y="122" width="500" height="90" rx="6" class="boxW"/>
  <text x="270" y="142" text-anchor="middle" class="lbl node">SettlementLock.settle(Reservation r)</text>
  <text x="40" y="164" class="lbl mono">synchronized (MONITOR) {</text>
  <text x="40" y="182" class="lbl mono">  Thread.sleep(5);  // blocking I/O stand-in</text>
  <text x="40" y="200" class="lbl mono">}</text>

  <rect x="20" y="222" width="500" height="230" rx="6" class="boxF"/>
  <text x="36" y="244" class="lbl h2" style="font-size:12px;">-Djdk.tracePinnedThreads=full — Java 21 trace format, each line explained</text>
  <text x="36" y="266" class="lbl mono">Thread[#31,ForkJoinPool-1-worker-1,5,CarrierThreads]</text>
  <text x="56" y="282" class="lbl tiny">the carrier thread that is stuck holding this virtual thread</text>
  <text x="36" y="302" class="lbl mono">    LockSupport.park() @ VirtualThread.parkOnCarrier</text>
  <text x="56" y="318" class="lbl tiny">where the scheduler tried and failed to unmount</text>
  <text x="36" y="338" class="lbl mono">    &lt;== monitors:1</text>
  <text x="56" y="354" class="lbl tiny">the count of held object monitors that block unmounting</text>
  <text x="36" y="374" class="lbl mono">    at SettlementLock.settle(SettlementLock.java:12)</text>
  <text x="56" y="390" class="lbl tiny">the exact synchronized block — reason: MONITOR</text>
  <text x="36" y="410" class="lbl mono">    &lt;== reason: MONITOR</text>
  <text x="56" y="426" class="lbl tiny">JEP 491 (Java 24) removes exactly this cause</text>

  <rect x="20" y="462" width="500" height="80" rx="6" class="boxA"/>
  <text x="36" y="482" class="lbl h2" style="font-size:11px;">THROUGHPUT — NOT INDEPENDENTLY MEASURED HERE</text>
  <text x="36" y="500" class="lbl tiny">This sandbox runs JDK 25, where JEP 491 already applies, so the</text>
  <text x="36" y="516" class="lbl tiny">degraded Java-21 number cannot be captured live — see envelope's unverified line.</text>
  <text x="36" y="532" class="lbl tiny">Direction only: every settlement serializes onto the one pinned carrier.</text>

  <!-- RIGHT: ReentrantLock, measured on this machine -->
  <text x="580" y="90" class="lbl h2">ReentrantLock { sleep(5) } — measured live</text>
  <rect x="1010" y="76" width="34" height="20" rx="10" class="pill"/>
  <text x="1027" y="91" text-anchor="middle" class="lbl tiny" style="font-weight:700;">25</text>
  <text x="580" y="108" class="lbl sub">this JDK 25 machine — actual -Djdk.tracePinnedThreads=full output, not documentation</text>

  <rect x="580" y="122" width="500" height="90" rx="6" class="boxR"/>
  <text x="830" y="142" text-anchor="middle" class="lbl node">SettlementLock.settle(Reservation r)</text>
  <text x="600" y="164" class="lbl mono">LOCK.lock();</text>
  <text x="600" y="182" class="lbl mono">try { Thread.sleep(5); } finally { LOCK.unlock(); }</text>

  <rect x="580" y="222" width="500" height="130" rx="6" class="boxR"/>
  <text x="596" y="244" class="lbl h2" style="font-size:12px;">-Djdk.tracePinnedThreads=full — captured on this run</text>
  <text x="600" y="270" class="lbl mono">(no output — 0 lines)</text>
  <text x="600" y="292" class="lbl tiny">ReentrantLock parks the carrier and unmounts the virtual</text>
  <text x="600" y="308" class="lbl tiny">thread instead of holding a monitor — nothing to trace,</text>
  <text x="600" y="324" class="lbl tiny">on Java 21 or Java 25.</text>

  <rect x="580" y="366" width="500" height="176" rx="6" class="boxA"/>
  <text x="596" y="386" class="lbl h2" style="font-size:11px;">MEASURED THROUGHPUT — 2,000 virtual threads, 1 carrier</text>
  <text x="596" y="406" class="lbl body" style="font-weight:700;">ReentrantLock: 159.7 req/s</text>
  <text x="596" y="424" class="lbl tiny">(completed=2000, wall=12.525s, measured on this box)</text>
  <text x="596" y="446" class="lbl body" style="font-weight:700;">synchronized, same box: 160.3 req/s</text>
  <text x="596" y="464" class="lbl tiny">(completed=2000, wall=12.476s — no pinning trace either)</text>
  <text x="596" y="486" class="lbl tiny">The two are statistically identical here because JEP 491 already</text>
  <text x="596" y="502" class="lbl tiny">removes synchronized's pinning cause on this JDK 25 runtime —</text>
  <text x="596" y="518" class="lbl tiny">this is live confirmation of JEP 491's effect, not of Java 21's cost.</text>
  <text x="596" y="534" class="lbl tiny">"Use ReentrantLock" is a version-scoped fix: needed on 21, moot from 24.</text>

  <rect x="580" y="556" width="500" height="70" rx="6" class="boxF"/>
  <text x="596" y="576" class="lbl h2" style="font-size:11px;">STILL PINS ON EVERY RELEASE</text>
  <text x="596" y="594" class="lbl tiny">Native and foreign-function frames still pin under both locks and both</text>
  <text x="596" y="610" class="lbl tiny">releases — jdk.VirtualThreadPinned (JFR) survives JEP 491.</text>

  <!-- legend -->
  <line x1="20" y1="712" x2="1100" y2="712" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="724" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="737" class="lbl tiny">code under test</text>
  <rect x="200" y="724" width="22" height="16" rx="3" class="boxF"/>
  <text x="230" y="737" class="lbl tiny">pins / degraded / documented-not-measured</text>
  <rect x="560" y="724" width="22" height="16" rx="3" class="boxR"/>
  <text x="590" y="737" class="lbl tiny">does not pin, measured live</text>
  <rect x="820" y="724" width="22" height="16" rx="3" class="boxA"/>
  <text x="850" y="737" class="lbl tiny">annotation panel</text>
</svg>
