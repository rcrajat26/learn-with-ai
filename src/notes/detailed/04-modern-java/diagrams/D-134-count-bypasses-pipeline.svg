<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="How count() bypasses the pipeline. Starting at count(), three checks run in sequence: is SIZED
     still set in combinedFlags, has no stateful op cleared it, and does nothing short-circuit. If all three
     pass, count() returns the source's exact size without building a sink chain, and any peek stage in the
     pipeline is never invoked. If any check fails — for example a filter stage present, which clears SIZED —
     count() falls through to a full traversal that builds a CountingSink and walks every element. This
     behaviour changed in Java 9: before Java 9, peek's side effects still ran even when the bypass applied.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .code  { font-size: 11px; font-family: "Courier New", monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }
    .pill  { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triGray); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">HOW count() BYPASSES THE PIPELINE</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- start -->
  <rect x="180" y="60" width="240" height="60" rx="6" class="boxP"/>
  <text x="300" y="94" text-anchor="middle" class="lbl node">count() invoked</text>

  <!-- diamond 1 -->
  <polygon points="300,145 440,190 300,235 160,190" class="boxP"/>
  <text x="300" y="184" text-anchor="middle" class="lbl tiny">SIZED still set</text>
  <text x="300" y="198" text-anchor="middle" class="lbl tiny">in combinedFlags?</text>

  <!-- diamond 2 -->
  <polygon points="300,285 440,330 300,375 160,330" class="boxP"/>
  <text x="300" y="324" text-anchor="middle" class="lbl tiny">no stateful op</text>
  <text x="300" y="338" text-anchor="middle" class="lbl tiny">cleared it?</text>

  <!-- diamond 3 -->
  <polygon points="300,425 440,470 300,515 160,470" class="boxP"/>
  <text x="300" y="464" text-anchor="middle" class="lbl tiny">does anything</text>
  <text x="300" y="478" text-anchor="middle" class="lbl tiny">short-circuit?</text>

  <!-- bypass box -->
  <rect x="180" y="560" width="240" height="90" rx="6" class="boxR"/>
  <text x="300" y="584" text-anchor="middle" class="lbl node">BYPASS</text>
  <text x="300" y="602" text-anchor="middle" class="lbl body">return sourceSpliterator</text>
  <text x="300" y="617" text-anchor="middle" class="lbl body">.getExactSizeIfKnown()</text>
  <text x="300" y="634" text-anchor="middle" class="lbl sub">e.g. 95000 — no sink chain built</text>

  <!-- peek skipped -->
  <rect x="20" y="560" width="140" height="90" rx="6" class="boxW"/>
  <text x="90" y="584" text-anchor="middle" class="lbl node">peek stage</text>
  <text x="90" y="602" text-anchor="middle" class="lbl body">audit(entry)</text>
  <text x="90" y="620" text-anchor="middle" class="lbl sub" style="font-weight:700">never invoked</text>
  <path class="weak" d="M 160 605 H 180"/>

  <!-- full traversal box -->
  <rect x="760" y="270" width="340" height="120" rx="6" class="boxP"/>
  <text x="930" y="294" text-anchor="middle" class="lbl node">FULL TRAVERSAL</text>
  <text x="930" y="312" text-anchor="middle" class="lbl body">build sink chain (CountingSink)</text>
  <text x="930" y="330" text-anchor="middle" class="lbl body">spliterator.forEachRemaining(sink)</text>
  <text x="930" y="348" text-anchor="middle" class="lbl body">increment counter per accepted element</text>
  <text x="930" y="368" text-anchor="middle" class="lbl sub">no size shortcut available</text>

  <!-- spine -->
  <path class="flow" d="M 300 120 V 145"/>
  <path class="flow" d="M 300 235 V 285"/>
  <text x="318" y="262" class="lbl tiny">YES</text>
  <path class="flow" d="M 300 375 V 425"/>
  <text x="318" y="402" class="lbl tiny">YES</text>
  <path class="flow" d="M 300 515 V 560"/>
  <text x="318" y="540" class="lbl tiny">YES</text>

  <!-- branches to full traversal -->
  <path class="flow" d="M 440 190 H 650 V 290 H 760"/>
  <text x="470" y="184" class="lbl tiny">NO</text>
  <path class="flow" d="M 440 330 H 760"/>
  <text x="470" y="324" class="lbl tiny">NO</text>
  <path class="flow" d="M 440 470 H 650 V 370 H 760"/>
  <text x="470" y="464" class="lbl tiny">NO</text>

  <!-- examples panel -->
  <rect x="760" y="60" width="340" height="100" rx="6" class="boxA"/>
  <text x="770" y="78" class="lbl tiny" style="font-weight:700">Example pipelines</text>
  <text x="770" y="96" class="lbl code">BYPASS: cardDeposits.stream()</text>
  <text x="770" y="110" class="lbl code">  .peek(e -&gt; audit(e)).count()</text>
  <text x="770" y="128" class="lbl code">FULL: cardDeposits.stream()</text>
  <text x="770" y="142" class="lbl code">  .filter(d -&gt; d.status()==CAPTURED).count()</text>

  <!-- version trap panel -->
  <rect x="180" y="670" width="820" height="90" rx="6" class="boxA"/>
  <rect x="196" y="683" width="30" height="22" rx="8" class="pill"/>
  <text x="211" y="699" text-anchor="middle" class="lbl tiny" style="font-weight:700">9</text>
  <text x="238" y="699" class="lbl tiny" style="font-weight:700">VERSION TRAP — Java 9 (JDK-8039976)</text>
  <text x="196" y="718" class="lbl tiny">Before Java 9, peek()'s side effects still ran even when the SIZED bypass applied — a</text>
  <text x="196" y="734" class="lbl tiny">spec/implementation mismatch. Java 9 fixed it: peek is genuinely skipped whenever</text>
  <text x="196" y="750" class="lbl tiny">count() takes the bypass path shown above.</text>

  <!-- legend -->
  <line x1="20" y1="785" x2="1180" y2="785" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="800" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="813" class="lbl tiny">check / call step</text>
  <rect x="220" y="800" width="22" height="16" rx="3" class="boxR"/>
  <text x="250" y="813" class="lbl tiny">bypass outcome (fast path)</text>
  <rect x="480" y="800" width="22" height="16" rx="3" class="boxW"/>
  <text x="510" y="813" class="lbl tiny">stage skipped, never invoked</text>
  <path class="flow" d="M 760 808 H 800"/>
  <text x="808" y="813" class="lbl tiny">A → B : control flow (YES/NO)</text>
  <path class="weak" d="M 20 830 H 60"/>
  <text x="68" y="835" class="lbl tiny">A ⇢ B : pipeline stage present but not exercised</text>
</svg>
