<svg viewBox="0 0 1120 820" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="An array component breaks equals. Left: record Batch holding a byte array payload —
     two instances with equal contents compare not-equal because the generated equals calls the
     array's own equals, which is reference identity, and the two instances' hash codes differ for
     the same reason. Right: the same data modelled as a record holding a List of Byte compares
     equal because List.equals compares contents. A third panel shows the hand-written Arrays.equals
     and Arrays.hashCode override to use if the array component is unavoidable.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .code  { font-family: "Menlo", "Consolas", monospace; font-size: 12px; fill: #1f2937; }
    .codeC { font-family: "Menlo", "Consolas", monospace; font-size: 12px; fill: #4b5563; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3;
             stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="820" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">AN ARRAY COMPONENT BREAKS EQUALS</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="66" class="lbl h2">LEFT — record Batch(byte[] payload)</text>
  <text x="580" y="66" class="lbl h2">RIGHT — record BatchSafe(List&lt;Byte&gt; payload)</text>

  <!-- LEFT: two Batch instances -->
  <rect x="20" y="80" width="240" height="90" rx="6" class="boxP"/>
  <text x="140" y="104" text-anchor="middle" class="lbl node">b1 = new Batch(...)</text>
  <text x="140" y="126" text-anchor="middle" class="lbl code">payload = { 1, 2, 3 }</text>
  <text x="140" y="146" text-anchor="middle" class="lbl sub">distinct byte[] object, identity h1</text>
  <text x="140" y="160" text-anchor="middle" class="lbl sub">array's own hashCode() -&gt; identity hash</text>

  <rect x="320" y="80" width="240" height="90" rx="6" class="boxP"/>
  <text x="440" y="104" text-anchor="middle" class="lbl node">b2 = new Batch(...)</text>
  <text x="440" y="126" text-anchor="middle" class="lbl code">payload = { 1, 2, 3 }</text>
  <text x="440" y="146" text-anchor="middle" class="lbl sub">distinct byte[] object, identity h2</text>
  <text x="440" y="160" text-anchor="middle" class="lbl sub">array's own hashCode() -&gt; identity hash</text>

  <path class="weak" d="M 260 125 H 320"/>
  <text x="290" y="186" text-anchor="middle" class="lbl sub">equal contents</text>

  <rect x="60" y="196" width="440" height="120" rx="6" class="boxD"/>
  <text x="76" y="220" class="lbl body" font-weight="700">b1.equals(b2)  -&gt;  false</text>
  <text x="76" y="242" class="lbl code">generated equals() calls Objects.equals(this.payload, other.payload)</text>
  <text x="76" y="262" class="lbl code">-&gt; byte[].equals() is Object.equals() -&gt; reference comparison</text>
  <text x="76" y="284" class="lbl body" font-weight="700">b1.hashCode() != b2.hashCode()</text>
  <text x="76" y="304" class="lbl sub">each array's identity hash code, not its contents</text>

  <!-- RIGHT: two BatchSafe instances -->
  <rect x="580" y="80" width="230" height="90" rx="6" class="boxP"/>
  <text x="695" y="104" text-anchor="middle" class="lbl node">s1 = new BatchSafe(...)</text>
  <text x="695" y="126" text-anchor="middle" class="lbl code">payload = List.of(1,2,3)</text>
  <text x="695" y="146" text-anchor="middle" class="lbl sub">distinct List object</text>
  <text x="695" y="160" text-anchor="middle" class="lbl sub">List.hashCode() -&gt; content-derived</text>

  <rect x="850" y="80" width="230" height="90" rx="6" class="boxP"/>
  <text x="965" y="104" text-anchor="middle" class="lbl node">s2 = new BatchSafe(...)</text>
  <text x="965" y="126" text-anchor="middle" class="lbl code">payload = List.of(1,2,3)</text>
  <text x="965" y="146" text-anchor="middle" class="lbl sub">distinct List object</text>
  <text x="965" y="160" text-anchor="middle" class="lbl sub">List.hashCode() -&gt; content-derived</text>

  <path class="weak" d="M 810 125 H 850"/>
  <text x="830" y="186" text-anchor="middle" class="lbl sub">equal contents</text>

  <rect x="600" y="196" width="460" height="120" rx="6" class="boxR"/>
  <text x="616" y="220" class="lbl body" font-weight="700">s1.equals(s2)  -&gt;  true</text>
  <text x="616" y="242" class="lbl code">generated equals() calls Objects.equals(this.payload, other.payload)</text>
  <text x="616" y="262" class="lbl code">-&gt; List.equals() compares elements pairwise, by value</text>
  <text x="616" y="284" class="lbl body" font-weight="700">s1.hashCode() == s2.hashCode()</text>
  <text x="616" y="304" class="lbl sub">List.hashCode() is defined over the elements</text>

  <!-- third panel: hand-written override -->
  <text x="20" y="352" class="lbl h2">IF THE ARRAY IS UNAVOIDABLE — HAND-WRITTEN OVERRIDE ON Batch</text>
  <rect x="20" y="364" width="1080" height="200" rx="6" class="boxA"/>
  <text x="36" y="388" class="lbl code">record Batch(byte[] payload) {</text>
  <text x="52" y="410" class="lbl code">@Override</text>
  <text x="52" y="430" class="lbl code">public boolean equals(Object o) {</text>
  <text x="68" y="450" class="lbl code">return o instanceof Batch other</text>
  <text x="84" y="468" class="lbl code">&amp;&amp; Arrays.equals(payload, other.payload);</text>
  <text x="52" y="488" class="lbl code">}</text>
  <text x="52" y="508" class="lbl code">@Override</text>
  <text x="52" y="528" class="lbl code">public int hashCode() { return Arrays.hashCode(payload); }</text>
  <text x="36" y="548" class="lbl code">}</text>

  <!-- legend -->
  <line x1="20" y1="590" x2="1100" y2="590" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="602" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="615" class="lbl tiny">record instance</text>
  <rect x="220" y="602" width="22" height="16" rx="3" class="boxR"/>
  <text x="250" y="615" class="lbl tiny">correct equals / hashCode result</text>
  <rect x="500" y="602" width="22" height="16" rx="3" class="boxD"/>
  <text x="530" y="615" class="lbl tiny">broken equals / hashCode result</text>
  <rect x="780" y="602" width="22" height="16" rx="3" class="boxA"/>
  <text x="810" y="615" class="lbl tiny">annotation panel / code override</text>
  <path class="weak" d="M 20 630 H 60"/>
  <text x="70" y="635" class="lbl tiny">dotted : same-content comparison being drawn between two instances</text>
</svg>
