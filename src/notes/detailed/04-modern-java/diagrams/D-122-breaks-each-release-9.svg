<svg viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline of breaking changes from Java 9 to Java 21. Java 9 introduces strong
     encapsulation of internals, breaking split packages. Java 11 removes the Java EE and CORBA
     modules, causing NoClassDefFoundError on javax.xml.bind. Java 16 turns encapsulation on by
     default, requiring --add-opens or throwing InaccessibleObjectException. Java 17 makes
     strictfp a no-op, deprecates the Security Manager, and denies illegal reflective access.
     Java 18 makes UTF-8 the default charset under JEP 400. Java 21 tightens pattern-switch
     exhaustiveness and introduces sequenced-collection method name clashes on getFirst,
     reversed, and putFirst.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2   { font-size: 12.5px; font-weight: 700; }
    .pill { font-size: 12px; font-weight: 700; }
    .hdr  { font-size: 11px; font-weight: 700; }
    .sym  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }

    .boxD { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxV { fill: #fbbf24; stroke: #b45309; stroke-width: 1.4; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
    .flowA{ fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .tick { fill: #b91c1c; stroke: #7f1d1d; stroke-width: 1; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="560" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WHAT BREAKS AT EACH RELEASE, 9 → 21</text>
  <line x1="20" y1="42" x2="1280" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- axis -->
  <path class="flowA" d="M 60 300 H 1230"/>
  <text x="1170" y="292" text-anchor="middle" class="lbl tiny">later releases →</text>

  <!-- ============ marker 9 (above) ============ -->
  <circle cx="160" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 160 295 V 270"/>
  <rect x="30" y="140" width="260" height="130" rx="6" class="boxD"/>
  <rect x="42" y="150" width="34" height="20" rx="4" class="boxV"/>
  <text x="59" y="165" text-anchor="middle" class="lbl pill">9</text>
  <text x="160" y="196" text-anchor="middle" class="lbl hdr">STRONG ENCAPSULATION</text>
  <text x="160" y="211" text-anchor="middle" class="lbl hdr">OF INTERNALS</text>
  <text x="160" y="234" text-anchor="middle" class="lbl sym">split packages fail;</text>
  <text x="160" y="250" text-anchor="middle" class="lbl sym">sun.misc.* blocked</text>

  <!-- ============ marker 11 (below) ============ -->
  <circle cx="356" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 356 305 V 330"/>
  <rect x="226" y="330" width="260" height="130" rx="6" class="boxD"/>
  <rect x="238" y="340" width="42" height="20" rx="4" class="boxV"/>
  <text x="259" y="355" text-anchor="middle" class="lbl pill">11</text>
  <text x="356" y="386" text-anchor="middle" class="lbl hdr">JAVA EE &amp; CORBA</text>
  <text x="356" y="401" text-anchor="middle" class="lbl hdr">MODULES REMOVED</text>
  <text x="356" y="424" text-anchor="middle" class="lbl sym">NoClassDefFoundError:</text>
  <text x="356" y="440" text-anchor="middle" class="lbl sym">javax.xml.bind (JAXB)</text>

  <!-- ============ marker 16 (above) ============ -->
  <circle cx="552" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 552 295 V 270"/>
  <rect x="422" y="140" width="260" height="130" rx="6" class="boxD"/>
  <rect x="434" y="150" width="42" height="20" rx="4" class="boxV"/>
  <text x="455" y="165" text-anchor="middle" class="lbl pill">16</text>
  <text x="552" y="196" text-anchor="middle" class="lbl hdr">ENCAPSULATION ON</text>
  <text x="552" y="211" text-anchor="middle" class="lbl hdr">BY DEFAULT</text>
  <text x="552" y="234" text-anchor="middle" class="lbl sym">needs --add-opens or</text>
  <text x="552" y="250" text-anchor="middle" class="lbl sym">InaccessibleObjectException</text>

  <!-- ============ marker 17 (below, taller box) ============ -->
  <circle cx="748" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 748 305 V 330"/>
  <rect x="618" y="330" width="260" height="150" rx="6" class="boxD"/>
  <rect x="630" y="340" width="42" height="20" rx="4" class="boxV"/>
  <text x="651" y="355" text-anchor="middle" class="lbl pill">17</text>
  <text x="748" y="386" text-anchor="middle" class="lbl hdr">strictfp NO-OP ·</text>
  <text x="748" y="401" text-anchor="middle" class="lbl hdr">SECURITY MANAGER</text>
  <text x="748" y="416" text-anchor="middle" class="lbl hdr">DEPRECATED</text>
  <text x="748" y="439" text-anchor="middle" class="lbl sym">illegal reflective</text>
  <text x="748" y="455" text-anchor="middle" class="lbl sym">access now DENIED</text>

  <!-- ============ marker 18 (above) ============ -->
  <circle cx="944" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 944 295 V 270"/>
  <rect x="814" y="140" width="260" height="130" rx="6" class="boxD"/>
  <rect x="826" y="150" width="42" height="20" rx="4" class="boxV"/>
  <text x="847" y="165" text-anchor="middle" class="lbl pill">18</text>
  <text x="944" y="196" text-anchor="middle" class="lbl hdr">UTF-8 DEFAULT</text>
  <text x="944" y="211" text-anchor="middle" class="lbl hdr">(JEP 400)</text>
  <text x="944" y="234" text-anchor="middle" class="lbl sym">file.encoding=UTF-8 now</text>
  <text x="944" y="250" text-anchor="middle" class="lbl sym">replaces platform charset</text>

  <!-- ============ marker 21 (below) ============ -->
  <circle cx="1140" cy="300" r="5" class="tick"/>
  <path class="flow" d="M 1140 305 V 330"/>
  <rect x="1010" y="330" width="260" height="130" rx="6" class="boxD"/>
  <rect x="1022" y="340" width="42" height="20" rx="4" class="boxV"/>
  <text x="1043" y="355" text-anchor="middle" class="lbl pill">21</text>
  <text x="1140" y="386" text-anchor="middle" class="lbl hdr">PATTERN-SWITCH</text>
  <text x="1140" y="401" text-anchor="middle" class="lbl hdr">EXHAUSTIVENESS</text>
  <text x="1140" y="424" text-anchor="middle" class="lbl sym">getFirst / reversed /</text>
  <text x="1140" y="440" text-anchor="middle" class="lbl sym">putFirst clashes</text>

  <!-- legend -->
  <line x1="20" y1="500" x2="1280" y2="500" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="514" width="22" height="16" rx="3" class="boxD"/>
  <text x="50" y="527" class="lbl tiny">breaking change at this release</text>
  <rect x="320" y="514" width="30" height="16" rx="4" class="boxV"/>
  <text x="358" y="527" class="lbl tiny">version-number badge</text>
  <path class="flowA" d="M 560 522 H 610"/>
  <text x="620" y="527" class="lbl tiny">chronological axis, earliest → latest</text>
</svg>
