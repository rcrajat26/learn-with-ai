<svg viewBox="0 0 1040 1180" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three-frame sequence of Kahan compensated summation inside Collectors.summingDouble, summing 95,000 card deposits averaging 65 as doubles. Frame 1: the double array 3 accumulator starts at sum 0.0, comp 0.0, simpleSum 0.0. Frame 2: processing deposit number 95000 of value 81.41, tmp equals val minus comp equals 81.4099999998881, velvel equals sum plus tmp equals 6169091.78, and the new compensation 2.609112925711088E-10 carries the lost low-order bit forward for the next addition. Frame 3: the finisher computes sum minus comp giving a compensated total of 6169091.78, printed beside the naive running total of 6169091.780000052, a real difference of 5.21540641784668E-8 produced by actually running the summation over 95,000 simulated deposits. A closing note states that summingInt actually accumulates into an int one-element array, verified against the jdk-21+35 source, correcting the packet's own claim that it uses a long array; summingLong is the one that uses long one-element array, and neither needs compensation because integer addition does not round.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triA); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1180" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">KAHAN COMPENSATED SUMMATION INSIDE summingDouble — 95,000 CARD DEPOSITS, AVG 65</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <text x="20" y="64" class="lbl h2">FRAME 1 — the double[3] accumulator before any deposit is folded in</text>
  <line x1="20" y1="72" x2="1020" y2="72" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="90" width="240" height="90" rx="6" class="boxP"/>
  <text x="180" y="112" text-anchor="middle" class="lbl node mono">a[0]  =  0.0</text>
  <text x="180" y="132" text-anchor="middle" class="lbl dense">sum — high-order bits</text>
  <text x="180" y="150" text-anchor="middle" class="lbl sub">the running compensated total</text>
  <text x="180" y="166" text-anchor="middle" class="lbl sub">index 0</text>

  <rect x="340" y="90" width="240" height="90" rx="6" class="boxH"/>
  <text x="460" y="112" text-anchor="middle" class="lbl node mono">a[1]  =  0.0</text>
  <text x="460" y="132" text-anchor="middle" class="lbl dense">comp — low-order bits</text>
  <text x="460" y="150" text-anchor="middle" class="lbl sub">carries the bit lost last step</text>
  <text x="460" y="166" text-anchor="middle" class="lbl sub">index 1</text>

  <rect x="620" y="90" width="240" height="90" rx="6" class="boxW"/>
  <text x="740" y="112" text-anchor="middle" class="lbl node mono">a[2]  =  0.0</text>
  <text x="740" y="132" text-anchor="middle" class="lbl dense">simpleSum — naive total</text>
  <text x="740" y="150" text-anchor="middle" class="lbl sub">kept only for a NaN/Infinity fallback</text>
  <text x="740" y="166" text-anchor="middle" class="lbl sub">index 2</text>

  <text x="60" y="222" class="lbl tiny">Collectors.summingDouble() allocates () -&gt; new double[3] as its supplier — one array per accumulation</text>

  <!-- FRAME 2 -->
  <text x="20" y="274" class="lbl h2">FRAME 2 — folding in deposit #95,000 (value 81.41), the small addend and its recovery</text>
  <line x1="20" y1="282" x2="1020" y2="282" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="300" width="230" height="86" rx="6" class="boxP"/>
  <text x="175" y="322" text-anchor="middle" class="lbl node mono">a[0] = 6169010.37</text>
  <text x="175" y="342" text-anchor="middle" class="lbl dense">sum before</text>
  <text x="175" y="360" text-anchor="middle" class="lbl sub">after deposits #1..#94,999</text>

  <rect x="310" y="300" width="230" height="86" rx="6" class="boxH"/>
  <text x="425" y="322" text-anchor="middle" class="lbl node mono">a[1] = 1.1190E-10</text>
  <text x="425" y="342" text-anchor="middle" class="lbl dense">comp before</text>
  <text x="425" y="360" text-anchor="middle" class="lbl sub">the bit lost by deposit #94,999</text>

  <rect x="560" y="300" width="230" height="86" rx="6" class="boxW"/>
  <text x="675" y="322" text-anchor="middle" class="lbl node mono">val = 81.41</text>
  <text x="675" y="342" text-anchor="middle" class="lbl dense">DEP-095000 CAPTURED</text>
  <text x="675" y="360" text-anchor="middle" class="lbl sub">the new addend</text>

  <path class="flow" d="M 175 386 V 420"/>
  <path class="flow" d="M 425 386 V 420"/>
  <path class="flow" d="M 675 386 V 420"/>

  <rect x="60" y="420" width="730" height="150" rx="6" class="boxAnn"/>
  <text x="76" y="444" class="lbl node mono">tmp    = val - a[1]   = 81.41 - 1.1189627002750058E-10 = 81.4099999998881</text>
  <text x="76" y="466" class="lbl mono dense">velvel = a[0] + tmp   = 6169010.37 + 81.4099999998881  = 6169091.78</text>
  <text x="76" y="488" class="lbl mono dense">a[1]   = (velvel - a[0]) - tmp = 2.609112925711088E-10   [recovered here]</text>
  <text x="76" y="510" class="lbl mono dense">a[0]   = velvel        = 6169091.78</text>
  <text x="76" y="536" class="lbl tiny">tmp already differs from val at the 11th decimal — that sliver was subtracted out of the</text>
  <text x="76" y="552" class="lbl tiny">previous compensation and folded back in here; the new a[1] captures this step's own loss</text>
  <text x="76" y="568" class="lbl tiny">for deposit #95,001 to recover in turn — nothing is ever silently dropped, only deferred</text>

  <!-- FRAME 3 -->
  <text x="20" y="614" class="lbl h2">FRAME 3 — the finisher: naive total and compensated total, side by side</text>
  <line x1="20" y1="622" x2="1020" y2="622" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="640" width="230" height="90" rx="6" class="boxW"/>
  <text x="175" y="662" text-anchor="middle" class="lbl node mono">a[0]-a[1]</text>
  <text x="175" y="682" text-anchor="middle" class="lbl dense">computeFinalSum(a)</text>
  <text x="175" y="700" text-anchor="middle" class="lbl sub">tmp = a[0] - a[1]</text>
  <text x="175" y="716" text-anchor="middle" class="lbl sub">returns tmp unless NaN+Infinite</text>

  <path class="flow" d="M 290 685 H 340"/>

  <rect x="340" y="640" width="300" height="90" rx="6" class="boxR"/>
  <text x="490" y="662" text-anchor="middle" class="lbl node mono">6169091.78</text>
  <text x="490" y="682" text-anchor="middle" class="lbl dense">compensated total</text>
  <text x="490" y="700" text-anchor="middle" class="lbl sub">exact to the cent over all 95,000 deposits</text>
  <text x="490" y="716" text-anchor="middle" class="lbl sub">what summingDouble() actually returns</text>

  <rect x="660" y="640" width="300" height="90" rx="6" class="boxW"/>
  <text x="810" y="662" text-anchor="middle" class="lbl node mono">6169091.780000052</text>
  <text x="810" y="682" text-anchor="middle" class="lbl dense">naive total (a[2], simpleSum)</text>
  <text x="810" y="700" text-anchor="middle" class="lbl sub">plain += over the same 95,000 values</text>
  <text x="810" y="716" text-anchor="middle" class="lbl sub">drifts by 5.2154E-8 from the true total</text>

  <path class="flow" d="M 640 685 H 660"/>

  <text x="60" y="768" class="lbl tiny">Both numbers came from one real run of the accumulation loop over 95,000 simulated card deposits</text>
  <text x="60" y="784" class="lbl tiny">(seeded, averaging ~65) — naive == compensated is false; the gap is real, not illustrative</text>

  <!-- summingInt correction note -->
  <rect x="60" y="812" width="900" height="130" rx="6" class="boxAnn"/>
  <text x="76" y="836" class="lbl node">CORRECTION — summingInt does NOT use long[]</text>
  <text x="76" y="858" class="lbl dense mono">Collectors.summingInt: () -&gt; new int[1]</text>
  <text x="76" y="876" class="lbl dense mono">Collectors.summingLong: () -&gt; new long[1]</text>
  <text x="76" y="898" class="lbl tiny">verified against jdk-21+35 java.util.stream.Collectors source; the packet's own wording</text>
  <text x="76" y="914" class="lbl tiny">("summingInt uses a long[]") is wrong and is corrected here — neither needs compensation</text>
  <text x="76" y="930" class="lbl tiny">because integer and long addition do not round, they only overflow</text>

  <line x1="20" y1="1000" x2="1020" y2="1000" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="1014" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="1027" class="lbl tiny">a[0] — compensated running sum</text>
  <rect x="280" y="1014" width="22" height="16" rx="3" class="boxH"/>
  <text x="310" y="1027" class="lbl tiny">a[1] — compensation term / highlighted correction</text>
  <rect x="640" y="1014" width="22" height="16" rx="3" class="boxW"/>
  <text x="670" y="1027" class="lbl tiny">a[2] / naive value — uncompensated</text>
  <rect x="20" y="1044" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="1057" class="lbl tiny">final returned result</text>
  <rect x="280" y="1044" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="310" y="1057" class="lbl tiny">annotation panel — arithmetic detail or correction note</text>
  <path class="flow" d="M 700 1044 H 740"/>
  <text x="748" y="1049" class="lbl tiny">data flow into the next step</text>
</svg>
