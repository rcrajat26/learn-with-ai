<svg viewBox="0 0 1120 680" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after: var plus the empty diamond infers Object. Left, before: var positions =
     new ArrayList&lt;&gt;(); — the diamond has no target type, so it resolves to ArrayList&lt;Object&gt;, and
     the later call positions.get(0).amount() is a compile error because amount() is undefined for Object.
     Right, after: var positions = new ArrayList&lt;Position&gt;(); — the diamond has an explicit target
     type, so it resolves to ArrayList&lt;Position&gt;, and positions.get(0).amount() compiles, returning
     Money.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="680" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">VAR PLUS THE DIAMOND INFERS OBJECT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="60" class="lbl h2">EMPTY DIAMOND — BEFORE</text>
  <text x="580" y="60" class="lbl h2">TARGETED DIAMOND — AFTER</text>
  <line x1="560" y1="52" x2="560" y2="480" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT -->
  <rect x="20" y="90" width="500" height="60" rx="6" class="boxP"/>
  <text x="270" y="115" text-anchor="middle" class="lbl body">var positions = new ArrayList&lt;&gt;();</text>
  <text x="270" y="133" text-anchor="middle" class="lbl sub">declared type: var, initializer: empty diamond</text>

  <path class="flow" d="M 270 150 V 172"/>

  <rect x="20" y="174" width="500" height="46" rx="6" class="boxW"/>
  <text x="270" y="202" text-anchor="middle" class="lbl body">diamond &lt;&gt; has no target type</text>

  <path class="flow" d="M 270 220 V 242"/>

  <rect x="20" y="244" width="500" height="56" rx="6" class="boxH"/>
  <text x="270" y="268" text-anchor="middle" class="lbl node">resolves to ArrayList&lt;Object&gt;</text>
  <text x="270" y="286" text-anchor="middle" class="lbl sub">Object is the diamond's fallback, not a guess at intent</text>

  <path class="flow" d="M 270 300 V 322"/>

  <rect x="20" y="324" width="500" height="56" rx="6" class="boxP"/>
  <text x="270" y="348" text-anchor="middle" class="lbl body">positions.get(0).amount()</text>
  <text x="270" y="366" text-anchor="middle" class="lbl sub">get(0) returns Object</text>

  <path class="flow" d="M 270 380 V 402"/>

  <rect x="20" y="404" width="500" height="70" rx="6" class="boxD"/>
  <text x="270" y="426" text-anchor="middle" class="lbl node" fill="#b91c1c">compile error: cannot find symbol</text>
  <text x="270" y="446" text-anchor="middle" class="lbl sub">amount() is undefined for Object</text>
  <text x="270" y="462" text-anchor="middle" class="lbl sub">Position::amount() never comes into it</text>

  <!-- RIGHT -->
  <rect x="580" y="90" width="500" height="60" rx="6" class="boxP"/>
  <text x="830" y="115" text-anchor="middle" class="lbl body">var positions = new ArrayList&lt;Position&gt;();</text>
  <text x="830" y="133" text-anchor="middle" class="lbl sub">declared type: var, initializer: targeted diamond</text>

  <path class="flow" d="M 830 150 V 172"/>

  <rect x="580" y="174" width="500" height="46" rx="6" class="boxW"/>
  <text x="830" y="202" text-anchor="middle" class="lbl body">diamond &lt;&gt; has explicit target type Position</text>

  <path class="flow" d="M 830 220 V 242"/>

  <rect x="580" y="244" width="500" height="56" rx="6" class="boxH"/>
  <text x="830" y="268" text-anchor="middle" class="lbl node">resolves to ArrayList&lt;Position&gt;</text>
  <text x="830" y="286" text-anchor="middle" class="lbl sub">Position flows from the diamond, not var</text>

  <path class="flow" d="M 830 300 V 322"/>

  <rect x="580" y="324" width="500" height="56" rx="6" class="boxP"/>
  <text x="830" y="348" text-anchor="middle" class="lbl body">positions.get(0).amount()</text>
  <text x="830" y="366" text-anchor="middle" class="lbl sub">get(0) returns Position</text>

  <path class="flow" d="M 830 380 V 402"/>

  <rect x="580" y="404" width="500" height="70" rx="6" class="boxR"/>
  <text x="830" y="426" text-anchor="middle" class="lbl node" fill="#15803d">compiles</text>
  <text x="830" y="446" text-anchor="middle" class="lbl sub">Position::amount() returns Money</text>
  <text x="830" y="462" text-anchor="middle" class="lbl sub">no cast, no unchecked warning</text>

  <!-- annotation -->
  <rect x="20" y="494" width="1060" height="62" rx="6" class="panel"/>
  <text x="36" y="514" class="lbl tiny" font-weight="700">the rule</text>
  <text x="36" y="533" class="lbl tiny">var never infers from a variable's later use — only from the initializer on the same line.</text>
  <text x="36" y="549" class="lbl tiny">With no target type anywhere on that line, an empty diamond has nothing to infer from but Object.</text>

  <!-- legend -->
  <line x1="20" y1="580" x2="1100" y2="580" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="594" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="607" class="lbl tiny">declaration / usage line</text>
  <rect x="240" y="594" width="22" height="16" rx="3" class="boxW"/>
  <text x="270" y="607" class="lbl tiny">inference reasoning step</text>
  <rect x="470" y="594" width="22" height="16" rx="3" class="boxH"/>
  <text x="500" y="607" class="lbl tiny">the inferred generic type</text>
  <rect x="700" y="594" width="22" height="16" rx="3" class="boxD"/>
  <text x="730" y="607" class="lbl tiny">compile error</text>
  <rect x="850" y="594" width="22" height="16" rx="3" class="boxR"/>
  <text x="880" y="607" class="lbl tiny">compiles successfully</text>
</svg>
