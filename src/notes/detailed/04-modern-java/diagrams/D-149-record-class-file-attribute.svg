<svg viewBox="0 0 1040 940" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The class file of StakeSplit: a public final class extending java.lang.Record,
     itself abstract and declaring abstract equals, hashCode and toString. StakeSplit carries
     private final fields bonusPortion and cashPortion, both java.math.BigDecimal, and public
     accessors bonusPortion and cashPortion. Its Record attribute, verified with javap dash v,
     holds two record_component_info entries, bonusPortion at name_index 11 descriptor_index 12
     and cashPortion at name_index 15 descriptor_index 12, each compiled here with zero
     attributes because neither component carries an annotation. A separate verified compile of
     the same record shape with annotations added shows what those attribute slots hold when
     populated: RuntimeVisibleAnnotations for a record-component-targeted annotation, Signature
     for a generic component type, and RuntimeVisibleTypeAnnotations for a type-use annotation.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pill  { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#triS); }
  </style>
  <defs>
    <marker id="triS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="940" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE Record CLASS-FILE ATTRIBUTE — StakeSplit.class</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="980" y="20" width="30" height="20" rx="4" class="pill"/>
  <text x="995" y="35" text-anchor="middle" class="lbl tiny" font-weight="700">21</text>

  <!-- StakeSplit class box -->
  <rect x="40" y="58" width="560" height="210" rx="6" class="boxP"/>
  <text x="60" y="82" class="lbl node mono">public final class StakeSplit</text>
  <text x="60" y="100" class="lbl sub">extends java.lang.Record</text>
  <line x1="60" y1="110" x2="580" y2="110" stroke="#2563eb" stroke-width="1"/>
  <text x="60" y="130" class="lbl dense">private final BigDecimal bonusPortion</text>
  <text x="60" y="148" class="lbl dense">private final BigDecimal cashPortion</text>
  <text x="60" y="168" class="lbl sub">StakeSplit(BigDecimal, BigDecimal) — canonical ctor</text>
  <text x="60" y="186" class="lbl dense" font-weight="600">public BigDecimal bonusPortion()</text>
  <text x="60" y="204" class="lbl dense" font-weight="600">public BigDecimal cashPortion()</text>
  <text x="60" y="228" class="lbl sub">public final String toString() / int hashCode() /</text>
  <text x="60" y="242" class="lbl sub">boolean equals(Object) — invokedynamic, ObjectMethods.bootstrap</text>
  <text x="60" y="258" class="lbl sub" font-style="italic">flags: ACC_PUBLIC, ACC_FINAL, ACC_SUPER — javap -v, verified</text>

  <!-- java.lang.Record -->
  <rect x="680" y="80" width="320" height="140" rx="6" class="boxW"/>
  <text x="840" y="104" text-anchor="middle" class="lbl node mono">java.lang.Record</text>
  <text x="840" y="126" text-anchor="middle" class="lbl sub">abstract class, in java.lang</text>
  <text x="840" y="146" text-anchor="middle" class="lbl sub">declares abstract equals(Object)</text>
  <text x="840" y="162" text-anchor="middle" class="lbl sub">declares abstract hashCode()</text>
  <text x="840" y="178" text-anchor="middle" class="lbl sub">declares abstract toString()</text>
  <text x="840" y="200" text-anchor="middle" class="lbl sub">StakeSplit supplies all three via indy</text>

  <path class="flow" d="M 600 130 H 640 V 150 H 680"/>
  <text x="640" y="122" text-anchor="middle" class="lbl tiny" font-weight="700">extends</text>

  <!-- Record attribute expanded -->
  <text x="20" y="300" class="lbl h2">Record ATTRIBUTE — EXPANDED, javap -v StakeSplit.class</text>

  <rect x="40" y="316" width="960" height="200" rx="6" class="boxH"/>
  <text x="60" y="340" class="lbl body" font-weight="700">Record { u2 attribute_name_index; u4 attribute_length; u2 components_count = 2; record_component_info[] }</text>

  <rect x="60" y="356" width="450" height="140" rx="6" class="boxA"/>
  <text x="80" y="378" class="lbl dense" font-weight="700">record_component_info [0]</text>
  <text x="80" y="398" class="lbl tiny mono">name_index = #11  // "bonusPortion"</text>
  <text x="80" y="414" class="lbl tiny mono">descriptor_index = #12  // "Ljava/math/BigDecimal;"</text>
  <text x="80" y="434" class="lbl tiny">attributes_count = 0 as compiled here</text>
  <text x="80" y="452" class="lbl tiny">(no Signature / no RuntimeVisible*Annotations —</text>
  <text x="80" y="468" class="lbl tiny">bonusPortion carries no annotation in this source)</text>
  <text x="80" y="486" class="lbl sub">verified: javap -v StakeSplit.class, "Record:" section</text>

  <rect x="530" y="356" width="450" height="140" rx="6" class="boxA"/>
  <text x="550" y="378" class="lbl dense" font-weight="700">record_component_info [1]</text>
  <text x="550" y="398" class="lbl tiny mono">name_index = #15  // "cashPortion"</text>
  <text x="550" y="414" class="lbl tiny mono">descriptor_index = #12  // "Ljava/math/BigDecimal;"</text>
  <text x="550" y="434" class="lbl tiny">attributes_count = 0 as compiled here</text>
  <text x="550" y="452" class="lbl tiny">same descriptor index as [0] — both components</text>
  <text x="550" y="468" class="lbl tiny">share the BigDecimal descriptor UTF8 entry</text>
  <text x="550" y="486" class="lbl sub">verified: javap -v StakeSplit.class, "Record:" section</text>

  <!-- verified-separately panel for populated attributes -->
  <text x="20" y="548" class="lbl h2">THE SAME ATTRIBUTE SLOTS, POPULATED — VERIFIED ON A SIBLING COMPILE</text>

  <rect x="40" y="564" width="960" height="200" rx="6" class="boxW"/>
  <text x="60" y="588" class="lbl body" font-weight="700">record StakeSplit(@Audited @Sensitive BigDecimal bonusPortion, List&lt;@Sensitive String&gt; voidReasons)</text>
  <text x="60" y="604" class="lbl sub">a record of the same shape, annotated, compiled and disassembled to show what a populated component's attribute list looks like</text>

  <rect x="60" y="616" width="450" height="130" rx="6" class="boxA"/>
  <text x="80" y="638" class="lbl dense" font-weight="700">bonusPortion component attributes</text>
  <text x="80" y="658" class="lbl tiny mono">RuntimeVisibleAnnotations: 0: Audited</text>
  <text x="80" y="676" class="lbl tiny mono">RuntimeVisibleTypeAnnotations:</text>
  <text x="80" y="692" class="lbl tiny mono">  0: Sensitive — target FIELD</text>
  <text x="80" y="712" class="lbl sub">@Audited targets ElementType.RECORD_COMPONENT</text>
  <text x="80" y="728" class="lbl sub">so javac copies it onto record_component_info too</text>

  <rect x="530" y="616" width="450" height="130" rx="6" class="boxA"/>
  <text x="550" y="638" class="lbl dense" font-weight="700">voidReasons component attributes</text>
  <text x="550" y="658" class="lbl tiny mono">Signature: Ljava/util/List&lt;Ljava/lang/String;&gt;;</text>
  <text x="550" y="678" class="lbl tiny mono">RuntimeVisibleTypeAnnotations:</text>
  <text x="550" y="694" class="lbl tiny mono">  0: Sensitive — FIELD, TYPE_ARGUMENT(0)</text>
  <text x="550" y="714" class="lbl sub">Signature appears because List&lt;String&gt;'s generic</text>
  <text x="550" y="730" class="lbl sub">form differs from its erased descriptor Ljava/util/List;</text>

  <rect x="40" y="774" width="960" height="66" rx="6" class="boxA"/>
  <text x="60" y="796" class="lbl tiny" font-weight="700">why this matters for StakeSplit's real components</text>
  <text x="60" y="814" class="lbl tiny">bonusPortion and cashPortion are plain BigDecimal — non-generic, unannotated — so their record_component_info entries</text>
  <text x="60" y="830" class="lbl tiny">carry only name_index and descriptor_index; the Signature / annotation slots exist in the format but stay empty here.</text>

  <!-- legend -->
  <line x1="20" y1="856" x2="1020" y2="856" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="864" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="876" class="lbl tiny">StakeSplit — subject class</text>
  <rect x="230" y="864" width="20" height="14" rx="3" class="boxW"/>
  <text x="256" y="876" class="lbl tiny">legacy / structural type (Record)</text>
  <rect x="470" y="864" width="20" height="14" rx="3" class="boxH"/>
  <text x="496" y="876" class="lbl tiny">the attribute this diagram is about</text>
  <rect x="710" y="864" width="20" height="14" rx="3" class="boxA"/>
  <text x="736" y="876" class="lbl tiny">expanded detail / annotation panel</text>
  <path class="flow" d="M 20 906 H 60"/>
  <text x="68" y="911" class="lbl tiny">A → B : B extends A</text>
</svg>
