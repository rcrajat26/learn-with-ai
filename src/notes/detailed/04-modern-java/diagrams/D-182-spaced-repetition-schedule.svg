<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A 21-day spaced-repetition axis for the Modern Java topic with four marked points. Day 1: full read of every 01-basics, 02-in-practice and 03-internals file plus 00-index.md. Day 3: the atomic concept checklist at the end of 95-traps-drills-and-checklist.md. Day 7: numbers and mechanism drills from 90-interview-basics.md and 91-interview-intermediate.md. Day 14: code-reading and symptom drills from 92-interview-internals.md's puzzles and build-it/07-diagnostic-harnesses.md. Day 21: build two Part 4 items from the build-it files, for example build-it/02-mystream.md and build-it/05-concurrency-builds.md.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE SPACED-REPETITION SCHEDULE — 21 DAYS</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- axis: evenly spaced ticks in day 1 -> 3 -> 7 -> 14 -> 21 order -->
  <path class="flow" d="M 60 90 H 1000"/>
  <line x1="60" y1="80" x2="60" y2="100" stroke="#475569" stroke-width="2"/>
  <text x="60" y="70" text-anchor="middle" class="lbl node">day 1</text>

  <line x1="295" y1="84" x2="295" y2="96" stroke="#475569" stroke-width="1.6"/>
  <text x="295" y="70" text-anchor="middle" class="lbl node">day 3</text>

  <line x1="530" y1="84" x2="530" y2="96" stroke="#475569" stroke-width="1.6"/>
  <text x="530" y="70" text-anchor="middle" class="lbl node">day 7</text>

  <line x1="765" y1="84" x2="765" y2="96" stroke="#475569" stroke-width="1.6"/>
  <text x="765" y="70" text-anchor="middle" class="lbl node">day 14</text>

  <line x1="1000" y1="80" x2="1000" y2="100" stroke="#475569" stroke-width="2"/>
  <text x="1000" y="70" text-anchor="middle" class="lbl node">day 21</text>

  <!-- day 1 card -->
  <path class="flow" d="M 60 96 V 150"/>
  <rect x="20" y="150" width="210" height="140" rx="6" class="boxP"/>
  <text x="125" y="172" text-anchor="middle" class="lbl node">FULL READ</text>
  <text x="125" y="192" text-anchor="middle" class="lbl dense">every 01-basics,</text>
  <text x="125" y="208" text-anchor="middle" class="lbl dense">02-in-practice, 03-internals</text>
  <text x="125" y="224" text-anchor="middle" class="lbl dense">across all 14 subtopics</text>
  <text x="125" y="248" text-anchor="middle" class="lbl sub">start at 00-index.md,</text>
  <text x="125" y="264" text-anchor="middle" class="lbl sub">follow its Next-file chain</text>

  <!-- day 3 card -->
  <path class="flow" d="M 295 96 V 150"/>
  <rect x="250" y="150" width="210" height="140" rx="6" class="boxH"/>
  <text x="355" y="172" text-anchor="middle" class="lbl node">ATOMIC CONCEPT</text>
  <text x="355" y="188" text-anchor="middle" class="lbl node">CHECKLIST</text>
  <text x="355" y="212" text-anchor="middle" class="lbl dense">95-traps-drills-and-</text>
  <text x="355" y="228" text-anchor="middle" class="lbl dense">checklist.md</text>
  <text x="355" y="252" text-anchor="middle" class="lbl sub">the flat checklist at its end;</text>
  <text x="355" y="266" text-anchor="middle" class="lbl sub">92-interview-internals.md</text>
  <text x="355" y="280" text-anchor="middle" class="lbl sub">only points to it</text>

  <!-- day 7 card -->
  <path class="flow" d="M 530 96 V 150"/>
  <rect x="480" y="150" width="210" height="140" rx="6" class="boxR"/>
  <text x="585" y="172" text-anchor="middle" class="lbl node">NUMBERS AND</text>
  <text x="585" y="188" text-anchor="middle" class="lbl node">MECHANISM DRILLS</text>
  <text x="585" y="212" text-anchor="middle" class="lbl dense">90-interview-basics.md</text>
  <text x="585" y="228" text-anchor="middle" class="lbl dense">91-interview-</text>
  <text x="585" y="244" text-anchor="middle" class="lbl dense">intermediate.md</text>
  <text x="585" y="266" text-anchor="middle" class="lbl sub">re-derive maxPoolSize,</text>
  <text x="585" y="280" text-anchor="middle" class="lbl sub">LEAF_TARGET, commonPool width</text>

  <!-- day 14 card -->
  <path class="flow" d="M 765 96 V 150"/>
  <rect x="710" y="150" width="210" height="140" rx="6" class="boxW"/>
  <text x="815" y="172" text-anchor="middle" class="lbl node">CODE-READING AND</text>
  <text x="815" y="188" text-anchor="middle" class="lbl node">SYMPTOM DRILLS</text>
  <text x="815" y="212" text-anchor="middle" class="lbl dense">92-interview-internals.md</text>
  <text x="815" y="228" text-anchor="middle" class="lbl dense">build-it/07-diagnostic-</text>
  <text x="815" y="244" text-anchor="middle" class="lbl dense">harnesses.md</text>
  <text x="815" y="266" text-anchor="middle" class="lbl sub">predict-the-output puzzles;</text>
  <text x="815" y="280" text-anchor="middle" class="lbl sub">the fifteen-snippet puzzler set</text>

  <!-- day 21 card, second row under the day 21 tick -->
  <path class="flow" d="M 1000 96 V 330"/>
  <rect x="780" y="330" width="240" height="190" rx="6" class="boxAnn"/>
  <text x="900" y="352" text-anchor="middle" class="lbl node">BUILD TWO</text>
  <text x="900" y="370" text-anchor="middle" class="lbl node">PART 4 ITEMS</text>
  <text x="900" y="392" text-anchor="middle" class="lbl dense">any two build-it/*.md, e.g.</text>
  <text x="900" y="410" text-anchor="middle" class="lbl dense">02-mystream.md</text>
  <text x="900" y="426" text-anchor="middle" class="lbl dense">05-concurrency-builds.md</text>
  <text x="900" y="450" text-anchor="middle" class="lbl sub">from memory, then diff</text>
  <text x="900" y="464" text-anchor="middle" class="lbl sub">against the file's reference</text>
  <text x="900" y="478" text-anchor="middle" class="lbl sub">implementation and its</text>
  <text x="900" y="492" text-anchor="middle" class="lbl sub">JMH numbers</text>

  <!-- why-this-spacing annotation, same row, left of the day 21 card -->
  <rect x="20" y="330" width="740" height="190" rx="6" class="boxAnn"/>
  <text x="36" y="352" class="lbl node">WHY THIS SPACING</text>
  <text x="36" y="374" class="lbl tiny">Each interval roughly doubles the last: 1 → 3 → 7 → 14 → 21 days.</text>
  <text x="36" y="392" class="lbl tiny">That pushes retrieval further from the original read every time.</text>
  <text x="36" y="410" class="lbl tiny">Day 1 lays the material down; day 3 tests naming, no time pressure.</text>
  <text x="36" y="428" class="lbl tiny">Day 7 tests numbers and mechanism — these decay fastest of all.</text>
  <text x="36" y="446" class="lbl tiny">Day 14 tests reading someone else's code and diagnosing a symptom.</text>
  <text x="36" y="464" class="lbl tiny">Day 21 tests production: writing the thing, not just recognising it.</text>
  <text x="36" y="486" class="lbl sub">Restart the clock at day 1 once a topic's note set is finished.</text>
  <text x="36" y="502" class="lbl sub">Cross-topic: log the actual calendar date reached, not the day offset.</text>

  <line x1="20" y1="546" x2="1020" y2="546" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="558" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="571" class="lbl tiny">day 1 — read</text>
  <rect x="180" y="558" width="22" height="16" rx="3" class="boxH"/>
  <text x="210" y="571" class="lbl tiny">day 3 — checklist</text>
  <rect x="360" y="558" width="22" height="16" rx="3" class="boxR"/>
  <text x="390" y="571" class="lbl tiny">day 7 — numbers/mechanism</text>
  <rect x="600" y="558" width="22" height="16" rx="3" class="boxW"/>
  <text x="630" y="571" class="lbl tiny">day 14 — code/symptom</text>
  <rect x="820" y="558" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="850" y="571" class="lbl tiny">day 21 — build</text>
  <path class="flow" d="M 20 592 H 60"/>
  <text x="68" y="597" class="lbl tiny">time axis / order of the schedule</text>
</svg>
