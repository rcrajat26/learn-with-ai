<svg viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two scheduling policies compared. Left: the virtual-thread scheduler runs a ForkJoinPool built with asyncMode true, marked FIFO in the JDK source, queueing independent onboarding and payment tasks head-first for fairness. Right: ForkJoinPool.commonPool executes a parallel stream over 2.8 million stake reservations by recursive splitting; each worker's own deque is LIFO push and pop at its own head, while idle workers steal from the opposite tail, prioritising cache locality.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #4b5563; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .impl  { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; marker-end: url(#triG); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FIFO FOR VIRTUAL THREADS, LIFO FOR PARALLEL STREAMS</text>
  <line x1="20" y1="44" x2="1100" y2="44" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT PANEL -->
  <text x="20" y="68" class="lbl h2">VIRTUAL-THREAD SCHEDULER — asyncMode = true // FIFO</text>
  <rect x="20" y="80" width="520" height="1" fill="none"/>

  <rect x="20" y="90" width="520" height="56" rx="6" class="boxA"/>
  <text x="30" y="108" class="lbl body" font-weight="700">new ForkJoinPool(parallelism, factory, handler,</text>
  <text x="30" y="124" class="lbl mono">  asyncMode=true, 0, maxPoolSize, minRunnable, ...)</text>
  <text x="30" y="140" class="lbl sub">JDK source comment on that line: // FIFO</text>

  <!-- queue drawn head-first -->
  <text x="30" y="172" class="lbl body" font-weight="700">Submission queue — head served first</text>
  <rect x="30" y="182" width="90" height="46" rx="4" class="boxP"/>
  <text x="75" y="200" text-anchor="middle" class="lbl tiny">HEAD</text>
  <text x="75" y="216" text-anchor="middle" class="lbl sub">served next</text>

  <rect x="130" y="182" width="150" height="46" rx="4" class="boxW"/>
  <text x="205" y="200" text-anchor="middle" class="lbl tiny">handleReserveStake</text>
  <text x="205" y="215" text-anchor="middle" class="lbl sub">(client A)</text>

  <rect x="290" y="182" width="150" height="46" rx="4" class="boxW"/>
  <text x="365" y="200" text-anchor="middle" class="lbl tiny">handleSettleStake</text>
  <text x="365" y="215" text-anchor="middle" class="lbl sub">(client B)</text>

  <rect x="450" y="182" width="90" height="46" rx="4" class="boxW"/>
  <text x="495" y="200" text-anchor="middle" class="lbl tiny">TAIL</text>
  <text x="495" y="215" text-anchor="middle" class="lbl sub">enqueued last</text>

  <path class="flow" d="M 120 205 H 130"/>
  <path class="flow" d="M 280 205 H 290"/>
  <path class="flow" d="M 440 205 H 450"/>

  <rect x="30" y="248" width="510" height="56" rx="4" class="boxW"/>
  <text x="40" y="266" class="lbl tiny" font-weight="700">independent tasks — no data relationship</text>
  <text x="40" y="284" class="lbl sub">handleReserveStake(client A), handleSettleStake(client B),</text>
  <text x="40" y="298" class="lbl sub">handleWithdrawal(client C) — one virtual thread each, no shared parent</text>

  <rect x="30" y="322" width="510" height="120" rx="6" class="boxA"/>
  <text x="40" y="340" class="lbl tiny" font-weight="700">Why FIFO here</text>
  <text x="40" y="358" class="lbl tiny">Tasks are unrelated client requests, not a decomposition of one job.</text>
  <text x="40" y="374" class="lbl tiny">Fairness is prioritised over locality: the request that arrived first</text>
  <text x="40" y="390" class="lbl tiny">(client A's stake reservation) should not starve behind a burst of</text>
  <text x="40" y="406" class="lbl tiny">later arrivals. There is no cache-warm parent task to stay near, so</text>
  <text x="40" y="422" class="lbl tiny">there is nothing LIFO would buy — asyncMode=true drains head-first.</text>

  <rect x="30" y="458" width="510" height="70" rx="6" class="boxH"/>
  <text x="40" y="476" class="lbl tiny" font-weight="700">Scheduler sizing (8-core box)</text>
  <text x="40" y="494" class="lbl mono">parallelism = availableProcessors() = 8</text>
  <text x="40" y="510" class="lbl mono">maxPoolSize = max(8, 256) = 256   minRunnable = max(8/2,1) = 4</text>

  <!-- divider -->
  <line x1="560" y1="60" x2="560" y2="660" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- RIGHT PANEL -->
  <text x="580" y="68" class="lbl h2">COMMON POOL — LIFO work-stealing deque per worker</text>

  <rect x="580" y="90" width="520" height="56" rx="6" class="boxA"/>
  <text x="590" y="108" class="lbl body" font-weight="700">2,800,000 stake reservations . parallelStream()</text>
  <text x="590" y="124" class="lbl mono">LEAF_TARGET = 7 &lt;&lt; 2 = 28   suggestTargetSize = 2,800,000/28</text>
  <text x="590" y="140" class="lbl sub">= 100,000 exactly (floored, clamped to min 1) — 28 leaf tasks</text>

  <rect x="590" y="182" width="500" height="70" rx="4" class="boxW"/>
  <text x="600" y="200" class="lbl tiny" font-weight="700">recursive split — RecursiveTask&lt;BigDecimal&gt;</text>
  <text x="600" y="218" class="lbl sub">splits until each leaf covers 100,000 reservations, forking the</text>
  <text x="600" y="234" class="lbl sub">right half and computing the left half inline (compute-left-fork-right)</text>

  <text x="590" y="270" class="lbl body" font-weight="700">Worker's own deque — owner pushes / pops its own head</text>
  <rect x="590" y="280" width="150" height="52" rx="4" class="boxP"/>
  <text x="665" y="298" text-anchor="middle" class="lbl tiny">HEAD (own)</text>
  <text x="665" y="314" text-anchor="middle" class="lbl sub">push/pop, LIFO</text>

  <rect x="750" y="280" width="150" height="52" rx="4" class="boxW"/>
  <text x="825" y="298" text-anchor="middle" class="lbl tiny">forked subtask</text>
  <text x="825" y="314" text-anchor="middle" class="lbl sub">right half, 100k rows</text>

  <rect x="910" y="280" width="130" height="52" rx="4" class="boxR"/>
  <text x="975" y="296" text-anchor="middle" class="lbl tiny">TAIL</text>
  <text x="975" y="312" text-anchor="middle" class="lbl sub">thief steals here</text>

  <path class="flow" d="M 740 306 H 750"/>
  <path class="impl" d="M 1040 306 H 1085 V 356 H 900"/>
  <text x="960" y="348" class="lbl sub" text-anchor="middle">idle worker steals from tail</text>

  <rect x="590" y="352" width="300" height="52" rx="4" class="boxR"/>
  <text x="740" y="370" text-anchor="middle" class="lbl tiny">idle worker's own deque</text>
  <text x="740" y="386" text-anchor="middle" class="lbl sub">steals opposite end (tail), then splits it further</text>

  <rect x="590" y="426" width="510" height="120" rx="6" class="boxA"/>
  <text x="600" y="444" class="lbl tiny" font-weight="700">Why LIFO here</text>
  <text x="600" y="462" class="lbl tiny">Subtasks come from recursively splitting one job. The task the owner</text>
  <text x="600" y="478" class="lbl tiny">just forked is the most cache-hot: its data and the parent's working</text>
  <text x="600" y="494" class="lbl tiny">set are still warm. Popping the own-head (LIFO) resumes that hot</text>
  <text x="600" y="510" class="lbl tiny">task first; thieves take from the opposite tail so they steal the</text>
  <text x="600" y="526" class="lbl tiny">coarsest, least-recently-touched subtask — locality over fairness.</text>

  <rect x="590" y="562" width="510" height="70" rx="6" class="boxH"/>
  <text x="600" y="580" class="lbl tiny" font-weight="700">Common pool width (8-core box)</text>
  <text x="600" y="598" class="lbl mono">getCommonPoolParallelism() = 8 - 1 = 7</text>
  <text x="600" y="614" class="lbl mono">+ submitting thread participates ⇒ effective width = 8</text>

  <!-- legend -->
  <line x1="20" y1="648" x2="1100" y2="648" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="658" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="670" class="lbl tiny">queue/deque head</text>
  <rect x="220" y="658" width="20" height="14" rx="3" class="boxW"/>
  <text x="246" y="670" class="lbl tiny">independent / pending task</text>
  <rect x="480" y="658" width="20" height="14" rx="3" class="boxR"/>
  <text x="506" y="670" class="lbl tiny">tail / thief side</text>
  <rect x="680" y="658" width="20" height="14" rx="3" class="boxA"/>
  <text x="706" y="670" class="lbl tiny">annotation / sizing panel</text>
  <rect x="20" y="678" width="20" height="14" rx="3" class="boxH"/>
  <text x="46" y="690" class="lbl tiny">version / sizing constant</text>
  <path class="flow" d="M 250 685 H 290"/>
  <text x="298" y="690" class="lbl tiny">enqueue / dequeue order</text>
  <path class="impl" d="M 500 685 H 540"/>
  <text x="548" y="690" class="lbl tiny">work-steal, dashed</text>
</svg>
