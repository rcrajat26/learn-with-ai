<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Capture is by value and only of effectively-final locals. Panel one: the stack frame for FundsLedger.reserveStake holds this and the effectively-final local stake, a Money of amount 4.20; the lambda spun onto the heap gets its own field copying that reference, and both the stack slot and the lambda field point at the same Money object on the heap, so the reference is copied at capture, not the object. Panel two: an instance field dailyTotal, 42, is not copied into the lambda at all; the lambda only captures this, and reads dailyTotal through this at invocation time, so a later write to dailyTotal is visible when the lambda runs.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: .3px; }

    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">CAPTURE IS BY VALUE, AND ONLY OF EFFECTIVELY-FINAL LOCALS</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- PANEL 1 -->
  <text x="20" y="66" class="lbl h2">PANEL 1 — CAPTURING A LOCAL: FundsLedger.reserveStake(Money stake)</text>
  <line x1="20" y1="74" x2="1100" y2="74" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="90" width="380" height="140" rx="6" class="boxL"/>
  <text x="80" y="114" class="lbl node">STACK — reserveStake(...)</text>
  <text x="80" y="140" class="lbl body">this → FundsLedger instance</text>
  <text x="80" y="162" class="lbl body">stake → Money(4.20)</text>
  <text x="80" y="182" class="lbl sub">[effectively final]</text>
  <text x="80" y="204" class="lbl sub">local variable slot in this frame</text>

  <rect x="560" y="90" width="460" height="140" rx="6" class="boxH"/>
  <text x="580" y="114" class="lbl node">HEAP — lambda object (capture)</text>
  <text x="580" y="140" class="lbl body">field$stake → Money(4.20)</text>
  <text x="580" y="162" class="lbl sub">one field per captured value</text>
  <text x="580" y="182" class="lbl sub">copied at capture — the reference,</text>
  <text x="580" y="198" class="lbl sub">not the Money object, is copied</text>

  <path class="flow" d="M 380 230 V 255 H 660 V 280"/>
  <path class="flow" d="M 760 230 V 280"/>

  <rect x="590" y="280" width="300" height="70" rx="6" class="boxR"/>
  <text x="740" y="308" text-anchor="middle" class="lbl node">Money(4.20)</text>
  <text x="740" y="330" text-anchor="middle" class="lbl sub">one shared instance on the heap</text>

  <rect x="60" y="370" width="1000" height="70" rx="6" class="panel"/>
  <text x="80" y="392" class="lbl body" font-weight="700">COPIED AT CAPTURE</text>
  <text x="80" y="410" class="lbl tiny">The lambda gets its own field holding the same Money reference — the object is not copied, only the reference.</text>
  <text x="80" y="426" class="lbl tiny">Reassigning stake in the enclosing method after this point would be a compile error: capture requires effective finality.</text>

  <!-- PANEL 2 -->
  <text x="20" y="480" class="lbl h2">PANEL 2 — READING AN INSTANCE FIELD: BonusService.dailyTotal</text>
  <line x1="20" y1="488" x2="1100" y2="488" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="506" width="380" height="100" rx="6" class="boxL"/>
  <text x="80" y="530" class="lbl node">STACK — enclosing instance method</text>
  <text x="80" y="556" class="lbl body">this → BonusService instance</text>
  <text x="80" y="578" class="lbl sub">no local captured — dailyTotal is a field</text>

  <path class="flow" d="M 440 556 H 560"/>
  <text x="500" y="548" text-anchor="middle" class="lbl tiny">this</text>

  <rect x="560" y="506" width="460" height="100" rx="6" class="boxP"/>
  <text x="580" y="530" class="lbl node">BonusService instance</text>
  <text x="580" y="556" class="lbl body">dailyTotal = 42 (mutable field)</text>
  <text x="580" y="578" class="lbl sub">read through this, not copied</text>

  <text x="710" y="638" class="lbl tiny" font-weight="600">this</text>
  <path class="flow" d="M 770 650 V 606"/>

  <rect x="620" y="650" width="400" height="90" rx="6" class="boxH"/>
  <text x="820" y="678" text-anchor="middle" class="lbl node">lambda (captures this only)</text>
  <text x="820" y="700" text-anchor="middle" class="lbl sub">no field for dailyTotal —</text>
  <text x="820" y="716" text-anchor="middle" class="lbl sub">reads this.dailyTotal at invocation time</text>

  <rect x="60" y="760" width="1000" height="90" rx="6" class="panel"/>
  <text x="80" y="782" class="lbl body" font-weight="700">READ THROUGH this AT INVOCATION</text>
  <text x="80" y="800" class="lbl tiny">The lambda stores only a this reference. dailyTotal is read from BonusService at invocation time, so a write to</text>
  <text x="80" y="816" class="lbl tiny">dailyTotal after the lambda is created — but before it runs — is visible when it runs. No field copy exists to go stale.</text>

  <!-- LEGEND -->
  <line x1="20" y1="862" x2="1100" y2="862" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="872" width="22" height="14" rx="3" class="boxL"/>
  <text x="50" y="884" class="lbl tiny">stack frame (structural)</text>
  <rect x="230" y="872" width="22" height="14" rx="3" class="boxP"/>
  <text x="260" y="884" class="lbl tiny">enclosing instance (mutable state)</text>
  <rect x="500" y="872" width="22" height="14" rx="3" class="boxH"/>
  <text x="530" y="884" class="lbl tiny">lambda object</text>
  <rect x="650" y="872" width="22" height="14" rx="3" class="boxR"/>
  <text x="680" y="884" class="lbl tiny">heap object (concrete)</text>
  <path class="flow" d="M 850 879 H 890"/>
  <text x="898" y="884" class="lbl tiny">A → B : reference / this points to B</text>
</svg>
