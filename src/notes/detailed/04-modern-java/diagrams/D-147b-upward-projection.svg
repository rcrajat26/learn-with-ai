<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 2 of 3. Upward projection replaces the non-denotable capture variable
     CAP hash 1 with its upper bound Money, because a denotable type is required before the
     inference result can be written into the class file's LocalVariableTable.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node { font-size: 15px; font-weight: 600; }
    .body { font-size: 13px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxA { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pill { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }
    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">D-147b — FRAME 2 OF 3 — UPWARD PROJECTION (JLS 5.1.10)</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="750" y="20" width="30" height="20" rx="4" class="pill"/>
  <text x="765" y="35" text-anchor="middle" class="lbl tiny" font-weight="700">21</text>

  <rect x="70" y="150" width="240" height="100" rx="6" class="boxW"/>
  <text x="190" y="182" text-anchor="middle" class="lbl node mono">CAP#1</text>
  <text x="190" y="204" text-anchor="middle" class="lbl sub">non-denotable</text>
  <text x="190" y="220" text-anchor="middle" class="lbl sub">upper bound Money</text>

  <path class="flow" d="M 310 200 H 580"/>
  <text x="445" y="188" text-anchor="middle" class="lbl tiny" font-weight="700">upward projection</text>
  <text x="445" y="216" text-anchor="middle" class="lbl sub">replace capture with its bound</text>

  <rect x="590" y="150" width="240" height="100" rx="6" class="boxP"/>
  <text x="710" y="182" text-anchor="middle" class="lbl node mono">Money</text>
  <text x="710" y="204" text-anchor="middle" class="lbl sub">denotable — a real class name</text>
  <text x="710" y="220" text-anchor="middle" class="lbl sub">safe to write into a type slot</text>

  <rect x="80" y="290" width="740" height="70" rx="6" class="boxA"/>
  <text x="100" y="312" class="lbl body" font-weight="700">why the compiler must project</text>
  <text x="100" y="332" class="lbl tiny">local variable type inference always produces a denotable type — one you could have written by hand.</text>
  <text x="100" y="348" class="lbl tiny">CAP#1 fails that test, so it is widened to its own upper bound, Money, before inference finishes.</text>

  <line x1="20" y1="374" x2="880" y2="374" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="382" width="20" height="12" rx="3" class="boxW"/>
  <text x="46" y="392" class="lbl tiny">non-denotable input</text>
  <rect x="220" y="382" width="20" height="12" rx="3" class="boxP"/>
  <text x="246" y="392" class="lbl tiny">denotable result</text>
  <path class="flow" d="M 400 388 H 440"/>
  <text x="448" y="392" class="lbl tiny">A → B : A is projected to B</text>
</svg>
