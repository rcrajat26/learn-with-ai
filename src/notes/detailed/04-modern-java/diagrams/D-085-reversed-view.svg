<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="reversed() on a LinkedHashMap of client restrictions returns a view, not a copy. Left: clientRestrictions in insertion order (STAKE_BLOCKED from ONBOARDING, DEPOSIT_LIMITED from COMPLIANCE, WITHDRAWAL_HELD from COMPLIANCE, SELF_EXCLUDED from CLIENT) and its reversed() view, aliasing the same four entries in reverse order; calling putFirst on the view writes a new COOLING_OFF from CLIENT entry that also appears in the source map, shown as an arrow from the view back into the source. Right: an explicit copy made with new LinkedHashMap of clientRestrictions; calling putFirst on the copy adds the same new entry only to the copy, leaving the original four-entry map untouched, shown by the absence of any connecting arrow. A bottom panel notes that getFirst and getLast on an empty sequenced collection or map throw NoSuchElementException and never return null.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxW   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }
    .rowNew { fill: #fef3c7; stroke: none; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="780" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">reversed() IS A VIEW — A COPY IS NOT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="62" class="lbl h2">VIEW — clientRestrictions.reversed() aliases the same entries</text>
  <text x="590" y="62" class="lbl h2">COPY — new LinkedHashMap&lt;&gt;(clientRestrictions) isolates entries</text>

  <!-- LEFT BEFORE -->
  <text x="30" y="92" class="lbl sub">BEFORE</text>
  <rect x="30" y="100" width="230" height="150" rx="6" class="boxP"/>
  <text x="145" y="124" text-anchor="middle" class="lbl node">clientRestrictions</text>
  <text x="145" y="146" text-anchor="middle" class="lbl tiny">1st STAKE_BLOCKED · ONBOARDING</text>
  <text x="145" y="166" text-anchor="middle" class="lbl tiny">2nd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="145" y="186" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="145" y="206" text-anchor="middle" class="lbl tiny">4th SELF_EXCLUDED · CLIENT</text>

  <rect x="300" y="100" width="230" height="150" rx="6" class="boxW"/>
  <text x="415" y="124" text-anchor="middle" class="lbl node">.reversed() view</text>
  <text x="415" y="146" text-anchor="middle" class="lbl tiny">1st SELF_EXCLUDED · CLIENT</text>
  <text x="415" y="166" text-anchor="middle" class="lbl tiny">2nd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="415" y="186" text-anchor="middle" class="lbl tiny">3rd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="415" y="206" text-anchor="middle" class="lbl tiny">4th STAKE_BLOCKED · ONBOARDING</text>

  <path class="weak" d="M 300 175 H 260"/>
  <text x="280" y="230" text-anchor="middle" class="lbl sub">aliases same 4 Node</text>
  <text x="280" y="242" text-anchor="middle" class="lbl sub">objects, reverse order</text>

  <!-- LEFT AFTER -->
  <text x="30" y="282" class="lbl sub">AFTER — reversedView.putFirst(COOLING_OFF, CLIENT)</text>
  <rect x="30" y="290" width="230" height="170" rx="6" class="boxP"/>
  <text x="145" y="314" text-anchor="middle" class="lbl node">clientRestrictions</text>
  <text x="145" y="336" text-anchor="middle" class="lbl tiny">1st STAKE_BLOCKED · ONBOARDING</text>
  <text x="145" y="356" text-anchor="middle" class="lbl tiny">2nd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="145" y="376" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="145" y="396" text-anchor="middle" class="lbl tiny">4th SELF_EXCLUDED · CLIENT</text>
  <rect x="34" y="404" width="222" height="20" class="rowNew"/>
  <text x="145" y="418" text-anchor="middle" class="lbl tiny">5th COOLING_OFF · CLIENT (new)</text>

  <rect x="300" y="290" width="230" height="170" rx="6" class="boxW"/>
  <text x="415" y="314" text-anchor="middle" class="lbl node">.reversed() view</text>
  <rect x="304" y="322" width="222" height="20" class="rowNew"/>
  <text x="415" y="336" text-anchor="middle" class="lbl tiny">1st COOLING_OFF · CLIENT (new)</text>
  <text x="415" y="356" text-anchor="middle" class="lbl tiny">2nd SELF_EXCLUDED · CLIENT</text>
  <text x="415" y="376" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="415" y="396" text-anchor="middle" class="lbl tiny">4th DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="415" y="416" text-anchor="middle" class="lbl tiny">5th STAKE_BLOCKED · ONBOARDING</text>

  <path class="flow" d="M 300 375 H 260"/>
  <text x="280" y="440" text-anchor="middle" class="lbl sub">putFirst on the view =</text>
  <text x="280" y="452" text-anchor="middle" class="lbl sub">putLast on the source</text>

  <!-- RIGHT BEFORE -->
  <text x="590" y="92" class="lbl sub">BEFORE</text>
  <rect x="590" y="100" width="230" height="150" rx="6" class="boxP"/>
  <text x="705" y="124" text-anchor="middle" class="lbl node">copy</text>
  <text x="705" y="146" text-anchor="middle" class="lbl tiny">1st STAKE_BLOCKED · ONBOARDING</text>
  <text x="705" y="166" text-anchor="middle" class="lbl tiny">2nd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="705" y="186" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="705" y="206" text-anchor="middle" class="lbl tiny">4th SELF_EXCLUDED · CLIENT</text>

  <rect x="850" y="100" width="230" height="150" rx="6" class="boxP"/>
  <text x="965" y="124" text-anchor="middle" class="lbl node">clientRestrictions</text>
  <text x="965" y="146" text-anchor="middle" class="lbl tiny">1st STAKE_BLOCKED · ONBOARDING</text>
  <text x="965" y="166" text-anchor="middle" class="lbl tiny">2nd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="965" y="186" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="965" y="206" text-anchor="middle" class="lbl tiny">4th SELF_EXCLUDED · CLIENT</text>

  <text x="705" y="270" text-anchor="middle" class="lbl sub">independent objects — no shared reference between copy and clientRestrictions</text>

  <!-- RIGHT AFTER -->
  <text x="590" y="282" class="lbl sub">AFTER — copy.putFirst(COOLING_OFF, CLIENT)</text>
  <rect x="590" y="290" width="230" height="170" rx="6" class="boxP"/>
  <text x="705" y="314" text-anchor="middle" class="lbl node">copy</text>
  <rect x="594" y="322" width="222" height="20" class="rowNew"/>
  <text x="705" y="336" text-anchor="middle" class="lbl tiny">1st COOLING_OFF · CLIENT (new)</text>
  <text x="705" y="356" text-anchor="middle" class="lbl tiny">2nd STAKE_BLOCKED · ONBOARDING</text>
  <text x="705" y="376" text-anchor="middle" class="lbl tiny">3rd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="705" y="396" text-anchor="middle" class="lbl tiny">4th WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="705" y="416" text-anchor="middle" class="lbl tiny">5th SELF_EXCLUDED · CLIENT</text>

  <rect x="850" y="290" width="230" height="150" rx="6" class="boxP"/>
  <text x="965" y="314" text-anchor="middle" class="lbl node">clientRestrictions</text>
  <text x="965" y="336" text-anchor="middle" class="lbl tiny">1st STAKE_BLOCKED · ONBOARDING</text>
  <text x="965" y="356" text-anchor="middle" class="lbl tiny">2nd DEPOSIT_LIMITED · COMPLIANCE</text>
  <text x="965" y="376" text-anchor="middle" class="lbl tiny">3rd WITHDRAWAL_HELD · COMPLIANCE</text>
  <text x="965" y="396" text-anchor="middle" class="lbl tiny">4th SELF_EXCLUDED · CLIENT</text>

  <text x="705" y="474" text-anchor="middle" class="lbl sub">clientRestrictions is still unchanged — untouched by copy.putFirst, no arrow connects them</text>

  <!-- annotation -->
  <rect x="20" y="490" width="1080" height="130" rx="6" class="boxAnn"/>
  <text x="36" y="512" class="lbl node">reversed() is a VIEW — a copy is NOT</text>
  <text x="36" y="534" class="lbl tiny">reversedView.putFirst(k, v) is equivalent to clientRestrictions.putLast(k, v): the view backs onto the same Node objects, so the source map shows the write.</text>
  <text x="36" y="556" class="lbl tiny">new LinkedHashMap&lt;&gt;(clientRestrictions) allocates independent Node objects; copy.putFirst(k, v) never touches clientRestrictions — that is the whole point of copying.</text>
  <text x="36" y="586" class="lbl node">Side note: getFirst() / getLast() on an empty SequencedCollection or SequencedMap</text>
  <text x="36" y="606" class="lbl tiny">throw NoSuchElementException. They never return null — unlike Optional-returning lookups such as ClientRestrictions.find(clientId).</text>

  <line x1="20" y1="650" x2="1100" y2="650" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="662" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="675" class="lbl tiny">backing map / independent copy</text>
  <rect x="260" y="662" width="22" height="16" rx="3" class="boxW"/>
  <text x="290" y="675" class="lbl tiny">reversed() view (secondary, no storage)</text>
  <rect x="540" y="662" width="22" height="16" rx="3" class="rowNew"/>
  <text x="570" y="675" class="lbl tiny">entry added by the write</text>
  <rect x="760" y="662" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="790" y="675" class="lbl tiny">annotation panel</text>

  <path class="weak" d="M 20 700 H 60"/>
  <text x="68" y="705" class="lbl tiny">A → B : A aliases B (weak/inferred link)</text>
  <path class="flow" d="M 400 700 H 440"/>
  <text x="448" y="705" class="lbl tiny">A → B : write on A propagates to B</text>
</svg>
