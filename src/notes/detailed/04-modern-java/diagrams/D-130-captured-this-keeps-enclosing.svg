<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout before-after. Before: a static NotificationService registry holds a List of Consumer of Reservation. One entry is an instance lambda that reads this.defaultCurrency, an instance field of ProfileService. Because the lambda captures this implicitly, the spun class holds a reference to the whole ProfileService instance, which in turn retains its aggregated LimitSet and AgreementRef objects, so the static registry transitively keeps the entire ProfileService subgraph alive for the process lifetime. Retained bytes are labelled on the whole subgraph. After: the fix captures only the needed local value, defaultCurrency, copied out before the lambda is built, so the registry retains only a small Currency value and the ProfileService instance becomes collectable.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2   { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node { font-size: 14px; font-weight: 600; }
    .body { font-size: 12.5px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
    .weak { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triW); }
    .cap  { fill: none; stroke: #b91c1c; stroke-width: 2.2; marker-end: url(#triD); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="triD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">A CAPTURED this KEEPS THE ENCLOSING OBJECT ALIVE</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: BEFORE -->
  <text x="30" y="66" class="lbl h2">BEFORE — instance method reference implicitly captures this</text>
  <line x1="20" y1="74" x2="548" y2="74" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="88" width="440" height="58" rx="6" class="boxP"/>
  <text x="280" y="108" text-anchor="middle" class="lbl node">NotificationService (static registry)</text>
  <text x="280" y="128" text-anchor="middle" class="lbl body mono">static List&lt;Consumer&lt;Reservation&gt;&gt; listeners</text>

  <path class="flow" d="M 280 146 V 168"/>

  <rect x="90" y="172" width="380" height="60" rx="6" class="boxH"/>
  <text x="280" y="192" text-anchor="middle" class="lbl node">lambda: this::onReservation</text>
  <text x="280" y="210" text-anchor="middle" class="lbl body mono">r -&gt; this.log(r, this.defaultCurrency)</text>
  <text x="280" y="226" text-anchor="middle" class="lbl sub">spun class field: final ProfileService this$0</text>

  <path class="cap" d="M 280 232 V 256"/>
  <text x="360" y="248" class="lbl tiny" fill="#b91c1c" font-weight="700">captured this</text>

  <rect x="70" y="260" width="420" height="90" rx="6" class="boxD"/>
  <text x="280" y="282" text-anchor="middle" class="lbl node">ProfileService instance</text>
  <text x="280" y="300" text-anchor="middle" class="lbl body mono">Currency defaultCurrency;</text>
  <text x="280" y="318" text-anchor="middle" class="lbl body mono">LimitSet limits; AgreementRef agreement;</text>
  <text x="280" y="336" text-anchor="middle" class="lbl sub">reachable only via the lambda's this$0 field</text>

  <path class="flow" d="M 200 350 V 374"/>
  <path class="flow" d="M 360 350 V 374"/>

  <rect x="60" y="378" width="200" height="52" rx="6" class="boxW"/>
  <text x="160" y="398" text-anchor="middle" class="lbl node">LimitSet</text>
  <text x="160" y="416" text-anchor="middle" class="lbl sub">dailyDeposit, maxStake, monthlyLoss</text>

  <rect x="280" y="378" width="220" height="52" rx="6" class="boxW"/>
  <text x="390" y="398" text-anchor="middle" class="lbl node">AgreementRef</text>
  <text x="390" y="416" text-anchor="middle" class="lbl sub">documentId, version</text>

  <rect x="60" y="446" width="440" height="96" rx="6" class="boxA"/>
  <text x="76" y="466" class="lbl tiny" font-weight="700">RETAINED SUBGRAPH — whole ProfileService, transitively</text>
  <text x="76" y="484" class="lbl tiny">ProfileService + LimitSet + AgreementRef never collected while</text>
  <text x="76" y="502" class="lbl tiny mono">NotificationService.listeners holds the lambda —</text>
  <text x="76" y="518" class="lbl tiny mono">this is a leak, not a bug in GC</text>

  <!-- divider -->
  <line x1="560" y1="52" x2="560" y2="756" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- RIGHT: AFTER -->
  <text x="574" y="66" class="lbl h2">AFTER — capture only the needed local value</text>
  <line x1="562" y1="74" x2="1100" y2="74" stroke="#d1d5db" stroke-width="1"/>

  <rect x="600" y="88" width="440" height="58" rx="6" class="boxP"/>
  <text x="820" y="108" text-anchor="middle" class="lbl node">NotificationService (static registry)</text>
  <text x="820" y="128" text-anchor="middle" class="lbl body mono">static List&lt;Consumer&lt;Reservation&gt;&gt; listeners</text>

  <path class="flow" d="M 820 146 V 168"/>

  <rect x="630" y="172" width="380" height="76" rx="6" class="boxR"/>
  <text x="820" y="192" text-anchor="middle" class="lbl node">lambda: fixed local capture</text>
  <text x="820" y="210" text-anchor="middle" class="lbl body mono">Currency cur = profileService.defaultCurrency;</text>
  <text x="820" y="226" text-anchor="middle" class="lbl body mono">r -&gt; log(r, cur)</text>
  <text x="820" y="242" text-anchor="middle" class="lbl sub">spun class field: final Currency cur — value only</text>

  <path class="weak" d="M 820 248 V 272"/>
  <text x="900" y="264" class="lbl tiny" fill="#4b5563">no this$0 field</text>

  <rect x="700" y="276" width="240" height="52" rx="6" class="boxW"/>
  <text x="820" y="296" text-anchor="middle" class="lbl node">Currency (copied value)</text>
  <text x="820" y="314" text-anchor="middle" class="lbl sub">e.g. GBP — a few bytes, no back-reference</text>

  <rect x="630" y="352" width="380" height="70" rx="6" class="boxR"/>
  <text x="820" y="374" text-anchor="middle" class="lbl node">ProfileService instance</text>
  <text x="820" y="392" text-anchor="middle" class="lbl sub">no incoming edge from the lambda — collectable as</text>
  <text x="820" y="408" text-anchor="middle" class="lbl sub">soon as its own owning scope releases it</text>

  <rect x="600" y="446" width="440" height="96" rx="6" class="boxA"/>
  <text x="616" y="466" class="lbl tiny" font-weight="700">RETAINED SUBGRAPH — one Currency value</text>
  <text x="616" y="484" class="lbl tiny">ProfileService, LimitSet and AgreementRef are unreachable from</text>
  <text x="616" y="502" class="lbl tiny mono">the registry — retained set shrinks from one</text>
  <text x="616" y="518" class="lbl tiny mono">aggregate to one enum-like value</text>

  <!-- annotation panel across bottom -->
  <rect x="30" y="554" width="1060" height="130" rx="6" class="boxA"/>
  <text x="46" y="576" class="lbl tiny" font-weight="700">WHY this IS THE HIDDEN CAPTURE</text>
  <text x="46" y="596" class="lbl tiny">An instance lambda body that reads any instance field or calls any instance method of its enclosing class — even</text>
  <text x="46" y="614" class="lbl tiny">without writing "this." — captures the enclosing this implicitly. The spun class gets a final field for it (this$0),</text>
  <text x="46" y="632" class="lbl tiny">exactly like an inner class. Registering that lambda into any long-lived static collection (NotificationService's</text>
  <text x="46" y="650" class="lbl tiny">listener list) retains the whole enclosing ProfileService instance, and everything it in turn holds, for as long as</text>
  <text x="46" y="668" class="lbl tiny">the registration lives — a classic listener-leak shape, invisible at the call site because no field name is written.</text>

  <!-- legend -->
  <line x1="20" y1="700" x2="1100" y2="700" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="712" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="724" class="lbl tiny">registry / call-site</text>
  <rect x="220" y="712" width="20" height="14" rx="3" class="boxH"/>
  <text x="246" y="724" class="lbl tiny">lambda / spun class (leaking version)</text>
  <rect x="520" y="712" width="20" height="14" rx="3" class="boxR"/>
  <text x="546" y="724" class="lbl tiny">lambda / instance (fixed version)</text>
  <rect x="800" y="712" width="20" height="14" rx="3" class="boxD"/>
  <text x="826" y="724" class="lbl tiny">retained enclosing instance</text>
  <rect x="20" y="734" width="20" height="14" rx="3" class="boxW"/>
  <text x="46" y="746" class="lbl tiny">nested/aggregated value</text>
  <path class="cap" d="M 220 741 H 260"/>
  <text x="268" y="746" class="lbl tiny" fill="#b91c1c">captured this reference (strong)</text>
  <path class="weak" d="M 520 741 H 560"/>
  <text x="568" y="746" class="lbl tiny">captured value only, no back-reference</text>
</svg>
