<svg viewBox="0 0 1200 1080" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three panels on ForkJoinPool.commonPool() work stealing over stake reservation settlement tasks. Panel 1: four workers W0 through W3 each own a deque; each pushes and pops at its own head (LIFO, cache-friendly); worker W3 is idle and steals from the tail of W1's deque (FIFO from the far end), the steal arrow labelled steal from tail. Panel 2: a parallel stream over PaymentRun batches whose lambda itself starts a nested parallel stream over LedgerEntry rows; all commonPool workers become occupied by the outer level, so the inner level's subtasks queue behind them, producing the starvation shape. Panel 3: two sibling settlement subtasks race to complete a joining task; the first exception thrown by RES-201 wins and is rethrown to the joiner, while the second exception thrown moments later by RES-205 is discarded.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .fail  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triF); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
    .adapt { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triA); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="triA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1080" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WORK STEALING IN FORKJOINPOOL.COMMONPOOL()</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- PANEL 1: deques and stealing -->
  <text x="20" y="64" class="lbl h2">PANEL 1 — each worker owns a deque; an idle worker steals from another's tail</text>
  <line x1="20" y1="72" x2="1180" y2="72" stroke="#d1d5db" stroke-width="1"/>

  <rect x="40" y="90" width="230" height="140" rx="6" class="boxP"/>
  <text x="155" y="112" text-anchor="middle" class="lbl node">W0 deque</text>
  <text x="155" y="130" text-anchor="middle" class="lbl sub">head — push/pop (LIFO)</text>
  <rect x="60" y="142" width="190" height="24" rx="3" class="boxP"/>
  <text x="155" y="159" text-anchor="middle" class="lbl tiny">RES-410</text>
  <rect x="60" y="170" width="190" height="24" rx="3" class="boxP"/>
  <text x="155" y="187" text-anchor="middle" class="lbl tiny">RES-411</text>
  <text x="155" y="216" text-anchor="middle" class="lbl sub">tail</text>

  <rect x="310" y="90" width="230" height="140" rx="6" class="boxP"/>
  <text x="425" y="112" text-anchor="middle" class="lbl node">W1 deque</text>
  <text x="425" y="130" text-anchor="middle" class="lbl sub">head — push/pop (LIFO)</text>
  <rect x="330" y="142" width="190" height="24" rx="3" class="boxP"/>
  <text x="425" y="159" text-anchor="middle" class="lbl tiny">RES-420</text>
  <rect x="330" y="170" width="190" height="24" rx="3" class="boxP"/>
  <text x="425" y="187" text-anchor="middle" class="lbl tiny">RES-421</text>
  <text x="425" y="216" text-anchor="middle" class="lbl sub">tail — RES-421 stolen from here</text>

  <rect x="580" y="90" width="230" height="140" rx="6" class="boxP"/>
  <text x="695" y="112" text-anchor="middle" class="lbl node">W2 deque</text>
  <text x="695" y="130" text-anchor="middle" class="lbl sub">head — push/pop (LIFO)</text>
  <rect x="600" y="142" width="190" height="24" rx="3" class="boxP"/>
  <text x="695" y="159" text-anchor="middle" class="lbl tiny">RES-430</text>
  <text x="695" y="216" text-anchor="middle" class="lbl sub">tail</text>

  <rect x="850" y="90" width="230" height="140" rx="6" class="boxW"/>
  <text x="965" y="112" text-anchor="middle" class="lbl node">W3 deque</text>
  <text x="965" y="130" text-anchor="middle" class="lbl sub">empty — W3 is idle</text>
  <text x="965" y="216" text-anchor="middle" class="lbl sub">tail</text>

  <path class="adapt" d="M 425 230 V 260 H 965 V 230"/>
  <text x="695" y="253" text-anchor="middle" class="lbl tiny">steal from tail of W1 (FIFO end), not W1's own head</text>

  <rect x="40" y="280" width="1040" height="56" rx="6" class="boxAnn"/>
  <text x="56" y="300" class="lbl tiny">own head = LIFO, cache-friendly recursion; steal from the far tail = FIFO, so stealer takes the</text>
  <text x="56" y="316" class="lbl tiny">largest, oldest-forked subtask and minimises repeat contention with the deque's owner</text>

  <!-- PANEL 2: nested parallel starvation -->
  <text x="20" y="368" class="lbl h2">PANEL 2 — a parallel stream nested inside a parallel stream's lambda starves</text>
  <line x1="20" y1="376" x2="1180" y2="376" stroke="#d1d5db" stroke-width="1"/>

  <rect x="40" y="394" width="500" height="130" rx="6" class="boxD"/>
  <text x="290" y="416" text-anchor="middle" class="lbl node">OUTER: PaymentRun.stream().parallel()</text>
  <text x="290" y="436" text-anchor="middle" class="lbl dense">occupies all commonPool workers W0-W3</text>
  <rect x="64" y="452" width="100" height="40" rx="4" class="boxD"/>
  <text x="114" y="476" text-anchor="middle" class="lbl tiny">W0..W3</text>
  <rect x="176" y="452" width="340" height="40" rx="4" class="boxD"/>
  <text x="346" y="476" text-anchor="middle" class="lbl tiny">busy running the outer batch's lambda</text>
  <text x="290" y="508" text-anchor="middle" class="lbl sub">7,000 bank withdrawals/day, batched</text>

  <path class="fail" d="M 290 524 V 560"/>

  <rect x="40" y="560" width="500" height="130" rx="6" class="boxD"/>
  <text x="290" y="582" text-anchor="middle" class="lbl node">INNER: LedgerEntry.stream().parallel()</text>
  <text x="290" y="602" text-anchor="middle" class="lbl dense">forked from inside the outer lambda</text>
  <rect x="64" y="618" width="452" height="40" rx="4" class="boxD"/>
  <text x="290" y="642" text-anchor="middle" class="lbl tiny">QUEUED — same commonPool, no worker free</text>
  <text x="290" y="674" text-anchor="middle" class="lbl sub">this is the starvation shape, not extra parallelism</text>

  <rect x="580" y="394" width="500" height="296" rx="6" class="boxAnn"/>
  <text x="596" y="416" class="lbl node">THE STARVATION SHAPE</text>
  <text x="596" y="440" class="lbl tiny">Every parallelStream() in the JVM defaults to</text>
  <text x="596" y="458" class="lbl tiny">ForkJoinPool.commonPool() unless the terminal</text>
  <text x="596" y="476" class="lbl tiny">op is itself submitted into a different pool.</text>
  <text x="596" y="500" class="lbl tiny">Nesting parallel streams does not add workers —</text>
  <text x="596" y="518" class="lbl tiny">the inner level competes for the same W0..W3</text>
  <text x="596" y="536" class="lbl tiny">the outer level already holds.</text>
  <text x="596" y="560" class="lbl tiny">getLeafTarget() reads the current pool's</text>
  <text x="596" y="578" class="lbl tiny">parallelism when the caller is a ForkJoinWorkerThread,</text>
  <text x="596" y="596" class="lbl tiny">so both levels over-partition against the same</text>
  <text x="596" y="614" class="lbl tiny">four-workers-per-processor LEAF_TARGET.</text>
  <text x="596" y="638" class="lbl tiny">Fix: run the inner stream sequentially, or submit</text>
  <text x="596" y="656" class="lbl tiny">it into a dedicated ForkJoinPool via</text>
  <text x="596" y="674" class="lbl tiny">pool.submit(() -&gt; ...).join().</text>

  <!-- PANEL 3: racing exceptions -->
  <text x="20" y="722" class="lbl h2">PANEL 3 — two exceptions race to the joining task; the first wins</text>
  <line x1="20" y1="730" x2="1180" y2="730" stroke="#d1d5db" stroke-width="1"/>

  <rect x="80" y="748" width="220" height="80" rx="6" class="boxD"/>
  <text x="190" y="770" text-anchor="middle" class="lbl node">RES-201</text>
  <text x="190" y="790" text-anchor="middle" class="lbl dense">throws at t = 12ms</text>
  <text x="190" y="806" text-anchor="middle" class="lbl sub">InsufficientFundsException</text>

  <rect x="820" y="748" width="220" height="80" rx="6" class="boxW"/>
  <text x="930" y="770" text-anchor="middle" class="lbl node">RES-205</text>
  <text x="930" y="790" text-anchor="middle" class="lbl dense">throws at t = 19ms</text>
  <text x="930" y="806" text-anchor="middle" class="lbl sub">InsufficientFundsException</text>

  <path class="fail" d="M 190 828 V 870 H 590 V 900"/>
  <path class="weak" d="M 930 828 V 870 H 610 V 900"/>

  <rect x="470" y="900" width="260" height="86" rx="6" class="boxAnn"/>
  <text x="600" y="922" text-anchor="middle" class="lbl node">JOINING TASK</text>
  <text x="600" y="942" text-anchor="middle" class="lbl dense">rethrows RES-201's exception</text>
  <text x="600" y="960" text-anchor="middle" class="lbl sub">first completeExceptionally() wins the race</text>
  <text x="600" y="976" text-anchor="middle" class="lbl sub">RES-205's exception is discarded, unlogged</text>

  <line x1="20" y1="1010" x2="1180" y2="1010" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="1024" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="1037" class="lbl tiny">healthy deque / worker</text>
  <rect x="230" y="1024" width="22" height="16" rx="3" class="boxD"/>
  <text x="260" y="1037" class="lbl tiny">occupied / failed / winning exception</text>
  <rect x="520" y="1024" width="22" height="16" rx="3" class="boxW"/>
  <text x="550" y="1037" class="lbl tiny">idle worker / discarded exception</text>
  <path class="adapt" d="M 780 1024 H 820"/>
  <text x="828" y="1029" class="lbl tiny">steal, not inheritance</text>
  <path class="fail" d="M 970 1024 H 1010"/>
  <text x="1018" y="1029" class="lbl tiny">wins the race</text>
</svg>
