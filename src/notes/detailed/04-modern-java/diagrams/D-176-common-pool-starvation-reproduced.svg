<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three lanes on one time axis, reproduced on a 12-core machine where ForkJoinPool.getCommonPoolParallelism is 11. Lane one: 12 blocking CompletableFuture.runAsync tasks, each sleeping 3000 milliseconds, submitted at t=0 to the common pool; the eleven workers take 11 of them immediately and the twelfth queues, so the lane finishes at 6005 milliseconds. Lane two: an innocent CompletableFuture.supplyAsync submitted to the same common pool at 162 milliseconds, queued behind the blockers, and not finishing until 3003 milliseconds — its start delayed by essentially the full 3000 millisecond blocking duration. Lane three: the same innocent task resubmitted to a dedicated ForkJoinPool of 4 threads, submitted at 155 milliseconds and finished at 159 milliseconds, starting immediately because it shares no worker with the blockers.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .fail  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triF); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">COMMON-POOL STARVATION, REPRODUCED</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl sub">Measured on this machine: 12 cores, ForkJoinPool.getCommonPoolParallelism() = 11, blockMs = 3000 — javac --release 21, java 25 runtime</text>

  <!-- axis -->
  <line x1="220" y1="500" x2="1000" y2="500" stroke="#475569" stroke-width="1.5"/>
  <text x="220" y="516" class="lbl tiny" text-anchor="middle">0ms</text>
  <text x="380" y="516" class="lbl tiny" text-anchor="middle">160ms</text>
  <text x="600" y="516" class="lbl tiny" text-anchor="middle">3000ms</text>
  <text x="1000" y="516" class="lbl tiny" text-anchor="middle">6005ms</text>
  <line x1="220" y1="494" x2="220" y2="506" stroke="#475569" stroke-width="1.3"/>
  <line x1="380" y1="494" x2="380" y2="506" stroke="#475569" stroke-width="1.3"/>
  <line x1="600" y1="494" x2="600" y2="506" stroke="#475569" stroke-width="1.3"/>
  <line x1="1000" y1="494" x2="1000" y2="506" stroke="#475569" stroke-width="1.3"/>

  <!-- lane labels -->
  <text x="20" y="100" class="lbl h2">LANE 1 — BLOCKING</text>
  <text x="20" y="200" class="lbl h2">LANE 2 — INNOCENT</text>
  <text x="20" y="200" class="lbl h2" dy="14">on commonPool</text>
  <text x="20" y="320" class="lbl h2">LANE 3 — INNOCENT</text>
  <text x="20" y="320" class="lbl h2" dy="14">on dedicated pool</text>

  <!-- LANE 1: blockers, 220..1000 -->
  <rect x="220" y="80" width="780" height="50" rx="6" class="boxD"/>
  <text x="610" y="102" text-anchor="middle" class="lbl dense">12 × CompletableFuture.runAsync(() -&gt; Thread.sleep(3000)) on ForkJoinPool.commonPool()</text>
  <text x="610" y="120" text-anchor="middle" class="lbl tiny">11 workers take 11 tasks at t=0; the 12th queues and runs a second 3000ms round</text>

  <!-- LANE 2: innocent on commonPool, 380..600 delayed -->
  <line x1="220" y1="170" x2="380" y2="170" stroke="#d1d5db" stroke-width="6" stroke-dasharray="2 4"/>
  <rect x="380" y="150" width="220" height="50" rx="6" class="boxD"/>
  <text x="490" y="172" text-anchor="middle" class="lbl dense">supplyAsync submitted t=162ms</text>
  <text x="490" y="190" text-anchor="middle" class="lbl tiny">QUEUED — no free worker</text>
  <path class="fail" d="M 600 175 H 640"/>
  <text x="650" y="180" class="lbl tiny">finishes t=3003ms</text>
  <text x="220" y="228" class="lbl node">delay ≈ 2841ms — essentially the full 3000ms blocking duration</text>

  <!-- LANE 3: innocent on dedicated pool, starts immediately near 155-159 -->
  <line x1="220" y1="290" x2="378" y2="290" stroke="#d1d5db" stroke-width="6" stroke-dasharray="2 4"/>
  <rect x="378" y="270" width="30" height="50" rx="6" class="boxR"/>
  <text x="393" y="350" text-anchor="middle" class="lbl dense">t=155ms → t=159ms</text>
  <text x="393" y="368" text-anchor="middle" class="lbl node">4ms — starts immediately</text>
  <text x="220" y="392" class="lbl tiny">new ForkJoinPool(4).submit(() -&gt; innocentList.parallelStream()...) shares no worker with the blockers</text>

  <rect x="20" y="420" width="1000" height="60" rx="6" class="boxAnn"/>
  <text x="36" y="440" class="lbl node">THE POINT</text>
  <text x="36" y="458" class="lbl tiny">Every parallelStream() and every default-executor CompletableFuture shares ForkJoinPool.commonPool(). A blocking task on it delays every other</text>
  <text x="36" y="474" class="lbl tiny">stream submitted anywhere in the JVM by the length of the block; only a dedicated pool (or dedicated executor) is isolated from that delay.</text>

  <line x1="20" y1="536" x2="1020" y2="536" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="548" width="22" height="16" rx="3" class="boxD"/>
  <text x="50" y="561" class="lbl tiny">on commonPool — blocked or delayed</text>
  <rect x="330" y="548" width="22" height="16" rx="3" class="boxR"/>
  <text x="360" y="561" class="lbl tiny">on dedicated pool — unaffected</text>
  <path class="fail" d="M 20 578 H 60"/>
  <text x="68" y="583" class="lbl tiny">delayed start / finish, caused by lane 1</text>
  <line x1="330" y1="578" x2="380" y2="578" stroke="#d1d5db" stroke-width="6" stroke-dasharray="2 4"/>
  <text x="390" y="583" class="lbl tiny">wait before submission is observed</text>
</svg>
