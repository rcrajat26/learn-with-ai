<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Log-log cost curve of Little's law for QuizStakes stake reservations. Concurrency equals
     throughput times latency. At 1,200 reservations per second and the card PSP's 240ms p50, 288
     concurrent tasks are needed. At the same 1,200 per second but the PSP's 11 second p99, 13,200
     concurrent tasks are needed. A flat horizontal line at 200 shows the platform thread pool's fixed
     capacity, which is exceeded well before the p99 case. The virtual-thread line is the diagonal
     proportional line and carries no such cap in this range.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .axis  { font-size: 11px; fill: #4b5563; }

    .gridline { stroke: #d1d5db; stroke-width: 1; }
    .axisline { stroke: #475569; stroke-width: 1.6; }
    .vtLine   { fill: none; stroke: #2563eb; stroke-width: 2.4; }
    .capLine  { fill: none; stroke: #b91c1c; stroke-width: 2.4; stroke-dasharray: 8 5; }
    .guide    { fill: none; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 3 3; }
    .dot      { fill: #2563eb; stroke: #ffffff; stroke-width: 1.5; }

    .boxAnno { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }
  </style>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">LITTLE'S LAW SETS THE THREAD COUNT — CONCURRENCY = THROUGHPUT × LATENCY</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="64" class="lbl body">QuizStakes stake reservations: 1,200/sec (Appendix A). Log-log axes so both the p50 and p99 case fit on one plot.</text>

  <!-- plot area: x px 150..770 latency log scale, y px 120..570 concurrency log scale -->
  <g>
    <!-- gridlines y -->
    <line x1="150" y1="570" x2="770" y2="570" class="gridline"/>
    <line x1="150" y1="511" x2="770" y2="511" class="gridline"/>
    <line x1="150" y1="480" x2="770" y2="480" class="gridline"/>
    <line x1="150" y1="341" x2="770" y2="341" class="gridline"/>
    <line x1="150" y1="155" x2="770" y2="155" class="gridline"/>
    <text x="140" y="574" text-anchor="end" class="lbl axis">100</text>
    <text x="140" y="515" text-anchor="end" class="lbl axis">200</text>
    <text x="140" y="483" text-anchor="end" class="lbl axis">288</text>
    <text x="140" y="345" text-anchor="end" class="lbl axis">1,000</text>
    <text x="140" y="151" text-anchor="end" class="lbl axis">13,200</text>

    <!-- gridlines x -->
    <line x1="257" y1="120" x2="257" y2="570" class="gridline"/>
    <line x1="725" y1="120" x2="725" y2="570" class="gridline"/>
    <line x1="432" y1="120" x2="432" y2="570" class="gridline"/>
    <text x="257" y="588" text-anchor="middle" class="lbl axis">240ms</text>
    <text x="432" y="588" text-anchor="middle" class="lbl axis">1,000ms</text>
    <text x="725" y="588" text-anchor="middle" class="lbl axis">11,000ms</text>

    <!-- axes -->
    <line x1="150" y1="120" x2="150" y2="570" class="axisline"/>
    <line x1="150" y1="570" x2="770" y2="570" class="axisline"/>
    <text x="20" y="115" class="lbl body" font-weight="700">concurrent tasks (log)</text>
    <text x="640" y="612" class="lbl body" font-weight="700">PSP round-trip latency (log)</text>

    <!-- platform pool cap: flat line at 200 -->
    <path class="capLine" d="M 150 511 H 770"/>
    <text x="580" y="504" text-anchor="middle" class="lbl tiny" fill="#b91c1c" font-weight="700">platform pool cap — 200 threads</text>

    <!-- virtual thread proportional line -->
    <path class="vtLine" d="M 150 555 L 770 124"/>
    <text x="290" y="188" class="lbl tiny" fill="#2563eb" font-weight="700">virtual-thread line —</text>
    <text x="290" y="202" class="lbl tiny" fill="#2563eb" font-weight="700">no cap in this range</text>

    <!-- guides + points -->
    <path class="guide" d="M 257 480 V 570"/>
    <path class="guide" d="M 150 480 H 257"/>
    <circle cx="257" cy="480" r="6" class="dot"/>
    <path class="guide" d="M 270 490 L 305 525"/>
    <text x="270" y="546" class="lbl tiny" font-weight="700">p50 240ms</text>
    <text x="270" y="560" class="lbl tiny" font-weight="700">288 concurrent</text>

    <path class="guide" d="M 725 155 V 570"/>
    <path class="guide" d="M 150 155 H 725"/>
    <circle cx="725" cy="155" r="6" class="dot"/>
    <text x="690" y="127" text-anchor="end" class="lbl tiny" font-weight="700">13,200 concurrent</text>
    <text x="690" y="142" text-anchor="end" class="lbl tiny" font-weight="700">p99 11s</text>
  </g>

  <rect x="790" y="150" width="230" height="150" rx="6" class="boxAnno"/>
  <text x="802" y="172" class="lbl tiny" font-weight="700">1,200 reservations/sec</text>
  <text x="802" y="188" class="lbl tiny" font-weight="700">throughput</text>
  <text x="802" y="212" class="lbl tiny">p50 240ms →</text>
  <text x="802" y="228" class="lbl tiny">1,200 × 0.24 = 288</text>
  <text x="802" y="250" class="lbl tiny">p99 11s →</text>
  <text x="802" y="266" class="lbl tiny">1,200 × 11 = 13,200</text>
  <text x="802" y="288" class="lbl tiny">200-thread pool caps well</text>

  <line x1="20" y1="638" x2="1020" y2="638" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="658" class="lbl tiny" font-weight="700">LEGEND</text>
  <line x1="20" y1="672" x2="50" y2="672" class="vtLine"/>
  <text x="58" y="676" class="lbl tiny">virtual-thread concurrency = throughput × latency (uncapped)</text>
  <line x1="500" y1="672" x2="530" y2="672" class="capLine"/>
  <text x="538" y="676" class="lbl tiny">platform thread pool fixed cap (200 threads)</text>
  <circle cx="850" cy="672" r="6" class="dot"/>
  <text x="862" y="676" class="lbl tiny">measured concurrency point</text>
</svg>
