<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="StakeSplit's equals, hashCode and toString each compile to their own invokedynamic
     call site, but all three share bootstrap method #0, java.lang.runtime.ObjectMethods.bootstrap,
     invoked with four static arguments: the StakeSplit class, the semicolon-separated component
     name string bonusPortion;cashPortion, and one MethodHandle getter for each of bonusPortion and
     cashPortion. A consequence panel notes the hashCode algorithm is unspecified and may change
     between JDK releases, so it must never be persisted.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .3px; fill: #4b5563; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 4 3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">STAKESPLIT'S equals / hashCode / toString RUN THROUGH ONE SHARED BOOTSTRAP</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="66" class="lbl h2">RECORD DECLARATION</text>
  <rect x="20" y="76" width="360" height="56" rx="6" class="boxP"/>
  <text x="200" y="98" text-anchor="middle" class="lbl node mono">record StakeSplit(</text>
  <text x="200" y="118" text-anchor="middle" class="lbl dense mono">Money bonusPortion, Money cashPortion)</text>

  <text x="20" y="162" class="lbl h2">THREE GENERATED METHODS — THREE CALL SITES</text>

  <rect x="20" y="176" width="290" height="70" rx="6" class="boxH"/>
  <text x="165" y="200" text-anchor="middle" class="lbl node mono">equals(Object)</text>
  <text x="165" y="220" text-anchor="middle" class="lbl sub">invokedynamic #24 : equals(LStakeSplit;Ljava/lang/Object;)Z</text>
  <text x="165" y="236" text-anchor="middle" class="lbl sub">bootstrap method index #0</text>

  <rect x="375" y="176" width="290" height="70" rx="6" class="boxH"/>
  <text x="520" y="200" text-anchor="middle" class="lbl node mono">hashCode()</text>
  <text x="520" y="220" text-anchor="middle" class="lbl sub">invokedynamic #20 : hashCode(LStakeSplit;)I</text>
  <text x="520" y="236" text-anchor="middle" class="lbl sub">bootstrap method index #0</text>

  <rect x="730" y="176" width="290" height="70" rx="6" class="boxH"/>
  <text x="875" y="200" text-anchor="middle" class="lbl node mono">toString()</text>
  <text x="875" y="220" text-anchor="middle" class="lbl sub">invokedynamic #16 : toString(LStakeSplit;)Ljava/lang/String;</text>
  <text x="875" y="236" text-anchor="middle" class="lbl sub">bootstrap method index #0</text>

  <!-- fan-in bus: three call sites drop to one shared bus, then into the bootstrap -->
  <path class="flow" d="M 165 246 V 268"/>
  <path class="flow" d="M 520 246 V 268"/>
  <path class="flow" d="M 875 246 V 268"/>
  <line x1="165" y1="268" x2="875" y2="268" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 520 268 V 296"/>

  <rect x="290" y="300" width="460" height="60" rx="6" class="boxD" style="fill:#fef3c7;stroke:#b45309;"/>
  <text x="520" y="324" text-anchor="middle" class="lbl node">bootstrap method #0 (shared, one entry)</text>
  <text x="520" y="344" text-anchor="middle" class="lbl dense mono">java.lang.runtime.ObjectMethods.bootstrap</text>

  <text x="20" y="394" class="lbl h2">STATIC ARGUMENTS PASSED ONCE TO THE BOOTSTRAP</text>

  <rect x="20" y="422" width="230" height="60" rx="6" class="boxP"/>
  <text x="135" y="446" text-anchor="middle" class="lbl body">Class object</text>
  <text x="135" y="465" text-anchor="middle" class="lbl dense mono">StakeSplit</text>

  <rect x="270" y="422" width="330" height="60" rx="6" class="boxP"/>
  <text x="435" y="446" text-anchor="middle" class="lbl body">component-name string</text>
  <text x="435" y="465" text-anchor="middle" class="lbl dense mono">"bonusPortion;cashPortion"</text>

  <rect x="620" y="422" width="200" height="60" rx="6" class="boxP"/>
  <text x="720" y="446" text-anchor="middle" class="lbl body">MethodHandle</text>
  <text x="720" y="465" text-anchor="middle" class="lbl dense mono">REF_getField bonusPortion</text>

  <rect x="840" y="422" width="180" height="60" rx="6" class="boxP"/>
  <text x="930" y="446" text-anchor="middle" class="lbl body">MethodHandle</text>
  <text x="930" y="465" text-anchor="middle" class="lbl dense mono">REF_getField cashPortion</text>

  <path class="weak" d="M 135 422 V 408 H 520"/>
  <path class="weak" d="M 435 422 V 408 H 520"/>
  <path class="weak" d="M 720 422 V 408 H 520"/>
  <path class="weak" d="M 930 422 V 408 H 520"/>
  <path class="weak" d="M 520 408 V 360"/>

  <text x="20" y="512" class="lbl h2">javap -c -p -v StakeSplit.class (compiled --release 21)</text>
  <rect x="20" y="522" width="1000" height="130" rx="6" class="boxW"/>
  <text x="34" y="544" class="lbl tiny mono">BootstrapMethods:</text>
  <text x="34" y="562" class="lbl tiny mono">  0: #44 REF_invokeStatic java/lang/runtime/ObjectMethods.bootstrap:(Lookup;String;TypeDescriptor;Class;String;[MethodHandle;)Object;</text>
  <text x="34" y="580" class="lbl tiny mono">    Method arguments:</text>
  <text x="34" y="598" class="lbl tiny mono">      #8  StakeSplit</text>
  <text x="34" y="616" class="lbl tiny mono">      #40 bonusPortion;cashPortion</text>
  <text x="34" y="634" class="lbl tiny mono">      #42 REF_getField StakeSplit.bonusPortion   #43 REF_getField StakeSplit.cashPortion</text>

  <rect x="20" y="672" width="1000" height="58" rx="6" class="boxA"/>
  <text x="34" y="692" class="lbl body" style="font-weight:700;">Consequence — never persist a record's hashCode</text>
  <text x="34" y="712" class="lbl tiny">ObjectMethods.bootstrap's algorithm is unspecified and may change between JDK releases; a value</text>
  <text x="34" y="726" class="lbl tiny">stored today (a shard key, a cache key) can silently mismatch after a JDK upgrade.</text>

  <line x1="20" y1="742" x2="1020" y2="742" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="748" width="22" height="10" rx="3" class="boxP"/>
  <text x="50" y="757" class="lbl tiny">static argument to the bootstrap</text>
  <rect x="270" y="748" width="22" height="10" rx="3" class="boxH"/>
  <text x="300" y="757" class="lbl tiny">generated method / call site</text>
  <path class="weak" d="M 500 753 H 540"/>
  <text x="548" y="757" class="lbl tiny">weak: argument feeds the bootstrap call</text>
  <rect x="820" y="748" width="22" height="10" rx="3" class="boxA"/>
  <text x="850" y="757" class="lbl tiny">annotation / consequence panel</text>
</svg>
