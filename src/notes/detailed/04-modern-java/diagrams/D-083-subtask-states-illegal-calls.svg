<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Subtask state machine. fork() creates a Subtask in UNAVAILABLE. From UNAVAILABLE,
     a normal task completion transitions to SUCCESS, where get() returns the result, and a task
     failure transitions to FAILED, where exception() returns the cause. A shutdown() before
     completion can leave the Subtask in UNAVAILABLE forever. Two illegal calls are marked: calling
     get() while still UNAVAILABLE, before join(), throws IllegalStateException; calling from a
     non-owner thread, or closing the scope out of order, throws StructureViolationException from
     any state.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxF  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 6 4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .bus   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
    .weakline { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SUBTASK STATES AND THE ILLEGAL CALLS</text>
  <line x1="20" y1="42" x2="780" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="60" y="95" width="700" height="215" rx="6" class="frame"/>
  <text x="748" y="112" text-anchor="end" class="lbl tiny" fill="#4b5563">ANY SUBTASK STATE</text>

  <circle cx="400" cy="70" r="5" fill="#1f2937"/>
  <path class="flow" d="M 400 75 V 110"/>
  <text x="412" y="96" class="lbl tiny">fork()</text>

  <rect x="290" y="110" width="220" height="60" rx="6" class="boxP"/>
  <text x="400" y="135" text-anchor="middle" class="lbl node">UNAVAILABLE</text>
  <text x="400" y="153" text-anchor="middle" class="lbl sub">no result yet</text>

  <path class="flow" d="M 510 122 H 555 V 158 H 510"/>
  <text x="562" y="128" class="lbl tiny">shutdown()</text>
  <text x="562" y="142" class="lbl tiny">before completion</text>

  <path class="bus" d="M 400 170 V 195"/>
  <path class="bus" d="M 200 195 H 620"/>
  <path class="flow" d="M 200 195 V 240"/>
  <path class="flow" d="M 620 195 V 240"/>
  <text x="200" y="216" text-anchor="middle" class="lbl tiny">task completes</text>
  <text x="620" y="216" text-anchor="middle" class="lbl tiny">task throws</text>

  <rect x="90" y="240" width="220" height="60" rx="6" class="boxR"/>
  <text x="200" y="265" text-anchor="middle" class="lbl node">SUCCESS</text>
  <text x="200" y="283" text-anchor="middle" class="lbl sub">get() returns result</text>

  <rect x="510" y="240" width="220" height="60" rx="6" class="boxF"/>
  <text x="620" y="265" text-anchor="middle" class="lbl node">FAILED</text>
  <text x="620" y="283" text-anchor="middle" class="lbl sub">exception() returns cause</text>

  <path class="weakline" d="M 290 140 H 75 V 380"/>
  <rect x="40" y="380" width="280" height="70" rx="6" class="boxF"/>
  <text x="180" y="404" text-anchor="middle" class="lbl node">IllegalStateException</text>
  <text x="180" y="422" text-anchor="middle" class="lbl body">get() called before join()</text>
  <text x="180" y="438" text-anchor="middle" class="lbl sub">state still UNAVAILABLE</text>

  <path class="weakline" d="M 400 310 V 330 H 620 V 380"/>
  <rect x="460" y="380" width="320" height="70" rx="6" class="boxF"/>
  <text x="620" y="404" text-anchor="middle" class="lbl node">StructureViolationException</text>
  <text x="620" y="422" text-anchor="middle" class="lbl body">non-owner thread call</text>
  <text x="620" y="438" text-anchor="middle" class="lbl body">or out-of-order close()</text>

  <rect x="40" y="470" width="740" height="60" rx="6" class="panel"/>
  <text x="56" y="488" class="lbl tiny" font-weight="700">ANNOTATION</text>
  <text x="56" y="504" class="lbl tiny">shutdown() cancels the owner scope's wait; a Subtask still UNAVAILABLE when cancelled</text>
  <text x="56" y="518" class="lbl tiny">may never reach SUCCESS or FAILED &#8212; get() on it still throws IllegalStateException.</text>

  <line x1="20" y1="552" x2="780" y2="552" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="568" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="580" class="lbl tiny">UNAVAILABLE (initial)</text>
  <rect x="200" y="568" width="20" height="14" rx="3" class="boxR"/>
  <text x="226" y="580" class="lbl tiny">SUCCESS</text>
  <rect x="320" y="568" width="20" height="14" rx="3" class="boxF"/>
  <text x="346" y="580" class="lbl tiny">FAILED / thrown exception</text>
  <rect x="520" y="568" width="20" height="14" rx="3" class="frame"/>
  <text x="546" y="580" class="lbl tiny">grouping: any state</text>
  <path class="flow" d="M 20 596 H 60"/>
  <text x="68" y="601" class="lbl tiny">state transition (trigger labelled)</text>
  <path class="weakline" d="M 320 596 H 360"/>
  <text x="368" y="601" class="lbl tiny">illegal call &#8594; exception (labelled)</text>
</svg>
