<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 1 of 3: IntStream.sum over 2,800,000 stake reservations in minor units. The
     running int total after 2,799,999 stakes is 2,147,483,501, closing in on Integer.MAX_VALUE,
     2,147,483,647. The final stake, number 2,800,000, is worth 250 minor units and is about to be
     added.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">FRAME 1/3 — IntStream.sum() RUNNING TOTAL APPROACHES INT MAX</text>
  <line x1="20" y1="40" x2="880" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="70" width="360" height="60" rx="6" class="boxP"/>
  <text x="220" y="94" text-anchor="middle" class="lbl node">2,799,999 stakes summed</text>
  <text x="220" y="114" text-anchor="middle" class="lbl sub">int total so far</text>

  <path class="flow" d="M 400 100 H 460"/>

  <rect x="460" y="70" width="400" height="60" rx="6" class="boxH"/>
  <text x="660" y="94" text-anchor="middle" class="lbl node">total = 2,147,483,501</text>
  <text x="660" y="114" text-anchor="middle" class="lbl sub">Integer.MAX_VALUE = 2,147,483,647</text>

  <path class="flow" d="M 660 130 V 170"/>

  <rect x="40" y="172" width="360" height="60" rx="6" class="boxP"/>
  <text x="220" y="196" text-anchor="middle" class="lbl node">stake #2,800,000 = 250</text>
  <text x="220" y="216" text-anchor="middle" class="lbl sub">minor units, about to be added</text>

  <path class="flow" d="M 400 202 H 460"/>

  <rect x="460" y="172" width="400" height="60" rx="6" class="boxH"/>
  <text x="660" y="196" text-anchor="middle" class="lbl node">next: total += 250</text>
  <text x="660" y="216" text-anchor="middle" class="lbl sub">only 146 below Integer.MAX_VALUE</text>

  <rect x="40" y="256" width="820" height="80" rx="6" class="panel"/>
  <text x="56" y="278" class="lbl tiny" font-weight="700">Why this is dangerous</text>
  <text x="56" y="296" class="lbl tiny">IntStream.sum() accumulates in a plain int. Nothing in the API signature warns the</text>
  <text x="56" y="312" class="lbl tiny">caller — the return type is int and the arithmetic wraps with no exception, no flag.</text>

  <line x1="20" y1="360" x2="880" y2="360" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="372" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="385" class="lbl tiny">running state / input element</text>
  <rect x="300" y="372" width="22" height="16" rx="3" class="boxH"/>
  <text x="330" y="385" class="lbl tiny">value approaching Integer.MAX_VALUE</text>
  <path class="flow" d="M 620 380 H 660"/>
  <text x="668" y="385" class="lbl tiny">A &#8594; B : B follows from A</text>
</svg>
