<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Reading a BootstrapMethods entry for FundsLedger.reserveStake's invokedynamic
     call site. LambdaMetafactory.metafactory takes six parameters: caller, interfaceMethodName
     and factoryType are supplied implicitly by the JVM from the call site; interfaceMethodType,
     implementation and dynamicMethodType are static arguments stored in the constant pool as
     entries 36, 37 and 40. The dynamic argument, the captured local stakeAmount of type
     BigDecimal, is pushed on the operand stack by aload_0 and its type is exactly factoryType's
     parameter list.">
  <style>
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1   { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2   { font-size: 12.5px; font-weight: 700; }
    .node { font-size: 13px; font-weight: 700; }
    .body { font-size: 11.5px; }
    .sub  { font-size: 10.5px; fill: #4b5563; }
    .tiny { font-size: 11px; }
    .tag  { font-size: 10.5px; font-weight: 700; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
    .impl { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#triG); }
    .weak { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triGr); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="950" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">READING A BootstrapMethods ENTRY</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl sub">FundsLedger.reserveStake, javap -c -p -v, javac --release 21 (verified on this machine)</text>

  <!-- call-site box -->
  <rect x="400" y="72" width="400" height="60" rx="6" class="boxP"/>
  <text x="600" y="94" text-anchor="middle" class="lbl node">1: invokedynamic #7, 0</text>
  <text x="600" y="112" text-anchor="middle" class="lbl sub">descriptor: (BigDecimal)Predicate  — this is factoryType</text>

  <path class="flow" d="M 600 132 V 160"/>

  <!-- bootstrap panel -->
  <rect x="350" y="160" width="500" height="450" rx="6" class="boxP"/>
  <text x="600" y="182" text-anchor="middle" class="lbl h2">LambdaMetafactory.metafactory — 6 parameters</text>
  <line x1="365" y1="192" x2="835" y2="192" stroke="#93c5fd" stroke-width="1"/>

  <!-- row 1 caller -->
  <text x="365" y="216" class="lbl node">caller : MethodHandles.Lookup</text>
  <rect x="700" y="202" width="120" height="18" rx="3" class="boxW"/>
  <text x="760" y="215" text-anchor="middle" class="lbl tag">implicit</text>
  <text x="365" y="234" class="lbl sub">JVM-supplied Lookup at the call site, not in the pool</text>

  <!-- row 2 interfaceMethodName -->
  <text x="365" y="266" class="lbl node">interfaceMethodName : String</text>
  <rect x="700" y="252" width="120" height="18" rx="3" class="boxW"/>
  <text x="760" y="265" text-anchor="middle" class="lbl tag">implicit</text>
  <text x="365" y="284" class="lbl sub">"test" — taken from the invokedynamic's NameAndType</text>

  <!-- row 3 factoryType -->
  <text x="365" y="316" class="lbl node">factoryType : MethodType</text>
  <rect x="700" y="302" width="120" height="18" rx="3" class="boxW"/>
  <text x="760" y="315" text-anchor="middle" class="lbl tag">implicit</text>
  <text x="365" y="334" class="lbl sub">(BigDecimal)Predicate — the call site's own descriptor</text>

  <!-- row 4 interfaceMethodType -->
  <text x="365" y="366" class="lbl node">interfaceMethodType : MethodType</text>
  <rect x="700" y="352" width="120" height="18" rx="3" class="boxR"/>
  <text x="760" y="365" text-anchor="middle" class="lbl tag">arg #36</text>
  <text x="365" y="384" class="lbl sub">(Ljava/lang/Object;)Z — erased Predicate.test shape</text>

  <!-- row 5 implementation -->
  <text x="365" y="416" class="lbl node">implementation : MethodHandle</text>
  <rect x="700" y="402" width="120" height="18" rx="3" class="boxR"/>
  <text x="760" y="415" text-anchor="middle" class="lbl tag">arg #37</text>
  <text x="365" y="434" class="lbl sub">REF_invokeStatic → lambda$reserveStake$0</text>

  <!-- row 6 dynamicMethodType -->
  <text x="365" y="466" class="lbl node">dynamicMethodType : MethodType</text>
  <rect x="700" y="452" width="120" height="18" rx="3" class="boxR"/>
  <text x="760" y="465" text-anchor="middle" class="lbl tag">arg #40</text>
  <text x="365" y="484" class="lbl sub">(BigDecimal)Z — lambda body's real static shape</text>

  <line x1="365" y1="500" x2="835" y2="500" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="524" class="lbl sub">factoryType's parameter list (BigDecimal) is exactly the</text>
  <text x="365" y="540" class="lbl sub">type of what the call site pushes below — see the arrow →</text>

  <rect x="365" y="556" width="470" height="42" rx="5" class="boxW"/>
  <text x="600" y="573" text-anchor="middle" class="lbl body">arg #36, #37, #40 sit in the constant pool as</text>
  <text x="600" y="590" text-anchor="middle" class="lbl body">this bootstrap's "Method arguments" (javap -v)</text>

  <!-- static-args panel (left) -->
  <text x="50" y="352" class="lbl h2">STATIC ARGUMENTS — constant pool</text>
  <rect x="50" y="380" width="270" height="220" rx="6" class="boxR"/>
  <text x="62" y="404" class="lbl node">#36  MethodType</text>
  <text x="62" y="420" class="lbl sub">(Ljava/lang/Object;)Z</text>
  <line x1="62" y1="432" x2="308" y2="432" stroke="#86efac" stroke-width="1"/>
  <text x="62" y="454" class="lbl node">#37  MethodHandle</text>
  <text x="62" y="470" class="lbl sub">FundsLedger.lambda$reserveStake$0</text>
  <line x1="62" y1="482" x2="308" y2="482" stroke="#86efac" stroke-width="1"/>
  <text x="62" y="504" class="lbl node">#40  MethodType</text>
  <text x="62" y="520" class="lbl sub">(Ljava/math/BigDecimal;)Z</text>
  <text x="62" y="580" class="lbl sub">baked into the class file at compile time</text>

  <path class="impl" d="M 320 434 H 350"/>
  <path class="impl" d="M 320 502 H 350"/>
  <path class="impl" d="M 320 570 H 350"/>

  <!-- dynamic-args panel (right) -->
  <text x="900" y="292" class="lbl h2">DYNAMIC ARGUMENTS</text>
  <text x="900" y="308" class="lbl h2">— operand stack</text>
  <rect x="870" y="320" width="270" height="130" rx="6" class="boxH"/>
  <text x="882" y="344" class="lbl node">0: aload_0</text>
  <text x="882" y="362" class="lbl body">pushes stakeAmount</text>
  <text x="882" y="382" class="lbl sub">type: BigDecimal (a captured local,</text>
  <text x="882" y="398" class="lbl sub">not from the constant pool)</text>
  <text x="882" y="416" class="lbl sub">one value per parameter in factoryType</text>
  <text x="882" y="432" class="lbl sub">beyond the fixed six above</text>

  <path class="weak" d="M 850 316 H 860 V 330 H 870"/>
  <text x="855" y="278" class="lbl tiny">this is exactly what was captured</text>

  <!-- legend -->
  <line x1="20" y1="880" x2="1180" y2="880" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="893" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="906" class="lbl tiny">bootstrap method / call site</text>
  <rect x="260" y="893" width="22" height="16" rx="3" class="boxR"/>
  <text x="290" y="906" class="lbl tiny">resolved — constant-pool static argument</text>
  <rect x="580" y="893" width="22" height="16" rx="3" class="boxH"/>
  <text x="610" y="906" class="lbl tiny">runtime — dynamic argument on operand stack</text>
  <rect x="900" y="893" width="22" height="16" rx="3" class="boxW"/>
  <text x="930" y="906" class="lbl tiny">implicit parameter, no pool entry</text>

  <path class="impl" d="M 20 916 H 60"/>
  <text x="68" y="921" class="lbl tiny">static arg → bootstrap parameter</text>
  <path class="weak" d="M 320 916 H 360"/>
  <text x="368" y="921" class="lbl tiny">factoryType → the captured locals it describes</text>
</svg>
