<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Frame 3 of 3: the tail of an IteratorSpliterator's source. Once the live iterator itself is handed out as the last spliterator, it has no known remaining count, so it reports SIZED as false and never reports SUBSIZED, unlike its array-backed siblings from the earlier batches.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .code  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">FRAME 3/3 — THE TAIL STAYS AN ITERATOR: NEVER SUBSIZED</text>
  <line x1="20" y1="40" x2="880" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="66" width="380" height="60" rx="6" class="boxR"/>
  <text x="230" y="89" text-anchor="middle" class="lbl node">batch #2 — 2,048 elements</text>
  <text x="230" y="107" text-anchor="middle" class="lbl sub">array-backed, SIZED &amp; SUBSIZED</text>

  <path class="flow" d="M 230 126 V 158"/>
  <text x="290" y="148" class="lbl sub">no further split</text>

  <rect x="40" y="158" width="380" height="80" rx="6" class="boxD"/>
  <text x="230" y="184" text-anchor="middle" class="lbl node">remaining tail — still a live Iterator</text>
  <text x="230" y="204" text-anchor="middle" class="lbl body">count of what is left is unknown until exhausted</text>
  <text x="230" y="222" text-anchor="middle" class="lbl sub code">estimateSize() = Long.MAX_VALUE</text>

  <path class="flow" d="M 230 238 V 270"/>

  <rect x="40" y="270" width="380" height="60" rx="6" class="boxD"/>
  <text x="230" y="293" text-anchor="middle" class="lbl node code">SIZED = false, SUBSIZED = false</text>
  <text x="230" y="310" text-anchor="middle" class="lbl sub">this tail never earns either flag</text>

  <rect x="460" y="66" width="400" height="264" rx="6" class="panel"/>
  <text x="476" y="90" class="lbl node" font-size="13px">why the tail cannot catch up</text>
  <text x="476" y="112" class="lbl tiny">Every trySplit() peels a growing array batch off the</text>
  <text x="476" y="128" class="lbl tiny">front, but the object doing the splitting is still the</text>
  <text x="476" y="144" class="lbl tiny">same wrapped Iterator underneath — it never learns</text>
  <text x="476" y="160" class="lbl tiny">how many elements remain in LinkedList.spliterator()</text>
  <text x="476" y="176" class="lbl tiny">or Files.lines(), because neither source exposes a</text>
  <text x="476" y="192" class="lbl tiny">count up front.</text>
  <text x="476" y="214" class="lbl tiny">Consequence for ForkJoinPool.commonPool() work</text>
  <text x="476" y="230" class="lbl tiny">splitting (Day 4, D-139): the fork/join framework's</text>
  <text x="476" y="246" class="lbl tiny">suggestTargetSize() math assumes a size estimate it</text>
  <text x="476" y="262" class="lbl tiny">can trust — a tail that reports Long.MAX_VALUE never</text>
  <text x="476" y="278" class="lbl tiny">converges, so the batching scheme, not target-size</text>
  <text x="476" y="294" class="lbl tiny">arithmetic, is what bounds this split.</text>

  <line x1="20" y1="360" x2="880" y2="360" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="374" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="387" class="lbl tiny">array-backed batch — SIZED &amp; SUBSIZED</text>
  <rect x="360" y="374" width="22" height="16" rx="3" class="boxD"/>
  <text x="390" y="387" class="lbl tiny">unsplit iterator tail — neither flag</text>
  <path class="flow" d="M 660 382 H 700"/>
  <text x="708" y="387" class="lbl tiny">A → B</text>
</svg>
