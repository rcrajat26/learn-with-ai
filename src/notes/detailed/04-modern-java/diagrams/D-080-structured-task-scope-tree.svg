<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Left: AssessmentService opens a try-with-resources StructuredTaskScope and forks two
     Subtasks, each its own virtual thread — the identity vendor call at p50 900 ms and the
     watchlist provider call at p50 1.4 s. Both are drawn inside the try block's boundary, which
     they cannot outlive; scope.join() and throwIfFailed() run inside that same boundary. Right,
     for comparison: AssessmentService instead calls new Thread(...).start() twice with no owning
     scope. Both threads are drawn crossing out of the method body's boundary as orphans, still
     running after the method returns, with no join and no cancellation.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxF  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boundH{ fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .boundW{ fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .bus   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">A STRUCTURED TASK SCOPE IS A TREE</text>
  <line x1="20" y1="42" x2="1180" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="40" y="64" class="lbl h2">STRUCTURED &#8212; StructuredTaskScope (Java 21)</text>
  <text x="640" y="64" class="lbl h2">UNSTRUCTURED &#8212; raw Thread.start()</text>
  <line x1="600" y1="54" x2="600" y2="550" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: structured -->
  <rect x="150" y="90" width="300" height="50" rx="6" class="boxP"/>
  <text x="300" y="112" text-anchor="middle" class="lbl node">AssessmentService</text>
  <text x="300" y="130" text-anchor="middle" class="lbl sub">fork(identity, watchlist)</text>

  <rect x="40" y="170" width="520" height="230" rx="6" class="boundH"/>
  <text x="56" y="192" class="lbl tiny" font-weight="700">try (StructuredTaskScope scope = &#8230;)</text>

  <path class="bus" d="M 300 140 V 160"/>
  <path class="bus" d="M 170 160 H 430"/>
  <path class="flow" d="M 170 160 V 230"/>
  <path class="flow" d="M 430 160 V 230"/>
  <text x="312" y="153" text-anchor="start" class="lbl sub">fork()</text>

  <rect x="60" y="230" width="220" height="90" rx="6" class="boxP"/>
  <text x="170" y="255" text-anchor="middle" class="lbl node">Identity vendor call</text>
  <text x="170" y="273" text-anchor="middle" class="lbl sub">virtual thread</text>
  <text x="170" y="291" text-anchor="middle" class="lbl sub">p50 900 ms</text>

  <rect x="320" y="230" width="220" height="90" rx="6" class="boxP"/>
  <text x="430" y="255" text-anchor="middle" class="lbl node">Watchlist provider call</text>
  <text x="430" y="273" text-anchor="middle" class="lbl sub">virtual thread</text>
  <text x="430" y="291" text-anchor="middle" class="lbl sub">p50 1.4 s</text>

  <path class="bus" d="M 170 320 V 330"/>
  <path class="bus" d="M 430 320 V 330"/>
  <path class="bus" d="M 170 330 H 430"/>
  <path class="flow" d="M 300 330 V 340"/>

  <rect x="190" y="340" width="220" height="60" rx="6" class="boxR"/>
  <text x="300" y="363" text-anchor="middle" class="lbl node">scope.join()</text>
  <text x="300" y="381" text-anchor="middle" class="lbl sub">throwIfFailed()</text>

  <text x="524" y="392" text-anchor="end" class="lbl sub">close()</text>

  <rect x="40" y="410" width="520" height="70" rx="6" class="panel"/>
  <text x="56" y="428" class="lbl tiny" font-weight="700">ANNOTATION</text>
  <text x="56" y="444" class="lbl tiny">Every subtask is bound to this scope.</text>
  <text x="56" y="458" class="lbl tiny">close() blocks until all finish or are cancelled.</text>
  <text x="56" y="472" class="lbl tiny">No subtask can outlive the try block.</text>

  <!-- RIGHT: unstructured -->
  <rect x="750" y="90" width="300" height="50" rx="6" class="boxP"/>
  <text x="900" y="112" text-anchor="middle" class="lbl node">AssessmentService</text>
  <text x="900" y="130" text-anchor="middle" class="lbl sub">new Thread(&#8230;).start() &#215;2</text>

  <rect x="640" y="170" width="520" height="110" rx="6" class="boundW"/>
  <text x="660" y="192" class="lbl tiny" font-weight="700">method body &#8212; no scope boundary enforced</text>

  <path class="bus" d="M 900 140 V 160"/>
  <path class="bus" d="M 770 160 H 1030"/>
  <path class="flow" d="M 770 160 V 330"/>
  <path class="flow" d="M 1030 160 V 330"/>
  <text x="912" y="153" text-anchor="start" class="lbl sub">start()</text>
  <text x="900" y="305" text-anchor="middle" class="lbl sub">threads escape here &#8212; method already returned</text>

  <rect x="660" y="330" width="220" height="90" rx="6" class="boxF"/>
  <text x="770" y="355" text-anchor="middle" class="lbl node">Identity thread</text>
  <text x="770" y="373" text-anchor="middle" class="lbl sub">p50 900 ms</text>
  <text x="770" y="391" text-anchor="middle" class="lbl sub">ORPHAN &#8212; escaped</text>

  <rect x="920" y="330" width="220" height="90" rx="6" class="boxF"/>
  <text x="1030" y="355" text-anchor="middle" class="lbl node">Watchlist thread</text>
  <text x="1030" y="373" text-anchor="middle" class="lbl sub">p50 1.4 s</text>
  <text x="1030" y="391" text-anchor="middle" class="lbl sub">ORPHAN &#8212; escaped</text>

  <rect x="640" y="430" width="520" height="90" rx="6" class="panel"/>
  <text x="656" y="448" class="lbl tiny" font-weight="700">ANNOTATION</text>
  <text x="656" y="464" class="lbl tiny">new Thread(&#8230;).start() has no owning scope.</text>
  <text x="656" y="478" class="lbl tiny">Method returns while both threads keep running.</text>
  <text x="656" y="492" class="lbl tiny">No join(), no cancellation, no structural guarantee.</text>

  <line x1="20" y1="560" x2="1180" y2="560" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="576" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="588" class="lbl tiny">virtual-thread subtask</text>
  <rect x="190" y="576" width="20" height="14" rx="3" class="boundH"/>
  <text x="216" y="588" class="lbl tiny">enforced scope boundary</text>
  <rect x="380" y="576" width="20" height="14" rx="3" class="boxR"/>
  <text x="406" y="588" class="lbl tiny">join() / throwIfFailed()</text>
  <rect x="560" y="576" width="20" height="14" rx="3" class="boundW"/>
  <text x="586" y="588" class="lbl tiny">un-enforced method body</text>
  <rect x="760" y="576" width="20" height="14" rx="3" class="boxF"/>
  <text x="786" y="588" class="lbl tiny">orphan &#8212; escaped, no join</text>
  <rect x="940" y="576" width="20" height="14" rx="3" class="panel"/>
  <text x="966" y="588" class="lbl tiny">annotation</text>
  <path class="flow" d="M 1040 583 H 1080"/>
  <text x="1088" y="588" class="lbl tiny">fork() / start() call</text>
</svg>
