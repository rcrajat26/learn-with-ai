<svg viewBox="0 0 1040 1040" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three-frame sequence for the record pattern case Movement(LedgerEntry(Position from, Money amount), LedgerEntry to). Frame 1: the outer type test, an instanceof Movement check on the scrutinee. Frame 2: accessors invoked in declaration order verified by javap — Movement.entry(), an instanceof LedgerEntry check on the result, then Movement.to() binding to, then LedgerEntry.from() binding from, then LedgerEntry.amount() binding amount; if the instanceof LedgerEntry check fails the remaining three calls are skipped. Frame 3: an accessor call that throws is caught by a compiler-generated exception table entry and rethrown wrapped as java.lang.MatchException constructed with the original exception's toString as the message and the original exception as the cause.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; fill: #4b5563; }
    .floor { font-size: 10.5px; fill: #4b5563; }
    .code  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
    .badge { font-size: 11px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxWk { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxLg { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1040" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">RECORD DECONSTRUCTION IS ACCESSOR CALLS IN ORDER</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl code">case Movement(LedgerEntry(Position from, Money amount), LedgerEntry to) -&gt; ...</text>

  <!-- FRAME 1 -->
  <text x="20" y="92" class="lbl h2">FRAME 1 — THE OUTER TYPE TEST</text>
  <line x1="20" y1="100" x2="1020" y2="100" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="115" width="220" height="66" rx="6" class="boxP"/>
  <text x="170" y="140" text-anchor="middle" class="lbl node">o : Object</text>
  <text x="170" y="160" text-anchor="middle" class="lbl sub">the scrutinee of the switch</text>

  <path class="flow" d="M 280 148 H 360"/>
  <text x="320" y="140" text-anchor="middle" class="lbl tiny">instanceof</text>

  <rect x="360" y="115" width="240" height="66" rx="6" class="boxP"/>
  <text x="480" y="140" text-anchor="middle" class="lbl node">Movement</text>
  <text x="480" y="160" text-anchor="middle" class="lbl sub">record with 2 components</text>

  <path class="flow" d="M 600 148 H 660"/>
  <rect x="660" y="105" width="340" height="86" rx="6" class="boxAnn"/>
  <text x="676" y="126" class="lbl h2">TYPE TEST — outer pattern</text>
  <text x="676" y="146" class="lbl tiny">o instanceof Movement — checked once,</text>
  <text x="676" y="162" class="lbl tiny">before any component accessor is called.</text>
  <text x="676" y="178" class="lbl tiny">Fails here → whole case does not match.</text>

  <!-- FRAME 2 -->
  <text x="20" y="222" class="lbl h2">FRAME 2 — ACCESSORS INVOKED IN DECLARATION ORDER (verified: javap -c on --release 21)</text>
  <line x1="20" y1="230" x2="1020" y2="230" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="245" width="180" height="60" rx="6" class="boxP"/>
  <text x="150" y="268" text-anchor="middle" class="lbl node">Movement m</text>
  <text x="150" y="286" text-anchor="middle" class="lbl sub">bound from Frame 1</text>

  <!-- step 1 -->
  <path class="flow" d="M 150 305 V 330 H 340"/>
  <rect x="340" y="330" width="200" height="70" rx="6" class="boxP"/>
  <text x="440" y="350" text-anchor="middle" class="lbl badge">STEP 1</text>
  <text x="440" y="368" text-anchor="middle" class="lbl code">m.entry()</text>
  <text x="440" y="386" text-anchor="middle" class="lbl sub">outer component-1 accessor</text>

  <!-- step 2: instanceof LedgerEntry -->
  <path class="flow" d="M 540 365 H 620"/>
  <rect x="620" y="330" width="220" height="70" rx="6" class="boxP"/>
  <text x="730" y="350" text-anchor="middle" class="lbl badge">STEP 2</text>
  <text x="730" y="368" text-anchor="middle" class="lbl code">instanceof LedgerEntry</text>
  <text x="730" y="386" text-anchor="middle" class="lbl sub">type test on entry() result</text>

  <!-- fail branch -->
  <path class="weak" d="M 730 400 V 430 H 900"/>
  <rect x="820" y="430" width="180" height="56" rx="6" class="boxD"/>
  <text x="910" y="450" text-anchor="middle" class="lbl node">no match</text>
  <text x="910" y="468" text-anchor="middle" class="lbl sub">steps 3–5 SKIPPED</text>

  <!-- pass branch continues down, routed through a clear corridor at y=460 to avoid crossing the row-2 boxes -->
  <path class="flow" d="M 730 400 V 460 H 260 V 520"/>
  <text x="490" y="454" text-anchor="middle" class="lbl tiny">pass</text>

  <!-- step 3: Movement.to() -->
  <rect x="150" y="520" width="220" height="70" rx="6" class="boxR"/>
  <text x="260" y="540" text-anchor="middle" class="lbl badge">STEP 3</text>
  <text x="260" y="558" text-anchor="middle" class="lbl code">m.to()</text>
  <text x="260" y="576" text-anchor="middle" class="lbl sub">outer accessor #2, binds "to"</text>

  <!-- step 4: entry.from() -->
  <path class="flow" d="M 370 555 H 430"/>
  <rect x="430" y="520" width="240" height="70" rx="6" class="boxR"/>
  <text x="550" y="540" text-anchor="middle" class="lbl badge">STEP 4</text>
  <text x="550" y="558" text-anchor="middle" class="lbl code">entry.from()</text>
  <text x="550" y="576" text-anchor="middle" class="lbl sub">nested accessor #1, binds "from"</text>

  <!-- step 5: entry.amount() -->
  <path class="flow" d="M 670 555 H 730"/>
  <rect x="730" y="520" width="240" height="70" rx="6" class="boxR"/>
  <text x="850" y="540" text-anchor="middle" class="lbl badge">STEP 5</text>
  <text x="850" y="558" text-anchor="middle" class="lbl code">entry.amount()</text>
  <text x="850" y="576" text-anchor="middle" class="lbl sub">nested accessor #2, binds "amount"</text>

  <rect x="60" y="610" width="920" height="78" rx="6" class="boxAnn"/>
  <text x="76" y="630" class="lbl h2">ORDER, VERIFIED — not the "natural" reading order</text>
  <text x="76" y="650" class="lbl tiny">entry() runs first and is type-tested before to() runs, and to() runs before the nested</text>
  <text x="76" y="666" class="lbl tiny">from()/amount() calls — javac deconstructs breadth-first per level, not left-to-right by nesting depth.</text>

  <!-- FRAME 3 -->
  <text x="20" y="730" class="lbl h2">FRAME 3 — AN ACCESSOR THROWS</text>
  <line x1="20" y1="738" x2="1020" y2="738" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="753" width="260" height="70" rx="6" class="boxR"/>
  <text x="190" y="773" text-anchor="middle" class="lbl node code">entry.amount()</text>
  <text x="190" y="793" text-anchor="middle" class="lbl sub">any of the 4 accessor call sites</text>
  <text x="190" y="810" text-anchor="middle" class="lbl sub">is wrapped by a compiler try-region</text>

  <path class="flow" d="M 320 788 H 380"/>
  <rect x="380" y="753" width="260" height="70" rx="6" class="boxD"/>
  <text x="510" y="773" text-anchor="middle" class="lbl node">throws IllegalStateException</text>
  <text x="510" y="793" text-anchor="middle" class="lbl sub">caught by exception table entry</text>
  <text x="510" y="810" text-anchor="middle" class="lbl sub">(from,to) spans the accessor call bytecode</text>

  <path class="flow" d="M 640 788 H 700"/>
  <rect x="700" y="738" width="300" height="100" rx="6" class="boxD"/>
  <text x="720" y="760" class="lbl h2">MatchException — original as cause</text>
  <text x="720" y="780" class="lbl code">new MatchException(</text>
  <text x="740" y="796" class="lbl code">orig.toString(), orig)</text>
  <text x="720" y="814" class="lbl sub">then athrow — the case never resumes</text>
  <text x="720" y="830" class="lbl sub">the original exception is Throwable.getCause()</text>

  <rect x="60" y="858" width="940" height="78" rx="8" class="boxAnn"/>
  <text x="76" y="878" class="lbl h2">SAME WRAPPER, DIFFERENT CONSTRUCTION</text>
  <text x="76" y="898" class="lbl tiny">D-157 shows the same MatchException type thrown from an exhaustive enum switch's synthetic default —</text>
  <text x="76" y="914" class="lbl tiny">there it is built as new MatchException(null, null): no matched value, no cause, nothing left to try.</text>

  <!-- legend -->
  <line x1="20" y1="954" x2="1020" y2="954" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="969" width="24" height="16" rx="3" class="boxP"/>
  <text x="52" y="982" class="lbl tiny">type test / scrutinee</text>
  <rect x="230" y="969" width="24" height="16" rx="3" class="boxR"/>
  <text x="262" y="982" class="lbl tiny">accessor call that succeeds and binds</text>
  <rect x="530" y="969" width="24" height="16" rx="3" class="boxD"/>
  <text x="562" y="982" class="lbl tiny">no-match or thrown-exception outcome</text>
  <rect x="820" y="969" width="24" height="16" rx="3" class="boxAnn"/>
  <text x="852" y="982" class="lbl tiny">annotation / cross-reference</text>
  <path class="flow" d="M 20 1002 H 64"/>
  <text x="74" y="1007" class="lbl tiny">step → next step, same pattern match</text>
  <path class="weak" d="M 400 1002 H 444"/>
  <text x="454" y="1007" class="lbl tiny">short-circuit → skipped path</text>
</svg>
