<svg viewBox="0 0 2500 670" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline from Java 8 (March 2014) to Java 25 (September 2025), one tick every six months per JEP 322. LTS releases 8, 11, 17, 21 and 25 are taller marks with their dates. Lambdas and streams land at 8, var at 10, switch expressions at 14, text blocks at 15, records at 16, sealed classes at 17, pattern matching for switch, virtual threads and record patterns all land together at 21, gatherers at 24, and scoped values at 25. Java 21 is highlighted as the release this guide targets.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; fill: #4b5563; }
    .pillnum { font-size: 13px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pill  { fill: #fbbf24; stroke: #b45309; stroke-width: 1.6; }

    .axis  { stroke: #475569; stroke-width: 2; }
    .tickS { stroke: #475569; stroke-width: 1.6; }
    .tickL { stroke: #475569; stroke-width: 2.2; }
    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2500" height="670" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE JAVA RELEASE TRAIN — WHERE 21 SITS</text>
  <line x1="20" y1="42" x2="2480" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- JEP 322 annotation -->
  <rect x="1550" y="70" width="420" height="120" rx="6" class="boxAnn"/>
  <text x="1570" y="95" class="lbl h2">JEP 322 — SIX-MONTH RELEASE CADENCE</text>
  <text x="1570" y="115" class="lbl body">Every tick on this axis is one Java feature</text>
  <text x="1570" y="132" class="lbl body">release, six months apart.</text>
  <text x="1570" y="152" class="lbl sub">LTS status (8, 11, 17, 21, 25) is a support</text>
  <text x="1570" y="168" class="lbl sub">commitment, not a different technical cadence.</text>

  <!-- axis -->
  <line x1="100" y1="480" x2="2410" y2="480" class="axis"/>

  <!-- ticks: non-LTS -->
  <line x1="280" y1="472" x2="280" y2="488" class="tickS"/>
  <text x="280" y="505" text-anchor="middle" class="lbl tiny">9</text>
  <line x1="410" y1="472" x2="410" y2="488" class="tickS"/>
  <text x="410" y="505" text-anchor="middle" class="lbl tiny">10</text>
  <line x1="670" y1="472" x2="670" y2="488" class="tickS"/>
  <text x="670" y="505" text-anchor="middle" class="lbl tiny">12</text>
  <line x1="800" y1="472" x2="800" y2="488" class="tickS"/>
  <text x="800" y="505" text-anchor="middle" class="lbl tiny">13</text>
  <line x1="930" y1="472" x2="930" y2="488" class="tickS"/>
  <text x="930" y="505" text-anchor="middle" class="lbl tiny">14</text>
  <line x1="1060" y1="472" x2="1060" y2="488" class="tickS"/>
  <text x="1060" y="505" text-anchor="middle" class="lbl tiny">15</text>
  <line x1="1190" y1="472" x2="1190" y2="488" class="tickS"/>
  <text x="1190" y="505" text-anchor="middle" class="lbl tiny">16</text>
  <line x1="1450" y1="472" x2="1450" y2="488" class="tickS"/>
  <text x="1450" y="505" text-anchor="middle" class="lbl tiny">18</text>
  <line x1="1580" y1="472" x2="1580" y2="488" class="tickS"/>
  <text x="1580" y="505" text-anchor="middle" class="lbl tiny">19</text>
  <line x1="1710" y1="472" x2="1710" y2="488" class="tickS"/>
  <text x="1710" y="505" text-anchor="middle" class="lbl tiny">20</text>
  <line x1="1970" y1="472" x2="1970" y2="488" class="tickS"/>
  <text x="1970" y="505" text-anchor="middle" class="lbl tiny">22</text>
  <line x1="2100" y1="472" x2="2100" y2="488" class="tickS"/>
  <text x="2100" y="505" text-anchor="middle" class="lbl tiny">23</text>
  <line x1="2230" y1="472" x2="2230" y2="488" class="tickS"/>
  <text x="2230" y="505" text-anchor="middle" class="lbl tiny">24</text>

  <!-- ticks: LTS, pill + date -->
  <line x1="150" y1="460" x2="150" y2="500" class="tickL"/>
  <rect x="132" y="505" width="36" height="20" rx="10" class="pill"/>
  <text x="150" y="519" text-anchor="middle" class="lbl pillnum">8</text>
  <text x="150" y="548" text-anchor="middle" class="lbl tiny">Mar 2014</text>

  <line x1="540" y1="460" x2="540" y2="500" class="tickL"/>
  <rect x="522" y="505" width="36" height="20" rx="10" class="pill"/>
  <text x="540" y="519" text-anchor="middle" class="lbl pillnum">11</text>
  <text x="540" y="548" text-anchor="middle" class="lbl tiny">Sep 2018</text>

  <line x1="1320" y1="460" x2="1320" y2="500" class="tickL"/>
  <rect x="1302" y="505" width="36" height="20" rx="10" class="pill"/>
  <text x="1320" y="519" text-anchor="middle" class="lbl pillnum">17</text>
  <text x="1320" y="548" text-anchor="middle" class="lbl tiny">Sep 2021</text>

  <line x1="1840" y1="460" x2="1840" y2="500" class="tickL"/>
  <rect x="1822" y="505" width="36" height="20" rx="10" class="pill"/>
  <text x="1840" y="519" text-anchor="middle" class="lbl pillnum">21</text>
  <text x="1840" y="548" text-anchor="middle" class="lbl tiny">Sep 2023</text>

  <line x1="2360" y1="460" x2="2360" y2="500" class="tickL"/>
  <rect x="2342" y="505" width="36" height="20" rx="10" class="pill"/>
  <text x="2360" y="519" text-anchor="middle" class="lbl pillnum">25</text>
  <text x="2360" y="548" text-anchor="middle" class="lbl tiny">Sep 2025</text>

  <!-- Row A panels (feature above, close to axis) -->
  <path class="flow" d="M 150 440 V 480"/>
  <rect x="45" y="394" width="210" height="46" rx="6" class="boxP"/>
  <text x="150" y="413" text-anchor="middle" class="lbl node">lambdas / streams</text>
  <text x="150" y="431" text-anchor="middle" class="lbl sub">final in Java 8</text>

  <path class="flow" d="M 410 440 V 480"/>
  <rect x="305" y="394" width="210" height="46" rx="6" class="boxP"/>
  <text x="410" y="413" text-anchor="middle" class="lbl node">var</text>
  <text x="410" y="431" text-anchor="middle" class="lbl sub">final in Java 10</text>

  <path class="flow" d="M 930 440 V 480"/>
  <rect x="825" y="394" width="210" height="46" rx="6" class="boxP"/>
  <text x="930" y="413" text-anchor="middle" class="lbl node">switch expressions</text>
  <text x="930" y="431" text-anchor="middle" class="lbl sub">final in Java 14</text>

  <path class="flow" d="M 1190 440 V 480"/>
  <rect x="1085" y="394" width="210" height="46" rx="6" class="boxP"/>
  <text x="1190" y="413" text-anchor="middle" class="lbl node">records</text>
  <text x="1190" y="431" text-anchor="middle" class="lbl sub">final in Java 16</text>

  <path class="flow" d="M 2230 440 V 480"/>
  <rect x="2125" y="394" width="210" height="46" rx="6" class="boxP"/>
  <text x="2230" y="413" text-anchor="middle" class="lbl node">gatherers</text>
  <text x="2230" y="431" text-anchor="middle" class="lbl sub">final in Java 24</text>

  <!-- Row B panels (further from axis, staggered to clear Row A) -->
  <path class="flow" d="M 1060 370 V 480"/>
  <rect x="955" y="324" width="210" height="46" rx="6" class="boxP"/>
  <text x="1060" y="343" text-anchor="middle" class="lbl node">text blocks</text>
  <text x="1060" y="361" text-anchor="middle" class="lbl sub">final in Java 15</text>

  <path class="flow" d="M 1320 370 V 480"/>
  <rect x="1215" y="324" width="210" height="46" rx="6" class="boxP"/>
  <text x="1320" y="343" text-anchor="middle" class="lbl node">sealed classes</text>
  <text x="1320" y="361" text-anchor="middle" class="lbl sub">final in Java 17</text>

  <path class="flow" d="M 2360 370 V 480"/>
  <rect x="2255" y="324" width="210" height="46" rx="6" class="boxP"/>
  <text x="2360" y="343" text-anchor="middle" class="lbl node">scoped values</text>
  <text x="2360" y="361" text-anchor="middle" class="lbl sub">final in Java 25</text>

  <!-- Java 21 grouped panel (highlight — the guide's target) -->
  <path class="flow" d="M 1840 440 V 480"/>
  <rect x="1700" y="340" width="280" height="100" rx="6" class="boxH"/>
  <text x="1720" y="362" class="lbl node">JAVA 21</text>
  <text x="1720" y="379" class="lbl sub">three features land together</text>
  <text x="1720" y="399" class="lbl body">pattern matching for switch</text>
  <text x="1720" y="415" class="lbl body">virtual threads</text>
  <text x="1720" y="431" class="lbl body">record patterns</text>

  <!-- legend -->
  <line x1="20" y1="585" x2="2480" y2="585" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="598" width="24" height="16" rx="3" class="boxP"/>
  <text x="52" y="611" class="lbl tiny">feature panel — lands in this release</text>

  <rect x="440" y="598" width="24" height="16" rx="3" class="boxH"/>
  <text x="472" y="611" class="lbl tiny">Java 21 — the LTS this guide targets</text>

  <rect x="860" y="598" width="28" height="16" rx="8" class="pill"/>
  <text x="898" y="611" class="lbl tiny">LTS release number, on axis</text>

  <rect x="1220" y="598" width="24" height="16" rx="3" class="boxAnn"/>
  <text x="1252" y="611" class="lbl tiny">annotation / note</text>

  <path class="flow" d="M 1500 606 H 1544"/>
  <text x="1554" y="611" class="lbl tiny">panel → tick : feature ships in this release</text>
</svg>
