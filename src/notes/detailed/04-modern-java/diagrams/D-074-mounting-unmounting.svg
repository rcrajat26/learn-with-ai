<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Four-frame sequence of a virtual thread calling the card PSP authorise call at a 240ms p50.
     Frame 1: the virtual thread is mounted, its frames on carrier-3's platform stack. Frame 2: the blocking
     socket read triggers Continuation.yield, and the frames are copied off the carrier stack into a
     StackChunk on the heap. Frame 3: carrier-3 is reused and picks up a different runnable virtual thread
     from the scheduler queue. Frame 4: the PSP response arrives, the frames are copied back from the
     StackChunk, and execution resumes, possibly on a different carrier, carrier-7.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #1f2937; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Consolas, monospace; font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 5 3; }
    .boxAnno { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">MOUNTING AND UNMOUNTING — vthread CALLS CardPayments.authorise() (p50 240ms)</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <g>
    <text x="40" y="70" class="lbl h2">FRAME 1 — MOUNTED</text>
    <rect x="40" y="82" width="460" height="300" rx="6" class="boxW"/>
    <rect x="70" y="110" width="180" height="230" rx="6" class="boxP"/>
    <text x="160" y="132" text-anchor="middle" class="lbl node">carrier-3</text>
    <text x="160" y="148" text-anchor="middle" class="lbl sub">ForkJoinPool worker (platform)</text>
    <rect x="90" y="164" width="140" height="34" rx="4" class="boxH"/>
    <text x="160" y="185" text-anchor="middle" class="lbl tiny">frame: authorise()</text>
    <rect x="90" y="202" width="140" height="34" rx="4" class="boxH"/>
    <text x="160" y="223" text-anchor="middle" class="lbl tiny">frame: reserveStake()</text>
    <rect x="90" y="240" width="140" height="34" rx="4" class="boxH"/>
    <text x="160" y="261" text-anchor="middle" class="lbl tiny">frame: run()</text>
    <text x="160" y="300" text-anchor="middle" class="lbl sub">stack grows down</text>
    <path class="flow" d="M 250 205 H 320"/>
    <rect x="330" y="130" width="150" height="80" rx="6" class="boxR"/>
    <text x="405" y="155" text-anchor="middle" class="lbl node">vthread-2401</text>
    <text x="405" y="172" text-anchor="middle" class="lbl sub">Card PSP authorise</text>
    <text x="405" y="188" text-anchor="middle" class="lbl sub">mounted on carrier-3</text>
  </g>

  <!-- FRAME 2 -->
  <g>
    <text x="540" y="70" class="lbl h2">FRAME 2 — Continuation.yield()</text>
    <rect x="540" y="82" width="460" height="300" rx="6" class="boxW"/>
    <rect x="570" y="110" width="150" height="140" rx="6" class="boxP"/>
    <text x="645" y="132" text-anchor="middle" class="lbl node">carrier-3</text>
    <text x="645" y="148" text-anchor="middle" class="lbl sub">blocking socket read</text>
    <text x="645" y="164" text-anchor="middle" class="lbl sub">triggers yield</text>
    <text x="645" y="200" text-anchor="middle" class="lbl body">(now empty)</text>
    <path class="flow" d="M 720 155 H 780 V 190 H 850"/>
    <text x="815" y="183" text-anchor="middle" class="lbl sub">Continuation.yield</text>
    <rect x="800" y="205" width="180" height="150" rx="6" class="boxH"/>
    <text x="890" y="228" text-anchor="middle" class="lbl node">StackChunk (heap)</text>
    <rect x="820" y="240" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="257" text-anchor="middle" class="lbl tiny">authorise()</text>
    <rect x="820" y="270" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="287" text-anchor="middle" class="lbl tiny">reserveStake()</text>
    <rect x="820" y="300" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="317" text-anchor="middle" class="lbl tiny">run()</text>
    <text x="890" y="340" text-anchor="middle" class="lbl sub">vthread-2401 frames copied</text>
  </g>

  <line x1="20" y1="410" x2="1020" y2="410" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 3 -->
  <g>
    <text x="40" y="440" class="lbl h2">FRAME 3 — CARRIER REUSED</text>
    <rect x="40" y="452" width="460" height="300" rx="6" class="boxW"/>
    <rect x="70" y="480" width="180" height="230" rx="6" class="boxP"/>
    <text x="160" y="502" text-anchor="middle" class="lbl node">carrier-3</text>
    <text x="160" y="518" text-anchor="middle" class="lbl sub">reused — labelled below</text>
    <rect x="90" y="536" width="140" height="34" rx="4" class="boxH"/>
    <text x="160" y="557" text-anchor="middle" class="lbl tiny">frame: settleStake()</text>
    <rect x="90" y="574" width="140" height="34" rx="4" class="boxH"/>
    <text x="160" y="595" text-anchor="middle" class="lbl tiny">frame: run()</text>
    <path class="flow" d="M 250 555 H 320"/>
    <rect x="330" y="510" width="150" height="80" rx="6" class="boxR"/>
    <text x="405" y="535" text-anchor="middle" class="lbl node">vthread-2402</text>
    <text x="405" y="552" text-anchor="middle" class="lbl sub">settleStake DEP-301</text>
    <text x="405" y="568" text-anchor="middle" class="lbl sub">different vthread</text>
    <rect x="290" y="655" width="200" height="70" rx="4" class="boxAnno"/>
    <text x="300" y="672" class="lbl tiny" font-weight="700">carrier-3 reused</text>
    <text x="300" y="688" class="lbl tiny">vthread-2401 is parked, off any</text>
    <text x="300" y="702" class="lbl tiny">carrier, waiting on the PSP socket.</text>
  </g>

  <!-- FRAME 4 -->
  <g>
    <text x="540" y="440" class="lbl h2">FRAME 4 — RESUME</text>
    <rect x="540" y="452" width="460" height="300" rx="6" class="boxW"/>
    <rect x="800" y="480" width="180" height="150" rx="6" class="boxH"/>
    <text x="890" y="502" text-anchor="middle" class="lbl node">StackChunk (heap)</text>
    <rect x="820" y="516" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="533" text-anchor="middle" class="lbl tiny">authorise()</text>
    <rect x="820" y="546" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="563" text-anchor="middle" class="lbl tiny">reserveStake()</text>
    <rect x="820" y="576" width="140" height="26" rx="4" class="boxR"/>
    <text x="890" y="593" text-anchor="middle" class="lbl tiny">run()</text>
    <path class="flow" d="M 800 555 H 740 V 590 H 700"/>
    <text x="770" y="545" text-anchor="middle" class="lbl sub">copied back</text>
    <rect x="570" y="545" width="130" height="90" rx="6" class="boxP"/>
    <text x="635" y="568" text-anchor="middle" class="lbl node">carrier-7</text>
    <text x="635" y="584" text-anchor="middle" class="lbl sub">PSP response arrives</text>
    <text x="635" y="600" text-anchor="middle" class="lbl sub">possibly different</text>
    <text x="635" y="616" text-anchor="middle" class="lbl sub">carrier than frame 1</text>
    <rect x="560" y="660" width="420" height="60" rx="4" class="boxAnno"/>
    <text x="570" y="678" class="lbl tiny" font-weight="700">vthread-2401 remounts on carrier-7, not carrier-3</text>
    <text x="570" y="694" class="lbl tiny">the carrier is an implementation detail, never observable via Thread identity</text>
  </g>

  <line x1="20" y1="790" x2="1020" y2="790" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="810" class="lbl tiny" font-weight="700">LEGEND</text>
  <rect x="20" y="822" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="835" class="lbl tiny">carrier (platform thread)</text>
  <rect x="230" y="822" width="22" height="16" rx="3" class="boxH"/>
  <text x="260" y="835" class="lbl tiny">stack frame belonging to the running vthread</text>
  <rect x="520" y="822" width="22" height="16" rx="3" class="boxR"/>
  <text x="550" y="835" class="lbl tiny">vthread / heap StackChunk state</text>
  <rect x="20" y="850" width="22" height="16" rx="3" class="boxAnno"/>
  <text x="50" y="863" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 230 858 H 270"/>
  <text x="280" y="863" class="lbl tiny">A → B : frame/control moves from A to B</text>
</svg>
