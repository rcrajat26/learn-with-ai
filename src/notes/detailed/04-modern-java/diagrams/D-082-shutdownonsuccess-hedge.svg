<svg viewBox="0 0 1040 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="One time axis with a compression break after 2 seconds, two lanes. Replica A of
     the watchlist provider responds at 1.4 s and succeeds. Replica B of the same provider is
     cancelled by the ShutdownOnSuccess scope at the same 1.4 s instant, before it could reach its
     own tail; a dotted comparison line continues to 25 s, the watchlist provider's p99, to show
     what an un-hedged caller would have waited for. Total hedged latency is 1.4 s.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxF  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .bus   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
    .weakline { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triW); }
    .axisbreak { stroke: #9ca3af; stroke-width: 2; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SHUTDOWNONSUCCESS AS A HEDGE</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="40" y="76" class="lbl h2">REPLICA A &#8212; fast</text>
  <rect x="413" y="115" width="14" height="14" class="boxR"/>
  <text x="420" y="98" text-anchor="middle" class="lbl tiny" fill="#15803d">SUCCESS &#8212; 1.4 s</text>
  <rect x="140" y="100" width="280" height="44" rx="6" class="boxP"/>
  <text x="280" y="120" text-anchor="middle" class="lbl node">Watchlist replica A</text>
  <text x="280" y="136" text-anchor="middle" class="lbl sub">responds at 1.4 s</text>

  <text x="40" y="166" class="lbl h2">REPLICA B &#8212; slow</text>
  <rect x="413" y="185" width="14" height="14" class="boxF"/>
  <text x="420" y="168" text-anchor="middle" class="lbl tiny" fill="#b91c1c">CANCELLED &#8212; 1.4 s</text>
  <rect x="140" y="170" width="280" height="44" rx="6" class="boxP"/>
  <text x="280" y="190" text-anchor="middle" class="lbl node">Watchlist replica B</text>
  <text x="280" y="206" text-anchor="middle" class="lbl sub">cancelled by scope at 1.4 s</text>

  <path class="weakline" d="M 427 192 H 935"/>
  <text x="680" y="182" text-anchor="middle" class="lbl tiny">un-hedged comparison &#8212; not actually run</text>
  <rect x="935" y="177" width="90" height="30" rx="5" class="boxW"/>
  <text x="980" y="196" text-anchor="middle" class="lbl body">p99: 25 s</text>

  <path class="bus" d="M 120 250 H 540"/>
  <path class="flow" d="M 560 250 H 1000"/>
  <line x1="540" y1="244" x2="540" y2="256" class="axisbreak"/>
  <line x1="548" y1="244" x2="548" y2="256" class="axisbreak"/>
  <text x="544" y="282" text-anchor="middle" class="lbl tiny">scale break &#8212; compressed axis</text>

  <line x1="140" y1="242" x2="140" y2="250" stroke="#475569" stroke-width="1.3"/>
  <text x="140" y="266" text-anchor="middle" class="lbl sub">0 s</text>
  <line x1="420" y1="242" x2="420" y2="250" stroke="#475569" stroke-width="1.3"/>
  <text x="420" y="266" text-anchor="middle" class="lbl sub">1.4 s</text>
  <line x1="719" y1="242" x2="719" y2="250" stroke="#475569" stroke-width="1.3"/>
  <text x="719" y="266" text-anchor="middle" class="lbl sub">10 s</text>
  <line x1="893" y1="242" x2="893" y2="250" stroke="#475569" stroke-width="1.3"/>
  <text x="893" y="266" text-anchor="middle" class="lbl sub">20 s</text>
  <line x1="980" y1="242" x2="980" y2="250" stroke="#475569" stroke-width="1.3"/>
  <text x="980" y="266" text-anchor="middle" class="lbl sub">25 s</text>

  <rect x="140" y="300" width="860" height="70" rx="6" class="panel"/>
  <text x="156" y="318" class="lbl tiny" font-weight="700">TOTAL LATENCY &#8212; ShutdownOnSuccess hedge</text>
  <text x="156" y="336" class="lbl tiny">Fastest replica wins: total latency = 1.4 s. The slower replica is cancelled at the same instant.</text>
  <text x="156" y="352" class="lbl tiny">Its own tail (watchlist provider p99 25 s) never materializes for this hedged request.</text>

  <line x1="20" y1="392" x2="1020" y2="392" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="408" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="420" class="lbl tiny">call in progress</text>
  <rect x="180" y="408" width="20" height="14" rx="3" class="boxR"/>
  <text x="206" y="420" class="lbl tiny">success (fastest wins)</text>
  <rect x="360" y="408" width="20" height="14" rx="3" class="boxF"/>
  <text x="386" y="420" class="lbl tiny">cancelled by scope</text>
  <rect x="540" y="408" width="20" height="14" rx="3" class="boxW"/>
  <text x="566" y="420" class="lbl tiny">un-hedged comparison</text>
  <rect x="740" y="408" width="20" height="14" rx="3" class="panel"/>
  <text x="766" y="420" class="lbl tiny">annotation</text>
  <path class="flow" d="M 860 415 H 900"/>
  <text x="908" y="420" class="lbl tiny">time axis</text>
</svg>
