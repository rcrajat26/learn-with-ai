<svg viewBox="0 0 1040 860" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Four-frame sequence, time running downward, of wait() releasing and
     re-acquiring the monitor on WithdrawalQueue lock, guarding a queue of
     WithdrawalTransaction rows awaiting a PaymentRun. Frame 1: withdrawal-intake-1 holds the
     monitor with hold count 1 and calls wait() because the queue is empty. Frame 2: wait()
     releases the monitor; the JVM saves the hold count as 1 and releases it to 0;
     withdrawal-intake-1 parks in the wait set, state WAITING. Frame 3: payment-run-worker-2
     enqueues WD-8821 and calls notifyAll(); withdrawal-intake-1 moves from the wait set to
     the entry list, state BLOCKED, still competing for the monitor. Frame 4:
     withdrawal-intake-1 wins entry-list contention, re-acquires the monitor, the JVM restores
     the hold count from 0 back to 1, and wait() returns.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13.5px; font-weight: 700; }
    .body  { font-size: 13px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .cap   { font-size: 12.5px; }
    .tiny  { font-size: 11px; }
    .badge { font-size: 15px; font-weight: 700; }
    .hc    { font-size: 11px; font-weight: 700; }

    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .frame { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri475); }
  </style>
  <defs>
    <marker id="tri475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="860" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">wait() RELEASES THE MONITOR AND RE-ACQUIRES IT</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="1000" y="58" text-anchor="end" class="lbl tiny" font-weight="700">TIME</text>
  <path class="flow" d="M 1015 63 V 720"/>

  <!-- FRAME 1 -->
    <rect x="40" y="68" width="960" height="108" rx="8" class="frame"/>
<circle cx="65" cy="80" r="16" class="boxH"/>
  <text x="65" y="85" text-anchor="middle" class="lbl badge">1</text>
  <text x="95" y="85" class="lbl h2">HOLDS THE MONITOR, CALLS wait()</text>

  <rect x="90" y="96" width="260" height="70" rx="6" class="boxH"/>
  <text x="220" y="114" text-anchor="middle" class="lbl body" font-weight="600">MONITOR: WithdrawalQueue lock</text>
  <text x="220" y="131" text-anchor="middle" class="lbl sub">OWNER: withdrawal-intake-1</text>
  <text x="220" y="146" text-anchor="middle" class="lbl sub">RUNNING — queue is empty</text>
  <text x="220" y="161" text-anchor="middle" class="lbl hc">hold count = 1</text>

  <rect x="390" y="96" width="260" height="70" rx="6" class="boxW"/>
  <text x="520" y="126" text-anchor="middle" class="lbl body">WAIT SET</text>
  <text x="520" y="146" text-anchor="middle" class="lbl sub">empty</text>

  <rect x="690" y="96" width="260" height="70" rx="6" class="boxW"/>
  <text x="820" y="126" text-anchor="middle" class="lbl body">ENTRY LIST</text>
  <text x="820" y="146" text-anchor="middle" class="lbl sub">empty</text>

  <text x="60" y="190" class="lbl cap">Step 1 — withdrawal-intake-1 holds the WithdrawalQueue lock (hold count 1) and finds the</text>
  <text x="60" y="208" class="lbl cap">queue of WithdrawalTransaction rows empty, so it calls wait().</text>

  <path class="flow" d="M 220 166 V 228 H 520 V 244"/>

  <!-- FRAME 2 -->
    <rect x="40" y="244" width="960" height="108" rx="8" class="frame"/>
<circle cx="65" cy="256" r="16" class="boxH"/>
  <text x="65" y="261" text-anchor="middle" class="lbl badge">2</text>
  <text x="95" y="261" class="lbl h2">RELEASED — PARKED IN THE WAIT SET</text>

  <rect x="90" y="272" width="260" height="70" rx="6" class="boxW"/>
  <text x="220" y="298" text-anchor="middle" class="lbl body" font-weight="600">MONITOR: WithdrawalQueue lock</text>
  <text x="220" y="318" text-anchor="middle" class="lbl sub">UNLOCKED — no owner</text>

  <rect x="390" y="272" width="260" height="70" rx="6" class="boxH"/>
  <text x="520" y="292" text-anchor="middle" class="lbl body" font-weight="600">withdrawal-intake-1</text>
  <text x="520" y="309" text-anchor="middle" class="lbl sub">state: WAITING</text>
  <text x="520" y="326" text-anchor="middle" class="lbl hc">hold count saved 1, released to 0</text>

  <rect x="690" y="272" width="260" height="70" rx="6" class="boxW"/>
  <text x="820" y="302" text-anchor="middle" class="lbl body">ENTRY LIST</text>
  <text x="820" y="322" text-anchor="middle" class="lbl sub">empty</text>

  <text x="60" y="366" class="lbl cap">Step 2 — wait() releases the monitor. The JVM saves withdrawal-intake-1's hold count as 1</text>
  <text x="60" y="384" class="lbl cap">and releases it to 0; the thread moves into the wait set, state WAITING.</text>

  <path class="flow" d="M 520 342 V 404 H 820 V 420"/>

  <!-- FRAME 3 -->
    <rect x="40" y="420" width="960" height="108" rx="8" class="frame"/>
<circle cx="65" cy="432" r="16" class="boxH"/>
  <text x="65" y="437" text-anchor="middle" class="lbl badge">3</text>
  <text x="95" y="437" class="lbl h2">notifyAll() — MOVED TO THE ENTRY LIST</text>

  <rect x="90" y="448" width="260" height="70" rx="6" class="boxH"/>
  <text x="220" y="466" text-anchor="middle" class="lbl body" font-weight="600">MONITOR: WithdrawalQueue lock</text>
  <text x="220" y="483" text-anchor="middle" class="lbl sub">OWNER: payment-run-worker-2</text>
  <text x="220" y="498" text-anchor="middle" class="lbl sub">enqueues WD-8821, calls notifyAll()</text>
  <text x="220" y="513" text-anchor="middle" class="lbl hc">hold count = 1</text>

  <rect x="390" y="448" width="260" height="70" rx="6" class="boxW"/>
  <text x="520" y="474" text-anchor="middle" class="lbl body">WAIT SET</text>
  <text x="520" y="494" text-anchor="middle" class="lbl sub">empty — withdrawal-intake-1 left</text>

  <rect x="690" y="448" width="260" height="70" rx="6" class="boxP"/>
  <text x="820" y="468" text-anchor="middle" class="lbl body" font-weight="600">withdrawal-intake-1</text>
  <text x="820" y="486" text-anchor="middle" class="lbl sub">state: BLOCKED</text>
  <text x="820" y="503" text-anchor="middle" class="lbl sub">competing for the monitor</text>

  <text x="60" y="542" class="lbl cap">Step 3 — payment-run-worker-2 enqueues WD-8821 and calls notifyAll(). withdrawal-intake-1</text>
  <text x="60" y="560" class="lbl cap">moves from the wait set to the entry list — state BLOCKED, not yet runnable.</text>

  <path class="flow" d="M 820 518 V 580 H 220 V 596"/>

  <!-- FRAME 4 -->
    <rect x="40" y="596" width="960" height="108" rx="8" class="frame"/>
<circle cx="65" cy="608" r="16" class="boxH"/>
  <text x="65" y="613" text-anchor="middle" class="lbl badge">4</text>
  <text x="95" y="613" class="lbl h2">RE-ACQUIRED — wait() RETURNS</text>

  <rect x="90" y="624" width="260" height="70" rx="6" class="boxH"/>
  <text x="220" y="642" text-anchor="middle" class="lbl body" font-weight="600">MONITOR: WithdrawalQueue lock</text>
  <text x="220" y="659" text-anchor="middle" class="lbl sub">OWNER: withdrawal-intake-1</text>
  <text x="220" y="674" text-anchor="middle" class="lbl sub">RUNNABLE — wait() returns</text>
  <text x="220" y="689" text-anchor="middle" class="lbl hc">hold count restored 0 to 1</text>

  <rect x="390" y="624" width="260" height="70" rx="6" class="boxW"/>
  <text x="520" y="650" text-anchor="middle" class="lbl body">WAIT SET</text>
  <text x="520" y="670" text-anchor="middle" class="lbl sub">empty</text>

  <rect x="690" y="624" width="260" height="70" rx="6" class="boxW"/>
  <text x="820" y="650" text-anchor="middle" class="lbl body">ENTRY LIST</text>
  <text x="820" y="670" text-anchor="middle" class="lbl sub">empty — won contention</text>

  <text x="60" y="718" class="lbl cap">Step 4 — withdrawal-intake-1 wins entry-list contention, re-acquires the monitor, the JVM</text>
  <text x="60" y="736" class="lbl cap">restores its hold count from 0 back to 1, and the call to wait() returns.</text>

  <!-- LEGEND -->
  <line x1="20" y1="770" x2="1020" y2="770" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="783" width="22" height="16" rx="3" class="boxH"/>
  <text x="60" y="796" class="lbl tiny">monitor owner slot / thread mid-transition</text>

  <rect x="360" y="783" width="22" height="16" rx="3" class="boxP"/>
  <text x="390" y="796" class="lbl tiny">entry list — BLOCKED, competing for the monitor</text>

  <rect x="700" y="783" width="22" height="16" rx="3" class="boxW"/>
  <text x="730" y="796" class="lbl tiny">wait set / empty — WAITING, released the monitor</text>

  <path class="flow" d="M 30 820 H 62"/>
  <text x="70" y="825" class="lbl tiny">A → B : thread transitions from A into B across the step</text>
</svg>
