<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Safepoint bias in a profiler, before and after. Before: a getStackTrace-based sampler
     can only take an accurate sample at a safepoint poll. Those polls happen to fall inside
     ClientRestrictions.checkGate and PaymentService.settle but never inside FundsLedger.reserveStake,
     so the profile reports checkGate and settle as hot and reserveStake as never sampled, even though
     reserveStake is the real hot path. After: async-profiler using AsyncGetCallTrace with
     -XX:+DebugNonSafepoints samples the actual program counter anywhere, so its samples land inside
     reserveStake in proportion to the time actually spent there, correctly identifying
     FundsLedger.reserveStake as the hot method.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 13px; font-weight: 700; }
    .bold13 { font-size: 13px; font-weight: 700; }
    .sub    { font-size: 10.5px; fill: #4b5563; }
    .tiny   { font-size: 11px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .ann  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .tickBiased   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .tickAccurate { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; }
    .tickLine     { stroke: #9ca3af; stroke-width: 1.3; }
    .tickLineAcc  { stroke: #15803d; stroke-width: 1.3; }
  </style>

  <rect x="0" y="0" width="1120" height="420" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SAFEPOINT BIAS IN A PROFILER</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="60" y="64" class="lbl h2">BEFORE — getStackTrace() SAMPLER (safepoint-biased)</text>
  <text x="600" y="64" class="lbl h2">AFTER — async-profiler + -XX:+DebugNonSafepoints</text>

  <text x="60" y="82" class="lbl sub">accurate only at a safepoint poll — ThreadMXBean.getThreadInfo() under the hood</text>
  <text x="600" y="82" class="lbl sub">AsyncGetCallTrace samples the real PC, safepoint or not</text>

  <text x="60" y="104" class="lbl sub">same execution below — 2 loop iterations of reserveStake shown</text>
  <text x="600" y="104" class="lbl sub">same execution below — 2 loop iterations of reserveStake shown</text>

  <!-- LEFT: biased samples, never inside reserveStake -->
  <circle cx="100" cy="122" r="4" class="tickBiased"/>
  <line x1="100" y1="126" x2="100" y2="140" class="tickLine"/>
  <circle cx="230" cy="122" r="4" class="tickBiased"/>
  <line x1="230" y1="126" x2="230" y2="140" class="tickLine"/>
  <circle cx="275" cy="122" r="4" class="tickBiased"/>
  <line x1="275" y1="126" x2="275" y2="140" class="tickLine"/>
  <circle cx="405" cy="122" r="4" class="tickBiased"/>
  <line x1="405" y1="126" x2="405" y2="140" class="tickLine"/>

  <rect x="75" y="140" width="55" height="40" class="boxP"/>
  <rect x="130" y="140" width="85" height="40" class="boxH"/>
  <rect x="215" y="140" width="35" height="40" class="boxW"/>
  <rect x="250" y="140" width="55" height="40" class="boxP"/>
  <rect x="305" y="140" width="85" height="40" class="boxH"/>
  <rect x="390" y="140" width="35" height="40" class="boxW"/>

  <text x="102" y="196" text-anchor="middle" class="lbl sub">checkGate</text>
  <text x="172" y="196" text-anchor="middle" class="lbl sub">reserveStake</text>
  <text x="232" y="196" text-anchor="middle" class="lbl sub">settle</text>

  <rect x="60" y="212" width="480" height="92" rx="6" class="ann"/>
  <text x="76" y="234" class="lbl bold13">REPORTED PROFILE (WRONG)</text>
  <text x="76" y="252" class="lbl tiny">ClientRestrictions.checkGate — reported ~60% (inflated)</text>
  <text x="76" y="268" class="lbl tiny">PaymentService.settle — reported ~40% (inflated)</text>
  <text x="76" y="288" class="lbl tiny" font-weight="700">FundsLedger.reserveStake — never sampled (0%), real hot path</text>

  <!-- RIGHT: accurate samples, land inside reserveStake proportionally -->
  <circle cx="620" cy="122" r="4" class="tickAccurate"/>
  <line x1="620" y1="126" x2="620" y2="140" class="tickLineAcc"/>
  <circle cx="665" cy="122" r="4" class="tickAccurate"/>
  <line x1="665" y1="126" x2="665" y2="140" class="tickLineAcc"/>
  <circle cx="695" cy="122" r="4" class="tickAccurate"/>
  <line x1="695" y1="126" x2="695" y2="140" class="tickLineAcc"/>
  <circle cx="720" cy="122" r="4" class="tickAccurate"/>
  <line x1="720" y1="126" x2="720" y2="140" class="tickLineAcc"/>
  <circle cx="752" cy="122" r="4" class="tickAccurate"/>
  <line x1="752" y1="126" x2="752" y2="140" class="tickLineAcc"/>
  <circle cx="795" cy="122" r="4" class="tickAccurate"/>
  <line x1="795" y1="126" x2="795" y2="140" class="tickLineAcc"/>
  <circle cx="840" cy="122" r="4" class="tickAccurate"/>
  <line x1="840" y1="126" x2="840" y2="140" class="tickLineAcc"/>
  <circle cx="868" cy="122" r="4" class="tickAccurate"/>
  <line x1="868" y1="126" x2="868" y2="140" class="tickLineAcc"/>
  <circle cx="895" cy="122" r="4" class="tickAccurate"/>
  <line x1="895" y1="126" x2="895" y2="140" class="tickLineAcc"/>
  <circle cx="927" cy="122" r="4" class="tickAccurate"/>
  <line x1="927" y1="126" x2="927" y2="140" class="tickLineAcc"/>

  <rect x="595" y="140" width="55" height="40" class="boxP"/>
  <rect x="650" y="140" width="85" height="40" class="boxH"/>
  <rect x="735" y="140" width="35" height="40" class="boxW"/>
  <rect x="770" y="140" width="55" height="40" class="boxP"/>
  <rect x="825" y="140" width="85" height="40" class="boxH"/>
  <rect x="910" y="140" width="35" height="40" class="boxW"/>

  <text x="622" y="196" text-anchor="middle" class="lbl sub">checkGate</text>
  <text x="692" y="196" text-anchor="middle" class="lbl sub">reserveStake</text>
  <text x="752" y="196" text-anchor="middle" class="lbl sub">settle</text>

  <rect x="580" y="212" width="480" height="92" rx="6" class="ann"/>
  <text x="596" y="234" class="lbl bold13">REPORTED PROFILE (ACCURATE)</text>
  <text x="596" y="252" class="lbl tiny">ClientRestrictions.checkGate — ~31% (matches ground truth)</text>
  <text x="596" y="268" class="lbl tiny">PaymentService.settle — ~20% (matches ground truth)</text>
  <text x="596" y="288" class="lbl tiny" font-weight="700">FundsLedger.reserveStake — ~49%, correctly identified as hot</text>

  <line x1="20" y1="322" x2="1100" y2="322" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="20" y="332" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="345" class="lbl tiny">ClientRestrictions.checkGate</text>
  <rect x="300" y="332" width="22" height="16" rx="3" class="boxH"/>
  <text x="330" y="345" class="lbl tiny">FundsLedger.reserveStake (the mis-attributed frame)</text>
  <rect x="700" y="332" width="22" height="16" rx="3" class="boxW"/>
  <text x="730" y="345" class="lbl tiny">PaymentService.settle</text>

  <circle cx="30" cy="368" r="4" class="tickBiased"/>
  <text x="45" y="372" class="lbl tiny">safepoint-biased sample — snaps to nearest poll</text>
  <circle cx="430" cy="368" r="4" class="tickAccurate"/>
  <text x="445" y="372" class="lbl tiny">arbitrary sample — real PC via -XX:+DebugNonSafepoints</text>
</svg>
