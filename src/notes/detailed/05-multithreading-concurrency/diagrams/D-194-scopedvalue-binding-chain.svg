<svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout of ScopedValue's binding chain. Each thread holds a pointer to an
     immutable linked Carrier chain, one node per active binding; gateway-http-7 is bound to
     TRACE_ID=trc-8841af for an ApplicationGateway request, then a nested where(OPERATOR_NOTE,...)
     .run(...) pushes a new head node in front rather than mutating the existing chain, and on
     exit the thread's pointer reverts to the prior head. Beside the chain, a small per-thread
     cache keyed on the scoped value's identity hash makes get() close to a field read instead of
     a chain walk. When a StructuredTaskScope forks settlement-ingest-3 as a subtask, the child
     inherits the chain by copying the head pointer only, contrasted on the right with
     InheritableThreadLocal, which copies the entire ThreadLocalMap entry by entry into the child.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: .3px; }
    .node   { font-size: 15px; font-weight: 600; }
    .node13 { font-size: 13px; font-weight: 700; }
    .body   { font-size: 13px; }
    .dense  { font-size: 12.5px; }
    .sub    { font-size: 10.5px; fill: #4b5563; }
    .tiny   { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.4; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri475); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#tri9ca); }
    .legacy{ fill: none; stroke: #78716c; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#tri787); }
  </style>
  <defs>
    <marker id="tri475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="tri9ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="tri787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">ScopedValue'S BINDING CHAIN — IMMUTABLE, PER-THREAD</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Column 1: gateway-http-7's chain, x 20-240 -->
  <text x="20" y="63" class="lbl h2">gateway-http-7'S CHAIN</text>

  <rect x="20" y="76" width="220" height="50" rx="6" class="boxP"/>
  <text x="130" y="94" text-anchor="middle" class="lbl node">Thread</text>
  <text x="130" y="110" text-anchor="middle" class="lbl sub">gateway-http-7</text>
  <text x="130" y="122" text-anchor="middle" class="lbl sub">scopedValueBindings field</text>

  <path class="flow" d="M 130 126 V 148"/>

  <rect x="20" y="148" width="220" height="86" rx="6" class="boxH"/>
  <text x="130" y="166" text-anchor="middle" class="lbl node13">Carrier (head)</text>
  <text x="130" y="183" text-anchor="middle" class="lbl dense">OPERATOR_NOTE =</text>
  <text x="130" y="197" text-anchor="middle" class="lbl dense">"recheck KYC"</text>
  <text x="130" y="213" text-anchor="middle" class="lbl sub">pushed by nested where(...).run(...)</text>
  <text x="130" y="225" text-anchor="middle" class="lbl sub" font-style="italic">new node, prior chain untouched</text>

  <path class="flow" d="M 130 234 V 256"/>

  <rect x="20" y="256" width="220" height="66" rx="6" class="boxR"/>
  <text x="130" y="276" text-anchor="middle" class="lbl node13">Carrier</text>
  <text x="130" y="294" text-anchor="middle" class="lbl dense">TRACE_ID = trc-8841af</text>
  <text x="130" y="310" text-anchor="middle" class="lbl sub">bound at ApplicationGateway entry</text>

  <path class="flow" d="M 130 322 V 344"/>

  <rect x="55" y="344" width="150" height="34" rx="6" class="boxW"/>
  <text x="130" y="365" text-anchor="middle" class="lbl sub">prev = null (chain root)</text>

  <rect x="20" y="398" width="220" height="92" rx="6" class="boxA"/>
  <text x="34" y="418" class="lbl tiny" font-weight="700">Push, never mutate</text>
  <text x="34" y="436" class="lbl tiny">where(...).run(...) allocates one</text>
  <text x="34" y="452" class="lbl tiny">new Carrier node whose prev points</text>
  <text x="34" y="468" class="lbl tiny">at the current head. On exit the</text>
  <text x="34" y="484" class="lbl tiny">pointer reverts to that prev node.</text>

  <!-- Column 2: per-thread cache, x 290-520 -->
  <text x="290" y="63" class="lbl h2">PER-THREAD CACHE</text>

  <rect x="290" y="76" width="230" height="50" rx="6" class="boxP"/>
  <text x="405" y="94" text-anchor="middle" class="lbl node">Thread</text>
  <text x="405" y="110" text-anchor="middle" class="lbl sub">gateway-http-7</text>
  <text x="405" y="122" text-anchor="middle" class="lbl sub">scopedValueCache[]</text>

  <path class="flow" d="M 405 126 V 148"/>

  <rect x="290" y="148" width="230" height="128" rx="6" class="boxW"/>
  <text x="405" y="168" text-anchor="middle" class="lbl body" font-weight="600">small fixed-size array</text>
  <text x="405" y="188" text-anchor="middle" class="lbl dense">slot = hash(TRACE_ID) &amp; mask</text>
  <text x="313" y="212" class="lbl sub">[0] key=TRACE_ID</text>
  <text x="313" y="226" class="lbl sub">    value="trc-8841af"</text>
  <text x="313" y="248" class="lbl sub">[1] key=OPERATOR_NOTE</text>
  <text x="313" y="262" class="lbl sub">    value="recheck KYC"</text>

  <path class="weak" d="M 240 191 H 290"/>

  <rect x="290" y="300" width="230" height="112" rx="6" class="boxA"/>
  <text x="304" y="320" class="lbl tiny" font-weight="700">Why get() is fast</text>
  <text x="304" y="338" class="lbl tiny">A hit on the cache slot returns the</text>
  <text x="304" y="354" class="lbl tiny">bound value directly — no chain walk.</text>
  <text x="304" y="370" class="lbl tiny">A miss falls back to walking Carrier</text>
  <text x="304" y="386" class="lbl tiny">nodes from the head and repopulates</text>
  <text x="304" y="402" class="lbl tiny">the cache slot for next time.</text>

  <!-- Column 3: inheritance comparison, x 580-1020 -->
  <line x1="560" y1="55" x2="560" y2="600" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="580" y="63" class="lbl h2">INHERITANCE INTO A STRUCTURED SUBTASK</text>

  <!-- ScopedValue sub-column: 580-775 (width 195) -->
  <rect x="580" y="76" width="195" height="86" rx="6" class="boxR"/>
  <text x="677" y="96" text-anchor="middle" class="lbl node13">StructuredTaskScope</text>
  <text x="677" y="114" text-anchor="middle" class="lbl sub">AssessmentService.assess()</text>
  <text x="677" y="130" text-anchor="middle" class="lbl sub">forks subtask on</text>
  <text x="677" y="146" text-anchor="middle" class="lbl dense">chain head (pointer)</text>

  <path class="flow" d="M 677 162 V 184"/>

  <rect x="580" y="184" width="195" height="80" rx="6" class="boxR"/>
  <text x="677" y="204" text-anchor="middle" class="lbl node13">settlement-ingest-3</text>
  <text x="677" y="222" text-anchor="middle" class="lbl sub">bindings field :=</text>
  <text x="677" y="236" text-anchor="middle" class="lbl sub">same head</text>
  <text x="677" y="254" text-anchor="middle" class="lbl dense" font-weight="600">O(1) pointer copy</text>

  <!-- ITL sub-column: 795-1020 (width 225) -->
  <rect x="795" y="76" width="225" height="86" rx="6" class="boxL"/>
  <text x="907" y="96" text-anchor="middle" class="lbl node13">InheritableThreadLocal</text>
  <text x="907" y="114" text-anchor="middle" class="lbl sub">parent ThreadLocalMap</text>
  <text x="907" y="132" text-anchor="middle" class="lbl dense">{ TRACE_ID → trc-8841af,</text>
  <text x="907" y="148" text-anchor="middle" class="lbl dense">  OPERATOR_NOTE → "..." }</text>

  <path class="legacy" d="M 907 162 V 184"/>

  <rect x="795" y="184" width="225" height="80" rx="6" class="boxL"/>
  <text x="907" y="204" text-anchor="middle" class="lbl node13">child platform thread</text>
  <text x="907" y="222" text-anchor="middle" class="lbl sub">new ThreadLocalMap,</text>
  <text x="907" y="236" text-anchor="middle" class="lbl sub">entries copied one by one</text>
  <text x="907" y="254" text-anchor="middle" class="lbl dense" font-weight="600">O(n) in bindings held</text>

  <!-- contrast annotation -->
  <rect x="580" y="284" width="440" height="150" rx="6" class="boxA"/>
  <text x="596" y="306" class="lbl body" font-weight="700">The contrast that matters</text>
  <text x="596" y="326" class="lbl tiny">ScopedValue inheritance copies one reference — the</text>
  <text x="596" y="342" class="lbl tiny">head-of-chain pointer — so forking settlement-ingest-3</text>
  <text x="596" y="358" class="lbl tiny">under the scope costs the same regardless of how many</text>
  <text x="596" y="374" class="lbl tiny">values are bound (TRACE_ID, OPERATOR_NOTE, ...).</text>
  <text x="596" y="398" class="lbl tiny" font-weight="600">InheritableThreadLocal walks and copies the entire</text>
  <text x="596" y="414" class="lbl tiny" font-weight="600">ThreadLocalMap entry by entry — cost grows with the</text>
  <text x="596" y="430" class="lbl tiny" font-weight="600">number of bindings the parent thread is carrying.</text>

  <!-- Legend -->
  <line x1="20" y1="502" x2="1020" y2="502" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="514" width="16" height="14" rx="3" class="boxP"/>
  <text x="42" y="525" class="lbl tiny">thread / interface field</text>
  <rect x="220" y="514" width="16" height="14" rx="3" class="boxH"/>
  <text x="242" y="525" class="lbl tiny">newest chain node (head)</text>
  <rect x="450" y="514" width="16" height="14" rx="3" class="boxR"/>
  <text x="472" y="525" class="lbl tiny">resolved / shared chain node</text>
  <rect x="700" y="514" width="16" height="14" rx="3" class="boxW"/>
  <text x="722" y="525" class="lbl tiny">structural / cache slot</text>
  <rect x="880" y="514" width="16" height="14" rx="3" class="boxL"/>
  <text x="902" y="525" class="lbl tiny">legacy (ITL)</text>

  <path class="flow" d="M 20 550 H 60"/>
  <text x="68" y="554" class="lbl tiny">chain link (prev)</text>
  <path class="weak" d="M 220 550 H 260"/>
  <text x="268" y="554" class="lbl tiny">cache lookup, weak/optional</text>
  <path class="legacy" d="M 520 550 H 560"/>
  <text x="568" y="554" class="lbl tiny">legacy inheritance copy, O(n)</text>

  <text x="20" y="586" class="lbl tiny" font-style="italic">A → B : B is derived from / pushed onto A</text>
</svg>
