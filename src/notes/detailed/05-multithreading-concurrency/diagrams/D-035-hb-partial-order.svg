<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two-family comparison. Left family, ORDERED PAIR: settlement-ingest-3 writes CLIENT_CASH_AVAILABLE then unlocks monitor m; balance-view-2 locks m then reads CLIENT_CASH_AVAILABLE. A happens-before edge from the unlock to the lock constrains the write to be visible before the read, in every legal execution. Right family, UNORDERED PAIR: settlement-ingest-3 writes CLIENT_BONUS_AVAILABLE and bonus-sweep-1 writes CLIENT_LOCALE with no synchronization between them and no happens-before edge. Both wall-clock orderings are shown as equally legal: settlement-ingest-3 first, or bonus-sweep-1 first. A banner states that happens-before constrains visibility, not wall-clock order.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .hb    { fill: none; stroke: #15803d; stroke-width: 2.4; stroke-dasharray: 6 4; marker-end: url(#triG); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triGray); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">HAPPENS-BEFORE IS A PARTIAL ORDER, NOT A TIMELINE</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- band headers -->
  <rect x="20" y="56" width="520" height="28" rx="6" class="boxP"/>
  <text x="280" y="75" text-anchor="middle" class="lbl h2">ORDERED PAIR — an hb edge exists</text>

  <rect x="580" y="56" width="520" height="28" rx="6" class="boxW"/>
  <text x="840" y="75" text-anchor="middle" class="lbl h2">UNORDERED PAIR — no hb edge</text>

  <!-- LEFT: ordered pair -->
  <rect x="40" y="104" width="220" height="60" rx="6" class="boxP"/>
  <text x="55" y="124" class="lbl node">settlement-ingest-3</text>
  <text x="55" y="142" class="lbl mono">write CLIENT_CASH_AVAILABLE</text>
  <text x="55" y="156" class="lbl sub">then unlock(m)</text>

  <rect x="300" y="104" width="220" height="60" rx="6" class="boxR"/>
  <text x="315" y="124" class="lbl node">balance-view-2</text>
  <text x="315" y="142" class="lbl mono">lock(m), then read</text>
  <text x="315" y="156" class="lbl sub">CLIENT_CASH_AVAILABLE</text>

  <path class="hb" d="M 260 134 H 300"/>
  <text x="280" y="182" text-anchor="middle" class="lbl tiny" fill="#15803d" font-weight="700">unlock(m) hb lock(m)</text>

  <rect x="40" y="200" width="480" height="70" rx="6" class="boxA"/>
  <text x="56" y="220" class="lbl node">the edge is a constraint, not a clock reading</text>
  <text x="56" y="238" class="lbl tiny">the write to CLIENT_CASH_AVAILABLE must be visible to the read</text>
  <text x="56" y="254" class="lbl tiny">in every execution — regardless of which core ran first, or by how much</text>

  <!-- LEFT: only one legal ordering (the writer's write must precede the reader's read in visibility) -->
  <text x="280" y="300" text-anchor="middle" class="lbl node">only one legal outcome</text>
  <line x1="60" y1="316" x2="60" y2="430" class="weak" marker-end="none" stroke-dasharray="none" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="60" y="448" text-anchor="middle" class="lbl sub">time</text>

  <rect x="90" y="322" width="180" height="46" rx="6" class="boxP"/>
  <text x="180" y="340" text-anchor="middle" class="lbl tiny">1. write CASH_AVAILABLE,</text>
  <text x="180" y="356" text-anchor="middle" class="lbl tiny">then unlock(m)</text>
  <path class="flow" d="M 180 368 V 390"/>
  <rect x="90" y="390" width="180" height="46" rx="6" class="boxR"/>
  <text x="180" y="408" text-anchor="middle" class="lbl tiny">2. lock(m), read sees</text>
  <text x="180" y="424" text-anchor="middle" class="lbl tiny">the new value</text>

  <rect x="310" y="322" width="200" height="102" rx="6" class="boxH"/>
  <text x="410" y="344" text-anchor="middle" class="lbl node">forbidden outcome</text>
  <text x="410" y="364" text-anchor="middle" class="lbl tiny">lock(m) before the write's</text>
  <text x="410" y="380" text-anchor="middle" class="lbl tiny">unlock is program-order</text>
  <text x="410" y="396" text-anchor="middle" class="lbl tiny">impossible — balance-view-2</text>
  <text x="410" y="412" text-anchor="middle" class="lbl tiny">cannot hold m until released</text>

  <!-- RIGHT: unordered pair -->
  <rect x="600" y="104" width="220" height="60" rx="6" class="boxW"/>
  <text x="615" y="124" class="lbl node">settlement-ingest-3</text>
  <text x="615" y="142" class="lbl mono">write CLIENT_BONUS_AVAILABLE</text>
  <text x="615" y="156" class="lbl sub">no lock, no volatile</text>

  <rect x="860" y="104" width="220" height="60" rx="6" class="boxW"/>
  <text x="875" y="124" class="lbl node">bonus-sweep-1</text>
  <text x="875" y="142" class="lbl mono">write CLIENT_LOCALE</text>
  <text x="875" y="156" class="lbl sub">no lock, no volatile</text>

  <text x="840" y="196" text-anchor="middle" class="lbl tiny" fill="#9ca3af" font-weight="700">no happens-before edge between them</text>

  <rect x="600" y="200" width="480" height="70" rx="6" class="boxA"/>
  <text x="616" y="220" class="lbl node">no edge means no visibility guarantee either way</text>
  <text x="616" y="238" class="lbl tiny">neither thread is guaranteed to see the other's write promptly,</text>
  <text x="616" y="254" class="lbl tiny">and the JMM permits either wall-clock order below</text>

  <!-- RIGHT: two equally legal orderings -->
  <text x="705" y="300" text-anchor="middle" class="lbl node">legal order A</text>
  <rect x="610" y="322" width="190" height="46" rx="6" class="boxW"/>
  <text x="705" y="340" text-anchor="middle" class="lbl tiny">1. settlement-ingest-3</text>
  <text x="705" y="356" text-anchor="middle" class="lbl tiny">writes first</text>
  <path class="flow" d="M 705 368 V 390"/>
  <rect x="610" y="390" width="190" height="46" rx="6" class="boxW"/>
  <text x="705" y="408" text-anchor="middle" class="lbl tiny">2. bonus-sweep-1</text>
  <text x="705" y="424" text-anchor="middle" class="lbl tiny">writes second</text>

  <text x="975" y="300" text-anchor="middle" class="lbl node">legal order B</text>
  <rect x="880" y="322" width="190" height="46" rx="6" class="boxW"/>
  <text x="975" y="340" text-anchor="middle" class="lbl tiny">1. bonus-sweep-1</text>
  <text x="975" y="356" text-anchor="middle" class="lbl tiny">writes first</text>
  <path class="flow" d="M 975 368 V 390"/>
  <rect x="880" y="390" width="190" height="46" rx="6" class="boxW"/>
  <text x="975" y="408" text-anchor="middle" class="lbl tiny">2. settlement-ingest-3</text>
  <text x="975" y="424" text-anchor="middle" class="lbl tiny">writes second</text>

  <text x="840" y="452" text-anchor="middle" class="lbl tiny" fill="#4b5563">both orders are equally legal — the JMM makes no promise about which runs first</text>

  <!-- banner -->
  <rect x="120" y="490" width="880" height="60" rx="8" class="boxH"/>
  <text x="560" y="514" text-anchor="middle" class="lbl node" font-weight="700">hb constrains visibility, not wall-clock order</text>
  <text x="560" y="534" text-anchor="middle" class="lbl body">an hb edge fixes what a later action is guaranteed to see; it says nothing about which action</text>
  <text x="560" y="547" text-anchor="middle" class="lbl sub">the CPU actually executed first in real time — that is a separate, unrelated axis</text>

  <!-- annotation: partial order framing -->
  <rect x="40" y="574" width="1040" height="106" rx="6" class="boxA"/>
  <text x="56" y="594" class="lbl node">happens-before is a partial order over actions, not a total order over time</text>
  <text x="56" y="614" class="lbl body">a partial order relates some pairs of actions (program order within a thread, release-acquire pairs, and their transitive</text>
  <text x="56" y="632" class="lbl body">closure) and leaves the rest incomparable. Two incomparable actions — like the two writes on the right — have no</text>
  <text x="56" y="650" class="lbl body">defined hb order between them at all; asking "which happened first" is a question about wall-clock time, and the JMM</text>
  <text x="56" y="668" class="lbl sub">deliberately does not answer it. Only actions connected by an hb edge get a visibility guarantee.</text>

  <!-- legend -->
  <line x1="20" y1="700" x2="1100" y2="700" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="712" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="725" class="lbl tiny">action with an hb edge (ordered)</text>
  <rect x="260" y="712" width="22" height="16" rx="3" class="boxW"/>
  <text x="290" y="725" class="lbl tiny">action with no hb edge (unordered)</text>
  <rect x="540" y="712" width="22" height="16" rx="3" class="boxH"/>
  <text x="570" y="725" class="lbl tiny">forbidden outcome / banner</text>
  <rect x="800" y="712" width="22" height="16" rx="3" class="boxA"/>
  <text x="830" y="725" class="lbl tiny">annotation panel</text>

  <path class="hb" d="M 20 748 H 60"/>
  <text x="68" y="753" class="lbl tiny">happens-before edge (release-acquire)</text>
  <path class="flow" d="M 340 748 H 380"/>
  <text x="388" y="753" class="lbl tiny">program order within one thread</text>
  <text x="680" y="753" class="lbl tiny" fill="#9ca3af">no line drawn = no hb edge between the two writes</text>
</svg>
