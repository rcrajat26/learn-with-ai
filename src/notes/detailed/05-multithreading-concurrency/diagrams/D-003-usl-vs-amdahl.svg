<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Universal Scalability Law compared against Amdahl's law on one axis. Amdahl,
     with serial fraction S = 0.05 and no coherence penalty, rises and flattens asymptotically
     toward 20x, never turning down. The USL curve, with contention term sigma = 0.05 and
     coherence term kappa = 0.0037, tracks Amdahl closely at low thread counts, peaks near
     N = 16 at about 6.1x, and then falls as coherence cost dominates: adding threads past
     that point makes the system slower.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .body  { font-size: 12.5px; }
    .node  { font-size: 13px; font-weight: 600; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pt    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.8; }

    .axis  { stroke: #475569; stroke-width: 1.6; }
    .tick  { stroke: #475569; stroke-width: 1.3; }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .amdahl{ fill: none; stroke: #475569; stroke-width: 2.2; stroke-linejoin: round; }
    .usl   { fill: none; stroke: #15803d; stroke-width: 2.2; stroke-linejoin: round; }
    .asym  { fill: none; stroke: #9ca3af; stroke-width: 1.8; stroke-dasharray: 4 3; }
    .guide { fill: none; stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .lead  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE USL TURNS DOWNWARD WHERE AMDAHL FLATTENS</text>
  <line x1="20" y1="42" x2="980" y2="42" class="rule"/>

  <!-- axes -->
  <line x1="100" y1="560" x2="100" y2="100" class="axis"/>
  <line x1="100" y1="560" x2="900" y2="560" class="axis"/>

  <line x1="96" y1="560" x2="100" y2="560" class="tick"/>
  <text x="88" y="564" text-anchor="end" class="lbl sub">0</text>
  <line x1="96" y1="455.5" x2="100" y2="455.5" class="tick"/>
  <text x="88" y="459.5" text-anchor="end" class="lbl sub">5</text>
  <line x1="96" y1="350.9" x2="100" y2="350.9" class="tick"/>
  <text x="88" y="354.9" text-anchor="end" class="lbl sub">10</text>
  <line x1="96" y1="246.4" x2="100" y2="246.4" class="tick"/>
  <text x="88" y="250.4" text-anchor="end" class="lbl sub">15</text>
  <line x1="96" y1="141.8" x2="100" y2="141.8" class="tick"/>
  <text x="88" y="145.8" text-anchor="end" class="lbl sub">20</text>
  <text x="40" y="330" text-anchor="middle" class="lbl sub" transform="rotate(-90 40 330)">throughput / speedup (×)</text>

  <line x1="100" y1="560" x2="100" y2="565" class="tick"/>
  <text x="100" y="580" text-anchor="middle" class="lbl sub">1</text>
  <line x1="233.3" y1="560" x2="233.3" y2="565" class="tick"/>
  <text x="233.3" y="580" text-anchor="middle" class="lbl sub">2</text>
  <line x1="366.7" y1="560" x2="366.7" y2="565" class="tick"/>
  <text x="366.7" y="580" text-anchor="middle" class="lbl sub">4</text>
  <line x1="500" y1="560" x2="500" y2="565" class="tick"/>
  <text x="500" y="580" text-anchor="middle" class="lbl sub">8</text>
  <line x1="633.3" y1="560" x2="633.3" y2="565" class="tick"/>
  <text x="633.3" y="580" text-anchor="middle" class="lbl sub">16</text>
  <line x1="766.7" y1="560" x2="766.7" y2="565" class="tick"/>
  <text x="766.7" y="580" text-anchor="middle" class="lbl sub">32</text>
  <line x1="900" y1="560" x2="900" y2="565" class="tick"/>
  <text x="900" y="580" text-anchor="middle" class="lbl sub">64</text>
  <text x="500" y="600" text-anchor="middle" class="lbl sub">N (thread count, log2 scale)</text>

  <line x1="100" y1="141.8" x2="900" y2="141.8" class="asym"/>
  <text x="905" y="145.8" class="lbl tiny">1/S = 20×</text>

  <!-- Amdahl curve, S = 0.05, kappa = 0 -->
  <polyline class="amdahl" points="100,539.1 233.3,520.2 366.7,487.3 500,436.1 633.3,368.8 766.7,297.6 900,237.5"/>

  <!-- USL curve, sigma = 0.05, kappa = 0.0037 -->
  <polyline class="usl" points="100,539.1 233.3,520.45 366.7,489.98 500,452.6 633.3,433.2 711.3,440.3 766.7,452.4 844.7,474.2 900,489.8"/>

  <!-- peak marker and guide -->
  <line x1="633.3" y1="433.2" x2="633.3" y2="560" class="guide"/>
  <circle cx="633.3" cy="433.2" r="4.5" class="pt"/>

  <path class="lead" d="M 660 350 H 700 V 433.2 H 645"/>
  <rect x="520" y="304" width="220" height="60" rx="6" class="panel"/>
  <text x="630" y="322" text-anchor="middle" class="lbl node">peak ≈ 6.1× at N = 16</text>
  <text x="630" y="338" text-anchor="middle" class="lbl tiny">adding threads past here</text>
  <text x="630" y="352" text-anchor="middle" class="lbl tiny">makes it slower</text>

  <path class="lead" d="M 250 260 V 300 H 380 V 320"/>
  <rect x="90" y="200" width="380" height="62" rx="6" class="panel"/>
  <text x="104" y="218" class="lbl body">C(N) = N / (1 + σ(N−1) + κN(N−1))</text>
  <text x="104" y="236" class="lbl tiny">σ (contention) = 0.05 — same serial cost as Amdahl's S</text>
  <text x="104" y="252" class="lbl tiny">κ (coherence) = 0.0037 — cross-talk cost, grows as N²</text>

  <line x1="20" y1="600" x2="980" y2="600" class="rule"/>
  <line x1="20" y1="612" x2="46" y2="612" stroke="#475569" stroke-width="2.2"/>
  <text x="54" y="617" class="lbl tiny">Amdahl curve: S = 0.05, κ = 0 (never turns down)</text>
  <line x1="380" y1="612" x2="406" y2="612" stroke="#15803d" stroke-width="2.2"/>
  <text x="414" y="617" class="lbl tiny">USL curve: σ = 0.05, κ = 0.0037 (peaks then falls)</text>
  <line x1="740" y1="612" x2="766" y2="612" class="asym"/>
  <text x="774" y="617" class="lbl tiny">asymptote / weak</text>

  <line x1="20" y1="628" x2="980" y2="628" class="rule"/>
  <circle cx="30" cy="638" r="4.5" class="pt"/>
  <text x="44" y="643" class="lbl tiny">peak throughput point</text>
  <line x1="220" y1="638" x2="246" y2="638" class="guide"/>
  <text x="254" y="643" class="lbl tiny">guide: peak thread count, N = 16</text>
</svg>
