<svg viewBox="0 0 1040 830" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="State machine for the ReadWriteLock guarding the ClientRestrictions cache (99 percent
     reads). Three states: FREE, N READERS, and ONE WRITER. FREE transitions to ONE WRITER on
     writeLock().lock() and back on writeLock().unlock(). FREE transitions to N READERS on
     readLock().lock() and back to FREE on readLock().unlock() by the last reader; N READERS has a
     self-loop for each additional readLock().lock() incrementing the reader count. A legal downgrade
     edge runs from ONE WRITER to N READERS: step 1 acquires the read lock while still holding the
     write lock, step 2 releases the write lock, so the lock is never momentarily free. An illegal
     upgrade edge from N READERS to ONE WRITER is drawn crossed out with an X: calling
     writeLock().lock() while already holding a read lock is a self-deadlock, because the writer
     waits for its own read lock to be released, which it never will be.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxG { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .num  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .down { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 4; stroke-linejoin: round; marker-end: url(#triG); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="830" fill="#ffffff"/>

  <text x="30" y="32" class="lbl h1">ClientRestrictions CACHE — READ-WRITE LOCK STATES AND THE UPGRADE THAT DEADLOCKS</text>
  <line x1="30" y1="42" x2="1010" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FREE state -->
  <rect x="420" y="90" width="200" height="72" rx="8" class="boxP"/>
  <text x="520" y="120" text-anchor="middle" class="lbl node">FREE</text>
  <text x="520" y="140" text-anchor="middle" class="lbl sub">no readers, no writer</text>

  <!-- WRITER state -->
  <rect x="90" y="420" width="240" height="80" rx="8" class="boxH"/>
  <text x="210" y="450" text-anchor="middle" class="lbl node">ONE WRITER</text>
  <text x="210" y="470" text-anchor="middle" class="lbl sub">exclusive: writeLock() held</text>
  <text x="210" y="486" text-anchor="middle" class="lbl sub">by cache-refresh-1</text>

  <!-- READERS state -->
  <rect x="690" y="420" width="260" height="80" rx="8" class="boxG"/>
  <text x="820" y="450" text-anchor="middle" class="lbl node">N READERS</text>
  <text x="820" y="470" text-anchor="middle" class="lbl sub">shared: readLock() held by</text>
  <text x="820" y="486" text-anchor="middle" class="lbl sub">restriction-apply-1..N</text>

  <!-- FREE -> WRITER : acquire write -->
  <path class="flow" d="M 440 162 V 250 H 190 V 420"/>
  <text x="315" y="244" text-anchor="middle" class="lbl tiny">writeLock().lock()</text>

  <!-- WRITER -> FREE : release write -->
  <path class="flow" d="M 250 420 V 270 H 480 V 162"/>
  <text x="365" y="286" text-anchor="middle" class="lbl tiny">writeLock().unlock()</text>

  <!-- FREE -> READERS : acquire read -->
  <path class="flow" d="M 600 162 V 250 H 780 V 420"/>
  <text x="690" y="244" text-anchor="middle" class="lbl tiny">readLock().lock()</text>

  <!-- READERS -> FREE : release read (last reader) -->
  <path class="flow" d="M 850 420 V 270 H 560 V 162"/>
  <text x="705" y="286" text-anchor="middle" class="lbl tiny">readLock().unlock() (last reader)</text>

  <!-- READERS self loop -->
  <path class="flow" d="M 950 440 H 990 V 480 H 950"/>
  <text x="940" y="412" text-anchor="end" class="lbl tiny">readLock().lock()</text>
  <text x="940" y="518" text-anchor="end" class="lbl tiny">Nth reader, N++</text>

  <!-- DOWNGRADE : WRITER -> READERS (legal) -->
  <path class="down" d="M 290 500 V 650 H 730 V 500"/>
  <circle cx="290" cy="600" r="13" class="num"/>
  <text x="290" y="604" text-anchor="middle" class="lbl tiny">1</text>
  <circle cx="700" cy="600" r="13" class="num"/>
  <text x="700" y="604" text-anchor="middle" class="lbl tiny">2</text>
  <rect x="330" y="620" width="360" height="60" rx="6" class="boxA"/>
  <text x="345" y="638" class="lbl tiny" font-weight="700">DOWNGRADE — legal, this order only</text>
  <text x="345" y="654" class="lbl tiny">(1) acquire readLock() while still holding writeLock()</text>
  <text x="345" y="670" class="lbl tiny">(2) release writeLock() — lock is never momentarily free</text>

  <!-- UPGRADE : READERS -> WRITER (illegal, crossed out) -->
  <path class="flow" d="M 870 500 V 560 H 130 V 500"/>
  <g transform="translate(500,560)">
    <line x1="-16" y1="-16" x2="16" y2="16" stroke="#b91c1c" stroke-width="3"/>
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="#b91c1c" stroke-width="3"/>
  </g>
  <rect x="330" y="530" width="340" height="22" rx="4" class="boxR"/>
  <text x="500" y="546" text-anchor="middle" class="lbl tiny" font-weight="700">writeLock().lock() while holding readLock()</text>
  <rect x="330" y="700" width="380" height="60" rx="6" class="boxR"/>
  <text x="345" y="718" class="lbl tiny" font-weight="700">UPGRADE — ILLEGAL: self-deadlock</text>
  <text x="345" y="734" class="lbl tiny">the writer waits for its own read lock to be</text>
  <text x="345" y="750" class="lbl tiny">released, which it never will be</text>

  <!-- legend -->
  <line x1="30" y1="774" x2="1010" y2="774" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="30" y="784" width="18" height="14" rx="3" class="boxP"/>
  <text x="54" y="796" class="lbl tiny">FREE state</text>
  <rect x="150" y="784" width="18" height="14" rx="3" class="boxH"/>
  <text x="174" y="796" class="lbl tiny">ONE WRITER (exclusive)</text>
  <rect x="340" y="784" width="18" height="14" rx="3" class="boxG"/>
  <text x="364" y="796" class="lbl tiny">N READERS (shared)</text>
  <path class="flow" d="M 520 791 H 555"/>
  <text x="562" y="796" class="lbl tiny">acquire / release, A → B</text>
  <path class="down" d="M 750 791 H 785"/>
  <text x="792" y="796" class="lbl tiny">downgrade legal / X = illegal edge</text>
</svg>
