<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three panels on ABA in a TreiberStack of pending WithdrawalTransaction nodes. Left: a pooled TreiberStack where Thread A reads the top node and pauses before its CAS; Thread B pops that node and the one beneath it, then pushes a recycled node object with the same identity but a new WithdrawalTransaction; Thread A resumes and its CAS succeeds because the reference is unchanged, silently corrupting the stack. Middle: the same sequence guarded by AtomicStampedReference, where the stamp increments on every pop and push; Thread A's compareAndSet now fails because the stamp moved from 5 to 8 even though the reference matches, so Thread A retries safely. Right: an explanation of why a plain, non-pooling TreiberStack is usually ABA-safe in Java — each push allocates a fresh node, and the garbage collector cannot reuse a node's identity for a different object while a thread still holds a reference to it.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; fill: #4b5563; letter-spacing: .4px; }
    .body  { font-size: 12.5px; }
    .tiny  { font-size: 11px; }
    .tinySec { font-size: 11px; fill: #4b5563; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxG  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .flow  { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>
  <text x="20" y="32" class="lbl h1">ABA BROKEN AND FIXED, IN YOUR OWN STACK — TreiberStack OF WithdrawalTransaction NODES</text>
  <line x1="20" y1="42" x2="1380" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ===================== PANEL 1: pooled, broken ===================== -->
  <text x="40" y="66" class="lbl h2">POOLED TreiberStack — ABA CORRUPTS IT</text>

  <rect x="40" y="90" width="400" height="54" class="boxP"/>
  <text x="52" y="110" class="lbl body">top → Node#A (WD-501)</text>
  <text x="52" y="128" class="lbl body">→ Node#B (WD-502) → null</text>
  <line x1="240" y1="144" x2="240" y2="164" class="flow"/>

  <rect x="40" y="164" width="400" height="54" class="boxP"/>
  <text x="52" y="184" class="lbl body">Thread A reads: node=top (#A), next=node.next</text>
  <text x="52" y="202" class="lbl body">— paused before CAS(top, #A, next)</text>
  <line x1="240" y1="218" x2="240" y2="238" class="flow"/>

  <rect x="40" y="238" width="400" height="54" class="boxW"/>
  <text x="52" y="258" class="lbl body">Thread A suspended here —</text>
  <text x="52" y="276" class="lbl body">still holds a reference to Node identity #A</text>
  <line x1="240" y1="292" x2="240" y2="312" class="flow"/>

  <rect x="40" y="312" width="400" height="72" class="boxH"/>
  <text x="52" y="332" class="lbl body">Thread B: pop Node#A (WD-501),</text>
  <text x="52" y="348" class="lbl body">pop Node#B (WD-502), then push a POOLED</text>
  <text x="52" y="364" class="lbl body">node — same identity #A, now wraps new WD-789</text>
  <line x1="240" y1="384" x2="240" y2="404" class="flow"/>

  <rect x="40" y="404" width="400" height="54" class="boxR"/>
  <text x="52" y="424" class="lbl body">top = Node#A (recycled) →</text>
  <text x="52" y="442" class="lbl body">next now points to freed/reused memory</text>
  <line x1="240" y1="458" x2="240" y2="478" class="flow"/>

  <rect x="40" y="478" width="400" height="72" class="boxR"/>
  <text x="52" y="498" class="lbl body">Thread A resumes:</text>
  <text x="52" y="514" class="lbl body">CAS(top, Node#A, next) SUCCEEDS — reference</text>
  <text x="52" y="530" class="lbl body">equality lies; stack corrupted, WD-502 orphaned</text>
  <line x1="240" y1="550" x2="240" y2="570" class="flow"/>

  <rect x="40" y="570" width="400" height="70" class="boxA"/>
  <text x="52" y="590" class="lbl tiny" font-weight="700">ROOT CAUSE</text>
  <text x="52" y="606" class="lbl tinySec">• CAS only compares reference identity, not history</text>
  <text x="52" y="622" class="lbl tinySec">• node pooling lets a stale reference become "valid" again</text>

  <!-- ===================== PANEL 2: AtomicStampedReference, fixed ===================== -->
  <text x="500" y="66" class="lbl h2">+ AtomicStampedReference — STAMP FIXES IT</text>

  <rect x="500" y="90" width="400" height="54" class="boxP"/>
  <text x="512" y="110" class="lbl body">top → &lt;Node#A (WD-501), stamp=5&gt;</text>
  <text x="512" y="128" class="lbl body">→ &lt;Node#B (WD-502), stamp=5&gt; → null</text>
  <line x1="700" y1="144" x2="700" y2="164" class="flow"/>

  <rect x="500" y="164" width="400" height="54" class="boxP"/>
  <text x="512" y="184" class="lbl body">Thread A reads (node=top #A, stamp=5);</text>
  <text x="512" y="202" class="lbl body">next=node.next — paused before CAS</text>
  <line x1="700" y1="218" x2="700" y2="238" class="flow"/>

  <rect x="500" y="238" width="400" height="54" class="boxW"/>
  <text x="512" y="258" class="lbl body">Thread A suspended here —</text>
  <text x="512" y="276" class="lbl body">remembers stamp = 5</text>
  <line x1="700" y1="292" x2="700" y2="312" class="flow"/>

  <rect x="500" y="312" width="400" height="72" class="boxH"/>
  <text x="512" y="332" class="lbl body">Thread B: pop #A (stamp 5→6),</text>
  <text x="512" y="348" class="lbl body">pop #B (stamp 6→7), push pooled #A</text>
  <text x="512" y="364" class="lbl body">back (stamp 7→8) — same identity #A</text>
  <line x1="700" y1="384" x2="700" y2="404" class="flow"/>

  <rect x="500" y="404" width="400" height="54" class="boxP"/>
  <text x="512" y="424" class="lbl body">top = &lt;Node#A (recycled), stamp=8&gt;</text>
  <text x="512" y="442" class="lbl body">(reference matches, stamp does not)</text>
  <line x1="700" y1="458" x2="700" y2="478" class="flow"/>

  <rect x="500" y="478" width="400" height="72" class="boxG"/>
  <text x="512" y="498" class="lbl body">Thread A resumes: compareAndSet(expRef=#A,</text>
  <text x="512" y="514" class="lbl body">expStamp=5 → FAILS, stamp is 8) —</text>
  <text x="512" y="530" class="lbl body">Thread A retries with a fresh read; no corruption</text>
  <line x1="700" y1="550" x2="700" y2="570" class="flow"/>

  <rect x="500" y="570" width="400" height="70" class="boxA"/>
  <text x="512" y="590" class="lbl tiny" font-weight="700">WHY IT WORKS</text>
  <text x="512" y="606" class="lbl tinySec">• stamp increments on every pop/push, pooled or not</text>
  <text x="512" y="622" class="lbl tinySec">• CAS now compares the (reference, stamp) pair atomically</text>

  <!-- ===================== PANEL 3: plain, usually safe ===================== -->
  <text x="960" y="66" class="lbl h2">PLAIN TreiberStack — USUALLY ABA-SAFE</text>

  <rect x="960" y="90" width="400" height="54" class="boxP"/>
  <text x="972" y="110" class="lbl body">push(wd): new Node(wd, next=top) —</text>
  <text x="972" y="128" class="lbl body">a fresh object allocated every time</text>
  <line x1="1160" y1="144" x2="1160" y2="164" class="flow"/>

  <rect x="960" y="164" width="400" height="54" class="boxG"/>
  <text x="972" y="184" class="lbl body">Thread A holds a reference to Node#A →</text>
  <text x="972" y="202" class="lbl body">GC cannot reclaim it while reachable (strong ref)</text>
  <line x1="1160" y1="218" x2="1160" y2="238" class="flow"/>

  <rect x="960" y="238" width="400" height="54" class="boxG"/>
  <text x="972" y="258" class="lbl body">No other WithdrawalTransaction can be allocated</text>
  <text x="972" y="276" class="lbl body">at that same reference while A still holds it</text>
  <line x1="1160" y1="292" x2="1160" y2="312" class="flow"/>

  <rect x="960" y="312" width="400" height="160" class="boxA"/>
  <text x="972" y="332" class="lbl tiny" font-weight="700">NO POOLING → NO ABA</text>
  <text x="972" y="350" class="lbl tinySec">• ABA needs the same reference value bound to a</text>
  <text x="972" y="365" class="lbl tinySec">  different logical value</text>
  <text x="972" y="382" class="lbl tinySec">• a GC heap's identity guarantee blocks exactly that</text>
  <text x="972" y="399" class="lbl tinySec">• the pooled TreiberStack (left) reintroduces ABA by</text>
  <text x="972" y="414" class="lbl tinySec">  recycling Node objects instead of allocating fresh ones</text>
  <text x="972" y="431" class="lbl tinySec">• AtomicStampedReference (middle) is the fix when</text>
  <text x="972" y="446" class="lbl tinySec">  pooling/recycling is unavoidable (e.g. for GC pressure)</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="20" y1="670" x2="1380" y2="670" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="688" width="18" height="14" class="boxP"/>
  <text x="46" y="700" class="lbl tiny">stack state / reads (not yet resolved either way)</text>
  <rect x="20" y="710" width="18" height="14" class="boxW"/>
  <text x="46" y="722" class="lbl tiny">a thread paused / suspended mid-operation</text>
  <rect x="20" y="732" width="18" height="14" class="boxH"/>
  <text x="46" y="744" class="lbl tiny">the pivotal event: pool recycles a node's identity</text>
  <rect x="20" y="754" width="18" height="14" class="boxG"/>
  <text x="46" y="766" class="lbl tiny">correct / safe outcome</text>

  <rect x="740" y="688" width="18" height="14" class="boxR"/>
  <text x="766" y="700" class="lbl tiny">corrupted outcome — stale reference wrongly accepted</text>
  <rect x="740" y="710" width="18" height="14" class="boxA"/>
  <text x="766" y="722" class="lbl tiny">explanatory notes panel</text>
  <line x1="740" y1="739" x2="768" y2="739" stroke="#475569" stroke-width="2" marker-end="url(#tri)"/>
  <text x="778" y="744" class="lbl tiny">A → B: sequential step in the interleaving</text>
</svg>
