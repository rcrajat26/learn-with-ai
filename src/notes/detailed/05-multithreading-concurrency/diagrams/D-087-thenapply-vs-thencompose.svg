<svg viewBox="0 0 1120 580" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="thenApply versus thenCompose on the QuizStakes chain lookupClient then
     fetchWallet. Left: CF of Client dot thenApply of a function that itself returns
     CF of Wallet produces a nested CF of CF of Wallet, an outstanding stage holding another
     outstanding stage, corresponding to Stream.map. Right: the same chain with thenCompose
     flattens directly to CF of Wallet, ready to chain further, corresponding to
     Stream.flatMap. CF abbreviates CompletableFuture.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 13px; font-weight: 700; }
    .node   { font-size: 13px; font-weight: 600; }
    .sub    { font-size: 10.5px; fill: #4b5563; }
    .tiny   { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .ann   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .div   { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="580" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THENAPPLY VS THENCOMPOSE — LOOKUPCLIENT THEN FETCHWALLET</text>
  <line x1="20" y1="42" x2="1100" y2="42" class="rule"/>

  <text x="30" y="62" class="lbl h2">THENAPPLY — RESULT NESTS</text>
  <line x1="30" y1="70" x2="550" y2="70" class="div"/>
  <text x="580" y="62" class="lbl h2">THENCOMPOSE — RESULT FLATTENS</text>
  <line x1="570" y1="70" x2="1090" y2="70" class="div"/>

  <line x1="560" y1="50" x2="560" y2="340" class="div"/>

  <!-- row 1: shared starting stage, both columns -->
  <rect x="160" y="84" width="260" height="54" rx="6" class="boxP"/>
  <text x="290" y="106" text-anchor="middle" class="lbl node">CF&lt;Client&gt;</text>
  <text x="290" y="122" text-anchor="middle" class="lbl sub">lookupClient(91042)</text>

  <rect x="720" y="84" width="260" height="54" rx="6" class="boxP"/>
  <text x="850" y="106" text-anchor="middle" class="lbl node">CF&lt;Client&gt;</text>
  <text x="850" y="122" text-anchor="middle" class="lbl sub">lookupClient(91042)</text>

  <!-- arrows to row 2 -->
  <path class="flow" d="M 290 138 V 182"/>
  <text x="305" y="164" class="lbl tiny">.thenApply(c -&gt; fetchWallet(c))</text>

  <path class="flow" d="M 850 138 V 182"/>
  <text x="835" y="164" text-anchor="end" class="lbl tiny">.thenCompose(c -&gt; fetchWallet(c))</text>

  <!-- row 2 left: nested result -->
  <rect x="140" y="190" width="300" height="130" rx="6" class="boxP"/>
  <text x="152" y="210" class="lbl node">CF&lt; CF&lt;Wallet&gt; &gt;</text>
  <text x="152" y="226" class="lbl sub">type after .thenApply(...)</text>

  <rect x="190" y="246" width="200" height="54" rx="6" class="boxW"/>
  <text x="290" y="268" text-anchor="middle" class="lbl node">CF&lt;Wallet&gt;</text>
  <text x="290" y="284" text-anchor="middle" class="lbl sub">fetchWallet(client)</text>

  <text x="152" y="308" class="lbl sub">nesting: caller must .thenCompose or .join twice</text>

  <!-- row 2 right: flattened result -->
  <rect x="720" y="190" width="260" height="90" rx="6" class="boxR"/>
  <text x="850" y="222" text-anchor="middle" class="lbl node">CF&lt;Wallet&gt;</text>
  <text x="850" y="240" text-anchor="middle" class="lbl sub">fetchWallet(client)</text>
  <text x="850" y="258" text-anchor="middle" class="lbl sub">flattened — ready to chain further</text>

  <!-- annotations -->
  <rect x="140" y="345" width="300" height="70" rx="6" class="ann"/>
  <text x="152" y="362" class="lbl tiny" font-weight="700">MAP CORRESPONDENCE</text>
  <text x="152" y="378" class="lbl sub">thenApply : Function&lt;T,U&gt;</text>
  <text x="152" y="392" class="lbl sub">≈ Stream.map — can nest a stage</text>
  <text x="152" y="406" class="lbl sub">inside a stage</text>

  <rect x="720" y="345" width="260" height="70" rx="6" class="ann"/>
  <text x="732" y="362" class="lbl tiny" font-weight="700">FLATMAP CORRESPONDENCE</text>
  <text x="732" y="378" class="lbl sub">thenCompose : Function&lt;T,CS&lt;U&gt;&gt;</text>
  <text x="732" y="392" class="lbl sub">≈ Stream.flatMap — unwraps the</text>
  <text x="732" y="406" class="lbl sub">returned stage</text>

  <!-- legend -->
  <line x1="20" y1="435" x2="1100" y2="435" class="rule"/>

  <rect x="40" y="455" width="20" height="14" rx="3" class="boxP"/>
  <text x="68" y="466" class="lbl tiny">outstanding stage — not yet resolved</text>

  <rect x="380" y="455" width="20" height="14" rx="3" class="boxW"/>
  <text x="404" y="466" class="lbl tiny">nested stage — CF returned by the mapper</text>

  <rect x="780" y="455" width="20" height="14" rx="3" class="boxR"/>
  <text x="804" y="466" class="lbl tiny">flattened stage — ready to chain further</text>

  <rect x="40" y="490" width="20" height="14" rx="3" class="ann"/>
  <text x="68" y="501" class="lbl tiny">annotation — the map/flatMap correspondence</text>

  <path class="flow" d="M 400 497 H 450"/>
  <text x="460" y="501" class="lbl tiny">primary flow: stage produced from stage</text>

  <text x="760" y="501" class="lbl tiny">CF&lt;T&gt; = CompletableFuture&lt;T&gt;</text>

  <text x="560" y="530" text-anchor="middle" class="lbl tiny">thenApply is to Stream.map as thenCompose is to Stream.flatMap</text>
</svg>
