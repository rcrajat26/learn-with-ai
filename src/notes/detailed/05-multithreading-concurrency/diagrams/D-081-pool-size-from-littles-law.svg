<svg viewBox="0 0 1120 840" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Deriving the pool size from Little's law in three frames. Frame 1 states Little's law: L equals lambda times W, concurrent tasks equal arrival rate times time in system. Frame 2 derives the CPU-bound pool size N equals cores plus 1, with the plus 1 justified by page faults stalling a core. Frame 3 works the I/O-bound case for the card PSP call: 8 cores, 90 percent target utilisation, a 100 millisecond downstream wait and 2 milliseconds of compute, giving N equals 8 times 0.9 times 51 equals 367, the argument for virtual threads.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="840" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">DERIVING THE POOL SIZE FROM LITTLE'S LAW</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <text x="20" y="66" class="lbl h2">FRAME 1 — LITTLE'S LAW STATED</text>
  <rect x="20" y="76" width="1080" height="140" rx="6" class="boxA"/>
  <text x="560" y="106" text-anchor="middle" class="lbl node mono">L = λ × W</text>
  <text x="560" y="130" text-anchor="middle" class="lbl body">L = average number of tasks concurrently in the system (what a pool must hold)</text>
  <text x="560" y="150" text-anchor="middle" class="lbl body">λ = arrival rate — QuizStakes: 1,200 stake reservations/sec at peak</text>
  <text x="560" y="170" text-anchor="middle" class="lbl body">W = average time each task spends in the system, waiting + working</text>
  <text x="560" y="196" text-anchor="middle" class="lbl sub">A steady-state relation: it holds for any queue, any number of servers, any distribution.</text>

  <!-- FRAME 2 -->
  <text x="20" y="246" class="lbl h2">FRAME 2 — CPU-BOUND CASE — N = cores + 1</text>
  <text x="20" y="264" class="lbl sub">Changed since Frame 1: L is now applied to a pool doing pure computation, not I/O-bound waiting.</text>

  <rect x="20" y="278" width="340" height="120" rx="6" class="boxP"/>
  <text x="190" y="304" text-anchor="middle" class="lbl node">Pure CPU work</text>
  <text x="190" y="326" text-anchor="middle" class="lbl body">no blocking, no downstream call</text>
  <text x="190" y="346" text-anchor="middle" class="lbl body">one runnable task per core</text>
  <text x="190" y="366" text-anchor="middle" class="lbl sub">e.g. scoring an affordability model</text>
  <text x="190" y="382" text-anchor="middle" class="lbl sub">in-process, no I/O</text>

  <path class="flow" d="M 360 338 H 420"/>

  <rect x="424" y="278" width="300" height="120" rx="6" class="boxH"/>
  <text x="574" y="308" text-anchor="middle" class="lbl node mono">N = coresAvailable + 1</text>
  <text x="574" y="332" text-anchor="middle" class="lbl body">8 cores → N = 9 threads</text>
  <text x="574" y="352" text-anchor="middle" class="lbl sub">Runtime.availableProcessors()</text>
  <text x="574" y="368" text-anchor="middle" class="lbl sub">Effective Java, Item 82's rule</text>

  <path class="flow" d="M 724 338 H 784"/>

  <rect x="788" y="278" width="312" height="120" rx="6" class="boxA"/>
  <text x="944" y="302" text-anchor="middle" class="lbl node">why the "+1" ?</text>
  <text x="944" y="324" text-anchor="middle" class="lbl body">a page fault stalls that</text>
  <text x="944" y="342" text-anchor="middle" class="lbl body">core on an I/O wait it did</text>
  <text x="944" y="360" text-anchor="middle" class="lbl body">not choose — the extra</text>
  <text x="944" y="378" text-anchor="middle" class="lbl body">thread keeps cores fed</text>

  <!-- FRAME 3 -->
  <text x="20" y="428" class="lbl h2">FRAME 3 — I/O-BOUND CASE, WORKED FOR THE CARD PSP CALL</text>
  <text x="20" y="446" class="lbl sub">Changed since Frame 2: work now blocks on a downstream call, so utilisation and wait dominate cores.</text>

  <rect x="20" y="460" width="1080" height="70" rx="6" class="boxW"/>
  <text x="560" y="484" text-anchor="middle" class="lbl node mono">N = cores × U × (1 + W / C)</text>
  <text x="560" y="504" text-anchor="middle" class="lbl sub">cores = CPU cores, U = target utilisation, W = downstream wait per task, C = CPU time per task</text>

  <rect x="20" y="546" width="1080" height="216" rx="6" class="boxA"/>
  <text x="40" y="572" class="lbl node">QuizStakes numbers — card PSP authorise call downstream of a stake reservation</text>

  <text x="40" y="600" class="lbl body mono">cores = 8</text>
  <text x="260" y="600" class="lbl body mono">U = 0.9</text>
  <text x="460" y="600" class="lbl body mono">W = 100 ms  (PSP downstream wait)</text>
  <text x="840" y="600" class="lbl body mono">C = 2 ms  (local compute)</text>

  <line x1="40" y1="616" x2="1060" y2="616" stroke="#d1d5db" stroke-width="1"/>

  <text x="40" y="642" class="lbl body mono">Step 1:  W / C = 100 / 2 = 50</text>
  <text x="40" y="666" class="lbl body mono">Step 2:  1 + W / C = 1 + 50 = 51</text>
  <text x="40" y="690" class="lbl body mono">Step 3:  cores × U = 8 × 0.9 = 7.2</text>
  <text x="40" y="714" class="lbl body mono">Step 4:  N = 7.2 × 51 = 367.2 → 367 platform threads</text>

  <rect x="700" y="628" width="360" height="112" rx="6" class="boxD"/>
  <text x="880" y="654" text-anchor="middle" class="lbl node">conclusion</text>
  <text x="880" y="678" text-anchor="middle" class="lbl body">367 platform threads is</text>
  <text x="880" y="698" text-anchor="middle" class="lbl body">the argument for virtual</text>
  <text x="880" y="718" text-anchor="middle" class="lbl body">threads — a pool that size</text>
  <text x="880" y="736" text-anchor="middle" class="lbl sub">is expensive on platform threads, free on virtual ones</text>

  <path class="weak" d="M 560 616 V 630"/>

  <!-- LEGEND -->
  <line x1="20" y1="758" x2="1100" y2="758" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="768" width="20" height="14" rx="3" class="boxP"/>
  <text x="46" y="780" class="lbl tiny">CPU-bound path</text>
  <rect x="360" y="768" width="20" height="14" rx="3" class="boxH"/>
  <text x="386" y="780" class="lbl tiny">the derived formula, this frame's subject</text>
  <rect x="740" y="768" width="20" height="14" rx="3" class="boxA"/>
  <text x="766" y="780" class="lbl tiny">annotation / worked-arithmetic panel</text>
  <rect x="20" y="796" width="20" height="14" rx="3" class="boxW"/>
  <text x="46" y="808" class="lbl tiny">general Little's-law-derived formula (not this frame's subject)</text>
  <rect x="500" y="796" width="20" height="14" rx="3" class="boxD"/>
  <text x="526" y="808" class="lbl tiny">conclusion / consequence</text>
</svg>
