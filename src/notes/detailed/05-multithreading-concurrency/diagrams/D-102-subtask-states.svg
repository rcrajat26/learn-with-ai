<svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Subtask states and the illegal calls. Three states: UNAVAILABLE, the state a
     subtask holds from fork() until it completes; SUCCESS, reached when the identity vendor or
     watchlist provider call returns a value; FAILED, reached when the call throws. From
     UNAVAILABLE, completion moves to SUCCESS and failure moves to FAILED; shutdown() during
     UNAVAILABLE leaves the subtask permanently UNAVAILABLE, its result never observed. Two illegal
     edges are shown in red: calling get() while a subtask is still UNAVAILABLE, before join(),
     throws IllegalStateException; forking, joining, or closing the scope from a thread other than
     its owner, or closing subtasks out of LIFO order, throws StructureViolationException.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .ann   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .illeg { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 3 3;
             marker-end: url(#triD); }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .div   { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triD" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SUBTASK STATES AND THE ILLEGAL CALLS</text>
  <line x1="20" y1="42" x2="1020" y2="42" class="rule"/>

  <!-- state UNAVAILABLE -->
  <rect x="90" y="140" width="220" height="70" rx="8" class="boxP"/>
  <text x="200" y="170" text-anchor="middle" class="lbl node">UNAVAILABLE</text>
  <text x="200" y="190" text-anchor="middle" class="lbl sub">held from scope.fork() until</text>
  <text x="200" y="203" text-anchor="middle" class="lbl sub">the subtask completes</text>

  <!-- state SUCCESS -->
  <rect x="470" y="70" width="220" height="70" rx="8" class="boxR"/>
  <text x="580" y="100" text-anchor="middle" class="lbl node">SUCCESS</text>
  <text x="580" y="120" text-anchor="middle" class="lbl sub">identity vendor / watchlist</text>
  <text x="580" y="133" text-anchor="middle" class="lbl sub">call returned a value</text>

  <!-- state FAILED -->
  <rect x="470" y="210" width="220" height="70" rx="8" class="boxD"/>
  <text x="580" y="240" text-anchor="middle" class="lbl node">FAILED</text>
  <text x="580" y="260" text-anchor="middle" class="lbl sub">the call threw — e.g. the</text>
  <text x="580" y="273" text-anchor="middle" class="lbl sub">watchlist call at 1.4 s</text>

  <!-- transitions -->
  <path class="flow" d="M 310 165 H 380 V 105 H 470"/>
  <text x="330" y="150" class="lbl tiny">completes normally</text>

  <path class="flow" d="M 310 195 H 380 V 245 H 470"/>
  <text x="330" y="235" class="lbl tiny">completes with exception</text>

  <!-- shutdown -->
  <path class="flow" d="M 140 210 V 230"/>

  <rect x="60" y="230" width="180" height="70" rx="6" class="ann"/>
  <text x="72" y="248" class="lbl tiny" font-weight="700">SHUTDOWN FREEZES IT</text>
  <text x="72" y="264" class="lbl sub">a subtask still UNAVAILABLE</text>
  <text x="72" y="278" class="lbl sub">when shutdown() runs stays</text>
  <text x="72" y="292" class="lbl sub">UNAVAILABLE forever</text>

  <!-- illegal edge 1: get() before join() -->
  <path class="illeg" d="M 260 210 V 340"/>
  <rect x="150" y="340" width="220" height="70" rx="8" class="boxD"/>
  <text x="260" y="365" text-anchor="middle" class="lbl node">get() called here</text>
  <text x="260" y="384" text-anchor="middle" class="lbl sub">before scope.join() —</text>
  <text x="260" y="398" text-anchor="middle" class="lbl sub" font-weight="700">IllegalStateException</text>

  <!-- illegal edge 2: structure violation -->
  <rect x="470" y="340" width="480" height="130" rx="8" class="boxD"/>
  <text x="490" y="362" class="lbl node" font-size="13">StructureViolationException</text>
  <line x1="480" y1="374" x2="940" y2="374" class="div"/>
  <text x="490" y="392" class="lbl sub">fork() / join() / close() called from a thread</text>
  <text x="490" y="406" class="lbl sub">other than the scope's owner thread</text>
  <text x="490" y="426" class="lbl sub">— or —</text>
  <text x="490" y="446" class="lbl sub">a nested child scope closed out of LIFO order</text>
  <text x="490" y="460" class="lbl sub">relative to the scope that opened it</text>

  <path class="illeg" d="M 310 175 H 420 V 405 H 470"/>
  <text x="428" y="300" class="lbl tiny">non-owner fork/join/close,</text>
  <text x="428" y="314" class="lbl tiny">or out-of-LIFO close()</text>

  <rect x="60" y="500" width="890" height="90" rx="6" class="ann"/>
  <text x="72" y="520" class="lbl tiny" font-weight="700">WHY THE OWNER-THREAD RULE EXISTS</text>
  <text x="72" y="538" class="lbl sub">a StructuredTaskScope is confined to the thread that opened it — AssessmentService's</text>
  <text x="72" y="554" class="lbl sub">gateway-http-7 — so every fork(), join(), and close() must run on that same thread, and</text>
  <text x="72" y="570" class="lbl sub">nested scopes must close in reverse-open (LIFO) order, exactly like a stack of try blocks.</text>

  <!-- legend -->
  <line x1="20" y1="610" x2="1020" y2="610" class="rule"/>

  <rect x="40" y="626" width="20" height="14" rx="3" class="boxP"/>
  <text x="68" y="637" class="lbl tiny">UNAVAILABLE — the subtask's initial and pending state</text>

  <rect x="480" y="626" width="20" height="14" rx="3" class="boxR"/>
  <text x="508" y="637" class="lbl tiny">SUCCESS — terminal, value present</text>

  <rect x="40" y="652" width="20" height="14" rx="3" class="boxD"/>
  <text x="68" y="663" class="lbl tiny">FAILED, or an illegal call and its thrown exception</text>

  <rect x="480" y="652" width="20" height="14" rx="3" class="ann"/>
  <text x="508" y="663" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 40 685 H 80"/>
  <text x="88" y="689" class="lbl tiny">legal transition — A → B : A causes B</text>

  <path class="illeg" d="M 480 685 H 520"/>
  <text x="528" y="689" class="lbl tiny">illegal call — A → B : A attempted, B is the thrown exception</text>
</svg>
