<svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Time to safepoint timeline from -Xlog:safepoint*: three regions, Reaching safepoint
     (TTSP), At safepoint (the VM operation), and Leaving safepoint. Four threads arrive at the
     safepoint at different times. settlement-ingest-3, payment-run-worker-2 and operator-review-1
     poll and arrive early. ledger-reconcile-1 is stuck in a counted int loop with no safepoint poll,
     iterating over roughly 19.8 million LedgerEntry rows during nightly reconciliation, and it alone
     dominates the TTSP region, running the full width of it. GuaranteedSafepointInterval, default
     1000 ms, is marked as the backstop that forces a safepoint even with no VM operation queued.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .bold13 { font-size: 13px; font-weight: 700; }

    .boxR { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .ann  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flowSolid { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#triSlate); }
    .refLine   { stroke: #b45309; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .divider   { stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 2 3; }
  </style>
  <defs>
    <marker id="triSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">TIME TO SAFEPOINT IS NOT PAUSE TIME</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl sub">from -Xlog:safepoint*=info — nightly ledger reconciliation over ~19.8M LedgerEntry rows</text>

  <!-- region bands -->
  <rect x="170" y="80" width="480" height="26" class="boxD"/>
  <text x="410" y="98" text-anchor="middle" class="lbl tiny">REACHING SAFEPOINT (TTSP)</text>

  <rect x="650" y="80" width="200" height="26" class="boxW"/>
  <text x="750" y="98" text-anchor="middle" class="lbl tiny">AT SAFEPOINT (operation)</text>

  <rect x="850" y="80" width="140" height="26" class="boxR"/>
  <text x="920" y="98" text-anchor="middle" class="lbl tiny">LEAVING SAFEPOINT</text>

  <!-- axis -->
  <line x1="170" y1="130" x2="990" y2="130" stroke="#475569" stroke-width="2"/>
  <path d="M 985 125 L 993 130 L 985 135 Z" fill="#475569"/>
  <text x="998" y="134" class="lbl tiny">time</text>

  <line x1="650" y1="80" x2="650" y2="300" class="divider"/>
  <line x1="850" y1="80" x2="850" y2="300" class="divider"/>

  <!-- thread lanes: bars start together at the safepoint request (x=170) and end when each thread polls -->
  <text x="150" y="164" text-anchor="end" class="lbl tiny">settlement-ingest-3</text>
  <rect x="170" y="150" width="160" height="14" rx="3" class="boxR"/>
  <text x="340" y="160" class="lbl sub">arrives fast (polls at loop back-edge)</text>

  <text x="150" y="204" text-anchor="end" class="lbl tiny">payment-run-worker-2</text>
  <rect x="170" y="190" width="280" height="14" rx="3" class="boxR"/>
  <text x="310" y="200" text-anchor="middle" class="lbl sub">polls at method return</text>

  <text x="150" y="244" text-anchor="end" class="lbl tiny">operator-review-1</text>
  <rect x="170" y="230" width="360" height="14" rx="3" class="boxR"/>
  <text x="350" y="240" text-anchor="middle" class="lbl sub">polls, short wait</text>

  <text x="150" y="292" text-anchor="end" class="lbl tiny">ledger-reconcile-1</text>
  <rect x="170" y="278" width="480" height="22" rx="3" class="boxD"/>
  <text x="410" y="293" text-anchor="middle" class="lbl sub">counted int loop over ~19.8M LedgerEntry rows — no safepoint poll</text>

  <!-- guaranteed safepoint interval reference -->
  <line x1="580" y1="130" x2="580" y2="270" class="refLine"/>
  <path class="flowSolid" d="M 580 300 V 320 H 430 V 340"/>
  <rect x="250" y="340" width="360" height="50" rx="6" class="ann"/>
  <text x="266" y="358" class="lbl bold13">GuaranteedSafepointInterval = 1000 ms</text>
  <text x="266" y="376" class="lbl sub">backstop: forces a safepoint poll even with no VM op queued</text>

  <!-- at-safepoint operation -->
  <path class="flowSolid" d="M 750 106 V 340"/>
  <rect x="660" y="340" width="200" height="50" rx="6" class="ann"/>
  <text x="676" y="358" class="lbl bold13">VM operation runs</text>
  <text x="676" y="376" class="lbl sub">e.g. thread dump or</text>
  <text x="676" y="388" class="lbl sub">class redefinition</text>

  <!-- explanation panel -->
  <rect x="170" y="412" width="820" height="76" rx="6" class="ann"/>
  <text x="186" y="432" class="lbl bold13">READING THE LOG TRIPLE</text>
  <text x="186" y="450" class="lbl sub">Reaching safepoint (TTSP) dominates here because ledger-reconcile-1's counted loop has no back-edge poll — total pause</text>
  <text x="186" y="464" class="lbl sub">time is TTSP + operation + leaving, and TTSP alone can dwarf the operation. Optimizing the operation does nothing if</text>
  <text x="186" y="478" class="lbl sub">one thread cannot reach the safepoint.</text>

  <line x1="20" y1="504" x2="1100" y2="504" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="20" y="514" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="527" class="lbl tiny">thread already at safepoint (polled)</text>
  <rect x="330" y="514" width="22" height="16" rx="3" class="boxD"/>
  <text x="360" y="527" class="lbl tiny">TTSP region / thread still reaching safepoint</text>
  <rect x="680" y="514" width="22" height="16" rx="3" class="boxW"/>
  <text x="710" y="527" class="lbl tiny">VM operation region</text>
  <rect x="920" y="514" width="22" height="16" rx="3" class="ann"/>
  <text x="950" y="527" class="lbl tiny">note</text>

  <path class="flowSolid" d="M 20 552 H 62"/>
  <text x="74" y="556" class="lbl tiny">leads to</text>
  <line x1="180" y1="552" x2="222" y2="552" class="refLine"/>
  <text x="234" y="556" class="lbl tiny">GuaranteedSafepointInterval reference mark</text>
  <line x1="560" y1="552" x2="602" y2="552" class="divider"/>
  <text x="614" y="556" class="lbl tiny">region boundary</text>
</svg>
