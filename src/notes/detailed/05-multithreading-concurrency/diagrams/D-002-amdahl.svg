<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Amdahl's law with serial fraction S = 0.05. Speedup on the y axis against
     thread count N on a log2 x axis. The curve speedup equals 1 divided by S plus (1 minus S)
     divided by N passes through N=1 speedup 1.00x, N=2 speedup 1.90x, N=8 speedup 5.93x and
     N=64 speedup 15.42x, and flattens toward a dashed asymptote at 1/S = 20x that is never
     reached.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pt    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.8; }

    .axis  { stroke: #475569; stroke-width: 1.6; }
    .tick  { stroke: #475569; stroke-width: 1.3; }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .curve { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linejoin: round; }
    .asym  { fill: none; stroke: #9ca3af; stroke-width: 1.8; stroke-dasharray: 4 3; }
    .lead  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="650" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">AMDAHL'S LAW WITH S = 0.05 — SPEEDUP VS THREAD COUNT N</text>
  <line x1="20" y1="42" x2="980" y2="42" class="rule"/>

  <rect x="20" y="52" width="430" height="34" rx="6" class="panel"/>
  <text x="34" y="73" class="lbl body">Speedup(N) = 1 / (S + (1 − S) / N), S = 0.05</text>

  <!-- axes -->
  <line x1="100" y1="560" x2="100" y2="100" class="axis"/>
  <line x1="100" y1="560" x2="900" y2="560" class="axis"/>

  <!-- y ticks: speedup 0,5,10,15,20 -->
  <line x1="96" y1="560" x2="100" y2="560" class="tick"/>
  <text x="88" y="564" text-anchor="end" class="lbl sub">0</text>
  <line x1="96" y1="455.5" x2="100" y2="455.5" class="tick"/>
  <text x="88" y="459.5" text-anchor="end" class="lbl sub">5</text>
  <line x1="96" y1="350.9" x2="100" y2="350.9" class="tick"/>
  <text x="88" y="354.9" text-anchor="end" class="lbl sub">10</text>
  <line x1="96" y1="246.4" x2="100" y2="246.4" class="tick"/>
  <text x="88" y="250.4" text-anchor="end" class="lbl sub">15</text>
  <line x1="96" y1="141.8" x2="100" y2="141.8" class="tick"/>
  <text x="88" y="145.8" text-anchor="end" class="lbl sub">20</text>
  <text x="40" y="330" text-anchor="middle" class="lbl sub" transform="rotate(-90 40 330)">speedup (×)</text>

  <!-- x ticks: N = 1,2,4,8,16,32,64 (log2 spacing) -->
  <line x1="100" y1="560" x2="100" y2="565" class="tick"/>
  <text x="100" y="580" text-anchor="middle" class="lbl sub">1</text>
  <line x1="233.3" y1="560" x2="233.3" y2="565" class="tick"/>
  <text x="233.3" y="580" text-anchor="middle" class="lbl sub">2</text>
  <line x1="366.7" y1="560" x2="366.7" y2="565" class="tick"/>
  <text x="366.7" y="580" text-anchor="middle" class="lbl sub">4</text>
  <line x1="500" y1="560" x2="500" y2="565" class="tick"/>
  <text x="500" y="580" text-anchor="middle" class="lbl sub">8</text>
  <line x1="633.3" y1="560" x2="633.3" y2="565" class="tick"/>
  <text x="633.3" y="580" text-anchor="middle" class="lbl sub">16</text>
  <line x1="766.7" y1="560" x2="766.7" y2="565" class="tick"/>
  <text x="766.7" y="580" text-anchor="middle" class="lbl sub">32</text>
  <line x1="900" y1="560" x2="900" y2="565" class="tick"/>
  <text x="900" y="580" text-anchor="middle" class="lbl sub">64</text>
  <text x="500" y="600" text-anchor="middle" class="lbl sub">N (thread count, log2 scale)</text>

  <!-- asymptote 1/S = 20 -->
  <line x1="100" y1="141.8" x2="900" y2="141.8" class="asym"/>
  <text x="905" y="145.8" class="lbl tiny">1/S = 20×</text>

  <!-- computed curve -->
  <polyline class="curve" points="100,539.1 233.3,520.2 366.7,487.3 500,436.1 633.3,368.8 766.7,297.6 900,237.5"/>

  <!-- must-show points N=1,2,8,64 -->
  <circle cx="100" cy="539.1" r="4.5" class="pt"/>
  <text x="108" y="505" class="lbl tiny">N=1, 1.00×</text>

  <circle cx="233.3" cy="520.2" r="4.5" class="pt"/>
  <text x="245.3" y="478" class="lbl tiny">N=2, 1.90×</text>

  <circle cx="500" cy="436.1" r="4.5" class="pt"/>
  <text x="512" y="362" class="lbl tiny">N=8, 5.93×</text>

  <circle cx="900" cy="237.5" r="4.5" class="pt"/>

  <path class="lead" d="M 780 190 H 860 V 237.5 H 895"/>
  <rect x="640" y="164" width="140" height="46" rx="6" class="panel"/>
  <text x="710" y="182" text-anchor="middle" class="lbl node">15.4×</text>
  <text x="710" y="198" text-anchor="middle" class="lbl sub">speedup at N = 64</text>

  <line x1="20" y1="614" x2="980" y2="614" class="rule"/>
  <rect x="20" y="622" width="26" height="3" fill="#475569"/>
  <text x="54" y="628" class="lbl tiny">computed curve: Speedup(N), S = 0.05</text>
  <line x1="300" y1="623" x2="326" y2="623" class="asym"/>
  <text x="334" y="628" class="lbl tiny">weak/inferred: asymptote, never reached</text>
  <circle cx="600" cy="623" r="4.5" class="pt"/>
  <text x="614" y="628" class="lbl tiny">highlight: must-show data point (N=1,2,8,64)</text>
</svg>
