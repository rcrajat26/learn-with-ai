<svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="All six Thread.State values for a StakeSettlementWorker and every transition
     between them. NEW moves to RUNNABLE on start(). RUNNABLE loops to itself on scheduler
     dispatch. RUNNABLE moves to BLOCKED on monitorenter contention and back to RUNNABLE once
     the monitor is acquired. RUNNABLE moves to WAITING on wait() and WAITING moves to BLOCKED on
     notify(), because a notified thread must re-acquire the monitor before it can become
     RUNNABLE again — so the true path out of WAITING is WAITING to BLOCKED to RUNNABLE, never
     WAITING directly to RUNNABLE. RUNNABLE moves to TIMED_WAITING on sleep(), join(long) or
     parkNanos, and TIMED_WAITING returns to RUNNABLE on timeout expiry. RUNNABLE moves to
     TERMINATED when run() returns.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .node  { font-size: 14px; font-weight: 600; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .etxt  { font-size: 11px; fill: #1f2937; }

    .boxWk  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxDeg { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxHi  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxAnn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">Thread.State — ALL SIX VALUES AND EVERY TRANSITION (StakeSettlementWorker)</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- boxes -->
  <rect x="70" y="70" width="160" height="70" rx="6" class="boxWk"/>
  <text x="150" y="98" text-anchor="middle" class="lbl node">NEW</text>
  <text x="150" y="118" text-anchor="middle" class="lbl sub">Thread object created,</text>
  <text x="150" y="132" text-anchor="middle" class="lbl sub">start() not yet called</text>

  <rect x="670" y="70" width="160" height="70" rx="6" class="boxHi"/>
  <text x="750" y="98" text-anchor="middle" class="lbl node">WAITING</text>
  <text x="750" y="118" text-anchor="middle" class="lbl sub">wait() with no timeout,</text>
  <text x="750" y="132" text-anchor="middle" class="lbl sub">or join() with no timeout</text>

  <rect x="70" y="270" width="160" height="70" rx="6" class="boxDeg"/>
  <text x="150" y="298" text-anchor="middle" class="lbl node">BLOCKED</text>
  <text x="150" y="318" text-anchor="middle" class="lbl sub">waiting to enter a</text>
  <text x="150" y="332" text-anchor="middle" class="lbl sub">synchronized monitor</text>

  <rect x="360" y="270" width="180" height="70" rx="6" class="boxP"/>
  <text x="450" y="298" text-anchor="middle" class="lbl node">RUNNABLE</text>
  <text x="450" y="318" text-anchor="middle" class="lbl sub">executing, or ready and</text>
  <text x="450" y="332" text-anchor="middle" class="lbl sub">waiting for a CPU slice</text>

  <rect x="670" y="270" width="170" height="70" rx="6" class="boxHi"/>
  <text x="755" y="298" text-anchor="middle" class="lbl node">TIMED_WAITING</text>
  <text x="755" y="318" text-anchor="middle" class="lbl sub">sleep(), join(t),</text>
  <text x="755" y="332" text-anchor="middle" class="lbl sub">or parkNanos with a bound</text>

  <rect x="370" y="470" width="160" height="70" rx="6" class="boxR"/>
  <text x="450" y="498" text-anchor="middle" class="lbl node">TERMINATED</text>
  <text x="450" y="518" text-anchor="middle" class="lbl sub">run() has returned,</text>
  <text x="450" y="532" text-anchor="middle" class="lbl sub">thread cannot restart</text>

  <!-- edge: NEW -> RUNNABLE : start() -->
  <path class="flow" d="M 150 140 V 200 H 410 V 270"/>
  <text x="200" y="194" class="lbl etxt">start()</text>

  <!-- edge: RUNNABLE -> WAITING : wait() -->
  <path class="flow" d="M 490 270 V 200 H 750 V 140"/>
  <text x="580" y="194" class="lbl etxt">wait()</text>

  <!-- edge: WAITING -> BLOCKED : notify() -->
  <path class="flow" d="M 710 70 V 54 H 40 V 305 H 70"/>
  <text x="220" y="49" class="lbl etxt">notify() — waiter must re-acquire the monitor</text>

  <!-- edge: RUNNABLE -> BLOCKED : monitorenter contention -->
  <path class="flow" d="M 360 295 H 230"/>
  <text x="295" y="288" text-anchor="middle" class="lbl etxt">monitorenter contention</text>

  <!-- edge: BLOCKED -> RUNNABLE : monitor acquired -->
  <path class="flow" d="M 230 318 H 360"/>
  <text x="295" y="332" text-anchor="middle" class="lbl etxt">monitor acquired</text>

  <!-- edge: RUNNABLE -> TIMED_WAITING -->
  <path class="flow" d="M 540 295 H 670"/>
  <text x="605" y="288" text-anchor="middle" class="lbl etxt">sleep() / join(t) / parkNanos</text>

  <!-- edge: TIMED_WAITING -> RUNNABLE : timeout expiry -->
  <path class="flow" d="M 670 318 H 540"/>
  <text x="605" y="332" text-anchor="middle" class="lbl etxt">timeout expiry</text>

  <!-- edge: RUNNABLE self loop : scheduler dispatch -->
  <path class="flow" d="M 500 270 V 250 H 560 V 270"/>
  <text x="530" y="244" text-anchor="middle" class="lbl etxt">scheduler dispatch</text>

  <!-- edge: RUNNABLE -> TERMINATED : run returning -->
  <path class="flow" d="M 450 340 V 470"/>
  <text x="466" y="410" class="lbl etxt">run() returning</text>

  <!-- annotation: the wait -> BLOCKED -> RUNNABLE path -->
  <rect x="600" y="450" width="400" height="90" rx="6" class="boxAnn"/>
  <text x="614" y="472" class="lbl h2">WAITING NEVER GOES STRAIGHT TO RUNNABLE</text>
  <text x="614" y="492" class="lbl tiny">notify() wakes the waiter but the monitor is still</text>
  <text x="614" y="508" class="lbl tiny">held by the notifier. The path is always</text>
  <text x="614" y="524" class="lbl tiny">WAITING -&gt; BLOCKED -&gt; RUNNABLE: a notified thread</text>
  <text x="614" y="536" class="lbl tiny">must re-acquire the monitor.</text>

  <!-- legend -->
  <line x1="20" y1="570" x2="1020" y2="570" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="582" width="22" height="14" rx="3" class="boxWk"/>
  <text x="50" y="593" class="lbl tiny">not yet started</text>
  <rect x="180" y="582" width="22" height="14" rx="3" class="boxP"/>
  <text x="210" y="593" class="lbl tiny">RUNNABLE — the hub state</text>
  <rect x="400" y="582" width="22" height="14" rx="3" class="boxDeg"/>
  <text x="430" y="593" class="lbl tiny">BLOCKED — contending for a monitor</text>
  <rect x="660" y="582" width="22" height="14" rx="3" class="boxHi"/>
  <text x="690" y="593" class="lbl tiny">waiting (indefinite or timed)</text>
  <rect x="880" y="582" width="22" height="14" rx="3" class="boxR"/>
  <text x="910" y="593" class="lbl tiny">TERMINATED</text>
  <path class="flow" d="M 20 616 H 60"/>
  <text x="68" y="620" class="lbl tiny">A → B : state transition, labelled by the call or event that causes it</text>
  <rect x="620" y="608" width="22" height="14" rx="3" class="boxAnn"/>
  <text x="650" y="619" class="lbl tiny">annotation panel</text>
</svg>
