<svg viewBox="0 0 1040 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Four-frame sequence of the displaced header for the FundsLedger monitor on a
     QuizStakes Reservation. Frame 1: the mark word is neutral, unlocked. Frame 2: thread
     settlement-ingest-3 CASes a pointer to a BasicLock in its own stack frame into the mark word,
     saving the old neutral mark word there as the displaced header. Frame 3: the same thread
     recursively re-enters the synchronized block, pushing a second BasicLock slot whose displaced
     header is zero — the hold count is the stack depth of BasicLock slots, not a counter field.
     Frame 4: on unlock the thread attempts to CAS the displaced header back into the mark word;
     if no other thread touched the lock this succeeds and the mark word returns to neutral, but
     if payment-run-worker contended and inflated the lock while it was held, the CAS fails and
     the thread falls to the slow-path monitorexit against the ObjectMonitor instead.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .floor { font-size: 10.5px; fill: #4b5563; }

    .frame { fill: none; stroke: #d1d5db; stroke-width: 1.3; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE DISPLACED HEADER — FundsLedger MONITOR, settlement-ingest-3</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <rect x="20" y="80" width="480" height="300" class="frame"/>
  <text x="36" y="104" class="lbl h2">FRAME 1 — NEUTRAL MARK WORD</text>
  <line x1="36" y1="112" x2="484" y2="112" stroke="#d1d5db" stroke-width="1"/>

  <rect x="100" y="150" width="340" height="110" rx="6" class="boxP"/>
  <text x="270" y="178" text-anchor="middle" class="lbl node">Reservation (FundsLedger monitor)</text>
  <text x="270" y="200" text-anchor="middle" class="lbl body">mark word: neutral</text>
  <text x="270" y="220" text-anchor="middle" class="lbl sub">hash bits, unlocked, no BasicLock ptr</text>

  <text x="270" y="300" text-anchor="middle" class="lbl sub">starting state — before synchronized(fundsLedger)</text>

  <!-- FRAME 2 -->
  <rect x="540" y="80" width="480" height="300" class="frame"/>
  <text x="556" y="104" class="lbl h2">FRAME 2 — CAS STACK-LOCK IN</text>
  <line x1="556" y1="112" x2="1004" y2="112" stroke="#d1d5db" stroke-width="1"/>

  <rect x="580" y="150" width="220" height="90" rx="6" class="boxH"/>
  <text x="690" y="176" text-anchor="middle" class="lbl node">Reservation</text>
  <text x="690" y="196" text-anchor="middle" class="lbl body">mark word -&gt;</text>
  <text x="690" y="214" text-anchor="middle" class="lbl sub">ptr to BasicLock</text>

  <rect x="820" y="150" width="180" height="120" rx="6" class="boxP"/>
  <text x="910" y="176" text-anchor="middle" class="lbl node">settlement-ingest-3</text>
  <text x="910" y="196" text-anchor="middle" class="lbl body">BasicLock slot</text>
  <text x="910" y="214" text-anchor="middle" class="lbl sub">displaced header =</text>
  <text x="910" y="230" text-anchor="middle" class="lbl sub">neutral mark word</text>

  <path class="flow" d="M 820 200 H 800"/>
  <text x="810" y="188" text-anchor="middle" class="lbl floor">CAS</text>

  <text x="800" y="300" text-anchor="middle" class="lbl sub">old mark word copied into the BasicLock as the displaced header</text>

  <!-- FRAME 3 -->
  <rect x="20" y="400" width="480" height="300" class="frame"/>
  <text x="36" y="424" class="lbl h2">FRAME 3 — RECURSIVE ACQUISITION</text>
  <line x1="36" y1="432" x2="484" y2="432" stroke="#d1d5db" stroke-width="1"/>

  <rect x="100" y="470" width="340" height="70" rx="6" class="boxH"/>
  <text x="270" y="494" text-anchor="middle" class="lbl node">Reservation</text>
  <text x="270" y="514" text-anchor="middle" class="lbl body">mark word -&gt; BasicLock slot 1 (outer)</text>

  <path class="flow" d="M 270 540 V 560"/>
  <text x="330" y="554" text-anchor="middle" class="lbl floor">same thread, still held</text>

  <rect x="100" y="560" width="340" height="130" rx="6" class="boxP"/>
  <text x="270" y="580" text-anchor="middle" class="lbl node">settlement-ingest-3 frame</text>
  <text x="270" y="600" text-anchor="middle" class="lbl sub">slot 1 (outer): displaced header = neutral</text>
  <text x="270" y="618" text-anchor="middle" class="lbl sub">slot 2 (recursive, new): displaced header = 0</text>
  <text x="270" y="638" text-anchor="middle" class="lbl floor">hold count = stack depth of BasicLock slots,</text>
  <text x="270" y="654" text-anchor="middle" class="lbl floor">there is no counter field</text>

  <!-- FRAME 4 -->
  <rect x="540" y="400" width="480" height="300" class="frame"/>
  <text x="556" y="424" class="lbl h2">FRAME 4 — UNLOCK: SUCCESS vs INFLATED-WHILE-HELD</text>
  <line x1="556" y1="432" x2="1004" y2="432" stroke="#d1d5db" stroke-width="1"/>

  <rect x="600" y="460" width="360" height="60" rx="6" class="boxP"/>
  <text x="780" y="483" text-anchor="middle" class="lbl node">unlock: CAS displaced header back?</text>
  <text x="780" y="500" text-anchor="middle" class="lbl sub">thread = settlement-ingest-3</text>

  <path class="flow" d="M 780 520 V 540 H 685 V 555"/>
  <text x="700" y="536" text-anchor="middle" class="lbl floor">yes</text>
  <path class="flow" d="M 780 520 V 540 H 875 V 555"/>
  <text x="862" y="536" text-anchor="middle" class="lbl floor">no</text>

  <rect x="600" y="555" width="170" height="130" rx="6" class="boxR"/>
  <text x="685" y="580" text-anchor="middle" class="lbl node">unlock succeeds</text>
  <text x="685" y="602" text-anchor="middle" class="lbl sub">CAS OK: mark word</text>
  <text x="685" y="618" text-anchor="middle" class="lbl sub">restored to neutral</text>
  <text x="685" y="634" text-anchor="middle" class="lbl sub">BasicLock slot popped</text>

  <rect x="790" y="555" width="170" height="130" rx="6" class="boxD"/>
  <text x="875" y="580" text-anchor="middle" class="lbl node">inflated mid-hold</text>
  <text x="875" y="602" text-anchor="middle" class="lbl sub">payment-run-worker</text>
  <text x="875" y="618" text-anchor="middle" class="lbl sub">contended mid-hold</text>
  <text x="875" y="634" text-anchor="middle" class="lbl sub">CAS fails -&gt; slow path</text>
  <text x="875" y="650" text-anchor="middle" class="lbl sub">monitorexit</text>

  <!-- legend -->
  <line x1="20" y1="716" x2="1020" y2="716" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="730" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="743" class="lbl tiny">Reservation / thread frame (structural)</text>
  <rect x="420" y="730" width="22" height="16" rx="3" class="boxH"/>
  <text x="450" y="743" class="lbl tiny">mark word value that just changed</text>
  <rect x="20" y="756" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="769" class="lbl tiny">success path</text>
  <rect x="220" y="756" width="22" height="16" rx="3" class="boxD"/>
  <text x="250" y="769" class="lbl tiny">failure / contention path</text>
  <path class="flow" d="M 520 764 H 560"/>
  <text x="570" y="769" class="lbl tiny">A -&gt; B : step / CAS</text>
</svg>
