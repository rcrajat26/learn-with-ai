<svg viewBox="0 0 1040 840" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ThreadPoolExecutor submission algorithm for settlement-ingest.execute(task). Decision 1: if
     workerCount is less than corePoolSize, add a new worker even if idle threads exist, then run the task and stop.
     Otherwise decision 2: try workQueue.offer(task); if it succeeds, do the post-enqueue double-check: re-read ctl,
     and if the pool has since been shut down, remove the task and reject it; else if the worker count is now zero,
     add one idle worker to guarantee the queued task is eventually picked up. If offer fails, decision 3: if
     workerCount is less than maximumPoolSize, add a new worker and run the task directly, bypassing the queue.
     Otherwise decision 4: the pool is saturated, so handler.rejectedExecution(task, executor) runs, which for the
     default AbortPolicy throws RejectedExecutionException.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; fill: #4b5563; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .yes   { fill: none; stroke: #15803d; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triG); }
    .no    { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triR); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="840" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE ThreadPoolExecutor SUBMISSION ALGORITHM — settlement-ingest.execute(task)</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- entry -->
  <rect x="400" y="56" width="240" height="42" rx="20" class="boxW"/>
  <text x="520" y="82" text-anchor="middle" class="lbl body">execute(settlementTask)</text>

  <path class="flow" d="M 520 98 V 118"/>

  <!-- Decision 1 -->
  <rect x="360" y="118" width="320" height="66" rx="6" class="boxH"/>
  <text x="520" y="142" text-anchor="middle" class="lbl body" font-weight="600">(1) workerCount &lt; corePoolSize ?</text>
  <text x="520" y="160" text-anchor="middle" class="lbl sub">checked even if idle threads are sitting in the pool</text>
  <text x="520" y="176" text-anchor="middle" class="lbl sub">— core threads are never reused ahead of new ones</text>

  <!-- YES branch: add worker even if idle -->
  <path class="yes" d="M 360 151 H 130 V 220"/>
  <text x="220" y="205" class="lbl tiny" fill="#15803d">yes</text>
  <rect x="30" y="220" width="260" height="70" rx="6" class="boxR"/>
  <text x="160" y="244" text-anchor="middle" class="lbl body" font-weight="600">addWorker(task, core=true)</text>
  <text x="160" y="262" text-anchor="middle" class="lbl sub">new settlement-ingest-N thread,</text>
  <text x="160" y="277" text-anchor="middle" class="lbl sub">even if idle threads exist</text>

  <!-- NO branch continues down to decision 2 -->
  <path class="no" d="M 680 151 H 910 V 220"/>
  <text x="850" y="205" class="lbl tiny" fill="#b91c1c">no</text>
  <path class="flow" d="M 910 220 V 240 H 520 V 260"/>

  <!-- Decision 2 -->
  <rect x="360" y="260" width="320" height="56" rx="6" class="boxH"/>
  <text x="520" y="284" text-anchor="middle" class="lbl body" font-weight="600">(2) workQueue.offer(task) succeeds ?</text>
  <text x="520" y="302" text-anchor="middle" class="lbl sub">e.g. LinkedBlockingQueue of stake reservations</text>

  <!-- YES -> double-check box -->
  <path class="yes" d="M 360 288 H 130 V 350"/>
  <text x="220" y="335" class="lbl tiny" fill="#15803d">yes</text>
  <rect x="20" y="350" width="280" height="130" rx="6" class="boxW"/>
  <text x="160" y="372" text-anchor="middle" class="lbl body" font-weight="600">post-enqueue double-check</text>
  <text x="36" y="392" class="lbl tiny">re-read ctl</text>
  <text x="36" y="410" class="lbl tiny">if pool shut down since offer:</text>
  <text x="46" y="426" class="lbl tiny">remove(task); reject via handler</text>
  <text x="36" y="446" class="lbl tiny">else if workerCount == 0:</text>
  <text x="46" y="462" class="lbl tiny">addWorker(null, core=false) —</text>
  <text x="46" y="475" class="lbl tiny">guarantees the queued task runs</text>

  <!-- NO branch continues down to decision 3 -->
  <path class="no" d="M 680 288 H 910 V 350"/>
  <text x="850" y="335" class="lbl tiny" fill="#b91c1c">no (queue full/rejects)</text>
  <path class="flow" d="M 910 350 V 400 H 520 V 420"/>

  <!-- Decision 3 -->
  <rect x="360" y="420" width="320" height="66" rx="6" class="boxH"/>
  <text x="520" y="444" text-anchor="middle" class="lbl body" font-weight="600">(3) workerCount &lt; maximumPoolSize ?</text>
  <text x="520" y="462" text-anchor="middle" class="lbl sub">grow beyond core, up to the max bound</text>
  <text x="520" y="478" text-anchor="middle" class="lbl sub">— only reachable once the queue is full</text>

  <!-- YES -->
  <path class="yes" d="M 360 453 H 330 V 553 H 160 V 520"/>
  <text x="345" y="505" class="lbl tiny" fill="#15803d">yes</text>
  <rect x="20" y="520" width="280" height="66" rx="6" class="boxR"/>
  <text x="160" y="544" text-anchor="middle" class="lbl body" font-weight="600">addWorker(task, core=false)</text>
  <text x="160" y="562" text-anchor="middle" class="lbl sub">extra non-core settlement-ingest</text>
  <text x="160" y="576" text-anchor="middle" class="lbl sub">thread, task runs directly</text>

  <!-- NO -->
  <path class="no" d="M 680 453 H 910 V 520"/>
  <text x="850" y="505" class="lbl tiny" fill="#b91c1c">no</text>
  <path class="flow" d="M 910 520 V 560 H 520 V 580"/>

  <!-- Decision 4 -->
  <rect x="360" y="580" width="320" height="56" rx="6" class="boxH"/>
  <text x="520" y="604" text-anchor="middle" class="lbl body" font-weight="600">(4) pool saturated</text>
  <text x="520" y="622" text-anchor="middle" class="lbl sub">core full, queue full, max reached</text>

  <path class="no" d="M 520 636 V 660"/>
  <rect x="360" y="660" width="320" height="76" rx="6" class="boxD"/>
  <text x="520" y="684" text-anchor="middle" class="lbl body" font-weight="600">handler.rejectedExecution(task, exec)</text>
  <text x="520" y="702" text-anchor="middle" class="lbl sub">default AbortPolicy →</text>
  <text x="520" y="718" text-anchor="middle" class="lbl sub">RejectedExecutionException on the 3,400/sec burst</text>

  <!-- annotation panel -->
  <rect x="740" y="580" width="280" height="156" rx="6" class="panel"/>
  <text x="756" y="602" class="lbl body" font-weight="700">Why order matters</text>
  <text x="756" y="622" class="lbl tiny">Steps run in exactly this order for every</text>
  <text x="756" y="638" class="lbl tiny">call to execute(). A burst of stake</text>
  <text x="756" y="654" class="lbl tiny">settlements never skips the queue to</text>
  <text x="756" y="670" class="lbl tiny">reach maximumPoolSize early — extra</text>
  <text x="756" y="686" class="lbl tiny">threads (step 3) are the last resort,</text>
  <text x="756" y="702" class="lbl tiny">not the first response to load.</text>
  <text x="756" y="722" class="lbl tiny" font-weight="600">Sizing the queue too large hides step 3</text>
  <text x="756" y="736" class="lbl tiny" font-weight="600">entirely — see D-079.</text>

  <!-- legend -->
  <line x1="20" y1="756" x2="1020" y2="756" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="770" width="22" height="16" rx="3" class="boxH"/>
  <text x="52" y="783" class="lbl tiny">numbered decision</text>
  <rect x="220" y="770" width="22" height="16" rx="3" class="boxR"/>
  <text x="252" y="783" class="lbl tiny">worker added, task accepted</text>
  <rect x="460" y="770" width="22" height="16" rx="3" class="boxD"/>
  <text x="492" y="783" class="lbl tiny">rejected — pool saturated</text>
  <rect x="680" y="770" width="22" height="16" rx="3" class="boxW"/>
  <text x="712" y="783" class="lbl tiny">entry point / re-check step</text>

  <path class="flow" d="M 20 806 H 60"/>
  <text x="68" y="811" class="lbl tiny">unconditional step</text>
  <path class="yes" d="M 240 806 H 280"/>
  <text x="288" y="811" class="lbl tiny" fill="#15803d">yes branch</text>
  <path class="no" d="M 400 806 H 440"/>
  <text x="448" y="811" class="lbl tiny" fill="#b91c1c">no branch</text>
</svg>
