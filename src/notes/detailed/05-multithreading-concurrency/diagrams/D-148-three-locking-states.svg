<svg viewBox="0 0 1040 650" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="State machine for the FundsLedger monitor's lock word. Unlocked transitions to
     lightweight, stack-locked when settlement-ingest-3 CASes a stack-lock into the mark word for
     an uncontended synchronized block. Lightweight transitions to inflated when
     payment-run-worker contends, allocating a full ObjectMonitor. Inflated returns to unlocked
     when the monitor deflates at a safepoint with no waiters. Lightweight also has a self-loop
     for recursive re-entry by the same thread, storing a zero displaced header. A fourth state,
     biased locking, is drawn greyed out and struck through, disconnected from the live flow, and
     labelled JEP 374, disabled in Java 15, later removed — do not describe this in an interview
     as current.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .floor { font-size: 10.5px; fill: #4b5563; }

    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3;
             marker-end: url(#triGrey); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triGrey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="650" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE THREE LOCKING STATES, AND THE FOURTH THAT IS GONE</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl h2">FundsLedger MONITOR — LOCK WORD STATE MACHINE</text>

  <!-- self loop on lightweight -->
  <path class="weak" d="M 460 140 V 108 H 580 V 140"/>
  <text x="520" y="98" text-anchor="middle" class="lbl floor">recursive synchronized(fundsLedger), same thread</text>
  <text x="520" y="86" text-anchor="middle" class="lbl floor">-&gt; zero displaced header (see D-149)</text>

  <!-- main states -->
  <rect x="60" y="140" width="220" height="100" rx="6" class="boxR"/>
  <text x="170" y="170" text-anchor="middle" class="lbl node">UNLOCKED</text>
  <text x="170" y="192" text-anchor="middle" class="lbl body">neutral mark word</text>
  <text x="170" y="210" text-anchor="middle" class="lbl sub">no thread holds Reservation's</text>
  <text x="170" y="224" text-anchor="middle" class="lbl sub">FundsLedger lock</text>

  <rect x="400" y="140" width="240" height="100" rx="6" class="boxP"/>
  <text x="520" y="170" text-anchor="middle" class="lbl node">LIGHTWEIGHT (STACK-LOCKED)</text>
  <text x="520" y="192" text-anchor="middle" class="lbl body">BasicLock in owner's frame</text>
  <text x="520" y="210" text-anchor="middle" class="lbl sub">displaced header saved there</text>
  <text x="520" y="224" text-anchor="middle" class="lbl sub">uncontended fast path</text>

  <rect x="760" y="140" width="220" height="100" rx="6" class="boxD"/>
  <text x="870" y="170" text-anchor="middle" class="lbl node">INFLATED</text>
  <text x="870" y="192" text-anchor="middle" class="lbl body">full ObjectMonitor</text>
  <text x="870" y="210" text-anchor="middle" class="lbl sub">supports contention,</text>
  <text x="870" y="224" text-anchor="middle" class="lbl sub">wait()/notify() queues</text>

  <!-- forward edges -->
  <path class="flow" d="M 280 190 H 400"/>
  <text x="340" y="170" text-anchor="middle" class="lbl floor">settlement-ingest-3</text>
  <text x="340" y="158" text-anchor="middle" class="lbl floor">CASes stack-lock in</text>

  <path class="flow" d="M 640 190 H 760"/>
  <text x="700" y="170" text-anchor="middle" class="lbl floor">payment-run-worker</text>
  <text x="700" y="158" text-anchor="middle" class="lbl floor">contends -&gt; inflate</text>

  <!-- return edge inflated -> unlocked, routed below -->
  <path class="flow" d="M 870 240 V 282 H 170 V 240"/>
  <text x="520" y="300" text-anchor="middle" class="lbl floor">monitor deflated at a safepoint, no waiters left</text>

  <!-- biased locking: disconnected, greyed, struck through -->
  <text x="400" y="380" class="lbl h2">REMOVED — NOT PART OF THE LIVE FLOW</text>
  <rect x="400" y="394" width="240" height="90" rx="6" class="boxL"/>
  <text x="520" y="422" text-anchor="middle" class="lbl node">BIASED</text>
  <text x="520" y="442" text-anchor="middle" class="lbl sub">object "biased" toward one thread</text>
  <text x="520" y="458" text-anchor="middle" class="lbl sub">no CAS needed on re-entry</text>
  <line x1="412" y1="418" x2="628" y2="418" stroke="#78716c" stroke-width="2"/>
  <line x1="412" y1="454" x2="628" y2="454" stroke="#78716c" stroke-width="2"/>

  <rect x="670" y="394" width="330" height="90" rx="6" class="panel"/>
  <text x="686" y="416" class="lbl node">JEP 374</text>
  <text x="686" y="434" class="lbl sub">disabled by default in Java 15,</text>
  <text x="686" y="450" class="lbl sub">later removed entirely</text>
  <text x="686" y="468" class="lbl sub">do not describe this as current</text>

  <!-- legend -->
  <line x1="20" y1="520" x2="1020" y2="520" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="534" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="547" class="lbl tiny">unlocked (fast / resting state)</text>
  <rect x="270" y="534" width="22" height="16" rx="3" class="boxP"/>
  <text x="300" y="547" class="lbl tiny">lightweight, stack-locked (subject state)</text>
  <rect x="580" y="534" width="22" height="16" rx="3" class="boxD"/>
  <text x="610" y="547" class="lbl tiny">inflated (contention)</text>
  <rect x="760" y="534" width="22" height="16" rx="3" class="boxL"/>
  <text x="790" y="547" class="lbl tiny">removed / legacy, struck through</text>

  <path class="flow" d="M 20 570 H 60"/>
  <text x="70" y="575" class="lbl tiny">A -&gt; B : live transition, trigger labelled</text>
  <path class="weak" d="M 500 570 H 540"/>
  <text x="550" y="575" class="lbl tiny">self-loop : re-entry by the same thread</text>
</svg>
