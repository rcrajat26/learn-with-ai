<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="LongAdder spreads the stake-settlement counter, bursting at 3,400 settlements per
     second, across a base field plus a Cell array of four Contended-padded cells, each on its own
     128-byte cache line. Four threads, settlement-ingest-1 through settlement-ingest-4, each hash
     via ThreadLocalRandom.getProbe() to a different cell and add there without contending on the
     others. sum() walks base plus every cell with no lock, a racy read that can miss or double
     count a concurrent add. The cells array grows only up to NCPU, the number of available
     processors.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .weakE { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3;
             stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">LongAdder SPREADS THE STAKE-SETTLEMENT COUNTER ACROSS CELLS</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="60" class="lbl h2">FOUR settlement-ingest THREADS, 3,400 SETTLEMENTS/SEC BURST</text>

  <!-- thread boxes -->
  <rect x="60"  y="72" width="190" height="56" rx="6" class="boxP"/>
  <text x="155" y="94"  text-anchor="middle" class="lbl body">settlement-ingest-1</text>
  <text x="155" y="112" text-anchor="middle" class="lbl sub">getProbe() = 0x21 → cell 0</text>

  <rect x="290" y="72" width="190" height="56" rx="6" class="boxP"/>
  <text x="385" y="94"  text-anchor="middle" class="lbl body">settlement-ingest-2</text>
  <text x="385" y="112" text-anchor="middle" class="lbl sub">getProbe() = 0x47 → cell 1</text>

  <rect x="520" y="72" width="190" height="56" rx="6" class="boxP"/>
  <text x="615" y="94"  text-anchor="middle" class="lbl body">settlement-ingest-3</text>
  <text x="615" y="112" text-anchor="middle" class="lbl sub">getProbe() = 0x8c → cell 2</text>

  <rect x="750" y="72" width="190" height="56" rx="6" class="boxP"/>
  <text x="845" y="94"  text-anchor="middle" class="lbl body">settlement-ingest-4</text>
  <text x="845" y="112" text-anchor="middle" class="lbl sub">getProbe() = 0xd3 → cell 3</text>

  <!-- hash index note -->
  <rect x="60" y="140" width="880" height="34" rx="4" class="boxA"/>
  <text x="500" y="162" text-anchor="middle" class="lbl tiny">index = (cells.length - 1) &amp; getProbe() — each thread lands on one cell, so adds do not contend</text>

  <path class="flow" d="M 155 128 V 200"/>
  <path class="flow" d="M 385 128 V 200"/>
  <path class="flow" d="M 615 128 V 200"/>
  <path class="flow" d="M 845 128 V 200"/>

  <!-- cache-line padded cells -->
  <text x="20" y="212" class="lbl h2">Cell[] CELLS — EACH ON ITS OWN 128-BYTE CACHE LINE, @Contended</text>

  <!-- cell 0 -->
  <rect x="60" y="224" width="190" height="150" rx="4" class="boxW"/>
  <text x="155" y="240" text-anchor="middle" class="lbl sub">128 B line, @Contended pad</text>
  <rect x="80" y="258" width="150" height="100" rx="4" class="boxH"/>
  <text x="155" y="288" text-anchor="middle" class="lbl node">Cell[0]</text>
  <text x="155" y="308" text-anchor="middle" class="lbl body">value = 850</text>
  <text x="155" y="326" text-anchor="middle" class="lbl sub">cas add(long x)</text>
  <text x="155" y="343" text-anchor="middle" class="lbl sub">no false sharing</text>

  <!-- cell 1 -->
  <rect x="290" y="224" width="190" height="150" rx="4" class="boxW"/>
  <text x="385" y="240" text-anchor="middle" class="lbl sub">128 B line, @Contended pad</text>
  <rect x="310" y="258" width="150" height="100" rx="4" class="boxH"/>
  <text x="385" y="288" text-anchor="middle" class="lbl node">Cell[1]</text>
  <text x="385" y="308" text-anchor="middle" class="lbl body">value = 900</text>
  <text x="385" y="326" text-anchor="middle" class="lbl sub">cas add(long x)</text>
  <text x="385" y="343" text-anchor="middle" class="lbl sub">no false sharing</text>

  <!-- cell 2 -->
  <rect x="520" y="224" width="190" height="150" rx="4" class="boxW"/>
  <text x="615" y="240" text-anchor="middle" class="lbl sub">128 B line, @Contended pad</text>
  <rect x="540" y="258" width="150" height="100" rx="4" class="boxH"/>
  <text x="615" y="288" text-anchor="middle" class="lbl node">Cell[2]</text>
  <text x="615" y="308" text-anchor="middle" class="lbl body">value = 820</text>
  <text x="615" y="326" text-anchor="middle" class="lbl sub">cas add(long x)</text>
  <text x="615" y="343" text-anchor="middle" class="lbl sub">no false sharing</text>

  <!-- cell 3 -->
  <rect x="750" y="224" width="190" height="150" rx="4" class="boxW"/>
  <text x="845" y="240" text-anchor="middle" class="lbl sub">128 B line, @Contended pad</text>
  <rect x="770" y="258" width="150" height="100" rx="4" class="boxH"/>
  <text x="845" y="288" text-anchor="middle" class="lbl node">Cell[3]</text>
  <text x="845" y="308" text-anchor="middle" class="lbl body">value = 830</text>
  <text x="845" y="326" text-anchor="middle" class="lbl sub">cas add(long x)</text>
  <text x="845" y="343" text-anchor="middle" class="lbl sub">no false sharing</text>

  <!-- base field -->
  <rect x="60" y="404" width="190" height="60" rx="6" class="boxR"/>
  <text x="155" y="428" text-anchor="middle" class="lbl node">base = 0</text>
  <text x="155" y="446" text-anchor="middle" class="lbl sub">fallback slot, used pre-striping</text>

  <!-- sum() walk -->
  <text x="700" y="575" class="lbl h2">sum() — NO LOCK, RACY READ</text>

  <!-- cell0's corridor jogs left of the base box so it never crosses it -->
  <path class="weakE" d="M 155 374 V 390 H 40 V 550 H 500 V 590"/>
  <path class="weakE" d="M 155 464 V 550"/>
  <path class="weakE" d="M 385 374 V 550"/>
  <path class="weakE" d="M 615 374 V 550"/>
  <path class="weakE" d="M 845 374 V 550 H 500"/>

  <rect x="380" y="590" width="280" height="100" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="520" y="616" text-anchor="middle" class="lbl node">sum()</text>
  <text x="520" y="636" text-anchor="middle" class="lbl body">base + Σ cells</text>
  <text x="520" y="654" text-anchor="middle" class="lbl body">0+850+900+820+830 = 3,400</text>
  <text x="520" y="672" text-anchor="middle" class="lbl sub">a concurrent add() mid-walk can be missed or seen twice</text>

  <!-- growth cap -->
  <text x="20" y="726" class="lbl h2">GROWTH IS CAPPED — cells.length NEVER EXCEEDS NCPU</text>
  <rect x="60" y="736" width="880" height="40" rx="4" class="boxA"/>
  <text x="500" y="761" text-anchor="middle" class="lbl tiny">on a collision, cells doubles via CAS on the array slot — but never grows past Runtime.getRuntime().availableProcessors() (NCPU)</text>

  <!-- legend -->
  <line x1="20" y1="800" x2="1020" y2="800" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="812" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="825" class="lbl tiny">thread hashing to a cell</text>

  <rect x="220" y="812" width="22" height="16" rx="3" class="boxH"/>
  <text x="250" y="825" class="lbl tiny">Cell — striped counter slot</text>

  <rect x="470" y="812" width="22" height="16" rx="3" class="boxW"/>
  <text x="500" y="825" class="lbl tiny">128-byte @Contended padding</text>

  <rect x="730" y="812" width="22" height="16" rx="3" class="boxR"/>
  <text x="760" y="825" class="lbl tiny">base field</text>

  <rect x="850" y="812" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="880" y="825" class="lbl tiny">racy sum()</text>

  <path class="flow" d="M 20 846 H 60"/>
  <text x="68" y="851" class="lbl tiny">A → B : hashing / assignment</text>

  <path class="weakE" d="M 330 846 H 370"/>
  <text x="378" y="851" class="lbl tiny">A → B : unsynchronized read during sum()</text>
</svg>
