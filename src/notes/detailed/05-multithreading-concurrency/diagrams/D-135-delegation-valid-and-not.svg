<svg viewBox="0 0 1120 960" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Delegation validity: left, RestrictionLimits forwards get and put to a ConcurrentHashMap and owns no invariant of its own, so no extra lock is needed. Right, LimitSet holds two individually thread-safe fields, dailyDeposit and monthlyLoss, under the cross-field invariant dailyDeposit less than or equal to monthlyLoss; operator-review-1 and operator-review-2 each perform a thread-safe check-then-set that individually succeeds, but interleaved they leave dailyDeposit at 500 and monthlyLoss at 100, breaking the invariant. Beneath, the fix wraps both setters in one synchronized lock on LimitSet so the check and both writes happen atomically together.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .tinys { font-size: 11px; fill: #4b5563; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triSlate); }
    .bridge { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triAmber); }
    .weakln { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triGray); }
  </style>
  <defs>
    <marker id="triSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="triGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="960" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WHEN DELEGATION IS VALID — AND WHEN IT IS NOT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- band headers -->
  <text x="20" y="64" class="lbl h2">VALID — delegate owns the only invariant</text>
  <line x1="20" y1="70" x2="540" y2="70" stroke="#15803d" stroke-width="2.5"/>
  <text x="580" y="64" class="lbl h2">INVALID — two thread-safe fields, one cross-field invariant</text>
  <line x1="580" y1="70" x2="1100" y2="70" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- LEFT: valid delegation -->
  <rect x="80" y="92" width="220" height="64" rx="6" class="boxP"/>
  <text x="190" y="116" text-anchor="middle" class="lbl node">RestrictionLimits</text>
  <text x="190" y="136" text-anchor="middle" class="lbl sub">delegate: ConcurrentHashMap&lt;String,Long&gt;</text>
  <text x="190" y="150" text-anchor="middle" class="lbl sub">get/put simply forward</text>

  <path class="bridge" d="M 190 156 V 210"/>
  <text x="252" y="187" text-anchor="middle" class="lbl tinys">forwards</text>

  <rect x="60" y="210" width="280" height="78" rx="6" class="boxR"/>
  <text x="200" y="234" text-anchor="middle" class="lbl node">ConcurrentHashMap&lt;String,Long&gt;</text>
  <text x="200" y="254" text-anchor="middle" class="lbl dense">CLIENT_BONUS_AVAILABLE -&gt; 100</text>
  <text x="200" y="272" text-anchor="middle" class="lbl sub">owns its own bucket-level locking —</text>
  <text x="200" y="284" text-anchor="middle" class="lbl sub">the only invariant here is the map's</text>

  <rect x="60" y="312" width="460" height="104" rx="6" class="boxA"/>
  <text x="76" y="334" class="lbl tiny" font-weight="700">WHY THIS IS VALID</text>
  <text x="76" y="354" class="lbl tiny">RestrictionLimits holds no fields of its own.</text>
  <text x="76" y="372" class="lbl tiny">It adds zero invariants beyond the map's.</text>
  <text x="76" y="390" class="lbl tiny">Any thread safety the map provides is inherited</text>
  <text x="76" y="406" class="lbl tiny">as-is — no wrapper lock is needed.</text>

  <rect x="60" y="440" width="460" height="94" rx="6" class="boxA"/>
  <text x="76" y="462" class="lbl tiny" font-weight="700">GENERAL RULE</text>
  <text x="76" y="482" class="lbl tiny">Delegation is valid iff the wrapper adds no field</text>
  <text x="76" y="500" class="lbl tiny">and no invariant of its own. An invariant spanning</text>
  <text x="76" y="518" class="lbl tiny">more than one delegate call still needs its own lock.</text>

  <!-- RIGHT: invalid, cross-field invariant -->
  <rect x="620" y="92" width="300" height="66" rx="6" class="boxP"/>
  <text x="770" y="114" text-anchor="middle" class="lbl node">LimitSet</text>
  <text x="770" y="134" text-anchor="middle" class="lbl dense">invariant: dailyDeposit &lt;= monthlyLoss</text>
  <text x="770" y="150" text-anchor="middle" class="lbl sub">(cross-field — no single object owns it)</text>

  <path class="flow" d="M 770 158 V 172"/>
  <path class="flow" d="M 690 172 H 930"/>
  <path class="flow" d="M 690 172 V 192"/>
  <path class="flow" d="M 930 172 V 192"/>

  <rect x="620" y="192" width="140" height="58" rx="6" class="boxW"/>
  <text x="690" y="214" text-anchor="middle" class="lbl body">dailyDeposit</text>
  <text x="690" y="230" text-anchor="middle" class="lbl sub">AtomicLong</text>
  <text x="690" y="244" text-anchor="middle" class="lbl sub">individually thread-safe</text>

  <rect x="860" y="192" width="140" height="58" rx="6" class="boxW"/>
  <text x="930" y="214" text-anchor="middle" class="lbl body">monthlyLoss</text>
  <text x="930" y="230" text-anchor="middle" class="lbl sub">AtomicLong</text>
  <text x="930" y="244" text-anchor="middle" class="lbl sub">individually thread-safe</text>

  <!-- lane headers -->
  <text x="690" y="278" text-anchor="middle" class="lbl tiny" font-weight="700">operator-review-1</text>
  <text x="930" y="278" text-anchor="middle" class="lbl tiny" font-weight="700">operator-review-2</text>
  <line x1="620" y1="286" x2="960" y2="286" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- step 1, lane 1 -->
  <rect x="580" y="300" width="220" height="50" rx="5" class="boxW"/>
  <text x="690" y="320" text-anchor="middle" class="lbl tiny">1. read monthlyLoss = 500</text>
  <text x="690" y="336" text-anchor="middle" class="lbl sub">(dailyDeposit currently = 100)</text>

  <!-- step 2, lane 2 -->
  <rect x="820" y="300" width="220" height="50" rx="5" class="boxW"/>
  <text x="930" y="320" text-anchor="middle" class="lbl tiny">2. read dailyDeposit = 100</text>
  <text x="930" y="336" text-anchor="middle" class="lbl sub">(monthlyLoss currently = 500)</text>

  <path class="weakln" d="M 690 350 V 400"/>
  <path class="weakln" d="M 930 350 V 400"/>

  <!-- step 3, lane 1 -->
  <rect x="580" y="400" width="220" height="58" rx="5" class="boxW"/>
  <text x="690" y="420" text-anchor="middle" class="lbl tiny">3. dailyDeposit.set(500)</text>
  <text x="690" y="436" text-anchor="middle" class="lbl sub">check 500 &lt;= 500 passes —</text>
  <text x="690" y="450" text-anchor="middle" class="lbl sub">this write alone is thread-safe</text>

  <!-- step 4, lane 2 -->
  <rect x="820" y="400" width="220" height="58" rx="5" class="boxW"/>
  <text x="930" y="420" text-anchor="middle" class="lbl tiny">4. monthlyLoss.set(100)</text>
  <text x="930" y="436" text-anchor="middle" class="lbl sub">check 100 &lt;= 100 passes on the</text>
  <text x="930" y="450" text-anchor="middle" class="lbl sub">stale read dailyDeposit = 100</text>

  <path class="weakln" d="M 690 458 V 480 H 810"/>
  <path class="weakln" d="M 930 458 V 480 H 810"/>
  <path class="flow" d="M 810 480 V 500"/>

  <rect x="640" y="500" width="340" height="66" rx="6" class="boxD"/>
  <text x="810" y="522" text-anchor="middle" class="lbl body" font-weight="700">dailyDeposit = 500, monthlyLoss = 100</text>
  <text x="810" y="540" text-anchor="middle" class="lbl sub">invariant dailyDeposit &lt;= monthlyLoss is broken,</text>
  <text x="810" y="554" text-anchor="middle" class="lbl sub">though every individual field write was thread-safe</text>

  <!-- fix band -->
  <line x1="20" y1="600" x2="1100" y2="600" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="622" class="lbl h2">FIX — one lock covers both fields together</text>

  <rect x="340" y="642" width="440" height="120" rx="6" class="boxR"/>
  <text x="560" y="666" text-anchor="middle" class="lbl node">LimitSet (fixed)</text>
  <text x="360" y="686" class="lbl dense">synchronized setDailyDeposit(long v) {</text>
  <text x="380" y="702" class="lbl dense">if (v &gt; monthlyLoss) throw; dailyDeposit = v; }</text>
  <text x="360" y="722" class="lbl dense">synchronized setMonthlyLoss(long v) {</text>
  <text x="380" y="738" class="lbl dense">if (dailyDeposit &gt; v) throw; monthlyLoss = v; }</text>
  <text x="560" y="756" text-anchor="middle" class="lbl sub">one intrinsic lock on LimitSet, not on the fields</text>

  <text x="560" y="782" text-anchor="middle" class="lbl tiny">Both checks and both writes now happen inside one lock —</text>
  <text x="560" y="798" text-anchor="middle" class="lbl tiny">no thread can observe or create an inconsistent pair.</text>

  <!-- legend -->
  <line x1="20" y1="816" x2="1100" y2="816" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="828" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="841" class="lbl tiny">primary type under discussion</text>

  <rect x="380" y="828" width="22" height="16" rx="3" class="boxR"/>
  <text x="410" y="841" class="lbl tiny">concrete / resolved — safe implementation</text>

  <rect x="780" y="828" width="22" height="16" rx="3" class="boxD"/>
  <text x="810" y="841" class="lbl tiny">broken invariant</text>

  <rect x="20" y="856" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="869" class="lbl tiny">thread-safe field, or a step in the interleaving</text>

  <path class="bridge" d="M 380 864 H 420"/>
  <text x="428" y="869" class="lbl tiny">A → B : B delegated to, forwarding call (not inheritance)</text>

  <path class="flow" d="M 20 892 H 60"/>
  <text x="68" y="897" class="lbl tiny">A → B : B is a field of / fan-out from A</text>

  <path class="weakln" d="M 380 892 H 420"/>
  <text x="428" y="897" class="lbl tiny">sequential step, same lane, in time order</text>
</svg>
