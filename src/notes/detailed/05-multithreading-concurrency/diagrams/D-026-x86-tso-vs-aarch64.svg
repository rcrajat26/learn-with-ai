<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Same unsynchronized publication code run on x86-TSO versus AArch64. PaymentService writes Reservation fields then publishes the reference: sharedReservation = r. On x86-TSO only StoreLoad reordering is permitted, so the store of the reference cannot pass the prior field stores, and settlement-ingest-3 always sees a fully constructed Reservation — the bug is invisible, captioned It works on my machine. On AArch64 both StoreStore and LoadLoad reordering are permitted, so settlement-ingest-3 can observe the published reference before the field stores complete, reading default values amount 0.0 and status null.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .monoS { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .fail  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-linejoin: round; marker-end: url(#triR); stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">X86-TSO HIDES THE BUG THAT AARCH64 EXPOSES — UNSYNCHRONIZED PUBLICATION</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- shared code panel -->
  <rect x="20" y="56" width="1080" height="96" rx="6" class="boxA"/>
  <text x="36" y="76" class="lbl node">PaymentService — the same publication code runs on both architectures</text>
  <text x="36" y="96" class="lbl mono">Reservation r = new Reservation();</text>
  <text x="36" y="112" class="lbl mono">r.amount = 3.33; r.status = "DEP-301 CAPTURED";     // (1) (2) field stores</text>
  <text x="36" y="128" class="lbl mono">sharedReservation = r;                              // (3) publish the reference, no volatile</text>
  <text x="36" y="144" class="lbl sub">No lock, no volatile — settlement-ingest-3 reads sharedReservation with no happens-before edge to (1)/(2).</text>

  <!-- LEFT PANEL: x86-TSO -->
  <rect x="20" y="172" width="530" height="470" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="285" y="196" text-anchor="middle" class="lbl h2">X86-TSO — ONLY StoreLoad REORDERING PERMITTED</text>
  <line x1="40" y1="206" x2="530" y2="206" stroke="#d1d5db" stroke-width="1"/>

  <rect x="60" y="222" width="450" height="60" rx="6" class="boxP"/>
  <text x="285" y="246" text-anchor="middle" class="lbl node">memory model guarantee</text>
  <text x="285" y="266" text-anchor="middle" class="lbl body">StoreStore and LoadLoad are NOT reordered — only StoreLoad is</text>

  <path class="flow" d="M 285 282 V 300"/>

  <rect x="60" y="300" width="450" height="86" rx="6" class="boxR"/>
  <text x="285" y="322" text-anchor="middle" class="lbl node">effect on this code</text>
  <text x="285" y="342" text-anchor="middle" class="lbl body">(1) amount, (2) status must retire to visible</text>
  <text x="285" y="358" text-anchor="middle" class="lbl body">store order before (3) sharedReservation = r can</text>
  <text x="285" y="374" text-anchor="middle" class="lbl body">be observed by another core</text>

  <path class="flow" d="M 285 386 V 404"/>

  <rect x="60" y="404" width="450" height="90" rx="6" class="boxR"/>
  <text x="285" y="426" text-anchor="middle" class="lbl node">settlement-ingest-3 reads sharedReservation</text>
  <text x="285" y="448" text-anchor="middle" class="lbl body">amount == 3.33</text>
  <text x="285" y="466" text-anchor="middle" class="lbl body">status == "DEP-301 CAPTURED"</text>
  <text x="285" y="484" text-anchor="middle" class="lbl sub">a fully constructed Reservation, every time observed</text>

  <path class="flow" d="M 285 494 V 512"/>

  <rect x="60" y="512" width="450" height="66" rx="6" class="boxH"/>
  <text x="285" y="538" text-anchor="middle" class="lbl node" font-style="italic">"It works on my machine"</text>
  <text x="285" y="558" text-anchor="middle" class="lbl sub">the race exists in the source; x86-TSO just never lets it fire</text>

  <rect x="40" y="586" width="470" height="52" rx="6" class="boxD"/>
  <text x="275" y="608" text-anchor="middle" class="lbl body">Bug is latent, not fixed —</text>
  <text x="275" y="626" text-anchor="middle" class="lbl body">deploy the same jar to AArch64 and it reproduces</text>

  <!-- RIGHT PANEL: AArch64 -->
  <rect x="570" y="172" width="530" height="470" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="835" y="196" text-anchor="middle" class="lbl h2">AARCH64 — StoreStore AND LoadLoad ALSO PERMITTED</text>
  <line x1="590" y1="206" x2="1080" y2="206" stroke="#d1d5db" stroke-width="1"/>

  <rect x="610" y="222" width="450" height="60" rx="6" class="boxD"/>
  <text x="835" y="246" text-anchor="middle" class="lbl node">weak memory-model guarantee</text>
  <text x="835" y="266" text-anchor="middle" class="lbl body">StoreStore, LoadLoad, and StoreLoad may all be reordered</text>

  <path class="flow" d="M 835 282 V 300"/>

  <rect x="610" y="300" width="450" height="86" rx="6" class="boxD"/>
  <text x="835" y="322" text-anchor="middle" class="lbl node">effect on this code</text>
  <text x="835" y="342" text-anchor="middle" class="lbl body">(3) sharedReservation = r can retire to visible</text>
  <text x="835" y="358" text-anchor="middle" class="lbl body">store order before (1) amount and (2) status —</text>
  <text x="835" y="374" text-anchor="middle" class="lbl body">the CPU is free to reorder the stores</text>

  <path class="fail" d="M 835 386 V 404"/>
  <text x="905" y="398" class="lbl sub">reorder</text>

  <rect x="610" y="404" width="450" height="90" rx="6" class="boxD"/>
  <text x="835" y="426" text-anchor="middle" class="lbl node">settlement-ingest-3 reads sharedReservation</text>
  <text x="835" y="448" text-anchor="middle" class="lbl body">reference is non-null, but amount == 0.0</text>
  <text x="835" y="466" text-anchor="middle" class="lbl body">status == null — reservation object seen half-built</text>
  <text x="835" y="484" text-anchor="middle" class="lbl sub">observed the field default values, not the assigned ones</text>

  <path class="flow" d="M 835 494 V 512"/>

  <rect x="610" y="512" width="450" height="66" rx="6" class="boxD"/>
  <text x="835" y="538" text-anchor="middle" class="lbl node">consequence</text>
  <text x="835" y="558" text-anchor="middle" class="lbl sub">NullPointerException or a 0.0 stake booked — the bug fires</text>

  <rect x="590" y="586" width="470" height="52" rx="6" class="boxH"/>
  <text x="825" y="608" text-anchor="middle" class="lbl body">Same jar, same bytecode —</text>
  <text x="825" y="626" text-anchor="middle" class="lbl body">architecture alone changes the outcome</text>

  <!-- annotation panel bottom -->
  <rect x="20" y="646" width="1080" height="56" rx="6" class="boxA"/>
  <text x="36" y="666" class="lbl node">fix (either architecture)</text>
  <text x="36" y="686" class="lbl body">declare sharedReservation volatile, or publish through a synchronized block — establishes happens-before, not architecture-dependent</text>

  <!-- legend -->
  <line x1="20" y1="716" x2="1100" y2="716" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="728" width="22" height="16" rx="3" class="boxR"/>
  <text x="50" y="741" class="lbl tiny">safe under this model's ordering</text>
  <rect x="290" y="728" width="22" height="16" rx="3" class="boxD"/>
  <text x="320" y="741" class="lbl tiny">reordering permitted / stale read observed</text>
  <rect x="640" y="728" width="22" height="16" rx="3" class="boxH"/>
  <text x="670" y="741" class="lbl tiny">observed outcome / caption</text>
  <rect x="900" y="728" width="22" height="16" rx="3" class="boxA"/>
  <text x="930" y="741" class="lbl tiny">annotation / shared code panel</text>

  <path class="flow" d="M 20 762 H 60"/>
  <text x="70" y="767" class="lbl tiny">program order, no reorder</text>
  <path class="fail" d="M 340 762 H 380"/>
  <text x="390" y="767" class="lbl tiny">store reordered ahead of program order</text>
</svg>
