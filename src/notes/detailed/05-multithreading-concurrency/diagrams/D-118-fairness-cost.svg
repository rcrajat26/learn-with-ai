<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Fairness costs an order of magnitude, for settlement-ingest workers contending on
     a ReentrantLock. Panel A plots acquisitions per second, log scale, against worker thread count
     from 1 to 32: the unfair lock stays high, from about 5,000,000 down to about 1,200,000 per
     second, while the fair lock collapses from about 4,800,000 down to about 15,000 per second,
     opening a gap of roughly 80x at 32 threads, inside the 10x to 100x band. Panel B plots tail
     latency in milliseconds, log scale, against percentile from p50 to p99.99: the unfair lock has
     a lower median but its tail explodes past p99 toward about 4,000 ms from thread starvation,
     while the fair lock has a higher median but a bounded tail near 60 ms, so fairness wins from
     about p99 onward. All figures on both panels are order-of-magnitude estimates, not measured
     constants.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #1f2937; }
    .body  { font-size: 12.5px; }
    .node  { font-size: 13px; font-weight: 600; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .pt    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.8; }

    .axis  { stroke: #475569; stroke-width: 1.6; }
    .tick  { stroke: #475569; stroke-width: 1.3; }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .grid  { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 2 3; }
    .unfair{ fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-linejoin: round; }
    .fair  { fill: none; stroke: #b91c1c; stroke-width: 2.2; stroke-linejoin: round; }
    .guide { fill: none; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .lead  { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FAIRNESS COSTS AN ORDER OF MAGNITUDE — settlement-ingest ReentrantLock</text>
  <line x1="20" y1="42" x2="980" y2="42" class="rule"/>
  <text x="20" y="60" class="lbl sub">All acquisition and latency figures on both panels are order-of-magnitude estimates, not measured constants.</text>

  <!-- ================= PANEL A ================= -->
  <text x="20" y="88" class="lbl h2">PANEL A — ACQUISITIONS/SEC AGAINST WORKER THREAD COUNT (LOG SCALE)</text>

  <line x1="100" y1="380" x2="100" y2="110" class="axis"/>
  <line x1="100" y1="380" x2="820" y2="380" class="axis"/>

  <!-- y ticks: 10^4 .. 10^7, y=380-(log10(v)-4)*73.3 -->
  <line x1="820" y1="380" x2="820" y2="380" class="grid"/>
  <line x1="100" y1="380" x2="820" y2="380" class="grid"/>
  <line x1="100" y1="306.7" x2="820" y2="306.7" class="grid"/>
  <line x1="100" y1="233.3" x2="820" y2="233.3" class="grid"/>
  <line x1="100" y1="160" x2="820" y2="160" class="grid"/>

  <line x1="96" y1="380" x2="100" y2="380" class="tick"/>
  <text x="88" y="384" text-anchor="end" class="lbl sub">10k</text>
  <line x1="96" y1="306.7" x2="100" y2="306.7" class="tick"/>
  <text x="88" y="310.7" text-anchor="end" class="lbl sub">100k</text>
  <line x1="96" y1="233.3" x2="100" y2="233.3" class="tick"/>
  <text x="88" y="237.3" text-anchor="end" class="lbl sub">1M</text>
  <line x1="96" y1="160" x2="100" y2="160" class="tick"/>
  <text x="88" y="164" text-anchor="end" class="lbl sub">10M</text>
  <text x="40" y="250" text-anchor="middle" class="lbl sub" transform="rotate(-90 40 250)">acquisitions/sec (log scale)</text>

  <line x1="100" y1="380" x2="100" y2="385" class="tick"/>
  <text x="100" y="400" text-anchor="middle" class="lbl sub">1</text>
  <line x1="230" y1="380" x2="230" y2="385" class="tick"/>
  <text x="230" y="400" text-anchor="middle" class="lbl sub">2</text>
  <line x1="360" y1="380" x2="360" y2="385" class="tick"/>
  <text x="360" y="400" text-anchor="middle" class="lbl sub">4</text>
  <line x1="490" y1="380" x2="490" y2="385" class="tick"/>
  <text x="490" y="400" text-anchor="middle" class="lbl sub">8</text>
  <line x1="620" y1="380" x2="620" y2="385" class="tick"/>
  <text x="620" y="400" text-anchor="middle" class="lbl sub">16</text>
  <line x1="750" y1="380" x2="750" y2="385" class="tick"/>
  <text x="750" y="400" text-anchor="middle" class="lbl sub">32</text>
  <text x="460" y="418" text-anchor="middle" class="lbl sub">settlement-ingest worker threads (log2 scale)</text>

  <!-- unfair lock: 5.0M,4.2M,3.5M,2.6M,1.8M,1.2M -->
  <polyline class="unfair" points="100,102.1 230,107.5 360,113.1 490,122.3 620,133.6 750,146.1"/>
  <!-- fair lock: 4.8M,1.2M,350k,120k,40k,15k -->
  <polyline class="fair" points="100,103.4 230,146.1 360,183.4 490,220.9 620,255.9 750,287.1"/>

  <circle cx="750" cy="146.1" r="5" class="pt"/>
  <circle cx="750" cy="287.1" r="5" class="pt"/>
  <path class="lead" d="M 660 350 H 700 V 287.1 H 745"/>
  <path class="lead" d="M 660 300 H 700 V 146.1 H 745"/>
  <rect x="440" y="330" width="230" height="50" rx="6" class="panel"/>
  <text x="454" y="349" class="lbl node">32 threads: gap ≈ 80×</text>
  <text x="454" y="365" class="lbl tiny">1.2M/sec unfair vs 15k/sec fair</text>

  <line x1="20" y1="424" x2="980" y2="424" class="rule"/>
  <line x1="20" y1="436" x2="46" y2="436" stroke="#2563eb" stroke-width="2.2"/>
  <text x="54" y="441" class="lbl tiny">unfair ReentrantLock — barging keeps throughput high</text>
  <line x1="440" y1="436" x2="466" y2="436" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="474" y="441" class="lbl tiny">fair ReentrantLock — strict FIFO handoff collapses throughput</text>
  <circle cx="30" cy="454" r="5" class="pt"/>
  <text x="44" y="459" class="lbl tiny">gap point (order-of-magnitude)</text>

  <!-- ================= PANEL B ================= -->
  <line x1="20" y1="470" x2="980" y2="470" class="rule"/>
  <text x="20" y="494" class="lbl h2">PANEL B — TAIL-LATENCY DISTRIBUTION WHERE FAIRNESS WINS (LOG SCALE)</text>

  <line x1="100" y1="780" x2="100" y2="530" class="axis"/>
  <line x1="100" y1="780" x2="820" y2="780" class="axis"/>

  <!-- y ticks: latency ms, log scale, higher = worse; 1,10,100,1000,10000 ; y=780-log10(v)*55 -->
  <line x1="100" y1="780" x2="820" y2="780" class="grid"/>
  <line x1="100" y1="725" x2="820" y2="725" class="grid"/>
  <line x1="100" y1="670" x2="820" y2="670" class="grid"/>
  <line x1="100" y1="615" x2="820" y2="615" class="grid"/>
  <line x1="100" y1="560" x2="820" y2="560" class="grid"/>

  <line x1="96" y1="780" x2="100" y2="780" class="tick"/>
  <text x="88" y="784" text-anchor="end" class="lbl sub">1ms</text>
  <line x1="96" y1="725" x2="100" y2="725" class="tick"/>
  <text x="88" y="729" text-anchor="end" class="lbl sub">10ms</text>
  <line x1="96" y1="670" x2="100" y2="670" class="tick"/>
  <text x="88" y="674" text-anchor="end" class="lbl sub">100ms</text>
  <line x1="96" y1="615" x2="100" y2="615" class="tick"/>
  <text x="88" y="619" text-anchor="end" class="lbl sub">1,000ms</text>
  <line x1="96" y1="560" x2="100" y2="560" class="tick"/>
  <text x="88" y="564" text-anchor="end" class="lbl sub">10,000ms</text>
  <text x="40" y="650" text-anchor="middle" class="lbl sub" transform="rotate(-90 40 650)">latency, ms (log scale, higher = worse)</text>

  <line x1="120" y1="780" x2="120" y2="785" class="tick"/>
  <text x="120" y="800" text-anchor="middle" class="lbl sub">p50</text>
  <line x1="280" y1="780" x2="280" y2="785" class="tick"/>
  <text x="280" y="800" text-anchor="middle" class="lbl sub">p90</text>
  <line x1="440" y1="780" x2="440" y2="785" class="tick"/>
  <text x="440" y="800" text-anchor="middle" class="lbl sub">p99</text>
  <line x1="600" y1="780" x2="600" y2="785" class="tick"/>
  <text x="600" y="800" text-anchor="middle" class="lbl sub">p99.9</text>
  <line x1="760" y1="780" x2="760" y2="785" class="tick"/>
  <text x="760" y="800" text-anchor="middle" class="lbl sub">p99.99</text>
  <text x="440" y="818" text-anchor="middle" class="lbl sub">latency percentile, settlement-ingest lock acquisition wait</text>

  <!-- unfair: 2,8,150,900,4000 ms -->
  <polyline class="unfair" points="120,743.4 280,710.3 440,640.3 600,597.5 760,561.9"/>
  <!-- fair: 6,12,25,40,60 ms -->
  <polyline class="fair" points="120,717.2 280,700.7 440,683.1 600,671.9 760,662.2"/>

  <line x1="309.3" y1="780" x2="309.3" y2="530" class="guide"/>
  <circle cx="309.3" cy="697.5" r="5" class="pt"/>
  <path class="lead" d="M 400 600 V 630 H 309.3 V 691"/>
  <rect x="340" y="530" width="290" height="54" rx="6" class="panel"/>
  <text x="354" y="546" class="lbl tiny">fairness wins from ≈p92 onward:</text>
  <text x="354" y="560" class="lbl tiny">unfair tail →4,000ms</text>
  <text x="354" y="574" class="lbl tiny">fair tail →60ms (order-of-magnitude)</text>

  <line x1="20" y1="838" x2="980" y2="838" class="rule"/>
  <line x1="20" y1="850" x2="46" y2="850" stroke="#2563eb" stroke-width="2.2"/>
  <text x="54" y="855" class="lbl tiny">unfair lock — lower median, tail explodes past p99 (starvation)</text>
  <line x1="440" y1="850" x2="466" y2="850" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="474" y="855" class="lbl tiny">fair lock — higher median, bounded tail (no starvation)</text>

  <line x1="20" y1="868" x2="980" y2="868" class="rule"/>
  <line x1="20" y1="880" x2="46" y2="880" class="guide"/>
  <text x="54" y="885" class="lbl tiny">guide: crossover percentile, ≈p92</text>
  <rect x="360" y="872" width="22" height="16" rx="3" class="panel"/>
  <text x="392" y="885" class="lbl tiny">annotation panel (gap / crossover callout)</text>
</svg>
