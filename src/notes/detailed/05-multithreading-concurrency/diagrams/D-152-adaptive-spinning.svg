<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline of settlement-ingest-4 contending the FundsLedger monitor: it first
     adaptively spins for a duration derived from recent spin success on this same monitor, then
     parks, then is unparked on release. The axis marks the CAS retry cost and the park/unpark
     round trip as order-of-magnitude figures, not measured constants: a CAS retry costs on the
     order of 10 to 20 nanoseconds, while a park/unpark round trip costs on the order of 1 to 10
     microseconds, roughly two to three orders of magnitude more. -XX:-UseHeavyMonitors is named as
     the switch that disables spinning and adaptive behaviour for measurement.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .tiny  { font-size: 11px; }
    .floor { font-size: 10.5px; fill: #4b5563; }

    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri475); }
  </style>
  <defs>
    <marker id="tri475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">ADAPTIVE SPINNING, THEN PARKING — settlement-ingest-4 vs THE FundsLedger MONITOR</text>
  <line x1="20" y1="42" x2="980" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="64" class="lbl h2">TIMELINE — ONE CONTENDER'S PATH (order-of-magnitude costs, not measured constants)</text>

  <!-- phase boxes: fixed x-lanes with generous gaps for transition labels -->
  <rect x="60" y="90" width="280" height="200" rx="6" class="boxH"/>
  <text x="200" y="114" text-anchor="middle" class="lbl node">1. adaptive spin</text>
  <text x="76" y="138" class="lbl dense">settlement-ingest-4 busy-waits,</text>
  <text x="76" y="154" class="lbl dense">re-CASing for FundsLedger's</text>
  <text x="76" y="170" class="lbl dense">_owner slot</text>
  <text x="76" y="192" class="lbl dense">spin budget is derived from recent</text>
  <text x="76" y="208" class="lbl dense">success spinning on THIS monitor —</text>
  <text x="76" y="224" class="lbl dense">more recent wins mean a longer</text>
  <text x="76" y="240" class="lbl dense">budget, recent failures a shorter one</text>
  <text x="76" y="262" class="lbl floor">each failed attempt costs one CAS retry,</text>
  <text x="76" y="276" class="lbl floor">on the order of 10-20 ns</text>

  <rect x="420" y="90" width="200" height="200" rx="6" class="boxD"/>
  <text x="520" y="114" text-anchor="middle" class="lbl node">2. park</text>
  <text x="436" y="138" class="lbl dense">settlement-ingest-4 is</text>
  <text x="436" y="154" class="lbl dense">pushed onto _cxq (see</text>
  <text x="436" y="170" class="lbl dense">D-150) and calls</text>
  <text x="436" y="186" class="lbl dense">Unsafe.park() — blocks,</text>
  <text x="436" y="202" class="lbl dense">yielding the CPU entirely</text>
  <text x="436" y="226" class="lbl floor">no further CAS attempts</text>
  <text x="436" y="240" class="lbl floor">while parked; the OS scheduler</text>
  <text x="436" y="254" class="lbl floor">removes it from the run queue</text>

  <rect x="700" y="90" width="240" height="200" rx="6" class="boxR"/>
  <text x="820" y="114" text-anchor="middle" class="lbl node">3. unpark</text>
  <text x="716" y="138" class="lbl dense">owner's monitorexit calls</text>
  <text x="716" y="154" class="lbl dense">Unsafe.unpark() on</text>
  <text x="716" y="170" class="lbl dense">settlement-ingest-4</text>
  <text x="716" y="194" class="lbl floor">full park/unpark round trip:</text>
  <text x="716" y="208" class="lbl floor">order of 1-10 µs (order of</text>
  <text x="716" y="222" class="lbl floor">magnitude, kernel-dependent) —</text>
  <text x="716" y="236" class="lbl floor">roughly 100-1000x a single CAS</text>
  <text x="716" y="250" class="lbl floor">retry from phase 1</text>

  <!-- transitions, drawn after boxes so they sit on top and stay inside the gap lanes -->
  <path class="flow" d="M 340 190 H 420"/>
  <text x="380" y="180" text-anchor="middle" class="lbl floor">exhausted</text>

  <path class="flow" d="M 620 190 H 700"/>
  <text x="660" y="180" text-anchor="middle" class="lbl floor">releases</text>

  <!-- cost bars aligned to the phase lanes -->
  <line x1="60" y1="310" x2="940" y2="310" stroke="#475569" stroke-width="2"/>
  <text x="940" y="326" text-anchor="end" class="lbl tiny">time (not to a linear scale)</text>

  <rect x="60" y="336" width="280" height="26" rx="4" class="boxH"/>
  <text x="200" y="354" text-anchor="middle" class="lbl tiny">CAS retry ~10-20 ns (order of magnitude)</text>

  <rect x="420" y="336" width="520" height="26" rx="4" class="boxD"/>
  <text x="680" y="354" text-anchor="middle" class="lbl tiny">park/unpark round trip ~1-10 µs — roughly 100-1000x a CAS retry</text>

  <!-- why / measurement panels -->
  <rect x="60" y="382" width="420" height="94" rx="6" class="boxA"/>
  <text x="80" y="404" class="lbl h2">why spin-then-block</text>
  <text x="90" y="424" class="lbl dense">Since a CAS retry is orders of magnitude cheaper</text>
  <text x="90" y="442" class="lbl dense">than a park/unpark trip, spinning briefly beats</text>
  <text x="90" y="460" class="lbl dense">parking immediately when release looks imminent.</text>

  <rect x="520" y="382" width="420" height="94" rx="6" class="boxA"/>
  <text x="540" y="404" class="lbl h2">measurement switch</text>
  <text x="550" y="424" class="lbl dense">-XX:-UseHeavyMonitors forces every lock</text>
  <text x="550" y="442" class="lbl dense">straight to the heavyweight ObjectMonitor path,</text>
  <text x="550" y="460" class="lbl dense">disabling spin so park/unpark cost is isolated.</text>

  <!-- Legend -->
  <line x1="20" y1="494" x2="980" y2="494" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="506" width="18" height="14" rx="3" class="boxH"/>
  <text x="44" y="518" class="lbl tiny">spin phase / CAS cost band</text>
  <rect x="260" y="506" width="18" height="14" rx="3" class="boxD"/>
  <text x="284" y="518" class="lbl tiny">parked / blocked, park-unpark cost band</text>
  <rect x="580" y="506" width="18" height="14" rx="3" class="boxR"/>
  <text x="604" y="518" class="lbl tiny">unparked, resumes contending</text>
  <rect x="820" y="506" width="18" height="14" rx="3" class="boxA"/>
  <text x="844" y="518" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 20 538 H 56"/>
  <text x="64" y="543" class="lbl tiny">A → B : B follows A in time</text>
</svg>
