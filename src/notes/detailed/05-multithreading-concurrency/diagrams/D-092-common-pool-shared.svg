<svg viewBox="0 0 1040 740" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ForkJoinPool.commonPool sits at the centre of the JVM process and is fed by four
     unrelated call sites: parallel streams, CompletableFuture *Async methods called with no
     executor argument, ConcurrentHashMap bulk operations, and Arrays.parallelSort. Its parallelism
     is availableProcessors() minus 1, which is 4 minus 1 equals 3 workers on a 4-core box, and the
     calling thread also participates by running pending tasks inside join(). One of the three
     workers is shown blocked on a synchronous PSP call settling DEP-301 CAPTURED, which starves
     every other unrelated consumer of the same process-wide pool.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; fill: #4b5563; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .hdr   { font-size: 11px; font-weight: 700; }

    .boxP     { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxWeak  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .degraded { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .annot    { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .bus  { fill: none; stroke: #475569; stroke-width: 2; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="740" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">EVERYONE SHARES THE COMMON POOL</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="64" class="lbl h2">CALLERS — FOUR UNRELATED FEATURES, ONE PROCESS-WIDE POOL</text>

  <rect x="50" y="76" width="220" height="70" rx="6" class="boxP"/>
  <text x="160" y="102" text-anchor="middle" class="lbl node">parallel Stream</text>
  <text x="160" y="122" text-anchor="middle" class="lbl body">.parallelStream() / .parallel()</text>

  <rect x="290" y="76" width="220" height="70" rx="6" class="boxP"/>
  <text x="400" y="102" text-anchor="middle" class="lbl node">CompletableFuture</text>
  <text x="400" y="122" text-anchor="middle" class="lbl body">*Async, no Executor arg</text>

  <rect x="530" y="76" width="220" height="70" rx="6" class="boxP"/>
  <text x="640" y="102" text-anchor="middle" class="lbl node">ConcurrentHashMap</text>
  <text x="640" y="122" text-anchor="middle" class="lbl body">forEach / search / reduce</text>

  <rect x="770" y="76" width="220" height="70" rx="6" class="boxP"/>
  <text x="880" y="102" text-anchor="middle" class="lbl node">Arrays.parallelSort</text>
  <text x="880" y="122" text-anchor="middle" class="lbl body">sorts via commonPool</text>

  <path class="bus" d="M 160 146 V 176"/>
  <path class="bus" d="M 400 146 V 176"/>
  <path class="bus" d="M 640 146 V 176"/>
  <path class="bus" d="M 880 146 V 176"/>
  <path class="bus" d="M 160 176 H 880"/>
  <path class="flow" d="M 520 176 V 206"/>

  <rect x="350" y="206" width="340" height="100" rx="6" class="boxP"/>
  <text x="520" y="234" text-anchor="middle" class="lbl node">ForkJoinPool.commonPool()</text>
  <text x="520" y="254" text-anchor="middle" class="lbl body">parallelism = availableProcessors() − 1</text>
  <text x="520" y="272" text-anchor="middle" class="lbl body">= 4 − 1 = 3 workers (4-core box)</text>
  <text x="520" y="290" text-anchor="middle" class="lbl sub">caller thread also participates via join()</text>

  <path class="flow" d="M 520 306 V 336"/>
  <path class="bus" d="M 190 336 H 850"/>
  <path class="bus" d="M 190 336 V 366"/>
  <path class="bus" d="M 410 336 V 366"/>
  <path class="bus" d="M 630 336 V 366"/>
  <path class="bus" d="M 850 336 V 366"/>

  <text x="20" y="326" class="lbl h2">WORKERS</text>

  <rect x="90" y="366" width="200" height="80" rx="6" class="boxP"/>
  <text x="190" y="396" text-anchor="middle" class="lbl node">ForkJoinWorkerThread-1</text>
  <text x="190" y="416" text-anchor="middle" class="lbl body">idle, ready for tasks</text>

  <rect x="310" y="366" width="200" height="80" rx="6" class="boxP"/>
  <text x="410" y="396" text-anchor="middle" class="lbl node">ForkJoinWorkerThread-2</text>
  <text x="410" y="416" text-anchor="middle" class="lbl body">idle, ready for tasks</text>

  <rect x="530" y="366" width="200" height="80" rx="6" class="degraded"/>
  <text x="630" y="391" text-anchor="middle" class="lbl node">ForkJoinWorkerThread-3</text>
  <text x="630" y="410" text-anchor="middle" class="lbl body">blocked: synchronous PSP call</text>
  <text x="630" y="426" text-anchor="middle" class="lbl sub">DEP-301 CAPTURED, 240ms p50</text>

  <rect x="750" y="366" width="200" height="80" rx="6" class="boxWeak"/>
  <text x="850" y="396" text-anchor="middle" class="lbl node">caller thread</text>
  <text x="850" y="416" text-anchor="middle" class="lbl body">runs pending tasks in join()</text>
  <text x="850" y="432" text-anchor="middle" class="lbl sub">not a pool worker</text>

  <rect x="280" y="480" width="480" height="110" rx="6" class="annot"/>
  <text x="520" y="500" text-anchor="middle" class="lbl hdr">STARVATION</text>
  <text x="520" y="520" text-anchor="middle" class="lbl tiny">only 3 workers total (4 − 1) — one is now blocked on I/O, not CPU work</text>
  <text x="520" y="538" text-anchor="middle" class="lbl tiny">unrelated CompletableFuture.supplyAsync() work queues behind it</text>
  <text x="520" y="556" text-anchor="middle" class="lbl tiny">commonPool is process-wide: one blocking call anywhere delays every consumer</text>

  <line x1="20" y1="620" x2="1020" y2="620" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="640" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="653" class="lbl tiny">caller API / pool / healthy worker</text>
  <rect x="330" y="640" width="22" height="16" rx="3" class="boxWeak"/>
  <text x="360" y="653" class="lbl tiny">caller thread — participates, not a pool worker</text>
  <rect x="660" y="640" width="22" height="16" rx="3" class="degraded"/>
  <text x="690" y="653" class="lbl tiny">worker blocked on I/O — starves the pool</text>

  <path class="flow" d="M 20 674 H 60"/>
  <text x="68" y="679" class="lbl tiny">A → B : A submits work into / fans out of B</text>
</svg>
