<svg viewBox="0 0 1040 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="One JVM process box contains the shared region: heap with a FundsLedger instance,
     static fields, metaspace and code cache, plus an OS file descriptor table. Three thread boxes
     — reserve-stake worker 1, reserve-stake worker 2, settle-stake worker — each own a private
     stack, program counter, registers and thread-local storage. Inside worker 1's stack a local
     variable Money stake is confined to that thread, but an arrow shows it holds a reference into
     a Reservation object that lives on the shared heap: the reference is confined, the object is
     not.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxProc { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH    { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR    { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW    { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak   { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WHAT THREADS SHARE AND WHAT THEY OWN — JVM PROCESS FOR QUIZSTAKES</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Process outer box -->
  <rect x="30" y="60" width="980" height="480" rx="8" class="boxProc"/>
  <text x="46" y="82" class="lbl h2">JVM PROCESS</text>

  <!-- Shared region band -->
  <text x="46" y="106" class="lbl h2">SHARED REGION — every thread sees the same bytes</text>
  <rect x="46" y="116" width="948" height="150" rx="6" class="boxP"/>

  <rect x="62" y="132" width="230" height="110" rx="6" class="boxH"/>
  <text x="177" y="154" text-anchor="middle" class="lbl node">Heap</text>
  <text x="177" y="174" text-anchor="middle" class="lbl body">FundsLedger instance</text>
  <text x="177" y="192" text-anchor="middle" class="lbl sub">LedgerEntry rows, Position objects</text>
  <text x="177" y="208" text-anchor="middle" class="lbl sub">Reservation objects live here</text>
  <text x="177" y="226" text-anchor="middle" class="lbl sub">object headers + fields, GC-managed</text>

  <rect x="312" y="132" width="180" height="110" rx="6" class="boxW"/>
  <text x="402" y="154" text-anchor="middle" class="lbl node">Static fields</text>
  <text x="402" y="174" text-anchor="middle" class="lbl body">class-level state</text>
  <text x="402" y="192" text-anchor="middle" class="lbl sub">e.g. BonusService</text>
  <text x="402" y="208" text-anchor="middle" class="lbl sub">config, counters</text>

  <rect x="512" y="132" width="200" height="110" rx="6" class="boxW"/>
  <text x="612" y="154" text-anchor="middle" class="lbl node">Metaspace</text>
  <text x="612" y="174" text-anchor="middle" class="lbl body">class metadata</text>
  <text x="612" y="192" text-anchor="middle" class="lbl sub">Reservation.class,</text>
  <text x="612" y="208" text-anchor="middle" class="lbl sub">FundsLedger.class layouts</text>

  <rect x="732" y="132" width="130" height="110" rx="6" class="boxW"/>
  <text x="797" y="154" text-anchor="middle" class="lbl node">Code cache</text>
  <text x="797" y="174" text-anchor="middle" class="lbl body">JIT-compiled</text>
  <text x="797" y="192" text-anchor="middle" class="lbl sub">ReserveStake</text>
  <text x="797" y="208" text-anchor="middle" class="lbl sub">machine code</text>

  <rect x="882" y="132" width="96" height="110" rx="6" class="boxW"/>
  <text x="930" y="154" text-anchor="middle" class="lbl node">fd table</text>
  <text x="930" y="174" text-anchor="middle" class="lbl body">OS-owned</text>
  <text x="930" y="196" text-anchor="middle" class="lbl sub">sockets,</text>
  <text x="930" y="212" text-anchor="middle" class="lbl sub">log files</text>

  <!-- Per-thread band -->
  <text x="46" y="300" class="lbl h2">PER-THREAD REGION — each thread owns a private copy</text>

  <!-- thread 1 -->
  <rect x="46" y="312" width="290" height="212" rx="6" class="boxR"/>
  <text x="191" y="334" text-anchor="middle" class="lbl node">reserve-stake worker 1</text>
  <rect x="60" y="346" width="262" height="90" rx="4" class="boxW"/>
  <text x="191" y="364" text-anchor="middle" class="lbl body">Stack</text>
  <text x="191" y="382" text-anchor="middle" class="lbl dense">Money stake = 4.20</text>
  <text x="191" y="398" text-anchor="middle" class="lbl sub">local var — confined to this stack frame</text>
  <text x="191" y="414" text-anchor="middle" class="lbl sub">frame: ReserveStake(clientId, roundId)</text>
  <text x="70" y="452" class="lbl dense">PC: next bytecode index</text>
  <text x="70" y="470" class="lbl dense">Registers: CPU state on last run</text>
  <text x="70" y="488" class="lbl dense">TLS: per-thread allocation buffer (TLAB)</text>
  <text x="70" y="506" class="lbl sub">none of this is visible to worker 2</text>

  <!-- thread 2 -->
  <rect x="366" y="312" width="290" height="212" rx="6" class="boxR"/>
  <text x="511" y="334" text-anchor="middle" class="lbl node">reserve-stake worker 2</text>
  <rect x="380" y="346" width="262" height="90" rx="4" class="boxW"/>
  <text x="511" y="364" text-anchor="middle" class="lbl body">Stack</text>
  <text x="511" y="382" text-anchor="middle" class="lbl dense">Money stake = 6.50</text>
  <text x="511" y="398" text-anchor="middle" class="lbl sub">local var — confined to this stack frame</text>
  <text x="511" y="414" text-anchor="middle" class="lbl sub">frame: ReserveStake(clientId, roundId)</text>
  <text x="390" y="452" class="lbl dense">PC: next bytecode index</text>
  <text x="390" y="470" class="lbl dense">Registers: CPU state on last run</text>
  <text x="390" y="488" class="lbl dense">TLS: per-thread allocation buffer (TLAB)</text>

  <!-- thread 3 -->
  <rect x="686" y="312" width="290" height="212" rx="6" class="boxR"/>
  <text x="831" y="334" text-anchor="middle" class="lbl node">settle-stake worker</text>
  <rect x="700" y="346" width="262" height="90" rx="4" class="boxW"/>
  <text x="831" y="364" text-anchor="middle" class="lbl body">Stack</text>
  <text x="831" y="382" text-anchor="middle" class="lbl dense">RoundId roundId</text>
  <text x="831" y="398" text-anchor="middle" class="lbl sub">local var — confined to this stack frame</text>
  <text x="831" y="414" text-anchor="middle" class="lbl sub">frame: SettleStake(roundId, outcome)</text>
  <text x="710" y="452" class="lbl dense">PC: next bytecode index</text>
  <text x="710" y="470" class="lbl dense">Registers: CPU state on last run</text>
  <text x="710" y="488" class="lbl dense">TLS: per-thread allocation buffer (TLAB)</text>

  <!-- arrow: confinement is of reference not object -->
  <path class="flow" d="M 322 382 H 350 V 260 H 177 V 246"/>

  <!-- annotation panel -->
  <rect x="46" y="546" width="964" height="90" rx="6" class="boxAnn"/>
  <text x="62" y="568" class="lbl h2">THE POINT</text>
  <text x="62" y="590" class="lbl tiny">worker 1's local variable Money stake is confined — no other thread can read that stack slot.</text>
  <text x="62" y="608" class="lbl tiny">But if stake (or any reference reachable from it) points at a Reservation on the shared heap, every thread that</text>
  <text x="62" y="626" class="lbl tiny">obtains that reference can read and mutate the same object. The reference is confined, the object is not.</text>

  <!-- legend -->
  <line x1="20" y1="660" x2="1020" y2="660" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="672" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="685" class="lbl tiny">shared region</text>
  <rect x="170" y="672" width="22" height="16" rx="3" class="boxH"/>
  <text x="200" y="685" class="lbl tiny">heap object — the subject, FundsLedger</text>
  <rect x="440" y="672" width="22" height="16" rx="3" class="boxR"/>
  <text x="470" y="685" class="lbl tiny">per-thread owned region</text>
  <rect x="640" y="672" width="22" height="16" rx="3" class="boxW"/>
  <text x="670" y="685" class="lbl tiny">nested / secondary detail box</text>
  <rect x="850" y="672" width="22" height="16" rx="3" class="boxAnn"/>
  <text x="880" y="685" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 20 706 H 60"/>
  <text x="70" y="711" class="lbl tiny">A → B : B is reached from A (reference confined, object shared)</text>

  <text x="20" y="736" class="lbl sub">Process boundary (light grey, #9ca3af border) groups everything one JVM instance owns; the OS process wraps it further.</text>
</svg>
