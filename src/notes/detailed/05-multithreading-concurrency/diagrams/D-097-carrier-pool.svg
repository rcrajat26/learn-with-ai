<svg viewBox="0 0 1040 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The virtual thread scheduler is a ForkJoinPool running in FIFO async mode. Its
     parallelism defaults to availableProcessors and is controlled by
     jdk.virtualThreadScheduler.parallelism. Its ceiling is controlled by
     jdk.virtualThreadScheduler.maxPoolSize, whose default is the maximum of parallelism and 256,
     confirmed against the jdk-21-ga VirtualThread.java source. A Java 21 only
     jdk.virtualThreadScheduler.minRunnable controls how many spare carriers stay unparked. A FIFO
     queue of runnable virtual threads, such as gateway-http workers, feeds a pool of CarrierThreads.
     This is contrasted with the LIFO work-stealing deques used by the common ForkJoinPool for
     parallel streams.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxL   { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxAnn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .pill   { fill: #fbbf24; stroke: #b45309; stroke-width: 1.3; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
    .legacy { fill: none; stroke: #78716c; stroke-width: 1.8; marker-end: url(#triL); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="triL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE CARRIER POOL — jdk.internal.misc.VirtualThreadScheduler</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="66" class="lbl h2">VIRTUAL THREAD SCHEDULER — ForkJoinPool, FIFO ASYNC MODE</text>

  <!-- scheduler box -->
  <rect x="40" y="80" width="960" height="130" rx="6" class="boxH"/>
  <text x="60" y="104" class="lbl node">ForkJoinPool (built-in scheduler)</text>
  <text x="60" y="126" class="lbl body">asyncMode = true → FIFO submission queue, not LIFO</text>

  <rect x="60" y="140" width="290" height="56" rx="4" class="boxW"/>
  <text x="205" y="160" text-anchor="middle" class="lbl dense">jdk.virtualThreadScheduler.parallelism</text>
  <text x="205" y="178" text-anchor="middle" class="lbl sub">default: Runtime.availableProcessors()</text>

  <rect x="365" y="140" width="290" height="56" rx="4" class="boxW"/>
  <text x="510" y="160" text-anchor="middle" class="lbl dense">jdk.virtualThreadScheduler.maxPoolSize</text>
  <text x="510" y="178" text-anchor="middle" class="lbl sub">default: max(parallelism, 256)</text>

  <rect x="670" y="140" width="320" height="56" rx="4" class="boxW"/>
  <text x="820" y="160" text-anchor="middle" class="lbl dense">jdk.virtualThreadScheduler.minRunnable</text>
  <text x="820" y="178" text-anchor="middle" class="lbl sub">spare unparked carriers</text>
  <rect x="960" y="144" width="22" height="14" rx="3" class="pill"/>
  <text x="971" y="155" text-anchor="middle" class="lbl tiny" font-weight="700">21</text>

  <!-- FIFO queue -->
  <path class="flow" d="M 520 210 V 234"/>
  <text x="560" y="228" class="lbl tiny">feeds</text>

  <rect x="60" y="234" width="920" height="90" rx="6" class="boxP"/>
  <text x="80" y="256" class="lbl node">FIFO queue — runnable virtual threads</text>
  <rect x="80" y="266" width="140" height="42" rx="4" class="boxW"/>
  <text x="150" y="292" text-anchor="middle" class="lbl sub">gateway-http-7</text>
  <rect x="230" y="266" width="150" height="42" rx="4" class="boxW"/>
  <text x="305" y="292" text-anchor="middle" class="lbl sub">gateway-http-8</text>
  <rect x="390" y="266" width="160" height="42" rx="4" class="boxW"/>
  <text x="470" y="292" text-anchor="middle" class="lbl sub">settlement-ingest-3</text>
  <rect x="560" y="266" width="150" height="42" rx="4" class="boxW"/>
  <text x="635" y="292" text-anchor="middle" class="lbl sub">gateway-http-9</text>
  <text x="740" y="292" class="lbl tiny">… head to tail, oldest served first</text>

  <!-- bus to carriers -->
  <path class="flow" d="M 520 324 V 350"/>
  <line x1="140" y1="350" x2="900" y2="350" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M 140 350 V 366"/>
  <path class="flow" d="M 380 350 V 366"/>
  <path class="flow" d="M 620 350 V 366"/>
  <path class="flow" d="M 900 350 V 366"/>

  <rect x="60" y="366" width="160" height="70" rx="6" class="boxR"/>
  <text x="140" y="392" text-anchor="middle" class="lbl body">CarrierThread-1</text>
  <text x="140" y="412" text-anchor="middle" class="lbl sub">platform thread</text>

  <rect x="300" y="366" width="160" height="70" rx="6" class="boxR"/>
  <text x="380" y="392" text-anchor="middle" class="lbl body">CarrierThread-2</text>
  <text x="380" y="412" text-anchor="middle" class="lbl sub">platform thread</text>

  <rect x="540" y="366" width="160" height="70" rx="6" class="boxR"/>
  <text x="620" y="392" text-anchor="middle" class="lbl body">CarrierThread-N</text>
  <text x="620" y="412" text-anchor="middle" class="lbl sub">up to parallelism</text>

  <rect x="820" y="366" width="160" height="70" rx="6" class="boxL"/>
  <text x="900" y="392" text-anchor="middle" class="lbl body">…up to maxPoolSize</text>
  <text x="900" y="412" text-anchor="middle" class="lbl sub">ceiling: 256 (confirmed)</text>

  <!-- contrast panel: LIFO parallel streams -->
  <text x="20" y="480" class="lbl h2">CONTRAST — COMMON ForkJoinPool FOR PARALLEL STREAMS (LIFO WORK-STEALING)</text>

  <rect x="40" y="494" width="960" height="150" rx="6" class="boxL"/>
  <text x="60" y="518" class="lbl node">ForkJoinPool.commonPool()</text>
  <text x="60" y="540" class="lbl body">asyncMode = false → each worker owns a LIFO deque</text>
  <text x="60" y="560" class="lbl sub">Owner thread pushes/pops its own end (LIFO, cache-friendly, good for</text>
  <text x="60" y="576" class="lbl sub">divide-and-conquer recursion in parallel streams).</text>
  <text x="60" y="596" class="lbl sub">Idle workers steal from the OTHER end (FIFO) of a busy worker's deque —</text>
  <text x="60" y="612" class="lbl sub">work-stealing, not the virtual thread scheduler's plain FIFO submission queue.</text>
  <rect x="620" y="530" width="340" height="96" rx="4" class="boxW"/>
  <text x="790" y="552" text-anchor="middle" class="lbl dense">why virtual threads use FIFO instead</text>
  <text x="790" y="572" text-anchor="middle" class="lbl sub">fairness across many short-lived,</text>
  <text x="790" y="588" text-anchor="middle" class="lbl sub">I/O-bound virtual threads matters</text>
  <text x="790" y="604" text-anchor="middle" class="lbl sub">more than LIFO cache locality here</text>

  <!-- domain arithmetic annotation -->
  <rect x="40" y="654" width="960" height="60" rx="6" class="boxAnn"/>
  <text x="56" y="676" class="lbl dense" font-weight="700">55 000 peak concurrent card-PSP sessions run as 55 000 virtual threads,</text>
  <text x="56" y="694" class="lbl tiny">time-sliced across a carrier pool sized by parallelism/maxPoolSize — not 55 000 OS threads.</text>

  <!-- legend -->
  <line x1="20" y1="726" x2="1020" y2="726" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="738" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="751" class="lbl tiny">scheduler — subject of the diagram</text>
  <rect x="270" y="738" width="22" height="16" rx="3" class="boxP"/>
  <text x="300" y="751" class="lbl tiny">runnable virtual thread queue</text>
  <rect x="530" y="738" width="22" height="16" rx="3" class="boxR"/>
  <text x="560" y="751" class="lbl tiny">carrier — concrete platform thread</text>
  <rect x="800" y="738" width="22" height="16" rx="3" class="boxL"/>
  <text x="830" y="751" class="lbl tiny">legacy pool / extra capacity</text>

  <path class="flow" d="M 20 774 H 60"/>
  <text x="70" y="779" class="lbl tiny">A → B : A feeds/produces B (FIFO)</text>
  <rect x="20" y="786" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="799" class="lbl tiny">tunable config box</text>
</svg>
