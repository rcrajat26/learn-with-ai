<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The deadlock cycle and the four Coffman conditions, before and after. Left:
     gateway-http-7 runs transfer(accountA, accountB) and holds the lock on accountA while wanting
     the lock on accountB; settlement-ingest-3 runs transfer(accountB, accountA) and holds the
     lock on accountB while wanting the lock on accountA — a two-node wait-for cycle, deadlocked.
     Right: the fix orders lock acquisition by System.identityHashCode of the two account locks,
     always taking the lower hash first, with a static tie lock acquired first when the two
     hash codes collide, so both threads now request the same first lock and the cycle cannot
     form. A legend maps each of the four Coffman conditions — mutual exclusion, hold and wait,
     no preemption, circular wait — to whether this fix breaks it.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxY  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .ann   { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .hold  { fill: none; stroke: #15803d; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#triG); }
    .want  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 5 3;
             marker-end: url(#triD); }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .div   { stroke: #d1d5db; stroke-width: 1; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="triD" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE DEADLOCK CYCLE AND THE FOUR COFFMAN CONDITIONS</text>
  <line x1="20" y1="42" x2="1100" y2="42" class="rule"/>

  <text x="120" y="62" class="lbl h2">BEFORE — WAIT-FOR CYCLE, DEADLOCKED</text>
  <line x1="120" y1="70" x2="500" y2="70" class="div"/>
  <text x="640" y="62" class="lbl h2">AFTER — TOTAL LOCK ORDER BY identityHashCode</text>
  <line x1="640" y1="70" x2="1080" y2="70" class="div"/>
  <line x1="560" y1="50" x2="560" y2="560" class="div"/>

  <!-- BEFORE -->
  <rect x="90" y="130" width="200" height="60" rx="6" class="boxY"/>
  <text x="190" y="155" text-anchor="middle" class="lbl node">gateway-http-7</text>
  <text x="190" y="172" text-anchor="middle" class="lbl sub">transfer(accountA, accountB)</text>

  <rect x="300" y="330" width="200" height="60" rx="6" class="boxY"/>
  <text x="400" y="355" text-anchor="middle" class="lbl node">settlement-ingest-3</text>
  <text x="400" y="372" text-anchor="middle" class="lbl sub">transfer(accountB, accountA)</text>

  <rect x="90" y="330" width="200" height="60" rx="6" class="boxP"/>
  <text x="190" y="360" text-anchor="middle" class="lbl node">lock(accountA)</text>

  <rect x="300" y="130" width="200" height="60" rx="6" class="boxP"/>
  <text x="400" y="160" text-anchor="middle" class="lbl node">lock(accountB)</text>

  <!-- gateway-http-7 holds accountA, wants accountB -->
  <path class="hold" d="M 190 190 V 330"/>
  <text x="145" y="260" class="lbl tiny">holds</text>
  <path class="want" d="M 290 160 H 300"/>
  <text x="255" y="150" class="lbl tiny">wants</text>

  <!-- settlement-ingest-3 holds accountB, wants accountA -->
  <path class="hold" d="M 400 330 V 190"/>
  <text x="415" y="260" class="lbl tiny">holds</text>
  <path class="want" d="M 300 360 H 290"/>
  <text x="230" y="378" class="lbl tiny">wants</text>

  <rect x="90" y="420" width="410" height="110" rx="6" class="boxD"/>
  <text x="102" y="442" class="lbl node">DEADLOCK — circular wait</text>
  <text x="102" y="462" class="lbl sub">gateway-http-7 holds accountA, wants accountB;</text>
  <text x="102" y="478" class="lbl sub">settlement-ingest-3 holds accountB, wants accountA.</text>
  <text x="102" y="494" class="lbl sub">Each blocks forever waiting on the other's lock —</text>
  <text x="102" y="510" class="lbl sub">a two-node cycle in the wait-for graph.</text>

  <!-- AFTER -->
  <rect x="630" y="130" width="200" height="60" rx="6" class="boxY"/>
  <text x="730" y="155" text-anchor="middle" class="lbl node">gateway-http-7</text>
  <text x="730" y="172" text-anchor="middle" class="lbl sub">transfer(accountA, accountB)</text>

  <rect x="850" y="130" width="200" height="60" rx="6" class="boxY"/>
  <text x="950" y="155" text-anchor="middle" class="lbl node">settlement-ingest-3</text>
  <text x="950" y="172" text-anchor="middle" class="lbl sub">transfer(accountB, accountA)</text>

  <path class="flow" d="M 730 190 V 214"/>
  <path class="flow" d="M 950 190 V 214"/>
  <path class="flow" d="M 730 214 H 950"/>
  <path class="flow" d="M 840 214 V 236"/>

  <rect x="740" y="236" width="200" height="60" rx="6" class="boxR"/>
  <text x="840" y="260" text-anchor="middle" class="lbl node">order by identityHashCode</text>
  <text x="840" y="278" text-anchor="middle" class="lbl sub">lower hash acquired first</text>

  <path class="flow" d="M 840 296 V 320"/>
  <rect x="740" y="320" width="200" height="70" rx="6" class="boxD"/>
  <text x="840" y="342" text-anchor="middle" class="lbl node">tie lock</text>
  <text x="840" y="360" text-anchor="middle" class="lbl sub">identityHashCode(accountA)</text>
  <text x="840" y="374" text-anchor="middle" class="lbl sub">== identityHashCode(accountB)</text>

  <path class="flow" d="M 840 390 V 414"/>
  <rect x="700" y="414" width="280" height="54" rx="6" class="boxR"/>
  <text x="840" y="436" text-anchor="middle" class="lbl node">both threads lock in the same order</text>
  <text x="840" y="452" text-anchor="middle" class="lbl sub">no thread can hold the second and want the first</text>

  <rect x="630" y="486" width="410" height="120" rx="6" class="ann"/>
  <text x="642" y="506" class="lbl node" font-size="13">TIE LOCK, EXPLAINED</text>
  <text x="642" y="524" class="lbl sub">on the rare hash collision, neither account's hash</text>
  <text x="642" y="540" class="lbl sub">is provably smaller, so both threads first acquire one</text>
  <text x="642" y="556" class="lbl sub">shared static lock before taking accountA and accountB</text>
  <text x="642" y="572" class="lbl sub">in any fixed order — the tie lock itself is never</text>
  <text x="642" y="588" class="lbl sub">involved in a two-account cycle.</text>

  <!-- Coffman legend table -->
  <line x1="20" y1="620" x2="1100" y2="620" class="rule"/>
  <text x="20" y="640" class="lbl h2">THE FOUR COFFMAN CONDITIONS AND WHAT THIS FIX DOES TO EACH</text>

  <rect x="20" y="656" width="1080" height="34" class="ann"/>
  <text x="32" y="678" class="lbl body" font-weight="700">Mutual exclusion</text>
  <text x="330" y="678" class="lbl sub">a lock is held by at most one thread</text>
  <text x="700" y="678" class="lbl sub" font-weight="700">not broken — inherent to using locks at all</text>

  <rect x="20" y="690" width="1080" height="34" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="32" y="712" class="lbl body" font-weight="700">Hold and wait</text>
  <text x="330" y="712" class="lbl sub">a thread keeps its lock while blocked on another</text>
  <text x="700" y="712" class="lbl sub" font-weight="700">not broken — accountA is still held while waiting</text>

  <rect x="20" y="724" width="1080" height="34" class="ann"/>
  <text x="32" y="746" class="lbl body" font-weight="700">No preemption</text>
  <text x="330" y="746" class="lbl sub">a held lock cannot be forcibly taken away</text>
  <text x="700" y="746" class="lbl sub" font-weight="700">not broken — JVM intrinsic locks are never preempted</text>

  <rect x="20" y="758" width="1080" height="34" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="32" y="780" class="lbl body" font-weight="700">Circular wait</text>
  <text x="330" y="780" class="lbl sub">a cycle of threads each waiting on the next</text>
  <text x="700" y="780" class="lbl sub" font-weight="700">BROKEN — total order removes the cycle</text>

  <!-- legend -->
  <line x1="20" y1="800" x2="1100" y2="800" class="rule"/>

  <rect x="40" y="816" width="20" height="14" rx="3" class="boxY"/>
  <text x="68" y="827" class="lbl tiny">thread — the subject running transfer()</text>

  <rect x="560" y="816" width="20" height="14" rx="3" class="boxP"/>
  <text x="588" y="827" class="lbl tiny">a lock — accountA or accountB</text>

  <rect x="40" y="842" width="20" height="14" rx="3" class="boxR"/>
  <text x="68" y="853" class="lbl tiny">fixed / safe outcome</text>

  <rect x="560" y="842" width="20" height="14" rx="3" class="boxD"/>
  <text x="588" y="853" class="lbl tiny">deadlocked state, or the tie-break case</text>

  <path class="hold" d="M 40 868 H 80"/>
  <text x="88" y="872" class="lbl tiny">holds — A → B : A currently holds lock B</text>

  <path class="want" d="M 560 868 H 600"/>
  <text x="608" y="872" class="lbl tiny">wants — A → B : A is blocked waiting for lock B</text>

  <path class="flow" d="M 40 884 H 80"/>
  <text x="88" y="888" class="lbl tiny">ordered acquisition — A → B : A then B, always this order</text>
</svg>
