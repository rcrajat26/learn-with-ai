<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout of a volatile Money array reference named buckets. The reference
     slot itself is volatile: a write of a new array reference to buckets is immediately visible
     to every thread. The reference points at a four-element array holding CLIENT_CASH_AVAILABLE,
     CLIENT_CASH_RESERVED, CLIENT_BONUS_AVAILABLE, and CLIENT_BONUS_RESERVED, but each element slot
     inside the array is plain: mutating buckets[i] in place is an ordinary, non-volatile write with
     no visibility or ordering guarantee. AtomicReferenceArray of Money, or a VarHandle opened with
     acquire and release access modes on the array's element type, are named as fixes that make the
     per-element writes themselves visible.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }

    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">volatile ON AN ARRAY REFERENCE PROTECTS ONLY THE REFERENCE</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Field declaration -->
  <rect x="60" y="70" width="360" height="66" rx="6" class="boxH"/>
  <text x="240" y="98" text-anchor="middle" class="lbl node mono">volatile Money[] buckets</text>
  <text x="240" y="120" text-anchor="middle" class="lbl sub">field of a client's Wallet</text>

  <!-- reference slot -->
  <text x="80" y="170" class="lbl sub" font-weight="600">REFERENCE SLOT — volatile</text>
  <rect x="80" y="180" width="160" height="70" rx="6" class="boxH"/>
  <text x="160" y="208" text-anchor="middle" class="lbl body">buckets</text>
  <text x="160" y="228" text-anchor="middle" class="lbl sub">reference to array</text>
  <text x="160" y="243" text-anchor="middle" class="lbl sub">object at heap addr</text>

  <!-- array container -->
  <rect x="300" y="180" width="360" height="70" rx="6" class="boxW" fill-opacity="1"/>
  <text x="480" y="208" text-anchor="middle" class="lbl body">Money[4] array object</text>
  <text x="480" y="228" text-anchor="middle" class="lbl sub">four element slots below — each PLAIN</text>
  <text x="480" y="243" text-anchor="middle" class="lbl sub">(not volatile; JLS does not propagate volatile into elements)</text>

  <path class="flow" d="M 240 215 H 300"/>
  <text x="250" y="205" class="lbl tiny">points at</text>

  <!-- bus down to array -->
  <path class="flow" d="M 480 250 V 270"/>

  <!-- fan bus -->
  <path class="flow" d="M 480 250 V 290 H 190"/>
  <path class="flow" d="M 480 290 H 400"/>
  <path class="flow" d="M 480 290 H 590"/>
  <path class="flow" d="M 480 290 H 780"/>

  <!-- element slot 0 -->
  <rect x="90" y="298" width="200" height="86" rx="6" class="boxW"/>
  <text x="190" y="320" text-anchor="middle" class="lbl body mono">buckets[0]</text>
  <text x="190" y="340" text-anchor="middle" class="lbl dense">CLIENT_CASH_AVAILABLE</text>
  <text x="190" y="360" text-anchor="middle" class="lbl sub">plain read/write</text>
  <text x="190" y="376" text-anchor="middle" class="lbl sub">no visibility guarantee</text>

  <!-- element slot 1 -->
  <rect x="300" y="298" width="200" height="86" rx="6" class="boxW"/>
  <text x="400" y="320" text-anchor="middle" class="lbl body mono">buckets[1]</text>
  <text x="400" y="340" text-anchor="middle" class="lbl dense">CLIENT_CASH_RESERVED</text>
  <text x="400" y="360" text-anchor="middle" class="lbl sub">plain read/write</text>
  <text x="400" y="376" text-anchor="middle" class="lbl sub">no visibility guarantee</text>

  <!-- element slot 2 -->
  <rect x="490" y="298" width="200" height="86" rx="6" class="boxW"/>
  <text x="590" y="320" text-anchor="middle" class="lbl body mono">buckets[2]</text>
  <text x="590" y="340" text-anchor="middle" class="lbl dense">CLIENT_BONUS_AVAILABLE</text>
  <text x="590" y="360" text-anchor="middle" class="lbl sub">plain read/write</text>
  <text x="590" y="376" text-anchor="middle" class="lbl sub">no visibility guarantee</text>

  <!-- element slot 3 -->
  <rect x="680" y="298" width="200" height="86" rx="6" class="boxW"/>
  <text x="780" y="320" text-anchor="middle" class="lbl body mono">buckets[3]</text>
  <text x="780" y="340" text-anchor="middle" class="lbl dense">CLIENT_BONUS_RESERVED</text>
  <text x="780" y="360" text-anchor="middle" class="lbl sub">plain read/write</text>
  <text x="780" y="376" text-anchor="middle" class="lbl sub">no visibility guarantee</text>

  <!-- annotation: what volatile actually guards -->
  <rect x="90" y="410" width="440" height="110" rx="6" class="boxA"/>
  <text x="110" y="432" class="lbl body" font-weight="600">What volatile buckets actually guards:</text>
  <text x="110" y="452" class="lbl dense">buckets = new Money[4] (swap-in of a whole new</text>
  <text x="110" y="470" class="lbl dense">array) is immediately visible to every thread.</text>
  <text x="110" y="490" class="lbl dense">A mutation of buckets[i] in place is an ordinary</text>
  <text x="110" y="508" class="lbl dense">write to the array object, not to the field itself.</text>

  <!-- annotation: fixes -->
  <rect x="550" y="410" width="430" height="110" rx="6" class="boxA"/>
  <text x="570" y="432" class="lbl body" font-weight="600">Fixes for per-element visibility:</text>
  <text x="570" y="454" class="lbl body mono">AtomicReferenceArray&lt;Money&gt;</text>
  <text x="570" y="472" class="lbl sub">volatile-style get/set per element</text>
  <text x="570" y="492" class="lbl body mono">VarHandle (array element, acquire/release)</text>
  <text x="570" y="510" class="lbl sub">explicit per-slot memory ordering</text>

  <!-- Legend -->
  <line x1="20" y1="540" x2="1020" y2="540" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="552" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="565" class="lbl tiny">volatile slot — reference swap is visible across threads</text>

  <rect x="470" y="552" width="22" height="16" rx="3" class="boxW"/>
  <text x="500" y="565" class="lbl tiny">plain slot — array container and its four elements, no volatile semantics</text>

  <rect x="20" y="576" width="22" height="16" rx="3" class="boxA"/>
  <text x="50" y="589" class="lbl tiny">annotation panel: prose explanation</text>

  <path class="flow" d="M 470 584 H 510"/>
  <text x="520" y="590" class="lbl tiny">A &#8594; B : A points at / contains B</text>
</svg>
