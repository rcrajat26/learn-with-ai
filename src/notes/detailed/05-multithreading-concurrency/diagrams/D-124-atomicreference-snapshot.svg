<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after: on the left, cashAvailable and bonusAvailable live in two separate
     AtomicLong fields backing the CLIENT_CASH_AVAILABLE and CLIENT_BONUS_AVAILABLE buckets. A
     numbered, time-downward interleaving of settlement-ingest-3 (writer) and balance-view-2
     (reader) shows the writer updating cash to 25.00 before the reader reads it, but updating
     bonus to 6.00 after the reader already read the stale 10.00, so the reader computes a
     stakeable total of 35.00 instead of the correct 31.00. On the right, one immutable
     WalletSnapshot record is held in a single AtomicReference and swapped by one compareAndSet:
     read the current snapshot, build a new WalletSnapshot with one allocation, then CAS it in,
     retrying the whole loop from step 1 if the CAS fails, so every reader always sees one
     consistent cash-and-bonus pair, never a mix.">
  <style>
    .lbl    { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1     { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2     { font-size: 12.5px; font-weight: 700; letter-spacing: .3px; }
    .body   { font-size: 13px; }
    .tiny   { font-size: 11px; }
    .floor  { font-size: 10.5px; fill: #4b5563; }
    .bold   { font-weight: 700; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH   { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD   { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .panel  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .rail   { stroke: #9ca3af; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .flow   { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
    .loop   { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#triA); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">ONE ATOMICREFERENCE TO AN IMMUTABLE SNAPSHOT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <line x1="560" y1="58" x2="560" y2="792" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="280" y="66" text-anchor="middle" class="lbl h2">TWO ATOMICS — TORN READ POSSIBLE</text>
  <text x="840" y="66" text-anchor="middle" class="lbl h2">ONE AtomicReference&lt;WalletSnapshot&gt; — ATOMIC SWAP</text>

  <!-- LEFT: the two independent fields -->
  <rect x="30" y="90" width="220" height="56" rx="6" class="boxP"/>
  <text x="140" y="110" text-anchor="middle" class="lbl body bold">cashAvailable</text>
  <text x="140" y="126" text-anchor="middle" class="lbl floor">CLIENT_CASH_AVAILABLE bucket</text>
  <text x="140" y="140" text-anchor="middle" class="lbl floor">AtomicLong</text>

  <rect x="270" y="90" width="220" height="56" rx="6" class="boxP"/>
  <text x="380" y="110" text-anchor="middle" class="lbl body bold">bonusAvailable</text>
  <text x="380" y="126" text-anchor="middle" class="lbl floor">CLIENT_BONUS_AVAILABLE bucket</text>
  <text x="380" y="140" text-anchor="middle" class="lbl floor">AtomicLong</text>

  <!-- lane headers + rails -->
  <text x="142" y="164" text-anchor="middle" class="lbl tiny bold">settlement-ingest-3 (writer)</text>
  <text x="397" y="164" text-anchor="middle" class="lbl tiny bold">balance-view-2 (reader)</text>
  <line x1="142" y1="170" x2="142" y2="440" class="rail"/>
  <line x1="397" y1="170" x2="397" y2="440" class="rail"/>
  <text x="24" y="300" text-anchor="middle" class="lbl floor" transform="rotate(-90 24 300)">time, downward</text>

  <!-- connector: box1 -> row1 -->
  <path class="flow" d="M140 146 V175"/>
  <!-- connector: box2 -> row4 (routed via gutter corridor) -->
  <path class="flow" d="M380 146 V148 H270 V325 H142 V331"/>

  <!-- interleaving steps -->
  <rect x="30" y="175" width="225" height="40" rx="5" class="boxP"/>
  <text x="142" y="199" text-anchor="middle" class="lbl floor bold">1: cash 40.00 → 25.00</text>

  <rect x="285" y="227" width="225" height="40" rx="5" class="boxP"/>
  <text x="397" y="251" text-anchor="middle" class="lbl floor bold">2: read cash → 25.00 (fresh)</text>

  <rect x="285" y="279" width="225" height="40" rx="5" class="boxD"/>
  <text x="397" y="303" text-anchor="middle" class="lbl floor bold">3: read bonus → 10.00 (stale)</text>

  <rect x="30" y="331" width="225" height="40" rx="5" class="boxP"/>
  <text x="142" y="355" text-anchor="middle" class="lbl floor bold">4: bonus 10.00 → 6.00</text>

  <rect x="285" y="383" width="225" height="46" rx="5" class="boxD"/>
  <text x="397" y="403" text-anchor="middle" class="lbl floor bold">5: stakeable computed</text>
  <text x="397" y="418" text-anchor="middle" class="lbl floor">25.00 + 10.00 = 35.00</text>

  <!-- result panel, left -->
  <rect x="30" y="445" width="480" height="86" rx="6" class="boxD"/>
  <text x="42" y="465" class="lbl h2" fill="#b91c1c">OBSERVED — INCONSISTENT PAIR</text>
  <text x="42" y="484" class="lbl tiny">reader sees stakeable = 35.00 (25.00 + 10.00) — wrong</text>
  <text x="42" y="500" class="lbl tiny">correct post-update value = 25.00 + 6.00 = 31.00</text>
  <text x="42" y="518" class="lbl tiny">two independent atomics, no shared consistency point</text>

  <!-- RIGHT: single AtomicReference -->
  <rect x="700" y="90" width="340" height="56" rx="6" class="boxH"/>
  <text x="870" y="110" text-anchor="middle" class="lbl body bold">walletSnapshotRef</text>
  <text x="870" y="126" text-anchor="middle" class="lbl floor">AtomicReference&lt;WalletSnapshot&gt;</text>
  <text x="870" y="140" text-anchor="middle" class="lbl floor">backs CLIENT_CASH_AVAILABLE + CLIENT_BONUS_AVAILABLE</text>

  <path class="flow" d="M870 146 V170"/>

  <rect x="700" y="170" width="340" height="44" rx="5" class="boxP"/>
  <text x="870" y="188" text-anchor="middle" class="lbl floor bold">1: read current = walletSnapshotRef.get()</text>
  <text x="870" y="204" text-anchor="middle" class="lbl floor">WalletSnapshot(cash=25.00, bonus=10.00)</text>

  <path class="flow" d="M870 214 V230"/>

  <rect x="700" y="230" width="340" height="44" rx="5" class="boxP"/>
  <text x="870" y="248" text-anchor="middle" class="lbl floor bold">2: build next — 1 allocation</text>
  <text x="870" y="264" text-anchor="middle" class="lbl floor">new WalletSnapshot(cash=25.00, bonus=6.00)</text>

  <path class="flow" d="M870 274 V290"/>

  <rect x="700" y="290" width="340" height="44" rx="5" class="boxP"/>
  <text x="870" y="316" text-anchor="middle" class="lbl body bold">3: compareAndSet(current, next)</text>

  <path class="flow" d="M870 334 V349 H782 V364"/>
  <text x="800" y="344" text-anchor="middle" class="lbl floor">succeeds</text>
  <path class="loop" d="M870 334 V349 H957 V364"/>
  <text x="945" y="344" text-anchor="middle" class="lbl floor" fill="#b45309">fails</text>

  <rect x="700" y="364" width="165" height="50" rx="5" class="boxR"/>
  <text x="782" y="382" text-anchor="middle" class="lbl floor bold">4a: CAS succeeds</text>
  <text x="782" y="398" text-anchor="middle" class="lbl floor">snapshot swapped</text>

  <rect x="875" y="364" width="165" height="50" rx="5" class="boxH"/>
  <text x="957" y="382" text-anchor="middle" class="lbl floor bold">4b: CAS fails</text>
  <text x="957" y="398" text-anchor="middle" class="lbl floor">lost the race</text>

  <!-- retry loop, routed via right corridor -->
  <path class="loop" d="M1040 389 H1070 V192 H1040"/>
  <text x="1078" y="280" text-anchor="middle" class="lbl floor bold" fill="#b45309" transform="rotate(-90 1078 280)">retry loop → back to step 1</text>

  <!-- result panel, right -->
  <rect x="700" y="434" width="340" height="70" rx="6" class="panel"/>
  <text x="712" y="454" class="lbl h2" fill="#2563eb">ALWAYS ONE CONSISTENT PAIR</text>
  <text x="712" y="472" class="lbl tiny">readers see either the old (cash,bonus) pair or the</text>
  <text x="712" y="488" class="lbl tiny">new one — a single CAS, never a torn mix</text>

  <!-- legend -->
  <line x1="20" y1="792" x2="1100" y2="792" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="806" width="22" height="16" rx="3" class="boxP"/>
  <text x="52" y="818" class="lbl tiny">field, step, or decision box</text>
  <rect x="270" y="806" width="22" height="16" rx="3" class="boxH"/>
  <text x="302" y="818" class="lbl tiny">the subject field, or a CAS-retry outcome</text>
  <rect x="600" y="806" width="22" height="16" rx="3" class="boxR"/>
  <text x="632" y="818" class="lbl tiny">success / consistent result</text>
  <rect x="850" y="806" width="22" height="16" rx="3" class="boxD"/>
  <text x="882" y="818" class="lbl tiny">wrong / inconsistent observed result</text>

  <rect x="20" y="834" width="22" height="16" rx="3" class="panel"/>
  <text x="52" y="846" class="lbl tiny">annotation panel</text>
  <line x1="270" y1="842" x2="296" y2="842" class="rail"/>
  <text x="302" y="846" class="lbl tiny">thread lane / time axis rail</text>
  <line x1="600" y1="842" x2="626" y2="842" class="flow"/>
  <text x="632" y="846" class="lbl tiny">directional step</text>
  <line x1="850" y1="842" x2="876" y2="842" class="loop"/>
  <text x="882" y="846" class="lbl tiny">CAS retry loop</text>
</svg>
