<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Concurrency is structure, parallelism is execution. Four stake-settlement
     tasks, SettleStake for round R-4471, R-4472, R-4473 and R-4474, each needing 10 ms of
     compute. On one core the OS time-slices the four tasks into sixteen 2.5 ms slices,
     numbered 1 to 16, round robin across the four tasks: concurrent, zero parallelism, total
     wall time 40 ms. On four cores each task runs on its own core for the full 10 ms with no
     slicing: concurrent and parallel, total wall time 10 ms.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .slice { font-size: 10.5px; font-weight: 600; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxL  { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .axis  { stroke: #475569; stroke-width: 1.6; }
    .tick  { stroke: #475569; stroke-width: 1.3; }
    .rule  { stroke: #d1d5db; stroke-width: 1.5; }
    .lead  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">CONCURRENCY IS STRUCTURE, PARALLELISM IS EXECUTION</text>
  <line x1="20" y1="42" x2="1100" y2="42" class="rule"/>

  <!-- PANEL A: single core -->
  <text x="20" y="66" class="lbl h2">SINGLE CORE — CONCURRENT, ZERO PARALLELISM</text>

  <text x="20" y="115" class="lbl body">CORE 0</text>

  <!-- 16 slices, 2.5 ms each, round robin over 4 tasks -->
  <!-- task classes cycle: boxP=R-4471, boxH=R-4472, boxR=R-4473, boxL=R-4474 -->
  <g>
    <rect x="110" y="90" width="55" height="40" class="boxP"/>
    <text x="137" y="114" text-anchor="middle" class="lbl slice">1</text>
    <rect x="165" y="90" width="55" height="40" class="boxH"/>
    <text x="192" y="114" text-anchor="middle" class="lbl slice">2</text>
    <rect x="220" y="90" width="55" height="40" class="boxR"/>
    <text x="247" y="114" text-anchor="middle" class="lbl slice">3</text>
    <rect x="275" y="90" width="55" height="40" class="boxL"/>
    <text x="302" y="114" text-anchor="middle" class="lbl slice">4</text>

    <rect x="330" y="90" width="55" height="40" class="boxP"/>
    <text x="357" y="114" text-anchor="middle" class="lbl slice">5</text>
    <rect x="385" y="90" width="55" height="40" class="boxH"/>
    <text x="412" y="114" text-anchor="middle" class="lbl slice">6</text>
    <rect x="440" y="90" width="55" height="40" class="boxR"/>
    <text x="467" y="114" text-anchor="middle" class="lbl slice">7</text>
    <rect x="495" y="90" width="55" height="40" class="boxL"/>
    <text x="522" y="114" text-anchor="middle" class="lbl slice">8</text>

    <rect x="550" y="90" width="55" height="40" class="boxP"/>
    <text x="577" y="114" text-anchor="middle" class="lbl slice">9</text>
    <rect x="605" y="90" width="55" height="40" class="boxH"/>
    <text x="632" y="114" text-anchor="middle" class="lbl slice">10</text>
    <rect x="660" y="90" width="55" height="40" class="boxR"/>
    <text x="687" y="114" text-anchor="middle" class="lbl slice">11</text>
    <rect x="715" y="90" width="55" height="40" class="boxL"/>
    <text x="742" y="114" text-anchor="middle" class="lbl slice">12</text>

    <rect x="770" y="90" width="55" height="40" class="boxP"/>
    <text x="797" y="114" text-anchor="middle" class="lbl slice">13</text>
    <rect x="825" y="90" width="55" height="40" class="boxH"/>
    <text x="852" y="114" text-anchor="middle" class="lbl slice">14</text>
    <rect x="880" y="90" width="55" height="40" class="boxR"/>
    <text x="907" y="114" text-anchor="middle" class="lbl slice">15</text>
    <rect x="935" y="90" width="55" height="40" class="boxL"/>
    <text x="962" y="114" text-anchor="middle" class="lbl slice">16</text>
  </g>

  <line x1="110" y1="138" x2="990" y2="138" class="axis"/>
  <line x1="110" y1="134" x2="110" y2="142" class="tick"/>
  <line x1="330" y1="134" x2="330" y2="142" class="tick"/>
  <line x1="550" y1="134" x2="550" y2="142" class="tick"/>
  <line x1="770" y1="134" x2="770" y2="142" class="tick"/>
  <line x1="990" y1="134" x2="990" y2="142" class="tick"/>
  <text x="110" y="154" text-anchor="middle" class="lbl sub">0</text>
  <text x="330" y="154" text-anchor="middle" class="lbl sub">10</text>
  <text x="550" y="154" text-anchor="middle" class="lbl sub">20</text>
  <text x="770" y="154" text-anchor="middle" class="lbl sub">30</text>
  <text x="990" y="154" text-anchor="middle" class="lbl sub">40</text>
  <text x="1030" y="154" class="lbl sub">ms</text>

  <path class="lead" d="M 925 172 V 126 H 1004 V 118 H 990"/>
  <rect x="850" y="172" width="150" height="46" rx="6" class="panel"/>
  <text x="925" y="188" text-anchor="middle" class="lbl node">40 ms</text>
  <text x="925" y="204" text-anchor="middle" class="lbl sub">total wall time</text>

  <!-- PANEL B: four cores -->
  <text x="20" y="270" class="lbl h2">FOUR CORES — CONCURRENT AND PARALLEL</text>

  <text x="20" y="378" class="lbl body">CORE 0</text>
  <text x="20" y="428" class="lbl body">CORE 1</text>
  <text x="20" y="478" class="lbl body">CORE 2</text>
  <text x="20" y="528" class="lbl body">CORE 3</text>

  <rect x="110" y="358" width="220" height="36" class="boxP"/>
  <text x="220" y="380" text-anchor="middle" class="lbl node">Settle R-4471</text>

  <rect x="110" y="408" width="220" height="36" class="boxH"/>
  <text x="220" y="430" text-anchor="middle" class="lbl node">Settle R-4472</text>

  <rect x="110" y="458" width="220" height="36" class="boxR"/>
  <text x="220" y="480" text-anchor="middle" class="lbl node">Settle R-4473</text>

  <rect x="110" y="508" width="220" height="36" class="boxL"/>
  <text x="220" y="530" text-anchor="middle" class="lbl node">Settle R-4474</text>

  <line x1="110" y1="558" x2="330" y2="558" class="axis"/>
  <line x1="110" y1="554" x2="110" y2="562" class="tick"/>
  <line x1="330" y1="554" x2="330" y2="562" class="tick"/>
  <text x="110" y="574" text-anchor="middle" class="lbl sub">0</text>
  <text x="330" y="574" text-anchor="middle" class="lbl sub">10</text>
  <text x="365" y="574" class="lbl sub">ms</text>

  <path class="lead" d="M 850 400 H 345 V 376 H 330"/>
  <rect x="700" y="376" width="150" height="46" rx="6" class="panel"/>
  <text x="775" y="392" text-anchor="middle" class="lbl node">10 ms</text>
  <text x="775" y="408" text-anchor="middle" class="lbl sub">total wall time</text>

  <line x1="20" y1="620" x2="1100" y2="620" class="rule"/>
  <text x="20" y="644" class="lbl h2">HOW TO READ THIS</text>
  <text x="20" y="664" class="lbl tiny">Same four tasks, same 10 ms of work each — 40 ms of total work either way.</text>
  <text x="20" y="682" class="lbl tiny">One core interleaves 2.5 ms slices (steps 1–16), so wall time equals the sum of the work: 40 ms.</text>
  <text x="20" y="700" class="lbl tiny">Four cores execute all four simultaneously, so wall time equals the slowest single task: 10 ms.</text>

  <line x1="20" y1="718" x2="1100" y2="718" class="rule"/>
  <rect x="20" y="730" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="743" class="lbl tiny">Settle R-4471</text>
  <rect x="180" y="730" width="22" height="16" rx="3" class="boxH"/>
  <text x="210" y="743" class="lbl tiny">Settle R-4472</text>
  <rect x="340" y="730" width="22" height="16" rx="3" class="boxR"/>
  <text x="370" y="743" class="lbl tiny">Settle R-4473</text>
  <rect x="500" y="730" width="22" height="16" rx="3" class="boxL"/>
  <text x="530" y="743" class="lbl tiny">Settle R-4474</text>
  <path class="lead" d="M 700 738 H 740"/>
  <text x="748" y="743" class="lbl tiny">leader → total wall-time callout</text>
</svg>
