<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Left panel: gateway-http-7's blocking socket read for the card PSP authorise call at
     240 ms p50 is implemented over non-blocking NIO; a sun.nio.ch.Poller thread using epoll or
     kqueue, selected by jdk.pollerMode, unparks the virtual thread when the file descriptor is
     ready, freeing the carrier for the whole 240 ms wait. Right panel: settlement-ingest-3 reading
     a FileChannel on Linux has no io_uring integration, so the read delegates to carrier-blocking
     work and the carrier thread is consumed for the duration of the file read.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">SOCKET I/O GOES THROUGH A POLLER — FILE I/O DOES NOT</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="290" y="66" text-anchor="middle" class="lbl h2">LEFT — CARD PSP AUTHORISE, SOCKET READ (240 ms p50)</text>
  <text x="840" y="66" text-anchor="middle" class="lbl h2">RIGHT — FileChannel READ ON LINUX (no io_uring)</text>
  <line x1="560" y1="54" x2="560" y2="710" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- LEFT PANEL -->
  <rect x="40" y="86" width="220" height="60" rx="6" class="boxH"/>
  <text x="150" y="109" text-anchor="middle" class="lbl node">gateway-http-7</text>
  <text x="150" y="126" text-anchor="middle" class="lbl sub">VirtualThread calling</text>
  <text x="150" y="140" text-anchor="middle" class="lbl sub">SocketChannel.read()</text>

  <path class="flow" d="M 150 146 V 176"/>
  <text x="160" y="170" class="lbl sub">non-blocking NIO read, WOULD_BLOCK</text>

  <rect x="40" y="176" width="220" height="56" rx="6" class="boxP"/>
  <text x="150" y="199" text-anchor="middle" class="lbl node">non-blocking fd</text>
  <text x="150" y="216" text-anchor="middle" class="lbl sub">registered for read-ready</text>
  <text x="150" y="229" text-anchor="middle" class="lbl sub">event, then park()</text>

  <path class="flow" d="M 260 204 H 340"/>
  <text x="300" y="196" text-anchor="middle" class="lbl sub">register</text>

  <rect x="340" y="176" width="230" height="74" rx="6" class="boxR"/>
  <text x="455" y="196" text-anchor="middle" class="lbl node">sun.nio.ch.Poller</text>
  <text x="455" y="212" text-anchor="middle" class="lbl sub">epoll (Linux) / kqueue (macOS)</text>
  <text x="455" y="226" text-anchor="middle" class="lbl sub">jdk.pollerMode = 1</text>
  <text x="455" y="240" text-anchor="middle" class="lbl sub">(dedicated poller thread)</text>

  <path class="flow" d="M 150 232 V 300"/>
  <text x="30" y="270" class="lbl sub" transform="rotate(-90 30 270)">carrier freed</text>

  <rect x="40" y="300" width="220" height="70" rx="6" class="boxA"/>
  <text x="150" y="322" text-anchor="middle" class="lbl node">carrier thread</text>
  <text x="150" y="340" text-anchor="middle" class="lbl sub">runs other virtual threads</text>
  <text x="150" y="356" text-anchor="middle" class="lbl sub">for the full 240 ms p50</text>
  <text x="150" y="368" text-anchor="middle" class="lbl sub">wait, e.g. settlement-ingest-3</text>

  <path class="flow" d="M 455 250 V 410 H 260"/>
  <text x="330" y="404" class="lbl sub">fd ready → unpark(gateway-http-7)</text>

  <rect x="40" y="410" width="220" height="60" rx="6" class="boxH"/>
  <text x="150" y="433" text-anchor="middle" class="lbl node">gateway-http-7</text>
  <text x="150" y="450" text-anchor="middle" class="lbl sub">re-queued RUNNABLE, remounts</text>
  <text x="150" y="464" text-anchor="middle" class="lbl sub">and reads the PSP response</text>

  <!-- left annotation panel -->
  <rect x="40" y="500" width="500" height="150" rx="6" class="boxA"/>
  <text x="58" y="522" class="lbl body" style="font-weight:700">Why the socket path scales</text>
  <text x="58" y="544" class="lbl tiny">SocketChannel is wired to the virtual-thread scheduler:</text>
  <text x="58" y="560" class="lbl tiny">a would-block read hands the fd to sun.nio.ch.Poller</text>
  <text x="58" y="576" class="lbl tiny">and parks — the carrier is free for the whole 240 ms</text>
  <text x="58" y="592" class="lbl tiny">p50 authorise latency (p99 11s)</text>
  <text x="58" y="614" class="lbl tiny">jdk.pollerMode selects the poller strategy: 0 = shared</text>
  <text x="58" y="630" class="lbl tiny">poller reused across reads, 1 = one poller per carrier;</text>
  <text x="58" y="646" class="lbl tiny">both still one thread serving epoll/kqueue events</text>

  <!-- RIGHT PANEL -->
  <rect x="600" y="86" width="220" height="60" rx="6" class="boxH"/>
  <text x="710" y="109" text-anchor="middle" class="lbl node">settlement-ingest-3</text>
  <text x="710" y="126" text-anchor="middle" class="lbl sub">VirtualThread calling</text>
  <text x="710" y="140" text-anchor="middle" class="lbl sub">FileChannel.read()</text>

  <path class="flow" d="M 710 146 V 176"/>
  <text x="726" y="170" class="lbl sub">no non-blocking file fd path exists</text>

  <rect x="600" y="176" width="220" height="56" rx="6" class="boxD"/>
  <text x="710" y="199" text-anchor="middle" class="lbl node">no io_uring integration</text>
  <text x="710" y="216" text-anchor="middle" class="lbl sub">on this JDK/Linux combination —</text>
  <text x="710" y="229" text-anchor="middle" class="lbl sub">read delegates to a blocking call</text>

  <path class="flow" d="M 710 232 V 300"/>
  <text x="726" y="270" class="lbl sub">runs on ForkJoinPool's</text>
  <text x="726" y="284" class="lbl sub">unbounded auxiliary pool</text>

  <rect x="600" y="300" width="220" height="70" rx="6" class="boxD"/>
  <text x="710" y="322" text-anchor="middle" class="lbl node">carrier thread</text>
  <text x="710" y="340" text-anchor="middle" class="lbl sub">blocked for the whole disk</text>
  <text x="710" y="356" text-anchor="middle" class="lbl sub">read — cannot run any other</text>
  <text x="710" y="368" text-anchor="middle" class="lbl sub">virtual thread meanwhile</text>

  <path class="flow" d="M 710 370 V 410"/>

  <rect x="600" y="410" width="220" height="60" rx="6" class="boxH"/>
  <text x="710" y="433" text-anchor="middle" class="lbl node">settlement-ingest-3</text>
  <text x="710" y="450" text-anchor="middle" class="lbl sub">resumes on the same carrier</text>
  <text x="710" y="464" text-anchor="middle" class="lbl sub">once the read returns</text>

  <!-- right annotation panel -->
  <rect x="580" y="500" width="500" height="150" rx="6" class="boxA"/>
  <text x="598" y="522" class="lbl body" style="font-weight:700">Why the file path does not scale the same way</text>
  <text x="598" y="544" class="lbl tiny">FileChannel has no equivalent of a non-blocking fd</text>
  <text x="598" y="560" class="lbl tiny">registered with a poller; the JDK has not wired file</text>
  <text x="598" y="576" class="lbl tiny">reads through io_uring, so the call falls back to a</text>
  <text x="598" y="592" class="lbl tiny">plain blocking read on the carrier-blocking work pool</text>
  <text x="598" y="614" class="lbl tiny">Result: one carrier is consumed per in-flight file</text>
  <text x="598" y="630" class="lbl tiny">read, exactly like a platform-thread blocking read —</text>
  <text x="598" y="646" class="lbl tiny">jdk.pollerMode has no effect here, it governs sockets</text>

  <!-- legend -->
  <line x1="20" y1="680" x2="1100" y2="680" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="696" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="709" class="lbl tiny">virtual thread</text>
  <rect x="180" y="696" width="22" height="16" rx="3" class="boxP"/>
  <text x="210" y="709" class="lbl tiny">non-blocking registration step</text>
  <rect x="440" y="696" width="22" height="16" rx="3" class="boxR"/>
  <text x="470" y="709" class="lbl tiny">poller thread (carrier freed)</text>
  <rect x="700" y="696" width="22" height="16" rx="3" class="boxD"/>
  <text x="730" y="709" class="lbl tiny">carrier consumed / no non-blocking path</text>
  <rect x="20" y="720" width="22" height="16" rx="3" class="boxA"/>
  <text x="50" y="733" class="lbl tiny">annotation panel</text>

  <path class="flow" d="M 180 728 H 216"/>
  <text x="224" y="733" class="lbl tiny">A → B : control / scheduling flow</text>
</svg>
