<svg viewBox="0 0 1180 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The VirtualThread internal state machine for a card PSP authorise task on
     gateway-http-7. Internal states NEW, STARTED, RUNNING, PARKING, PARKED, PINNED, YIELDING and
     TERMINATED, plus a SUSPENDED bit, connected by transitions start, mount, park, yield, unpark,
     pinning and completion. A reference table maps each internal state to the Thread.State a
     caller sees via getState, with a note that the internal state names appear only in the jcmd
     Thread.dump_to_file JSON, never in the public API.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; fill: #1f2937; }
    .node  { font-size: 14px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .adap  { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#triA); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE VirtualThread INTERNAL STATE MACHINE — authorisePsp() TASK</text>
  <line x1="20" y1="42" x2="1160" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="400" y="64" text-anchor="middle" class="lbl h2">INTERNAL STATES — gateway-http-7's VirtualThread</text>
  <text x="1005" y="64" text-anchor="middle" class="lbl h2">Thread.State SEEN VIA getState()</text>
  <line x1="820" y1="52" x2="820" y2="800" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- Spine: NEW -> STARTED -> RUNNING -> TERMINATED -->
  <rect x="40" y="90" width="170" height="50" rx="6" class="boxW"/>
  <text x="125" y="112" text-anchor="middle" class="lbl node">NEW</text>
  <text x="125" y="130" text-anchor="middle" class="lbl sub">Thread built, not started</text>

  <path class="flow" d="M 125 140 V 170"/>
  <text x="135" y="158" class="lbl sub">start()</text>

  <rect x="40" y="170" width="170" height="50" rx="6" class="boxP"/>
  <text x="125" y="192" text-anchor="middle" class="lbl node">STARTED</text>
  <text x="125" y="210" text-anchor="middle" class="lbl sub">submitted to the scheduler</text>

  <path class="flow" d="M 125 220 V 250"/>
  <text x="135" y="238" class="lbl sub">mount on carrier</text>

  <rect x="40" y="250" width="170" height="60" rx="6" class="boxH"/>
  <text x="125" y="273" text-anchor="middle" class="lbl node">RUNNING</text>
  <text x="125" y="291" text-anchor="middle" class="lbl sub">on gateway-http-7 carrier,</text>
  <text x="125" y="304" text-anchor="middle" class="lbl sub">calling PSP authorise</text>

  <!-- completion, distinct exit x=100 -->
  <path class="flow" d="M 100 310 V 650"/>
  <text x="116" y="484" class="lbl sub" transform="rotate(-90 116 484)">completion</text>

  <rect x="40" y="650" width="170" height="50" rx="6" class="boxR"/>
  <text x="125" y="672" text-anchor="middle" class="lbl node">TERMINATED</text>
  <text x="125" y="690" text-anchor="middle" class="lbl sub">authorisePsp() returned</text>

  <!-- Fan-out bus: exit x=150, distinct from completion's x=100 -->
  <path class="flow" d="M 150 310 V 340 H 350 V 360"/>
  <path class="flow" d="M 350 360 H 710"/>
  <path class="flow" d="M 350 360 V 400"/>
  <path class="flow" d="M 530 360 V 400"/>
  <path class="adap" d="M 710 360 V 400"/>
  <text x="270" y="386" class="lbl sub">park()</text>
  <text x="450" y="386" class="lbl sub">yield()</text>
  <text x="740" y="386" class="lbl sub">sync/native held</text>

  <!-- Row: PARKING, YIELDING, PINNED -->
  <rect x="280" y="400" width="140" height="60" rx="6" class="boxW"/>
  <text x="350" y="423" text-anchor="middle" class="lbl node">PARKING</text>
  <text x="350" y="441" text-anchor="middle" class="lbl sub">unmount in</text>
  <text x="350" y="453" text-anchor="middle" class="lbl sub">progress</text>

  <rect x="460" y="400" width="140" height="60" rx="6" class="boxW"/>
  <text x="530" y="423" text-anchor="middle" class="lbl node">YIELDING</text>
  <text x="530" y="441" text-anchor="middle" class="lbl sub">cooperative</text>
  <text x="530" y="453" text-anchor="middle" class="lbl sub">unmount</text>

  <rect x="640" y="400" width="140" height="60" rx="6" class="boxD"/>
  <text x="710" y="423" text-anchor="middle" class="lbl node">PINNED</text>
  <text x="710" y="441" text-anchor="middle" class="lbl sub">carrier held —</text>
  <text x="710" y="453" text-anchor="middle" class="lbl sub">monitor/native frame</text>

  <!-- PARKING -> PARKED -->
  <path class="flow" d="M 350 460 V 490"/>
  <text x="360" y="480" class="lbl sub">continuation.yield ok</text>

  <rect x="280" y="490" width="140" height="52" rx="6" class="boxA"/>
  <text x="350" y="512" text-anchor="middle" class="lbl node">PARKED</text>
  <text x="350" y="530" text-anchor="middle" class="lbl sub">carrier freed, waiting on I/O</text>

  <!-- PINNED -> RUNNING return, exit x=680 distinct from drop x=710; crosses the bus once -->
  <path class="adap" d="M 680 400 V 300 H 210"/>
  <text x="596" y="330" class="lbl sub">monitor release</text>
  <text x="596" y="344" class="lbl sub">resumes RUNNING</text>

  <!-- PARKED -> STARTED via unpark, trunk at x=20 -->
  <path class="flow" d="M 350 542 V 720 H 20 V 190 H 40"/>
  <text x="48" y="600" class="lbl sub" transform="rotate(-90 48 600)">unpark() by sun.nio.ch.Poller</text>

  <!-- YIELDING -> STARTED re-enqueue, trunk at x=30, distinct from x=20 -->
  <path class="flow" d="M 530 460 V 680 H 30 V 200 H 40"/>
  <text x="64" y="600" class="lbl sub" transform="rotate(-90 64 600)">re-enqueue as STARTED</text>

  <!-- SUSPENDED bit annotation -->
  <rect x="460" y="560" width="320" height="90" rx="6" class="boxA"/>
  <text x="478" y="582" class="lbl body" style="font-weight:700">SUSPENDED bit (orthogonal to the state above)</text>
  <text x="478" y="604" class="lbl tiny">Set while the continuation is being frozen or thawed;</text>
  <text x="478" y="620" class="lbl tiny">guards against a racing unpark during that window</text>
  <text x="478" y="638" class="lbl tiny">Not a state of its own — a flag checked alongside it</text>

  <!-- RIGHT: mapping table -->
  <rect x="850" y="90" width="310" height="270" rx="6" class="boxP"/>
  <text x="866" y="112" class="lbl body" style="font-weight:700">INTERNAL STATE → Thread.State</text>
  <line x1="866" y1="122" x2="1144" y2="122" stroke="#2563eb" stroke-width="1"/>
  <text x="866" y="145" class="lbl tiny">NEW → Thread.State.NEW</text>
  <text x="866" y="171" class="lbl tiny">STARTED → Thread.State.RUNNABLE</text>
  <text x="866" y="197" class="lbl tiny">RUNNING → Thread.State.RUNNABLE</text>
  <text x="866" y="223" class="lbl tiny">PARKING → Thread.State.RUNNABLE</text>
  <text x="866" y="249" class="lbl tiny">YIELDING → Thread.State.RUNNABLE</text>
  <text x="866" y="275" class="lbl tiny">PARKED → Thread.State.WAITING /</text>
  <text x="880" y="291" class="lbl tiny">Thread.State.TIMED_WAITING</text>
  <text x="866" y="317" class="lbl tiny">PINNED → Thread.State.RUNNABLE</text>
  <text x="866" y="343" class="lbl tiny">TERMINATED → Thread.State.TERMINATED</text>

  <!-- annotation about JSON -->
  <rect x="850" y="380" width="310" height="150" rx="6" class="boxA"/>
  <text x="868" y="402" class="lbl body" style="font-weight:700">Where the internal names surface</text>
  <text x="868" y="424" class="lbl tiny">PARKING, PARKED, PINNED, YIELDING,</text>
  <text x="868" y="440" class="lbl tiny">STARTED and SUSPENDED are JDK-internal;</text>
  <text x="868" y="456" class="lbl tiny">getState() never returns them</text>
  <text x="868" y="478" class="lbl tiny">They appear only in the jcmd</text>
  <text x="868" y="494" class="lbl tiny">Thread.dump_to_file JSON, under each</text>
  <text x="868" y="510" class="lbl tiny">virtual thread's "state" field</text>

  <text x="850" y="556" class="lbl tiny" style="fill:#4b5563">Note: PARKED resolves to TIMED_WAITING</text>
  <text x="850" y="572" class="lbl tiny" style="fill:#4b5563">when the park carries a deadline (e.g.</text>
  <text x="850" y="588" class="lbl tiny" style="fill:#4b5563">a bounded PSP wait).</text>

  <!-- legend -->
  <line x1="20" y1="810" x2="1160" y2="810" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="826" width="22" height="16" rx="3" class="boxW"/>
  <text x="50" y="839" class="lbl tiny">transitional internal state</text>
  <rect x="230" y="826" width="22" height="16" rx="3" class="boxP"/>
  <text x="260" y="839" class="lbl tiny">scheduler-queued state</text>
  <rect x="430" y="826" width="22" height="16" rx="3" class="boxH"/>
  <text x="460" y="839" class="lbl tiny">running on carrier</text>
  <rect x="610" y="826" width="22" height="16" rx="3" class="boxA"/>
  <text x="640" y="839" class="lbl tiny">off-carrier / annotation / table</text>
  <rect x="850" y="826" width="22" height="16" rx="3" class="boxD"/>
  <text x="880" y="839" class="lbl tiny">pinned — carrier not freed</text>
  <rect x="1050" y="826" width="22" height="16" rx="3" class="boxR"/>
  <text x="1080" y="839" class="lbl tiny">terminal state</text>

  <path class="flow" d="M 20 858 H 56"/>
  <text x="64" y="863" class="lbl tiny">A → B : internal-state transition</text>
  <path class="adap" d="M 340 858 H 376"/>
  <text x="384" y="863" class="lbl tiny">A → B : pinning-related transition</text>

  <text x="20" y="884" class="lbl tiny" style="fill:#4b5563">One unavoidable crossing: the PINNED → RUNNING return crosses the park/yield/pin fan-out bus once, at (680, 360).</text>
</svg>
