<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The one unavoidable CAS in a work-stealing deque. Frame 1: top minus base greater
     than 1, worker ledger-reconcile-1 pops at top with a plain store while thief
     ledger-reconcile-3 polls at base with a CAS; the two indices are different slots so there is
     no conflict. Frame 2: top minus base equals 1, both the owner and the thief target the same
     slot holding the last LedgerEntry chunk. Frame 3: the CAS on base resolves it — the owner
     wins here, the thief's compareAndSet fails and it retries against a different victim deque.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .tinyB { font-size: 11px; font-weight: 700; }
    .tiny  { font-size: 11px; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 11px; fill: #4b5563; }

    .slot     { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .slotFree { fill: #f5f5f4; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 3 2; }
    .slotHot  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.8; }
    .slotWin  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.8; }
    .frame    { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; }
    .flow     { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri); }
    .flowCas  { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#triR); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>
  <text x="20" y="30" class="lbl h1">THE ONE UNAVOIDABLE CAS IN A WORK-STEALING DEQUE</text>
  <line x1="20" y1="40" x2="1020" y2="40" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <rect x="20" y="56" width="1000" height="190" rx="8" class="frame"/>
  <text x="40" y="80" class="lbl h2">FRAME 1 — top − base &gt; 1: no conflict possible</text>
  <text x="40" y="98" class="lbl sub">ledger-reconcile-1 (owner) pops at top with a plain store · ledger-reconcile-3 (thief) polls at base with a CAS</text>

  <!-- array -->
  <g transform="translate(100,120)">
    <rect x="0"   y="0" width="70" height="46" class="slotFree"/>
    <rect x="70"  y="0" width="70" height="46" class="slot"/>
    <rect x="140" y="0" width="70" height="46" class="slot"/>
    <rect x="210" y="0" width="70" height="46" class="slot"/>
    <rect x="280" y="0" width="70" height="46" class="slot"/>
    <rect x="350" y="0" width="70" height="46" class="slotFree"/>
    <text x="105" y="28" text-anchor="middle" class="lbl tiny">chunk[0]</text>
    <text x="175" y="28" text-anchor="middle" class="lbl tiny">chunk[1]</text>
    <text x="245" y="28" text-anchor="middle" class="lbl tiny">chunk[2]</text>
    <text x="315" y="28" text-anchor="middle" class="lbl tiny">chunk[3]</text>
    <text x="70"  y="-10" class="lbl tinyB" text-anchor="middle">base = 1</text>
    <text x="315" y="-10" class="lbl tinyB" text-anchor="middle">top = 4</text>
    <path class="flow" d="M 105 46 V 80" />
    <path class="flowCas" d="M 105 46 V 80" transform="translate(-35,0)"/>
  </g>
  <text x="130" y="228" class="lbl body">ledger-reconcile-3 steal(): reads base=1, CAS(1→2), returns chunk[1]</text>
  <text x="560" y="228" class="lbl body">ledger-reconcile-1 popTop(): t = top−1 = 3 &gt; base — plain read, no CAS, returns chunk[3]</text>

  <!-- FRAME 2 -->
  <rect x="20" y="262" width="1000" height="190" rx="8" class="frame"/>
  <text x="40" y="286" class="lbl h2">FRAME 2 — top − base = 1: both target the same slot</text>
  <text x="40" y="304" class="lbl sub">only chunk[3] remains · owner's popTop and a thief's steal both compute the same index</text>

  <g transform="translate(100,326)">
    <rect x="0"   y="0" width="70" height="46" class="slotFree"/>
    <rect x="70"  y="0" width="70" height="46" class="slotFree"/>
    <rect x="140" y="0" width="70" height="46" class="slotFree"/>
    <rect x="210" y="0" width="70" height="46" class="slotHot"/>
    <text x="245" y="28" text-anchor="middle" class="lbl tinyB">chunk[3]</text>
    <text x="245" y="-10" class="lbl tinyB" text-anchor="middle">base = top − 1 = 3</text>
  </g>
  <text x="130" y="434" class="lbl body">ledger-reconcile-1 popTop(): t = 3, reads base = 3 → same slot as any thief's steal()</text>
  <text x="130" y="452" class="lbl body">ledger-reconcile-3 steal(): reads base = 3, about to CAS(3→4) on the identical slot</text>

  <!-- FRAME 3 -->
  <rect x="20" y="468" width="1000" height="270" rx="8" class="frame"/>
  <text x="40" y="492" class="lbl h2">FRAME 3 — the CAS resolves it</text>

  <g transform="translate(130,516)">
    <rect x="0" y="0" width="330" height="200" rx="6" class="slotWin"/>
    <text x="165" y="26" text-anchor="middle" class="lbl h2">owner wins</text>
    <text x="20" y="54" class="lbl body">base.compareAndSet(3, 4)</text>
    <text x="20" y="76" class="lbl body">→ returns true</text>
    <text x="20" y="100" class="lbl body">popTop() returns chunk[3]</text>
    <text x="20" y="130" class="lbl sub">top is reset to base + 1 = 4</text>
    <text x="20" y="150" class="lbl sub">regardless of who won</text>
    <text x="20" y="178" class="lbl sub">ledger-reconcile-1 reconciles</text>
    <text x="20" y="196" class="lbl sub">chunk[3] itself</text>
  </g>

  <g transform="translate(580,516)">
    <rect x="0" y="0" width="330" height="200" rx="6" class="slotHot"/>
    <text x="165" y="26" text-anchor="middle" class="lbl h2">thief loses</text>
    <text x="20" y="54" class="lbl body">base.compareAndSet(3, 4)</text>
    <text x="20" y="76" class="lbl body">→ returns false</text>
    <text x="20" y="100" class="lbl body">steal() returns null</text>
    <text x="20" y="130" class="lbl sub">no exception, no retry loop</text>
    <text x="20" y="150" class="lbl sub">inside the deque itself</text>
    <text x="20" y="178" class="lbl sub">ledger-reconcile-3 picks a new</text>
    <text x="20" y="196" class="lbl sub">random victim deque instead</text>
  </g>

  <path class="flowCas" d="M 460 590 H 580" />
  <text x="470" y="580" class="lbl sub">one CAS, one winner</text>
</svg>
