<svg viewBox="0 0 1040 850" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flowchart of the StampedLock optimistic-read protocol over a cached LimitSet of
     dailyDeposit, maxStake and monthlyLoss. Step 1: stamp = lock.tryOptimisticRead(), acquiring no
     lock. Step 2: read dailyDeposit, maxStake and monthlyLoss into local variables while a writer
     may be mid-update. Step 3: lock.validate(stamp); if true, return the LimitSet built from those
     locals as the fast path with zero locks acquired. If false, fall back: acquire a blocking
     stamp = lock.readLock(), re-read all three fields under that full read lock, call
     lock.unlockRead(stamp), and return the validated LimitSet. A side panel shows an inconsistent
     snapshot a reader can observe before validate fails, where dailyDeposit and maxStake are equal
     due to a torn read, and demonstrates that computing int slot = monthlyLoss / (maxStake -
     dailyDeposit) inside the optimistic body throws ArithmeticException before validate ever runs
     — the lesson being not to dereference, index, or divide inside the optimistic body.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; }
    .body  { font-size: 13px; }
    .code  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }

    .boxP { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxG { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxH { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .boxR { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="850" fill="#ffffff"/>

  <text x="30" y="32" class="lbl h1">StampedLock OPTIMISTIC-READ PROTOCOL — cached LimitSet(dailyDeposit, maxStake, monthlyLoss)</text>
  <line x1="30" y1="42" x2="1010" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: main flow -->
  <rect x="180" y="60" width="300" height="50" rx="6" class="boxP"/>
  <text x="330" y="90" text-anchor="middle" class="lbl code">long stamp = lock.tryOptimisticRead();</text>

  <path class="flow" d="M 330 110 V 150"/>

  <rect x="140" y="150" width="380" height="64" rx="6" class="boxW"/>
  <text x="330" y="174" text-anchor="middle" class="lbl code">read dailyDeposit, maxStake, monthlyLoss</text>
  <text x="330" y="194" text-anchor="middle" class="lbl sub">into locals — no lock held, writer may be mid-update</text>

  <path class="flow" d="M 330 214 V 250"/>

  <polygon points="330,250 470,320 330,390 190,320" class="boxP"/>
  <text x="330" y="316" text-anchor="middle" class="lbl body">lock.validate</text>
  <text x="330" y="332" text-anchor="middle" class="lbl body">(stamp)?</text>

  <text x="365" y="410" class="lbl tiny" font-weight="700">true</text>
  <path class="flow" d="M 350 390 V 430"/>

  <rect x="200" y="430" width="300" height="70" rx="6" class="boxG"/>
  <text x="350" y="454" text-anchor="middle" class="lbl code">return new LimitSet(200, 250, 1000)</text>
  <text x="350" y="472" text-anchor="middle" class="lbl sub">fast path — zero locks acquired,</text>
  <text x="350" y="486" text-anchor="middle" class="lbl sub">no writer was ever blocked</text>

  <text x="95" y="345" class="lbl tiny" font-weight="700">false</text>
  <path class="flow" d="M 190 320 H 105 V 460"/>

  <rect x="20" y="460" width="170" height="54" rx="6" class="boxH"/>
  <text x="105" y="482" text-anchor="middle" class="lbl code" font-size="10.5">stamp = lock.readLock();</text>
  <text x="105" y="500" text-anchor="middle" class="lbl sub">now blocks writers</text>

  <path class="flow" d="M 105 514 V 540"/>

  <rect x="20" y="540" width="170" height="78" rx="6" class="boxP"/>
  <text x="105" y="560" text-anchor="middle" class="lbl sub">re-read dailyDeposit,</text>
  <text x="105" y="574" text-anchor="middle" class="lbl sub">maxStake, monthlyLoss</text>
  <text x="105" y="588" text-anchor="middle" class="lbl sub">under full read lock</text>

  <path class="flow" d="M 105 618 V 644"/>

  <rect x="20" y="644" width="170" height="44" rx="6" class="boxW"/>
  <text x="105" y="670" text-anchor="middle" class="lbl code" font-size="10.5">lock.unlockRead(stamp);</text>

  <path class="flow" d="M 105 688 V 714"/>

  <rect x="20" y="714" width="170" height="54" rx="6" class="boxG"/>
  <text x="105" y="736" text-anchor="middle" class="lbl sub">return LimitSet(...)</text>
  <text x="105" y="752" text-anchor="middle" class="lbl sub">validated, consistent</text>

  <!-- RIGHT: side panel -->
  <text x="560" y="66" class="lbl h2">OPTIMISTIC-READ HAZARD</text>
  <path class="flow" d="M 520 182 H 545 V 130 H 560"/>

  <rect x="560" y="90" width="450" height="100" rx="6" class="boxW"/>
  <text x="574" y="108" class="lbl tiny" font-weight="700">INCONSISTENT SNAPSHOT OBSERVED BEFORE validate() FAILS</text>
  <text x="574" y="128" class="lbl tiny">writer limit-update-2 mid-write when read into locals:</text>
  <text x="574" y="146" class="lbl code">dailyDeposit = 200 (old, unchanged)</text>
  <text x="574" y="162" class="lbl code">maxStake     = 200 (torn: 250 to 500 mid-flight)</text>
  <text x="574" y="178" class="lbl code">monthlyLoss  = 1000 (old, unchanged)</text>

  <path class="flow" d="M 785 190 V 210"/>

  <rect x="560" y="210" width="450" height="90" rx="6" class="boxR"/>
  <text x="574" y="228" class="lbl tiny" font-weight="700">DO NOT DEREFERENCE, INDEX, OR DIVIDE INSIDE THE OPTIMISTIC BODY</text>
  <text x="574" y="252" class="lbl code">int slot = monthlyLoss / (maxStake - dailyDeposit);</text>
  <text x="574" y="270" class="lbl sub">maxStake - dailyDeposit == 0 with the snapshot above</text>
  <text x="574" y="286" class="lbl sub">evaluated before lock.validate(stamp) is even reached</text>

  <path class="flow" d="M 785 300 V 320"/>

  <rect x="560" y="320" width="450" height="70" rx="6" class="boxR"/>
  <text x="574" y="342" class="lbl tiny" font-weight="700">ArithmeticException: / by zero</text>
  <text x="574" y="360" class="lbl tiny">thrown before validate(stamp) runs — the torn read is</text>
  <text x="574" y="376" class="lbl tiny">never caught, because the exception fires first</text>

  <!-- legend -->
  <line x1="30" y1="782" x2="1010" y2="782" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="30" y="792" width="18" height="14" rx="3" class="boxP"/>
  <text x="54" y="804" class="lbl tiny">lock call / blocking read step</text>
  <rect x="330" y="792" width="18" height="14" rx="3" class="boxW"/>
  <text x="354" y="804" class="lbl tiny">tentative or unvalidated local state</text>
  <rect x="680" y="792" width="18" height="14" rx="3" class="boxH"/>
  <text x="704" y="804" class="lbl tiny">fallback path on validate()==false</text>
  <rect x="30" y="812" width="18" height="14" rx="3" class="boxG"/>
  <text x="54" y="824" class="lbl tiny">safe, validated return</text>
  <rect x="330" y="812" width="18" height="14" rx="3" class="boxR"/>
  <text x="354" y="824" class="lbl tiny">hazard / thrown exception</text>
</svg>
