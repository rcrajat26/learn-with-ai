<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="DelayedWorkQueue is a binary min-heap of ScheduledFutureTask objects ordered by
     remaining delay, keyed to the bonus-expiry sweep. Seven tasks, indices 0 through 6, each
     stores its own heapIndex field, updated on every siftUp or siftDown swap, so remove(task)
     seeks heap[task.heapIndex] directly in O(log n) instead of scanning in O(n). Below the heap,
     one leader thread, bonus-sweep-1, does a timed wait (awaitNanos) on the head task's delay of
     00:12:04, while follower threads bonus-sweep-2 and bonus-sweep-3 wait indefinitely on the
     same condition with no timeout, waking only when signalled after the leader dequeues and a
     new leader is elected. This avoids a thundering herd of timed waits.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #4b5563; }
    .node  { font-size: 13.5px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .ann   { font-size: 11px; }
    .annh  { font-size: 12.5px; font-weight: 700; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .heapE  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri475); }
    .leadE  { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3; stroke-linejoin: round; marker-end: url(#tri-b453); }
    .follE  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; stroke-linejoin: round; marker-end: url(#tri9ca); }
  </style>
  <defs>
    <marker id="tri475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="tri-b453" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="tri9ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="900" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">DELAYEDWORKQUEUE — BINARY HEAP AND THE LEADER THREAD</text>
  <line x1="20" y1="42" x2="1080" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="62" class="lbl h2">BINARY MIN-HEAP — DelayedWorkQueue.queue[], ordered by bonus-expiry delay</text>

  <!-- root idx0 -->
  <rect x="425" y="70" width="190" height="80" rx="6" class="boxH"/>
  <text x="520" y="88" text-anchor="middle" class="lbl node">head — BONUS-88231</text>
  <text x="520" y="105" text-anchor="middle" class="lbl body">heapIndex = 0</text>
  <text x="520" y="121" text-anchor="middle" class="lbl body">delay = 00:12:04</text>
  <text x="520" y="137" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <!-- level 1 -->
  <rect x="185" y="180" width="190" height="80" rx="6" class="boxP"/>
  <text x="280" y="198" text-anchor="middle" class="lbl node">BONUS-88240 sweep</text>
  <text x="280" y="215" text-anchor="middle" class="lbl body">heapIndex = 1</text>
  <text x="280" y="231" text-anchor="middle" class="lbl body">delay = 01:40:00</text>
  <text x="280" y="247" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <rect x="665" y="180" width="190" height="80" rx="6" class="boxP"/>
  <text x="760" y="198" text-anchor="middle" class="lbl node">BONUS-88255 sweep</text>
  <text x="760" y="215" text-anchor="middle" class="lbl body">heapIndex = 2</text>
  <text x="760" y="231" text-anchor="middle" class="lbl body">delay = 03:05:00</text>
  <text x="760" y="247" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <!-- level 2 -->
  <rect x="55" y="290" width="210" height="80" rx="6" class="boxP"/>
  <text x="160" y="308" text-anchor="middle" class="lbl node">BONUS-88261 sweep</text>
  <text x="160" y="325" text-anchor="middle" class="lbl body">heapIndex = 3</text>
  <text x="160" y="341" text-anchor="middle" class="lbl body">delay = 05:00:00</text>
  <text x="160" y="357" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <rect x="295" y="290" width="210" height="80" rx="6" class="boxP"/>
  <text x="400" y="308" text-anchor="middle" class="lbl node">BONUS-88270 sweep</text>
  <text x="400" y="325" text-anchor="middle" class="lbl body">heapIndex = 4</text>
  <text x="400" y="341" text-anchor="middle" class="lbl body">delay = 06:20:00</text>
  <text x="400" y="357" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <rect x="535" y="290" width="210" height="80" rx="6" class="boxP"/>
  <text x="640" y="308" text-anchor="middle" class="lbl node">BONUS-88283 sweep</text>
  <text x="640" y="325" text-anchor="middle" class="lbl body">heapIndex = 5</text>
  <text x="640" y="341" text-anchor="middle" class="lbl body">delay = 09:10:00</text>
  <text x="640" y="357" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <rect x="775" y="290" width="210" height="80" rx="6" class="boxP"/>
  <text x="880" y="308" text-anchor="middle" class="lbl node">BONUS-88296 sweep</text>
  <text x="880" y="325" text-anchor="middle" class="lbl body">heapIndex = 6</text>
  <text x="880" y="341" text-anchor="middle" class="lbl body">delay = 11:45:00</text>
  <text x="880" y="357" text-anchor="middle" class="lbl sub">ScheduledFutureTask</text>

  <!-- heap edges: root -> row1 via bus -->
  <path class="heapE" d="M 520 150 V 165 H 280 V 180"/>
  <path class="heapE" d="M 520 150 V 165 H 760 V 180"/>
  <!-- row1 idx1 -> row2 idx3, idx4 -->
  <path class="heapE" d="M 280 260 V 275 H 160 V 290"/>
  <path class="heapE" d="M 280 260 V 275 H 400 V 290"/>
  <!-- row1 idx2 -> row2 idx5, idx6 -->
  <path class="heapE" d="M 760 260 V 275 H 640 V 290"/>
  <path class="heapE" d="M 760 260 V 275 H 880 V 290"/>

  <!-- annotation panels -->
  <rect x="40" y="400" width="480" height="110" rx="6" class="boxA"/>
  <text x="56" y="420" class="lbl annh">why remove() is O(log n), not O(n)</text>
  <text x="56" y="440" class="lbl ann">Every siftUp/siftDown swap updates the</text>
  <text x="56" y="456" class="lbl ann">moved task's heapIndex field in the same step.</text>
  <text x="56" y="472" class="lbl ann">remove(task) reads task.heapIndex and swaps</text>
  <text x="56" y="488" class="lbl ann">that slot with the last element directly —</text>
  <text x="56" y="502" class="lbl ann">O(log n) for the sift, not an O(n) linear scan.</text>

  <rect x="580" y="400" width="480" height="110" rx="6" class="boxA"/>
  <text x="596" y="420" class="lbl annh">why only one thread times out</text>
  <text x="596" y="440" class="lbl ann">If every waiter timed out on the head's delay,</text>
  <text x="596" y="456" class="lbl ann">each expiry wakes every waiter to recheck the</text>
  <text x="596" y="472" class="lbl ann">heap. One leader thread timed-waits on the</text>
  <text x="596" y="488" class="lbl ann">head; this avoids a thundering herd of timed</text>
  <text x="596" y="502" class="lbl ann">waits — followers block indefinitely instead.</text>

  <line x1="20" y1="530" x2="1080" y2="530" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="550" class="lbl h2">LEADER–FOLLOWER WAIT — one timed waiter, the rest wait indefinitely</text>

  <!-- condition box -->
  <rect x="400" y="565" width="300" height="70" rx="6" class="boxP"/>
  <text x="550" y="588" text-anchor="middle" class="lbl node">DelayedWorkQueue.available</text>
  <text x="550" y="605" text-anchor="middle" class="lbl body">Condition, guarded by the queue lock</text>
  <text x="550" y="621" text-anchor="middle" class="lbl sub">signalled when a new head becomes available</text>

  <!-- leader thread -->
  <rect x="60" y="700" width="260" height="90" rx="6" class="boxH"/>
  <text x="190" y="722" text-anchor="middle" class="lbl node">bonus-sweep-1 — LEADER</text>
  <text x="190" y="740" text-anchor="middle" class="lbl body">awaitNanos(delay to head)</text>
  <text x="190" y="756" text-anchor="middle" class="lbl body">delay = 00:12:04</text>
  <text x="190" y="772" text-anchor="middle" class="lbl sub">timed wait on BONUS-88231 expiry</text>

  <!-- follower threads -->
  <rect x="420" y="700" width="260" height="90" rx="6" class="boxW"/>
  <text x="550" y="722" text-anchor="middle" class="lbl node">bonus-sweep-2 — FOLLOWER</text>
  <text x="550" y="740" text-anchor="middle" class="lbl body">await() — no timeout</text>
  <text x="550" y="756" text-anchor="middle" class="lbl body">wakes only when signalled</text>
  <text x="550" y="772" text-anchor="middle" class="lbl sub">indefinite wait</text>

  <rect x="780" y="700" width="260" height="90" rx="6" class="boxW"/>
  <text x="910" y="722" text-anchor="middle" class="lbl node">bonus-sweep-3 — FOLLOWER</text>
  <text x="910" y="740" text-anchor="middle" class="lbl body">await() — no timeout</text>
  <text x="910" y="756" text-anchor="middle" class="lbl body">wakes only when signalled</text>
  <text x="910" y="772" text-anchor="middle" class="lbl sub">indefinite wait</text>

  <!-- edges thread -> condition -->
  <path class="leadE" d="M 190 700 V 655 H 550 V 635"/>
  <text x="230" y="670" class="lbl tiny">timed wait</text>
  <path class="follE" d="M 550 700 V 660 H 550 V 635"/>
  <path class="follE" d="M 910 700 V 655 H 550 V 635"/>
  <text x="800" y="670" class="lbl tiny">indefinite wait</text>

  <!-- legend -->
  <line x1="20" y1="810" x2="1080" y2="810" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="822" width="22" height="16" rx="3" class="boxH"/>
  <text x="50" y="835" class="lbl tiny">head of heap / leader thread</text>
  <rect x="270" y="822" width="22" height="16" rx="3" class="boxP"/>
  <text x="300" y="835" class="lbl tiny">ScheduledFutureTask / Condition</text>
  <rect x="560" y="822" width="22" height="16" rx="3" class="boxW"/>
  <text x="590" y="835" class="lbl tiny">follower thread, indefinite wait</text>
  <rect x="820" y="822" width="22" height="16" rx="3" class="boxA"/>
  <text x="850" y="835" class="lbl tiny">explanatory callout</text>

  <path class="heapE" d="M 20 858 H 60"/>
  <text x="68" y="863" class="lbl tiny">parent → child : child.delay ≥ parent.delay (min-heap order)</text>
  <path class="leadE" d="M 480 858 H 520"/>
  <text x="528" y="863" class="lbl tiny">leader → condition : timed wait on head's delay</text>
  <path class="follE" d="M 820 858 H 860"/>
  <text x="868" y="863" class="lbl tiny">follower → condition : indefinite wait</text>
</svg>
