<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ForkJoinPool.ctl packs one 64-bit long, high bits to low bits, into four 16-bit
     subfields: RC (labelled AC, active/released worker count) at bits 63 to 48, TC (total worker
     count) at bits 47 to 32, SS (a version-count and status field for the top idle worker) at
     bits 31 to 16, and ID (the poolIndex of the top of the Treiber stack of idle workers) at bits
     15 to 0. Every pool state transition — a worker going idle, a worker being woken, a worker
     being created or terminated — is one compareAndSetCtl on this single field, never a lock. When
     a task is pushed, signalWork reads ctl once: if RC already covers the queued work it does
     nothing, otherwise it CASes RC up and pops the ID field's Treiber stack to find a worker to
     wake, without scanning any queue.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .etxt  { font-size: 11px; fill: #1f2937; }
    .mono  { font-family: "SF Mono", Menlo, monospace; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxHi  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxWk  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">FORKJOINPOOL.CTL — ONE 64-BIT FIELD, EVERY TRANSITION A SINGLE CAS</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="66" class="lbl h2">64-BIT LAYOUT, HIGH BITS (LEFT, BIT 63) TO LOW BITS (RIGHT, BIT 0)</text>

  <!-- bit ruler -->
  <text x="60" y="86" class="lbl sub mono">63</text>
  <text x="290" y="86" class="lbl sub mono">48 47</text>
  <text x="520" y="86" class="lbl sub mono">32 31</text>
  <text x="750" y="86" class="lbl sub mono">16 15</text>
  <text x="985" y="86" class="lbl sub mono">0</text>

  <!-- four 16-bit fields -->
  <rect x="60" y="94" width="230" height="90" class="boxHi"/>
  <text x="175" y="122" text-anchor="middle" class="lbl node">RC (AC)</text>
  <text x="175" y="140" text-anchor="middle" class="lbl body">active / released</text>
  <text x="175" y="156" text-anchor="middle" class="lbl body">worker count</text>
  <text x="175" y="174" text-anchor="middle" class="lbl sub">bits 63..48, RC_UNIT = 1L &lt;&lt; 48</text>

  <rect x="290" y="94" width="230" height="90" class="boxP"/>
  <text x="405" y="122" text-anchor="middle" class="lbl node">TC</text>
  <text x="405" y="140" text-anchor="middle" class="lbl body">total worker count</text>
  <text x="405" y="156" text-anchor="middle" class="lbl body">(created, live or not)</text>
  <text x="405" y="174" text-anchor="middle" class="lbl sub">bits 47..32, TC_UNIT = 1L &lt;&lt; 32</text>

  <rect x="520" y="94" width="230" height="90" class="boxWk"/>
  <text x="635" y="122" text-anchor="middle" class="lbl node">SS</text>
  <text x="635" y="140" text-anchor="middle" class="lbl body">version count + status</text>
  <text x="635" y="156" text-anchor="middle" class="lbl body">of top idle worker</text>
  <text x="635" y="174" text-anchor="middle" class="lbl sub">bits 31..16, SS_SEQ = 1 &lt;&lt; 16</text>

  <rect x="750" y="94" width="230" height="90" class="boxR"/>
  <text x="865" y="122" text-anchor="middle" class="lbl node">ID</text>
  <text x="865" y="140" text-anchor="middle" class="lbl body">poolIndex — top of the</text>
  <text x="865" y="156" text-anchor="middle" class="lbl body">Treiber stack of idle workers</text>
  <text x="865" y="174" text-anchor="middle" class="lbl sub">bits 15..0</text>

  <!-- annotation on SS+ID forming the Treiber stack -->
  <rect x="520" y="204" width="460" height="60" rx="6" class="boxAnn"/>
  <text x="534" y="224" class="lbl h2">SS + ID TOGETHER = ONE TREIBER-STACK NODE</text>
  <text x="534" y="242" class="lbl tiny">SS is the ABA-guard version count; ID names which idle</text>
  <text x="534" y="256" class="lbl tiny">ledger-reconcile worker is on top of the idle stack.</text>

  <line x1="20" y1="296" x2="1020" y2="296" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="318" class="lbl h2">STATE TRANSITION 1 — A WORKER GOES IDLE (PUSHES ITSELF ON THE TREIBER STACK)</text>

  <rect x="60" y="336" width="280" height="76" rx="6" class="boxP"/>
  <text x="200" y="362" text-anchor="middle" class="lbl node">ledger-reconcile-7</text>
  <text x="200" y="382" text-anchor="middle" class="lbl body">finds no more of the 19.8M</text>
  <text x="200" y="398" text-anchor="middle" class="lbl body">LedgerEntry tasks to steal</text>

  <path class="flow" d="M 340 374 H 420"/>
  <text x="380" y="366" text-anchor="middle" class="lbl etxt">CAS ctl</text>

  <rect x="424" y="336" width="300" height="76" rx="6" class="boxHi"/>
  <text x="574" y="358" text-anchor="middle" class="lbl node">compareAndSetCtl(ctl, next)</text>
  <text x="574" y="378" text-anchor="middle" class="lbl body">RC -= 1, SS/ID = self, next = old ID</text>
  <text x="574" y="396" text-anchor="middle" class="lbl sub">worker-7 is now top of the idle stack</text>

  <path class="flow" d="M 724 374 H 800"/>

  <rect x="804" y="336" width="180" height="76" rx="6" class="boxWk"/>
  <text x="894" y="362" text-anchor="middle" class="lbl node">parked</text>
  <text x="894" y="382" text-anchor="middle" class="lbl body">off the run queue,</text>
  <text x="894" y="398" text-anchor="middle" class="lbl body">no lock held</text>

  <line x1="20" y1="440" x2="1020" y2="440" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="462" class="lbl h2">STATE TRANSITION 2 — signalWork DECIDES FROM A ctl READ, NOT A QUEUE SCAN</text>

  <rect x="60" y="480" width="280" height="90" rx="6" class="boxWk"/>
  <text x="200" y="504" text-anchor="middle" class="lbl node">ledger-reconcile-3</text>
  <text x="200" y="524" text-anchor="middle" class="lbl body">pushes a HOUSE_REVENUE</text>
  <text x="200" y="540" text-anchor="middle" class="lbl body">reconciliation subtask,</text>
  <text x="200" y="556" text-anchor="middle" class="lbl body">calls signalWork(ctl)</text>

  <path class="flow" d="M 340 500 V 480 H 424 V 500"/>

  <rect x="424" y="480" width="300" height="90" rx="6" class="boxP"/>
  <text x="574" y="504" text-anchor="middle" class="lbl node">read ctl once</text>
  <text x="574" y="524" text-anchor="middle" class="lbl body">RC &gt;= queued work?</text>
  <text x="574" y="540" text-anchor="middle" class="lbl sub">no queue walk, no scan of</text>
  <text x="574" y="556" text-anchor="middle" class="lbl sub">every worker's run queue</text>

  <path class="flow" d="M 500 570 V 590 H 200 V 614"/>
  <text x="290" y="605" text-anchor="middle" class="lbl etxt">RC sufficient</text>

  <rect x="60" y="614" width="280" height="60" rx="6" class="boxR"/>
  <text x="200" y="638" text-anchor="middle" class="lbl node">no-op</text>
  <text x="200" y="656" text-anchor="middle" class="lbl body">an active worker will steal it</text>

  <path class="flow" d="M 724 500 H 800 V 610 H 724"/>
  <text x="850" y="494" text-anchor="middle" class="lbl etxt">RC insufficient</text>

  <rect x="424" y="614" width="300" height="60" rx="6" class="boxHi"/>
  <text x="574" y="634" text-anchor="middle" class="lbl node">CAS ctl: pop ID, RC += 1</text>
  <text x="574" y="650" text-anchor="middle" class="lbl body">wake worker named by ID</text>
  <text x="574" y="665" text-anchor="middle" class="lbl sub">e.g. ledger-reconcile-7</text>

  <!-- legend -->
  <line x1="20" y1="700" x2="1020" y2="700" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="712" width="22" height="14" rx="3" class="boxHi"/>
  <text x="50" y="723" class="lbl tiny">the field this diagram is about (RC/AC, and each CAS step)</text>
  <rect x="400" y="712" width="22" height="14" rx="3" class="boxP"/>
  <text x="430" y="723" class="lbl tiny">subject field / active decision step</text>
  <rect x="700" y="712" width="22" height="14" rx="3" class="boxR"/>
  <text x="730" y="723" class="lbl tiny">resolved / fast path</text>
  <rect x="20" y="734" width="22" height="14" rx="3" class="boxWk"/>
  <text x="50" y="745" class="lbl tiny">worker / secondary detail</text>
  <rect x="400" y="734" width="22" height="14" rx="3" class="boxAnn"/>
  <text x="430" y="745" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 700 741 H 740"/>
  <text x="748" y="746" class="lbl tiny">A → B : step in the CAS sequence</text>
</svg>
