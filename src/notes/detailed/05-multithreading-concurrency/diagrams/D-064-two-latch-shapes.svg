<svg viewBox="0 0 1120 830" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before-after comparison of the two CountDownLatch shapes. Left, the start gate:
     new CountDownLatch(1) with N worker threads for a 1,200 stake-reservations/sec load test all
     calling await, and the main thread counting down once so every worker starts together at the
     same instant. Right, the completion gate: new CountDownLatch(n) sized to n settlement-ingest
     workers, main calling await, and each worker calling countDown in a finally block so the
     count reaches zero even if a worker throws. A third panel shows the failure mode when the
     finally is missing: one settlement-ingest worker throws before reaching countDown, the count
     never reaches zero, and main hangs forever on await with no timeout.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
    .h2    { font-size: 13.5px; font-weight: 700; letter-spacing: .3px; }
    .body  { font-size: 13px; }
    .sub   { font-size: 11px; fill: #4b5563; }
    .cap   { font-size: 12.5px; }
    .tiny  { font-size: 11px; }

    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxD  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; }
    .band  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#tri475); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#tri9ca); }
    .bus   { fill: none; stroke: #475569; stroke-width: 2; }
  </style>
  <defs>
    <marker id="tri475" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="tri9ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="830" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">TWO CountDownLatch SHAPES: START GATE vs COMPLETION GATE</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LEFT: start gate -->
  <rect x="20" y="56" width="530" height="24" rx="4" class="band"/>
  <text x="35" y="73" class="lbl h2">START GATE — new CountDownLatch(1)</text>

  <rect x="150" y="96" width="270" height="50" rx="6" class="boxH"/>
  <text x="285" y="119" text-anchor="middle" class="lbl body" font-weight="600">startGate</text>
  <text x="285" y="136" text-anchor="middle" class="lbl sub">CountDownLatch(1), count = 1</text>

  <rect x="40" y="190" width="150" height="52" rx="6" class="boxW"/>
  <text x="115" y="211" text-anchor="middle" class="lbl body">load-gen-worker-1</text>
  <text x="115" y="228" text-anchor="middle" class="lbl sub">startGate.await()</text>

  <rect x="200" y="190" width="150" height="52" rx="6" class="boxW"/>
  <text x="275" y="211" text-anchor="middle" class="lbl body">load-gen-worker-2</text>
  <text x="275" y="228" text-anchor="middle" class="lbl sub">startGate.await()</text>

  <rect x="360" y="190" width="150" height="52" rx="6" class="boxW"/>
  <text x="435" y="211" text-anchor="middle" class="lbl body">load-gen-worker-N</text>
  <text x="435" y="228" text-anchor="middle" class="lbl sub">startGate.await()</text>

  <path class="flow" d="M 285 146 V 165 H 115 V 190"/>
  <path class="flow" d="M 285 146 V 165 H 275 V 190"/>
  <path class="flow" d="M 285 146 V 165 H 435 V 190"/>

  <rect x="150" y="270" width="270" height="52" rx="6" class="boxR"/>
  <text x="285" y="291" text-anchor="middle" class="lbl body" font-weight="600">main</text>
  <text x="285" y="308" text-anchor="middle" class="lbl sub">startGate.countDown() — once</text>

  <path class="flow" d="M 285 270 V 258"/>

  <rect x="90" y="342" width="390" height="60" rx="6" class="boxR"/>
  <text x="285" y="363" text-anchor="middle" class="lbl body" font-weight="600">all N workers released together</text>
  <text x="285" y="381" text-anchor="middle" class="lbl sub">1,200 stake-reservations/sec load test</text>
  <text x="285" y="395" text-anchor="middle" class="lbl sub">starts at the same instant — no ramp-up skew</text>

  <path class="flow" d="M 115 242 V 260 H 200 V 342"/>
  <path class="flow" d="M 275 242 V 342"/>
  <path class="flow" d="M 435 242 V 260 H 370 V 342"/>

  <text x="35" y="428" class="lbl cap">One countDown() opens the gate for every waiting worker at once —</text>
  <text x="35" y="444" class="lbl cap">the count needs to reach zero only this one time.</text>

  <!-- RIGHT: completion gate -->
  <rect x="570" y="56" width="530" height="24" rx="4" class="band"/>
  <text x="585" y="73" class="lbl h2">COMPLETION GATE — new CountDownLatch(n)</text>

  <rect x="700" y="96" width="270" height="50" rx="6" class="boxH"/>
  <text x="835" y="119" text-anchor="middle" class="lbl body" font-weight="600">doneGate</text>
  <text x="835" y="136" text-anchor="middle" class="lbl sub">CountDownLatch(n), count = n</text>

  <rect x="590" y="190" width="150" height="52" rx="6" class="boxP"/>
  <text x="665" y="211" text-anchor="middle" class="lbl body">settlement-ingest-1</text>
  <text x="665" y="228" text-anchor="middle" class="lbl sub">finally { countDown() }</text>

  <rect x="750" y="190" width="150" height="52" rx="6" class="boxP"/>
  <text x="825" y="211" text-anchor="middle" class="lbl body">settlement-ingest-2</text>
  <text x="825" y="228" text-anchor="middle" class="lbl sub">finally { countDown() }</text>

  <rect x="910" y="190" width="150" height="52" rx="6" class="boxP"/>
  <text x="985" y="211" text-anchor="middle" class="lbl body">settlement-ingest-n</text>
  <text x="985" y="228" text-anchor="middle" class="lbl sub">finally { countDown() }</text>

  <path class="bus" d="M 665 190 V 170"/>
  <path class="bus" d="M 825 190 V 170"/>
  <path class="bus" d="M 985 190 V 170"/>
  <path class="bus" d="M 665 170 H 985"/>
  <path class="flow" d="M 835 170 V 146"/>

  <rect x="700" y="342" width="270" height="52" rx="6" class="boxR"/>
  <text x="835" y="363" text-anchor="middle" class="lbl body" font-weight="600">main</text>
  <text x="835" y="380" text-anchor="middle" class="lbl sub">doneGate.await() returns at count 0</text>

  <path class="flow" d="M 835 146 V 342"/>

  <text x="585" y="428" class="lbl cap">Each ingest worker counts down once in a finally, so main's await()</text>
  <text x="585" y="444" class="lbl cap">unblocks whether every worker succeeded or threw.</text>

  <!-- BOTTOM: failure mode when finally is missing -->
  <rect x="20" y="480" width="1080" height="270" rx="8" class="band"/>
  <text x="35" y="504" class="lbl h2">FAILURE MODE — countDown() NOT IN A finally</text>

  <rect x="60" y="522" width="260" height="60" rx="6" class="boxH"/>
  <text x="190" y="544" text-anchor="middle" class="lbl body" font-weight="600">doneGate</text>
  <text x="190" y="562" text-anchor="middle" class="lbl sub">CountDownLatch(3), count = 3</text>
  <text x="190" y="576" text-anchor="middle" class="lbl sub">sized for 3 settlement-ingest workers</text>

  <rect x="360" y="522" width="200" height="60" rx="6" class="boxR"/>
  <text x="460" y="544" text-anchor="middle" class="lbl body">settlement-ingest-1</text>
  <text x="460" y="562" text-anchor="middle" class="lbl sub">countDown() after body</text>
  <text x="460" y="576" text-anchor="middle" class="lbl sub">count 3 → 2</text>

  <rect x="600" y="522" width="200" height="60" rx="6" class="boxR"/>
  <text x="700" y="544" text-anchor="middle" class="lbl body">settlement-ingest-2</text>
  <text x="700" y="562" text-anchor="middle" class="lbl sub">countDown() after body</text>
  <text x="700" y="576" text-anchor="middle" class="lbl sub">count 2 → 1</text>

  <rect x="840" y="522" width="200" height="60" rx="6" class="boxD"/>
  <text x="940" y="544" text-anchor="middle" class="lbl body">settlement-ingest-3</text>
  <text x="940" y="562" text-anchor="middle" class="lbl sub">throws before reaching</text>
  <text x="940" y="576" text-anchor="middle" class="lbl sub">countDown() — no finally</text>

  <path class="flow" d="M 460 582 V 600 H 250 V 582"/>
  <path class="flow" d="M 700 582 V 610 H 280 V 582"/>
  <path class="weak" d="M 940 582 V 602 H 800 V 622"/>

  <rect x="60" y="622" width="320" height="52" rx="6" class="boxD"/>
  <text x="220" y="643" text-anchor="middle" class="lbl body" font-weight="600">doneGate count stuck at 1</text>
  <text x="220" y="660" text-anchor="middle" class="lbl sub">never reaches zero</text>

  <path class="flow" d="M 205 582 V 622"/>

  <rect x="560" y="622" width="480" height="52" rx="6" class="boxD"/>
  <text x="800" y="643" text-anchor="middle" class="lbl body" font-weight="600">main hangs forever</text>
  <text x="800" y="660" text-anchor="middle" class="lbl sub">await() with no timeout, never returns</text>

  <path class="flow" d="M 380 648 H 560"/>

  <text x="60" y="716" class="lbl cap">settlement-ingest-3 throws before its countDown() call site; because the call was not</text>
  <text x="60" y="732" class="lbl cap">wrapped in a finally, the count freezes at 1 and main's unbounded await() never unblocks.</text>

  <!-- LEGEND -->
  <line x1="20" y1="762" x2="1100" y2="762" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="774" width="22" height="16" rx="3" class="boxH"/>
  <text x="60" y="787" class="lbl tiny">the latch itself</text>

  <rect x="220" y="774" width="22" height="16" rx="3" class="boxW"/>
  <text x="250" y="787" class="lbl tiny">worker awaiting the gate</text>

  <rect x="440" y="774" width="22" height="16" rx="3" class="boxP"/>
  <text x="470" y="787" class="lbl tiny">worker that counts down in a finally</text>

  <rect x="720" y="774" width="22" height="16" rx="3" class="boxR"/>
  <text x="750" y="787" class="lbl tiny">successful step / gate opens</text>

  <rect x="30" y="798" width="22" height="16" rx="3" class="boxD"/>
  <text x="60" y="811" class="lbl tiny">thrown / stuck / hangs forever</text>

  <path class="flow" d="M 260 806 H 292"/>
  <text x="300" y="811" class="lbl tiny">A → B : countDown()/await() signal</text>
  <path class="weak" d="M 560 806 H 592"/>
  <text x="600" y="811" class="lbl tiny">A → B : missing-finally consequence, not a normal signal</text>
</svg>
