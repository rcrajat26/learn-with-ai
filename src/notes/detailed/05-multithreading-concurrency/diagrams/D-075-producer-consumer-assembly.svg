<svg viewBox="0 0 1120 980" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The producer-consumer assembly. Producers withdrawal-intake-1 and withdrawal-intake-2
     feed a bounded BlockingQueue of WithdrawalTransaction with capacity 1,000, which fans out to
     three consumers payment-run-worker-1 through 3, each building a PaymentRun. Each consumer loop
     wraps every task in its own try/catch so one bad WithdrawalTransaction never kills the worker,
     and treats an InterruptedException by restoring the interrupt flag and breaking out. Shutdown
     runs in five numbered steps: stop accepting new work, drain the queue, enqueue one poison pill
     per consumer so three pills in total, await termination with a deadline, then force shutdown if
     the deadline passes.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
    .node  { font-size: 13px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .code  { font-size: 11px; font-family: "SF Mono", Menlo, monospace; fill: #1f2937; }
    .num   { font-size: 13px; font-weight: 700; fill: #ffffff; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }
    .boxY  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .panel { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round;
             marker-end: url(#tri); }
    .pill  { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 3 3;
             stroke-linejoin: round; marker-end: url(#triY); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triY" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="980" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">THE PRODUCER–CONSUMER ASSEMBLY — WITHDRAWAL TRANSACTIONS TO A PAYMENTRUN</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Producers -->
  <rect x="120" y="66" width="220" height="46" rx="6" class="boxP"/>
  <text x="230" y="94" text-anchor="middle" class="lbl body">withdrawal-intake-1</text>

  <rect x="400" y="66" width="220" height="46" rx="6" class="boxP"/>
  <text x="510" y="94" text-anchor="middle" class="lbl body">withdrawal-intake-2</text>

  <!-- bus into queue -->
  <path class="flow" d="M 230 112 V 132 H 460 V 148"/>
  <path class="flow" d="M 510 112 V 148"/>

  <!-- bounded queue -->
  <rect x="330" y="150" width="260" height="66" rx="6" class="boxY"/>
  <text x="460" y="172" text-anchor="middle" class="lbl body" font-weight="700">BlockingQueue&lt;WithdrawalTransaction&gt;</text>
  <text x="460" y="190" text-anchor="middle" class="lbl code">capacity = 1,000</text>
  <text x="460" y="206" text-anchor="middle" class="lbl sub">ArrayBlockingQueue, bounded — put() blocks when full</text>

  <!-- poison pill injection -->
  <rect x="700" y="150" width="240" height="66" rx="6" class="boxW"/>
  <text x="820" y="172" text-anchor="middle" class="lbl body">poison pills</text>
  <text x="820" y="188" text-anchor="middle" class="lbl sub">3 pills = consumer count</text>
  <text x="820" y="203" text-anchor="middle" class="lbl sub">enqueued after last WithdrawalTransaction</text>
  <path class="pill" d="M 700 160 H 590"/>

  <!-- bus out to consumers -->
  <path class="flow" d="M 460 216 V 236 H 200 V 252"/>
  <path class="flow" d="M 460 216 V 252"/>
  <path class="flow" d="M 460 216 V 236 H 720 V 252"/>

  <rect x="80"  y="254" width="240" height="46" rx="6" class="boxP"/>
  <text x="200" y="282" text-anchor="middle" class="lbl body">payment-run-worker-1</text>

  <rect x="340" y="254" width="240" height="46" rx="6" class="boxP"/>
  <text x="460" y="282" text-anchor="middle" class="lbl body">payment-run-worker-2</text>

  <rect x="600" y="254" width="240" height="46" rx="6" class="boxP"/>
  <text x="720" y="282" text-anchor="middle" class="lbl body">payment-run-worker-3</text>

  <!-- each consumer loop detail panel -->
  <rect x="80" y="330" width="760" height="150" rx="6" class="panel"/>
  <text x="96" y="352" class="lbl tiny" font-weight="700">EACH OF THE 3 CONSUMERS RUNS THIS LOOP</text>
  <text x="96" y="374" class="lbl code">while (running) {</text>
  <text x="112" y="392" class="lbl code">task = queue.take();</text>
  <text x="112" y="410" class="lbl code">if (task == POISON_PILL) break;              // one of the 3 pills reached this worker</text>
  <text x="112" y="428" class="lbl code">try { buildPaymentRun(task); }                // per-task try/catch</text>
  <text x="112" y="446" class="lbl code">catch (RuntimeException e) { log(e); }        // one bad WithdrawalTransaction never kills the worker</text>
  <text x="96" y="464" class="lbl code">} catch (InterruptedException e) { Thread.currentThread().interrupt(); break; }  // interrupt handling</text>

  <!-- consumer boxes into loop panel -->
  <path class="flow" d="M 200 300 V 330"/>
  <path class="flow" d="M 460 300 V 330"/>
  <path class="flow" d="M 720 300 V 330"/>

  <rect x="340" y="500" width="240" height="50" rx="6" class="boxR"/>
  <text x="460" y="522" text-anchor="middle" class="lbl body">PaymentRun</text>
  <text x="460" y="538" text-anchor="middle" class="lbl sub">batch of approved bank withdrawals</text>
  <path class="flow" d="M 200 480 V 525 H 340"/>
  <path class="flow" d="M 460 480 V 500"/>
  <path class="flow" d="M 720 480 V 525 H 580"/>

  <!-- shutdown order -->
  <rect x="80" y="580" width="960" height="300" rx="6" class="panel"/>
  <text x="96" y="604" class="lbl tiny" font-weight="700">SHUTDOWN ORDER</text>

  <circle cx="112" cy="632" r="14" class="boxY"/>
  <text x="112" y="637" text-anchor="middle" class="num" fill="#1f2937">1</text>
  <text x="136" y="637" class="lbl body">stop accepting — producers stop calling queue.put(); intake is closed to new WithdrawalTransactions</text>

  <circle cx="112" cy="668" r="14" class="boxY"/>
  <text x="112" y="673" text-anchor="middle" class="num" fill="#1f2937">2</text>
  <text x="136" y="673" class="lbl body">drain — the 3 workers keep taking and finish every WithdrawalTransaction already queued</text>

  <circle cx="112" cy="704" r="14" class="boxY"/>
  <text x="112" y="709" text-anchor="middle" class="num" fill="#1f2937">3</text>
  <text x="136" y="709" class="lbl body">pill — enqueue one poison pill per consumer (3 pills, one per worker) so every loop sees POISON_PILL and exits</text>

  <circle cx="112" cy="740" r="14" class="boxY"/>
  <text x="112" y="745" text-anchor="middle" class="num" fill="#1f2937">4</text>
  <text x="136" y="745" class="lbl body">await — executor.awaitTermination() with a fixed deadline, not an unbounded wait</text>

  <circle cx="112" cy="776" r="14" class="boxY"/>
  <text x="112" y="781" text-anchor="middle" class="num" fill="#1f2937">5</text>
  <text x="136" y="781" class="lbl body">force — if the deadline passes, shutdownNow() interrupts whatever is still running</text>

  <path class="flow" d="M 112 646 V 654"/>
  <path class="flow" d="M 112 682 V 690"/>
  <path class="flow" d="M 112 718 V 726"/>
  <path class="flow" d="M 112 754 V 762"/>

  <text x="96" y="812" class="lbl tiny" font-weight="700">WHY THE ORDER MATTERS</text>
  <text x="96" y="830" class="lbl tiny">Pilling before draining loses queued WithdrawalTransactions — a worker may pop the pill before</text>
  <text x="96" y="846" class="lbl tiny">reaching the real work behind it. Awaiting without a deadline risks hanging shutdown forever if a</text>
  <text x="96" y="862" class="lbl tiny">worker is stuck; forcing too early (step 5 before step 4) interrupts a payment run mid-write.</text>

  <!-- LEGEND -->
  <line x1="20" y1="896" x2="1100" y2="896" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="20" y="908" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="921" class="lbl tiny">producer / consumer thread</text>

  <rect x="270" y="908" width="22" height="16" rx="3" class="boxY"/>
  <text x="300" y="921" class="lbl tiny">the bounded queue / shutdown step marker</text>

  <rect x="580" y="908" width="22" height="16" rx="3" class="boxR"/>
  <text x="610" y="921" class="lbl tiny">PaymentRun output</text>

  <rect x="750" y="908" width="22" height="16" rx="3" class="boxW"/>
  <text x="780" y="921" class="lbl tiny">poison-pill sentinel</text>

  <rect x="940" y="908" width="22" height="16" rx="3" class="panel"/>
  <text x="970" y="921" class="lbl tiny">explanatory note</text>

  <path class="flow" d="M 20 948 H 60"/>
  <text x="68" y="953" class="lbl tiny">A → B : queue hand-off / call</text>
  <path class="pill" d="M 300 948 H 340"/>
  <text x="348" y="953" class="lbl tiny">A → B : poison-pill enqueue</text>
</svg>
