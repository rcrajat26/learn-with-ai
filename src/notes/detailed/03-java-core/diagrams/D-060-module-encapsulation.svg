<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flowchart: a serialization library calling setAccessible(true) on com.quizstakes.ledger.internal.LedgerEntry, branching on exports, opens and --add-opens, ending in success, IllegalAccessException, or InaccessibleObjectException, with a VERSION TRAP note on deny-by-default since Java 16/17">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="860" height="34" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Module strong encapsulation: reflective setAccessible(true) into com.quizstakes.ledger.internal</text>

  <!-- Start node -->
  <rect x="330" y="70" width="240" height="46" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Serialization library reflects into</text>
  <text x="450" y="106" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">LedgerEntry.someField.setAccessible(true)</text>

  <line x1="450" y1="116" x2="450" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1: exported? -->
  <polygon points="450,150 560,196 450,242 340,196" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Is package</text>
  <text x="450" y="208" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">exports-ed?</text>

  <!-- No -> IllegalAccessException -->
  <line x1="340" y1="196" x2="140" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="180" width="34" height="18" rx="3" fill="#fee2e2"/>
  <text x="167" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>

  <rect x="20" y="220" width="220" height="60" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="130" y="244" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">IllegalAccessException</text>
  <text x="130" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">package not exported</text>
  <text x="130" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(compile / getMethod path)</text>
  <line x1="140" y1="196" x2="140" y2="220" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yes -> exported path continues down to success later; but internal package is not exported, so main path is "no" for reflective setAccessible check we go straight down for opens check -->
  <rect x="460" y="180" width="40" height="18" rx="3" fill="#dcfce7"/>
  <text x="480" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <line x1="450" y1="242" x2="450" y2="300" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="150" width="140" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="770" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">exports path:</text>
  <text x="770" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">public API reachable,</text>
  <text x="770" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">deep reflection still gated</text>
  <line x1="500" y1="190" x2="700" y2="180" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2: opens? -->
  <polygon points="450,300 560,346 450,392 340,346" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Is package</text>
  <text x="450" y="358" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">opens-ed for setAccessible?</text>

  <rect x="460" y="330" width="40" height="18" rx="3" fill="#dcfce7"/>
  <text x="480" y="343" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <line x1="450" y1="392" x2="450" y2="440" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="330" width="34" height="18" rx="3" fill="#fee2e2"/>
  <text x="167" y="343" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <line x1="340" y1="346" x2="140" y2="346" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="370" width="220" height="76" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="130" y="394" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">InaccessibleObjectException</text>
  <text x="130" y="412" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">setAccessible into a</text>
  <text x="130" y="426" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">non-opens package</text>
  <text x="130" y="440" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">com.quizstakes.ledger.internal</text>

  <!-- Decision 3: the add-opens present? branches off the InaccessibleObjectException path -->
  <line x1="130" y1="446" x2="130" y2="480" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="130,480 250,530 130,580 10,530" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="130" y="522" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Is JVM launched with</text>
  <text x="130" y="538" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">--add-opens flag?</text>

  <rect x="14" y="510" width="34" height="18" rx="3" fill="#fee2e2"/>
  <text x="31" y="523" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no</text>
  <line x1="10" y1="530" x2="10" y2="620" stroke="#737373" stroke-width="2"/>
  <line x1="10" y1="620" x2="130" y2="620" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="600" width="220" height="46" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="130" y="628" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Fails permanently:</text>
  <text x="130" y="642" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">InaccessibleObjectException</text>

  <rect x="146" y="510" width="40" height="18" rx="3" fill="#fef3c7"/>
  <text x="166" y="523" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">yes</text>
  <line x1="250" y1="530" x2="450" y2="530" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="500" width="440" height="56" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="520" y="522" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Escape hatch (explicit JVM flag at launch):</text>
  <text x="520" y="540" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">--add-opens com.quizstakes.ledger/com.quizstakes.ledger.internal=ALL-UNNAMED</text>
  <line x1="520" y1="556" x2="450" y2="580" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Success terminal -->
  <rect x="360" y="440" width="180" height="46" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Success:</text>
  <text x="450" y="478" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">reflective access granted</text>

  <!-- module-info.java fragment -->
  <rect x="600" y="230" width="260" height="150" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="612" y="250" font-family="sans-serif" font-size="12" fill="#1f2937">module-info.java (com.quizstakes.ledger)</text>
  <text x="612" y="272" font-family="monospace" font-size="11" fill="#1f2937">exports com.quizstakes.ledger.api;</text>
  <text x="612" y="294" font-family="monospace" font-size="11" fill="#1f2937">opens com.quizstakes.ledger.dto</text>
  <text x="624" y="310" font-family="monospace" font-size="11" fill="#1f2937">to com.fasterxml.jackson.databind;</text>
  <text x="612" y="334" font-family="monospace" font-size="11" fill="#1f2937">// ledger.internal: neither</text>
  <text x="612" y="350" font-family="monospace" font-size="11" fill="#1f2937">// exported nor opened</text>
  <text x="612" y="368" font-family="monospace" font-size="11" fill="#1f2937">// LedgerEntry lives here</text>

  <!-- VERSION TRAP note -->
  <rect x="360" y="670" width="480" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="600" y="692" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">VERSION TRAP</text>
  <text x="600" y="710" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Deny-by-default since Java 16/17; permitted with a warning on</text>
  <text x="600" y="726" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Java 9-15; unrestricted on Java 8</text>
  <line x1="450" y1="580" x2="450" y2="670" stroke="#737373" stroke-width="2"/>
  <line x1="450" y1="670" x2="450" y2="670" stroke="#737373" stroke-width="2"/>
</svg>
