<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The native StringTable: a fixed-size bucket array holding weak references to interned QuizStakes status-code Strings on the heap, with a fourth intern() call probing and inserting, StringTableSize default 65536, and a cost-curve inset showing probe cost rising with bucket chain length">

  <defs>
    <marker id="arrow97" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <marker id="arrow97b" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">The StringTable and intern() &#8212; native fixed-size hash table, JDK 21</text>

  <!-- StringTableSize label -->
  <rect x="40" y="76" width="260" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="170" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">StringTableSize = 65536 (default)</text>

  <rect x="320" y="76" width="300" height="26" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="470" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">-XX:+PrintStringTableStatistics</text>

  <!-- bucket array -->
  <text x="40" y="122" font-family="sans-serif" font-size="13" fill="#1f2937">Native bucket array (8 of 65536 buckets shown):</text>

  <rect x="40" y="134" width="70" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="75" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 0</text>

  <rect x="115" y="134" width="70" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="150" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 1</text>

  <rect x="190" y="134" width="70" height="50" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="225" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 2</text>
  <text x="225" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">AA-801...</text>

  <rect x="265" y="134" width="70" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="300" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 3</text>

  <rect x="340" y="134" width="70" height="50" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="375" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 4</text>
  <text x="375" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">AA-611 (new)</text>

  <rect x="415" y="134" width="70" height="50" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 5</text>
  <text x="450" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">DEP-301...</text>

  <rect x="490" y="134" width="70" height="50" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="525" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 6</text>

  <rect x="565" y="134" width="70" height="50" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="600" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">bucket 7</text>
  <text x="600" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">BDP-101</text>

  <!-- heap region -->
  <rect x="40" y="230" width="740" height="120" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="250" font-family="sans-serif" font-size="13" fill="#1f2937">Java Heap</text>

  <rect x="170" y="262" width="130" height="70" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="235" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String</text>
  <text x="235" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"AA-801 ACTIVATED"</text>
  <text x="235" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[] LATIN1</text>

  <rect x="320" y="262" width="130" height="70" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="385" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String (new)</text>
  <text x="385" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"AA-611 DOCS_VERIFIED"</text>
  <text x="385" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[] LATIN1</text>

  <rect x="470" y="262" width="130" height="70" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="535" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String</text>
  <text x="535" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"DEP-301 CAPTURED"</text>
  <text x="535" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[] LATIN1</text>

  <rect x="620" y="262" width="130" height="70" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="685" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String</text>
  <text x="685" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>
  <text x="685" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[] LATIN1</text>

  <!-- weak ref arrows -->
  <line x1="225" y1="184" x2="235" y2="262" stroke="#737373" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow97)"/>
  <line x1="375" y1="184" x2="385" y2="262" stroke="#525252" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow97b)"/>
  <line x1="450" y1="184" x2="535" y2="262" stroke="#737373" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow97)"/>
  <line x1="600" y1="184" x2="685" y2="262" stroke="#737373" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow97)"/>

  <rect x="620" y="220" width="160" height="22" rx="3" fill="#fef3c7"/>
  <text x="700" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">table holds weak refs</text>

  <!-- intern() call sequence -->
  <rect x="40" y="370" width="740" height="30" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="410" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Fourth intern() call: probe then insert</text>

  <rect x="40" y="415" width="150" height="60" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="115" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">StatusCode parsed</text>
  <text x="115" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">from ledger row:</text>
  <text x="115" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"AA-611 DOCS_VERIFIED"</text>

  <line x1="190" y1="445" x2="230" y2="445" stroke="#737373" stroke-width="2" marker-end="url(#arrow97)"/>

  <rect x="230" y="415" width="140" height="60" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="300" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">call .intern()</text>
  <text x="300" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">hash % StringTableSize</text>

  <line x1="370" y1="445" x2="410" y2="445" stroke="#737373" stroke-width="2" marker-end="url(#arrow97)"/>

  <rect x="410" y="415" width="150" height="60" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="485" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">probe bucket 4</text>
  <text x="485" y="458" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">not found (empty)</text>

  <line x1="560" y1="445" x2="600" y2="445" stroke="#737373" stroke-width="2" marker-end="url(#arrow97)"/>

  <rect x="600" y="415" width="180" height="60" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="690" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">insert weak-ref entry</text>
  <text x="690" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">into bucket 4; return</text>
  <text x="690" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">this heap String</text>

  <!-- provenance box -->
  <rect x="40" y="500" width="740" height="60" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="60" y="522" font-family="sans-serif" font-size="11" fill="#1f2937">verified: java -XX:+PrintFlagsFinal -version, Oracle JDK 21.0.7 (macOS aarch64) -&gt;</text>
  <text x="60" y="540" font-family="sans-serif" font-size="11" fill="#1f2937">uintx StringTableSize = 65536 {product} {default}</text>
  <text x="60" y="554" font-family="sans-serif" font-size="11" fill="#1f2937">historic default in older JDKs (e.g. JDK 6/7 pre-7u40): 1009</text>

  <!-- cost curve inset -->
  <rect x="40" y="580" width="380" height="230" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="602" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Probe cost vs. bucket chain length</text>

  <rect x="70" y="620" width="300" height="150" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <line x1="70" y1="770" x2="370" y2="770" stroke="#737373" stroke-width="2" marker-end="url(#arrow97)"/>
  <line x1="70" y1="770" x2="70" y2="620" stroke="#737373" stroke-width="2" marker-end="url(#arrow97)"/>
  <polyline points="70,765 130,750 190,715 250,660 310,630 360,622" fill="none" stroke="#525252" stroke-width="2"/>

  <rect x="150" y="785" width="220" height="20" rx="3" fill="#fef3c7"/>
  <text x="260" y="800" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">x: bucket chain length</text>

  <rect x="40" y="815" width="380" height="20" rx="3" fill="#fef3c7"/>
  <text x="230" y="830" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">y: probe cost &#8212; undersized table means long chains, slower intern()</text>

  <!-- legend -->
  <rect x="450" y="580" width="330" height="230" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="465" y="602" font-family="sans-serif" font-size="13" fill="#1f2937">Legend</text>
  <rect x="465" y="615" width="20" height="16" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="495" y="628" font-family="sans-serif" font-size="11" fill="#1f2937">occupied bucket, existing entry</text>
  <rect x="465" y="640" width="20" height="16" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="495" y="653" font-family="sans-serif" font-size="11" fill="#1f2937">bucket receiving new insert</text>
  <rect x="465" y="665" width="20" height="16" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="495" y="678" font-family="sans-serif" font-size="11" fill="#1f2937">interned String on heap</text>
  <line x1="465" y1="695" x2="485" y2="695" stroke="#737373" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="495" y="700" font-family="sans-serif" font-size="11" fill="#1f2937">weak reference (GC-collectible if</text>
  <text x="495" y="714" font-family="sans-serif" font-size="11" fill="#1f2937">no strong refs remain elsewhere)</text>

</svg>
