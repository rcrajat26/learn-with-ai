<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="StakeSplit source snippet with boxes showing which decisions javac makes at compile time versus which decisions the JVM makes at run time, each with an arrow to the governing source line">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="590" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">Which side of the line decides the behaviour</text>

  <!-- column headers -->
  <rect x="55" y="60" width="195" height="26" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="152" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">decided by javac</text>

  <rect x="880" y="60" width="200" height="26" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="980" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">decided by the JVM</text>

  <rect x="470" y="60" width="180" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="560" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">StakeSplit source</text>

  <!-- snippet box -->
  <rect x="300" y="100" width="510" height="352" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="315" y="128" font-family="monospace" font-size="13" fill="#1f2937">class StakeSplit {</text>
  <text x="315" y="152" font-family="monospace" font-size="13" fill="#1f2937">  void apply(Stake s, List&lt;Money&gt; pool) {</text>
  <text x="315" y="176" font-family="monospace" font-size="13" fill="#1f2937">    final double bonus;</text>
  <text x="315" y="200" font-family="monospace" font-size="13" fill="#1f2937">    if (CLIENT_BONUS_AVAILABLE) bonus = 3.33;</text>
  <text x="315" y="224" font-family="monospace" font-size="13" fill="#1f2937">    else bonus = 0;</text>
  <text x="315" y="248" font-family="monospace" font-size="13" fill="#1f2937">    String msg = "AA-801:" + bonus;</text>
  <text x="315" y="272" font-family="monospace" font-size="13" fill="#1f2937">    Integer boxed = (int) bonus;</text>
  <text x="315" y="296" font-family="monospace" font-size="13" fill="#1f2937">    s.settle(boxed);</text>
  <text x="315" y="320" font-family="monospace" font-size="13" fill="#1f2937">    for (Money m : pool) m.apply(bonus);</text>
  <text x="315" y="344" font-family="monospace" font-size="13" fill="#1f2937">    try { s.notify(); }</text>
  <text x="315" y="368" font-family="monospace" font-size="13" fill="#1f2937">    catch (StakeException e) { throw e; }</text>
  <text x="315" y="392" font-family="monospace" font-size="13" fill="#1f2937">  }</text>
  <text x="315" y="416" font-family="monospace" font-size="13" fill="#1f2937">}</text>

  <!-- left column: decided by javac -->
  <g>
    <rect x="25" y="110" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">erasure</text>
    <line x1="280" y1="137" x2="300" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="25" y="180" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">definite assignment</text>
    <line x1="280" y1="207" x2="300" y2="176" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="25" y="250" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">constant folding</text>
    <line x1="280" y1="277" x2="300" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="25" y="320" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">string concat call site</text>
    <line x1="280" y1="347" x2="300" y2="248" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="25" y="390" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">boxing insertion</text>
    <line x1="280" y1="417" x2="300" y2="272" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="25" y="460" width="255" height="55" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="152" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">overload selection</text>
    <line x1="280" y1="487" x2="300" y2="296" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- right column: decided by the JVM -->
  <g>
    <rect x="830" y="110" width="300" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="980" y="142" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">class initialization</text>
    <line x1="830" y1="137" x2="810" y2="128" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="830" y="180" width="300" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="980" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">virtual dispatch</text>
    <line x1="830" y1="207" x2="810" y2="292" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="830" y="250" width="300" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="980" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JIT inlining</text>
    <line x1="830" y1="277" x2="810" y2="300" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="830" y="320" width="300" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="980" y="352" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">exception handler search</text>
    <line x1="830" y1="347" x2="810" y2="368" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g>
    <rect x="830" y="390" width="300" height="55" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="980" y="422" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">GC</text>
    <line x1="830" y1="417" x2="810" y2="320" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
