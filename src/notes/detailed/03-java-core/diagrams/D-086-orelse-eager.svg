<svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before-after comparison of orElse versus orElseGet on findActiveBonus(clientId). Left panel, EAGER orElse: computeDefaultBonus() is evaluated first as a method argument regardless of outcome, triggering a FundsLedger read, before findActiveBonus(clientId) returns Optional of Bonus 42.00 and orElse discards the already-computed default because a value is present. Right panel, LAZY orElseGet: findActiveBonus(clientId) returns Optional of Bonus 42.00, orElseGet sees the value is present and never invokes the supplier, so computeDefaultBonus() is only reached on a dotted only-on-empty branch that is not taken here, and the result is Bonus 42.00. An annotation panel reports the cost over 380,000 monthly active clients: orElse triggers 380,000 unconditional computeDefaultBonus calls and 380,000 avoidable FundsLedger reads, while orElseGet triggers zero calls when the Optional is present, measured on JDK 21.0.7.">
  <defs>
    <marker id="arrow086flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow086red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrow086dotted" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="760" fill="#ffffff"/>

  <text x="20" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2937">orElse evaluates eagerly</text>
  <line x1="0" y1="42" x2="1120" y2="42" stroke="#d1d5db" stroke-width="1"/>

  <line x1="560" y1="50" x2="560" y2="410" stroke="#d1d5db" stroke-width="1.6"/>

  <!-- LEFT PANEL -->
  <text x="30" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">EAGER — orElse</text>
  <text x="30" y="88" font-family="sans-serif" font-size="12" fill="#4b5563">findActiveBonus(clientId).orElse(computeDefaultBonus())</text>

  <rect x="40" y="105" width="480" height="55" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" rx="4"/>
  <text x="280" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">computeDefaultBonus()</text>
  <text x="280" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">argument evaluated FIRST — always</text>

  <path d="M280 160 V180" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow086red)"/>

  <rect x="40" y="180" width="480" height="55" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" rx="4"/>
  <text x="280" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FundsLedger read</text>
  <text x="280" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">hits the ledger even when unused</text>

  <path d="M280 235 V255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow086flow)"/>

  <rect x="40" y="255" width="480" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" rx="4"/>
  <text x="280" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">findActiveBonus(clientId)</text>
  <text x="280" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">returns Optional[Bonus 42.00]</text>

  <path d="M280 310 V330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow086flow)"/>

  <rect x="40" y="330" width="480" height="60" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" rx="4"/>
  <text x="280" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">orElse</text>
  <text x="280" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">value present — the computed default is discarded</text>

  <!-- RIGHT PANEL -->
  <text x="590" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LAZY — orElseGet</text>
  <text x="590" y="88" font-family="sans-serif" font-size="12" fill="#4b5563">findActiveBonus(clientId).orElseGet(this::computeDefaultBonus)</text>

  <rect x="600" y="105" width="480" height="55" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" rx="4"/>
  <text x="840" y="128" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">findActiveBonus(clientId)</text>
  <text x="840" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">returns Optional[Bonus 42.00]</text>

  <path d="M840 160 V180" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow086flow)"/>

  <rect x="600" y="180" width="480" height="55" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" rx="4"/>
  <text x="840" y="203" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">orElseGet</text>
  <text x="840" y="223" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">value present — supplier never invoked</text>

  <path d="M840 235 V330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow086flow)"/>

  <circle cx="840" cy="270" r="3" fill="#9ca3af"/>
  <path d="M840 270 H880" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow086dotted)"/>
  <text x="830" y="260" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4b5563">only on empty</text>

  <rect x="880" y="255" width="210" height="55" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 3" rx="4"/>
  <text x="985" y="278" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">computeDefaultBonus()</text>
  <text x="985" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">not called</text>

  <rect x="600" y="330" width="480" height="55" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" rx="4"/>
  <text x="840" y="363" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Bonus 42.00</text>

  <!-- Annotation panel -->
  <rect x="10" y="430" width="1100" height="170" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" rx="4"/>
  <text x="30" y="453" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">Cost at 380k monthly active clients</text>
  <text x="30" y="476" font-family="sans-serif" font-size="11" fill="#1f2937">orElse:    380,000 x 1 = 380,000 computeDefaultBonus calls</text>
  <text x="30" y="496" font-family="sans-serif" font-size="11" fill="#1f2937">orElseGet:                       0 calls when the Optional is present</text>
  <text x="30" y="516" font-family="sans-serif" font-size="11" fill="#1f2937">avoidable FundsLedger reads: 380,000 per pass</text>
  <text x="30" y="536" font-family="sans-serif" font-size="11" fill="#1f2937">Measured on JDK 21.0.7: orElse on a PRESENT Optional -&gt; computeDefaultBonus calls = 1; orElseGet -&gt; 0</text>

  <!-- Legend -->
  <line x1="0" y1="620" x2="1120" y2="620" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="638" width="14" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" rx="2"/>
  <text x="40" y="649" font-family="sans-serif" font-size="11" fill="#1f2937">Optional lookup</text>

  <rect x="300" y="638" width="14" height="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" rx="2"/>
  <text x="320" y="649" font-family="sans-serif" font-size="11" fill="#1f2937">eager argument evaluation</text>

  <rect x="580" y="638" width="14" height="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.6" rx="2"/>
  <text x="600" y="649" font-family="sans-serif" font-size="11" fill="#1f2937">value present / resolved</text>

  <rect x="860" y="638" width="14" height="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" rx="2"/>
  <text x="880" y="649" font-family="sans-serif" font-size="11" fill="#1f2937">unwanted side effect</text>

  <rect x="20" y="670" width="14" height="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="3 2" rx="2"/>
  <text x="40" y="681" font-family="sans-serif" font-size="11" fill="#1f2937">skipped supplier call</text>

  <rect x="300" y="670" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" rx="2"/>
  <text x="320" y="681" font-family="sans-serif" font-size="11" fill="#1f2937">cost annotation panel</text>

  <line x1="580" y1="677" x2="610" y2="677" stroke="#475569" stroke-width="2" marker-end="url(#arrow086flow)"/>
  <text x="620" y="681" font-family="sans-serif" font-size="11" fill="#1f2937">normal evaluation flow</text>

  <line x1="20" y1="704" x2="50" y2="704" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow086red)"/>
  <text x="60" y="708" font-family="sans-serif" font-size="11" fill="#1f2937">eager side-effect trigger</text>

  <line x1="300" y1="704" x2="330" y2="704" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow086dotted)"/>
  <text x="340" y="708" font-family="sans-serif" font-size="11" fill="#1f2937">branch not taken — only on empty</text>
</svg>
