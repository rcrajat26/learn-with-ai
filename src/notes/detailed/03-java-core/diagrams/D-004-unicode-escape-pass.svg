<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three frames showing that unicode escapes are processed before tokenisation: a raw six-character escape backslash u 0 0 0 A inside a line comment about the 14-day coupon window is translated into a real line terminator before any token exists, after which the tokeniser sees stake(); as live code outside the comment">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">Unicode escapes are processed before tokenisation</text>

  <!-- pipeline banner -->
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="40" y="45" width="180" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="130" y="65" text-anchor="middle">escape translation</text>
    <line x1="220" y1="60" x2="290" y2="60" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
    <rect x="295" y="45" width="180" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="385" y="65" text-anchor="middle">line terminators</text>
    <line x1="475" y1="60" x2="545" y2="60" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
    <rect x="550" y="45" width="140" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="620" y="65" text-anchor="middle">tokens</text>
  </g>
  <rect x="230" y="88" width="440" height="20" rx="3" fill="#e5e7eb"/>
  <text x="450" y="103" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pass order: escape translation &#8594; line terminators &#8594; tokens</text>

  <!-- divider -->
  <line x1="20" y1="120" x2="880" y2="120" stroke="#737373" stroke-width="1"/>

  <!-- FRAME 1 -->
  <rect x="40" y="140" width="110" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="95" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1</text>
  <text x="170" y="158" font-family="sans-serif" font-size="13" fill="#1f2937">raw source characters — no tokens exist yet</text>

  <rect x="30" y="185" width="820" height="90" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="45" y="220" font-family="monospace" font-size="14" fill="#1f2937">// 14-day coupon window </text>

  <!-- six literal escape characters, individual cells -->
  <g font-family="monospace" font-size="14" fill="#1f2937">
    <rect x="255" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="266" y="219" text-anchor="middle">\</text>
    <rect x="278" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="289" y="219" text-anchor="middle">u</text>
    <rect x="301" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="312" y="219" text-anchor="middle">0</text>
    <rect x="324" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="335" y="219" text-anchor="middle">0</text>
    <rect x="347" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="358" y="219" text-anchor="middle">0</text>
    <rect x="370" y="200" width="22" height="26" rx="3" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
    <text x="381" y="219" text-anchor="middle">A</text>
  </g>
  <text x="400" y="220" font-family="monospace" font-size="14" fill="#1f2937">stake();</text>

  <rect x="255" y="235" width="230" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="370" y="249" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">escape written as 6 literal characters</text>

  <text x="45" y="262" font-family="sans-serif" font-size="11" fill="#1f2937">still one character stream: stake(); looks like part of the comment</text>

  <!-- divider -->
  <line x1="20" y1="290" x2="880" y2="290" stroke="#737373" stroke-width="1"/>

  <!-- FRAME 2 -->
  <rect x="40" y="305" width="110" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="95" y="323" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2</text>
  <text x="170" y="323" font-family="sans-serif" font-size="13" fill="#1f2937">the escape becomes a real line terminator, before any token exists</text>

  <rect x="30" y="345" width="820" height="140" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="45" y="380" font-family="monospace" font-size="14" fill="#1f2937">// 14-day coupon window </text>

  <line x1="255" y1="367" x2="300" y2="367" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>
  <rect x="215" y="345" width="80" height="18" rx="3" fill="#fef3c7"/>
  <text x="255" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">translated</text>

  <rect x="305" y="365" width="150" height="26" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="380" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">LF real line terminator</text>

  <line x1="380" y1="391" x2="380" y2="415" stroke="#737373" stroke-width="2"/>
  <line x1="380" y1="415" x2="45" y2="415" stroke="#737373" stroke-width="2" marker-end="url(#arrow4)"/>

  <text x="45" y="450" font-family="monospace" font-size="14" fill="#1f2937">stake();</text>
  <rect x="140" y="432" width="280" height="20" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="280" y="446" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">now the start of its own source line — still no token</text>

  <!-- divider -->
  <line x1="20" y1="500" x2="880" y2="500" stroke="#737373" stroke-width="1"/>

  <!-- FRAME 3 -->
  <rect x="40" y="515" width="110" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="95" y="533" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3</text>
  <text x="170" y="533" font-family="sans-serif" font-size="13" fill="#1f2937">the tokeniser sees stake(); as live code outside the comment</text>

  <rect x="30" y="555" width="820" height="180" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>

  <rect x="45" y="575" width="290" height="30" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="190" y="595" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">// 14-day coupon window</text>
  <rect x="345" y="575" width="60" height="30" rx="5" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="375" y="595" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LF</text>
  <text x="45" y="622" font-family="sans-serif" font-size="11" fill="#1f2937">token: LineComment (ends at the real line terminator)</text>

  <g font-family="monospace" font-size="13" fill="#1f2937">
    <rect x="45" y="650" width="70" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="80" y="670" text-anchor="middle">stake</text>
    <rect x="120" y="650" width="30" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="135" y="670" text-anchor="middle">(</text>
    <rect x="155" y="650" width="30" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="170" y="670" text-anchor="middle">)</text>
    <rect x="190" y="650" width="30" height="30" rx="5" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
    <text x="205" y="670" text-anchor="middle">;</text>
  </g>
  <text x="45" y="700" font-family="sans-serif" font-size="11" fill="#1f2937">tokens: identifier stake, (, ), ; — live code, not comment text</text>
  <rect x="450" y="650" width="380" height="30" rx="5" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="640" y="670" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">stake(); now runs — it is outside the comment</text>
</svg>
