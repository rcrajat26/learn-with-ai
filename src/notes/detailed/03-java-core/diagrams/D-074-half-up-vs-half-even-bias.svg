<svg viewBox="0 0 1100 1120" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Cost-curve chart comparing HALF_UP versus HALF_EVEN rounding bias over 1,000,000 exact .xx5 bonus-split ties, measured on JDK 21.0.7 with seed 42. HALF_UP is a perfectly straight line from (0,0) to (1,000,000 roundings, +500,000 cents), because every tie rounds away from zero adding exactly 0.005 units each time. HALF_EVEN oscillates and never leaves a band of plus or minus 150 cents, so on this chart scale it renders as flat on the zero line; an inset panel with its own y-scale of plus or minus 150 cents plots the same eleven measured points (0, +35, -51, +4, -94, -143, -46, -58, -14, -10, -46 cents at roundings 0 through 1,000,000) to show the real oscillation. A canonical bonus-split example panel shows stake 3.33 times 0.10 equals 0.3330 at scale 4, setScale(2, DOWN) gives 0.33, cash equals 3.33 minus 0.33 equals 3.00, and the two sum back to exactly 3.33; rounding the bonus portion up to 0.34 while cash still takes 3.00 would total 3.34 and create money, which is why the bonus portion always rounds down. Final measured totals: HALF_UP drifts to plus 500,000 cents of created money over a million ties; HALF_EVEN ends at minus 46 cents.">

  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
      .code{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#1f2937;}
      .codeR{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#b91c1c;}
      .codeG{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#15803d;}
    </style>
    <marker id="arr074" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1120" fill="#ffffff"/>

  <text x="20" y="32" class="h1">HALF_UP versus HALF_EVEN over a million roundings</text>
  <line x1="20" y1="42" x2="1080" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="20" y="62" class="h2">CUMULATIVE ROUNDING BIAS OVER 1,000,000 TIES (measured, JDK 21.0.7, seed 42)</text>
  <line x1="20" y1="70" x2="1080" y2="70" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="88" class="small">y: cumulative bias (cents)</text>

  <!-- chart border -->
  <rect x="60" y="100" width="840" height="400" fill="none" stroke="#9ca3af" stroke-width="1.6"/>

  <!-- horizontal gridlines -->
  <line x1="60" y1="133.33" x2="900" y2="133.33" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="200" x2="900" y2="200" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="266.67" x2="900" y2="266.67" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="333.33" x2="900" y2="333.33" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="400" x2="900" y2="400" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="466.67" x2="900" y2="466.67" stroke="#475569" stroke-width="2"/>

  <!-- vertical gridlines -->
  <line x1="228" y1="100" x2="228" y2="500" stroke="#d1d5db" stroke-width="1"/>
  <line x1="396" y1="100" x2="396" y2="500" stroke="#d1d5db" stroke-width="1"/>
  <line x1="564" y1="100" x2="564" y2="500" stroke="#d1d5db" stroke-width="1"/>
  <line x1="732" y1="100" x2="732" y2="500" stroke="#d1d5db" stroke-width="1"/>

  <!-- y tick labels -->
  <text x="52" y="137.33" text-anchor="end" class="small">500,000</text>
  <text x="52" y="204" text-anchor="end" class="small">400,000</text>
  <text x="52" y="270.67" text-anchor="end" class="small">300,000</text>
  <text x="52" y="337.33" text-anchor="end" class="small">200,000</text>
  <text x="52" y="404" text-anchor="end" class="small">100,000</text>
  <text x="52" y="470.67" text-anchor="end" class="small">0</text>

  <!-- x tick labels -->
  <text x="60" y="516" text-anchor="middle" class="small">0</text>
  <text x="228" y="516" text-anchor="middle" class="small">200,000</text>
  <text x="396" y="516" text-anchor="middle" class="small">400,000</text>
  <text x="564" y="516" text-anchor="middle" class="small">600,000</text>
  <text x="732" y="516" text-anchor="middle" class="small">800,000</text>
  <text x="900" y="516" text-anchor="middle" class="small">1,000,000</text>
  <text x="480" y="536" text-anchor="middle" class="small">x: number of bonus-split roundings</text>

  <!-- HALF_UP straight line -->
  <path d="M 60 466.67 L 900 100" fill="none" stroke="#b91c1c" stroke-width="2"/>

  <!-- HALF_EVEN flat-at-this-scale line -->
  <path d="M 60 466.667 L 144 466.644 L 228 466.701 L 312 466.664 L 396 466.730 L 480 466.762 L 564 466.698 L 648 466.706 L 732 466.676 L 816 466.674 L 900 466.698" fill="none" stroke="#15803d" stroke-width="2"/>

  <!-- annotations in open chart area -->
  <rect x="100" y="118" width="10" height="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="118" y="127" class="body">HALF_UP: every tie rounds away from zero &#8594; +0.005 per tie</text>
  <text x="118" y="147" class="body">1,000,000 &#215; 0.005 = 5,000.000 units = 500,000 cents</text>

  <rect x="100" y="172" width="10" height="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="118" y="181" class="body">HALF_EVEN: flat on this scale &#8212; stays inside &#177;150 cents</text>
  <text x="118" y="201" class="small">(see the inset below for the real oscillation)</text>

  <!-- ===================== INSET ===================== -->
  <text x="20" y="560" class="h2">INSET &#8212; HALF_EVEN BIAS ONLY (y-scale &#177;150 cents)</text>
  <line x1="20" y1="568" x2="1080" y2="568" stroke="#d1d5db" stroke-width="1"/>

  <rect x="250" y="580" width="650" height="180" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="290" y="600" width="570" height="110" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <line x1="290" y1="655" x2="860" y2="655" stroke="#475569" stroke-width="2"/>

  <text x="282" y="604" text-anchor="end" class="small">+150</text>
  <text x="282" y="659" text-anchor="end" class="small">0</text>
  <text x="282" y="714" text-anchor="end" class="small">&#8722;150</text>

  <text x="290" y="725" text-anchor="middle" class="small">0</text>
  <text x="404" y="725" text-anchor="middle" class="small">200k</text>
  <text x="518" y="725" text-anchor="middle" class="small">400k</text>
  <text x="632" y="725" text-anchor="middle" class="small">600k</text>
  <text x="746" y="725" text-anchor="middle" class="small">800k</text>
  <text x="860" y="725" text-anchor="middle" class="small">1,000k</text>

  <path d="M 290 655 L 347 642.17 L 404 673.7 L 461 653.53 L 518 689.47 L 575 707.43 L 632 671.87 L 689 676.27 L 746 660.13 L 803 658.67 L 860 671.87" fill="none" stroke="#15803d" stroke-width="2"/>
  <circle cx="290" cy="655" r="2.5" fill="#15803d"/>
  <circle cx="347" cy="642.17" r="2.5" fill="#15803d"/>
  <circle cx="404" cy="673.7" r="2.5" fill="#15803d"/>
  <circle cx="461" cy="653.53" r="2.5" fill="#15803d"/>
  <circle cx="518" cy="689.47" r="2.5" fill="#15803d"/>
  <circle cx="575" cy="707.43" r="2.5" fill="#15803d"/>
  <circle cx="632" cy="671.87" r="2.5" fill="#15803d"/>
  <circle cx="689" cy="676.27" r="2.5" fill="#15803d"/>
  <circle cx="746" cy="660.13" r="2.5" fill="#15803d"/>
  <circle cx="803" cy="658.67" r="2.5" fill="#15803d"/>
  <circle cx="860" cy="671.87" r="2.5" fill="#15803d"/>

  <!-- ===================== EXAMPLE PANEL ===================== -->
  <rect x="40" y="790" width="1020" height="220" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="56" y="812" class="smallb">CANONICAL BONUS SPLIT &#8212; why the bonus portion rounds DOWN</text>

  <rect x="56" y="824" width="988" height="86" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="68" y="846" class="codeG">stake = 3.33 &#8594; &#215; 0.10 = 0.3330 (scale 4) &#8594; setScale(2, DOWN) = 0.33</text>
  <text x="68" y="868" class="codeG">cash = 3.33 &#8722; 0.33 = 3.00&#8194;&#8194;sum = 0.33 + 3.00 = 3.33 (exact)</text>
  <text x="68" y="890" class="small">rounding the bonus DOWN and letting cash absorb the remainder keeps the split exact</text>

  <rect x="56" y="918" width="988" height="42" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="550" y="943" text-anchor="middle" class="codeR">rounding UP to 0.34 while cash still takes 3.00 totals 3.34 &#8212; it creates money</text>

  <text x="56" y="986" class="body">Measured drift over 1,000,000 ties: HALF_UP &#8594; +500,000 cents (5,000.00 units) created; HALF_EVEN &#8594; &#8722;46 cents</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="20" y1="1030" x2="1080" y2="1030" stroke="#d1d5db" stroke-width="1.5"/>

  <line x1="40" y1="1049" x2="64" y2="1049" stroke="#b91c1c" stroke-width="2"/>
  <text x="72" y="1053" class="small">HALF_UP cumulative bias (straight line)</text>

  <line x1="380" y1="1049" x2="404" y2="1049" stroke="#15803d" stroke-width="2"/>
  <text x="412" y="1053" class="small">HALF_EVEN cumulative bias (flat at this scale)</text>

  <rect x="720" y="1042" width="18" height="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="746" y="1054" class="small">neutral panel (inset / example container)</text>

  <rect x="40" y="1066" width="18" height="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="66" y="1078" class="small">exact arithmetic (canonical split)</text>

  <rect x="380" y="1066" width="18" height="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="406" y="1078" class="small">creates-money warning</text>

  <line x1="720" y1="1073" x2="744" y2="1073" stroke="#d1d5db" stroke-width="1"/>
  <text x="752" y="1078" class="small">axis gridline</text>

</svg>
