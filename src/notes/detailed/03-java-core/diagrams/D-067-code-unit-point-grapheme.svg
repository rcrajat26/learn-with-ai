<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Code unit, code point, grapheme cluster for a client display name Zoe with combining acute and a game die emoji: UTF-16 code units give length 6, code points give codePointCount 5, grapheme clusters give the 4 characters a user perceives; charAt(4) returns an unusable lone high surrogate">

  <rect x="20" y="20" width="760" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Code unit, code point, grapheme cluster</text>

  <rect x="60" y="70" width="660" height="26" rx="4" fill="#fef3c7"/>
  <text x="390" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ClientDisplayName: Zoe + U+0301 combining acute, then U+1F3B2 game die</text>

  <!-- ROW 1: UTF-16 code units -->
  <rect x="60" y="120" width="220" height="22" rx="3" fill="#dbeafe"/>
  <text x="170" y="136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">UTF-16 code units (length() == 6)</text>

  <rect x="60" y="150" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="115" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Z</text>
  <rect x="170" y="150" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">o</text>
  <rect x="280" y="150" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="335" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">e</text>
  <rect x="390" y="150" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="445" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">U+0301</text>
  <rect x="500" y="150" width="110" height="50" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="555" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">U+D83C</text>
  <text x="555" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">high surrogate</text>
  <rect x="610" y="150" width="110" height="50" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="665" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">U+DFB2</text>
  <text x="665" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">low surrogate</text>

  <!-- charAt(4) callout -->
  <line x1="555" y1="200" x2="555" y2="222" stroke="#525252" stroke-width="2"/>
  <rect x="440" y="222" width="230" height="42" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="555" y="238" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">charAt(4) returns lone high</text>
  <text x="555" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">surrogate \uD83C - unusable alone</text>

  <!-- ROW 2: code points -->
  <rect x="60" y="284" width="260" height="22" rx="3" fill="#dbeafe"/>
  <text x="190" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">code points (codePointCount(0,6) == 5)</text>

  <rect x="60" y="314" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="115" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Z</text>
  <rect x="170" y="314" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">o</text>
  <rect x="280" y="314" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="335" y="344" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">e</text>
  <rect x="390" y="314" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="445" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">U+0301</text>
  <rect x="500" y="314" width="220" height="50" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="610" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">U+1F3B2</text>
  <text x="610" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">surrogate pair -&gt; one code point</text>

  <!-- ROW 3: grapheme clusters -->
  <rect x="60" y="398" width="330" height="22" rx="3" fill="#dbeafe"/>
  <text x="225" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">grapheme clusters, what the user perceives (4)</text>

  <rect x="60" y="428" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="115" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Z</text>
  <rect x="170" y="428" width="110" height="50" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="458" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">o</text>
  <rect x="280" y="428" width="220" height="50" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="390" y="450" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">e (U+0301) = e-acute</text>
  <text x="390" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">one perceived character</text>
  <rect x="500" y="428" width="220" height="50" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="610" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">game die</text>
  <text x="610" y="468" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">one perceived character</text>
</svg>
