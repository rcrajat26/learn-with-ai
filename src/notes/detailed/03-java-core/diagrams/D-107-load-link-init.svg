  <rect x="440" y="881" width="60" height="22" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="470" y="896" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">null</text>
  <line x1="520" y1="896" x2="600" y2="896" stroke="#b45309" stroke-width="2" marker-end="url(#arrow107amber)"/>
  <text x="560" y="888" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">&lt;clinit&gt; writes</text>
  <rect x="620" y="881" width="140" height="22" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="690" y="896" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">populated</text>

  <!-- ============ ANNOTATION PANEL ============ -->
  <rect x="80" y="970" width="960" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="100" y="992" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">&lt;clinit&gt; VERSUS &lt;init&gt; IN A STACK TRACE</text>
  <text x="100" y="1014" font-family="sans-serif" font-size="11" fill="#1f2937">at BonusRules.&lt;clinit&gt;(BonusRules.java:12)</text>
  <text x="100" y="1034" font-family="sans-serif" font-size="11" fill="#4b5563">&#8212; the static initializer: runs once, takes no arguments, never called from your source</text>
  <text x="100" y="1054" font-family="sans-serif" font-size="11" fill="#1f2937">at BonusRules.&lt;init&gt;(BonusRules.java:31)</text>
  <text x="100" y="1074" font-family="sans-serif" font-size="11" fill="#4b5563">&#8212; the constructor: runs per instance, invoked by the invokespecial bytecode instruction</text>
  <text x="100" y="1094" font-family="sans-serif" font-size="11" fill="#1f2937">&lt;clinit&gt; is synthesized by javac from static field initializers + static blocks, in textual order</text>
  <text x="100" y="1114" font-family="sans-serif" font-size="11" fill="#1f2937">&lt;clinit&gt; is invoked directly by the JVM during class initialization &#8212; never by an instruction in your class</text>

  <!-- ============ LEGEND ============ -->
  <text x="80" y="1174" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="80" y1="1182" x2="1040" y2="1182" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="90" y="1190" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="118" y="1203" font-family="sans-serif" font-size="11" fill="#4b5563">raw bytes / default value (0, null) &#8212; not yet real</text>

  <rect x="90" y="1216" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="118" y="1229" font-family="sans-serif" font-size="11" fill="#4b5563">Class&lt;BonusRules&gt; object / a linking sub-step</text>

  <rect x="90" y="1242" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="118" y="1255" font-family="sans-serif" font-size="11" fill="#4b5563">&lt;clinit&gt; executing &#8212; the write in progress</text>

  <rect x="610" y="1190" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="638" y="1203" font-family="sans-serif" font-size="11" fill="#4b5563">field value after &lt;clinit&gt; runs &#8212; concrete, final</text>

  <rect x="610" y="1216" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="638" y="1229" font-family="sans-serif" font-size="11" fill="#4b5563">annotation panel &#8212; explanatory prose</text>

  <line x1="610" y1="1250" x2="632" y2="1250" stroke="#475569" stroke-width="2" marker-end="url(#arrow107)"/>
  <text x="638" y="1255" font-family="sans-serif" font-size="11" fill="#4b5563">flow / sequence (structural edge)</text>
</svg>
