<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline comparing System.currentTimeMillis, which shows a negative elapsed time after an NTP correction jumps the wall clock backwards during a CardPayments capture, against System.nanoTime, which shows the correct monotonic 180 millisecond elapsed value">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="860" height="34" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">nanoTime versus currentTimeMillis: measuring a CardPayments capture</text>

  <!-- Real time axis -->
  <line x1="60" y1="90" x2="840" y2="90" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="80" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">real time</text>

  <line x1="180" y1="80" x2="180" y2="100" stroke="#737373" stroke-width="2"/>
  <rect x="90" y="104" width="180" height="20" rx="3" fill="#e5e7eb"/>
  <text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">capture start (t0)</text>

  <line x1="700" y1="80" x2="700" y2="100" stroke="#737373" stroke-width="2"/>
  <rect x="610" y="104" width="180" height="20" rx="3" fill="#e5e7eb"/>
  <text x="700" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">capture end (t1), 180ms later</text>

  <!-- NTP correction marker mid-interval -->
  <line x1="440" y1="80" x2="440" y2="100" stroke="#525252" stroke-width="2"/>
  <rect x="330" y="128" width="220" height="46" rx="4" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="440" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">NTP correction:</text>
  <text x="440" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">wall clock jumps back 250 ms</text>

  <!-- Track 1: currentTimeMillis -->
  <rect x="60" y="200" width="200" height="26" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="160" y="218" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">System.currentTimeMillis()</text>

  <rect x="90" y="234" width="180" height="24" rx="3" fill="#fee2e2"/>
  <text x="180" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">t0 = 1,764,000,000,300 ms</text>

  <line x1="180" y1="258" x2="180" y2="90" stroke="#737373" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="610" y="234" width="180" height="24" rx="3" fill="#fee2e2"/>
  <text x="700" y="250" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">t1 = 1,764,000,000,230 ms</text>

  <line x1="700" y1="258" x2="700" y2="90" stroke="#737373" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="330" y="270" width="240" height="40" rx="4" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="450" y="288" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">elapsed = t1 - t0 = -70 ms</text>
  <text x="450" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">negative duration for a real 180 ms capture</text>

  <rect x="60" y="320" width="740" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="339" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">epoch meaning: milliseconds since 1970-01-01T00:00:00Z, adjustable, can jump backwards</text>

  <!-- Track 2: nanoTime -->
  <rect x="60" y="380" width="200" height="26" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="160" y="398" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">System.nanoTime()</text>

  <rect x="90" y="414" width="180" height="24" rx="3" fill="#dcfce7"/>
  <text x="180" y="430" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">n0 = 812,455,001,000 ns</text>

  <rect x="610" y="414" width="180" height="24" rx="3" fill="#dcfce7"/>
  <text x="700" y="430" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">n1 = 812,635,001,000 ns</text>

  <rect x="320" y="450" width="260" height="40" rx="4" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="450" y="468" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">elapsed = n1 - n0 = 180,000,000 ns</text>
  <text x="450" y="484" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">= 180 ms (matches PSP capture p50 180ms)</text>

  <rect x="60" y="500" width="740" height="28" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="430" y="519" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">epoch meaning: no epoch meaning; monotonic; only differences are valid</text>
</svg>
