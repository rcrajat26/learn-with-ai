<svg viewBox="0 0 1200 920" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Byte layout of Movement.class: magic 0xCAFEBABE, versions, constant pool entries, access flags, this/super class, interfaces, fields, methods, attributes, plus the major-version table and UnsupportedClassVersionError">
  <defs>
    <marker id="arrow091" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="600" y="45" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Movement.class — byte layout</text>

  <!-- LEFT COLUMN: main byte stack -->
  <!-- Row 1: magic -->
  <rect x="30" y="80" width="480" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="45" y="96" font-family="monospace" font-size="11" fill="#1f2937">0x00</text>
  <text x="150" y="96" font-family="sans-serif" font-size="12" fill="#1f2937">magic</text>
  <text x="490" y="96" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">4 bytes</text>
  <text x="150" y="112" font-family="monospace" font-size="12" fill="#1f2937">0xCAFEBABE</text>

  <!-- Row 2: minor_version -->
  <rect x="30" y="124" width="480" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="45" y="140" font-family="monospace" font-size="11" fill="#1f2937">0x04</text>
  <text x="150" y="140" font-family="sans-serif" font-size="12" fill="#1f2937">minor_version</text>
  <text x="490" y="140" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">2 bytes</text>
  <text x="150" y="156" font-family="monospace" font-size="12" fill="#1f2937">0</text>

  <!-- Row 3: major_version -->
  <rect x="30" y="168" width="480" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="45" y="184" font-family="monospace" font-size="11" fill="#1f2937">0x06</text>
  <text x="150" y="184" font-family="sans-serif" font-size="12" fill="#1f2937">major_version</text>
  <text x="490" y="184" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">2 bytes</text>
  <text x="150" y="200" font-family="monospace" font-size="12" fill="#1f2937">65 (Java 21)</text>

  <!-- Row 4: constant_pool_count -->
  <rect x="30" y="212" width="480" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="45" y="228" font-family="monospace" font-size="11" fill="#1f2937">0x08</text>
  <text x="150" y="228" font-family="sans-serif" font-size="12" fill="#1f2937">constant_pool_count</text>
  <text x="490" y="228" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">2 bytes</text>
  <text x="150" y="244" font-family="monospace" font-size="12" fill="#1f2937">41</text>

  <!-- Row 5: constant_pool[] -->
  <rect x="30" y="256" width="480" height="40" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="45" y="272" font-family="monospace" font-size="11" fill="#1f2937">0x0A</text>
  <text x="150" y="272" font-family="sans-serif" font-size="12" fill="#1f2937">constant_pool[]</text>
  <text x="490" y="272" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">N bytes</text>
  <text x="150" y="288" font-family="sans-serif" font-size="11" fill="#1f2937">variable — expanded in panel to the right</text>

