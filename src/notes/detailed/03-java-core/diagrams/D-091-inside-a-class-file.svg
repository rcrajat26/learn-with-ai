  <text x="45" y="316" font-family="monospace" font-size="11" fill="#1f2937">0x0A+N</text>
  <text x="150" y="316" font-family="sans-serif" font-size="12" fill="#1f2937">access_flags</text>
  <text x="490" y="316" text-anchor="end" font-family="sans-serif" font-size="11" fill="#1f2937">2 bytes</text>
  <text x="150" y="332" font-family="monospace" font-size="11" fill="#1f2937">0x0031 ACC_PUBLIC | ACC_FINAL | ACC_SUPER</text>

