<svg viewBox="0 0 800 1150" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flowchart of java.lang.String.equals: reference identity check, instanceof String pattern match, coder equality check, then raw byte array comparison, with early-exit branches at each step, illustrated with QuizStakes status-code strings">

  <defs>
    <marker id="arrow96" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">String.equals, line by line (JDK 21, java.lang.String)</text>

  <!-- Node 1 -->
  <rect x="90" y="80" width="320" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">1. if (this == anObject) return true;</text>
  <text x="250" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">reference identity check</text>
  <text x="250" y="138" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String.java ~line 1130</text>

  <line x1="410" y1="115" x2="520" y2="105" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>
  <rect x="428" y="86" width="60" height="20" rx="3" fill="#fef3c7"/>
  <text x="458" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">true</text>

  <rect x="520" y="80" width="230" height="50" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="635" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">return true</text>
  <text x="635" y="116" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">same object reference</text>

  <line x1="250" y1="150" x2="250" y2="190" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>

  <!-- Node 2 -->
  <rect x="90" y="190" width="320" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">2. if (anObject instanceof</text>
  <text x="250" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">String aString)</text>
  <text x="250" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">pattern-matching instanceof, ~line 1133</text>

  <line x1="410" y1="225" x2="520" y2="215" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>
  <rect x="420" y="196" width="70" height="20" rx="3" fill="#fef3c7"/>
  <text x="455" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">no match</text>

  <rect x="520" y="190" width="230" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="635" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">return false</text>
  <text x="635" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">anObject is not a String</text>

  <line x1="250" y1="260" x2="250" y2="300" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>

  <!-- Node 3 -->
  <rect x="90" y="300" width="320" height="70" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="322" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">3. if (coder() == aString.coder())</text>
  <text x="250" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">coder equality check</text>
  <text x="250" y="356" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String.java ~line 1136</text>

  <line x1="410" y1="335" x2="520" y2="325" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>
  <rect x="420" y="306" width="70" height="20" rx="3" fill="#fef3c7"/>
  <text x="455" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">differ</text>

  <rect x="520" y="300" width="230" height="50" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="635" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">return false</text>
  <text x="635" y="336" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LATIN1 vs UTF16, never equal</text>

  <line x1="250" y1="370" x2="250" y2="410" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>

  <!-- Node 4 -->
  <rect x="70" y="410" width="360" height="90" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="250" y="432" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">4. return isLatin1()</text>
  <text x="250" y="448" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">? StringLatin1.equals(value, aString.value)</text>
  <text x="250" y="463" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">: StringUTF16.equals(value, aString.value);</text>
  <text x="250" y="480" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">raw byte[] comparison, ~line 1137</text>

  <line x1="250" y1="500" x2="250" y2="540" stroke="#737373" stroke-width="2" marker-end="url(#arrow96)"/>

  <rect x="130" y="540" width="240" height="50" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="250" y="560" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">result = byte-for-byte</text>
  <text x="250" y="576" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">content comparison</text>

  <!-- Note box -->
  <rect x="40" y="620" width="720" height="120" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="60" y="644" font-family="sans-serif" font-size="13" fill="#1f2937">Why different coders can never be equal:</text>
  <text x="60" y="664" font-family="sans-serif" font-size="11" fill="#1f2937">With COMPACT_STRINGS enabled, a String is stored LATIN1 if and only if every</text>
  <text x="60" y="682" font-family="sans-serif" font-size="11" fill="#1f2937">character fits in one byte; otherwise it is stored UTF16. So a LATIN1 string</text>
  <text x="60" y="700" font-family="sans-serif" font-size="11" fill="#1f2937">and a UTF16 string differ in at least one character by construction &#8212; the</text>
  <text x="60" y="718" font-family="sans-serif" font-size="11" fill="#1f2937">coder() check at step 3 is a cheap, always-correct early exit.</text>

  <!-- Examples panel -->
  <rect x="20" y="770" width="760" height="30" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="790" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Examples</text>

  <rect x="40" y="815" width="720" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="60" y="838" font-family="sans-serif" font-size="12" fill="#1f2937">"AA-801 ACTIVATED" .equals(itself)</text>
  <text x="60" y="858" font-family="sans-serif" font-size="11" fill="#1f2937">exits at step 1: this == anObject is true (same reference)</text>
  <text x="60" y="876" font-family="sans-serif" font-size="11" fill="#1f2937">result: true</text>

  <rect x="40" y="915" width="720" height="90" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="60" y="938" font-family="sans-serif" font-size="12" fill="#1f2937">"AA-801 ACTIVATED" .equals(same text read fresh from a database row)</text>
  <text x="60" y="958" font-family="sans-serif" font-size="11" fill="#1f2937">different reference, both LATIN1 &#8212; falls through to step 4, byte compare matches</text>
  <text x="60" y="976" font-family="sans-serif" font-size="11" fill="#1f2937">result: true</text>

  <rect x="40" y="1015" width="720" height="90" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="60" y="1038" font-family="sans-serif" font-size="12" fill="#1f2937">"AA-801 ACTIVATED" .equals(client display name containing a non-Latin-1 character, e.g. an accented letter)</text>
  <text x="60" y="1058" font-family="sans-serif" font-size="11" fill="#1f2937">display name is stored UTF16 &#8212; exits at step 3: coder() mismatch</text>
  <text x="60" y="1076" font-family="sans-serif" font-size="11" fill="#1f2937">result: false</text>

</svg>
