<svg viewBox="0 0 1120 1400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Six-frame sequence showing the full initialization order of new BankWithdrawalTransaction(...), where BankWithdrawalTransaction extends WithdrawalTransaction, tracking four fields: WithdrawalTransaction.amount, WithdrawalTransaction.status, BankWithdrawalTransaction.dailyCap, and BankWithdrawalTransaction.run. Frame 1: allocation zeroes every field to null. Frame 2: WithdrawalTransaction's field initializers run, setting status to PENDING. Frame 3: WithdrawalTransaction's constructor body runs, setting amount to 260.00 GBP, then calls the overridable validate(). Frame 4, drawn in the failure palette: dynamic dispatch sends that call to BankWithdrawalTransaction's override of validate(), which runs while dailyCap and run are still null; the override's read dailyCap.compareTo(amount) on a null dailyCap throws NullPointerException. Frame 5: BankWithdrawalTransaction's field initializers run, setting dailyCap to LimitSet(dailyDeposit=500, maxStake=50, monthlyLoss=1000). Frame 6: BankWithdrawalTransaction's own constructor body runs, setting run to PaymentRun#PR-20260829-0007. Each frame highlights in amber the field that changed since the previous frame and shows already-set fields in green as stable.">
  <defs>
    <marker id="arrow038" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1400" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">The full initialization order of a new BankWithdrawalTransaction(...)</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="560" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">class BankWithdrawalTransaction extends WithdrawalTransaction</text>

  <!-- ============ FRAME 1 ============ -->
  <text x="20" y="74" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FRAME 1 &#8212; new BankWithdrawalTransaction(...) allocates and zeroes every field</text>
  <line x1="20" y1="82" x2="1100" y2="82" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="98" font-family="sans-serif" font-size="12" fill="#4b5563">Raw storage is allocated; every declared field, on both classes, is zeroed to its default (null) before any code runs.</text>

  <rect x="210" y="104" width="700" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="121" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state</text>
  <rect x="218" y="132" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="149" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = null</text>
  <rect x="218" y="160" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="177" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = null</text>
  <rect x="218" y="188" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="205" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = null</text>
  <rect x="218" y="216" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="233" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = null</text>

  <!-- ============ FRAME 2 ============ -->
  <text x="20" y="262" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FRAME 2 &#8212; superclass field initializers (WithdrawalTransaction)</text>
  <line x1="20" y1="270" x2="1100" y2="270" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="286" font-family="sans-serif" font-size="12" fill="#4b5563">WithdrawalTransaction's field initializers run before its constructor body. status is set to PENDING here.</text>

  <rect x="210" y="292" width="700" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="309" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state</text>
  <rect x="218" y="320" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="337" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = null</text>
  <rect x="218" y="348" width="684" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="226" y="365" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = PENDING</text>
  <rect x="218" y="376" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="393" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = null</text>
  <rect x="218" y="404" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="421" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = null</text>

  <!-- ============ FRAME 3 ============ -->
  <text x="20" y="450" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FRAME 3 &#8212; superclass constructor body runs, and calls validate()</text>
  <line x1="20" y1="458" x2="1100" y2="458" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="474" font-family="sans-serif" font-size="11" fill="#4b5563">WithdrawalTransaction's constructor body sets amount = 260.00 GBP, then calls the overridable validate().</text>

  <rect x="210" y="480" width="700" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state</text>
  <rect x="218" y="508" width="684" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="226" y="525" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = 260.00 GBP</text>
  <rect x="218" y="536" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="553" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = PENDING</text>
  <rect x="218" y="564" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="581" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = null</text>
  <rect x="218" y="592" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="609" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = null</text>

  <!-- ============ FRAME 4 (FAILURE) ============ -->
  <text x="20" y="638" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">FRAME 4 &#8212; the OVERRIDE runs with subclass fields still null</text>
  <line x1="20" y1="646" x2="1100" y2="646" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="662" font-family="sans-serif" font-size="11" fill="#4b5563">Dynamic dispatch sends validate() to BankWithdrawalTransaction's override, since the runtime class is BankWithdrawalTransaction.</text>
  <text x="20" y="678" font-family="sans-serif" font-size="11" fill="#4b5563">But BankWithdrawalTransaction's own field initializers have not run yet &#8212; dailyCap and run are still null here.</text>

  <rect x="210" y="684" width="700" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="560" y="701" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state (inside the override)</text>
  <rect x="218" y="712" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="729" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = 260.00 GBP</text>
  <rect x="218" y="740" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="757" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = PENDING</text>
  <rect x="218" y="768" width="684" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="226" y="785" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = null</text>
  <rect x="218" y="796" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="813" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = null</text>

  <text x="560" y="838" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">dailyCap.compareTo(amount) on a null dailyCap -&gt; NullPointerException</text>

  <!-- ============ FRAME 5 ============ -->
  <text x="20" y="878" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FRAME 5 &#8212; subclass field initializers and instance blocks (BankWithdrawalTransaction)</text>
  <line x1="20" y1="886" x2="1100" y2="886" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="902" font-family="sans-serif" font-size="11" fill="#4b5563">Control returns to BankWithdrawalTransaction. Its own field initializers run next, before its constructor body. dailyCap is set here.</text>

  <rect x="210" y="908" width="700" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="925" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state</text>
  <rect x="218" y="936" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="953" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = 260.00 GBP</text>
  <rect x="218" y="964" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="981" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = PENDING</text>
  <rect x="218" y="992" width="684" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="226" y="1009" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = LimitSet(dailyDeposit=500, maxStake=50, monthlyLoss=1000)</text>
  <rect x="218" y="1020" width="684" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="226" y="1037" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = null</text>

  <!-- ============ FRAME 6 ============ -->
  <text x="20" y="1066" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">FRAME 6 &#8212; subclass constructor body (BankWithdrawalTransaction)</text>
  <line x1="20" y1="1074" x2="1100" y2="1074" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="1090" font-family="sans-serif" font-size="12" fill="#4b5563">BankWithdrawalTransaction's own constructor body executes last, after every initializer on both classes. It sets run.</text>

  <rect x="210" y="1096" width="700" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="1113" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">BankWithdrawalTransaction instance &#8212; field state</text>
  <rect x="218" y="1124" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="1141" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.amount = 260.00 GBP</text>
  <rect x="218" y="1152" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="1169" font-family="sans-serif" font-size="12" fill="#1f2937">WithdrawalTransaction.status = PENDING</text>
  <rect x="218" y="1180" width="684" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="226" y="1197" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.dailyCap = LimitSet(dailyDeposit=500, maxStake=50, monthlyLoss=1000)</text>
  <rect x="218" y="1208" width="684" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="226" y="1225" font-family="sans-serif" font-size="12" fill="#1f2937">BankWithdrawalTransaction.run = PaymentRun#PR-20260829-0007</text>

  <!-- ============ LEGEND ============ -->
  <text x="20" y="1264" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="20" y1="1272" x2="1100" y2="1272" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="1286" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="58" y="1299" font-family="sans-serif" font-size="11" fill="#4b5563">field still at its default (null) &#8212; not yet initialized</text>

  <rect x="30" y="1310" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="58" y="1323" font-family="sans-serif" font-size="11" fill="#4b5563">field written in THIS frame &#8212; what changed since the previous frame</text>

  <rect x="600" y="1286" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="628" y="1299" font-family="sans-serif" font-size="11" fill="#4b5563">field written in an earlier frame &#8212; stable, unchanged this frame</text>

  <rect x="600" y="1310" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="628" y="1323" font-family="sans-serif" font-size="11" fill="#4b5563">the failure frame &#8212; a still-null subclass field read by the override, causing NullPointerException</text>
</svg>
