<svg viewBox="0 0 1040 860" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flowchart of the Movement value class taken through five immutability gates in order. Gate 1: final class Movement, which blocks a MutableMovement subclass from overriding an accessor to return a changing value. Gate 2: private final fields, which blocks both movement.amount = ... direct field writes from outside and non-final field reassignment from inside. Gate 3: no mutators, which blocks a setAmount(Money) or addEntry(LedgerEntry) method from existing. Gate 4: defensive copy in, List.copyOf(entries) taken inside the constructor, which blocks the caller from keeping its own reference to the passed-in list and mutating it afterward. Gate 5: defensive copy or unmodifiable view out, which blocks a caller from calling movement.entries().add(...) on the returned collection. Each gate sits in the main vertical flow from the candidate Movement class down to a final immutable outcome box; each gate has a degraded box to its right showing the specific bug it stops, connected by a dotted rejected-path arrow pointing into the gate.">
  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
    </style>
    <marker id="arr069" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="blk069" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="860" fill="#ffffff"/>

  <text x="20" y="32" class="h1">The five immutability rules &#8212; Movement taken through each gate in order</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- SUBJECT -->
  <rect x="310" y="54" width="360" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="326" y="76" class="h2">Movement &#8212; value class (candidate)</text>
  <text x="326" y="94" class="small">fields, constructor, accessors under review</text>

  <path d="M 490 104 V 124" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- GATE 1 -->
  <rect x="310" y="124" width="360" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="326" y="144" class="h2">GATE 1 &#8212; final class Movement</text>
  <text x="326" y="164" class="small">declared final: the class cannot be subclassed</text>

  <rect x="740" y="112" width="280" height="78" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="756" y="132" class="smallb">BLOCKS:</text>
  <text x="756" y="150" class="small">a MutableMovement subclass overrides</text>
  <text x="756" y="166" class="small">an accessor to return a changing value</text>

  <path d="M 740 151 H 670" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>

  <path d="M 490 178 V 210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- GATE 2 -->
  <rect x="310" y="210" width="360" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="326" y="230" class="h2">GATE 2 &#8212; private final fields</text>
  <text x="326" y="250" class="small">final: cannot be reassigned once set</text>

  <rect x="740" y="198" width="280" height="104" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="756" y="218" class="smallb">BLOCKS (two ways):</text>
  <text x="756" y="236" class="small">movement.amount = ... direct field</text>
  <text x="756" y="252" class="small">write from outside the class</text>
  <text x="756" y="270" class="small">non-final field reassignment from</text>
  <text x="756" y="286" class="small">inside the class</text>

  <path d="M 740 237 H 670" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>

  <path d="M 490 264 V 322" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- GATE 3 -->
  <rect x="310" y="322" width="360" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="326" y="342" class="h2">GATE 3 &#8212; no mutators</text>
  <text x="326" y="362" class="small">no setters or add methods exist</text>

  <rect x="740" y="310" width="280" height="78" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="756" y="330" class="smallb">BLOCKS:</text>
  <text x="756" y="348" class="small">a setAmount(Money) or addEntry</text>
  <text x="756" y="364" class="small">(LedgerEntry) mutator method</text>

  <path d="M 740 349 H 670" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>

  <path d="M 490 376 V 408" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- GATE 4 -->
  <rect x="310" y="408" width="360" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="326" y="428" class="h2">GATE 4 &#8212; defensive copy IN</text>
  <text x="326" y="448" class="small">List.copyOf(entries) inside the constructor</text>

  <rect x="740" y="396" width="280" height="78" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="756" y="416" class="smallb">BLOCKS:</text>
  <text x="756" y="434" class="small">the caller keeps its own reference</text>
  <text x="756" y="450" class="small">to the list and mutates it after</text>

  <path d="M 740 435 H 670" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>

  <path d="M 490 462 V 494" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- GATE 5 -->
  <rect x="310" y="494" width="360" height="54" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="326" y="514" class="h2">GATE 5 &#8212; defensive copy / view OUT</text>
  <text x="326" y="534" class="small">accessor returns an immutable view of entries</text>

  <rect x="740" y="482" width="280" height="64" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="756" y="502" class="smallb">BLOCKS:</text>
  <text x="756" y="520" class="small">movement.entries().add(...) by a</text>
  <text x="756" y="536" class="small">caller of the accessor</text>

  <path d="M 740 521 H 670" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>

  <path d="M 490 548 V 568" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>

  <!-- RESULT -->
  <rect x="310" y="568" width="360" height="54" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="326" y="588" class="h2">Movement is truly immutable</text>
  <text x="326" y="608" class="small">all five gates closed &#8212; no bug can slip through</text>

  <!-- LEGEND -->
  <text x="20" y="680" class="h2">LEGEND</text>
  <line x1="20" y1="688" x2="1020" y2="688" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="42" y="702" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="715" class="small">subject &#8212; the Movement class as designed at each stage</text>

  <rect x="42" y="726" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="70" y="739" class="small">immutability gate &#8212; a rule the design must satisfy</text>

  <rect x="42" y="750" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="70" y="763" class="small">blocked bug &#8212; the specific defect the gate stops</text>

  <rect x="42" y="774" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="70" y="787" class="small">final outcome &#8212; Movement is fully immutable</text>

  <line x1="42" y1="810" x2="68" y2="810" stroke="#475569" stroke-width="2" marker-end="url(#arr069)"/>
  <text x="76" y="814" class="small">primary flow &#8212; the class satisfies each gate in order</text>

  <line x1="42" y1="834" x2="68" y2="834" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#blk069)"/>
  <text x="76" y="838" class="small">blocked path &#8212; the bug attempt stopped by the gate</text>
</svg>
