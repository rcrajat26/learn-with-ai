  <path d="M 140 650.2 L 375 521.2 L 399.4 508.2 L 445.9 482.4 L 463.3 476.0 L 479.9 469.5 L 610 398.6 L 660.7 366.3 L 761.1 314.7 L 845 269.6 L 962.5 205.1 L 1080 140.6" fill="none" stroke="#2563eb" stroke-width="2"/>

