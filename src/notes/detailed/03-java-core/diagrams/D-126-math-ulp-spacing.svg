  <text x="150" y="668" class="code" font-size="11px">1.0E-6 &#8594; 2.12E-22</text>

  <circle cx="375" cy="521.2" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>

  <circle cx="480" cy="469.5" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>

  <circle cx="463.3" cy="476.0" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>

  <circle cx="610" cy="398.6" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="610" y="382" text-anchor="middle" class="code" font-size="11px">1.0E6 &#8594; 1.16E-10</text>

  <circle cx="845" cy="269.6" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="845" y="253" text-anchor="middle" class="code" font-size="11px">1.0E12 &#8594; 1.22E-4</text>

  <circle cx="962.5" cy="205.1" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="962.5" y="222" text-anchor="middle" class="code" font-size="11px">1.0E15 &#8594; 0.125</text>

  <circle cx="1080" cy="140.6" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1070" y="128" text-anchor="end" class="code" font-size="11px">1.0E18 &#8594; 128.0</text>

  <!-- QuizStakes highlighted points -->
  <circle cx="399.4" cy="508.2" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M 399.4 501.2 V 470" fill="none" stroke="#b45309" stroke-width="1.2"/>
  <text x="399" y="464" text-anchor="middle" class="smallb" fill="#b45309" font-size="11px">4.20 &#8594; 8.88E-16</text>

  <circle cx="445.9" cy="482.4" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M 445.9 489.4 V 560" fill="none" stroke="#b45309" stroke-width="1.2"/>
  <text x="446" y="574" text-anchor="middle" class="smallb" fill="#b45309" font-size="11px">65.0 &#8594; 1.42E-14</text>

  <circle cx="660.7" cy="366.3" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="660" y="349" text-anchor="middle" class="smallb" fill="#b45309" font-size="11px">1.98E7 &#8594; 3.73E-9</text>

  <circle cx="761.1" cy="314.7" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="761" y="298" text-anchor="middle" class="smallb" fill="#b45309" font-size="11px">7.2E9 &#8594; 9.54E-7</text>

  <!-- off-scale inset (drawn after gridlines so it occludes them cleanly) -->
  <rect x="150" y="108" width="430" height="54" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="162" y="128" class="smallb">Double.MIN_NORMAL = 2.2250738585072014E-308</text>
  <text x="162" y="146" class="small">Math.ulp(MIN_NORMAL) = 4.9E-324 &#8212; off this axis (not to scale)</text>

  <rect x="150" y="170" width="430" height="76" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="162" y="188" class="smallb">Additional measured points:</text>
  <text x="162" y="205" class="code" font-size="11px">1.0 &#8594; 2.220446049250313E-16</text>
  <text x="162" y="221" class="code" font-size="11px">180.0 &#8594; 2.842170943040401E-14</text>
  <text x="162" y="237" class="code" font-size="11px">480.0 &#8594; 5.684341886080802E-14</text>

  <!-- EPSILON CALLOUT -->
  <rect x="20" y="766" width="1080" height="110" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="40" y="788" class="h2">EPSILON CALLOUT &#8212; THE POINT OF THIS DIAGRAM</text>
  <text x="40" y="808" class="body">A fixed epsilon of 1e-9 is 953.67&#215; smaller than one ulp at 7.2E9 (Math.ulp(7.2e9) = 9.5367431640625E-7) &#8212; at that</text>
  <text x="40" y="826" class="body">magnitude no two distinct doubles are ever within 1e-9 of each other, so Math.abs(a-b) &lt; 1e-9 degenerates to a==b.</text>
  <text x="40" y="848" class="body">The same 1e-9 at the average stake 4.20 is 1,125,899.9 ulps (Math.ulp(4.20) = 8.881784197001252E-16) &#8212; an absurdly</text>
  <text x="40" y="866" class="body">loose tolerance that will call two genuinely different stake amounts equal.</text>

  <!-- SYNTHESIS -->
  <rect x="20" y="886" width="1080" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="908" class="h2">SYNTHESIS</text>
  <text x="40" y="928" class="body">One fixed epsilon cannot be correct at both ends of the range: the correct comparison is relative &#8212; scale the tolerance</text>
  <text x="40" y="946" class="body">by the magnitude, or by Math.ulp &#8212; and for money the correct answer is not to compare doubles at all.</text>
  <text x="40" y="968" class="body">At 1.0E18 the ulp is 128.0 &#8212; consecutive doubles are 128 apart, so integers in that range are not all representable.</text>

  <!-- LEGEND -->
  <line x1="20" y1="1016" x2="1100" y2="1016" stroke="#d1d5db" stroke-width="1.5"/>
  <circle cx="30" cy="1036" r="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="46" y="1040" class="small">Measured data point</text>
  <circle cx="290" cy="1036" r="7" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="306" y="1040" class="small">QuizStakes magnitude (highlighted)</text>
  <line x1="560" y1="1036" x2="596" y2="1036" stroke="#2563eb" stroke-width="2"/>
  <text x="602" y="1040" class="small">Math.ulp(x), plotted point to point</text>
  <line x1="860" y1="1036" x2="896" y2="1036" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="902" y="1040" class="small">ulp(x) = 1 threshold</text>

  <rect x="20" y="1062" width="16" height="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="44" y="1074" class="small">Degraded &#8212; epsilon callout panel</text>
  <rect x="290" y="1062" width="16" height="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="314" y="1074" class="small">Annotation &#8212; synthesis panel</text>
  <rect x="560" y="1062" width="16" height="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="584" y="1074" class="small">Neutral &#8212; off-scale supporting fact</text>
</svg>
