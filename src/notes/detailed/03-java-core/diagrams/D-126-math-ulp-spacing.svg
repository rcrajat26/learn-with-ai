<svg viewBox="0 0 1120 1140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Math.ulp(x) plotted against magnitude x on log-log axes, measured on Oracle JDK 21.0.7. The plotted points are: Double.MIN_NORMAL (2.2250738585072014E-308) with ulp 4.9E-324, shown off-scale in an inset since it is roughly 300 decades below the visible axes; 1.0E-6 with ulp 2.117582368135751E-22; 1.0 with ulp 2.220446049250313E-16; the QuizStakes average stake 4.20 with ulp 8.881784197001252E-16; the average card deposit 65.0 with ulp 1.4210854715202004E-14; 180.0 with ulp 2.842170943040401E-14; 480.0 with ulp 5.684341886080802E-14; 1.0E6 with ulp 1.1641532182693481E-10; the 19.8 million daily ledger entries magnitude 1.98E7 with ulp 3.725290298461914E-9; the 7.2 billion yearly ledger entries magnitude 7.2E9 with ulp 9.5367431640625E-7; 1.0E12 with ulp 1.220703125E-4; 1.0E15 with ulp 0.125; and 1.0E18 with ulp 128.0. The four QuizStakes magnitudes (4.20, 65.0, 1.98E7, 7.2E9) are marked as highlighted points. A dashed horizontal line marks ulp(x) = 1; above and to the right of where the curve crosses it, between the 1.0E15 and 1.0E18 points, no fractional precision remains because consecutive doubles are 128 apart at 1.0E18. An epsilon callout states that a fixed epsilon of 1e-9 is 953.67 times smaller than one ulp at 7.2E9, so a distance check against 1e-9 degenerates to exact equality at that magnitude, while the same 1e-9 at the average stake of 4.20 equals 1,125,899.9 ulps, an absurdly loose tolerance; the synthesis is that one fixed epsilon cannot be correct at both ends of the range, the comparison must be relative or scaled by Math.ulp, and money should not be compared as doubles at all.">
