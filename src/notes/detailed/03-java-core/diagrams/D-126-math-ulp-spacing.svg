    <line x1="134" y1="528.57" x2="140" y2="528.57" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="532.57" text-anchor="end">1E-16</text>
    <line x1="134" y1="442.86" x2="140" y2="442.86" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="446.86" text-anchor="end">1E-12</text>
    <line x1="134" y1="357.14" x2="140" y2="357.14" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="361.14" text-anchor="end">1E-8</text>
    <line x1="134" y1="271.43" x2="140" y2="271.43" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="275.43" text-anchor="end">1E-4</text>
    <line x1="134" y1="185.71" x2="140" y2="185.71" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="189.71" text-anchor="end">1E0</text>
    <line x1="134" y1="100" x2="140" y2="100" stroke="#475569" stroke-width="1.6"/>
    <text x="128" y="104" text-anchor="end">1E4</text>
  </g>

  <text x="610" y="742" text-anchor="middle" class="body">x &#8212; magnitude (log scale)</text>
  <text x="46" y="400" text-anchor="middle" class="body" transform="rotate(-90 46 400)">Math.ulp(x) (log scale)</text>

  <!-- ulp = 1 threshold -->
  <line x1="140" y1="185.71" x2="1080" y2="185.71" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="172" text-anchor="middle" class="smallb">ABOVE THIS LINE, PAST 1.0E15&#8211;1.0E18: NO FRACTIONAL PRECISION REMAINS</text>

