<svg viewBox="0 0 1120 1180" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three-frame sequence showing a LedgerEntry object's 64-bit mark word. Frame 1: a fresh object has hash = 0 in the 31-bit hash field. Frame 2: System.identityHashCode(entry) writes 1329552164 into that field. Frame 3: after GC relocates the object to a new address, the hash field still reads 1329552164 unchanged, proving the identity hash is not the address. Two annotation panels below explain the lock/hash interaction and give the measured proof that hashCode mode 5 addresses are 16 apart while mode 4's default hashes are not.">
  <defs>
    <marker id="arrow124" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1180" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">The identity hash lives in the mark word</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ============ FRAME 1 : FT=54 ============ -->
  <text x="80" y="64" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 1 &#8212; fresh LedgerEntry, no identity hash computed</text>
  <line x1="80" y1="72" x2="1040" y2="72" stroke="#d1d5db" stroke-width="1"/>

  <rect x="100" y="90" width="260" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="230" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LedgerEntry instance</text>
  <text x="230" y="130" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">address = A</text>
  <text x="230" y="148" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">hash: not computed</text>

  <text x="400" y="112" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">no call yet</text>
  <text x="400" y="130" font-family="sans-serif" font-size="11" fill="#4b5563">a read of identityHashCode() would</text>
  <text x="400" y="148" font-family="sans-serif" font-size="11" fill="#4b5563">trigger the write shown in Frame 2</text>

  <line x1="230" y1="160" x2="230" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow124)"/>

  <text x="100" y="194" font-family="sans-serif" font-size="11" fill="#4b5563">MSB (bit 63)</text>
  <text x="1020" y="194" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4b5563">LSB (bit 0)</text>

  <rect x="100" y="200" width="359.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="459.4" y="200" width="445.6" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="905.0" y="200" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="919.4" y="200" width="57.5" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <rect x="976.9" y="200" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="991.3" y="200" width="28.7" height="40" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="682.2" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">hash = 0</text>

  <text x="279.7" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">25</text>
  <text x="682.2" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">31</text>
  <text x="912.2" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="948.1" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">4</text>
  <text x="984.1" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="1005.6" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">2</text>
  <text x="560" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">25 + 31 + 1 + 4 + 1 + 2 = 64 bits</text>

  <!-- ============ FRAME 2 : FT=304 ============ -->
  <text x="80" y="314" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 2 &#8212; System.identityHashCode(entry) is called</text>
  <line x1="80" y1="322" x2="1040" y2="322" stroke="#d1d5db" stroke-width="1"/>

  <rect x="100" y="340" width="260" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="230" y="362" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LedgerEntry instance</text>
  <text x="230" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">address = A (same)</text>
  <text x="230" y="398" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">hash: computed</text>

  <text x="400" y="362" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">System.identityHashCode(entry) called</text>
  <text x="400" y="380" font-family="sans-serif" font-size="11" fill="#4b5563">writes into the 31-bit hash field</text>
  <text x="400" y="398" font-family="sans-serif" font-size="11" fill="#4b5563">value: 1329552164</text>

  <line x1="230" y1="410" x2="230" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow124)"/>

  <text x="100" y="444" font-family="sans-serif" font-size="11" fill="#4b5563">MSB (bit 63)</text>
  <text x="682.2" y="444" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">written by System.identityHashCode(entry)</text>
  <text x="1020" y="444" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4b5563">LSB (bit 0)</text>

  <rect x="100" y="450" width="359.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="459.4" y="450" width="445.6" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <rect x="905.0" y="450" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="919.4" y="450" width="57.5" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <rect x="976.9" y="450" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="991.3" y="450" width="28.7" height="40" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="682.2" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">hash = 1329552164</text>

  <text x="279.7" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">25</text>
  <text x="682.2" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">31</text>
  <text x="912.2" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="948.1" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">4</text>
  <text x="984.1" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="1005.6" y="504" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">2</text>
  <text x="560" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">25 + 31 + 1 + 4 + 1 + 2 = 64 bits</text>

  <!-- ============ FRAME 3 : FT=554 ============ -->
  <text x="80" y="564" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 3 &#8212; GC relocates the object; the hash is unchanged</text>
  <line x1="80" y1="572" x2="1040" y2="572" stroke="#d1d5db" stroke-width="1"/>

  <rect x="100" y="590" width="260" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="230" y="612" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LedgerEntry instance</text>
  <text x="230" y="630" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">address = B (GC moved)</text>
  <text x="230" y="648" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">hash: unchanged</text>

  <text x="400" y="612" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">NOT THE ADDRESS</text>
  <text x="400" y="630" font-family="sans-serif" font-size="11" fill="#4b5563">GC: 3x System.gc() + 200x new byte[100_000]</text>
  <text x="400" y="648" font-family="sans-serif" font-size="11" fill="#4b5563">under -Xmx512m; object moved, hash did not</text>

  <line x1="230" y1="660" x2="230" y2="700" stroke="#475569" stroke-width="2" marker-end="url(#arrow124)"/>

  <text x="100" y="694" font-family="sans-serif" font-size="11" fill="#4b5563">MSB (bit 63)</text>
  <text x="682.2" y="694" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1f2937">NOT THE ADDRESS</text>
  <text x="1020" y="694" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4b5563">LSB (bit 0)</text>

  <rect x="100" y="700" width="359.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="459.4" y="700" width="445.6" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <rect x="905.0" y="700" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="919.4" y="700" width="57.5" height="40" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <rect x="976.9" y="700" width="14.4" height="40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="991.3" y="700" width="28.7" height="40" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="682.2" y="725" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">hash = 1329552164 (unchanged)</text>

  <text x="279.7" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">25</text>
  <text x="682.2" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">31</text>
  <text x="912.2" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="948.1" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">4</text>
  <text x="984.1" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">1</text>
  <text x="1005.6" y="754" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">2</text>
  <text x="560" y="770" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">25 + 31 + 1 + 4 + 1 + 2 = 64 bits</text>

  <!-- ============ ANNOTATION PANELS ============ -->
  <rect x="80" y="810" width="460" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="100" y="832" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LOCK / HASH INTERACTION</text>
  <text x="100" y="850" font-family="sans-serif" font-size="11" fill="#1f2937">The 31-bit hash and a lightweight-lock displaced</text>
  <text x="100" y="868" font-family="sans-serif" font-size="11" fill="#1f2937">header compete for the same 64-bit mark word.</text>
  <text x="100" y="886" font-family="sans-serif" font-size="11" fill="#1f2937">Computing an identity hash on an object that is</text>
  <text x="100" y="904" font-family="sans-serif" font-size="11" fill="#1f2937">later locked forces the JVM to inflate the mark</text>
  <text x="100" y="922" font-family="sans-serif" font-size="11" fill="#1f2937">word into a heavyweight monitor so both fit.</text>
  <text x="100" y="940" font-family="sans-serif" font-size="11" fill="#1f2937">2nd unused_gap:1 held biased_lock:1 on JDK 17 and earlier.</text>
  <text x="100" y="958" font-family="sans-serif" font-size="11" fill="#1f2937">Disabled by default in JDK 15 (JEP 374); removed in JDK 18.</text>

  <rect x="580" y="810" width="460" height="170" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="600" y="832" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PROOF: THE HASH IS NOT THE ADDRESS</text>
  <text x="600" y="850" font-family="sans-serif" font-size="11" fill="#1f2937">Mode 4 (raw address): two consecutive Objects</text>
  <text x="600" y="868" font-family="sans-serif" font-size="11" fill="#1f2937">reported 398539888 and 398539904 -- exactly 16</text>
  <text x="600" y="886" font-family="sans-serif" font-size="11" fill="#1f2937">apart, the TLAB bump for two 16-byte objects.</text>
  <text x="600" y="904" font-family="sans-serif" font-size="11" fill="#1f2937">Mode 5 (default): the same two objects reported</text>
  <text x="600" y="922" font-family="sans-serif" font-size="11" fill="#1f2937">705927765 and 366712642 -- not 16 apart, not</text>
  <text x="600" y="940" font-family="sans-serif" font-size="11" fill="#1f2937">addresses. This is the proof: the identity hash</text>
  <text x="600" y="958" font-family="sans-serif" font-size="11" fill="#1f2937">in Frames 2-3 (1329552164) is not an address.</text>

  <!-- ============ LEGEND ============ -->
  <text x="80" y="1000" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="80" y1="1008" x2="1040" y2="1008" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="90" y="1020" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="118" y="1033" font-family="sans-serif" font-size="11" fill="#4b5563">object instance (LedgerEntry)</text>

  <rect x="90" y="1044" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="118" y="1057" font-family="sans-serif" font-size="11" fill="#4b5563">hash field (31 bits) &#8212; identityHashCode() value</text>

  <rect x="90" y="1068" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="118" y="1081" font-family="sans-serif" font-size="11" fill="#4b5563">unused / gap bits (2nd gap = pre-JDK18 biased_lock:1)</text>

  <rect x="90" y="1092" width="22" height="16" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <text x="118" y="1105" font-family="sans-serif" font-size="11" fill="#4b5563">age field (4 bits) &#8212; GC generation counter</text>

  <rect x="610" y="1020" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="638" y="1033" font-family="sans-serif" font-size="11" fill="#4b5563">lock field (2 bits) &#8212; lightweight-lock state</text>

  <rect x="610" y="1044" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="638" y="1057" font-family="sans-serif" font-size="11" fill="#4b5563">annotation panel &#8212; measured JDK 21.0.7 fact</text>

  <line x1="610" y1="1076" x2="632" y2="1076" stroke="#475569" stroke-width="2" marker-end="url(#arrow124)"/>
  <text x="638" y="1081" font-family="sans-serif" font-size="11" fill="#4b5563">object &#8594; its mark word (structural)</text>
</svg>
