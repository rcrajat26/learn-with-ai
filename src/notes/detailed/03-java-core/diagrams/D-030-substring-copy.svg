<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="substring before and after Java 7: Java 6 shares the parent char array and retains 4KB, Java 7+ copies 8 bytes and lets the parent be collected">
  <defs>
    <marker id="arrow030" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">substring: copy since Java 7, shared before</text>

  <!-- LEFT PANEL: Java 6 -->
  <rect x="40" y="70" width="380" height="330" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="60" y="82" width="200" height="26" rx="3" fill="#e5e7eb"/>
  <text x="160" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Java 6 — substring shares array</text>

  <rect x="60" y="120" width="150" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="135" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bankStatementLine</text>
  <text x="135" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">offset=0, count=4096</text>

  <rect x="250" y="120" width="150" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ref = substring(0, 8)</text>
  <text x="325" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">offset=0, count=8</text>

  <rect x="60" y="220" width="340" height="70" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="230" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">char[] value — 4096 chars (4 KB)</text>
  <text x="230" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">the whole bank-statement line, shared by both Strings</text>

  <line x1="135" y1="180" x2="180" y2="220" stroke="#737373" stroke-width="2" marker-end="url(#arrow030)"/>
  <line x1="325" y1="180" x2="270" y2="220" stroke="#525252" stroke-width="2" marker-end="url(#arrow030)"/>

  <rect x="90" y="330" width="280" height="46" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="230" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bytes retained: 4096</text>
  <text x="230" y="366" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">whole 4 KB kept alive by an 8-char substring</text>

  <!-- RIGHT PANEL: Java 7+ -->
  <rect x="480" y="70" width="380" height="330" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="500" y="82" width="200" height="26" rx="3" fill="#e5e7eb"/>
  <text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Java 7+ — substring copies</text>

  <rect x="500" y="120" width="150" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="575" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bankStatementLine</text>
  <text x="575" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(eligible for GC)</text>

  <rect x="690" y="120" width="150" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="765" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">ref = substring(0, 8)</text>
  <text x="765" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">own storage</text>

  <rect x="500" y="220" width="150" height="70" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="575" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">byte[] — 4096 bytes</text>
  <text x="575" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">parent's own storage</text>

  <rect x="690" y="220" width="150" height="70" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="765" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">byte[] — 8 bytes</text>
  <text x="765" y="266" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">independent copy</text>

  <line x1="575" y1="180" x2="575" y2="220" stroke="#737373" stroke-width="2" marker-end="url(#arrow030)"/>
  <line x1="765" y1="180" x2="765" y2="220" stroke="#525252" stroke-width="2" marker-end="url(#arrow030)"/>

  <rect x="610" y="330" width="220" height="46" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="720" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bytes retained: 8</text>
  <text x="720" y="366" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">parent may be collected</text>

  <!-- VERSION TRAP banner -->
  <rect x="60" y="430" width="780" height="66" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="450" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">VERSION TRAP</text>
  <text x="450" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">substring() shared the parent's backing array through Java 6 — an 8-char</text>
  <text x="450" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">substring could pin a 4 KB parent. JDK 7u6 (2012) switched to copying on substring.</text>
</svg>
