<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Indified concat does not fix the loop: appending 19.8 million LedgerEntry ids with report += entry.id() plus newline still calls invokedynamic once per iteration and copies the whole accumulated string each time, costing roughly 1.6 times 10 to the 16 bytes copied versus about 1.6 gigabytes with a StringBuilder">
  <defs>
    <marker id="arrow101" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="36" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Indified concat does not fix the loop</text>

  <rect x="20" y="66" width="860" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">for (LedgerEntry entry : 19.8M entries) report += entry.id() + "\n";</text>

  <!-- FRAME 1 -->
  <rect x="20" y="116" width="860" height="120" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="128" width="380" height="26" rx="3" fill="#fef3c7"/>
  <text x="50" y="146" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1: one invokedynamic per iteration</text>

  <rect x="36" y="166" width="260" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="166" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bootstrap runs ONCE</text>
  <text x="166" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">links makeConcatWithConstants</text>

  <line x1="296" y1="191" x2="380" y2="191" stroke="#737373" stroke-width="2" marker-end="url(#arrow101)"/>

  <rect x="380" y="166" width="460" height="50" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="610" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">call site invoked n = 19.8M times</text>
  <text x="610" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">each invocation allocates a brand-new String</text>

  <!-- FRAME 2 -->
  <rect x="20" y="248" width="860" height="270" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="260" width="460" height="26" rx="3" fill="#fee2e2"/>
  <text x="50" y="278" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2: each invocation copies everything so far</text>

  <text x="46" y="310" font-family="sans-serif" font-size="13" fill="#1f2937">iter 1</text>
  <rect x="100" y="298" width="40" height="20" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="150" y="313" font-family="sans-serif" font-size="13" fill="#1f2937">copy width = 40 bytes</text>

  <text x="46" y="350" font-family="sans-serif" font-size="13" fill="#1f2937">iter 2</text>
  <rect x="100" y="338" width="80" height="20" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="190" y="353" font-family="sans-serif" font-size="13" fill="#1f2937">copy width = 80 bytes</text>

  <text x="46" y="390" font-family="sans-serif" font-size="13" fill="#1f2937">iter 3</text>
  <rect x="100" y="378" width="120" height="20" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="230" y="393" font-family="sans-serif" font-size="13" fill="#1f2937">copy width = 120 bytes</text>

  <text x="30" y="470" font-family="sans-serif" font-size="13" fill="#1f2937">iter n</text>
  <rect x="100" y="430" width="700" height="60" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="450" y="465" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">copy width = n x 40 bytes = 19.8M x 40 = 792,000,000 bytes, on the LAST iteration alone</text>

  <text x="46" y="510" font-family="sans-serif" font-size="13" fill="#1f2937">each += copies the full accumulated buffer, so the widths grow linearly and the total work grows quadratically</text>

  <!-- FRAME 3 -->
  <rect x="20" y="530" width="860" height="330" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="542" width="360" height="26" rx="3" fill="#dcfce7"/>
  <text x="50" y="560" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3: total bytes copied, two strategies</text>

  <rect x="36" y="580" width="390" height="260" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="231" y="606" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">report += (quadratic)</text>
  <text x="231" y="632" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">row size ~ 40 chars per LedgerEntry id</text>
  <text x="231" y="654" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">total copied ~ n^2 / 2 x 40 bytes</text>
  <text x="231" y="676" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n = 19.8M entries/day</text>
  <text x="231" y="702" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">~ 1.6 x 10^16 bytes copied</text>
  <text x="231" y="726" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">a new String object every iteration</text>
  <rect x="66" y="746" width="330" height="60" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="231" y="770" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">does not finish</text>
  <text x="231" y="792" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">production incident, not a benchmark curiosity</text>

  <rect x="450" y="580" width="390" height="260" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="645" y="606" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">StringBuilder sb (linear)</text>
  <text x="645" y="632" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">amortized growth, ~20 reallocations</text>
  <text x="645" y="654" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">for n = 19.8M entries total</text>
  <text x="645" y="680" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">total copied ~ 2 x n x 40 bytes</text>
  <text x="645" y="702" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">= 2 x 19.8M x 40</text>
  <text x="645" y="724" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">~ 1.6 GB copied, total</text>
  <rect x="480" y="746" width="330" height="60" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="645" y="770" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">finishes comfortably</text>
  <text x="645" y="792" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">across ~20 reallocations, not 19.8M</text>
</svg>
