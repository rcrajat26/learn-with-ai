<svg viewBox="0 0 1060 1052" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="End-of-month clamping in LocalDate.plusMonths, measured on Oracle JDK 21.0.7. Frame 1 shows January 2026 has a day 31 but February 2026, per YearMonth.of(2026,2).lengthOfMonth(), has only 28 days, so days 29 through 31 do not exist in February; a leap-year contrast panel states Year.isLeap(2026) is false, Year.isLeap(2028) is true, Year.isLeap(1900) is false, and Year.isLeap(2000) is true. Frame 2 shows LocalDate.of(2026,1,31).plusMonths(1) producing 2026-02-28, labelled as a clamp to the last valid day of the target month rather than an overflow into March or an exception, per the documented rule that plusMonths adds to the month field then reduces the day-of-month to the last valid day if the original day does not exist in the result month. Frame 3 shows the clamp is lossy and plusMonths is not associative: the chained call plusMonths(1) then plusMonths(1) again clamps first to 2026-02-28 and then carries 28 forward to 2026-03-28, while the single call plusMonths(2) keeps 31 all the way and lands on 2026-03-31 &#8212; the two results are marked not equal, three days apart, because once the day-of-month is clamped to 28 the original 31 is gone and no later call can recover it. An annotation panel applies this to QuizStakes: a bonus granted 2026-01-31 with a 30-day expiry expressed as plusMonths(1) expires 2026-02-28, three days earlier than a client counting calendar days expects, and the unspent balance reverses to PROMOTIONAL_EXPENSE; the fix is to express the rule in the unit it is written in, plusDays(30) for '30 days', and never to compose repeated plusMonths(1) calls when a single plusMonths(n) is meant.">
  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
      .code{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#1f2937;}
      .codeR{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#b91c1c;}
      .codeG{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#15803d;}
    </style>
    <marker id="arr079" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="1052" fill="#ffffff"/>

  <text x="20" y="32" class="h1">End-of-month clamping: LocalDate.plusMonths(1) is not associative</text>
  <line x1="20" y1="42" x2="1040" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <text x="20" y="62" class="h2">FRAME 1 &#8212; THE TARGET MONTH IS SHORT</text>
  <line x1="20" y1="70" x2="1040" y2="70" stroke="#d1d5db" stroke-width="1"/>

  <text x="20" y="90" class="smallb">January 2026 (tail) &#8212; day 31 exists</text>
  <g>
    <rect x="20" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="45" y="123" text-anchor="middle" class="body">22</text>
    <rect x="70" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="95" y="123" text-anchor="middle" class="body">23</text>
    <rect x="120" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="145" y="123" text-anchor="middle" class="body">24</text>
    <rect x="170" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="195" y="123" text-anchor="middle" class="body">25</text>
    <rect x="220" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="245" y="123" text-anchor="middle" class="body">26</text>
    <rect x="270" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="295" y="123" text-anchor="middle" class="body">27</text>
    <rect x="320" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="345" y="123" text-anchor="middle" class="body">28</text>
    <rect x="370" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="395" y="123" text-anchor="middle" class="body">29</text>
    <rect x="420" y="98" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="445" y="123" text-anchor="middle" class="body">30</text>
    <rect x="470" y="98" width="50" height="40" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
    <text x="495" y="123" text-anchor="middle" class="body" font-weight="bold">31</text>
  </g>

  <text x="20" y="152" class="smallb">February 2026 (tail) &#8212; YearMonth.of(2026,2).lengthOfMonth() = 28</text>
  <g>
    <rect x="20" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="45" y="185" text-anchor="middle" class="body">22</text>
    <rect x="70" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="95" y="185" text-anchor="middle" class="body">23</text>
    <rect x="120" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="145" y="185" text-anchor="middle" class="body">24</text>
    <rect x="170" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="195" y="185" text-anchor="middle" class="body">25</text>
    <rect x="220" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="245" y="185" text-anchor="middle" class="body">26</text>
    <rect x="270" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="295" y="185" text-anchor="middle" class="body">27</text>
    <rect x="320" y="160" width="50" height="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <text x="345" y="185" text-anchor="middle" class="body">28</text>
    <rect x="370" y="160" width="50" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="395" y="185" text-anchor="middle" class="codeR">&#8212;</text>
    <rect x="420" y="160" width="50" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="445" y="185" text-anchor="middle" class="codeR">&#8212;</text>
    <rect x="470" y="160" width="50" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="495" y="185" text-anchor="middle" class="codeR">&#8212;</text>
  </g>
  <line x1="495" y1="138" x2="495" y2="160" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr079)"/>
  <text x="20" y="210" class="small">Days 29, 30, 31 do not exist in February 2026 &#8212; day 31 has nowhere to land.</text>

  <text x="20" y="234" class="smallb">Leap-year contrast (measured on the same JDK build):</text>
  <rect x="20" y="242" width="1020" height="44" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="40" y="268" class="code">Year.isLeap(2026) = false</text>
  <text x="300" y="268" class="code">Year.isLeap(2028) = true</text>
  <text x="560" y="268" class="code">Year.isLeap(1900) = false</text>
  <text x="820" y="268" class="code">Year.isLeap(2000) = true</text>

  <!-- FRAME 2 -->
  <text x="20" y="310" class="h2">FRAME 2 &#8212; THE CLAMP</text>
  <line x1="20" y1="318" x2="1040" y2="318" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="330" width="230" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="135" y="345" text-anchor="middle" class="code">LocalDate.of(2026,1,31)</text>
  <text x="135" y="365" text-anchor="middle" class="small">(input)</text>

  <line x1="250" y1="362" x2="270" y2="362" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="270" y="330" width="280" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="410" y="350" text-anchor="middle" class="code">.plusMonths(1)</text>
  <text x="410" y="366" text-anchor="middle" class="small">adds to month field, then clamps</text>
  <text x="410" y="380" text-anchor="middle" class="small">day-of-month to last valid day</text>

  <line x1="550" y1="362" x2="570" y2="362" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="570" y="330" width="200" height="64" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="670" y="360" text-anchor="middle" class="code">2026-02-28</text>
  <text x="670" y="380" text-anchor="middle" class="smallb">RESULT (clamped)</text>

  <text x="20" y="414" class="body">Documented rule: plusMonths adds to the month field, then reduces the day-of-month to the last</text>
  <text x="20" y="430" class="body">valid day if the original day does not exist in the result month &#8212; this is a clamp, not an overflow.</text>

  <!-- FRAME 3 -->
  <text x="20" y="466" class="h2">FRAME 3 &#8212; THE CLAMP IS LOSSY, SO plusMonths IS NOT ASSOCIATIVE</text>
  <line x1="20" y1="474" x2="1040" y2="474" stroke="#d1d5db" stroke-width="1"/>

  <!-- Row A: chained -->
  <rect x="20" y="488" width="170" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="105" y="512" text-anchor="middle" class="code">2026-01-31</text>
  <text x="105" y="530" text-anchor="middle" class="small">(input)</text>
  <line x1="190" y1="516" x2="230" y2="516" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="230" y="488" width="150" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="305" y="520" text-anchor="middle" class="code">.plusMonths(1)</text>
  <line x1="380" y1="516" x2="400" y2="516" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="400" y="488" width="170" height="56" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="485" y="512" text-anchor="middle" class="code">2026-02-28</text>
  <text x="485" y="530" text-anchor="middle" class="small">(clamped)</text>
  <line x1="570" y1="516" x2="590" y2="516" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="590" y="488" width="150" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="665" y="520" text-anchor="middle" class="code">.plusMonths(1)</text>
  <line x1="740" y1="516" x2="760" y2="516" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="760" y="488" width="200" height="56" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="860" y="512" text-anchor="middle" class="codeR">2026-03-28</text>
  <text x="860" y="530" text-anchor="middle" class="smallb">CHAINED RESULT</text>

  <!-- Row B: single call -->
  <rect x="20" y="560" width="170" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="105" y="584" text-anchor="middle" class="code">2026-01-31</text>
  <text x="105" y="602" text-anchor="middle" class="small">(input)</text>
  <line x1="190" y1="588" x2="230" y2="588" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="230" y="560" width="510" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="485" y="592" text-anchor="middle" class="code">.plusMonths(2)</text>
  <line x1="740" y1="588" x2="760" y2="588" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="760" y="560" width="200" height="56" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="860" y="584" text-anchor="middle" class="codeG">2026-03-31</text>
  <text x="860" y="602" text-anchor="middle" class="smallb">SINGLE-CALL RESULT</text>

  <!-- connectors to unequal callout -->
  <path d="M 960 512.0 H 980 V 648.0 H 960" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr079)"/>
  <line x1="860" y1="616" x2="860" y2="628" stroke="#15803d" stroke-width="2" marker-end="url(#arr079)"/>

  <rect x="760" y="628" width="200" height="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="860" y="652" text-anchor="middle" class="smallb" fill="#b91c1c">NOT EQUAL &#8212; 3 days apart</text>

  <text x="20" y="688" class="body">The chained form (.plusMonths(1) called twice) clamped to Feb 28 first, then carried 28 forward</text>
  <text x="20" y="704" class="body">into March, landing on 2026-03-28. The single-call form (.plusMonths(2)) kept 31 all the way</text>
  <text x="20" y="720" class="body">through and found day 31 valid in March, landing on 2026-03-31. Once the day-of-month is</text>
  <text x="20" y="736" class="body">clamped, the original 31 is gone &#8212; no later plusMonths call can recover it.</text>

  <!-- ANNOTATION -->
  <rect x="20" y="758" width="1020" height="170" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="782" class="h2">QUIZSTAKES IMPACT</text>
  <text x="40" y="804" class="body">A Bonus granted on 2026-01-31 with a 30-day expiry expressed as plusMonths(1) expires 2026-02-28 &#8212;</text>
  <text x="40" y="822" class="body">three days earlier than a client counting calendar days expects.</text>
  <text x="40" y="844" class="body">The unspent balance reverses to PROMOTIONAL_EXPENSE at expiry, so the shortfall silently misstates</text>
  <text x="40" y="862" class="body">the reversal Movement written to FundsLedger.</text>
  <text x="40" y="884" class="body">Fix: express the rule in the unit it is written in &#8212; plusDays(30) for "30 days" &#8212; and never compose</text>
  <text x="40" y="902" class="body">repeated plusMonths(1) calls when a single plusMonths(n) is meant.</text>

  <!-- LEGEND -->
  <line x1="20" y1="938" x2="1040" y2="938" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="956" width="16" height="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="44" y="968" class="small">Primary &#8212; input date value</text>
  <rect x="270" y="956" width="16" height="16" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="294" y="968" class="small">Highlight &#8212; the clamp</text>
  <rect x="520" y="956" width="16" height="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="544" y="968" class="small">Degraded &#8212; wrong / missing</text>
  <rect x="770" y="956" width="16" height="16" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="794" y="968" class="small">Resolved &#8212; correct result</text>
  <rect x="20" y="982" width="16" height="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="44" y="994" class="small">Neutral &#8212; operation step</text>
  <rect x="270" y="982" width="16" height="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="294" y="994" class="small">Annotation &#8212; impact panel</text>
  <line x1="520" y1="990" x2="556" y2="990" stroke="#475569" stroke-width="2" marker-end="url(#arr079)"/>
  <text x="562" y="994" class="small">Data flow / transformation</text>
</svg>
