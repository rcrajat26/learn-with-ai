<svg viewBox="0 0 1140 870" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout of java.lang.Integer.IntegerCache on the heap in JDK 21.0.7. A horizontal strip shows the static final Integer array cache with 256 slots, indices 0 to 255, holding the values minus 128 up to 127; index arithmetic in Integer.valueOf is cache of i plus 128. Two labelled constants are shown: low equals minus 128, fixed and not lowerable, and high, which defaults to 127 and is settable upward only, plus the three-line valueOf source. Below, two halves compare the boundary. On the left, the two references retryCount and retryCountFromDb, both holding a document-verification retry count of 127, point horizontally at one and the same cached Integer object living in cache slot 255, whose identityHashCode is 692404036 for both, so double equals is true. On the right, two references holding a DEPOSIT_LIMITED restriction count of 128 point at two distinct new Integer objects with different identityHashCodes 1670675563 and 723074861, so double equals is false. Two annotation panels give the measured boundary results at minus 128 and minus 129 and the flags that configure high.">
  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2937;}
      .bodyb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallD{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#1f2937;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
      .code{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#1f2937;}
      .codeb{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;font-weight:bold;fill:#1f2937;}
    </style>
    <marker id="arr025" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="870" fill="#ffffff"/>

  <text x="20" y="32" class="h1">The IntegerCache on the heap &#8212; why a retry count of 127 shares an object and 128 does not</text>
  <line x1="20" y1="42" x2="1120" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ============ SECTION 1 ============ -->
  <text x="20" y="66" class="h2">SECTION 1 &#8212; THE CACHE ARRAY, JDK 21.0.7 lib/src.zip</text>

  <text x="60" y="96" class="smallD">IntegerCache.cache : Integer[256] &#8212; static final, filled once in the IntegerCache &lt;clinit&gt;</text>

  <!-- index band -->
  <rect x="60"  y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="173" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="286" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="399" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="512" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="625" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="738" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="851" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <rect x="964" y="110" width="113" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
  <g class="smallD" text-anchor="middle">
    <text x="116"  y="126">[0]</text>
    <text x="229"  y="126">[1]</text>
    <text x="342"  y="126">&#8230;</text>
    <text x="455"  y="126">[127]</text>
    <text x="568"  y="126">[128]</text>
    <text x="681"  y="126">[129]</text>
    <text x="794"  y="126">&#8230;</text>
    <text x="907"  y="126">[254]</text>
    <text x="1020" y="126">[255]</text>
  </g>

  <!-- value band -->
  <rect x="60"  y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="173" y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="286" y="132" width="113" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="399" y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="512" y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="625" y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="738" y="132" width="113" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="851" y="132" width="113" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
  <rect x="964" y="132" width="113" height="48" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <g text-anchor="middle">
    <text x="116"  y="154" class="bodyb">&#8722;128</text>
    <text x="229"  y="154" class="bodyb">&#8722;127</text>
    <text x="342"  y="154" class="body">&#8230;</text>
    <text x="455"  y="154" class="bodyb">&#8722;1</text>
    <text x="568"  y="154" class="bodyb">0</text>
    <text x="681"  y="154" class="bodyb">1</text>
    <text x="794"  y="154" class="body">&#8230;</text>
    <text x="907"  y="154" class="bodyb">126</text>
    <text x="1020" y="154" class="bodyb">127</text>
    <text x="116"  y="172" class="small">low</text>
    <text x="1020" y="172" class="smallb">high (default)</text>
  </g>

  <text x="60" y="200" class="smallD">index arithmetic: cache[i + (&#8722;IntegerCache.low)] = cache[i + 128]</text>

  <rect x="60" y="212" width="270" height="48" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="76" y="232" class="code">static final int low = &#8722;128;</text>
  <text x="76" y="250" class="small">fixed &#8212; cannot be lowered by any flag</text>

  <rect x="350" y="212" width="270" height="48" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="366" y="232" class="code">static final int high;</text>
  <text x="366" y="250" class="small">127 by default &#8212; settable upward only</text>

  <rect x="640" y="200" width="440" height="86" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="656" y="220" class="smallb">Integer.valueOf source, verbatim</text>
  <text x="656" y="242" class="code">if (i &gt;= IntegerCache.low &amp;&amp; i &lt;= IntegerCache.high)</text>
  <text x="672" y="260" class="code">return IntegerCache.cache[i + (-IntegerCache.low)];</text>
  <text x="656" y="278" class="code">return new Integer(i);</text>

  <!-- ============ SECTION 2 ============ -->
  <text x="20" y="316" class="h2">SECTION 2 &#8212; TWO REFERENCES AT THE BOUNDARY</text>

  <text x="80"  y="344" class="h2">127 &#8212; INSIDE THE CACHE RANGE [&#8722;128, 127]</text>
  <text x="635" y="344" class="h2">128 &#8212; ONE PAST THE DEFAULT high</text>

  <!-- left refs -->
  <rect x="80" y="356" width="230" height="54" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="96" y="378" class="code">retryCount = 127</text>
  <text x="96" y="396" class="small">Application doc-verify retries</text>

  <rect x="80" y="424" width="230" height="54" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="96" y="446" class="code">retryCountFromDb = 127</text>
  <text x="96" y="464" class="small">same count read back from DB</text>

  <rect x="350" y="368" width="215" height="98" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="366" y="390" class="bodyb">ONE Integer object</text>
  <text x="366" y="410" class="code">value = 127</text>
  <text x="366" y="430" class="smallD">IntegerCache.cache[255]</text>
  <text x="366" y="450" class="smallD">identityHashCode = 692404036</text>

  <path d="M 310 383 H 350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr025)"/>
  <path d="M 310 451 H 350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr025)"/>

  <text x="80" y="500" class="bodyb">retryCount == retryCountFromDb  &#8594;  true</text>
  <text x="80" y="518" class="small">one object, both references identical &#8212; valueOf took the cache branch</text>

  <!-- right refs -->
  <rect x="635" y="356" width="230" height="54" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="651" y="378" class="code">restrictionCount = 128</text>
  <text x="651" y="396" class="small">DEPOSIT_LIMITED count</text>

  <rect x="635" y="424" width="230" height="54" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="651" y="446" class="code">countFromDb = 128</text>
  <text x="651" y="464" class="small">same count read back from DB</text>

  <rect x="890" y="356" width="190" height="54" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="906" y="378" class="code">new Integer(128)</text>
  <text x="906" y="396" class="smallD">idHash = 1670675563</text>

  <rect x="890" y="424" width="190" height="54" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="906" y="446" class="code">new Integer(128)</text>
  <text x="906" y="464" class="smallD">idHash = 723074861</text>

  <path d="M 865 383 H 890" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr025)"/>
  <path d="M 865 451 H 890" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr025)"/>

  <text x="635" y="500" class="bodyb">restrictionCount == countFromDb  &#8594;  false</text>
  <text x="635" y="518" class="small">two objects, references differ &#8212; valueOf took the new Integer branch</text>

  <!-- ============ ANNOTATION PANELS ============ -->
  <rect x="60" y="544" width="500" height="165" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="76" y="566" class="bodyb">MEASURED BOUNDARY BEHAVIOUR</text>
  <text x="76" y="588" class="smallD">Integer a = 127, b = 127;   a == b &#8594; true</text>
  <text x="76" y="606" class="smallD">identityHashCode(a) = 692404036 = identityHashCode(b)</text>
  <text x="76" y="624" class="smallD">Integer c = 128, d = 128;   c == d &#8594; false</text>
  <text x="76" y="642" class="smallD">identityHashCode(c) = 1670675563, (d) = 723074861</text>
  <text x="76" y="660" class="smallD">Integer.valueOf(&#8722;128) == Integer.valueOf(&#8722;128) &#8594; true</text>
  <text x="76" y="678" class="smallD">Integer.valueOf(&#8722;129) == Integer.valueOf(&#8722;129) &#8594; false</text>
  <text x="76" y="698" class="small">Oracle JDK 21.0.7+8-LTS-245, macOS aarch64</text>

  <rect x="580" y="544" width="500" height="165" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="596" y="566" class="bodyb">CONFIGURING high</text>
  <text x="596" y="588" class="smallD">high defaults to 127; low is fixed at &#8722;128 and cannot be lowered</text>
  <text x="596" y="606" class="smallD">-XX:AutoBoxCacheMax=&lt;n&gt;  (C2 product flag, default 128)</text>
  <text x="596" y="624" class="smallD">-Djava.lang.Integer.IntegerCache.high=&lt;n&gt;</text>
  <text x="596" y="642" class="smallD">measured with -XX:AutoBoxCacheMax=1000 :</text>
  <text x="596" y="660" class="smallD">Integer.valueOf(1000) == Integer.valueOf(1000) &#8594; true</text>
  <text x="596" y="678" class="smallD">cache length at default = 256; raising high enlarges the array</text>
  <text x="596" y="698" class="small">it never adds slots below &#8722;128</text>

  <!-- ============ LEGEND ============ -->
  <text x="20" y="740" class="h2">LEGEND</text>
  <line x1="20" y1="748" x2="1120" y2="748" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="760" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="773" class="small">reference variable holding a boxed count (retryCount, restrictionCount)</text>

  <rect x="30" y="786" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="58" y="799" class="small">a cached slot / the one shared Integer object &#8212; == compares true</text>

  <rect x="30" y="812" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="58" y="825" class="small">distinct objects from new Integer(i) &#8212; == compares false</text>

  <rect x="30" y="838" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="851" class="small">measured annotation panel</text>

  <rect x="600" y="760" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="628" y="773" class="small">the configurable high and the boundary slot cache[255] = 127</text>

  <rect x="600" y="786" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="628" y="799" class="small">JDK source listing, the fixed low constant, elided array slots</text>

  <line x1="600" y1="820" x2="626" y2="820" stroke="#475569" stroke-width="2" marker-end="url(#arr025)"/>
  <text x="634" y="825" class="small">refers to : A &#8594; B, the variable A points at the heap object B</text>
</svg>
