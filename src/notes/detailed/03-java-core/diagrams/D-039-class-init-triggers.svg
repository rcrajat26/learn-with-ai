<svg viewBox="0 0 1650 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Decision tree titled what triggers class initialization. A root node, you touched a class, fans out on a shared bus into seven branches: new Reservation(...), getstatic BonusRules.grantsIssued (non-constant), invokestatic BonusRules.grantFor(...), Class.forName(&quot;BonusRules&quot;), initializing a subclass of BonusRules, BonusRules is the main class, and getstatic BonusRules.MAX_BONUS. The first six converge on a second bus into one green terminal box reading runs &lt;clinit&gt;. The seventh branch, reading static final int MAX_BONUS = 100, a compile-time constant, is drawn in amber and leads instead to its own terminal box reading no initialization: the value was inlined at compile time, because static final fields initialized by a constant expression are inlined into callers at compile time and never trigger the field-owning class to load.">
  <defs>
    <marker id="arrow039" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1650" height="560" fill="#ffffff"/>

  <text x="825" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">What triggers class initialization</text>
  <line x1="20" y1="42" x2="1630" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ROOT -->
  <rect x="650" y="60" width="260" height="54" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="780" y="93" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">you touched a class</text>

  <!-- stub root -> bus1 -->
  <line x1="780" y1="114" x2="780" y2="150" stroke="#475569" stroke-width="2"/>
  <!-- bus1 -->
  <line x1="105" y1="150" x2="1470" y2="150" stroke="#475569" stroke-width="2"/>

  <!-- drops bus1 -> branch boxes -->
  <line x1="105" y1="150" x2="105" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="330" y1="150" x2="330" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="565" y1="150" x2="565" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="780" y1="150" x2="780" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="995" y1="150" x2="995" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="1215" y1="150" x2="1215" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <line x1="1470" y1="150" x2="1470" y2="180" stroke="#b45309" stroke-width="2" marker-end="url(#arrow039)"/>

  <!-- BOX 1: new -->
  <rect x="20" y="180" width="170" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="105" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">new Reservation(...)</text>

  <!-- BOX 2: getstatic non-constant -->
  <rect x="205" y="180" width="250" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="330" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">getstatic BonusRules.grantsIssued</text>
  <text x="330" y="228" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(non-constant)</text>

  <!-- BOX 3: invokestatic -->
  <rect x="470" y="180" width="190" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="565" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">invokestatic</text>
  <text x="565" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">BonusRules.grantFor(...)</text>

  <!-- BOX 4: reflection -->
  <rect x="675" y="180" width="210" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="780" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Class.forName("BonusRules")</text>

  <!-- BOX 5: subclass init -->
  <rect x="900" y="180" width="190" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="995" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">initializing a subclass</text>
  <text x="995" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">of BonusRules</text>

  <!-- BOX 6: main class -->
  <rect x="1105" y="180" width="220" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1215" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">BonusRules is the main class</text>

  <!-- BOX 7: constant read (exception branch) -->
  <rect x="1340" y="180" width="260" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="1470" y="206" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">getstatic BonusRules.MAX_BONUS</text>
  <text x="1470" y="226" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">static final int MAX_BONUS = 100</text>
  <text x="1470" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">&#8212; a compile-time constant</text>

  <!-- convergence: boxes 1-6 -> bus2 -> green terminal -->
  <line x1="105" y1="244" x2="105" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="330" y1="244" x2="330" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="565" y1="244" x2="565" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="780" y1="244" x2="780" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="995" y1="244" x2="995" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="1215" y1="244" x2="1215" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="105" y1="280" x2="1215" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="280" x2="660" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>

  <rect x="520" y="310" width="280" height="54" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="660" y="343" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">runs &lt;clinit&gt;</text>

  <!-- box7 -> its own amber terminal -->
  <line x1="1470" y1="270" x2="1470" y2="310" stroke="#b45309" stroke-width="2" marker-end="url(#arrow039)"/>
  <rect x="1320" y="310" width="300" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="1470" y="333" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">no initialization:</text>
  <text x="1470" y="351" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">the value was inlined at compile time</text>

  <!-- LEGEND -->
  <text x="20" y="410" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="20" y1="418" x2="1630" y2="418" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="432" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="445" font-family="sans-serif" font-size="11" fill="#4b5563">triggering bytecode / API &#8212; leads to &lt;clinit&gt; running</text>

  <rect x="480" y="432" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="508" y="445" font-family="sans-serif" font-size="11" fill="#4b5563">compile-time-constant read &#8212; the exception path</text>

  <rect x="880" y="432" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="908" y="445" font-family="sans-serif" font-size="11" fill="#4b5563">terminal: class initialization actually runs</text>

  <line x1="1230" y1="440" x2="1252" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow039)"/>
  <text x="1258" y="445" font-family="sans-serif" font-size="11" fill="#4b5563">fan-out / fan-in via a shared bus</text>
</svg>
