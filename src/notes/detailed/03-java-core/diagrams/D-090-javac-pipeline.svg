<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The javac pipeline for StakeSplit.java: parse, enter, annotation processing (looping back to enter), attribute, flow, desugar, generate, plus a closing box of what javac deliberately does not do">
  <defs>
    <marker id="arrow090" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- header banner: compilation unit -->
  <rect x="30" y="22" width="1140" height="26" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="600" y="40" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">record StakeSplit(Money bonusPortion, Money cashPortion) { static StakeSplit of(Money stake) {...} } — splits 3.33 into 0.33 bonus + 3.00 cash; enhanced-for over List&lt;Reservation&gt;</text>

  <!-- Row 1: parse, enter, annotation processing, attribute -->
  <rect x="30" y="80" width="250" height="140" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="155" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">parse</text>
  <text x="155" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">syntax tree for</text>
  <text x="155" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">StakeSplit.java;</text>
  <text x="155" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">0.33 is still a</text>
  <text x="155" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">literal token</text>

  <rect x="310" y="80" width="250" height="140" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="435" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">enter</text>
  <text x="435" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">symbol table:</text>
  <text x="435" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">StakeSplit,</text>
  <text x="435" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">its two components,</text>
  <text x="435" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">of(Money)</text>

  <rect x="590" y="80" width="250" height="140" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="715" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">annotation processing</text>
  <text x="715" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">javax.annotation.processing</text>
  <text x="715" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">round; may add</text>
  <text x="715" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">generated sources,</text>
  <text x="715" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">then re-enter</text>

  <rect x="870" y="80" width="250" height="140" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="995" y="103" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">attribute</text>
  <text x="995" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">types + overload</text>
  <text x="995" y="141" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">selection: which</text>
  <text x="995" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Money.add overload,</text>
  <text x="995" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">which BigDecimal.setScale</text>

  <!-- Row 1 sequential arrows -->
  <line x1="280" y1="150" x2="310" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>
  <line x1="560" y1="150" x2="590" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>
  <line x1="840" y1="150" x2="870" y2="150" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>

  <!-- feedback arrow: annotation processing back to enter -->
  <path d="M 715 80 C 715 55 435 55 435 80" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>
  <rect x="525" y="44" width="100" height="20" rx="3" fill="#fef3c7"/>
  <text x="575" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">another round</text>

  <!-- connector: attribute (row1) down to flow (row2) -->
  <path d="M 995 220 L 995 270 L 155 270 L 155 320" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>
  <rect x="1005" y="240" width="80" height="20" rx="3" fill="#e5e7eb"/>
  <text x="1045" y="254" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">next phase</text>

  <!-- Row 2: flow, desugar, generate -->
  <rect x="30" y="320" width="250" height="140" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="155" y="343" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">flow</text>
  <text x="155" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">definite assignment +</text>
  <text x="155" y="381" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">reachability for of(Money);</text>
  <text x="155" y="396" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">this-escape lint</text>
  <text x="155" y="411" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">(Java 21)</text>

  <rect x="310" y="320" width="250" height="140" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="435" y="343" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">desugar</text>
  <text x="435" y="364" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">enhanced-for over List&lt;Reservation&gt;</text>
  <text x="435" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">to an Iterator loop;</text>
  <text x="435" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">record equals/hashCode/toString;</text>
  <text x="435" y="406" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">string concat to invokedynamic;</text>
  <text x="435" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">generic cast insertion</text>

  <rect x="590" y="320" width="250" height="140" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="715" y="343" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">generate</text>
  <text x="715" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">StakeSplit.class</text>
  <text x="715" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">major version 65</text>

  <!-- Row 2 sequential arrows -->
  <line x1="280" y1="390" x2="310" y2="390" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>
  <line x1="560" y1="390" x2="590" y2="390" stroke="#737373" stroke-width="2" marker-end="url(#arrow090)"/>

  <!-- closing box: what javac does NOT do -->
  <rect x="30" y="500" width="1140" height="90" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="600" y="528" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">What javac does NOT do:</text>
  <text x="600" y="550" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">no method inlining · no loop optimisation · no constant propagation beyond constant expressions · no escape analysis</text>
  <text x="600" y="572" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">— all of that is the JIT's job</text>
</svg>
