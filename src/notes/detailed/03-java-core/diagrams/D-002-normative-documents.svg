<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The three normative documents JLS 21, JVMS 21 and API javadoc, each with the questions it answers listed underneath, and all 19 JLS 21 chapters enumerated below the JLS 21 root">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1f2937">The three normative documents and what each owns</text>

  <!-- root: JLS 21 -->
  <rect x="30" y="50" width="260" height="45" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="160" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">JLS 21</text>

  <!-- root: JVMS 21 -->
  <rect x="330" y="50" width="260" height="45" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="460" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">JVMS 21</text>

  <!-- root: API javadoc -->
  <rect x="630" y="50" width="240" height="45" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="750" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">API javadoc</text>

  <!-- JLS 21 sub-questions -->
  <g>
    <rect x="30" y="120" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="141" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">conversions ch.5</text>
    <line x1="160" y1="120" x2="160" y2="95" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="30" y="160" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="181" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">expressions ch.15</text>
    <line x1="160" y1="160" x2="160" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="30" y="200" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="221" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">definite assignment ch.16</text>
    <line x1="160" y1="200" x2="160" y2="192" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="30" y="240" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">initialization ch.12</text>
    <line x1="160" y1="240" x2="160" y2="232" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="30" y="280" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="160" y="301" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">binary compatibility ch.13</text>
    <line x1="160" y1="280" x2="160" y2="272" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>

  <!-- JVMS 21 sub-questions -->
  <g>
    <rect x="330" y="120" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="460" y="141" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">class file</text>
    <line x1="460" y1="120" x2="460" y2="95" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="330" y="160" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="460" y="181" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">&lt;clinit&gt;</text>
    <line x1="460" y1="160" x2="460" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="330" y="200" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="460" y="221" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">dispatch</text>
    <line x1="460" y1="200" x2="460" y2="192" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="330" y="240" width="260" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="460" y="261" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">verification</text>
    <line x1="460" y1="240" x2="460" y2="232" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>

  <!-- API javadoc sub-questions -->
  <g>
    <rect x="630" y="120" width="240" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="750" y="141" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">method contracts</text>
    <line x1="750" y1="120" x2="750" y2="95" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
  <g>
    <rect x="630" y="160" width="240" height="32" rx="5" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
    <text x="750" y="181" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">null policy</text>
    <line x1="750" y1="160" x2="750" y2="152" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>

  <!-- 19 chapters section -->
  <text x="450" y="345" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">All 19 JLS 21 chapters</text>

  <rect x="380" y="358" width="140" height="30" rx="5" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="450" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">JLS 21</text>

  <line x1="450" y1="410" x2="450" y2="390" stroke="#737373" stroke-width="2" marker-end="url(#arrow2)"/>
  <rect x="360" y="393" width="180" height="20" rx="3" fill="#fef3c7"/>
  <text x="450" y="407" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">19 chapters of JLS 21</text>

  <!-- grid of 19 chapters, 3 columns x 7 rows -->
  <g font-family="sans-serif" font-size="12" fill="#1f2937">
    <rect x="30" y="420" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="447" text-anchor="middle">1 Introduction</text>

    <rect x="310" y="420" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="447" text-anchor="middle">2 Grammars</text>

    <rect x="590" y="420" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="447" text-anchor="middle">3 Lexical Structure</text>

    <rect x="30" y="480" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="507" text-anchor="middle">4 Types Values and Variables</text>

    <rect x="310" y="480" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="507" text-anchor="middle">5 Conversions and Contexts</text>

    <rect x="590" y="480" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="507" text-anchor="middle">6 Names</text>

    <rect x="30" y="540" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="567" text-anchor="middle">7 Packages and Modules</text>

    <rect x="310" y="540" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="567" text-anchor="middle">8 Classes</text>

    <rect x="590" y="540" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="567" text-anchor="middle">9 Interfaces</text>

    <rect x="30" y="600" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="627" text-anchor="middle">10 Arrays</text>

    <rect x="310" y="600" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="627" text-anchor="middle">11 Exceptions</text>

    <rect x="590" y="600" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="627" text-anchor="middle">12 Execution</text>

    <rect x="30" y="660" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="687" text-anchor="middle">13 Binary Compatibility</text>

    <rect x="310" y="660" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="687" text-anchor="middle" font-size="11">14 Blocks Statements and Patterns</text>

    <rect x="590" y="660" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="687" text-anchor="middle">15 Expressions</text>

    <rect x="30" y="720" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="747" text-anchor="middle">16 Definite Assignment</text>

    <rect x="310" y="720" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="440" y="747" text-anchor="middle">17 Threads and Locks</text>

    <rect x="590" y="720" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="720" y="747" text-anchor="middle">18 Type Inference</text>

    <rect x="30" y="780" width="260" height="45" rx="5" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
    <text x="160" y="807" text-anchor="middle">19 Syntax</text>
  </g>
</svg>
