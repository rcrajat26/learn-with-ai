<svg viewBox="0 0 1100 1040" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Overload resolution in three phases for a call with argument int stakeMinor = 420 against candidates reserve(int), reserve(long), reserve(Integer), reserve(int...). Phase 1 (no boxing, no varargs) finds reserve(int) an exact match and reserve(long) applicable by widening; reserve(int) wins. Phase 2 (boxing allowed) has reserve(Integer) as the only applicable candidate and it wins. Phase 3 (varargs allowed) has reserve(int...) as the only applicable candidate and it wins as a last resort. Two annotation panels give verified JDK 21.0.7 outcomes and a note on overload resolution with a null argument.">
  <defs>
    <marker id="arrow043" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="1040" fill="#ffffff"/>

  <text x="550" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">Overload resolution in three phases</text>
  <line x1="20" y1="42" x2="1080" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- entry -->
  <rect x="420" y="55" width="260" height="55" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="550" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">ARGUMENT</text>
  <text x="550" y="95" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">int stakeMinor = 420</text>

  <line x1="550" y1="110" x2="550" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow043)"/>

  <!-- PHASE 1 -->
  <rect x="100" y="140" width="900" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="162" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PHASE 1 &#8212; no boxing, no varargs (widening only)</text>
  <line x1="120" y1="170" x2="980" y2="170" stroke="#d1d5db" stroke-width="1"/>

  <rect x="260" y="180" width="280" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="400" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">reserve(int)</text>
  <text x="400" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">applicable - exact match</text>
  <text x="400" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">PHASE 1 WINNER</text>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(int argument, all four present)</text>

  <rect x="560" y="180" width="280" height="90" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="700" y="204" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">reserve(long)</text>
  <text x="700" y="224" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">applicable - widening (int -&gt; long)</text>
  <text x="700" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">not the winner here</text>
  <text x="700" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(wins only if reserve(int) absent)</text>

  <line x1="550" y1="290" x2="550" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow043)"/>
  <text x="570" y="309" font-family="sans-serif" font-size="11" fill="#4b5563">if no applicable candidate in phase 1</text>

  <!-- PHASE 2 -->
  <rect x="100" y="320" width="900" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="342" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PHASE 2 &#8212; boxing/unboxing allowed</text>
  <line x1="120" y1="350" x2="980" y2="350" stroke="#d1d5db" stroke-width="1"/>

  <rect x="410" y="360" width="280" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="550" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">reserve(Integer)</text>
  <text x="550" y="404" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">applicable - boxing (int -&gt; Integer)</text>
  <text x="550" y="424" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">PHASE 2 WINNER</text>
  <text x="550" y="440" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(only candidate once varargs excluded)</text>

  <line x1="550" y1="470" x2="550" y2="500" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow043)"/>
  <text x="570" y="489" font-family="sans-serif" font-size="11" fill="#4b5563">if no applicable candidate in phase 2</text>

  <!-- PHASE 3 -->
  <rect x="100" y="500" width="900" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="522" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PHASE 3 &#8212; variable arity (varargs) allowed</text>
  <line x1="120" y1="530" x2="980" y2="530" stroke="#d1d5db" stroke-width="1"/>

  <rect x="410" y="540" width="280" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="550" y="564" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">reserve(int...)</text>
  <text x="550" y="584" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">applicable - varargs (int -&gt; int[])</text>
  <text x="550" y="604" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">PHASE 3 WINNER</text>
  <text x="550" y="620" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(last resort - phases 1 &amp; 2 empty)</text>

  <!-- annotation panels -->
  <rect x="100" y="680" width="440" height="190" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="702" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">VERIFIED &#8212; JDK 21.0.7 measured outcomes</text>
  <line x1="120" y1="710" x2="520" y2="710" stroke="#d1d5db" stroke-width="1"/>
  <text x="120" y="728" font-family="sans-serif" font-size="11" fill="#1f2937">All four overloads present, int argument -&gt;</text>
  <text x="120" y="746" font-family="sans-serif" font-size="11" fill="#1f2937">reserve(int) wins in phase 1 (exact match).</text>
  <text x="120" y="764" font-family="sans-serif" font-size="11" fill="#1f2937">reserve(int) removed -&gt; reserve(long) wins in</text>
  <text x="120" y="782" font-family="sans-serif" font-size="11" fill="#1f2937">phase 1 (widening is still phase 1, no boxing).</text>
  <text x="120" y="800" font-family="sans-serif" font-size="11" fill="#1f2937">Only reserve(Integer) and reserve(int...) present</text>
  <text x="120" y="818" font-family="sans-serif" font-size="11" fill="#1f2937">-&gt; reserve(Integer) wins in phase 2 (boxing beats varargs).</text>

  <rect x="560" y="680" width="440" height="160" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="580" y="702" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">NOTE &#8212; reserve(null) and ambiguity</text>
  <line x1="580" y1="710" x2="980" y2="710" stroke="#d1d5db" stroke-width="1"/>
  <text x="580" y="728" font-family="sans-serif" font-size="11" fill="#1f2937">pick(null) with pick(String) / pick(Object)</text>
  <text x="580" y="746" font-family="sans-serif" font-size="11" fill="#1f2937">candidates selects pick(String) (most specific).</text>
  <text x="580" y="764" font-family="sans-serif" font-size="11" fill="#1f2937">route(null) with route(StringBuilder) /</text>
  <text x="580" y="782" font-family="sans-serif" font-size="11" fill="#1f2937">route(Integer) is a compile error:</text>
  <text x="580" y="800" font-family="sans-serif" font-size="11" fill="#1f2937">javac 21: "reference to route is ambiguous"</text>

  <!-- legend -->
  <text x="100" y="900" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="100" y1="908" x2="1000" y2="908" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="110" y="920" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="138" y="933" font-family="sans-serif" font-size="11" fill="#4b5563">phase container</text>

  <rect x="110" y="944" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="138" y="957" font-family="sans-serif" font-size="11" fill="#4b5563">phase winner (resolved candidate)</text>

  <rect x="110" y="968" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="138" y="981" font-family="sans-serif" font-size="11" fill="#4b5563">applicable candidate, not selected</text>

  <rect x="560" y="920" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="588" y="933" font-family="sans-serif" font-size="11" fill="#4b5563">argument driving resolution</text>

  <rect x="560" y="944" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="588" y="957" font-family="sans-serif" font-size="11" fill="#4b5563">annotation panel &#8212; verified fact</text>

  <line x1="560" y1="976" x2="582" y2="976" stroke="#475569" stroke-width="2" marker-end="url(#arrow043)"/>
  <text x="588" y="981" font-family="sans-serif" font-size="11" fill="#4b5563">resolution flow into a phase</text>

  <line x1="800" y1="976" x2="822" y2="976" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow043)"/>
  <text x="828" y="981" font-family="sans-serif" font-size="11" fill="#4b5563">fallback to next phase (no applicable candidate)</text>
</svg>
