<svg viewBox="0 0 1120 920" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three stacked panels distinguishing shadowing, obscuring, and hiding using Account and ShellAccount. Shadowing panel: the Account(LimitSet limits) constructor parameter shadows the field private LimitSet limits, so the unqualified statement limits = limits reassigns the parameter and the field stays null; the fix is this.limits = limits. Obscuring panel: inside applyStake, a local variable int Money obscures the type Money, so the simple name Money then means the int; the fix is referencing the type by its fully qualified name com.quizstakes.model.Money. Hiding panel: ShellAccount extends Account and redeclares field status, so a single ShellAccount instance carries two separate field slots, Account.status = PENDING_VERIFICATION and ShellAccount.status = ACTIVE, and two references above the object, an Account-typed reference and a ShellAccount-typed reference, each draw a separate orthogonal edge down into the slot it actually resolves to at compile time, based on the static type of the reference rather than the runtime class.">
  <defs>
    <marker id="arrow013" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="920" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">Shadowing, obscuring, and hiding are three different things</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ============ BAND 1: SHADOWING ============ -->
  <text x="20" y="64" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">SHADOWING</text>
  <line x1="20" y1="72" x2="1100" y2="72" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="86" width="320" height="90" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="180" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">class Account</text>
  <text x="180" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">private LimitSet limits;</text>
  <text x="180" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(the field)</text>

  <line x1="340" y1="131" x2="400" y2="131" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>

  <rect x="400" y="86" width="320" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="560" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">Account(LimitSet limits) {</text>
  <text x="560" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">limits = limits;  // reassigns the PARAMETER</text>
  <text x="560" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">}  // field Account.limits is still null</text>

  <line x1="720" y1="131" x2="780" y2="131" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>

  <rect x="780" y="86" width="320" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="940" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">Account(LimitSet limits) {</text>
  <text x="940" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">this.limits = limits;  // reaches the FIELD</text>
  <text x="940" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">}  // field Account.limits is now set</text>

  <text x="560" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">SHADOWING = a nearer-scope declaration (the constructor parameter) hides an outer one (the field);</text>
  <text x="560" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">unqualified limits resolves to the parameter &#8212; qualify with this.limits to reach the field.</text>

  <!-- ============ BAND 2: OBSCURING ============ -->
  <text x="20" y="246" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">OBSCURING</text>
  <line x1="20" y1="254" x2="1100" y2="254" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="268" width="320" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">type Money</text>
  <text x="180" y="308" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">record Money(amount, currency)</text>
  <text x="180" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(the value type)</text>

  <line x1="340" y1="313" x2="400" y2="313" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>

  <rect x="400" y="268" width="320" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="560" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">within applyStake(...) {</text>
  <text x="560" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">int Money = stakeMinorUnits;  // obscures type</text>
  <text x="560" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Money m = ...;  // ERROR: means the int now</text>

  <line x1="720" y1="313" x2="780" y2="313" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>

  <rect x="780" y="268" width="320" height="90" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="940" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">to reach the type despite the local:</text>
  <text x="940" y="308" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">com.quizstakes.model.Money bonusPortion = ...;</text>
  <text x="940" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">// qualified name always finds the type</text>

  <text x="560" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">OBSCURING = a variable, field, or parameter with the same simple name as a type or package hides</text>
  <text x="560" y="394" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">that name for simple-name lookup in its scope; the type still exists &#8212; reach it by fully qualified name.</text>

  <!-- ============ BAND 3: HIDING ============ -->
  <text x="20" y="428" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">HIDING</text>
  <line x1="20" y1="436" x2="1100" y2="436" stroke="#d1d5db" stroke-width="1"/>

  <rect x="330" y="450" width="260" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="460" y="477" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">Account ref</text>

  <rect x="650" y="450" width="260" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="780" y="477" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">ShellAccount ref</text>

  <line x1="460" y1="494" x2="460" y2="628" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>
  <line x1="780" y1="494" x2="780" y2="628" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>

  <rect x="290" y="584" width="660" height="110" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="620" y="602" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937">TWO STATUS SLOTS, ONE INSTANCE</text>

  <rect x="320" y="628" width="280" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="460" y="653" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Account.status = PENDING_VERIFICATION</text>

  <rect x="640" y="628" width="280" height="40" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="780" y="653" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">ShellAccount.status = ACTIVE</text>

  <text x="560" y="712" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">HIDING = ShellAccount extends Account and redeclares field status; this hides (does not override) the</text>
  <text x="560" y="728" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">inherited field, so a ShellAccount instance carries BOTH slots simultaneously. Which slot a read sees</text>
  <text x="560" y="744" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">depends on the STATIC type of the reference, not the runtime class &#8212; unlike method overriding.</text>

  <!-- ============ LEGEND ============ -->
  <text x="20" y="778" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="20" y1="786" x2="1100" y2="786" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="800" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="813" font-family="sans-serif" font-size="11" fill="#4b5563">the subject &#8212; field, type, or reference being discussed</text>

  <rect x="30" y="824" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="58" y="837" font-family="sans-serif" font-size="11" fill="#4b5563">the shadowing/obscuring occurrence, or a hidden field slot</text>

  <rect x="30" y="848" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="58" y="861" font-family="sans-serif" font-size="11" fill="#4b5563">the fix, or the correct way to reach the intended name</text>

  <rect x="600" y="800" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="628" y="813" font-family="sans-serif" font-size="11" fill="#4b5563">container / declaration context (a class, a method body, an object instance)</text>

  <line x1="600" y1="832" x2="622" y2="832" stroke="#475569" stroke-width="2" marker-end="url(#arrow013)"/>
  <text x="628" y="837" font-family="sans-serif" font-size="11" fill="#4b5563">reference &#8594; the field slot it resolves to (static-type-decided, not dispatched)</text>
</svg>
