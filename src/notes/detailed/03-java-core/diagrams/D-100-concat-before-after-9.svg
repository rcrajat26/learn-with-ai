<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The + operator before and after Java 9: the same concatenation of a literal, clientId, and statusCode compiles to a chain of StringBuilder append calls on Java 8, and to a single invokedynamic call site backed by a reusable CallSite on Java 9 and later">
  <defs>
    <marker id="arrow100" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="36" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="44" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">+ before and after Java 9</text>

  <rect x="20" y="66" width="860" height="56" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">"client " + clientId + " -&gt; " + statusCode</text>
  <text x="450" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">produces: client 4f2a... -&gt; AA-801 ACTIVATED</text>

  <!-- LEFT: Java 8 -->
  <rect x="20" y="134" width="410" height="30" rx="4" fill="#fef3c7"/>
  <text x="225" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Java 8: javap -c bytecode</text>

  <rect x="20" y="170" width="410" height="330" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="36" y="192" font-family="sans-serif" font-size="13" fill="#1f2937">new java/lang/StringBuilder</text>
  <text x="36" y="216" font-family="sans-serif" font-size="13" fill="#1f2937">dup</text>
  <text x="36" y="240" font-family="sans-serif" font-size="13" fill="#1f2937">invokespecial &lt;init&gt;</text>
  <text x="36" y="264" font-family="sans-serif" font-size="13" fill="#1f2937">ldc "client "</text>
  <text x="36" y="288" font-family="sans-serif" font-size="13" fill="#1f2937">invokevirtual append</text>
  <text x="36" y="312" font-family="sans-serif" font-size="13" fill="#1f2937">aload clientId</text>
  <text x="36" y="336" font-family="sans-serif" font-size="13" fill="#1f2937">invokevirtual append</text>
  <text x="36" y="360" font-family="sans-serif" font-size="13" fill="#1f2937">ldc " -&gt; "</text>
  <text x="36" y="384" font-family="sans-serif" font-size="13" fill="#1f2937">invokevirtual append</text>
  <text x="36" y="408" font-family="sans-serif" font-size="13" fill="#1f2937">aload statusCode</text>
  <text x="36" y="432" font-family="sans-serif" font-size="13" fill="#1f2937">invokevirtual append</text>
  <text x="36" y="456" font-family="sans-serif" font-size="13" fill="#1f2937">invokevirtual toString</text>
  <text x="36" y="484" font-family="sans-serif" font-size="13" fill="#1f2937">-- 12 instructions, every call site</text>

  <!-- RIGHT: Java 9+ -->
  <rect x="470" y="134" width="410" height="30" rx="4" fill="#dcfce7"/>
  <text x="675" y="155" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Java 9+: javap -c bytecode</text>

  <rect x="470" y="170" width="410" height="80" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="490" y="196" font-family="sans-serif" font-size="13" fill="#1f2937">invokedynamic #0:</text>
  <text x="490" y="220" font-family="sans-serif" font-size="13" fill="#1f2937">makeConcatWithConstants</text>
  <text x="490" y="240" font-family="sans-serif" font-size="13" fill="#1f2937">-- 1 instruction, every call site</text>

  <rect x="470" y="260" width="410" height="110" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="675" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">BootstrapMethods attribute #0</text>
  <text x="490" y="302" font-family="sans-serif" font-size="13" fill="#1f2937">REF_invokeStatic</text>
  <text x="490" y="322" font-family="sans-serif" font-size="13" fill="#1f2937">java/lang/invoke/StringConcatFactory</text>
  <text x="490" y="342" font-family="sans-serif" font-size="13" fill="#1f2937">.makeConcatWithConstants</text>
  <text x="490" y="362" font-family="sans-serif" font-size="13" fill="#1f2937">recipe: "client \1 -&gt; \1"</text>

  <line x1="675" y1="370" x2="675" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow100)"/>

  <rect x="470" y="400" width="410" height="100" rx="6" fill="#dbeafe" stroke="#525252" stroke-width="2"/>
  <text x="675" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">installed CallSite</text>
  <text x="675" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bootstrap method runs ONCE,</text>
  <text x="675" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">links a MethodHandle chain,</text>
  <text x="675" y="488" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">every later execution reuses it</text>

  <rect x="20" y="520" width="860" height="70" rx="6" fill="#fef3c7" stroke="#525252" stroke-width="2"/>
  <text x="450" y="542" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">VERSION TRAP</text>
  <text x="450" y="562" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">the same source line compiles to different bytecode depending on --release / javac target;</text>
  <text x="450" y="580" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">the shape of + is a build-time detail, not a language guarantee you can rely on</text>
</svg>
