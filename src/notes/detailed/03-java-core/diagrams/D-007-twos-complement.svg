<svg viewBox="0 0 820 1040" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two's complement bit patterns for Integer.MIN_VALUE, its negation, Math.abs on it, and byte 200 cast to -56">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <text x="410" y="40" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937">Two's complement and the asymmetric range</text>

  <!-- Frame 1 -->
  <rect x="20" y="60" width="780" height="200" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="72" width="90" height="24" rx="3" fill="#dbeafe"/>
  <text x="81" y="89" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1</text>
  <text x="400" y="89" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Integer.MIN_VALUE has no positive counterpart</text>

  <rect x="60" y="110" width="700" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="410" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Integer.MIN_VALUE = 0x80000000</text>
  <text x="410" y="156" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">1000 0000 0000 0000 0000 0000 0000 0000</text>

  <text x="410" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">32-bit signed int: sign bit set, all magnitude bits zero</text>
  <text x="410" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">range is -2147483648 .. 2147483647 (one more negative value than positive)</text>

  <!-- Frame 2 -->
  <rect x="20" y="280" width="780" height="220" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="292" width="90" height="24" rx="3" fill="#fef3c7"/>
  <text x="81" y="309" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2</text>
  <text x="400" y="309" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Negation = invert-plus-one, wraps back to itself</text>

  <rect x="60" y="330" width="700" height="46" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="410" y="358" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">invert(1000 0000 0000 0000 0000 0000 0000 0000) = 0111 1111 1111 1111 1111 1111 1111 1111</text>

  <line x1="410" y1="376" x2="410" y2="400" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="380" width="160" height="22" rx="3" fill="#fef3c7"/>
  <text x="410" y="396" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">+ 1</text>

  <rect x="60" y="410" width="700" height="46" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="410" y="438" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">0111 1111 1111 1111 1111 1111 1111 1111 + 1 = 1000 0000 0000 0000 0000 0000 0000 0000</text>

  <text x="410" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">-(Integer.MIN_VALUE) produces the same bit pattern: Integer.MIN_VALUE</text>

  <!-- Frame 3 -->
  <rect x="20" y="520" width="780" height="180" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="532" width="90" height="24" rx="3" fill="#fee2e2"/>
  <text x="81" y="549" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3</text>
  <text x="400" y="549" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Math.abs cannot escape the same overflow</text>

  <rect x="60" y="570" width="700" height="46" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="410" y="598" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Math.abs(Integer.MIN_VALUE) = -2147483648</text>

  <text x="410" y="640" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">the result is still negative: the one value with no positive representation</text>
  <text x="410" y="662" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">bit pattern unchanged: 1000 0000 0000 0000 0000 0000 0000 0000</text>

  <!-- Panel 4: byte -->
  <rect x="20" y="720" width="780" height="300" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="36" y="732" width="150" height="24" rx="3" fill="#dbeafe"/>
  <text x="111" y="749" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Panel 4: 8-bit byte</text>
  <text x="450" y="749" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Same argument, smaller width: (byte) 200 = -56</text>

  <rect x="140" y="780" width="220" height="60" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="250" y="802" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">int literal 200</text>
  <text x="250" y="826" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">0000 0000 0000 0000 0000 0000 1100 1000</text>

  <line x1="360" y1="810" x2="460" y2="810" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="368" y="798" width="84" height="22" rx="3" fill="#fef3c7"/>
  <text x="410" y="814" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">(byte) cast</text>

  <rect x="460" y="780" width="220" height="60" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="570" y="802" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2937">byte value -56</text>
  <text x="570" y="826" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">1100 1000</text>

  <text x="410" y="880" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">truncating to 8 bits keeps only 11001000; the sign bit (bit 7) is now 1, so the value reads as negative</text>
  <text x="410" y="902" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">invert(11001000) = 00110111, + 1 = 00111000 = 56, so the signed value is -56</text>

  <rect x="140" y="930" width="540" height="60" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="410" y="954" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">bits 11001000 -&gt; invert 00110111 -&gt; +1 -&gt; 00111000 = 56</text>
  <text x="410" y="976" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">(byte) 200 = -56</text>

</svg>
