<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout of a String holding SCREENING_IN_PROGRESS: 24-byte String header plus a 40-byte byte array, 64 bytes total">
  <defs>
    <marker id="arrow029" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="520" fill="none"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937" font-weight="bold">Inside a String: "SCREENING_IN_PROGRESS"</text>

  <!-- String instance box -->
  <rect x="50" y="70" width="280" height="248" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="190" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">String instance</text>

  <rect x="65" y="102" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="190" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">object header — 12 bytes</text>

  <rect x="65" y="132" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="190" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">value: byte[] reference — 4 bytes</text>

  <rect x="65" y="162" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="190" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hash: int — 4 bytes</text>

  <rect x="65" y="192" width="250" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="190" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">coder: byte = LATIN1 (0) — 1 byte</text>

  <rect x="65" y="222" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="190" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">hashIsZero: boolean — 1 byte</text>

  <rect x="65" y="252" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="190" y="270" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">padding — 2 bytes</text>

  <rect x="65" y="282" width="250" height="26" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="190" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">12+4+4+1+1 = 22, padded to 24 bytes</text>

  <!-- arrow from value field to byte[] -->
  <line x1="330" y1="145" x2="450" y2="145" stroke="#525252" stroke-width="2" marker-end="url(#arrow029)"/>
  <rect x="352" y="118" width="76" height="22" rx="3" fill="#fef3c7"/>
  <text x="390" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">points to</text>

  <!-- byte[] box -->
  <rect x="450" y="70" width="280" height="200" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="590" y="92" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">byte[] value (Latin-1 payload)</text>

  <rect x="465" y="102" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">array header incl. length — 16 bytes</text>

  <rect x="465" y="132" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="590" y="150" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">21 Latin-1 bytes: "SCREENING_IN_PROGRESS"</text>

  <rect x="465" y="162" width="250" height="26" rx="3" fill="#e5e7eb" stroke="#737373" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="590" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">padding — 2 bytes</text>

  <rect x="465" y="192" width="250" height="26" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="590" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">16 + 21 = 37, padded to 40 bytes</text>

  <rect x="465" y="222" width="250" height="34" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="590" y="238" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">serialVersionUID =</text>
  <text x="590" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">-6849794470754667710L</text>

  <!-- notes row -->
  <rect x="50" y="340" width="230" height="40" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="165" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">COMPACT_STRINGS = true (JDK 9+)</text>

  <rect x="300" y="340" width="230" height="40" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="415" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">LATIN1 = 0, UTF16 = 1 (coder constants)</text>

  <!-- total banner -->
  <rect x="200" y="410" width="400" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="400" y="435" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937" font-weight="bold">Total object graph size</text>
  <text x="400" y="456" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">24 bytes (String) + 40 bytes (byte[]) = 64 bytes</text>
</svg>
