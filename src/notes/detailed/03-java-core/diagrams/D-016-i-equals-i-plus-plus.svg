<svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="int attempt = 2; attempt = attempt++; traced on the JVM operand stack and local variable slot across four frames: iload pushes 2 onto the stack, iinc bumps the local to 3 without touching the stack, istore writes the stacked 2 back over the local, and the final value is 2, not 3">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="900" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">attempt = attempt++;  the stack keeps the old value, the local gets a new one</text>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">stake-reservation retry counter: int attempt</text>

  <!-- javap listing panel -->
  <rect x="40" y="62" width="880" height="120" rx="6" fill="#eff6ff" stroke="#737373" stroke-width="1.6"/>
  <text x="60" y="82" font-family="monospace" font-size="12" fill="#1f2937">0: iconst_2</text>
  <text x="60" y="100" font-family="monospace" font-size="12" fill="#1f2937">1: istore_1        // attempt = 2</text>
  <text x="60" y="118" font-family="monospace" font-size="12" fill="#1f2937">2: iload_1         // push local 1 -&gt; stack: 2</text>
  <text x="400" y="118" font-family="sans-serif" font-size="11" fill="#1f2937">&#8594; Frame 1</text>
  <text x="60" y="136" font-family="monospace" font-size="12" fill="#1f2937">3: iinc 1, 1       // local 1 += 1, stack untouched</text>
  <text x="400" y="136" font-family="sans-serif" font-size="11" fill="#1f2937">&#8594; Frame 2</text>
  <text x="60" y="154" font-family="monospace" font-size="12" fill="#1f2937">6: istore_1        // pop stack (2) -&gt; local 1</text>
  <text x="400" y="154" font-family="sans-serif" font-size="11" fill="#1f2937">&#8594; Frame 3</text>
  <text x="60" y="172" font-family="monospace" font-size="12" fill="#4b5563">// final: local 1 (attempt) == 2</text>
  <text x="400" y="172" font-family="sans-serif" font-size="11" fill="#1f2937">&#8594; Frame 4</text>

  <!-- column headers, shown once above the frame stack -->
  <text x="240" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">Local variable slot 1 (attempt)</text>
  <text x="710" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">Operand stack</text>

  <!-- Initial state -->
  <rect x="40" y="215" width="880" height="90" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="56" y="225" width="150" height="22" rx="3" fill="#e5e7eb"/>
  <text x="131" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Initial state</text>
  <text x="500" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">after iconst_2; istore_1</text>

  <rect x="90" y="255" width="300" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="240" y="280" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">attempt = 2</text>

  <rect x="560" y="255" width="300" height="40" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="710" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">(empty)</text>

  <line x1="480" y1="305" x2="480" y2="330" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 1: iload_1 -->
  <rect x="40" y="330" width="880" height="90" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="56" y="340" width="110" height="22" rx="3" fill="#dbeafe"/>
  <text x="111" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Frame 1</text>
  <text x="520" y="355" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">iload_1 pushes the local's value onto the stack</text>

  <rect x="90" y="370" width="300" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="240" y="395" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">attempt = 2</text>

  <rect x="560" y="370" width="300" height="40" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="710" y="395" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">top -&gt; 2</text>

  <line x1="480" y1="420" x2="480" y2="445" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 2: iinc -->
  <rect x="40" y="445" width="880" height="90" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="56" y="455" width="110" height="22" rx="3" fill="#fef3c7"/>
  <text x="111" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Frame 2</text>
  <text x="520" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">iinc 1, 1 bumps the local to 3; the stack is not touched</text>

  <rect x="90" y="485" width="300" height="40" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="240" y="510" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">attempt = 3</text>

  <rect x="560" y="485" width="300" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="710" y="510" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">top -&gt; 2 (unchanged)</text>

  <line x1="480" y1="535" x2="480" y2="560" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 3: istore_1 -->
  <rect x="40" y="560" width="880" height="90" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="56" y="570" width="110" height="22" rx="3" fill="#dbeafe"/>
  <text x="111" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Frame 3</text>
  <text x="520" y="585" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">istore_1 pops the stacked 2 and overwrites the local's 3</text>

  <rect x="90" y="600" width="300" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="240" y="625" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">attempt = 2 (overwritten)</text>

  <rect x="560" y="600" width="300" height="40" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="710" y="625" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#4b5563">(empty)</text>

  <line x1="480" y1="650" x2="480" y2="675" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frame 4: final -->
  <rect x="40" y="675" width="880" height="90" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="56" y="685" width="110" height="22" rx="3" fill="#dcfce7"/>
  <text x="111" y="700" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Frame 4</text>
  <text x="520" y="700" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">final value: the ++ was computed then thrown away</text>

  <rect x="330" y="715" width="300" height="40" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="480" y="740" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">attempt == 2</text>

  <!-- legend -->
  <line x1="40" y1="790" x2="920" y2="790" stroke="#d1d5db" stroke-width="1"/>
  <rect x="60" y="805" width="18" height="14" fill="#dbeafe" stroke="#737373" stroke-width="1.6"/>
  <text x="86" y="817" font-family="sans-serif" font-size="11" fill="#4b5563">stable / matching value</text>
  <rect x="280" y="805" width="18" height="14" fill="#fef3c7" stroke="#737373" stroke-width="1.6"/>
  <text x="306" y="817" font-family="sans-serif" font-size="11" fill="#4b5563">value about to change or diverging from the other column</text>
  <rect x="640" y="805" width="18" height="14" fill="#dcfce7" stroke="#737373" stroke-width="1.6"/>
  <text x="666" y="817" font-family="sans-serif" font-size="11" fill="#4b5563">final resolved value</text>

  <text x="480" y="850" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">postfix ++ reads and pushes first, then increments the local: the write-back in the</text>
  <text x="480" y="868" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">assignment (istore_1) always uses the value that was pushed, not the incremented local</text>

</svg>
