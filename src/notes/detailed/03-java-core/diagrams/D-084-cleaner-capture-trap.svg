<svg viewBox="0 0 1080 780" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The Cleaner capture trap, two object graphs. Left, broken: a LedgerFileHandle registers a Cleaner, which creates an internal PhantomCleanable, which holds a cleaning-action lambda; the lambda captures this and holds a back-edge to the LedgerFileHandle, which keeps the handle strongly reachable forever, so it is never enqueued and cleanup never runs. Right, correct: the same chain, but the cleaning action holds only a static nested State object containing a single int fileDescriptor field, with no edge back to the LedgerFileHandle, so the handle can become unreachable and the cleaner actually runs.">
  <defs>
    <marker id="arrow084struct" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow084nested" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow084bad" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="780" fill="#ffffff"/>

  <text x="540" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">The Cleaner capture trap</text>
  <line x1="20" y1="42" x2="1060" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- panel divider -->
  <line x1="540" y1="56" x2="540" y2="558" stroke="#d1d5db" stroke-width="1"/>

  <!-- LEFT: BROKEN -->
  <text x="40" y="62" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">BROKEN — the lambda captures this</text>
  <line x1="40" y1="70" x2="520" y2="70" stroke="#d1d5db" stroke-width="1"/>

  <rect x="190" y="86" width="220" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="300" y="113" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">LedgerFileHandle</text>

  <path d="M 300 130 V 152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="308" y="145" font-family="sans-serif" font-size="11" fill="#4b5563">registers</text>

  <rect x="190" y="152" width="220" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <text x="300" y="177" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">Cleaner</text>

  <path d="M 300 192 V 214" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4"
        marker-end="url(#arrow084nested)"/>

  <rect x="190" y="214" width="220" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="300" y="239" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">PhantomCleanable</text>

  <path d="M 300 254 V 276" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="308" y="269" font-family="sans-serif" font-size="11" fill="#4b5563">holds</text>

  <rect x="190" y="276" width="220" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="300" y="299" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">cleaning action</text>
  <text x="300" y="314" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#1f2937">lambda () -&gt; { this.fd.close(); }</text>

  <!-- the bug: back-edge from action to LedgerFileHandle, orthogonal, routed right of the chain -->
  <path d="M 410 298 H 460 V 108 H 410" fill="none" stroke="#b91c1c" stroke-width="2"
        marker-end="url(#arrow084bad)"/>
  <text x="500" y="200" font-family="sans-serif" font-size="11" fill="#b91c1c"
        transform="rotate(-90 500 200)" text-anchor="middle">captures this — keeps it reachable</text>

  <!-- RIGHT: CORRECT -->
  <text x="560" y="62" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">CORRECT — a static nested State</text>
  <line x1="560" y1="70" x2="1040" y2="70" stroke="#d1d5db" stroke-width="1"/>

  <rect x="710" y="86" width="220" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="113" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">LedgerFileHandle</text>

  <path d="M 820 130 V 152" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="828" y="145" font-family="sans-serif" font-size="11" fill="#4b5563">registers</text>

  <rect x="710" y="152" width="220" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <text x="820" y="177" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">Cleaner</text>

  <path d="M 820 192 V 214" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4"
        marker-end="url(#arrow084nested)"/>

  <rect x="710" y="214" width="220" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="820" y="239" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">PhantomCleanable</text>

  <path d="M 820 254 V 276" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="828" y="269" font-family="sans-serif" font-size="11" fill="#4b5563">holds</text>

  <rect x="710" y="276" width="220" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="820" y="299" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">cleaning action</text>
  <text x="820" y="314" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#1f2937">lambda referencing State only</text>

  <path d="M 820 320 V 342" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="828" y="335" font-family="sans-serif" font-size="11" fill="#4b5563">holds</text>

  <rect x="710" y="342" width="220" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="820" y="365" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">State (static nested)</text>
  <text x="820" y="386" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">int fileDescriptor</text>

  <text x="820" y="426" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">no edge back to LedgerFileHandle</text>

  <!-- annotation panel -->
  <rect x="40" y="454" width="1000" height="86" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="60" y="474" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">Why the back-edge kills the cleanup</text>
  <text x="60" y="492" font-family="sans-serif" font-size="11" fill="#1f2937">A cleaning action that reaches the referent (directly, or via a captured "this") keeps that referent</text>
  <text x="60" y="508" font-family="sans-serif" font-size="11" fill="#1f2937">strongly reachable through the Cleaner's own internal chain, so it is never enqueued as unreachable,</text>
  <text x="60" y="524" font-family="sans-serif" font-size="11" fill="#1f2937">and the registered cleaning action never runs — the file descriptor leaks for the life of the process.</text>

  <!-- legend -->
  <line x1="20" y1="560" x2="1060" y2="560" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="574" width="18" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="66" y="586" font-family="sans-serif" font-size="11" fill="#4b5563">primary subject</text>

  <rect x="280" y="574" width="18" height="14" fill="#e5e7eb" stroke="#737373" stroke-width="1.6"/>
  <text x="306" y="586" font-family="sans-serif" font-size="11" fill="#4b5563">neutral — Cleaner mechanism</text>

  <rect x="580" y="574" width="18" height="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="606" y="586" font-family="sans-serif" font-size="11" fill="#4b5563">weak / nested internal node</text>

  <rect x="860" y="574" width="18" height="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="886" y="586" font-family="sans-serif" font-size="11" fill="#4b5563">highlight — cleaning action</text>

  <rect x="40" y="598" width="18" height="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="66" y="610" font-family="sans-serif" font-size="11" fill="#4b5563">resolved / correct</text>

  <line x1="280" y1="605" x2="310" y2="605" stroke="#475569" stroke-width="2" marker-end="url(#arrow084struct)"/>
  <text x="318" y="609" font-family="sans-serif" font-size="11" fill="#4b5563">produces / holds</text>

  <line x1="580" y1="605" x2="610" y2="605" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4"
        marker-end="url(#arrow084nested)"/>
  <text x="618" y="609" font-family="sans-serif" font-size="11" fill="#4b5563">nested type of: B is produced from A</text>

  <line x1="860" y1="605" x2="890" y2="605" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow084bad)"/>
  <text x="898" y="609" font-family="sans-serif" font-size="11" fill="#4b5563">broken back-edge — the bug</text>
</svg>
