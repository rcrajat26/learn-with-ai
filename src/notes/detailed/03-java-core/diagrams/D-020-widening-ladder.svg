<svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The widening primitive ladder byte to short to int to long to float to double, with char joining at int; long to float is a lossy rung inside the ladder, and two direct widenings that skip a rung, int to float and long to double, are also lossy — shown with worked QuizStakes values: (float) 16,777,217 rounds to 16,777,216.0, ledgerEntryId 7,200,000,001 loses its trailing 1 as a float, and long to double is exact only up to 2^53">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <text x="520" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">The widening ladder, and where it quietly loses precision</text>
  <text x="520" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">The ladder — sequential widening conversions; char joins the ladder at int</text>

  <!-- Main chain -->
  <rect x="40" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="95" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">byte</text>

  <rect x="190" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="245" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">short</text>

  <rect x="340" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="395" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">int</text>

  <rect x="490" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="545" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">long</text>

  <rect x="640" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="695" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">float</text>

  <rect x="790" y="90" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="845" y="120" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">double</text>

  <line x1="150" y1="115" x2="190" y2="115" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="115" x2="340" y2="115" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="115" x2="490" y2="115" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="115" x2="640" y2="115" stroke="#737373" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="750" y1="115" x2="790" y2="115" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="620" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">lossy — 24-bit float mantissa</text>
  <text x="620" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">ledgerEntryId 7_200_000_001L -&gt; 7.2E9, drops the trailing 1</text>

  <!-- char joins at int -->
  <rect x="340" y="200" width="110" height="50" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="395" y="230" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">char</text>

  <line x1="395" y1="200" x2="395" y2="140" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="170" text-anchor="end" font-family="sans-serif" font-size="11" fill="#4b5563">zero-extends, exact</text>

  <!-- Section B header -->
  <text x="520" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Two direct widenings that skip a rung — Java allows both without going through the intermediate type</text>

  <!-- Mini panel 1: int -> float -->
  <rect x="60" y="300" width="440" height="190" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="280" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">int -&gt; float, skipping long</text>

  <rect x="90" y="335" width="100" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="140" y="360" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">int</text>

  <rect x="340" y="335" width="100" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="390" y="360" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">float</text>

  <line x1="190" y1="355" x2="340" y2="355" stroke="#737373" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="265" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">lossy — 24-bit float mantissa</text>

  <rect x="80" y="395" width="400" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="280" y="418" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">(float) 16_777_217 == 16777216.0</text>
  <text x="280" y="438" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">16,777,217 = 2^24 + 1; float has only 24 significand bits,</text>
  <text x="280" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">so the +1 cannot be represented and rounds away</text>

  <!-- Mini panel 2: long -> double -->
  <rect x="540" y="300" width="440" height="190" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="760" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">long -&gt; double, skipping float</text>

  <rect x="570" y="335" width="100" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="620" y="360" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">long</text>

  <rect x="820" y="335" width="100" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="870" y="360" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">double</text>

  <line x1="670" y1="355" x2="820" y2="355" stroke="#737373" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="745" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">lossy — 53-bit double mantissa</text>

  <rect x="560" y="395" width="400" height="70" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="760" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">long -&gt; double is exact only up to 2^53</text>
  <text x="760" y="438" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">(9,007,199,254,740,992)</text>
  <text x="760" y="454" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">beyond that a long can hold values a double cannot distinguish</text>

  <!-- legend -->
  <line x1="40" y1="510" x2="1000" y2="510" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="530" x2="100" y2="530" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="112" y="534" font-family="sans-serif" font-size="11" fill="#4b5563">exact widening — no bits lost</text>
  <line x1="380" y1="530" x2="420" y2="530" stroke="#737373" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="432" y="534" font-family="sans-serif" font-size="11" fill="#4b5563">lossy widening — mantissa too narrow for the source range</text>
  <rect x="800" y="522" width="18" height="14" fill="#fef3c7" stroke="#737373" stroke-width="1.6"/>
  <text x="826" y="534" font-family="sans-serif" font-size="11" fill="#4b5563">worked value</text>

  <text x="520" y="565" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">every arrow in this diagram is a Java widening conversion — it compiles with no cast — yet three of them silently discard bits</text>

</svg>
