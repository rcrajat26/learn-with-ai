<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Before and after G1 string deduplication for three repeated BDP-101 bank-deposit reference Strings: before, three separate String objects each with its own byte array totalling 21 bytes; after, still three String objects but sharing one 7-byte array, saving 14 bytes; contrasted with interning, which collapses the String objects themselves so == becomes true, while deduplication leaves == false">

  <defs>
    <marker id="arrow98" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="860" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Deduplication is not interning &#8212; three "BDP-101" reference Strings</text>

  <!-- BEFORE panel -->
  <rect x="40" y="80" width="380" height="340" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="230" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Before: three separate String objects</text>

  <!-- object 1 -->
  <rect x="60" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="110" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj A</text>
  <text x="110" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>
  <line x1="110" y1="168" x2="110" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <rect x="60" y="198" width="100" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="110" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[7]</text>
  <text x="110" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LATIN1</text>

  <!-- object 2 -->
  <rect x="180" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="230" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj B</text>
  <text x="230" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>
  <line x1="230" y1="168" x2="230" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <rect x="180" y="198" width="100" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[7]</text>
  <text x="230" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LATIN1</text>

  <!-- object 3 -->
  <rect x="300" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="350" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj C</text>
  <text x="350" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>
  <line x1="350" y1="168" x2="350" y2="196" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <rect x="300" y="198" width="100" height="40" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="350" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[7]</text>
  <text x="350" y="234" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LATIN1</text>

  <rect x="60" y="260" width="340" height="26" rx="4" fill="#fef3c7"/>
  <text x="230" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">byte[] payload total = 3 x 7 = 21 bytes</text>

  <rect x="60" y="300" width="340" height="90" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="230" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">obj A == obj B: false</text>
  <text x="230" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">obj A.equals(obj B): true</text>
  <text x="230" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">each parsed independently from</text>
  <text x="230" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">separate ledger rows, never interned</text>

  <!-- AFTER panel -->
  <rect x="480" y="80" width="380" height="340" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="670" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">After G1 string deduplication</text>

  <rect x="500" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj A</text>
  <text x="550" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>

  <rect x="620" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="670" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj B</text>
  <text x="670" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>

  <rect x="740" y="122" width="100" height="46" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="790" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">String obj C</text>
  <text x="790" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">"BDP-101"</text>

  <line x1="550" y1="168" x2="670" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <line x1="670" y1="168" x2="670" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>
  <line x1="790" y1="168" x2="670" y2="200" stroke="#737373" stroke-width="2" marker-end="url(#arrow98)"/>

  <rect x="620" y="200" width="100" height="40" rx="4" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="670" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">byte[7]</text>
  <text x="670" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">LATIN1 (shared)</text>

  <rect x="500" y="260" width="340" height="26" rx="4" fill="#fef3c7"/>
  <text x="670" y="278" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">byte[] payload total = 7 bytes (saving 14 bytes, 67%)</text>

  <rect x="500" y="300" width="340" height="90" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="670" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">obj A == obj B: false (still)</text>
  <text x="670" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">three distinct String objects remain</text>
  <text x="670" y="358" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">only the backing byte[] arrays were</text>
  <text x="670" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">merged into one shared array</text>

  <!-- dedup thread actor -->
  <rect x="480" y="430" width="380" height="90" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="670" y="452" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">G1 concurrent StringDedup thread (separate actor)</text>
  <text x="670" y="470" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">-XX:+UseStringDeduplication</text>
  <text x="670" y="486" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">StringDeduplicationAgeThreshold = 3</text>
  <text x="670" y="502" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">acts only on Strings that survived 3 young collections</text>

  <line x1="670" y1="430" x2="670" y2="400" stroke="#525252" stroke-width="2" marker-end="url(#arrow98)"/>

  <!-- contrast box -->
  <rect x="40" y="440" width="380" height="80" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="60" y="462" font-family="sans-serif" font-size="11" fill="#1f2937">Interning vs deduplication:</text>
  <text x="60" y="480" font-family="sans-serif" font-size="11" fill="#1f2937">interning collapses the String objects themselves</text>
  <text x="60" y="496" font-family="sans-serif" font-size="11" fill="#1f2937">into one shared instance, so == becomes true.</text>
  <text x="60" y="512" font-family="sans-serif" font-size="11" fill="#1f2937">deduplication collapses only the backing arrays; == stays false.</text>

  <rect x="40" y="540" width="820" height="40" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="565" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Net effect on the QuizStakes deposit ledger: 6.5k bank deposits/day, each</text>

  <rect x="40" y="585" width="820" height="40" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="450" y="610" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">re-parsing "BDP-101"-style references: dedup shrinks heap footprint without touching identity semantics</text>

</svg>
