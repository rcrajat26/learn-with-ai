<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="IEEE 754 binary64 field layout split into 1-bit sign, 11-bit exponent, and 52-bit mantissa, filled in for the value 4.20">

  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="15"
        fill="#1f2937">IEEE 754 binary64 field layout</text>

  <!-- Generic layout -->
  <text x="400" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">64 bits total: 1 (sign) + 11 (exponent) + 52 (mantissa)</text>

  <rect x="40" y="90" width="11" height="60" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="51" y="90" width="124" height="60" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <rect x="175" y="90" width="585" height="60" fill="#dcfce7" stroke="#737373" stroke-width="2"/>

  <text x="46" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">sign</text>
  <text x="46" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">1 bit</text>

  <text x="113" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">exponent</text>
  <text x="113" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">11 bits, bias 1023</text>

  <text x="467" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">mantissa (fraction)</text>
  <text x="467" y="195" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">52 bits, implicit leading 1</text>

  <line x1="40" y1="215" x2="760" y2="215" stroke="#737373" stroke-width="2"/>
  <text x="400" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">value = (-1)^sign x (1.mantissa) x 2^(exponent - 1023)</text>

  <!-- Filled for 4.20 -->
  <rect x="20" y="260" width="760" height="180" rx="8" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">filled in for the average stake, 4.20 (double)</text>

  <rect x="40" y="300" width="11" height="46" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <rect x="51" y="300" width="124" height="46" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <rect x="175" y="300" width="585" height="46" fill="#dcfce7" stroke="#737373" stroke-width="2"/>

  <text x="46" y="328" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">0</text>
  <text x="113" y="328" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">10000000001</text>
  <text x="467" y="328" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">0000110011001100110011001100110011001100110011001101</text>

  <text x="46" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">sign = 0</text>
  <text x="113" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">biased exponent = 1025 (0x401), unbiased = 2</text>
  <text x="467" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">mantissa = 0x0CCCCCCCCCCCD</text>

  <rect x="150" y="386" width="500" height="40" rx="6" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" font-family="monospace" font-size="13" fill="#1f2937">full 64-bit hex: 0x4010CCCCCCCCCCCD</text>

</svg>
