<svg viewBox="0 0 900 840" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three-frame sequence showing why equal objects with unequal hashes are unreachable in a hash map keyed by RestrictionKey. Frame 1: put stores K1, RestrictionKey(STAKE_BLOCKED, SYSTEM_ONBOARDING), which hashes to A = 802 and lands in bucket 2 of an 8-bucket table. Frame 2: a lookup with K2, RestrictionKey(STAKE_BLOCKED, ADMIN), for which a hand-written equals() incorrectly says K2 equals K1, but hashCode() still folds in the source field so K2 hashes to B = 405 and the lookup probes bucket 5 instead. Frame 3: bucket 5 holds no entry, so the map reports a miss and returns null without ever calling equals() against K1, which is sitting untouched in bucket 2. The contract equal objects must have equal hash codes was broken, and the entry becomes unreachable.">
  <defs>
    <marker id="arrow034" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="840" fill="#ffffff"/>

  <text x="20" y="32" font-family="sans-serif" font-size="15" font-weight="bold"
        fill="#1f2937">Equal objects with unequal hashes are unreachable</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- FRAME 1 -->
  <text x="40" y="74" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 1 — put(K1) computes hash A and lands in a bucket</text>

  <rect x="40" y="90" width="250" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="165" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">K1 = RestrictionKey(</text>
  <text x="165" y="126" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#1f2937">STAKE_BLOCKED, SYSTEM_ONBOARDING)</text>
  <text x="165" y="142" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">the stored key</text>

  <rect x="340" y="100" width="150" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="415" y="126" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">hash A = 802</text>

  <path d="M 290 122 H 340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow034)"/>
  <path d="M 415 144 V 190 H 249 V 200" fill="none" stroke="#475569" stroke-width="2"
        marker-end="url(#arrow034)"/>
  <text x="500" y="184" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">802 mod 8 = 2</text>

  <!-- bucket table frame 1 -->
  <g id="table1">
    <text x="60" y="196" font-family="sans-serif" font-size="11" fill="#4b5563">bucket index</text>
    <!-- cells 0..7 -->
    <g font-family="sans-serif">
      <rect x="60" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="107" y="216" text-anchor="middle" font-size="11" fill="#1f2937">0</text>
      <rect x="60" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="107" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="155" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="202" y="216" text-anchor="middle" font-size="11" fill="#1f2937">1</text>
      <rect x="155" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="202" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="250" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="297" y="216" text-anchor="middle" font-size="11" fill="#1f2937">2</text>
      <rect x="250" y="222" width="95" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
      <text x="297" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">K1</text>
      <text x="297" y="258" text-anchor="middle" font-size="11" fill="#1f2937">stored here</text>

      <rect x="345" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="392" y="216" text-anchor="middle" font-size="11" fill="#1f2937">3</text>
      <rect x="345" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="392" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="440" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="487" y="216" text-anchor="middle" font-size="11" fill="#1f2937">4</text>
      <rect x="440" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="487" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="535" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="582" y="216" text-anchor="middle" font-size="11" fill="#1f2937">5</text>
      <rect x="535" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="582" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="630" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="677" y="216" text-anchor="middle" font-size="11" fill="#1f2937">6</text>
      <rect x="630" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="677" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

      <rect x="725" y="200" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
      <text x="772" y="216" text-anchor="middle" font-size="11" fill="#1f2937">7</text>
      <rect x="725" y="222" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
      <text x="772" y="250" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>
    </g>
  </g>

  <!-- FRAME 2 -->
  <line x1="20" y1="290" x2="880" y2="290" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="322" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 2 — get(K2): equals() says K2 equals K1, but hashCode() lands elsewhere</text>

  <rect x="40" y="338" width="250" height="64" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="165" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">K2 = RestrictionKey(</text>
  <text x="165" y="374" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#1f2937">STAKE_BLOCKED, ADMIN)</text>
  <text x="165" y="390" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">the probing key — K2.equals(K1) is true</text>

  <rect x="340" y="348" width="150" height="44" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="415" y="374" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">hash B = 405</text>

  <path d="M 290 370 H 340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow034)"/>
  <path d="M 415 392 V 438 H 583 V 448" fill="none" stroke="#475569" stroke-width="2"
        marker-end="url(#arrow034)"/>
  <text x="500" y="432" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">405 mod 8 = 5, not 2</text>

  <!-- bucket table frame 2: same as frame1 but index5 highlighted, index2 unchanged -->
  <g font-family="sans-serif">
    <rect x="60" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="107" y="464" text-anchor="middle" font-size="11" fill="#1f2937">0</text>
    <rect x="60" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="107" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="155" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="202" y="464" text-anchor="middle" font-size="11" fill="#1f2937">1</text>
    <rect x="155" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="202" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="250" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="297" y="464" text-anchor="middle" font-size="11" fill="#1f2937">2</text>
    <rect x="250" y="470" width="95" height="48" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
    <text x="297" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">K1</text>
    <text x="297" y="506" text-anchor="middle" font-size="11" fill="#1f2937">untouched</text>

    <rect x="345" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="392" y="464" text-anchor="middle" font-size="11" fill="#1f2937">3</text>
    <rect x="345" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="392" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="440" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="487" y="464" text-anchor="middle" font-size="11" fill="#1f2937">4</text>
    <rect x="440" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="487" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="535" y="448" width="95" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
    <text x="582" y="464" text-anchor="middle" font-size="11" fill="#1f2937">5</text>
    <rect x="535" y="470" width="95" height="48" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
    <text x="582" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">K2 probes</text>
    <text x="582" y="506" text-anchor="middle" font-size="11" fill="#1f2937">here</text>

    <rect x="630" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="677" y="464" text-anchor="middle" font-size="11" fill="#1f2937">6</text>
    <rect x="630" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="677" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="725" y="448" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="772" y="464" text-anchor="middle" font-size="11" fill="#1f2937">7</text>
    <rect x="725" y="470" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="772" y="498" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>
  </g>

  <!-- FRAME 3 -->
  <line x1="20" y1="538" x2="880" y2="538" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="570" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">FRAME 3 — bucket 5 is empty: a miss, and equals() is never even called</text>

  <g font-family="sans-serif">
    <rect x="60" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="107" y="606" text-anchor="middle" font-size="11" fill="#1f2937">0</text>
    <rect x="60" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="107" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="155" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="202" y="606" text-anchor="middle" font-size="11" fill="#1f2937">1</text>
    <rect x="155" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="202" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="250" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="297" y="606" text-anchor="middle" font-size="11" fill="#1f2937">2</text>
    <rect x="250" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"
          stroke-dasharray="4 3"/>
    <text x="297" y="632" text-anchor="middle" font-size="11" font-weight="bold" fill="#4b5563">K1 is here</text>
    <text x="297" y="648" text-anchor="middle" font-size="11" fill="#4b5563">never probed</text>

    <rect x="345" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="392" y="606" text-anchor="middle" font-size="11" fill="#1f2937">3</text>
    <rect x="345" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="392" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="440" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="487" y="606" text-anchor="middle" font-size="11" fill="#1f2937">4</text>
    <rect x="440" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="487" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="535" y="590" width="95" height="22" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="582" y="606" text-anchor="middle" font-size="11" fill="#1f2937">5</text>
    <rect x="535" y="612" width="95" height="48" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="582" y="632" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">MISS</text>
    <text x="582" y="648" text-anchor="middle" font-size="11" fill="#1f2937">get returns null</text>

    <rect x="630" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="677" y="606" text-anchor="middle" font-size="11" fill="#1f2937">6</text>
    <rect x="630" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="677" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>

    <rect x="725" y="590" width="95" height="22" fill="#e5e7eb" stroke="#737373" stroke-width="1.4"/>
    <text x="772" y="606" text-anchor="middle" font-size="11" fill="#1f2937">7</text>
    <rect x="725" y="612" width="95" height="48" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="772" y="640" text-anchor="middle" font-size="11" fill="#4b5563">empty</text>
  </g>

  <!-- annotation panel -->
  <rect x="40" y="676" width="820" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="56" y="696" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">The bug and the contract it breaks</text>
  <text x="56" y="714" font-family="sans-serif" font-size="11"
        fill="#1f2937">A hand-written equals() compares type only, so K2.equals(K1) wrongly returns true even though</text>
  <text x="56" y="730" font-family="sans-serif" font-size="11"
        fill="#1f2937">restriction identity is the pair (type, source). hashCode() still folds source in, so equal objects get</text>
  <text x="56" y="746" font-family="sans-serif" font-size="11"
        fill="#1f2937">unequal hashes — a broken contract that makes the stored entry unreachable through get().</text>

  <!-- legend -->
  <line x1="20" y1="776" x2="880" y2="776" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="40" y="790" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="70" y="803" font-family="sans-serif" font-size="11" fill="#4b5563">key object</text>
  <rect x="170" y="790" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="200" y="803" font-family="sans-serif" font-size="11" fill="#4b5563">computed hash / bucket being probed</text>
  <rect x="440" y="790" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="470" y="803" font-family="sans-serif" font-size="11" fill="#4b5563">successfully stored entry</text>
  <rect x="640" y="790" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="670" y="803" font-family="sans-serif" font-size="11" fill="#4b5563">the miss — failure frame</text>
  <rect x="40" y="812" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"
        stroke-dasharray="4 3"/>
  <text x="70" y="825" font-family="sans-serif" font-size="11" fill="#4b5563">empty bucket, or a bucket never probed</text>
</svg>
