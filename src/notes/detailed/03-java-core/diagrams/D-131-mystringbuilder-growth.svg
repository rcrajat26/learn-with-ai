<!-- totals -->
<text class="t band" x="600" y="434">Totals and the amortised bound</text>
<rect class="bx" x="600" y="444" width="400" height="150" fill="#dcfce7" stroke="#15803d"/>
<text class="t bh" x="614" y="464">Measured grand total</text>
<text class="row" x="614" y="484">reallocations</text><text class="rowb" x="986" y="484" text-anchor="end">16</text>
<text class="row" x="614" y="503">final capacity</text><text class="rowb" x="986" y="503" text-anchor="end">1,179,646 slots</text>
<text class="row" x="614" y="522">chars copied</text><text class="rowb" x="986" y="522" text-anchor="end">1,179,598</text>
<text class="row" x="614" y="541">bytes copied (2 B per char)</text><text class="rowb" x="986" y="541" text-anchor="end">2,359,196 B</text>
<text class="row" x="614" y="560">copy cost ratio</text><text class="rowb" x="986" y="560" text-anchor="end">1.1796 n</text>
<text class="row" x="614" y="579">theoretical amortised bound</text><text class="rowb" x="986" y="579" text-anchor="end">~2 n</text>

<rect class="bx" x="600" y="614" width="400" height="116" fill="#eff6ff" stroke="#2563eb"/>
<text class="t bh" x="614" y="634">Slack left at the end</text>
<text class="row" x="614" y="654">1,179,646 capacity - 1,000,000 appended</text>
<text class="row" x="614" y="673">= 179,646 unused char slots</text>
<text class="row" x="614" y="692">= 359,292 wasted bytes, held live</text>
<text class="row" x="614" y="711">2 * old + 2 can overshoot by up to ~2x</text>

<rect class="bx" x="600" y="750" width="400" height="116" fill="#eff6ff" stroke="#2563eb"/>
<text class="t bh" x="614" y="770">Why 1.1796 n, not 2 n</text>
<text class="row" x="614" y="790">Geometric growth: chars copied = final cap - 48</text>
<text class="row" x="614" y="809">1,179,646 - 48 = 1,179,598, so 1.1796 n</text>
<text class="row" x="614" y="828">The bound is ~2 n; the constant depends on</text>
<text class="row" x="614" y="847">where n falls between two grows.</text>

