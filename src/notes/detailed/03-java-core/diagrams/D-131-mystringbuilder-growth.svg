.hair { stroke: #d1d5db; stroke-width: 1.4; fill: none; }
.grid { stroke: #d1d5db; stroke-width: 1.3; fill: none; }
.bx { stroke-width: 1.5; }
.axis { stroke: #475569; stroke-width: 1.6; fill: none; }
.solid { stroke: #475569; stroke-width: 2; fill: none; }
