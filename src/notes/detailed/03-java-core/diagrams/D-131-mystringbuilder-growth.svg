<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1000" role="img" aria-label="Growth trace of MyStringBuilder appending 1,000,000 characters from a start capacity of 16 under the rule newCap = 2 * old + 2. The upper plot shows capacity against characters appended on log-log axes as a step function with sixteen risers, one per reallocation, each riser marked with a point; the final flat run sits at capacity 1,179,646. The table below lists all sixteen grows with old capacity, new capacity and characters copied, from 16 to 34 copying 16 chars, up to 589,822 to 1,179,646 copying 589,822 chars. Totals: 16 reallocations, final capacity 1,179,646, 1,179,598 characters copied, 2,359,196 bytes copied at 2 bytes per char, a copy ratio of 1.1796 n against the theoretical amortised bound of roughly 2 n. End slack is 179,646 unused char slots, or 359,292 wasted bytes.">
