<svg viewBox="0 0 1180 1360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Memory layout comparison of BigDecimal on Oracle JDK 21.0.7 macOS aarch64, measured with retained heap deltas over 2,000,000 instances. Left half: a compact BigDecimal for a 65-unit QuizStakes card deposit built with BigDecimal.valueOf(6500,2), value 65.00, where intVal is null and intCompact holds 6500 directly; measured retained size 40.0 bytes, arithmetic 12-byte header plus intVal reference 4 plus scale 4 plus precision 4 plus stringCache reference 4 plus intCompact long 8 equals 36, aligned up to 40. Right half: the same value built with new BigDecimal(BigInteger.valueOf(6500),2), where intVal is an attached non-null BigInteger holding 6500 and intCompact is still 6500, not INFLATED; measured retained size 104.2 bytes, arithmetic 40 for the BigDecimal plus 40 for the attached BigInteger (header 12, signum 4, mag reference 4, four lookaside ints 16, total 36 aligned to 40) plus 24 for the int array mag of length one (16-byte array header plus 4 bytes payload aligned to 24) equals 104, matching the measurement. A third box shows a truly inflated BigDecimal built from a 23-digit BigInteger, value 123456789012345678901.23, where intCompact equals INFLATED, defined as Long.MIN_VALUE, meaning the significand is only available from intVal; a separately measured 30-digit inflated BigDecimal retains 112.0 bytes. A blue correction panel quotes the actual JDK 21 constructor body, which calls compactValFor so intCompact is still set to 6500 when the value fits, but intVal is never nulled, so the object permanently carries the attached BigInteger; conclusion: the constructor does not set INFLATED but it does force 104 bytes instead of 40, a 2.6x increase, and at QuizStakes' 19.8 million ledger entries per day this constructor choice costs 1,267,200,000 bytes, about 1.27 GB of extra allocation per day. A bottom table lists eight measured constructor-to-field-state mappings.">
  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
      .code{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#1f2937;}
      .codeR{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#b91c1c;}
      .codeG{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#15803d;}
    </style>
    <marker id="arr125" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="1360" fill="#ffffff"/>

  <text x="20" y="32" class="h1">intCompact versus intVal &#8212; two BigDecimal constructors, one value, 40 versus 104 bytes</text>
  <line x1="20" y1="42" x2="1160" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- band headers -->
  <text x="80" y="66" class="h2">COMPACT &#8212; intVal IS null</text>
  <line x1="80" y1="74" x2="590" y2="74" stroke="#d1d5db" stroke-width="1"/>
  <text x="620" y="66" class="h2">intVal ATTACHED</text>
  <line x1="620" y1="74" x2="1130" y2="74" stroke="#d1d5db" stroke-width="1"/>

  <!-- LEFT: compact BigDecimal -->
  <rect x="80" y="90" width="510" height="264" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="96" y="112" class="smallb">BigDecimal.valueOf(6500, 2)  &#8212;  value 65.00 (QuizStakes card deposit)</text>

  <rect x="96" y="122" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="140" class="code">private final BigInteger intVal   = null</text>

  <rect x="96" y="148" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="166" class="code">private final int scale           = 2</text>

  <rect x="96" y="174" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="192" class="code">private transient int precision   = 0</text>

  <rect x="96" y="200" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="218" class="code">private transient String stringCache = null</text>

  <rect x="96" y="226" width="478" height="26" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="104" y="244" class="codeG">private final transient long intCompact = 6500</text>

  <text x="96" y="270" class="small">precision and stringCache are lazy lookaside fields, zero/null until first use</text>
  <text x="96" y="288" class="body">retained size measured:</text>
  <text x="270" y="288" class="codeG">40.0 bytes/instance</text>
  <text x="96" y="308" class="small">12 header + intVal ref 4 + scale 4 + precision 4 + stringCache ref 4 + intCompact 8</text>
  <text x="96" y="326" class="small">= 36, aligned up to 8-byte ObjectAlignmentInBytes &#8594; 40</text>
  <text x="96" y="344" class="smallb">fast-path arithmetic reads intCompact directly &#8212; no BigInteger touched</text>

  <!-- RIGHT: attached BigDecimal -->
  <rect x="620" y="90" width="510" height="264" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="636" y="112" class="smallb">new BigDecimal(BigInteger.valueOf(6500), 2)  &#8212;  same value 65.00</text>

  <rect x="636" y="122" width="478" height="26" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="644" y="140" class="code">private final BigInteger intVal   = 6500  (attached)</text>

  <rect x="636" y="148" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="644" y="166" class="code">private final int scale           = 2</text>

  <rect x="636" y="174" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="644" y="192" class="code">private transient int precision   = 0</text>

  <rect x="636" y="200" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="644" y="218" class="code">private final transient long intCompact = 6500  (not INFLATED)</text>

  <rect x="636" y="226" width="478" height="26" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="644" y="244" class="code">int[] mag = { 6500 }   (inside the attached BigInteger)</text>

  <text x="636" y="270" class="body">retained size measured:</text>
  <text x="810" y="270" class="codeR">104.2 bytes/instance</text>
  <text x="636" y="290" class="small">40 (BigDecimal shell) + 40 (BigInteger: 12 hdr + signum 4 + mag ref 4</text>
  <text x="636" y="306" class="small">+ 4 lookaside ints 16 = 36&#8594;40) + 24 (int[] len 1: 16 hdr + 4 = 20&#8594;24)</text>
  <text x="636" y="324" class="small">= 104. Measured 104.2 &#8212; arithmetic and measurement agree.</text>
  <text x="636" y="344" class="smallb">2.6&#215; the compact size for the identical numeric value</text>

  <!-- inflated box -->
  <rect x="80" y="380" width="1050" height="148" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="96" y="402" class="smallb">TRULY INFLATED &#8212; new BigDecimal(new BigInteger("12345678901234567890123"), 2)</text>
  <text x="96" y="422" class="body">value 123456789012345678901.23</text>
  <rect x="96" y="432" width="500" height="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="104" y="450" class="codeR">intCompact = INFLATED = Long.MIN_VALUE = &#8722;9223372036854775808</text>
  <text x="620" y="450" class="body">significand only readable from intVal now</text>
  <rect x="96" y="462" width="1018" height="28" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="481" class="code">static final long INFLATED = Long.MIN_VALUE;   // JDK 21 BigDecimal declaration, verbatim</text>
  <text x="96" y="512" class="small">a separately measured 30-digit inflated BigDecimal retains 112.0 bytes (40 + 40 + a 4-int mag array at 32)</text>

  <!-- correction panel -->
  <rect x="80" y="550" width="1050" height="290" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="96" y="572" class="smallb">THE CORRECTION &#8212; the constructor does not "always inflate"</text>
  <text x="96" y="592" class="small">Older material claims new BigDecimal(BigInteger, int) always inflates the value. On JDK 21 that is imprecise.</text>

  <rect x="96" y="602" width="1018" height="96" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="104" y="622" class="code">public BigDecimal(BigInteger unscaledVal, int scale) {</text>
  <text x="120" y="640" class="code">this.intVal = toStrictBigInteger(unscaledVal);</text>
  <text x="120" y="658" class="code">this.intCompact = compactValFor(this.intVal);</text>
  <text x="120" y="676" class="code">this.scale = scale;</text>
  <text x="104" y="692" class="code">}</text>

  <text x="96" y="720" class="body">It calls compactValFor, so intCompact <tspan class="codeG">is</tspan> set to 6500 when the value fits &#8212; the fast arithmetic path is available.</text>
  <text x="96" y="740" class="body">What it never does is null out intVal, so the object permanently carries the attached BigInteger and its int[] mag.</text>
  <text x="96" y="762" class="smallb">Accurate statement: it does not set INFLATED, but it does force the memory cost &#8212; 104 bytes instead of 40, a 2.6&#215; increase.</text>

  <rect x="96" y="772" width="1018" height="56" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="104" y="792" class="codeR">QuizStakes cost: 19,800,000 ledger entries/day &#215; 64 extra bytes = 1,267,200,000 bytes</text>
  <text x="104" y="812" class="codeR">&#8776; 1.27 GB of extra allocation per day from choosing the wrong Money constructor</text>

  <!-- table -->
  <text x="20" y="870" class="h2">WHICH CONSTRUCTORS PRODUCE WHICH FORM &#8212; ALL MEASURED</text>
  <line x1="20" y1="878" x2="1160" y2="878" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="890" width="1140" height="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="32" y="910" class="smallb">Constructed as</text>
  <text x="620" y="910" class="smallb">intCompact</text>
  <text x="860" y="910" class="smallb">intVal</text>

  <g>
    <rect x="20" y="920" width="1140" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="32" y="940" class="code">new BigDecimal("3.33")</text>
    <text x="620" y="940" class="code">333</text>
    <text x="860" y="940" class="code">null</text>

    <rect x="20" y="950" width="1140" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="32" y="970" class="code">new BigDecimal(65L)</text>
    <text x="620" y="970" class="code">65</text>
    <text x="860" y="970" class="code">null</text>

    <rect x="20" y="980" width="1140" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="32" y="1000" class="code">BigDecimal.valueOf(6500, 2)</text>
    <text x="620" y="1000" class="code">6500</text>
    <text x="860" y="1000" class="code">null</text>

    <rect x="20" y="1010" width="1140" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="32" y="1030" class="code">new BigDecimal(BigInteger.valueOf(6500), 2)</text>
    <text x="620" y="1030" class="code">6500</text>
    <text x="860" y="1030" class="code">6500 (attached)</text>

    <rect x="20" y="1040" width="1140" height="30" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="32" y="1060" class="code">new BigDecimal("999999999999999999")  (18 digits)</text>
    <text x="620" y="1060" class="code">999999999999999999</text>
    <text x="860" y="1060" class="code">null</text>

    <rect x="20" y="1070" width="1140" height="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="32" y="1090" class="code">new BigDecimal("9999999999999999999")  (19 digits)</text>
    <text x="620" y="1090" class="codeR">INFLATED</text>
    <text x="860" y="1090" class="code">9999999999999999999</text>

    <rect x="20" y="1100" width="1140" height="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
    <text x="32" y="1120" class="code">new BigDecimal("9223372036854775807")  (Long.MAX_VALUE)</text>
    <text x="620" y="1120" class="code">9223372036854775807</text>
    <text x="860" y="1120" class="code">attached</text>

    <rect x="20" y="1130" width="1140" height="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="32" y="1150" class="code">new BigDecimal(0.1)</text>
    <text x="620" y="1150" class="codeR">INFLATED</text>
    <text x="860" y="1150" class="code">55-digit significand, scale = 55</text>
  </g>

  <!-- legend -->
  <text x="20" y="1196" class="h2">LEGEND</text>
  <line x1="20" y1="1204" x2="1160" y2="1204" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="1216" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="58" y="1229" class="small">compact form &#8212; intVal null, intCompact holds the significand, 40 bytes</text>

  <rect x="30" y="1242" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="58" y="1255" class="small">attached form &#8212; intVal non-null but intCompact still set, 104 bytes</text>

  <rect x="30" y="1268" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="58" y="1281" class="small">truly inflated &#8212; intCompact = INFLATED, significand only in intVal</text>

  <rect x="30" y="1294" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="58" y="1307" class="small">field-row / source-listing panel, lazy or elided fields</text>

  <rect x="500" y="1216" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="528" y="1229" class="small">correction panel &#8212; the point of this diagram</text>

  <text x="500" y="1255" class="codeG">green code</text>
  <text x="600" y="1255" class="small">= correct / fast-path value</text>
  <text x="500" y="1281" class="codeR">red code</text>
  <text x="600" y="1281" class="small">= inflated / costly value</text>
</svg>
