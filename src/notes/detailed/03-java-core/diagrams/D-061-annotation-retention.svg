<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline of @AuditedTransition annotation across source, class file, class loading and runtime reflection stages, in three retention lanes SOURCE, CLASS default and RUNTIME, ending with a note that nothing happens until something reads the annotation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="20" y="20" width="860" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Retention decides who can see an annotation</text>
  <text x="450" y="54" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">@AuditedTransition on Application: AA-800 ACTIVATING -&gt; AA-801 ACTIVATED</text>

  <!-- Stage columns header -->
  <rect x="140" y="72" width="170" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="225" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">.java source</text>

  <rect x="320" y="72" width="170" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">.class file</text>

  <rect x="500" y="72" width="170" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="585" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">class loading</text>

  <rect x="680" y="72" width="170" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="765" y="92" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">runtime reflection</text>

  <!-- column guide lines -->
  <line x1="225" y1="102" x2="225" y2="430" stroke="#737373" stroke-width="1"/>
  <line x1="405" y1="102" x2="405" y2="430" stroke="#737373" stroke-width="1"/>
  <line x1="585" y1="102" x2="585" y2="430" stroke="#737373" stroke-width="1"/>
  <line x1="765" y1="102" x2="765" y2="430" stroke="#737373" stroke-width="1"/>

  <!-- Lane labels -->
  <rect x="20" y="120" width="110" height="80" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="75" y="150" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">RetentionPolicy</text>
  <text x="75" y="166" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">.SOURCE</text>

  <rect x="20" y="230" width="110" height="80" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="75" y="260" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">RetentionPolicy</text>
  <text x="75" y="276" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">.CLASS</text>
  <text x="75" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(default)</text>

  <rect x="20" y="340" width="110" height="80" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="75" y="370" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">RetentionPolicy</text>
  <text x="75" y="386" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">.RUNTIME</text>

  <!-- SOURCE lane -->
  <rect x="140" y="140" width="170" height="40" rx="4" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="225" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">@AuditedTransition present</text>
  <line x1="310" y1="160" x2="330" y2="160" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="140" width="150" height="40" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="405" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">discarded by javac</text>
  <text x="405" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">(lane ends here)</text>

  <!-- SOURCE lane processor note -->
  <rect x="150" y="192" width="160" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">only visible to javac itself</text>

  <!-- CLASS lane -->
  <rect x="140" y="250" width="170" height="40" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="225" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">@AuditedTransition present</text>
  <line x1="310" y1="270" x2="330" y2="270" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="250" width="170" height="40" rx="4" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="405" y="274" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">RuntimeInvisibleAnnotations</text>
  <line x1="490" y1="270" x2="510" y2="270" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="250" width="170" height="40" rx="4" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="585" y="268" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">not visible to</text>
  <text x="585" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">getAnnotation() (lane ends)</text>

  <!-- CLASS lane bytecode tool note -->
  <rect x="330" y="300" width="150" height="30" rx="4" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>
  <text x="405" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">visible to bytecode tools</text>

  <!-- RUNTIME lane -->
  <rect x="140" y="360" width="170" height="40" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="225" y="384" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">@AuditedTransition present</text>
  <line x1="310" y1="380" x2="330" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="360" width="170" height="40" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="405" y="384" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">RuntimeVisibleAnnotations</text>
  <line x1="490" y1="380" x2="510" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="360" width="170" height="40" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="585" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">loaded into JVM metadata</text>
  <line x1="670" y1="380" x2="690" y2="380" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680" y="360" width="170" height="40" rx="4" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="765" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">getAnnotation()</text>
  <text x="765" y="392" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">returns it (reaches the end)</text>

  <!-- Final wide box -->
  <rect x="40" y="450" width="820" height="90" rx="6" fill="#e5e7eb" stroke="#525252" stroke-width="2"/>
  <text x="450" y="474" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">Annotations have no behaviour: nothing happens until something reads them</text>
  <text x="450" y="496" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Compile-time reader: a javax.annotation.processing annotation processor (reads SOURCE-visible AST)</text>
  <text x="450" y="516" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Runtime reader: a reflective reader such as Spring or Jackson calling getAnnotation() on the loaded class</text>
</svg>
