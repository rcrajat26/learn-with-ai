<svg viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Two timeline panels showing the JMM final-field freeze guarantee for a Money(BigDecimal amount, Currency currency) object with amount 3.33 and currency GBP. Panel 1: writer thread bonus-grant-1 allocates the Money object, writes amount = 3.33 and currency = GBP, then hits the FREEZE bar at the end of the constructor, which orders all final field writes before any later publication of the reference, then publishes it with a plain write to grantedBonus. Reader thread balance-view-4 reads grantedBonus and is guaranteed to see amount 3.33 and currency GBP. Panel 2: the same writer instead calls MoneyRegistry.register(this), letting the reference escape the constructor before the freeze; the freeze still happens afterward but is too late because the reference was already visible. Reader thread balance-view-4 reads the escaped reference before the freeze completes and observes amount 0.00, showing the guarantee is void once a reference escapes construction.">
  <defs>
    <marker id="arrow122" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow122red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#ffffff"/>

  <text x="560" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">The final field freeze &#8212; Money(amount = 3.33, currency = GBP)</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- ============ PANEL 1 : CORRECT PUBLICATION ============ -->
  <text x="80" y="64" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PANEL 1 &#8212; CONSTRUCTOR COMPLETES BEFORE PUBLICATION (GUARANTEED)</text>
  <line x1="80" y1="72" x2="1040" y2="72" stroke="#d1d5db" stroke-width="1"/>

  <line x1="80" y1="90" x2="1040" y2="90" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow122)"/>
  <text x="1045" y="94" font-family="sans-serif" font-size="11" fill="#4b5563">time</text>

  <text x="90" y="115" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">WRITER: bonus-grant-1</text>

  <rect x="90" y="130" width="180" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">new Money(...) allocate,</text>
  <text x="180" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">all fields zeroed</text>

  <rect x="300" y="130" width="120" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="360" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">amount = 3.33</text>

  <rect x="450" y="130" width="120" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="510" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">currency = GBP</text>

  <rect x="610" y="120" width="18" height="80" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="619" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">FREEZE</text>

  <rect x="660" y="130" width="280" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="800" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">grantedBonus = m</text>
  <text x="800" y="176" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(plain, non-volatile write)</text>

  <line x1="270" y1="160" x2="300" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>
  <line x1="420" y1="160" x2="450" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>
  <line x1="570" y1="160" x2="610" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>
  <line x1="628" y1="160" x2="660" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>

  <text x="350" y="225" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">freeze action: all final field writes are</text>
  <text x="350" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">ordered before any subsequent publication</text>
  <text x="350" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b45309">of this reference</text>

  <text x="90" y="325" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">READER: balance-view-4</text>

  <rect x="90" y="340" width="220" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="200" y="374" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">read grantedBonus</text>

  <rect x="650" y="340" width="320" height="60" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="810" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">amount reads 3.33, currency reads GBP</text>
  <text x="810" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">&#8212; GUARANTEED</text>

  <line x1="310" y1="370" x2="650" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>

  <path d="M 619 200 V 300 H 810 V 340" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow122)"/>
  <text x="714" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">JMM final-field guarantee</text>

  <!-- ============ PANEL 2 : ESCAPE BEFORE FREEZE ============ -->
  <text x="80" y="440" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">PANEL 2 &#8212; THIS ESCAPES BEFORE THE FREEZE (VOID)</text>
  <line x1="80" y1="448" x2="1040" y2="448" stroke="#d1d5db" stroke-width="1"/>

  <line x1="80" y1="466" x2="1040" y2="466" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow122)"/>
  <text x="1045" y="470" font-family="sans-serif" font-size="11" fill="#4b5563">time</text>

  <text x="90" y="491" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">WRITER: bonus-grant-1</text>

  <rect x="90" y="506" width="180" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="180" y="534" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">new Money(...) allocate,</text>
  <text x="180" y="552" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">all fields zeroed</text>

  <rect x="300" y="506" width="300" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="450" y="534" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">MoneyRegistry.register(this)</text>
  <text x="450" y="552" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">// this escapes</text>

  <rect x="630" y="506" width="120" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="690" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">amount = 3.33</text>

  <rect x="800" y="496" width="18" height="80" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="809" y="488" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#9ca3af">FREEZE</text>

  <line x1="270" y1="536" x2="300" y2="536" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>
  <line x1="600" y1="536" x2="630" y2="536" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>
  <line x1="750" y1="536" x2="800" y2="536" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>

  <text x="530" y="600" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">freeze happens, but the</text>
  <text x="530" y="615" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">reference was already visible</text>

  <text x="90" y="701" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">READER: balance-view-4</text>

  <rect x="90" y="716" width="240" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="210" y="750" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">read the escaped reference</text>

  <rect x="630" y="716" width="320" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="790" y="738" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">amount reads 0.00 &#8212;</text>
  <text x="790" y="756" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">the guarantee is void</text>

  <line x1="330" y1="746" x2="630" y2="746" stroke="#475569" stroke-width="2" marker-end="url(#arrow122)"/>

  <path d="M 320 566 V 650 H 210 V 716" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow122red)"/>
  <text x="245" y="630" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">escapes before the freeze</text>

  <path d="M 809 576 V 680 H 790 V 716" fill="none" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow122)"/>
  <text x="900" y="665" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">freeze happens after the read</text>

  <!-- ============ LEGEND ============ -->
  <text x="80" y="820" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937">LEGEND</text>
  <line x1="80" y1="828" x2="1040" y2="828" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="90" y="840" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="118" y="853" font-family="sans-serif" font-size="11" fill="#4b5563">writer / reader action (neutral, in progress)</text>

  <rect x="90" y="864" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="118" y="877" font-family="sans-serif" font-size="11" fill="#4b5563">FREEZE bar &#8212; the guarantee taking effect</text>

  <rect x="610" y="840" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="638" y="853" font-family="sans-serif" font-size="11" fill="#4b5563">guaranteed read &#8212; final field seen correctly</text>

  <rect x="610" y="864" width="22" height="16" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="638" y="877" font-family="sans-serif" font-size="11" fill="#4b5563">escape / void guarantee / wrong value observed</text>

  <rect x="900" y="840" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="928" y="853" font-family="sans-serif" font-size="11" fill="#4b5563">FREEZE too late &#8212; moot</text>
</svg>
