<svg viewBox="0 0 1120 1460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The java.time type map grouped into five bands. Band 1, instantaneous types with no zone dependency: Instant (long seconds plus int nanos, used for Movement.postedAt and LedgerEntry.postedAt), InstantSource (the narrow interface added in Java 17 that Clock implements), and Clock (factories systemUTC, system, fixed, offset, tick; injected into BonusService so bonus expiry is testable). Band 2, local types with no zone so they are not a moment: LocalDate (client date of birth, PaymentRun business date), LocalTime, LocalDateTime (an operator-entered scheduling form value before a zone is applied), and a grouped panel for Year, YearMonth, MonthDay. Band 3, zoned and offset types: ZonedDateTime (LocalDateTime plus ZoneOffset plus ZoneId, used for the PaymentRun payout window which must survive a DST change), OffsetDateTime (LocalDateTime plus ZoneOffset only, no region), OffsetTime, ZoneId (a region such as Europe/London whose rules can change), and ZoneOffset (a fixed offset such as plus one hour that is a subclass of ZoneId with no rules to change) — an inheritance arrow points from ZoneOffset to ZoneId. Band 4, amount types: Duration (time-based, exactly 24 hours per day, diverges from Period across a DST boundary) and Period (date-based, one calendar day). Band 5, enum support: DayOfWeek and Month. An annotation panel states the key reading: LocalDateTime is not an instant, has no zone, cannot be converted to epoch millis without one being supplied, which is why Movement.postedAt is an Instant, the client date of birth is a LocalDate, and storing a settlement timestamp as LocalDateTime is the most common java.time modelling error.">

  <defs>
    <style>
      .h1{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2937;}
      .h2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#1f2937;}
      .body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2937;}
      .small{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#4b5563;}
      .smallb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1f2937;}
      .code{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#1f2937;}
      .codeR{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#b91c1c;}
      .codeG{font-family:Menlo,"SF Mono",monospace;font-size:12.5px;fill:#15803d;}
    </style>
    <marker id="arr075" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="1460" fill="#ffffff"/>

  <text x="20" y="32" class="h1">The java.time type map</text>
  <line x1="20" y1="42" x2="1100" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- BAND 1 -->
  <text x="20" y="62" class="h2">BAND 1 &#8212; INSTANTANEOUS (a point on the timeline, zone-independent)</text>
  <line x1="20" y1="70" x2="1100" y2="70" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="80" width="340" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="102" class="body" font-weight="bold">Instant</text>
  <line x1="40" y1="112" x2="340" y2="112" stroke="#2563eb" stroke-width="1"/>
  <text x="40" y="134" class="small">A point on the timeline; zone-independent.</text>
  <text x="40" y="152" class="code">long seconds + int nanos</text>
  <text x="40" y="170" class="small">QuizStakes: Movement.postedAt,</text>
  <text x="40" y="188" class="small">LedgerEntry.postedAt</text>

  <rect x="380" y="80" width="340" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="400" y="102" class="body" font-weight="bold">InstantSource (Java 17)</text>
  <line x1="400" y1="112" x2="700" y2="112" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="134" class="small">The narrow interface Clock implements.</text>
  <text x="400" y="152" class="small">Introduced so a "gettable now" contract</text>
  <text x="400" y="170" class="small">could exist without pulling in Clock's</text>
  <text x="400" y="188" class="small">full zone/factory surface.</text>

  <rect x="740" y="80" width="340" height="130" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="760" y="102" class="body" font-weight="bold">Clock</text>
  <line x1="760" y1="112" x2="1060" y2="112" stroke="#2563eb" stroke-width="1"/>
  <text x="760" y="134" class="small">Factories: systemUTC, system(zone),</text>
  <text x="760" y="152" class="small">fixed, offset, tick</text>
  <text x="760" y="170" class="small">QuizStakes: injected into BonusService</text>
  <text x="760" y="188" class="small">so bonus expiry logic is testable</text>

  <!-- BAND 2 -->
  <text x="20" y="232" class="h2">BAND 2 &#8212; LOCAL (a human-calendar reading with NO zone, so NOT a moment)</text>
  <line x1="20" y1="240" x2="1100" y2="240" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="250" width="255" height="140" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="40" y="272" class="body" font-weight="bold">LocalDate</text>
  <line x1="40" y1="282" x2="255" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <text x="40" y="302" class="small">Calendar date, no time, no zone.</text>
  <text x="40" y="320" class="code">of(year, month, day)</text>
  <text x="40" y="338" class="small">QuizStakes: client date of birth,</text>
  <text x="40" y="356" class="small">PaymentRun business date</text>

  <rect x="295" y="250" width="255" height="140" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="315" y="272" class="body" font-weight="bold">LocalTime</text>
  <line x1="315" y1="282" x2="530" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <text x="315" y="302" class="small">Time of day, no date, no zone.</text>
  <text x="315" y="320" class="code">of(hour, minute, second)</text>

  <rect x="570" y="250" width="255" height="140" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="590" y="272" class="body" font-weight="bold">LocalDateTime</text>
  <line x1="590" y1="282" x2="805" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <text x="590" y="302" class="small">Date + time, still NO zone.</text>
  <text x="590" y="320" class="code">of(date, time)</text>
  <text x="590" y="338" class="small">QuizStakes: an operator-entered</text>
  <text x="590" y="356" class="small">scheduling form value, pre-zone</text>

  <rect x="845" y="250" width="255" height="170" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="865" y="272" class="body" font-weight="bold">Year / YearMonth / MonthDay</text>
  <line x1="865" y1="282" x2="1080" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <text x="865" y="302" class="smallb">Year</text>
  <text x="865" y="318" class="code">Year.of(2026)</text>
  <text x="865" y="336" class="smallb">YearMonth</text>
  <text x="865" y="352" class="code">YearMonth.of(2026, 3)</text>
  <text x="865" y="370" class="smallb">MonthDay</text>
  <text x="865" y="386" class="code">MonthDay.of(3, 29)</text>

  <!-- BAND 3 -->
  <text x="20" y="452" class="h2">BAND 3 &#8212; ZONED / OFFSET (a local reading plus enough zone info to be a moment)</text>
  <line x1="20" y1="460" x2="1100" y2="460" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="470" width="340" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="40" y="492" class="body" font-weight="bold">ZonedDateTime</text>
  <line x1="40" y1="502" x2="340" y2="502" stroke="#15803d" stroke-width="1"/>
  <text x="40" y="524" class="code">LocalDateTime + ZoneOffset + ZoneId</text>
  <text x="40" y="542" class="small">A local reading with a REGION,</text>
  <text x="40" y="560" class="small">so the moment survives rule changes.</text>
  <text x="40" y="578" class="small">QuizStakes: PaymentRun payout window,</text>
  <text x="40" y="596" class="small">must survive a DST change (D-077)</text>

  <rect x="380" y="470" width="340" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="400" y="492" class="body" font-weight="bold">OffsetDateTime</text>
  <line x1="400" y1="502" x2="700" y2="502" stroke="#15803d" stroke-width="1"/>
  <text x="400" y="524" class="code">LocalDateTime + ZoneOffset only</text>
  <text x="400" y="542" class="small">No region &#8212; the offset never changes</text>
  <text x="400" y="560" class="small">on its own, unlike a ZoneId's rules.</text>

  <rect x="740" y="470" width="340" height="160" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="760" y="492" class="body" font-weight="bold">OffsetTime</text>
  <line x1="760" y1="502" x2="1060" y2="502" stroke="#15803d" stroke-width="1"/>
  <text x="760" y="524" class="small">Time of day + fixed ZoneOffset,</text>
  <text x="760" y="542" class="small">no date, no region.</text>

  <rect x="20" y="650" width="530" height="120" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="40" y="672" class="body" font-weight="bold">ZoneId</text>
  <line x1="40" y1="682" x2="550" y2="682" stroke="#15803d" stroke-width="1"/>
  <text x="40" y="704" class="small">A REGION, e.g. Europe/London.</text>
  <text x="40" y="722" class="small">Carries rules that CHANGE over time (DST, law).</text>

  <rect x="570" y="650" width="530" height="120" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="590" y="672" class="body" font-weight="bold">ZoneOffset</text>
  <line x1="590" y1="682" x2="1100" y2="682" stroke="#15803d" stroke-width="1"/>
  <text x="590" y="704" class="small">A FIXED offset, e.g. +01:00.</text>
  <text x="590" y="722" class="small">Subclass of ZoneId; no rules to change.</text>

  <path d="M 570 712 H 550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr075)"/>

  <!-- BAND 4 -->
  <text x="20" y="792" class="h2">BAND 4 &#8212; AMOUNTS</text>
  <line x1="20" y1="800" x2="1100" y2="800" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="815" class="small">Axis: time-based (Duration, elapsed seconds) versus date-based (Period, calendar fields) &#8212; this is what separates the two boxes below.</text>

  <rect x="20" y="822" width="530" height="130" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="40" y="844" class="body" font-weight="bold">Duration</text>
  <line x1="40" y1="854" x2="550" y2="854" stroke="#b45309" stroke-width="1"/>
  <text x="40" y="876" class="small">TIME-BASED: long seconds + int nanos.</text>
  <text x="40" y="894" class="code">Duration.ofDays(1) = exactly 24 hours</text>
  <text x="40" y="912" class="small">Diverges from Period across DST &#8212; see D-078.</text>

  <line x1="560" y1="822" x2="560" y2="952" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="570" y="822" width="530" height="130" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="590" y="844" class="body" font-weight="bold">Period</text>
  <line x1="590" y1="854" x2="1100" y2="854" stroke="#b45309" stroke-width="1"/>
  <text x="590" y="876" class="small">DATE-BASED: int years / int months / int days.</text>
  <text x="590" y="894" class="code">Period.ofDays(1) = 1 calendar day</text>
  <text x="590" y="912" class="small">Diverges from Duration across DST &#8212; see D-078.</text>

  <!-- BAND 5 -->
  <text x="20" y="972" class="h2">BAND 5 &#8212; ENUM SUPPORT</text>
  <line x1="20" y1="980" x2="1100" y2="980" stroke="#d1d5db" stroke-width="1"/>

  <rect x="20" y="990" width="1080" height="90" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="40" y="1012" class="body" font-weight="bold">DayOfWeek / Month</text>
  <line x1="40" y1="1022" x2="1080" y2="1022" stroke="#9ca3af" stroke-width="1"/>
  <text x="40" y="1044" class="smallb">DayOfWeek</text>
  <text x="160" y="1044" class="small">MONDAY..SUNDAY; DayOfWeek.of(1); plus(n) wraps around the week</text>
  <text x="40" y="1064" class="smallb">Month</text>
  <text x="160" y="1064" class="small">JANUARY..DECEMBER; Month.of(3); length(leapYear) returns days in that month</text>

  <!-- ANNOTATION -->
  <rect x="20" y="1100" width="1080" height="150" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="40" y="1122" class="h2">KEY READING</text>
  <line x1="40" y1="1132" x2="1080" y2="1132" stroke="#2563eb" stroke-width="1"/>
  <text x="40" y="1154" class="small">LocalDateTime is not an instant. It has no zone, so it does not identify a moment and cannot be converted to</text>
  <text x="40" y="1172" class="small">epoch millis without one being supplied. That is why Movement.postedAt and LedgerEntry.postedAt are declared</text>
  <text x="40" y="1190" class="small">as Instant, and why the client's date of birth is a LocalDate &#8212; and why storing a settlement timestamp as</text>
  <text x="40" y="1208" class="small">LocalDateTime, with no zone attached, is the single most common java.time modelling error.</text>

  <!-- LEGEND -->
  <text x="20" y="1272" class="h2">LEGEND</text>
  <line x1="20" y1="1280" x2="1100" y2="1280" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="30" y="1296" width="22" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="1309" class="small">band 1 &#8212; instantaneous types (Instant, InstantSource, Clock)</text>

  <rect x="30" y="1320" width="22" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="58" y="1333" class="small">band 2 / band 5 &#8212; local types with no zone, and enum support (DayOfWeek, Month)</text>

  <rect x="30" y="1344" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="58" y="1357" class="small">band 3 &#8212; zoned/offset types (ZonedDateTime, OffsetDateTime, OffsetTime, ZoneId, ZoneOffset)</text>

  <rect x="30" y="1368" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <text x="58" y="1381" class="small">band 4 &#8212; amount types (Duration, Period)</text>

  <rect x="30" y="1392" width="22" height="16" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="58" y="1405" class="small">annotation panel &#8212; the single most important reading of this map</text>

  <line x1="30" y1="1424" x2="52" y2="1424" stroke="#475569" stroke-width="2" marker-end="url(#arr075)"/>
  <text x="58" y="1428" class="small">ZoneOffset &#8594; ZoneId : ZoneOffset is-a specialization of ZoneId (a fixed offset, no rules to change)</text>

</svg>
