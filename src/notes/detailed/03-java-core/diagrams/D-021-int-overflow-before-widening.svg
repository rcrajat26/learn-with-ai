<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Computing a QuizStakes reservation expiry window as long window = 24 * 60 * 60 * 1000 * 1000 overflows in int before widening: the four multiplications run entirely in 32-bit int, the true product 86,400,000,000 needs 37 bits so only the low 32 bits survive, giving a wrapped int of 500,654,080, which then widens to a long of the same wrong value (about 8.3 minutes instead of one day); marking the last literal 24L forces the whole expression to long arithmetic and produces the correct 86,400,000,000.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="750" fill="#ffffff"/>

  <text x="500" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">int arithmetic overflows before widening to long — reservation expiry window</text>
  <text x="500" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#4b5563">long window = 24 * 60 * 60 * 1000 * 1000;  // intended: microseconds in one day</text>

  <!-- Frame 1 -->
  <rect x="30" y="65" width="940" height="160" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="50" y="85" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 1 — all four multiplications performed in int</text>

  <rect x="50" y="105" width="140" height="90" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="120" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">24 * 60</text>
  <text x="120" y="158" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">= 1,440</text>

  <path d="M 190 150 H 230" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="105" width="150" height="90" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="305" y="140" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">1,440 * 60</text>
  <text x="305" y="158" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">= 86,400</text>

  <path d="M 380 150 H 420" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="105" width="200" height="90" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="520" y="132" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">86,400 * 1000</text>
  <text x="520" y="149" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">= 86,400,000</text>
  <text x="520" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(fits; ceiling</text>
  <text x="520" y="181" text-anchor="middle" font-family="monospace" font-size="11" fill="#4b5563">2,147,483,647)</text>

  <path d="M 620 150 H 660" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="105" width="240" height="90" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="780" y="132" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">86,400,000 * 1000</text>
  <text x="780" y="149" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">= 86,400,000,000</text>
  <text x="780" y="166" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(37 bits — does not</text>
  <text x="780" y="181" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">fit in int, overflows!)</text>

  <!-- Frame 2 -->
  <rect x="30" y="245" width="940" height="215" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="50" y="265" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 2 — the wrap point: int can't hold 86,400,000,000</text>

  <rect x="60" y="280" width="400" height="60" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="260" y="315" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">Integer.MAX_VALUE = 2,147,483,647 (ceiling)</text>

  <rect x="500" y="280" width="440" height="60" rx="6" fill="#f3f4f6" stroke="#737373" stroke-width="2"/>
  <text x="720" y="305" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">true product = 86,400,000,000</text>
  <text x="720" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(needs 37 bits — exceeds ceiling)</text>

  <text x="500" y="358" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">low 32 bits of 86,400,000,000 are kept</text>

  <path d="M 500 365 V 385" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="385" width="240" height="50" rx="6" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="500" y="415" text-anchor="middle" font-family="monospace" font-size="12" fill="#1f2937">wrapped int value = 500,654,080</text>

  <!-- Frame 3 -->
  <rect x="30" y="480" width="940" height="210" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
  <text x="50" y="500" font-family="sans-serif" font-size="13" fill="#1f2937">Frame 3 — wrong value widened to long, and the fix</text>

  <rect x="60" y="515" width="400" height="140" rx="6" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="260" y="538" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">int wrapped = 500,654,080</text>
  <text x="260" y="558" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">long window = wrapped; // implicit widen</text>
  <text x="260" y="578" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">window = 500,654,080 microseconds</text>
  <text x="260" y="605" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">approx 8.3 minutes — WRONG</text>
  <text x="260" y="623" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(intended: one full day)</text>

  <text x="500" y="575" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">fix:</text>
  <path d="M 460 585 H 540" fill="none" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="515" width="400" height="140" rx="6" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="740" y="538" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">long window =</text>
  <text x="740" y="558" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">24L * 60 * 60 * 1000 * 1000;</text>
  <text x="740" y="578" text-anchor="middle" font-family="monospace" font-size="11" fill="#1f2937">window = 86,400,000,000 microseconds</text>
  <text x="740" y="605" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">exactly one day — CORRECT</text>
  <text x="740" y="623" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">(24L forces the whole chain to long)</text>

  <!-- Legend -->
  <line x1="30" y1="705" x2="970" y2="705" stroke="#d1d5db" stroke-width="1"/>
  <rect x="40" y="713" width="14" height="14" fill="#dbeafe" stroke="#737373" stroke-width="1.6"/>
  <text x="60" y="725" font-family="sans-serif" font-size="11" fill="#4b5563">int computation steps</text>
  <rect x="230" y="713" width="14" height="14" fill="#f3f4f6" stroke="#737373" stroke-width="1.6"/>
  <text x="250" y="725" font-family="sans-serif" font-size="11" fill="#4b5563">reference / ceiling</text>
  <rect x="430" y="713" width="14" height="14" fill="#fef3c7" stroke="#737373" stroke-width="1.6"/>
  <text x="450" y="725" font-family="sans-serif" font-size="11" fill="#4b5563">overflow result (subject)</text>
  <rect x="650" y="713" width="14" height="14" fill="#fee2e2" stroke="#737373" stroke-width="1.6"/>
  <text x="670" y="725" font-family="sans-serif" font-size="11" fill="#4b5563">wrong / error</text>
  <rect x="830" y="713" width="14" height="14" fill="#dcfce7" stroke="#737373" stroke-width="1.6"/>
  <text x="850" y="725" font-family="sans-serif" font-size="11" fill="#4b5563">corrected fix</text>
</svg>
