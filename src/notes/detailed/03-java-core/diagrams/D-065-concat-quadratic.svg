<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Concatenation in a loop is quadratic: appending LedgerEntry rows with += grows bytes copied as n squared while a single StringBuilder grows as n; at 19.8 million rows per day, += copies about 1.6e16 bytes and never finishes, while StringBuilder copies about 1.6 GB">

  <rect x="20" y="20" width="860" height="40" rx="6" fill="#dbeafe" stroke="#737373" stroke-width="2"/>
  <text x="450" y="46" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1f2937">Concatenation in a loop is quadratic</text>

  <rect x="70" y="80" width="700" height="330" fill="#e5e7eb" stroke="#737373" stroke-width="2"/>

  <!-- y axis label -->
  <rect x="26" y="215" width="26" height="80" rx="3" fill="#dbeafe" transform="rotate(-90 39 255)"/>
  <text x="39" y="259" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937"
        transform="rotate(-90 39 259)">bytes copied</text>

  <!-- x axis ticks: n = LedgerEntry rows appended, log scale 10 to 100000 -->
  <line x1="70" y1="410" x2="770" y2="410" stroke="#737373" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#1f2937">
    <rect x="55" y="416" width="40" height="22" rx="3" fill="#e5e7eb"/>
    <text x="75" y="432" text-anchor="middle">10</text>
    <rect x="220" y="416" width="46" height="22" rx="3" fill="#e5e7eb"/>
    <text x="243" y="432" text-anchor="middle">100</text>
    <rect x="392" y="416" width="56" height="22" rx="3" fill="#e5e7eb"/>
    <text x="420" y="432" text-anchor="middle">1,000</text>
    <rect x="558" y="416" width="64" height="22" rx="3" fill="#e5e7eb"/>
    <text x="590" y="432" text-anchor="middle">10,000</text>
    <rect x="722" y="416" width="76" height="22" rx="3" fill="#e5e7eb"/>
    <text x="760" y="432" text-anchor="middle">100,000</text>
  </g>
  <rect x="360" y="446" width="220" height="22" rx="3" fill="#dbeafe"/>
  <text x="470" y="462" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n = LedgerEntry rows appended (log scale)</text>

  <!-- quadratic curve: += in a loop, n^2 -->
  <polyline points="80,388 250,352 420,270 590,140 760,64"
            fill="none" stroke="#525252" stroke-width="3"/>
  <!-- linear curve: single StringBuilder, n -->
  <polyline points="80,392 250,378 420,352 590,312 760,268"
            fill="none" stroke="#737373" stroke-width="3"/>

  <rect x="560" y="70" width="150" height="24" rx="3" fill="#fee2e2" stroke="#737373" stroke-width="2"/>
  <text x="635" y="87" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">+= in a loop: O(n^2)</text>

  <rect x="600" y="238" width="160" height="24" rx="3" fill="#dcfce7" stroke="#737373" stroke-width="2"/>
  <text x="680" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">StringBuilder: O(n)</text>

  <!-- crossover annotation -->
  <line x1="420" y1="270" x2="470" y2="200" stroke="#525252" stroke-width="2"/>
  <rect x="440" y="176" width="230" height="26" rx="3" fill="#fef3c7" stroke="#737373" stroke-width="2"/>
  <text x="555" y="194" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">curves diverge sharply past ~1,000 rows</text>

  <!-- totals for a 19.8M-entry day -->
  <rect x="70" y="480" width="340" height="60" rx="6" fill="#fee2e2" stroke="#525252" stroke-width="2"/>
  <text x="240" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">19.8M LedgerEntry rows/day, "+=" in a loop:</text>
  <text x="240" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">n^2/2 x ~40 chars/row</text>
  <text x="240" y="536" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">approx 1.6e16 bytes, i.e. never finishes</text>

  <rect x="460" y="480" width="340" height="60" rx="6" fill="#dcfce7" stroke="#525252" stroke-width="2"/>
  <text x="630" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">same 19.8M rows, one StringBuilder:</text>
  <text x="630" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">approx 2 x 19.8M x 40 chars</text>
  <text x="630" y="536" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2937">approx 1.6 GB copied across reallocations</text>
</svg>
