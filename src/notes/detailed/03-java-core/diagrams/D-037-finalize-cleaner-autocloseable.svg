<svg viewBox="0 0 1080 580" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Timeline comparing three cleanup mechanisms for a LedgerFileHandle over three GC cycles. AutoCloseable closes the handle deterministically at the end of the try block, before GC 1 even runs. Cleaner: the handle is used, becomes unreachable, sits in a shaded uncertainty gap spanning GC 1, and the cleaner thread finally runs cleanup after GC 2. finalize: the object moves from reachable to finalizable at GC 1, finalizable to finalized when the finalizer thread runs finalize, and finalized to collectable only at GC 2, requiring at least two GC cycles; a resurrection edge routes from finalized back to reachable, showing finalize can make the object live again and skip collection.">
  <defs>
    <marker id="arrow037struct" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow037weak" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="580" fill="#ffffff"/>

  <text x="540" y="32" text-anchor="middle" font-family="sans-serif" font-size="15"
        font-weight="bold" fill="#1f2937">finalize versus Cleaner versus AutoCloseable — a LedgerFileHandle</text>
  <line x1="20" y1="42" x2="1060" y2="42" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- LANE 1: AutoCloseable -->
  <text x="20" y="60" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">LANE 1 — AUTOCLOSEABLE — closed deterministically at try-block end</text>
  <line x1="20" y1="68" x2="1060" y2="68" stroke="#d1d5db" stroke-width="1"/>

  <rect x="140" y="80" width="230" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="255" y="105" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">try (LedgerFileHandle open)</text>

  <path d="M 370 100 H 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow037struct)"/>

  <rect x="390" y="80" width="260" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="520" y="105" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">close() — deterministic</text>

  <!-- LANE 2: Cleaner -->
  <text x="20" y="140" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">LANE 2 — CLEANER — cleaned after unreachable, once the cleaner thread runs</text>
  <line x1="20" y1="148" x2="1060" y2="148" stroke="#d1d5db" stroke-width="1"/>

  <rect x="140" y="158" width="230" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="255" y="183" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">LedgerFileHandle in use</text>

  <rect x="370" y="158" width="480" height="40" rx="4" fill="#f3f4f6" stroke="#9ca3af"
        stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="610" y="182" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">unreachable — Cleaner thread runs at the JVM's discretion</text>

  <path d="M 850 178 H 870" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"
        marker-end="url(#arrow037weak)"/>

  <rect x="870" y="158" width="170" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="955" y="183" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">cleaner thread runs</text>

  <!-- LANE 3: finalize -->
  <text x="20" y="218" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">LANE 3 — FINALIZE — reachable to finalizable to finalized to collectable, over 2+ GC cycles</text>
  <line x1="20" y1="226" x2="1060" y2="226" stroke="#d1d5db" stroke-width="1"/>

  <rect x="140" y="236" width="230" height="40" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
  <text x="255" y="261" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">reachable</text>

  <path d="M 370 256 H 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow037struct)"/>

  <rect x="390" y="236" width="290" height="40" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
  <text x="535" y="261" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">finalizable</text>

  <path d="M 680 256 H 700" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow037struct)"/>

  <rect x="700" y="236" width="150" height="40" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
  <text x="775" y="261" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">finalized</text>

  <path d="M 850 256 H 870" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow037struct)"/>

  <rect x="870" y="236" width="170" height="40" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
  <text x="955" y="261" text-anchor="middle" font-family="sans-serif" font-size="13"
        fill="#1f2937">collectable</text>

  <!-- resurrection edge: finalized back to reachable, routed below the lane, orthogonal -->
  <path d="M 720 276 V 310 H 200 V 276" fill="none" stroke="#9ca3af" stroke-width="1.8"
        stroke-dasharray="4 3" marker-end="url(#arrow037weak)"/>
  <text x="460" y="304" text-anchor="middle" font-family="sans-serif" font-size="11"
        fill="#4b5563">resurrection — finalize() re-links the referent to a GC root</text>

  <!-- shared time axis -->
  <line x1="140" y1="356" x2="1040" y2="356" stroke="#475569" stroke-width="1.5"/>
  <line x1="700" y1="350" x2="700" y2="362" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">GC 1</text>
  <line x1="850" y1="350" x2="850" y2="362" stroke="#475569" stroke-width="1.5"/>
  <text x="850" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">GC 2</text>
  <line x1="1000" y1="350" x2="1000" y2="362" stroke="#475569" stroke-width="1.5"/>
  <text x="1000" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4b5563">GC 3</text>
  <text x="140" y="378" font-family="sans-serif" font-size="11" fill="#4b5563">shared time axis, one LedgerFileHandle lifetime per lane</text>

  <!-- annotation panel -->
  <rect x="140" y="398" width="900" height="86" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="160" y="418" font-family="sans-serif" font-size="13" font-weight="bold"
        fill="#1f2937">JEP 421 and the three mechanisms</text>
  <text x="160" y="436" font-family="sans-serif" font-size="11" fill="#1f2937">JEP 421 (JDK 18) deprecated finalization for removal and added the --finalization=disabled flag.</text>
  <text x="160" y="452" font-family="sans-serif" font-size="11" fill="#1f2937">java.lang.ref.Cleaner arrived in Java 9, replacing finalize() with a phantom-reference-based API.</text>
  <text x="160" y="468" font-family="sans-serif" font-size="11" fill="#1f2937">AutoCloseable is the only one of the three that is deterministic — it runs exactly at try-block end.</text>

  <!-- legend -->
  <line x1="20" y1="500" x2="1060" y2="500" stroke="#d1d5db" stroke-width="1.5"/>

  <rect x="40" y="512" width="18" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="66" y="524" font-family="sans-serif" font-size="11" fill="#4b5563">primary subject</text>

  <rect x="300" y="512" width="18" height="14" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="326" y="524" font-family="sans-serif" font-size="11" fill="#4b5563">resolved / success</text>

  <rect x="560" y="512" width="18" height="14" fill="#f5f5f4" stroke="#78716c" stroke-width="1.6"/>
  <text x="586" y="524" font-family="sans-serif" font-size="11" fill="#4b5563">legacy / deprecated</text>

  <rect x="820" y="512" width="18" height="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="846" y="524" font-family="sans-serif" font-size="11" fill="#4b5563">weak / uncertain</text>

  <line x1="40" y1="542" x2="70" y2="542" stroke="#475569" stroke-width="2" marker-end="url(#arrow037struct)"/>
  <text x="78" y="546" font-family="sans-serif" font-size="11" fill="#4b5563">primary flow: A produces B</text>

  <line x1="300" y1="542" x2="330" y2="542" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4 3"
        marker-end="url(#arrow037weak)"/>
  <text x="338" y="546" font-family="sans-serif" font-size="11" fill="#4b5563">GC-discretion / resurrection</text>

  <rect x="560" y="536" width="18" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="586" y="548" font-family="sans-serif" font-size="11" fill="#4b5563">annotation panel</text>
</svg>
