<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="fastRemove on a Movement.entries list of LedgerEntry, capacity six, size five,
     removing the element at index one. Before frame shows elementData holding five LedgerEntry
     references at indices zero to four and one free trailing slot. One System.arraycopy call
     collapses the gap by shifting indices two through four left by one. After frame shows size
     decremented to four and an explicit store of null at the old last index, four, which is what
     releases the removed LedgerEntry reference for garbage collection. An annotation panel states
     that capacity does not shrink — it remains six in both frames.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }

    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxD    { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxW    { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .boxAnno { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="34" class="lbl h1">FASTREMOVE AND THE TRAILING NULL</text>
  <line x1="20" y1="46" x2="1100" y2="46" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="66" class="lbl sub">Movement.entries — remove(1), the void-reason correction at index 1 is retracted</text>
  <text x="20" y="82" class="lbl tiny" style="font-weight:700">newSize = size-1 = 4 &gt; i(1) — System.arraycopy(es, i+1, es, i, newSize-i) = arraycopy(es, 2, es, 1, 3)</text>

  <!-- BEFORE band -->
  <text x="20" y="98" class="lbl h2">BEFORE — elementData, size = 5, capacity = 6</text>

  <rect x="60" y="112" width="150" height="70" class="boxP"/>
  <text x="135" y="136" text-anchor="middle" class="lbl body">[0]</text>
  <text x="135" y="156" text-anchor="middle" class="lbl dense">L-1001 · D</text>
  <text x="135" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="220" y="112" width="150" height="70" class="boxD"/>
  <text x="295" y="136" text-anchor="middle" class="lbl body">[1] i = index</text>
  <text x="295" y="156" text-anchor="middle" class="lbl dense">L-1099 · D</text>
  <text x="295" y="172" text-anchor="middle" class="lbl sub">being removed</text>

  <rect x="380" y="112" width="150" height="70" class="boxP"/>
  <text x="455" y="136" text-anchor="middle" class="lbl body">[2]</text>
  <text x="455" y="156" text-anchor="middle" class="lbl dense">L-1002 · C</text>
  <text x="455" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="540" y="112" width="150" height="70" class="boxP"/>
  <text x="615" y="136" text-anchor="middle" class="lbl body">[3]</text>
  <text x="615" y="156" text-anchor="middle" class="lbl dense">L-1003 · D</text>
  <text x="615" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="700" y="112" width="150" height="70" class="boxP"/>
  <text x="775" y="136" text-anchor="middle" class="lbl body">[4]</text>
  <text x="775" y="156" text-anchor="middle" class="lbl dense">L-1004 · C</text>
  <text x="775" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="860" y="112" width="150" height="70" class="boxW"/>
  <text x="935" y="136" text-anchor="middle" class="lbl body">[5]</text>
  <text x="935" y="156" text-anchor="middle" class="lbl sub">null (unused)</text>

  <!-- arraycopy shift left -->
  <path class="flow" d="M 615 182 V 282 H 455 V 356"/>

  <!-- AFTER band -->
  <text x="20" y="342" class="lbl h2">AFTER — elementData, size = 4, capacity = 6 (unchanged)</text>

  <rect x="60" y="356" width="150" height="70" class="boxP"/>
  <text x="135" y="380" text-anchor="middle" class="lbl body">[0]</text>
  <text x="135" y="400" text-anchor="middle" class="lbl dense">L-1001 · D</text>
  <text x="135" y="416" text-anchor="middle" class="lbl sub">unchanged</text>

  <rect x="220" y="356" width="150" height="70" class="boxP"/>
  <text x="295" y="380" text-anchor="middle" class="lbl body">[1]</text>
  <text x="295" y="400" text-anchor="middle" class="lbl dense">L-1002 · C</text>
  <text x="295" y="416" text-anchor="middle" class="lbl sub">moved from [2]</text>

  <rect x="380" y="356" width="150" height="70" class="boxP"/>
  <text x="455" y="380" text-anchor="middle" class="lbl body">[2]</text>
  <text x="455" y="400" text-anchor="middle" class="lbl dense">L-1003 · D</text>
  <text x="455" y="416" text-anchor="middle" class="lbl sub">moved from [3]</text>

  <rect x="540" y="356" width="150" height="70" class="boxP"/>
  <text x="615" y="380" text-anchor="middle" class="lbl body">[3]</text>
  <text x="615" y="400" text-anchor="middle" class="lbl dense">L-1004 · C</text>
  <text x="615" y="416" text-anchor="middle" class="lbl sub">moved from [4]</text>

  <rect x="700" y="356" width="150" height="70" class="boxD"/>
  <text x="775" y="380" text-anchor="middle" class="lbl body">[4] = size</text>
  <text x="775" y="400" text-anchor="middle" class="lbl dense">null</text>
  <text x="775" y="416" text-anchor="middle" class="lbl sub">explicit null store</text>

  <rect x="860" y="356" width="150" height="70" class="boxW"/>
  <text x="935" y="380" text-anchor="middle" class="lbl body">[5]</text>
  <text x="935" y="400" text-anchor="middle" class="lbl sub">null (already null)</text>

  <path class="flow" d="M 775 182 V 356"/>
  <text x="20" y="446" class="lbl sub">Shift: arraycopy moves L-1002, L-1003, L-1004 one slot left, closing the gap. Store: es[size = newSize] = null.</text>

  <!-- annotation: why the null store -->
  <rect x="60" y="470" width="480" height="130" rx="6" class="boxAnno"/>
  <text x="78" y="494" class="lbl tiny" style="font-weight:700">Why the explicit null matters</text>
  <text x="78" y="516" class="lbl tiny">The arraycopy alone leaves index 4 holding a duplicate</text>
  <text x="78" y="534" class="lbl tiny">reference to L-1004 (copied over itself). es[size] = null</text>
  <text x="78" y="552" class="lbl tiny">overwrites that duplicate, releasing the last strong</text>
  <text x="78" y="570" class="lbl tiny">reference to the removed L-1099 so it can be collected.</text>
  <text x="78" y="588" class="lbl tiny">Skip this line and you leak one object reference per remove.</text>

  <!-- annotation: capacity unchanged -->
  <rect x="580" y="470" width="480" height="130" rx="6" class="boxAnno"/>
  <text x="598" y="494" class="lbl tiny" style="font-weight:700">Capacity never shrinks here</text>
  <text x="598" y="516" class="lbl tiny">elementData.length stays 6 before and after — fastRemove</text>
  <text x="598" y="534" class="lbl tiny">never reallocates or calls Arrays.copyOf on shrink.</text>
  <text x="598" y="552" class="lbl tiny">Only trimToSize() or clear() changes capacity downward.</text>
  <text x="598" y="570" class="lbl tiny">Repeated add/remove churn can leave capacity far above</text>
  <text x="598" y="588" class="lbl tiny">the live size — a standing memory cost, not a bug.</text>

  <!-- Legend -->
  <line x1="20" y1="630" x2="1100" y2="630" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="644" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="657" class="lbl tiny">occupied slot (LedgerEntry ref)</text>
  <rect x="260" y="644" width="22" height="16" rx="3" class="boxD"/>
  <text x="290" y="657" class="lbl tiny">removed / nulled slot (failure-adjacent, GC-relevant)</text>
  <rect x="640" y="644" width="22" height="16" rx="3" class="boxW"/>
  <text x="670" y="657" class="lbl tiny">unused capacity slot (null)</text>
  <path class="flow" d="M 900 652 H 940"/>
  <text x="948" y="657" class="lbl tiny">A → B : B follows from A</text>
</svg>
