<svg viewBox="0 0 1120 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="add(int index, E element) on a Movement.entries list of LedgerEntry, capacity
     six, size four, calling add(1, entry) to insert a correction entry at index one. Before
     frame shows elementData holding four LedgerEntry references at indices zero to three and two
     free trailing slots. One System.arraycopy call shifts the three elements from index one
     through three one slot right, freeing index one. After frame shows the new LedgerEntry
     written into the freed slot at index one, and size incremented from four to five. A cost
     annotation reads O(n minus index), caused by the arraycopy shifting every element after the
     insertion point. A second annotation states the two extremes: inserting at index zero moves
     every element, inserting at index size moves nothing.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .3px; }

    .boxP    { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR    { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW    { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 4 3; }
    .boxAnno { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <text x="20" y="34" class="lbl h1">ADD(INT, E) IS ONE ARRAYCOPY</text>
  <line x1="20" y1="46" x2="1100" y2="46" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="66" class="lbl sub">Movement.entries.add(1, correctionEntry) — capacity 6, size 4 before, size 5 after</text>
  <text x="20" y="82" class="lbl tiny" style="font-weight:700">index = 1 (rangeCheckForAdd passed) — System.arraycopy(es, index, es, index+1, s-index) = arraycopy(es, 1, es, 2, 3)</text>

  <!-- BEFORE band -->
  <text x="20" y="98" class="lbl h2">BEFORE — elementData, size = 4, capacity = 6</text>

  <!-- 6 slots before -->
  <rect x="60" y="112" width="140" height="70" class="boxP"/>
  <text x="130" y="136" text-anchor="middle" class="lbl body">[0]</text>
  <text x="130" y="156" text-anchor="middle" class="lbl dense">L-1001 · D</text>
  <text x="130" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="200" y="112" width="140" height="70" class="boxP"/>
  <text x="270" y="136" text-anchor="middle" class="lbl body">[1]</text>
  <text x="270" y="156" text-anchor="middle" class="lbl dense">L-1002 · C</text>
  <text x="270" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="340" y="112" width="140" height="70" class="boxP"/>
  <text x="410" y="136" text-anchor="middle" class="lbl body">[2]</text>
  <text x="410" y="156" text-anchor="middle" class="lbl dense">L-1003 · D</text>
  <text x="410" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="480" y="112" width="140" height="70" class="boxP"/>
  <text x="550" y="136" text-anchor="middle" class="lbl body">[3]</text>
  <text x="550" y="156" text-anchor="middle" class="lbl dense">L-1004 · C</text>
  <text x="550" y="172" text-anchor="middle" class="lbl sub">LedgerEntry</text>

  <rect x="620" y="112" width="140" height="70" class="boxW"/>
  <text x="690" y="136" text-anchor="middle" class="lbl body">[4]</text>
  <text x="690" y="156" text-anchor="middle" class="lbl sub">null (unused)</text>

  <rect x="760" y="112" width="140" height="70" class="boxW"/>
  <text x="830" y="136" text-anchor="middle" class="lbl body">[5]</text>
  <text x="830" y="156" text-anchor="middle" class="lbl sub">null (unused)</text>

  <!-- arraycopy wide arrow: shifts index1..3 (3 elems) to 2..4, source span mid (410) to dest span mid (550) -->
  <path class="flow" d="M 410 182 V 282 H 550 V 356"/>

  <!-- new element written into the freed slot: straight down, before[1] to after[1] -->
  <path class="flow" d="M 270 182 V 356"/>

  <!-- AFTER band -->
  <text x="20" y="342" class="lbl h2">AFTER — elementData, size = 5, capacity = 6 (unchanged)</text>

  <rect x="60" y="356" width="140" height="70" class="boxP"/>
  <text x="130" y="380" text-anchor="middle" class="lbl body">[0]</text>
  <text x="130" y="400" text-anchor="middle" class="lbl dense">L-1001 · D</text>
  <text x="130" y="416" text-anchor="middle" class="lbl sub">unchanged</text>

  <rect x="200" y="356" width="140" height="70" class="boxR"/>
  <text x="270" y="380" text-anchor="middle" class="lbl body">[1]</text>
  <text x="270" y="400" text-anchor="middle" class="lbl dense">L-1099 · D</text>
  <text x="270" y="416" text-anchor="middle" class="lbl sub">new, freed slot</text>

  <rect x="340" y="356" width="140" height="70" class="boxP"/>
  <text x="410" y="380" text-anchor="middle" class="lbl body">[2]</text>
  <text x="410" y="400" text-anchor="middle" class="lbl dense">L-1002 · C</text>
  <text x="410" y="416" text-anchor="middle" class="lbl sub">moved from [1]</text>

  <rect x="480" y="356" width="140" height="70" class="boxP"/>
  <text x="550" y="380" text-anchor="middle" class="lbl body">[3]</text>
  <text x="550" y="400" text-anchor="middle" class="lbl dense">L-1003 · D</text>
  <text x="550" y="416" text-anchor="middle" class="lbl sub">moved from [2]</text>

  <rect x="620" y="356" width="140" height="70" class="boxP"/>
  <text x="690" y="380" text-anchor="middle" class="lbl body">[4]</text>
  <text x="690" y="400" text-anchor="middle" class="lbl dense">L-1004 · C</text>
  <text x="690" y="416" text-anchor="middle" class="lbl sub">moved from [3]</text>

  <rect x="760" y="356" width="140" height="70" class="boxW"/>
  <text x="830" y="380" text-anchor="middle" class="lbl body">[5]</text>
  <text x="830" y="400" text-anchor="middle" class="lbl sub">null (unused)</text>

  <text x="20" y="446" class="lbl sub">Shift: arraycopy moves L-1002, L-1003, L-1004 one slot right. Write: es[index] = element; size = s + 1.</text>

  <!-- cost annotation -->
  <rect x="60" y="470" width="480" height="120" rx="6" class="boxAnno"/>
  <text x="78" y="494" class="lbl tiny" style="font-weight:700">Cost: O(n - index)</text>
  <text x="78" y="516" class="lbl tiny">Caused by the arraycopy — it moves every element from</text>
  <text x="78" y="534" class="lbl tiny">index through size-1, which is (size - index) references.</text>
  <text x="78" y="552" class="lbl tiny">Here size=4, index=1: 3 references copied, one write.</text>
  <text x="78" y="574" class="lbl tiny">No resize needed — capacity 6 already covers size 5.</text>

  <!-- extremes annotation -->
  <rect x="580" y="470" width="480" height="120" rx="6" class="boxAnno"/>
  <text x="598" y="494" class="lbl tiny" style="font-weight:700">The two extremes</text>
  <text x="598" y="516" class="lbl tiny">index = 0: arraycopy moves all n elements — worst case.</text>
  <text x="598" y="538" class="lbl tiny">index = size: arraycopy span is size - index = 0 — no</text>
  <text x="598" y="556" class="lbl tiny">elements move; this is what add(E) (append) reduces to.</text>
  <text x="598" y="578" class="lbl tiny">Everything between scales linearly with (size - index).</text>

  <!-- Legend -->
  <line x1="20" y1="622" x2="1100" y2="622" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="636" width="22" height="16" rx="3" class="boxP"/>
  <text x="50" y="649" class="lbl tiny">occupied slot (LedgerEntry ref)</text>
  <rect x="250" y="636" width="22" height="16" rx="3" class="boxW"/>
  <text x="280" y="649" class="lbl tiny">unused capacity slot (null)</text>
  <rect x="480" y="636" width="22" height="16" rx="3" class="boxR"/>
  <text x="510" y="649" class="lbl tiny">newly written slot</text>
  <path class="flow" d="M 700 644 H 740"/>
  <text x="748" y="649" class="lbl tiny">A → B : arraycopy shift / follows-from</text>
</svg>
