<svg viewBox="0 0 1040 980" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="What list.sort(c) actually runs. list.sort(c) snapshots modCount, then calls Arrays.sort with an unchecked cast of elementData to E array, over range 0 to size, using comparator c, which runs TimSort directly against the backing array — no copy. After the sort returns, ArrayList checks modCount against the snapshot and throws ConcurrentModificationException on mismatch, otherwise increments modCount and returns. A parallel lane shows the composed comparator Comparator.comparing(LedgerEntry::postedAt).thenComparing(LedgerEntry::id) as a chain of compare delegations: the composed comparator's compare(a,b) first calls the postedAt comparator; if that result is not zero it returns immediately; only if it is zero does it delegate to the id comparator. An annotation names IllegalArgumentException: Comparison method violates its general contract! as TimSort's own response to an inconsistent comparator, distinct from the ConcurrentModificationException path.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #1f2937; }
    .mono  { font-family: "SF Mono", Menlo, Consolas, monospace; }

    .boxP  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxH  { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
    .boxR  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxF  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
    .boxA  { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; }
    .boxW  { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.4; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .weak  { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 3; marker-end: url(#triW); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="triW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="980" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">WHAT list.sort(c) ACTUALLY RUNS</text>
  <line x1="20" y1="42" x2="1020" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="62" class="lbl body mono">List&lt;LedgerEntry&gt; entries; entries.sort(cmp)</text>
  <text x="20" y="79" class="lbl sub">reconciliation report ordering (§14.3) — LedgerEntry: id, movementId, position, direction, amount: Money, postedAt</text>

  <!-- MAIN CALL CHAIN LANE -->
  <text x="20" y="104" class="lbl h2">MAIN CALL CHAIN</text>

  <rect x="20" y="114" width="220" height="66" rx="6" class="boxP"/>
  <text x="130" y="138" text-anchor="middle" class="lbl node mono">list.sort(c)</text>
  <text x="130" y="156" text-anchor="middle" class="lbl sub">expectedModCount = modCount</text>
  <text x="130" y="170" text-anchor="middle" class="lbl sub">snapshot taken before sort</text>

  <path class="flow" d="M 240 147 H 300"/>

  <rect x="304" y="108" width="330" height="78" rx="6" class="boxH"/>
  <text x="469" y="130" text-anchor="middle" class="lbl node mono" font-size="12.5">Arrays.sort((E[]) elementData,</text>
  <text x="469" y="146" text-anchor="middle" class="lbl node mono" font-size="12.5">0, size, c)</text>
  <text x="469" y="164" text-anchor="middle" class="lbl sub">unchecked cast — no copy, mutates elementData in place</text>
  <text x="469" y="178" text-anchor="middle" class="lbl sub">@SuppressWarnings("unchecked")</text>

  <path class="flow" d="M 634 147 H 690"/>

  <rect x="694" y="114" width="220" height="66" rx="6" class="boxR"/>
  <text x="804" y="140" text-anchor="middle" class="lbl node mono">TimSort</text>
  <text x="804" y="158" text-anchor="middle" class="lbl sub">stable, adaptive natural</text>
  <text x="804" y="172" text-anchor="middle" class="lbl sub">mergesort, galloping merges</text>

  <!-- return path down to check -->
  <path class="flow" d="M 130 180 V 220 H 130 V 248"/>

  <rect x="20" y="252" width="330" height="70" rx="6" class="boxW"/>
  <text x="185" y="274" text-anchor="middle" class="lbl node mono" font-size="12.5">modCount != expectedModCount ?</text>
  <text x="185" y="292" text-anchor="middle" class="lbl sub">checked immediately after Arrays.sort returns</text>
  <text x="185" y="308" text-anchor="middle" class="lbl sub">true only if comparator reentrantly mutated the list</text>

  <path class="flow" d="M 185 322 V 344"/>
  <text x="200" y="338" class="lbl tiny">yes</text>
  <rect x="20" y="348" width="330" height="52" rx="6" class="boxF"/>
  <text x="185" y="370" text-anchor="middle" class="lbl node mono" font-size="12">ConcurrentModificationException</text>
  <text x="185" y="388" text-anchor="middle" class="lbl sub">throw — sort does not complete normally</text>

  <path class="flow" d="M 400 268 H 440"/>
  <text x="420" y="262" class="lbl tiny">no</text>
  <rect x="444" y="240" width="220" height="68" rx="6" class="boxR"/>
  <text x="554" y="264" text-anchor="middle" class="lbl node mono" font-size="12.5">modCount++</text>
  <text x="554" y="282" text-anchor="middle" class="lbl sub">counts as a structural</text>
  <text x="554" y="296" text-anchor="middle" class="lbl sub">modification for live iterators</text>

  <path class="flow" d="M 664 274 H 700"/>
  <rect x="704" y="248" width="150" height="52" rx="6" class="boxR"/>
  <text x="779" y="279" text-anchor="middle" class="lbl node mono">return</text>

  <!-- TimSort's own failure, separate from CME — routed through the right-hand corridor at x=960, clear of the modCount++/return boxes (x 444-854, y 240-308) -->
  <path class="weak" d="M 914 147 H 960 V 424 H 704 V 448"/>
  <text x="960" y="290" class="lbl tiny" text-anchor="middle" transform="rotate(-90 960 290)">inconsistent comparator</text>
  <rect x="464" y="452" width="440" height="76" rx="6" class="boxF"/>
  <text x="684" y="474" text-anchor="middle" class="lbl node mono" font-size="11.5">IllegalArgumentException:</text>
  <text x="684" y="491" text-anchor="middle" class="lbl node mono" font-size="11.5">Comparison method violates its general contract!</text>
  <text x="684" y="508" text-anchor="middle" class="lbl sub">thrown by TimSort's merge invariant check —</text>
  <text x="684" y="522" text-anchor="middle" class="lbl sub">not by the list, not by c</text>

  <!-- COMPARATOR LANE -->
  <line x1="20" y1="576" x2="1020" y2="576" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="598" class="lbl h2">COMPOSED COMPARATOR — compare(a, b) delegation chain</text>
  <text x="20" y="616" class="lbl sub mono">Comparator.comparing(LedgerEntry::postedAt).thenComparing(LedgerEntry::id)</text>

  <rect x="20" y="630" width="260" height="70" rx="6" class="boxP"/>
  <text x="150" y="652" text-anchor="middle" class="lbl node mono" font-size="12.5">composed.compare(a, b)</text>
  <text x="150" y="670" text-anchor="middle" class="lbl sub">the comparator TimSort holds as c</text>
  <text x="150" y="686" text-anchor="middle" class="lbl sub">entry point for every element comparison</text>

  <path class="flow" d="M 280 665 H 334"/>

  <rect x="334" y="630" width="290" height="70" rx="6" class="boxA"/>
  <text x="479" y="652" text-anchor="middle" class="lbl node mono" font-size="12.5">postedAt(a).compareTo(postedAt(b))</text>
  <text x="479" y="670" text-anchor="middle" class="lbl sub">Comparator.comparing(LedgerEntry::postedAt)</text>
  <text x="479" y="686" text-anchor="middle" class="lbl sub">result r</text>

  <path class="flow" d="M 624 665 H 668"/>

  <rect x="668" y="630" width="160" height="70" rx="6" class="boxR"/>
  <text x="748" y="656" text-anchor="middle" class="lbl node mono">r != 0 ?</text>
  <text x="748" y="674" text-anchor="middle" class="lbl sub">short-circuit</text>
  <text x="748" y="688" text-anchor="middle" class="lbl sub">test</text>

  <path class="flow" d="M 828 665 H 844"/>
  <rect x="844" y="630" width="156" height="70" rx="6" class="boxR"/>
  <text x="922" y="660" text-anchor="middle" class="lbl node mono" font-size="12.5">return r</text>
  <text x="922" y="680" text-anchor="middle" class="lbl sub">postedAt decided it (r != 0)</text>

  <path class="flow" d="M 748 700 V 726 H 479 V 752"/>
  <text x="756" y="716" class="lbl tiny">no (r == 0)</text>

  <rect x="334" y="752" width="290" height="66" rx="6" class="boxA"/>
  <text x="479" y="774" text-anchor="middle" class="lbl node mono" font-size="12.5">id(a).compareTo(id(b))</text>
  <text x="479" y="792" text-anchor="middle" class="lbl sub">.thenComparing(LedgerEntry::id)</text>
  <text x="479" y="806" text-anchor="middle" class="lbl sub">only reached when postedAt tied</text>

  <path class="flow" d="M 624 785 H 668"/>
  <rect x="668" y="756" width="180" height="56" rx="6" class="boxR"/>
  <text x="758" y="780" text-anchor="middle" class="lbl node mono">return that result</text>
  <text x="758" y="798" text-anchor="middle" class="lbl sub">tie-breaker's answer wins</text>

  <!-- annotation on Money hazard -->
  <rect x="20" y="828" width="1000" height="60" rx="6" class="boxA"/>
  <text x="36" y="850" class="lbl body" font-weight="700">Consistent-with-equals hazard</text>
  <text x="36" y="868" class="lbl tiny">Money equality includes currency (Appendix C.1) — a comparator ordering by amount alone, without also</text>
  <text x="36" y="882" class="lbl tiny">comparing currency, is inconsistent with equals: a classic source of the contract violation above.</text>

  <!-- legend -->
  <line x1="20" y1="900" x2="1020" y2="900" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="908" width="18" height="14" rx="3" class="boxH"/>
  <text x="44" y="919" class="lbl tiny">version-critical call</text>
  <rect x="200" y="908" width="18" height="14" rx="3" class="boxR"/>
  <text x="224" y="919" class="lbl tiny">resolved outcome / concrete step</text>
  <rect x="470" y="908" width="18" height="14" rx="3" class="boxF"/>
  <text x="494" y="919" class="lbl tiny">thrown exception</text>
  <rect x="620" y="908" width="18" height="14" rx="3" class="boxA"/>
  <text x="644" y="919" class="lbl tiny">annotation / delegation step</text>

  <path class="flow" d="M 20 936 H 54"/>
  <text x="62" y="941" class="lbl tiny">A → B : B runs after A</text>
  <path class="weak" d="M 300 936 H 334"/>
  <text x="342" y="941" class="lbl tiny">A → B : TimSort's own failure path</text>
</svg>
