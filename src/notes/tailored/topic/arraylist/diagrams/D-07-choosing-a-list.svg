<svg viewBox="0 0 1800 1460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A decision tree for choosing a List implementation. Start: must the collection be immutable after construction? If yes, use List.of or List.copyOf. If no, ask whether it is shared across threads. If shared and writes are rare compared to reads, use CopyOnWriteArrayList; if shared and writes are frequent, use Collections.synchronizedList wrapping an ArrayList. If not shared, ask whether the code inserts or removes at the front or middle in a hot loop; if yes, choose ArrayDeque when it is really a queue or deque, or LinkedList only when an iterator already holds the position; otherwise, the default is ArrayList, because array traversal is cache-linear and finding a middle position is O(n) even for LinkedList. Vector and Stack are shown separately as legacy, do-not-choose types, and Arrays.asList is shown as a fixed-size view, not a real List.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 13px; }
    .dense { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; }

    .boxD  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxL  { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxLeg{ fill: #f5f5f4; stroke: #78716c; stroke-width: 1.6; }
    .boxWk { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; }
    .boxAnn{ fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
    .bus   { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1500" fill="#ffffff"/>

  <text x="20" y="32" class="lbl h1">CHOOSING A List IMPLEMENTATION</text>
  <line x1="20" y1="42" x2="1780" y2="42" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="20" y="62" class="lbl sub">Root question: do you need a List at all, or just iteration order?</text>

  <!-- Gen0: Decision 1 -->
  <rect x="380" y="115" width="340" height="70" rx="6" class="boxD"/>
  <text x="550" y="154" text-anchor="middle" class="lbl body">Must it be immutable after construction?</text>

  <!-- Gen0 -> Gen1 -->
  <path class="bus" d="M 550 185 V 250"/>
  <path class="bus" d="M 210 250 H 885"/>
  <path class="flow" d="M 210 250 V 335"/>
  <path class="flow" d="M 885 250 V 348"/>
  <text x="185" y="272" text-anchor="end" class="lbl tiny">yes</text>
  <text x="910" y="272" class="lbl tiny">no</text>

  <!-- Gen1: LeafA + Decision2 -->
  <rect x="20" y="335" width="380" height="80" rx="6" class="boxL"/>
  <text x="210" y="365" text-anchor="middle" class="lbl node">List.of(...) / List.copyOf(...)</text>
  <text x="210" y="390" text-anchor="middle" class="lbl dense">immutable, null-hostile, most compact</text>

  <rect x="715" y="348" width="340" height="64" rx="6" class="boxD"/>
  <text x="885" y="384" text-anchor="middle" class="lbl body">Is it shared across threads?</text>

  <!-- Gen1 -> Gen2 -->
  <path class="bus" d="M 885 412 V 500"/>
  <path class="bus" d="M 435 500 H 1335"/>
  <path class="flow" d="M 435 500 V 578"/>
  <path class="flow" d="M 1335 500 V 573"/>
  <text x="410" y="522" text-anchor="end" class="lbl tiny">yes</text>
  <text x="1360" y="522" class="lbl tiny">no</text>

  <!-- Gen2: Decision2b + Decision3 -->
  <rect x="265" y="578" width="340" height="64" rx="6" class="boxD"/>
  <text x="435" y="614" text-anchor="middle" class="lbl body">Are writes rare compared to reads?</text>

  <rect x="1165" y="573" width="340" height="74" rx="6" class="boxD"/>
  <text x="1335" y="602" text-anchor="middle" class="lbl body">Do you insert or remove at the FRONT or</text>
  <text x="1335" y="622" text-anchor="middle" class="lbl body">MIDDLE in a hot loop?</text>

  <!-- Gen2 -> Gen3 -->
  <path class="bus" d="M 435 642 V 730"/>
  <path class="bus" d="M 210 730 H 660"/>
  <path class="flow" d="M 210 730 V 830"/>
  <path class="flow" d="M 660 730 V 805"/>
  <text x="185" y="752" text-anchor="end" class="lbl tiny">yes</text>
  <text x="685" y="752" class="lbl tiny">no</text>

  <path class="bus" d="M 1335 647 V 730"/>
  <path class="bus" d="M 1110 730 H 1560"/>
  <path class="flow" d="M 1110 730 V 800"/>
  <path class="flow" d="M 1560 730 V 830"/>
  <text x="1085" y="752" text-anchor="end" class="lbl tiny">yes</text>
  <text x="1585" y="752" class="lbl tiny">otherwise</text>

  <!-- Gen3 leaves -->
  <rect x="20" y="830" width="380" height="100" rx="6" class="boxL"/>
  <text x="210" y="860" text-anchor="middle" class="lbl node">CopyOnWriteArrayList</text>
  <text x="210" y="885" text-anchor="middle" class="lbl dense">snapshot iteration, no CME;</text>
  <text x="210" y="905" text-anchor="middle" class="lbl dense">every write copies the whole array</text>

  <rect x="470" y="805" width="380" height="150" rx="6" class="boxL"/>
  <text x="660" y="832" text-anchor="middle" class="lbl dense">Collections.synchronizedList(</text>
  <text x="660" y="853" text-anchor="middle" class="lbl dense">new ArrayList&lt;&gt;())</text>
  <text x="660" y="882" text-anchor="middle" class="lbl dense">one lock for all operations;</text>
  <text x="660" y="902" text-anchor="middle" class="lbl dense">iteration still needs external</text>
  <text x="660" y="922" text-anchor="middle" class="lbl dense">synchronization</text>

  <rect x="920" y="800" width="380" height="160" rx="6" class="boxL"/>
  <text x="940" y="826" class="lbl h2">HOT-LOOP FRONT/MIDDLE INSERT</text>
  <line x1="940" y1="836" x2="1260" y2="836" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="940" y="858" class="lbl dense">ArrayDeque (if it is really a queue/deque)</text>
  <text x="940" y="878" class="lbl dense">O(1) both ends, no node objects</text>
  <text x="940" y="908" class="lbl dense">LinkedList</text>
  <text x="940" y="928" class="lbl dense">O(1) structural change AT a held iterator only;</text>
  <text x="940" y="946" class="lbl dense">almost never the right answer</text>

  <rect x="1370" y="830" width="380" height="100" rx="6" class="boxL"/>
  <text x="1560" y="860" text-anchor="middle" class="lbl node">ArrayList</text>
  <text x="1560" y="885" text-anchor="middle" class="lbl dense">the default; cache-friendly, amortised</text>
  <text x="1560" y="905" text-anchor="middle" class="lbl dense">O(1) append, O(1) indexed get</text>

  <!-- Legacy — do not choose -->
  <rect x="150" y="1030" width="480" height="130" rx="6" class="boxLeg"/>
  <text x="170" y="1056" class="lbl h2">LEGACY — DO NOT CHOOSE</text>
  <line x1="170" y1="1066" x2="610" y2="1066" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="170" y="1088" class="lbl dense">Vector · synchronized on every method ·</text>
  <text x="170" y="1108" class="lbl dense">retained for compatibility</text>
  <text x="170" y="1136" class="lbl dense">Stack · extends Vector · use ArrayDeque</text>

  <!-- Weak — Arrays.asList -->
  <rect x="720" y="1035" width="420" height="120" rx="6" class="boxWk"/>
  <text x="740" y="1063" class="lbl node">Arrays.asList(a)</text>
  <text x="740" y="1086" class="lbl dense">FIXED-SIZE view over the array</text>
  <text x="740" y="1112" class="lbl dense">set() works, add()/remove() throw</text>
  <text x="740" y="1132" class="lbl dense">UnsupportedOperationException</text>

  <!-- Annotation panel -->
  <rect x="150" y="1230" width="1200" height="120" rx="6" class="boxAnn"/>
  <text x="170" y="1258" class="lbl h2">THE HONEST DEFAULT</text>
  <line x1="170" y1="1268" x2="1330" y2="1268" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="170" y="1292" class="lbl tiny">ArrayList wins almost always because array traversal is cache-linear.</text>
  <text x="170" y="1312" class="lbl tiny">LinkedList's O(1) insert requires you to ALREADY hold the position.</text>
  <text x="170" y="1332" class="lbl tiny">Finding that position is O(n), which is why it loses in practice.</text>

  <!-- Legend -->
  <line x1="20" y1="1380" x2="1780" y2="1380" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="1396" width="20" height="14" rx="3" class="boxD"/>
  <text x="48" y="1407" class="lbl tiny">decision question</text>
  <rect x="240" y="1396" width="20" height="14" rx="3" class="boxL"/>
  <text x="268" y="1407" class="lbl tiny">resolved — concrete type to choose</text>
  <rect x="560" y="1396" width="20" height="14" rx="3" class="boxLeg"/>
  <text x="588" y="1407" class="lbl tiny">legacy — retained for compatibility only</text>
  <rect x="900" y="1396" width="20" height="14" rx="3" class="boxWk"/>
  <text x="928" y="1407" class="lbl tiny">weak — not a real growable List</text>
  <rect x="1180" y="1396" width="20" height="14" rx="3" class="boxAnn"/>
  <text x="1208" y="1407" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 1440 1403 H 1480"/>
  <text x="1488" y="1407" class="lbl tiny">A → B : answer A leads to B</text>
</svg>
