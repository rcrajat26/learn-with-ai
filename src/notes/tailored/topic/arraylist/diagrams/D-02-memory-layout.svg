<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ArrayList memory layout on the heap for a Movement's List of LedgerEntry with four entries. Band one is the ArrayList shell object holding the elementData array reference, size 4, and modCount, totalling 24 bytes. Band two is the backing Object array elementData at capacity 10 with size 4: slots 0 to 3 hold references to LedgerEntry objects and slots 4 to 9 are null reserved capacity, totalling 56 bytes. Band three shows the four separate LedgerEntry objects on the heap that the array slots point to, one expanded to show its fields movementId, direction DEBIT, amount Money, and postedAt. The list owns the array but does not own the elements; the list itself costs 80 bytes excluding elements.">
  <style>
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .node  { font-size: 15px; font-weight: 600; }
    .body  { font-size: 12.5px; }
    .sub   { font-size: 10.5px; fill: #4b5563; }
    .tiny  { font-size: 11px; }
    .h1    { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .h2    { font-size: 12.5px; font-weight: 700; fill: #1f2937; }

    .boxP   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; }
    .boxR   { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
    .boxW   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .boxAnn { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }

    .flow  { fill: none; stroke: #475569; stroke-width: 2; stroke-linejoin: round; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>

  <text x="20" y="30" class="lbl h1">ArrayList MEMORY LAYOUT ON THE HEAP</text>
  <line x1="20" y1="44" x2="1180" y2="44" stroke="#d1d5db" stroke-width="1.5"/>

  <text x="60" y="64" class="lbl h2">BAND 1 — THE ArrayList SHELL</text>
  <text x="330" y="64" class="lbl h2">BAND 2 — THE Object[] elementData ARRAY</text>
  <text x="900" y="64" class="lbl h2">BAND 3 — LedgerEntry OBJECTS</text>

  <!-- band 1: shell -->
  <rect x="60" y="90" width="220" height="170" rx="6" class="boxP"/>
  <text x="170" y="112" text-anchor="middle" class="lbl node">ArrayList shell</text>
  <line x1="76" y1="122" x2="264" y2="122" stroke="#93c5fd" stroke-width="1"/>
  <text x="80" y="142" class="lbl tiny">elementData : Object[] ref</text>
  <text x="80" y="158" class="lbl sub">(4 B, compressed oop)</text>
  <text x="80" y="178" class="lbl tiny">size : int = 4  (4 B)</text>
  <text x="80" y="198" class="lbl tiny">modCount : int  (4 B)</text>
  <text x="80" y="214" class="lbl sub">inherited from AbstractList</text>
  <text x="80" y="236" class="lbl sub">header 12B + fields 12B</text>
  <text x="80" y="250" class="lbl sub">= 24 B shell total</text>

  <!-- arrow band1 -> band2 -->
  <path class="flow" d="M 280 142 H 330"/>

  <!-- band 2: array, single row of 10 slots -->
  <rect x="330" y="90" width="640" height="140" rx="6" class="boxAnn"/>
  <text x="350" y="112" class="lbl node">elementData</text>
  <text x="350" y="128" class="lbl sub">capacity 10, size 4 — header 12B + length 4B + 10×4B = 56B</text>

  <rect x="345" y="140" width="56" height="40" rx="4" class="boxR"/>
  <text x="373" y="164" text-anchor="middle" class="lbl body">[0]</text>
  <rect x="405" y="140" width="56" height="40" rx="4" class="boxR"/>
  <text x="433" y="164" text-anchor="middle" class="lbl body">[1]</text>
  <rect x="465" y="140" width="56" height="40" rx="4" class="boxR"/>
  <text x="493" y="164" text-anchor="middle" class="lbl body">[2]</text>
  <rect x="525" y="140" width="56" height="40" rx="4" class="boxR"/>
  <text x="553" y="164" text-anchor="middle" class="lbl body">[3]</text>
  <rect x="585" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="613" y="164" text-anchor="middle" class="lbl body">[4]</text>
  <rect x="645" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="673" y="164" text-anchor="middle" class="lbl body">[5]</text>
  <rect x="705" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="733" y="164" text-anchor="middle" class="lbl body">[6]</text>
  <rect x="765" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="793" y="164" text-anchor="middle" class="lbl body">[7]</text>
  <rect x="825" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="853" y="164" text-anchor="middle" class="lbl body">[8]</text>
  <rect x="885" y="140" width="56" height="40" rx="4" class="boxW"/>
  <text x="913" y="164" text-anchor="middle" class="lbl body">[9]</text>

  <text x="793" y="212" text-anchor="middle" class="lbl sub">null — reserved capacity (slots 4–9)</text>

  <!-- bus: reverse-order routing (leftmost slot -> bottommost target) avoids crossings -->
  <path class="flow" d="M 373 180 V 415 H 980"/>
  <path class="flow" d="M 433 180 V 380 H 980"/>
  <path class="flow" d="M 493 180 V 345 H 980"/>
  <path class="flow" d="M 553 180 V 300 H 980"/>

  <!-- band 3: 4 LedgerEntry objects -->
  <rect x="980" y="280" width="200" height="40" rx="6" class="boxP"/>
  <text x="1080" y="304" text-anchor="middle" class="lbl body">LedgerEntry</text>

  <rect x="980" y="335" width="200" height="20" rx="4" class="boxP"/>
  <text x="1080" y="349" text-anchor="middle" class="lbl tiny">LedgerEntry</text>

  <rect x="980" y="370" width="200" height="20" rx="4" class="boxP"/>
  <text x="1080" y="384" text-anchor="middle" class="lbl tiny">LedgerEntry</text>

  <rect x="980" y="405" width="200" height="20" rx="4" class="boxP"/>
  <text x="1080" y="419" text-anchor="middle" class="lbl tiny">LedgerEntry</text>

  <text x="1080" y="274" text-anchor="middle" class="lbl sub">expanded below ↓</text>

  <!-- expanded fields for the top LedgerEntry -->
  <path class="flow" d="M 1080 320 V 450"/>
  <rect x="980" y="450" width="200" height="100" rx="6" class="boxAnn"/>
  <text x="998" y="472" class="lbl tiny">movementId : String</text>
  <text x="998" y="490" class="lbl tiny">direction : Direction</text>
  <text x="998" y="506" class="lbl sub">= DEBIT</text>
  <text x="998" y="524" class="lbl tiny">amount : Money</text>
  <text x="998" y="540" class="lbl tiny">postedAt : Instant</text>

  <!-- annotation panel -->
  <rect x="60" y="290" width="220" height="180" rx="6" class="boxAnn"/>
  <text x="76" y="312" class="lbl h2">WHAT THE LIST DOES AND</text>
  <text x="76" y="328" class="lbl h2">DOES NOT OWN</text>
  <text x="76" y="352" class="lbl tiny">The list owns the array.</text>
  <text x="76" y="368" class="lbl tiny">It does NOT own the elements.</text>
  <text x="76" y="392" class="lbl tiny">Capacity 10, size 4 — six</text>
  <text x="76" y="408" class="lbl tiny">slots are paid for and empty.</text>
  <text x="76" y="432" class="lbl tiny">Total for the list itself:</text>
  <text x="76" y="448" class="lbl tiny">24 B + 56 B = 80 B,</text>
  <text x="76" y="464" class="lbl tiny">excluding elements.</text>

  <text x="60" y="595" class="lbl tiny" font-style="italic">QuizStakes: this is a Movement's List&lt;LedgerEntry&gt; entries — a Movement holds 2 to 4 entries.</text>

  <!-- legend -->
  <line x1="20" y1="608" x2="1180" y2="608" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="20" y="622" width="20" height="14" rx="3" class="boxP"/>
  <text x="48" y="633" class="lbl tiny">primary — shell / occupied ref / LedgerEntry</text>
  <rect x="344" y="622" width="20" height="14" rx="3" class="boxR"/>
  <text x="372" y="633" class="lbl tiny">resolved — occupied array slot</text>
  <rect x="578" y="622" width="20" height="14" rx="3" class="boxW"/>
  <text x="606" y="633" class="lbl tiny">weak — null / reserved slot</text>
  <rect x="787" y="622" width="20" height="14" rx="3" class="boxAnn"/>
  <text x="815" y="633" class="lbl tiny">annotation panel</text>
  <path class="flow" d="M 930 629 H 960"/>
  <text x="968" y="633" class="lbl tiny">A → B : A references B</text>
</svg>
